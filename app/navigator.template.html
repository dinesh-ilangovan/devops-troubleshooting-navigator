<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Miratech DevOps Runbook</title>
<style>
:root{
  --paper:#F4F6F8; --surface:#fff; --ink:#111A22; --muted:#5C6B7A;
  --rule:#DCE2E8; --soft:#EAEEF2; --nav:#111A22; --navink:#C9D5E0;
  --safe:#0E7A52; --state:#9C5A00; --danger:#BA2B24; --focus:#1F5FA8;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --mono:"Cascadia Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
  --side:292px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.5}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.shell{display:flex;min-height:100vh}

aside{width:var(--side);flex:0 0 var(--side);background:var(--nav);color:var(--navink);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #22303C;
  padding:18px 20px 14px;cursor:pointer;color:inherit}
.brand:hover{background:#18242E}
.crumb button{background:none;border:0;padding:0;color:var(--focus);cursor:pointer;font:inherit}
.crumb button:hover{text-decoration:underline}
.list{display:grid;gap:9px}
.lrow{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;
  text-align:left;cursor:pointer;width:100%}
.lrow:hover{border-color:var(--ink)}
.lrow h4{margin:0;font-size:15.5px;font-weight:640}
.lrow p{margin:3px 0 0;font-size:13.5px;color:var(--muted)}
.lrow .m{margin-top:7px;font-size:11.5px;color:var(--muted);display:flex;gap:14px}
.brand .org{font-size:10.5px;letter-spacing:.14em;color:#7E93A6;font-weight:600}
.brand h1{margin:3px 0 0;font-size:17px;font-weight:650;color:#fff;letter-spacing:-.01em}
.brand .by{font-size:11.5px;color:#7E93A6;margin-top:3px}
.sbox{padding:13px 16px;border-bottom:1px solid #22303C}
.sbox input{width:100%;background:#1B2833;border:1px solid #2C3B49;border-radius:6px;
  color:#fff;padding:8px 11px;font-size:14px}
.sbox input:focus{border-color:#4A7CB0;outline:none}
.sbox input::placeholder{color:#6B7F91}
nav{flex:1;overflow-y:auto;padding:8px 0 26px}
nav::-webkit-scrollbar{width:8px}
nav::-webkit-scrollbar-thumb{background:#2C3B49;border-radius:4px}
.tgroup{margin:2px 0}
.thead{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;
  padding:9px 18px;cursor:pointer;text-align:left;color:#E3EAF1;font-size:13.5px;font-weight:600}
.thead:hover{background:#1A2732}
.thead .car{font-family:var(--mono);font-size:10px;color:#6B7F91;width:9px}
.thead .ct{margin-left:auto;font-size:11px;color:#6B7F91;font-variant-numeric:tabular-nums}
.tbody{display:none}
.tgroup.open .tbody{display:block}
.tgroup.open .thead{color:#fff}
.chead{display:flex;align-items:center;gap:7px;width:100%;background:none;border:0;text-align:left;
  cursor:pointer;padding:7px 18px 7px 30px;font-size:11.5px;letter-spacing:.04em;color:#8FA3B5;font-weight:600}
.chead:hover{background:#18242E;color:#DCE6EF}
.chead .ct{margin-left:auto;font-size:10.5px;color:#5A6D7E}
.cbody{display:none}
.cgroup.open .cbody{display:block}
.cgroup.open .chead{color:#DCE6EF}
.item{display:block;width:100%;background:none;border:0;text-align:left;cursor:pointer;
  padding:6px 18px 6px 46px;color:#A8BBCB;font-size:13.5px;line-height:1.35;border-left:2px solid transparent}
.item:hover{background:#1A2732;color:#fff}
.item.sel{background:#1E2D3A;color:#fff;border-left-color:#5B93CE}
.nohit{padding:18px;color:#6B7F91;font-size:13px}

main{flex:1;min-width:0;display:flex;flex-direction:column}
.ctx{background:var(--surface);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:9}
.ctx .in{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:10px 34px;max-width:1080px}
.crumb{font-size:12.5px;color:var(--muted);margin-right:auto}
.crumb b{color:var(--ink);font-weight:600}
.ctx label{display:flex;align-items:baseline;gap:6px;font-size:12px;color:var(--muted)}
.ctx input{border:0;border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:12.5px;
  padding:2px 3px;width:16ch;background:transparent}
.ctx input:focus{border-bottom-color:var(--focus);outline:none}
.pane{flex:1;padding:30px 34px 80px;max-width:1080px}

.hero h2{margin:0 0 6px;font-size:27px;letter-spacing:-.02em;font-weight:650}
.hero p{margin:0 0 26px;color:var(--muted);max-width:64ch}
.stats{display:flex;gap:34px;flex-wrap:wrap;padding:20px 0;border-top:1px solid var(--rule);
  border-bottom:1px solid var(--rule);margin-bottom:28px}
.stat b{display:block;font-size:26px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:16px;
  text-align:left;cursor:pointer}
.card:hover{border-color:var(--ink)}
.card h3{margin:0;font-size:15.5px;font-weight:640}
.card p{margin:4px 0 0;font-size:13px;color:var(--muted)}

.rb h2{margin:0 0 6px;font-size:25px;letter-spacing:-.02em;font-weight:650;line-height:1.22}
.rb .sum{margin:0 0 12px;color:var(--muted);max-width:66ch;font-size:16px}
.src{font-size:12.5px;color:var(--muted);margin:0 0 28px}
.src a{color:var(--focus)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 22px}
.tag{font-size:11.5px;background:var(--soft);color:var(--muted);padding:3px 9px;border-radius:20px}

ol.steps{list-style:none;margin:0;padding:0}
.step{position:relative;padding:0 0 28px 42px}
.step::before{content:"";position:absolute;left:12px;top:26px;bottom:0;width:1px;background:var(--rule)}
.step:last-child::before{display:none}
.step.d::before{background:var(--danger);opacity:.3}
.num{position:absolute;left:0;top:0;width:25px;height:25px;border:1px solid var(--rule);
  background:var(--surface);border-radius:50%;font-family:var(--mono);font-size:12px;
  color:var(--muted);line-height:23px;text-align:center}
.step.d .num{border-color:var(--danger);color:var(--danger)}
.sh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:9px}
.st{font-weight:640;font-size:16.5px;letter-spacing:-.005em}
.chip{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:3px;letter-spacing:.03em}
.c-safe{color:var(--safe);background:rgba(14,122,82,.09)}
.c-state{color:var(--state);background:rgba(156,90,0,.10)}
.c-destructive{color:#fff;background:var(--danger)}
.cmd{position:relative;background:var(--ink);border-radius:7px;margin:0 0 11px}
.cmd pre{margin:0;padding:14px 88px 14px 15px;overflow-x:auto;font-family:var(--mono);
  font-size:13.5px;line-height:1.6;color:#E9EFF4;white-space:pre-wrap;word-break:break-word}
.fill{color:#8AD3AC;font-weight:600}
.un{color:#E4AC6E;border-bottom:1px dashed #8A6A48}
.cp{position:absolute;top:9px;right:9px;background:#2A3742;border:0;color:#C6D3DD;
  font-size:12px;padding:5px 11px;border-radius:5px;cursor:pointer}
.cp:hover{background:#3A4854;color:#fff}
.veil{padding:14px 15px;color:#E4AC6E;font-family:var(--mono);font-size:13px;cursor:pointer}
.veil:hover{color:#fff}
.look{font-size:15px;color:var(--muted);margin:0 0 9px;max-width:68ch}
.note{font-size:14.5px;border-left:3px solid var(--danger);padding:8px 0 8px 13px;
  margin:0 0 11px;max-width:66ch;background:linear-gradient(90deg,rgba(186,43,36,.045),transparent)}
.note.s{border-left-color:var(--state);background:linear-gradient(90deg,rgba(156,90,0,.05),transparent)}

.br{margin:13px 0 0;background:var(--surface);border:1px solid var(--rule);border-radius:7px;overflow:hidden}
.brh{font-size:10.5px;font-weight:700;letter-spacing:.07em;color:var(--muted);
  padding:9px 15px;background:var(--soft);border-bottom:1px solid var(--rule)}
.brow{padding:11px 15px;border-bottom:1px solid var(--soft);font-size:14.5px}
.brow:last-child{border-bottom:0}
.bif code{font-family:var(--mono);font-size:12.5px;background:var(--soft);padding:2px 7px;border-radius:4px}
.bif b{font-weight:650;color:var(--muted);font-size:12px;letter-spacing:.03em;margin-right:5px}
.bthen{color:var(--muted);margin-top:4px;max-width:68ch}
.goto{color:var(--focus);font-weight:600;white-space:nowrap}

.sec{margin-top:38px;padding-top:22px;border-top:1px solid var(--rule)}
.sec h3{font-size:11.5px;font-weight:700;letter-spacing:.07em;margin:0 0 15px;color:var(--muted)}
.cz{background:var(--surface);border:1px solid var(--rule);border-radius:7px;padding:14px 16px;
  margin-bottom:9px;display:flex;gap:13px}
.rk{font-family:var(--mono);font-size:12px;color:#fff;background:var(--muted);border-radius:50%;
  width:21px;height:21px;line-height:21px;text-align:center;flex:0 0 21px;margin-top:2px}
.cz .w{font-weight:640;font-size:15.5px}
.cz .fx{color:var(--muted);font-size:14.5px;margin-top:4px;max-width:68ch}
.cz .fx b{color:var(--ink);font-weight:640}
ul.pl{margin:0;padding-left:20px;color:var(--muted);font-size:15px;max-width:68ch}
ul.pl li{margin-bottom:6px}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);
  color:#fff;padding:10px 20px;border-radius:6px;font-size:13.5px;z-index:40;display:none}
.burger{display:none}

@media(max-width:900px){
  aside{position:fixed;left:0;top:0;z-index:30;transform:translateX(-100%);transition:transform .18s}
  body.nav aside{transform:none}
  .burger{display:inline-flex;background:none;border:1px solid var(--rule);border-radius:6px;
    padding:5px 11px;cursor:pointer;font-size:15px;margin-right:12px}
  .ctx .in,.pane{padding-left:16px;padding-right:16px}
  .step{padding-left:33px}.num{width:22px;height:22px;line-height:20px}
  .step::before{left:11px}
  .cmd pre{padding:40px 15px 14px}.cp{top:8px;right:auto;left:9px}
  .rb h2{font-size:21px}.hero h2{font-size:22px}
}
</style>
</head>
<body>
<div class="shell">

<aside>
  <button class="brand" id="brandbtn">
    <div class="org">MIRATECH &middot; INTERNAL</div>
    <h1>DevOps Runbook</h1>
    <div class="by">Designed &amp; built by Dinesh Ilangovan</div>
  </button>
  <div class="sbox"><input id="q" placeholder="Search symptom or error…" autocomplete="off"></div>
  <nav id="nav"></nav>
</aside>

<main>
  <div class="ctx"><div class="in">
    <button class="burger" id="burger">&#9776;</button>
    <span class="crumb" id="crumb"></span>
    <span id="fields"></span>
  </div></div>
  <div class="pane" id="pane"></div>
</main>

</div>
<div class="toast" id="toast"></div>

<script id="data" type="application/json">__DATA__</script>
<script>
"use strict";
const BANK=JSON.parse(document.getElementById("data").textContent);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plain=p=>String(p||"").replace(/^\(\?[imsx]+\)/,"").replace(/\\[sdwSDW]\+?/g," ")
  .replace(/[\^$]/g,"").replace(/\\/g,"").replace(/\.\*|\.\+|\?/g,"")
  .replace(/\(([^)]*)\)/g,"$1").replace(/\[[^\]]*\]/g,"").replace(/\{\d+,?\d*\}/g,"")
  .replace(/\|/g,"  /  ").replace(/\s{2,}/g,"  ").trim();

const CTX={}; let CUR=null, VIEW={k:"home"};
const RISK={safe:["READ ONLY","c-safe"],state:["CHANGES STATE","c-state"],destructive:["DESTRUCTIVE","c-destructive"]};
const TECHS=[...new Set(BANK.map(r=>r.technology))].sort();
const catsOf=t=>[...new Set(BANK.filter(r=>r.technology===t).map(r=>r.category||"General"))].sort();
const inCat=(t,c)=>BANK.filter(r=>r.technology===t&&(r.category||"General")===c);

const flat=s=>String(s??"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
function score(r,q){if(!q.trim())return 1;const Q=flat(q),T=flat(r.title),A=(r.aliases||[]).map(flat);
  let s=0; if(T.includes(Q))s+=100; if(A.some(a=>a.includes(Q)||Q.includes(a)))s+=80;
  const hay=[T,flat(r.summary),A.join(" "),flat(r.category)].join(" ");
  for(const x of Q.split(" ").filter(y=>y.length>1)){
    if(T.includes(x))s+=18; else if(A.some(a=>a.includes(x)))s+=14; else if(hay.includes(x))s+=4;}
  return s;}
const results=q=>BANK.map(r=>({r,s:score(r,q)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.r);

/* ---------------- sidebar ---------------- */
function tree(){
  const q=$("#q").value, hits=results(q), searching=q.trim().length>0;
  if(!hits.length){$("#nav").innerHTML='<div class="nohit">Nothing matched. Try the exact error text.</div>';return;}
  const byT={};
  hits.forEach(r=>{const c=r.category||"General";
    (byT[r.technology]=byT[r.technology]||{}); (byT[r.technology][c]=byT[r.technology][c]||[]).push(r);});
  $("#nav").innerHTML=Object.keys(byT).sort().map(t=>{
    const n=Object.values(byT[t]).reduce((a,b)=>a+b.length,0);
    const to=searching||VIEW.t===t;
    return '<div class="tgroup'+(to?" open":"")+'" data-t="'+esc(t)+'">'+
      '<button class="thead"><span class="car">'+(to?"\u25BE":"\u25B8")+'</span>'+esc(t)+
      '<span class="ct">'+n+'</span></button><div class="tbody">'+
      Object.keys(byT[t]).sort().map(c=>{
        const co=searching||(VIEW.t===t&&VIEW.c===c);
        return '<div class="cgroup'+(co?" open":"")+'" data-t="'+esc(t)+'" data-c="'+esc(c)+'">'+
          '<button class="chead"><span class="car">'+(co?"\u25BE":"\u25B8")+'</span>'+esc(c)+
          '<span class="ct">'+byT[t][c].length+'</span></button><div class="cbody">'+
          byT[t][c].map(r=>'<button class="item'+(CUR&&CUR.id===r.id?" sel":"")+'" data-id="'+
            esc(r.id)+'">'+esc(r.title)+'</button>').join("")+'</div></div>';}).join("")+
      '</div></div>';}).join("");
  document.querySelectorAll(".thead").forEach(b=>b.onclick=()=>showTech(b.closest(".tgroup").dataset.t));
  document.querySelectorAll(".chead").forEach(b=>b.onclick=e=>{e.stopPropagation();
    const g=b.closest(".cgroup"); showCat(g.dataset.t,g.dataset.c);});
  document.querySelectorAll(".item").forEach(b=>b.onclick=()=>openRb(b.dataset.id));
}

/* ---------------- shared bits ---------------- */
function crumb(parts){
  $("#crumb").innerHTML=parts.map((p,i)=>i===parts.length-1
    ? '<b>'+esc(p.t)+'</b>'
    : '<button data-nav="'+esc(p.go)+'">'+esc(p.t)+'</button>').join(' &nbsp;\u203A&nbsp; ');
  document.querySelectorAll("#crumb button").forEach(b=>b.onclick=()=>{
    const g=b.dataset.nav;
    if(g==="home")home(); else if(g.indexOf("t:")===0)showTech(g.slice(2));
    else{const x=g.slice(2).split("\u0001");showCat(x[0],x[1]);}});
}
const card=r=>'<button class="lrow" data-id="'+esc(r.id)+'"><h4>'+esc(r.title)+'</h4>'+
  '<p>'+esc(r.summary)+'</p><span class="m"><span>'+r.steps.length+' steps</span><span>'+
  r.steps.reduce((a,s)=>a+(s.signals||[]).length,0)+' branches</span><span>'+
  r.causes.length+' causes</span></span></button>';
function wireRows(){document.querySelectorAll(".lrow").forEach(b=>b.onclick=()=>openRb(b.dataset.id));}

/* ---------------- views ---------------- */
function home(){
  CUR=null; VIEW={k:"home"}; $("#fields").innerHTML=""; $("#crumb").innerHTML="";
  const st=BANK.reduce((a,r)=>a+r.steps.length,0);
  const br=BANK.reduce((a,r)=>a+r.steps.reduce((b,s)=>b+(s.signals||[]).length,0),0);
  const cz=BANK.reduce((a,r)=>a+r.causes.length,0);
  $("#pane").innerHTML='<div class="hero"><h2>What is broken?</h2>'+
    '<p>Search the symptom, the error string, or what you were doing when it failed. Every runbook gives '+
    'the checks in order, what each output means, and where to go next.</p><div class="stats">'+
    '<div class="stat"><b>'+BANK.length+'</b><span>runbooks</span></div>'+
    '<div class="stat"><b>'+st+'</b><span>diagnostic steps</span></div>'+
    '<div class="stat"><b>'+br+'</b><span>decision branches</span></div>'+
    '<div class="stat"><b>'+cz+'</b><span>ranked causes</span></div>'+
    '<div class="stat"><b>'+TECHS.length+'</b><span>technologies</span></div></div><div class="cards">'+
    TECHS.map(t=>'<button class="card" data-tech="'+esc(t)+'"><h3>'+esc(t)+'</h3><p>'+
      BANK.filter(r=>r.technology===t).length+' runbooks across '+catsOf(t).length+
      ' sections</p></button>').join("")+'</div>'+
    '<p class="src" style="margin-top:30px">Runs entirely in this one file. Nothing is sent anywhere, '+
    'nothing is executed for you, and nothing is saved when you close the tab.</p></div>';
  document.querySelectorAll(".card").forEach(b=>b.onclick=()=>showTech(b.dataset.tech));
  window.scrollTo(0,0); tree();
}

function showTech(t){
  CUR=null; VIEW={k:"tech",t:t}; $("#fields").innerHTML="";
  crumb([{t:"All technologies",go:"home"},{t:t}]);
  const cs=catsOf(t);
  $("#pane").innerHTML='<div class="hero"><h2>'+esc(t)+'</h2><p>'+
    BANK.filter(r=>r.technology===t).length+' runbooks across '+cs.length+
    ' sections. Pick a section, or search above.</p><div class="cards">'+
    cs.map(c=>'<button class="card" data-c="'+esc(c)+'"><h3>'+esc(c)+'</h3><p>'+
      inCat(t,c).length+' runbooks</p></button>').join("")+'</div></div>';
  document.querySelectorAll(".card").forEach(b=>b.onclick=()=>showCat(t,b.dataset.c));
  window.scrollTo(0,0); tree();
}

function showCat(t,c){
  CUR=null; VIEW={k:"cat",t:t,c:c}; $("#fields").innerHTML="";
  crumb([{t:"All technologies",go:"home"},{t:t,go:"t:"+t},{t:c}]);
  $("#pane").innerHTML='<div class="hero"><h2>'+esc(c)+'</h2><p>'+esc(t)+' \u00B7 '+
    inCat(t,c).length+' runbooks</p></div><div class="list">'+inCat(t,c).map(card).join("")+'</div>';
  wireRows(); window.scrollTo(0,0); tree();
}

function showSearch(q){
  CUR=null; VIEW={k:"search"}; $("#fields").innerHTML="";
  const hits=results(q);
  crumb([{t:"All technologies",go:"home"},{t:'Search: "'+q+'"'}]);
  $("#pane").innerHTML='<div class="hero"><h2>'+hits.length+' result'+(hits.length===1?"":"s")+
    '</h2><p>Matching &ldquo;'+esc(q)+'&rdquo; across '+TECHS.length+' technologies.</p></div>'+
    (hits.length?'<div class="list">'+hits.slice(0,80).map(card).join("")+'</div>'
      :'<p class="src">Nothing matched. Try the exact error string from your terminal, or a plainer phrase.</p>');
  wireRows(); window.scrollTo(0,0); tree();
}

/* ---------------- runbook ---------------- */
function fill(cmd,html){return cmd.replace(/\{([a-z0-9_]+)\}/g,(m,k)=>{const v=CTX[k];
  return !html?(v||m):(v?'<span class="fill">'+esc(v)+'</span>':'<span class="un">'+esc(m)+'</span>');});}
function repaint(){document.querySelectorAll("[data-cmd]").forEach(e=>e.innerHTML=fill(e.dataset.cmd,true));}

function openRb(id){
  CUR=BANK.find(r=>r.id===id); if(!CUR)return;
  VIEW={k:"rb",t:CUR.technology,c:CUR.category||"General"};
  (CUR.inputs||[]).forEach(i=>{if(!(i.key in CTX))CTX[i.key]="";});
  $("#fields").innerHTML=(CUR.inputs||[]).map(i=>'<label>'+esc(i.label)+
    '<input data-k="'+esc(i.key)+'" placeholder="'+esc(i.example||"")+'" value="'+esc(CTX[i.key]||"")+'"></label>').join("");
  document.querySelectorAll("#fields input").forEach(x=>x.oninput=()=>{CTX[x.dataset.k]=x.value.trim();repaint();});
  crumb([{t:"All technologies",go:"home"},{t:CUR.technology,go:"t:"+CUR.technology},
         {t:VIEW.c,go:"c:"+CUR.technology+"\u0001"+VIEW.c},{t:CUR.title}]);

  const steps=(CUR.steps||[]).map((s,i)=>{
    const Rk=RISK[s.risk]||RISK.safe, dz=s.risk==="destructive";
    const body=dz?'<div class="veil" data-rv="'+i+'">\u25B8 Command hidden. Read the warning, then tap to reveal.</div>'
      :'<pre data-cmd="'+esc(s.cmd)+'"></pre><button class="cp" data-cp="'+i+'">Copy</button>';
    const br=(s.signals||[]).length?'<div class="br"><div class="brh">WHAT YOU MIGHT SEE</div>'+
      s.signals.map(g=>{const gt=g.goto||"";let nx="";
        if(gt.indexOf("cause:")===0){const k=(CUR.causes||[]).findIndex(x=>x.id===gt.slice(6));
          if(k>=0)nx='<span class="goto">\u2192 cause '+(k+1)+'</span>';}
        else if(gt.indexOf("step:")===0)nx='<span class="goto">\u2192 step '+gt.slice(5)+'</span>';
        return '<div class="brow"><div class="bif"><b>IF YOU SEE</b><code>'+esc(plain(g.match))+
          '</code></div><div class="bthen">'+esc(g.means)+' '+nx+'</div></div>';}).join("")+'</div>':"";
    return '<li class="step'+(dz?" d":"")+'"><div class="num">'+(i+1)+'</div><div class="sh">'+
      '<span class="st">'+esc(s.title)+'</span><span class="chip '+Rk[1]+'">'+Rk[0]+'</span></div>'+
      (s.note?'<p class="note'+(s.risk==="state"?" s":"")+'">'+esc(s.note)+'</p>':"")+
      '<div class="cmd">'+body+'</div><p class="look">'+esc(s.look)+'</p>'+br+'</li>';}).join("");
  const cz=(CUR.causes||[]).map((c,i)=>'<div class="cz"><div class="rk">'+(i+1)+'</div><div>'+
    '<div class="w">'+esc(c.cause)+'</div><div class="fx"><b>Fix.</b> '+esc(c.fix)+'</div></div></div>').join("");

  $("#pane").innerHTML='<div class="rb"><h2>'+esc(CUR.title)+'</h2><p class="sum">'+esc(CUR.summary)+'</p>'+
    '<div class="tags">'+(CUR.aliases||[]).slice(0,7).map(a=>'<span class="tag">'+esc(a)+'</span>').join("")+'</div>'+
    '<p class="src">Commands vary by version and environment \u2014 read each one before you run it.'+
    (CUR.source?' <a href="'+esc(CUR.source)+'" target="_blank" rel="noopener">Official documentation \u2197</a>':"")+'</p>'+
    '<ol class="steps">'+steps+'</ol>'+
    (cz?'<div class="sec"><h3>LIKELY CAUSES \u2014 MOST COMMON FIRST</h3>'+cz+'</div>':"")+
    ((CUR.verify||[]).length?'<div class="sec"><h3>YOU ARE DONE WHEN</h3><ul class="pl">'+
      CUR.verify.map(v=>'<li>'+esc(fill(v,false))+'</li>').join("")+'</ul></div>':"")+
    ((CUR.escalate||[]).length?'<div class="sec"><h3>IF YOU HAND THIS OVER, INCLUDE</h3><ul class="pl">'+
      CUR.escalate.map(v=>'<li>'+esc(fill(v,false))+'</li>').join("")+'</ul></div>':"")+'</div>';
  window.scrollTo(0,0); repaint();
  document.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>{
    const x=fill(CUR.steps[+b.dataset.cp].cmd,false);
    navigator.clipboard.writeText(x).then(()=>{const e=$("#toast");e.textContent="Command copied";
      e.style.display="block";setTimeout(()=>e.style.display="none",1500);},()=>prompt("Copy:",x));});
  document.querySelectorAll("[data-rv]").forEach(v=>v.onclick=()=>{
    const i=+v.dataset.rv,s=CUR.steps[i];
    v.outerHTML='<pre data-cmd="'+esc(s.cmd)+'"></pre><button class="cp" data-cp="'+i+'">Copy</button>';
    repaint();openRbRewire();});
  tree(); document.body.classList.remove("nav");
}
function openRbRewire(){document.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>{
  const x=fill(CUR.steps[+b.dataset.cp].cmd,false);
  navigator.clipboard.writeText(x).then(()=>{const e=$("#toast");e.textContent="Command copied";
    e.style.display="block";setTimeout(()=>e.style.display="none",1500);},()=>prompt("Copy:",x));});}

/* ---------------- wiring ---------------- */
let tmr=null;
$("#q").oninput=()=>{clearTimeout(tmr);tmr=setTimeout(()=>{
  const q=$("#q").value; if(q.trim())showSearch(q); else home();},180);};
$("#brandbtn").onclick=()=>{$("#q").value="";home();};
$("#burger").onclick=()=>document.body.classList.toggle("nav");
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&document.activeElement!==$("#q")){e.preventDefault();$("#q").focus();$("#q").select();}
  if(e.key==="Escape"){
    if(VIEW.k==="rb")showCat(VIEW.t,VIEW.c);
    else if(VIEW.k==="cat")showTech(VIEW.t);
    else{$("#q").value="";home();}}});
home();
</script>
</body>
</html>
