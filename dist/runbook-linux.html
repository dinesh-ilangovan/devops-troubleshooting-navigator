<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Runbook</title>
<style>
:root{
  --paper:#EEF1F4; --surface:#fff; --ink:#141C24; --muted:#5A6976;
  --rule:#D5DCE3; --rule-soft:#E4E9ED;
  --safe:#0F7B54; --state:#A15C00; --destructive:#BC2C24;
  --focus:#1F5FA8;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --mono:"Cascadia Mono",ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.5;font-feature-settings:"tnum" 1}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:940px;margin:0 auto;padding:0 20px}

/* ---- context strip ---- */
.ctx{background:var(--ink);color:#DCE3EA;position:sticky;top:0;z-index:20}
.ctx .wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding-top:9px;padding-bottom:9px}
.ctx .brand{font-weight:650;letter-spacing:-.01em;color:#fff;margin-right:auto;font-size:15px}
.ctx .by{font-weight:400;color:#8095A8;font-size:12.5px;margin-left:7px}
@media(max-width:640px){.ctx .by{display:none}}
.ctx label{display:flex;align-items:baseline;gap:6px;font-size:12.5px;color:#9FB0BF}
.ctx input{background:transparent;border:0;border-bottom:1px solid #3C4A57;color:#fff;
  font-family:var(--mono);font-size:13px;padding:1px 2px;width:15ch;min-width:0}
.ctx input:focus{border-bottom-color:#7FA8D4;outline:none}
.ctx input::placeholder{color:#5A6976}

/* ---- search ---- */
.search{padding:44px 0 26px}
h1{font-size:28px;line-height:1.2;letter-spacing:-.02em;margin:0 0 6px;font-weight:640}
.lede{color:var(--muted);margin:0 0 22px;max-width:62ch}
#q{width:100%;padding:14px 16px;border:1px solid var(--rule);border-radius:6px;
  background:var(--surface);font-size:17px}
#q:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px rgba(31,95,168,.12)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
.chips.sub{margin-top:8px}
.tab{background:var(--surface);border:1px solid var(--rule);border-radius:20px;padding:6px 14px;
  font-size:13.5px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tab:hover{border-color:var(--ink)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab .n{font-size:11.5px;opacity:.6;font-variant-numeric:tabular-nums}
.chips.sub .tab{padding:4px 11px;font-size:12.5px;border-radius:4px;color:var(--muted)}
.chips.sub .tab.on{color:#fff}
.hint{margin-top:13px;font-size:12.5px;color:var(--muted)}
kbd{font-family:var(--mono);font-size:11.5px;border:1px solid var(--rule);border-bottom-width:2px;
  border-radius:3px;padding:1px 5px;background:var(--surface)}

/* ---- results ---- */
.results{list-style:none;margin:0;padding:0 0 56px}
.results li{border-top:1px solid var(--rule-soft)}
.results li:last-child{border-bottom:1px solid var(--rule-soft)}
.hit{display:block;width:100%;text-align:left;background:none;border:0;padding:15px 14px;cursor:pointer}
.hit:hover,.hit.cur{background:var(--surface)}
.hit h3{margin:0;font-size:16.5px;font-weight:600;letter-spacing:-.005em}
.hit p{margin:3px 0 0;color:var(--muted);font-size:14px}
.meta{margin-top:7px;font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.empty{padding:40px 14px;color:var(--muted);border-top:1px solid var(--rule-soft)}

/* ---- trust badge ---- */
.trust{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600}
.trust::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-verified{color:var(--safe)} .t-documented{color:var(--state)} .t-reference{color:var(--muted)}

/* ---- runbook ---- */
.rb{padding:26px 0 90px;display:none}
.back{background:none;border:0;padding:0;color:var(--muted);font-size:13.5px;cursor:pointer;margin-bottom:18px}
.back:hover{color:var(--ink)}
.rb h2{font-size:25px;line-height:1.2;letter-spacing:-.02em;margin:0 0 6px;font-weight:640}
.rb .sum{color:var(--muted);margin:0 0 14px;max-width:64ch}
.prov{font-size:12.5px;color:var(--muted);border-left:2px solid var(--rule);padding:2px 0 2px 11px;margin-bottom:26px}
.prov code{font-family:var(--mono);font-size:12px}
.prov a{color:var(--focus)}

/* ---- the rail ---- */
ol.steps{list-style:none;margin:0;padding:0}
.step{position:relative;padding:0 0 26px 40px}
.step::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:1px;background:var(--rule)}
.step:last-child::before{display:none}
.step.danger::before{background:var(--destructive);opacity:.35}
.mark{position:absolute;left:0;top:2px;width:23px;height:23px;border:1px solid var(--rule);
  background:var(--surface);border-radius:3px;cursor:pointer;padding:0;
  font-family:var(--mono);font-size:12px;color:var(--muted);line-height:21px;text-align:center}
.mark:hover{border-color:var(--ink)}
.step.done .mark{background:var(--ink);border-color:var(--ink);color:#fff}
.step.done .stitle{color:var(--muted)}
.step.danger .mark{border-color:var(--destructive);color:var(--destructive)}

.shead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:9px}
.stitle{font-weight:600;font-size:16px;letter-spacing:-.005em}
.chip{font-size:11px;font-weight:650;padding:2px 7px;border-radius:3px;white-space:nowrap}
.c-safe{color:var(--safe);background:rgba(15,123,84,.09)}
.c-state{color:var(--state);background:rgba(161,92,0,.10)}
.c-destructive{color:#fff;background:var(--destructive)}

.cmd{position:relative;background:var(--ink);border-radius:5px;margin:0 0 10px}
.cmd pre{margin:0;padding:13px 84px 13px 14px;overflow-x:auto;font-family:var(--mono);
  font-size:13.5px;line-height:1.55;color:#E8EEF3;white-space:pre-wrap;word-break:break-word}
.cmd .fill{color:#8FD0A8;font-weight:600}
.cmd .unfilled{color:#E0A86A;border-bottom:1px dashed #8A6A48}
.copy{position:absolute;top:8px;right:8px;background:#2A3640;border:0;color:#C6D3DD;
  font-size:12px;padding:5px 10px;border-radius:4px;cursor:pointer}
.copy:hover{background:#3A4854;color:#fff}
.veil{padding:13px 14px;color:#E0A86A;font-family:var(--mono);font-size:13px;cursor:pointer;
  display:flex;align-items:center;gap:9px}
.veil:hover{color:#fff}

.look{font-size:14.5px;color:var(--muted);margin:0 0 8px;max-width:66ch}
.look b{color:var(--ink);font-weight:600}
.note{font-size:14px;border-left:2px solid var(--destructive);padding:6px 0 6px 11px;
  margin:0 0 10px;max-width:64ch;color:var(--ink)}
.note-state{border-left-color:var(--state)}

/* ---- output matcher ---- */
.match{margin-top:10px}
.match summary{font-size:13.5px;color:var(--focus);cursor:pointer;list-style:none}
.match summary::-webkit-details-marker{display:none}
.match summary::before{content:"+ ";font-family:var(--mono)}
.match[open] summary::before{content:"- "}
.match textarea{width:100%;margin-top:9px;min-height:78px;padding:10px 12px;border:1px solid var(--rule);
  border-radius:5px;font-family:var(--mono);font-size:12.5px;background:var(--surface);resize:vertical}
.verdict{margin-top:9px;padding:11px 13px;border-radius:5px;font-size:14.5px;background:var(--surface);
  border:1px solid var(--rule)}
.verdict.hit{border-color:var(--safe);border-left:3px solid var(--safe)}
.verdict.miss{color:var(--muted)}
.verdict b{display:block;margin-bottom:3px}
.jump{background:none;border:0;color:var(--focus);padding:0;margin-top:6px;cursor:pointer;font-size:13.5px}

/* ---- causes ---- */
.sec{margin-top:34px;padding-top:20px;border-top:1px solid var(--rule)}
.sec h3{font-size:13px;font-weight:650;margin:0 0 14px;color:var(--muted);letter-spacing:.01em}
.cause{padding:13px 15px;background:var(--surface);border:1px solid var(--rule-soft);border-radius:5px;margin-bottom:9px}
.cause.lit{border-color:var(--safe);border-left:3px solid var(--safe)}
.cause .rank{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-right:7px}
.cause .what{font-weight:600;font-size:15px}
.cause .fix{color:var(--muted);font-size:14.5px;margin-top:4px;max-width:66ch}
.cause .fix b{color:var(--ink);font-weight:600}
ul.plain{margin:0;padding-left:19px;color:var(--muted);font-size:14.5px;max-width:66ch}
ul.plain li{margin-bottom:5px}

/* ---- action bar ---- */
.bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--rule);
  padding:11px 0;display:none;z-index:15}
.bar .wrap{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.bar .prog{font-size:13px;color:var(--muted);margin-right:auto;font-variant-numeric:tabular-nums}
.act{background:var(--surface);border:1px solid var(--rule);border-radius:5px;padding:7px 13px;
  font-size:13.5px;cursor:pointer}
.act:hover{border-color:var(--ink)}
.act.key{background:var(--ink);color:#fff;border-color:var(--ink)}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:9px 17px;border-radius:5px;font-size:13.5px;z-index:30;display:none}

footer{color:var(--muted);font-size:12.5px;padding:0 0 30px;max-width:70ch;white-space:pre-line}

@media(max-width:640px){
  .wrap{padding:0 15px}
  .search{padding:26px 0 18px} h1{font-size:23px} .rb h2{font-size:21px}
  .ctx .wrap{gap:11px} .ctx input{width:11ch}
  .step{padding-left:33px} .mark{width:21px;height:21px;line-height:19px}
  .step::before{left:10px}
  .cmd pre{padding-right:14px;padding-top:38px}
  .copy{top:6px;right:auto;left:8px}
}
</style>
</head>
<body>

<div class="ctx"><div class="wrap">
  <span class="brand">DevOps Runbook <span class="by">by Dinesh Ilangovan</span></span>
  <span id="ctxfields"></span>
</div></div>

<main class="wrap">

<section class="search" id="searchview">
  <h1>What is broken?</h1>
  <p class="lede">Type the symptom, the error string, or what you were doing when it failed.</p>
  <input id="q" placeholder="CrashLoopBackOff, pod pending, committed to main, force push..." autocomplete="off" autofocus>
  <div class="chips" id="techchips"></div>
  <div class="chips sub" id="catchips"></div>
  <p class="hint"><kbd>/</kbd> search &nbsp; <kbd>↑</kbd><kbd>↓</kbd> move &nbsp; <kbd>Enter</kbd> open &nbsp; <kbd>Esc</kbd> back</p>
</section>

<ul class="results" id="results"></ul>

<section class="rb" id="rbview"></section>

<footer id="foot"></footer>
</main>

<div class="bar" id="bar"><div class="wrap">
  <span class="prog" id="prog"></span>
  <button class="act" id="a-safe">Copy read-only steps</button>
  <button class="act" id="a-esc">Copy handoff notes</button>
  <button class="act key" id="a-log">Copy incident log</button>
</div></div>
<div class="toast" id="toast"></div>

<script id="data" type="application/json">[{"id":"linux-disk-full","tier":"documented","technology":"Linux","category":"Storage","title":"Filesystem is full","summary":"Writes fail with no space left. Find what is consuming it before deleting anything.","aliases":["no space left","disk full","filesystem full","cannot write","df full","100% used"],"source":"https://man7.org/linux/man-pages/man1/du.1.html","inputs":[{"key":"path","label":"Filesystem or path","example":"/"}],"steps":[{"title":"See which filesystem is actually full","cmd":"df -h","risk":"safe","look":"The Use% column, and note the mount point. A full /var is a very different problem from a full /home.","signals":[{"match":"100%","means":"That filesystem is completely full.","goto":"step:2"},{"match":"(?i)/dev/loop|overlay","means":"Container or snap storage, not the host's own data.","goto":"cause:container-storage"}]},{"title":"Check inodes, because df can lie","cmd":"df -i","risk":"safe","look":"Space free but IUse% at 100 means inode exhaustion. The error is identical but the fix is completely different."},{"title":"Find the largest directories","cmd":"du -xh {path} --max-depth=2 2>/dev/null | sort -rh | head -20","risk":"safe","look":"The -x keeps it on one filesystem so you are not misled by other mounts. Work downward from the largest entry."},{"title":"Find space held by deleted but still-open files","cmd":"lsof +L1 2>/dev/null | head -20","risk":"safe","look":"A deleted file held open by a running process still occupies disk. This explains the case where du shows far less than df.","signals":[{"match":"(?i)deleted","means":"Space is held by a deleted file still open. Restarting that process releases it.","goto":"cause:deleted-open"}]}],"causes":[{"id":"logs","cause":"Log files grew without rotation.","fix":"Truncate with : > file rather than deleting, so the open handle stays valid. Then fix logrotate.","confirm":""},{"id":"deleted-open","cause":"A process holds a deleted file open.","fix":"Restart that process. No amount of deleting will reclaim the space otherwise.","confirm":""},{"id":"inodes","cause":"Inodes exhausted by many small files.","fix":"Find the directory with the most entries and clear it. Often a session or cache directory.","confirm":""},{"id":"container-storage","cause":"Container images and layers.","fix":"Prune the container runtime's storage, with a time filter rather than wholesale.","confirm":""}],"verify":["df shows meaningful free space.","The write that was failing now succeeds.","Rotation or cleanup is configured so it does not recur."],"escalate":["df -h and df -i output","The top entries from du","Whether any deleted files are still held open"]},{"id":"linux-port-in-use","tier":"documented","technology":"Linux","category":"Networking","title":"Address already in use","summary":"A service will not start because something already holds its port.","aliases":["address already in use","port in use","bind failed","cannot bind","eaddrinuse","port already bound"],"source":"https://man7.org/linux/man-pages/man8/ss.8.html","inputs":[{"key":"port","label":"Port","example":"8080"}],"steps":[{"title":"Find what is listening","cmd":"sudo ss -tlnp 'sport = :{port}'","risk":"safe","look":"The process name and PID in the last column. Without sudo you will not see the owner for another user's process.","signals":[{"match":"users:\\(\\(","means":"A process holds it. The name and PID are in the parentheses.","goto":"cause:other-process"},{"match":"^\\s*$","means":"Nothing is listening, so the failure is something else.","goto":"step:3"}]},{"title":"Check whether it is bound on a different interface","cmd":"sudo ss -tlnp | grep :{port}","risk":"safe","look":"0.0.0.0 versus 127.0.0.1 versus a specific IP. Two processes can bind the same port on different addresses, which looks contradictory until you see this."},{"title":"Check for a socket stuck in TIME_WAIT","cmd":"ss -tan | grep :{port} | head","risk":"safe","look":"TIME_WAIT entries without a listener mean the old socket has not been released. SO_REUSEADDR in the application is the correct fix, not waiting."},{"title":"Stop the process holding the port","cmd":"sudo kill <pid>","risk":"destructive","look":"Re-run ss to confirm the port is free before starting your service.","note":"Terminates the process. If it is a production service, its clients drop immediately. Confirm what the PID actually is with ps before running this, and prefer the service manager's stop command so it shuts down cleanly."}],"causes":[{"id":"other-process","cause":"Another process is bound to the port.","fix":"Stop it through its service manager, or configure your service to use a different port.","confirm":""},{"id":"time-wait","cause":"An old socket has not been released.","fix":"Enable SO_REUSEADDR in the application. Waiting works but is not a fix.","confirm":""},{"id":"interface-conflict","cause":"Bound to a specific address that overlaps your wildcard bind.","fix":"Bind to a specific address instead of 0.0.0.0.","confirm":""},{"id":"systemd-socket","cause":"A systemd socket unit holds the port.","fix":"Stop the .socket unit, not just the .service.","confirm":""}],"verify":["The service starts and is listening.","ss shows it as the owner of the port."],"escalate":["ss -tlnp output for the port","What the holding process is","Whether it is managed by systemd"]},{"id":"linux-service-fails","tier":"documented","technology":"Linux","category":"systemd","title":"systemd service will not start","summary":"systemctl start fails or the unit restarts in a loop. The journal has the real reason.","aliases":["service failed","systemctl start failed","unit failed","job failed see systemctl status","service wont start","activating auto-restart"],"source":"https://man7.org/linux/man-pages/man1/systemctl.1.html","inputs":[{"key":"unit","label":"Unit name","example":"checkout-api.service"}],"steps":[{"title":"Read the unit's current state and last lines","cmd":"systemctl status {unit} --no-pager -l","risk":"safe","look":"The Active line and the exit status. 'code=exited status=N' is the application's own exit code and the most useful number on the screen.","signals":[{"match":"(?i)status=203/EXEC","means":"systemd could not execute the binary. Wrong path, or not executable.","goto":"cause:bad-exec"},{"match":"(?i)status=200/CHDIR","means":"WorkingDirectory does not exist.","goto":"cause:bad-workdir"},{"match":"(?i)status=217/USER","means":"The configured User does not exist.","goto":"cause:bad-user"},{"match":"(?i)Result: timeout","means":"It started but never signalled readiness in time.","goto":"cause:type-mismatch"}]},{"title":"Read the journal for this unit's last start","cmd":"journalctl -u {unit} -n 80 --no-pager","risk":"safe","look":"The application's own output. systemctl status truncates; this does not."},{"title":"Validate the unit file itself","cmd":"systemd-analyze verify /etc/systemd/system/{unit}","risk":"safe","look":"Syntax problems and unresolvable references that status will never mention."},{"title":"Reload systemd after editing a unit","cmd":"sudo systemctl daemon-reload","risk":"state","look":"No output means success. Start the unit again afterwards.","note":"Re-reads all unit files. Running services are not restarted and nothing is interrupted, but forgetting this after an edit means systemd keeps using the old definition and your change appears to do nothing."}],"causes":[{"id":"bad-exec","cause":"ExecStart points at something that cannot be executed.","fix":"Use an absolute path and check the execute bit. systemd does not use your shell's PATH.","confirm":""},{"id":"bad-user","cause":"The User directive names an account that does not exist.","fix":"Create the user or correct the name.","confirm":""},{"id":"bad-workdir","cause":"WorkingDirectory does not exist.","fix":"Create it, or remove the directive.","confirm":""},{"id":"type-mismatch","cause":"Type=notify or forking, but the process does not behave that way.","fix":"Use Type=simple for a process that stays in the foreground. This mismatch causes start timeouts constantly.","confirm":""},{"id":"stale-unit","cause":"The unit file was edited without a daemon-reload.","fix":"Run systemctl daemon-reload after every unit file change.","confirm":""}],"verify":["systemctl status shows active and running.","It survives a reboot if it is enabled.","The journal shows a clean startup."],"escalate":["Full systemctl status output","journalctl for the last start attempt","The unit file contents"]},{"id":"linux-high-load","tier":"documented","technology":"Linux","category":"Performance","title":"Load average is high and the box feels slow","summary":"High load can mean CPU, disk wait or thread explosion. They look identical at first and need different fixes.","aliases":["high load","load average","server slow","cpu high","system unresponsive","load spike"],"source":"https://man7.org/linux/man-pages/man1/top.1.html","inputs":[],"steps":[{"title":"Separate CPU from I/O wait","cmd":"top -bn1 | head -5","risk":"safe","look":"The %Cpu line. High us means real computation; high wa means processes blocked on disk; high sy means kernel overhead, often context switching.","signals":[{"match":"(?i)wa[,\\s]*[1-9]\\d\\.","means":"Significant I/O wait. The disk, not the CPU, is the bottleneck.","goto":"cause:io-wait"},{"match":"(?i)st[,\\s]*[1-9]","means":"Steal time. The hypervisor is taking cycles; this is a noisy-neighbour problem.","goto":"cause:steal"}]},{"title":"Compare load against core count","cmd":"uptime && nproc","risk":"safe","look":"Load equal to core count is fully busy, not broken. Load at several times the core count is where queuing hurts."},{"title":"Find the top consumers","cmd":"ps -eo pid,ppid,pcpu,pmem,etime,comm --sort=-pcpu | head -15","risk":"safe","look":"The elapsed time column matters as much as the CPU column. A process at 100% for three seconds is normal; for three hours it is not."},{"title":"Check whether processes are blocked rather than running","cmd":"ps -eo state,pid,comm | grep '^D' | head","risk":"safe","look":"State D is uninterruptible sleep, almost always disk or NFS. Load counts these, which is why a box can show high load with idle CPUs."}],"causes":[{"id":"io-wait","cause":"Processes are blocked on disk.","fix":"Find the process doing the I/O. The CPU is not the constraint and adding cores will not help.","confirm":""},{"id":"runaway-process","cause":"One process is consuming the CPU.","fix":"Identify it from the elapsed time. Restart or throttle it depending on what it is.","confirm":""},{"id":"thread-explosion","cause":"A large number of threads or processes.","fix":"Check the thread count. An unbounded worker pool is a common cause.","confirm":""},{"id":"steal","cause":"The hypervisor is taking CPU time.","fix":"This is not fixable from inside the guest. Raise it with the platform owner.","confirm":""},{"id":"normal","cause":"Load is roughly equal to core count under real work.","fix":"Nothing is wrong. Measure response time rather than load average.","confirm":""}],"verify":["Load is proportional to core count under normal work.","Response times are acceptable.","The specific contributor was identified, not just observed."],"escalate":["top header lines","Load average with nproc","Top processes by CPU with elapsed time"]},{"id":"linux-ssh-denied","tier":"documented","technology":"Linux","category":"Access","title":"SSH permission denied (publickey)","summary":"The server rejected your key. Verbose output names the exact reason.","aliases":["permission denied publickey","ssh denied","cannot ssh","key rejected","authentication failed ssh","too open private key"],"source":"https://man7.org/linux/man-pages/man8/sshd.8.html","inputs":[{"key":"host","label":"Host","example":"bastion.example.com"},{"key":"user","label":"User","example":"ubuntu"}],"steps":[{"title":"Run with verbose output and read which keys were offered","cmd":"ssh -vvv {user}@{host} 2>&1 | findstr /C:\"Offering\" /C:\"Authentications\" /C:\"debug1: Next\"","risk":"safe","look":"Which keys the client offered and which methods the server accepts. If your key was never offered, the problem is local, not on the server.","signals":[{"match":"(?i)Offering public key","means":"The key was offered and rejected. The problem is server-side authorization.","goto":"cause:not-authorized"},{"match":"(?i)no such identity","means":"The key file does not exist at the path the client expects.","goto":"cause:missing-key"},{"match":"(?i)bad permissions|too open","means":"The private key is readable by others, so ssh refuses to use it.","goto":"cause:key-permissions"}]},{"title":"Check local key permissions","cmd":"ls -l ~/.ssh/","risk":"safe","look":"The private key must be 600 and the directory 700. ssh silently refuses keys that are more permissive."},{"title":"Confirm which key the client will use for this host","cmd":"ssh -G {host} | findstr identityfile","risk":"safe","look":"The resolved config. A ~/.ssh/config entry may be pointing at a different key than you assume."},{"title":"Check the server side if you have another way in","cmd":"sudo tail -30 /var/log/auth.log","risk":"safe","look":"sshd states the precise reason, including permission problems on the remote authorized_keys file, which the client can never see."}],"causes":[{"id":"not-authorized","cause":"The public key is not in the remote authorized_keys.","fix":"Add it. Confirm you copied the .pub file, not the private key.","confirm":""},{"id":"key-permissions","cause":"Local private key permissions are too open.","fix":"chmod 600 on the key and 700 on ~/.ssh.","confirm":""},{"id":"remote-permissions","cause":"The remote ~/.ssh or authorized_keys is group-writable.","fix":"chmod 700 ~/.ssh and 600 authorized_keys on the server. sshd refuses them otherwise and logs the reason.","confirm":""},{"id":"missing-key","cause":"The key file is not where the client looks.","fix":"Point at it with -i, or add an IdentityFile entry to ~/.ssh/config.","confirm":""},{"id":"wrong-user","cause":"Correct key, wrong username.","fix":"Cloud images each have their own default user. ubuntu, ec2-user and admin are not interchangeable.","confirm":""}],"verify":["SSH connects without a password prompt.","It works from a fresh shell, not only with an explicit -i flag."],"escalate":["ssh -vvv output around the authentication attempt","Local key permissions","auth.log from the server if reachable"]},{"id":"linux-oom-killer","tier":"documented","technology":"Linux","category":"Memory","title":"Process was killed by the OOM killer","summary":"A process vanished with no error. The kernel killed it to reclaim memory.","aliases":["oom killer","process killed","out of memory kernel","killed process","oom-kill","process disappeared"],"source":"https://man7.org/linux/man-pages/man5/proc.5.html","inputs":[{"key":"process","label":"Process name","example":"java"}],"steps":[{"title":"Confirm the kernel did it","cmd":"sudo dmesg -T | grep -i -E 'killed process|oom' | tail -10","risk":"safe","look":"The timestamp, the process name and its RSS at the moment of death. This is definitive; without it you are only guessing.","signals":[{"match":"(?i)Killed process","means":"Confirmed. The kernel chose this process as the victim.","goto":"cause:host-oom"},{"match":"(?i)memory cgroup out of memory","means":"A cgroup limit, not the whole host. Only that container or unit was constrained.","goto":"cause:cgroup-limit"}]},{"title":"See the current memory picture","cmd":"free -h","risk":"safe","look":"available, not free. Linux uses free memory for cache by design, so a low free number is normal and not a problem."},{"title":"Find the current biggest consumers","cmd":"ps -eo pid,rss,comm --sort=-rss | head -10","risk":"safe","look":"RSS in kilobytes. Compare the top entry against total memory to see whether one process dominates."},{"title":"Check what the kernel would kill next","cmd":"for p in $(pgrep {process}); do echo \"$p $(cat /proc/$p/oom_score)\"; done","risk":"safe","look":"Higher score means more likely to be chosen. Useful for predicting the next victim before it happens."}],"causes":[{"id":"host-oom","cause":"The host ran out of memory.","fix":"Reduce the workload, add memory, or set limits so one process cannot take everything.","confirm":""},{"id":"cgroup-limit","cause":"A container or systemd unit hit its own limit.","fix":"Raise MemoryMax or the container limit, having measured the real requirement first.","confirm":""},{"id":"no-swap","cause":"No swap, so there is no buffer before the killer runs.","fix":"A small swap file gives the kernel room to reclaim before killing. Not a substitute for enough RAM.","confirm":""},{"id":"leak","cause":"Memory grows without bound.","fix":"Profile the process. The OOM killer is a symptom, not the problem.","confirm":""}],"verify":["The process stays running through a full workload cycle.","free shows headroom in available.","A limit exists so one process cannot take the whole host."],"escalate":["The dmesg OOM lines verbatim","free -h output","RSS of the top processes"]}]</script>
<script>
"use strict";
const BANK = JSON.parse(document.getElementById("data").textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- session state (in memory only; nothing is persisted) ---------- */
const CTX = {};                 // placeholder key -> value
let CUR = null;                 // open runbook
let LOG = [];                   // [{t, step, cmd, note}]
let CURSOR = -1;                // keyboard cursor in results

/* ---------- search ---------- */
const flat = s => String(s ?? "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
function score(r, q) {
  if (!q.trim()) return 1;
  const qq = flat(q), qt = qq.split(" ").filter(t => t.length > 1);
  const title = flat(r.title), al = (r.aliases || []).map(flat);
  let s = 0;
  if (title.includes(qq)) s += 100;
  if (al.some(a => a.includes(qq) || qq.includes(a))) s += 80;
  const hay = [title, flat(r.summary), al.join(" "), flat(r.category)].join(" ");
  for (const t of qt) {
    if (title.includes(t)) s += 18;
    else if (al.some(a => a.includes(t))) s += 14;
    else if (hay.includes(t)) s += 4;
  }
  return s;
}

let TECH = "All", CAT = "All";

function renderChips() {
  const techs = [...new Set(BANK.map(r => r.technology))].sort();
  $("#techchips").innerHTML = ["All", ...techs].map(t => {
    const n = t === "All" ? BANK.length : BANK.filter(r => r.technology === t).length;
    return `<button class="tab${t === TECH ? " on" : ""}" data-t="${esc(t)}">${esc(t)}<span class="n">${n}</span></button>`;
  }).join("");
  document.querySelectorAll("#techchips .tab").forEach(b => b.onclick = () => {
    TECH = b.dataset.t; CAT = "All"; renderChips(); renderResults();
  });

  const pool = TECH === "All" ? BANK : BANK.filter(r => r.technology === TECH);
  const cats = [...new Set(pool.map(r => r.category).filter(Boolean))].sort();
  $("#catchips").innerHTML = cats.length > 1
    ? ["All", ...cats].map(c =>
        `<button class="tab${c === CAT ? " on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")
    : "";
  document.querySelectorAll("#catchips .tab").forEach(b => b.onclick = () => {
    CAT = b.dataset.c; renderChips(); renderResults();
  });
}

function renderResults() {
  const q = $("#q").value;
  let pool = BANK;
  if (TECH !== "All") pool = pool.filter(r => r.technology === TECH);
  if (CAT !== "All") pool = pool.filter(r => r.category === CAT);
  const arr = pool.map(r => ({ r, s: score(r, q) })).filter(x => x.s > 0)
                  .sort((a, b) => b.s - a.s).slice(0, 60);
  CURSOR = arr.length ? 0 : -1;
  $("#results").innerHTML = arr.length ? arr.map((x, i) => {
    const r = x.r, v = r.tier === "verified";
    return `<li><button class="hit${i === 0 ? " cur" : ""}" data-id="${esc(r.id)}">
      <h3>${esc(r.title)}</h3><p>${esc(r.summary)}</p>
      <span class="meta">
        <span class="trust t-${esc(r.tier)}">${v ? "Verified " + esc(r.verified_on) : esc(r.tier)}</span>
        <span>${esc(r.technology)}</span>
        <span>${(r.steps || []).length} steps</span>
      </span></button></li>`;
  }).join("") : `<li class="empty">Nothing matched. Try the exact error string from your terminal,
    or a plainer phrase like "pod won't start".</li>`;
  document.querySelectorAll(".hit").forEach(b => b.onclick = () => open(b.dataset.id));
}

/* ---------- placeholder substitution ---------- */
function fill(cmd, asHtml) {
  return cmd.replace(/\{([a-z0-9_]+)\}/g, (m, k) => {
    const v = CTX[k];
    if (!asHtml) return v || m;
    return v ? `<span class="fill">${esc(v)}</span>`
             : `<span class="unfilled">${esc(m)}</span>`;
  });
}

function ctxBar() {
  const keys = (CUR && CUR.inputs) || [];
  $("#ctxfields").innerHTML = keys.map(i =>
    `<label>${esc(i.label)}<input data-k="${esc(i.key)}" placeholder="${esc(i.example || "")}"
      value="${esc(CTX[i.key] || "")}" size="${Math.max(8, (i.example || "").length)}"></label>`).join("");
  document.querySelectorAll("#ctxfields input").forEach(inp => {
    inp.oninput = () => { CTX[inp.dataset.k] = inp.value.trim(); repaintCmds(); };
  });
}

function repaintCmds() {
  document.querySelectorAll("[data-cmd]").forEach(el => {
    el.innerHTML = fill(el.dataset.cmd, true);
  });
}

/* ---------- runbook view ---------- */
function open(id) {
  CUR = BANK.find(r => r.id === id);
  if (!CUR) return;
  LOG = [];
  (CUR.inputs || []).forEach(i => { if (!(i.key in CTX)) CTX[i.key] = ""; });
  ctxBar();

  const RISK = { safe: ["Read only", "c-safe"], state: ["Changes state", "c-state"],
                 destructive: ["Destructive", "c-destructive"] };

  const steps = (CUR.steps || []).map((s, i) => {
    const [label, cls] = RISK[s.risk] || RISK.safe;
    const danger = s.risk === "destructive";
    const body = danger
      ? `<div class="veil" data-reveal="${i}">Command hidden. Read the warning, then tap to reveal.</div>`
      : `<pre data-cmd="${esc(s.cmd)}"></pre><button class="copy" data-copy="${i}">Copy</button>`;
    const note = s.note ? `<p class="note${s.risk === "state" ? " note-state" : ""}">${esc(s.note)}</p>` : "";
    const sig = (s.signals || []).length
      ? `<details class="match"><summary>Paste your actual output to read it</summary>
           <textarea data-sig="${i}" placeholder="Paste the output you got, then release the key."></textarea>
           <div class="verdict miss" data-verdict="${i}">Nothing matched yet. Paste output above.</div>
         </details>` : "";
    return `<li class="step${danger ? " danger" : ""}" data-step="${i}">
      <button class="mark" data-done="${i}" aria-label="Mark step ${i + 1} done">${i + 1}</button>
      <div class="shead"><span class="stitle">${esc(s.title)}</span>
        <span class="chip ${cls}">${label}</span></div>
      ${note}
      <div class="cmd">${body}</div>
      <p class="look">${esc(s.look)}</p>
      ${sig}</li>`;
  }).join("");

  const causes = (CUR.causes || []).map((c, i) =>
    `<div class="cause" data-cause="${esc(c.id)}">
       <div><span class="rank">${i + 1}</span><span class="what">${esc(c.cause)}</span></div>
       <div class="fix"><b>Fix.</b> ${esc(c.fix)}</div></div>`).join("");

  const prov = CUR.tier === "verified"
    ? `Verified <b>${esc(CUR.verified_on)}</b> against <code>${esc(CUR.verified_against)}</code>
       by ${esc(CUR.verified_by)}.${CUR.source ? ` <a href="${esc(CUR.source)}" target="_blank" rel="noopener">Official docs</a>` : ""}`
    : `Written from documentation, not yet run against a live system. Treat every command as unconfirmed.`;

  $("#rbview").innerHTML = `
    <button class="back" id="back">&larr; All runbooks</button>
    <h2>${esc(CUR.title)}</h2>
    <p class="sum">${esc(CUR.summary)}</p>
    <p class="prov">${prov}</p>
    <ol class="steps">${steps}</ol>
    ${causes ? `<div class="sec"><h3>Likely causes, most common first</h3>${causes}</div>` : ""}
    ${(CUR.verify || []).length ? `<div class="sec"><h3>You are done when</h3>
       <ul class="plain">${CUR.verify.map(v => `<li>${esc(fill(v, false))}</li>`).join("")}</ul></div>` : ""}`;

  $("#searchview").style.display = "none";
  $("#results").style.display = "none";
  $("#rbview").style.display = "block";
  $("#bar").style.display = "block";
  $("#foot").textContent = "";
  window.scrollTo(0, 0);
  repaintCmds(); wire(); progress();
}

function wire() {
  $("#back").onclick = home;

  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => {
    const s = CUR.steps[+b.dataset.copy];
    copy(fill(s.cmd, false), "Command copied");
  });

  document.querySelectorAll("[data-reveal]").forEach(v => v.onclick = () => {
    const i = +v.dataset.reveal, s = CUR.steps[i];
    v.outerHTML = `<pre data-cmd="${esc(s.cmd)}"></pre><button class="copy" data-copy="${i}">Copy</button>`;
    repaintCmds(); wire();
  });

  document.querySelectorAll("[data-done]").forEach(b => b.onclick = () => {
    const i = +b.dataset.done, li = b.closest(".step"), s = CUR.steps[i];
    li.classList.toggle("done");
    if (li.classList.contains("done")) {
      LOG.push({ t: new Date().toISOString().slice(11, 19), step: s.title, cmd: fill(s.cmd, false) });
    } else {
      LOG = LOG.filter(e => e.step !== s.title);
    }
    progress();
  });

  document.querySelectorAll("[data-sig]").forEach(ta => ta.oninput = () => {
    const i = +ta.dataset.sig, s = CUR.steps[i], text = ta.value;
    const out = $(`[data-verdict="${i}"]`);
    document.querySelectorAll(".cause").forEach(c => c.classList.remove("lit"));
    if (!text.trim()) {
      out.className = "verdict miss";
      out.textContent = "Nothing matched yet. Paste output above.";
      return;
    }
    const m = (s.signals || []).find(g => { try { return new RegExp(g.match, "i").test(text); } catch { return false; } });
    if (!m) {
      out.className = "verdict miss";
      out.textContent = "No known signature in that output. It may still be fine — read the note above, "
        + "or add this output as a new signal so the next person gets a hit.";
      return;
    }
    out.className = "verdict hit";
    const target = m.goto || "";
    out.innerHTML = `<b>That output means:</b>${esc(m.means)}`;
    if (target.startsWith("cause:")) {
      const c = (CUR.causes || []).find(x => x.id === target.slice(6));
      const el = $(`[data-cause="${CSS.escape(target.slice(6))}"]`);
      if (el) el.classList.add("lit");
      if (c) out.innerHTML += `<button class="jump">Go to the fix: ${esc(c.cause)}</button>`;
      out.querySelector(".jump") && (out.querySelector(".jump").onclick =
        () => el && el.scrollIntoView({ behavior: "smooth", block: "center" }));
    } else if (target.startsWith("step:")) {
      const n = +target.slice(5);
      out.innerHTML += `<button class="jump">Go to step ${n}</button>`;
      out.querySelector(".jump").onclick = () =>
        document.querySelector(`[data-step="${n - 1}"]`).scrollIntoView({ behavior: "smooth", block: "center" });
    }
    LOG.push({ t: new Date().toISOString().slice(11, 19), step: s.title,
               cmd: fill(s.cmd, false), note: m.means });
  });
}

function progress() {
  const total = (CUR.steps || []).length;
  const done = document.querySelectorAll(".step.done").length;
  $("#prog").textContent = `${done} of ${total} checks done`;
}

/* ---------- exports ---------- */
function copy(t, msg) {
  navigator.clipboard.writeText(t).then(() => {
    const el = $("#toast"); el.textContent = msg; el.style.display = "block";
    setTimeout(() => el.style.display = "none", 1600);
  }, () => prompt("Copy manually:", t));
}

$("#a-safe").onclick = () => {
  const c = (CUR.steps || []).filter(s => s.risk === "safe").map(s => `# ${s.title}\n${fill(s.cmd, false)}`);
  copy(c.join("\n\n"), `${c.length} read-only commands copied`);
};

$("#a-esc").onclick = () => {
  const L = [`## ${CUR.title}`, "", "**What I checked**"];
  LOG.forEach(e => { L.push(`- ${e.step} — \`${e.cmd}\``); if (e.note) L.push(`  - saw: ${e.note}`); });
  if (!LOG.length) L.push("- (nothing recorded yet)");
  L.push("", "**Still needed**");
  (CUR.escalate || []).forEach(x => L.push(`- ${fill(x, false)}`));
  copy(L.join("\n"), "Handoff notes copied");
};

$("#a-log").onclick = () => {
  const L = [`# Incident: ${CUR.title}`, `Runbook: ${CUR.id} (verified ${CUR.verified_on || "n/a"})`, ""];
  Object.entries(CTX).filter(([, v]) => v).forEach(([k, v]) => L.push(`- ${k}: \`${v}\``));
  L.push("", "| time | check | command | observed |", "|---|---|---|---|");
  LOG.forEach(e => L.push(`| ${e.t} | ${e.step} | \`${e.cmd}\` | ${e.note || ""} |`));
  if (!LOG.length) L.push("| | no checks recorded | | |");
  copy(L.join("\n"), "Incident log copied as markdown");
};

/* ---------- navigation ---------- */
function home() {
  CUR = null; LOG = [];
  $("#searchview").style.display = "block";
  $("#results").style.display = "block";
  $("#rbview").style.display = "none";
  $("#bar").style.display = "none";
  $("#ctxfields").innerHTML = "";
  $("#foot").textContent = FOOT;
  $("#q").focus(); $("#q").select();
}

$("#q").oninput = renderResults;

document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); $("#q").select(); return; }
  if (e.key === "Escape" && CUR) { home(); return; }
  if (CUR || !["ArrowDown", "ArrowUp", "Enter"].includes(e.key)) return;
  const hits = [...document.querySelectorAll(".hit")];
  if (!hits.length) return;
  if (e.key === "Enter") { e.preventDefault(); hits[Math.max(0, CURSOR)].click(); return; }
  e.preventDefault();
  hits[CURSOR]?.classList.remove("cur");
  CURSOR = (CURSOR + (e.key === "ArrowDown" ? 1 : -1) + hits.length) % hits.length;
  hits[CURSOR].classList.add("cur");
  hits[CURSOR].scrollIntoView({ block: "nearest" });
});

const v = BANK.filter(r => r.tier === "verified").length;
const techs = [...new Set(BANK.map(r => r.technology))].sort();
const FOOT = `${v} verified runbook${v === 1 ? "" : "s"} across ${techs.join(", ")}. `
  + `Runs entirely in this file — nothing is sent anywhere, nothing is executed for you, `
  + `and nothing is saved when you close the tab. Every command is yours to run.\n\n`
  + `Designed and built by Dinesh Ilangovan. Every runbook marked verified was run `
  + `against a real system, with the date and version recorded on it.`;
$("#foot").textContent = FOOT;
renderChips();
renderResults();
</script>
</body>
</html>
