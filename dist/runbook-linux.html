eans something overwrote it and systemd-resolved is being bypassed."}],"causes":[{"id":"split-dns","cause":"Split DNS routes only some domains via the VPN.","fix":"Add the internal domain to the VPN link with resolvectl domain.","confirm":""},{"id":"no-split","cause":"All queries go to one resolver.","fix":"If it is the VPN resolver, external names may fail; if it is the local one, internal names fail.","confirm":""},{"id":"resolv-overwritten","cause":"resolv.conf was replaced by a plain file.","fix":"Restore the symlink to the stub resolver.","confirm":""},{"id":"vpn-client-config","cause":"The VPN client does not push DNS settings.","fix":"Configure them in the client, not by editing resolv.conf which gets rewritten.","confirm":""},{"id":"dns-leak-protection","cause":"The VPN blocks outside resolvers.","fix":"Intentional. Use the VPN's own resolver for everything.","confirm":""}],"verify":["Both internal and external names resolve.","It survives a VPN reconnect.","The configuration is in the VPN client, not a hand-edited file."],"escalate":["Output of resolvectl status","Which link answered the query","Whether resolv.conf is the expected symlink"]},{"id":"linux-ssh-key-ignored","tier":"guide","technology":"Linux","category":"Access","title":"SSH ignores the key you specified","summary":"Even with -i the wrong key is offered, or too many keys are tried.","aliases":["too many authentication failures","wrong key offered","identitiesonly","ssh tries wrong key","key ignored"],"source":"https://man.openbsd.org/ssh_config","inputs":[{"key":"host","label":"Host","example":"bastion.example.com"}],"steps":[{"title":"See which keys are offered and in what order","cmd":"ssh -v {host} 2>&1 | findstr /C:\"Offering\"","risk":"safe","look":"Every key the client tries. Servers usually disconnect after six attempts, so a key later in the list is never reached.","signals":[{"match":"Too many authentication failures","means":"The server cut the connection before reaching your key.","goto":"cause:too-many-keys"},{"match":"Offering public key.*id_rsa","means":"A default key is offered before the one you specified.","goto":"cause:agent-first"}]},{"title":"Check the resolved configuration","cmd":"ssh -G {host} | findstr /C:\"identityfile\" /C:\"identitiesonly\"","risk":"safe","look":"Without IdentitiesOnly yes, the agent's keys are offered in addition to -i, and often before it."},{"title":"Check what the agent holds","cmd":"ssh-add -l","risk":"safe","look":"Every loaded key is offered. A crowded agent is the usual cause of too-many-failures."},{"title":"Force only the specified key","cmd":"ssh -o IdentitiesOnly=yes -i ~/.ssh/mykey {host}","risk":"safe","look":"Offers exactly one key. If this works, the fix belongs in your ssh config for that host."}],"causes":[{"id":"too-many-keys","cause":"The agent offers more keys than the server allows attempts.","fix":"Set IdentitiesOnly yes per host in your config.","confirm":""},{"id":"agent-first","cause":"Agent keys take priority over -i.","fix":"IdentitiesOnly yes makes -i authoritative.","confirm":""},{"id":"wrong-key-config","cause":"The host config points at a different key.","fix":"Check ssh -G output; a wildcard Host block may be matching.","confirm":""},{"id":"key-not-authorised","cause":"The right key is offered and refused.","fix":"A server-side problem. Follow the SSH denied runbook.","confirm":""}],"verify":["The connection succeeds with the intended key.","It works without flags after fixing the config."],"escalate":["Which keys are offered","The resolved identityfile","Agent contents"]},{"id":"linux-systemd-unit-not-found","tier":"guide","technology":"Linux","category":"systemd","title":"Unit not found after creating it","summary":"systemctl says the unit does not exist even though the file is there.","aliases":["unit not found","no such unit","unit file missing","daemon-reload","masked unit","failed to start not found"],"source":"https://man7.org/linux/man-pages/man1/systemctl.1.html","inputs":[{"key":"unit","label":"Unit","example":"checkout-api.service"}],"steps":[{"title":"Ask systemd where it thinks the unit is","cmd":"systemctl cat {unit}","risk":"safe","look":"The resolved file path. An error means systemd has not seen it, whatever exists on disk.","signals":[{"match":"No files found","means":"systemd has no record of it. Usually a missing reload or wrong directory.","goto":"cause:not-reloaded"},{"match":"masked","means":"The unit is masked, which makes it unstartable by design.","goto":"cause:masked"}]},{"title":"Check the file location and name","cmd":"dir /etc/systemd/system/","risk":"safe","look":"The filename must end in .service exactly, and the directory matters. A stray .txt extension is invisible to systemd."},{"title":"Reload the unit files","cmd":"sudo systemctl daemon-reload","risk":"state","look":"No output means success. systemctl cat should now find the unit.","note":"Re-reads every unit file on the system. Running services are not restarted and nothing is interrupted. Skipping this after any edit is the single most common systemd mistake."},{"title":"Check for syntax errors","cmd":"systemd-analyze verify /etc/systemd/system/{unit}","risk":"safe","look":"A malformed unit may be partially ignored, which presents as a confusing not-found."}],"causes":[{"id":"not-reloaded","cause":"daemon-reload was not run after creating the file.","fix":"Run it. systemd caches unit definitions.","confirm":""},{"id":"wrong-extension","cause":"The filename does not end in .service.","fix":"Rename it. Hidden extensions on Windows-edited files cause this.","confirm":""},{"id":"wrong-directory","cause":"The file is in the wrong location.","fix":"/etc/systemd/system for local units.","confirm":""},{"id":"masked","cause":"The unit is masked.","fix":"systemctl unmask. Masking links it to /dev/null deliberately.","confirm":""},{"id":"bad-permissions","cause":"The file is not readable by root.","fix":"chmod 644.","confirm":""}],"verify":["systemctl cat finds the unit.","It starts and enables.","It survives a reboot."],"escalate":["Output of systemctl cat","The file path and exact name","Whether daemon-reload was run"]},{"id":"linux-firewall-blocking","tier":"guide","technology":"Linux","category":"Networking","title":"Connections refused by the local firewall","summary":"A service is listening but external connections do not arrive.","aliases":["firewall blocking","ufw","iptables","firewalld","port blocked","connection refused firewall","nftables"],"source":"https://man7.org/linux/man-pages/man8/iptables.8.html","inputs":[{"key":"port","label":"Port","example":"8080"}],"steps":[{"title":"Confirm the service is listening","cmd":"ss -tlnp 'sport = :{port}'","risk":"safe","look":"It must listen on 0.0.0.0 or the external address. Bound to 127.0.0.1 it is unreachable regardless of firewall.","signals":[{"match":"127\\.0\\.0\\.1:","means":"Listening on loopback only. The firewall is not the problem.","goto":"cause:bound-loopback"},{"match":"0\\.0\\.0\\.0:","means":"Listening on all interfaces. Now check the firewall.","goto":"step:2"}]},{"title":"Check which firewall is active","cmd":"sudo ufw status 2>/dev/null; sudo firewall-cmd --state 2>/dev/null; sudo nft list ruleset 2>/dev/null | head -20","risk":"safe","look":"Only one is usually active. Rules added to an inactive one have no effect, which wastes a lot of time."},{"title":"Check whether the port is allowed","cmd":"sudo iptables -L INPUT -n --line-numbers | findstr {port}","risk":"safe","look":"Rule order matters. A DROP before your ACCEPT means the ACCEPT is never reached."},{"title":"Test from another machine","cmd":"ss -tn state established","risk":"safe","look":"Whether connections arrive at all. Nothing arriving means it is blocked before reaching the host, so check the cloud security group too."}],"causes":[{"id":"bound-loopback","cause":"The service listens on loopback only.","fix":"Bind 0.0.0.0. No firewall change will help otherwise.","confirm":""},{"id":"not-allowed","cause":"No rule permits the port.","fix":"Add one to whichever firewall is actually active.","confirm":""},{"id":"rule-order","cause":"A DROP precedes the ACCEPT.","fix":"Insert the ACCEPT earlier. Rules are evaluated in order.","confirm":""},{"id":"wrong-firewall","cause":"Rules added to an inactive firewall.","fix":"Check which is running first.","confirm":""},{"id":"cloud-sg","cause":"The cloud security group blocks it before the host.","fix":"Open it there too. Both layers must permit.","confirm":""}],"verify":["Connections succeed from outside.","The rule persists across reboot.","Both host and cloud layers allow it."],"escalate":["What the service binds to","Which firewall is active","The relevant rules in order"]},{"id":"linux-inode-exhaustion","tier":"guide","technology":"Linux","category":"Storage","title":"No space left but the disk has free space","summary":"Writes fail with no space even though df shows capacity available.","aliases":["no space inodes","inode exhaustion","df -i full","cannot create file space available","too many files"],"source":"https://man7.org/linux/man-pages/man1/df.1.html","inputs":[{"key":"path","label":"Path","example":"/var"}],"steps":[{"title":"Compare space against inodes","cmd":"df -h {path} && df -i {path}","risk":"safe","look":"IUse% at 100 with space free is inode exhaustion. The error message is identical to a full disk but the fix is completely different.","signals":[{"match":"100%","means":"One of the two is exhausted. Check which column.","goto":"cause:inodes-full"}]},{"title":"Find directories with the most entries","cmd":"find {path} -xdev -type d -exec sh -c 'echo $(ls -A \"$1\" | wc -l) \"$1\"' _ {} \\; 2>/dev/null | sort -rn | head -10","risk":"safe","look":"Directories with hundreds of thousands of small files. Session, cache and mail spool directories are the usual culprits."},{"title":"Check for a runaway producer","cmd":"ls -lt {path} | head -20","risk":"safe","look":"Recently created files. If they are still appearing, stop the producer before cleaning up."},{"title":"Remove the accumulated files","cmd":"find {path}/cache -type f -mtime +7 -delete","risk":"destructive","look":"df -i shows IUse% dropping. Then fix whatever created them.","note":"Permanently deletes every file in that directory older than seven days. Run the same command with -print instead of -delete first and read the list. On a directory with hundreds of thousands of entries this takes a long time and cannot be interrupted cleanly."}],"causes":[{"id":"inodes-full","cause":"Inodes are exhausted.","fix":"Delete small files. Adding disk does not add inodes on most filesystems.","confirm":""},{"id":"session-files","cause":"A web application accumulates session files.","fix":"Configure expiry, or move sessions to a cache server.","confirm":""},{"id":"mail-spool","cause":"Undelivered mail piled up.","fix":"Usually cron output with no MTA. Redirect cron output to a file.","confirm":""},{"id":"no-rotation","cause":"Small log files accumulate.","fix":"Configure rotation with a count limit.","confirm":""},{"id":"filesystem-format","cause":"The filesystem was created with too few inodes.","fix":"Only fixable by reformatting. Choose a higher inode ratio for file-heavy workloads.","confirm":""}],"verify":["df -i shows headroom.","Writes succeed.","The producer is fixed so it does not recur."],"escalate":["df -h and df -i side by side","The directories with the most entries","What is creating them"]},{"id":"linux-out-of-memory-container","tier":"guide","technology":"Linux","category":"Memory","title":"Process killed inside a cgroup","summary":"A process dies with no error and the host has plenty of free memory.","aliases":["cgroup oom","memory.max","container killed memory","systemd memorymax","killed in cgroup"],"source":"https://man7.org/linux/man-pages/man7/cgroups.7.html","inputs":[{"key":"unit","label":"Unit or cgroup","example":"checkout-api.service"}],"steps":[{"title":"Check the kernel log for a cgroup OOM","cmd":"sudo dmesg -T | grep -i 'memory cgroup out of memory' | tail -5","risk":"safe","look":"This names the cgroup, not the host. A cgroup OOM with free host memory is a limit problem, not a capacity one.","signals":[{"match":"memory cgroup out of memory","means":"A cgroup limit was hit. The host was never short.","goto":"cause:cgroup-limit"}]},{"title":"Read the limit and peak usage","cmd":"systemctl show {unit} -p MemoryMax -p MemoryPeak","risk":"safe","look":"Peak against max. Peak equal to max confirms the limit was the binding constraint."},{"title":"Check current usage","cmd":"systemctl status {unit} | findstr Memory","risk":"safe","look":"Live usage. Steadily climbing towards the limit points at a leak rather than a burst."},{"title":"Raise the limit deliberately","cmd":"sudo systemctl set-property {unit} MemoryMax=2G","risk":"state","look":"MemoryMax shows the new value and the process survives its normal workload.","note":"Changes the limit immediately and persists it. Raising it lets the process take more of the host, which can starve other services if the real problem is a leak. Measure the genuine working set before choosing a number."}],"causes":[{"id":"cgroup-limit","cause":"The cgroup limit is below the working set.","fix":"Raise MemoryMax after measuring what it actually needs.","confirm":""},{"id":"leak","cause":"Usage climbs without bound.","fix":"Raising the limit only delays it. Profile the process.","confirm":""},{"id":"runtime-unaware","cause":"The runtime sized itself against the host.","fix":"Set an explicit heap limit. Many runtimes ignore cgroup limits.","confirm":""},{"id":"host-fine","cause":"The host has memory but the cgroup does not.","fix":"That is the limit working as designed.","confirm":""}],"verify":["The process survives a full workload cycle.","Peak sits below the limit with headroom."],"escalate":["The cgroup OOM line from dmesg","MemoryMax and MemoryPeak","Whether usage climbs over time"]},{"id":"linux-command-not-found","tier":"guide","technology":"Linux","category":"Configuration","title":"Command not found even though it is installed","summary":"A binary exists on disk but the shell cannot find it.","aliases":["command not found","not in path","which returns nothing","binary exists but not found","path problem"],"source":"https://man7.org/linux/man-pages/man1/which.1.html","inputs":[{"key":"cmd","label":"Command","example":"terraform"}],"steps":[{"title":"Check whether the shell can find it","cmd":"which {cmd}; command -v {cmd}; echo $PATH","risk":"safe","look":"Empty output with a populated PATH means the directory holding the binary is not listed.","signals":[{"match":"^\\s*$","means":"Not on PATH at all.","goto":"cause:not-on-path"}]},{"title":"Find where it actually is","cmd":"find / -name {cmd} -type f 2>/dev/null | head -5","risk":"safe","look":"The real locations. /usr/local/bin and ~/.local/bin are common and not always on PATH for non-login shells."},{"title":"Check which startup file sets PATH","cmd":"grep -l PATH ~/.bashrc ~/.bash_profile ~/.profile /etc/environment 2>/dev/null","risk":"safe","look":"Non-interactive shells read a different file than your terminal does. That is why it works for you and not in cron or a script."},{"title":"Check it is executable","cmd":"ls -l $(find / -name {cmd} -type f 2>/dev/null | head -1)","risk":"safe","look":"Present on PATH but not executable produces permission denied rather than not found. Different error, different fix."}],"causes":[{"id":"not-on-path","cause":"The directory is not on PATH.","fix":"Add it in the right startup file for the shell that needs it.","confirm":""},{"id":"login-vs-interactive","cause":"PATH is set in a file the shell does not read.","fix":"bashrc for interactive, bash_profile for login. cron reads neither.","confirm":""},{"id":"sudo-path","cause":"Works as you but not under sudo.","fix":"sudo resets PATH by default. Use the absolute path.","confirm":""},{"id":"not-executable","cause":"The file is present but not executable.","fix":"chmod +x.","confirm":""},{"id":"wrong-arch","cause":"The binary is for another architecture.","fix":"Check with the file command.","confirm":""}],"verify":["The command runs from a fresh shell.","It works in cron and scripts too."],"escalate":["Output of command -v and PATH","Where the binary actually is","Which startup file sets PATH"]},{"id":"linux-symlink-broken","tier":"guide","technology":"Linux","category":"Storage","title":"Symlink points at nothing","summary":"A symbolic link exists but following it fails.","aliases":["broken symlink","dangling link","too many levels of symbolic links","no such file symlink","relative link broken"],"source":"https://man7.org/linux/man-pages/man1/ln.1.html","inputs":[{"key":"link","label":"Link path","example":"/usr/local/bin/terraform"}],"steps":[{"title":"See where the link points","cmd":"ls -l {link} && readlink -f {link}","risk":"safe","look":"readlink -f resolves the full chain. Empty output means the target does not exist.","signals":[{"match":"^\\s*$","means":"The target does not resolve. The link is dangling.","goto":"cause:target-gone"},{"match":"Too many levels","means":"A symlink loop. Two links point at each other.","goto":"cause:loop"}]},{"title":"Check whether the target exists","cmd":"test -e $(readlink {link}) && echo EXISTS || echo MISSING","risk":"safe","look":"A relative link is resolved from the link's own directory, not from your current one. That trips people constantly."},{"title":"Check whether it is relative or absolute","cmd":"readlink {link}","risk":"safe","look":"A relative target moves with the link; an absolute one does not. Copying a tree with cp without -a can break either."},{"title":"Recreate the link","cmd":"sudo ln -sfn <target> {link}","risk":"state","look":"readlink -f resolves to the intended file.","note":"Replaces the existing link. -n prevents it being created inside the directory the old link pointed at, which is a classic mistake that leaves the original link untouched and a new one buried. Verify the target exists before running this."}],"causes":[{"id":"target-gone","cause":"The target was deleted or moved.","fix":"Recreate the link against the new location.","confirm":""},{"id":"relative-broken","cause":"A relative link was moved.","fix":"Use an absolute target, or move the link and target together.","confirm":""},{"id":"loop","cause":"Two links reference each other.","fix":"Break the cycle. readlink -f reports too many levels.","confirm":""},{"id":"copied-wrong","cause":"cp followed or flattened the link.","fix":"Use cp -a or rsync -a to preserve links.","confirm":""},{"id":"mount-missing","cause":"The target is on an unmounted filesystem.","fix":"Mount it. The link is fine.","confirm":""}],"verify":["readlink -f resolves correctly.","The command or file works."],"escalate":["Where the link points","Whether the target exists","Relative or absolute"]},{"id":"linux-process-high-memory","tier":"guide","technology":"Linux","category":"Memory","title":"One process is consuming all the memory","summary":"Memory is exhausted and you need to know which process and why.","aliases":["high memory process","memory leak linux","rss growing","which process memory","memory usage"],"source":"https://man7.org/linux/man-pages/man1/ps.1.html","inputs":[{"key":"process","label":"Process","example":"java"}],"steps":[{"title":"Rank processes by resident memory","cmd":"ps -eo pid,rss,vsz,comm --sort=-rss | head -10","risk":"safe","look":"RSS is actual resident memory; VSZ is address space and is usually much larger and not meaningful on its own."},{"title":"Check whether it is growing","cmd":"for i in 1 2 3; do ps -o rss= -C {process}; sleep 20; done","risk":"safe","look":"Three samples twenty seconds apart. Steadily climbing with steady load points at a leak rather than a burst.","signals":[{"match":"\\d+","means":"Compare the three numbers. Monotonic growth under constant load is a leak.","goto":"cause:leak"}]},{"title":"Check shared versus private memory","cmd":"grep -E '^(Rss|Pss|Private)' /proc/$(pgrep -f {process} | head -1)/smaps_rollup","risk":"safe","look":"Pss splits shared pages fairly between processes. Summing RSS across many processes double-counts and overstates usage badly."},{"title":"Check for a configured limit","cmd":"cat /proc/$(pgrep -f {process} | head -1)/limits | grep -i 'max address'","risk":"safe","look":"An unlimited process will keep growing until the host or cgroup stops it. A limit turns a slow leak into a clean restart."}],"causes":[{"id":"leak","cause":"Memory grows without bound.","fix":"Profile the process. A limit contains the damage but does not fix it.","confirm":""},{"id":"no-limit","cause":"The process has no memory ceiling.","fix":"Set MemoryMax on the unit, or a container limit.","confirm":""},{"id":"shared-double-counted","cause":"RSS summed across processes overstates usage.","fix":"Use Pss for a fair figure.","confirm":""},{"id":"cache-not-leak","cause":"Usage includes page cache the kernel will reclaim.","fix":"free shows available, not free. High cache is normal.","confirm":""},{"id":"runtime-heap","cause":"A JVM or similar sized its heap against the host.","fix":"Set an explicit maximum heap.","confirm":""}],"verify":["Memory usage is stable under constant load.","A limit exists.","available memory has headroom."],"escalate":["Top processes by RSS","Three samples over a minute","Pss from smaps_rollup"]},{"id":"linux-service-restart-loop","tier":"guide","technology":"Linux","category":"systemd","title":"Service restarts in a loop","summary":"systemd keeps restarting a unit that immediately fails.","aliases":["restart loop systemd","start request repeated too quickly","service failing repeatedly","restart always","unit flapping"],"source":"https://man7.org/linux/man-pages/man5/systemd.service.5.html","inputs":[{"key":"unit","label":"Unit","example":"checkout-api.service"}],"steps":[{"title":"Read the status and restart count","cmd":"systemctl status {unit} --no-pager","risk":"safe","look":"Start request repeated too quickly means systemd gave up after hitting the rate limit. That is the safety valve working.","signals":[{"match":"repeated too quickly","means":"The start rate limit was hit. systemd stopped trying.","goto":"cause:rate-limited"},{"match":"Result: exit-code","means":"The process exits non-zero every time.","goto":"cause:always-fails"}]},{"title":"Read the journal for one failed start","cmd":"journalctl -u {unit} -n 60 --no-pager","risk":"safe","look":"The application's own output. The same error repeating confirms it is deterministic rather than a race."},{"title":"Check the restart policy","cmd":"systemctl show {unit} -p Restart -p RestartSec -p StartLimitBurst -p StartLimitIntervalSec","risk":"safe","look":"Restart=always with a short RestartSec masks failures and burns CPU. on-failure is usually the better default."},{"title":"Stop the loop to investigate","cmd":"sudo systemctl stop {unit}","risk":"state","look":"The unit shows inactive and the journal stops scrolling.","note":"Stops the service and the restart attempts. The service is unavailable until you start it again, so on a production host arrange cover first. This is the right move: reading logs while it restarts every second is nearly impossible."}],"causes":[{"id":"always-fails","cause":"The process fails deterministically.","fix":"Read the journal. Restarting will never fix a configuration error.","confirm":""},{"id":"rate-limited","cause":"systemd hit the start limit.","fix":"Fix the failure, then systemctl reset-failed to clear the counter.","confirm":""},{"id":"dependency-not-ready","cause":"It starts before a dependency.","fix":"Order it properly, or add retry logic in the application.","confirm":""},{"id":"restartsec-too-short","cause":"RestartSec is very low.","fix":"Raise it. A tight loop makes diagnosis hard and wastes CPU.","confirm":""},{"id":"wrong-restart-policy","cause":"Restart=always hides real failures.","fix":"Use on-failure so a clean exit is respected.","confirm":""}],"verify":["The unit stays active.","The journal shows a clean start.","The underlying failure was fixed."],"escalate":["systemctl status output","Journal from one failed start","The restart policy settings"]},{"id":"linux-disk-io-slow","tier":"guide","technology":"Linux","category":"Performance","title":"Disk is slow and everything waits on it","summary":"High I/O wait with low CPU usage. Work is blocked on storage.","aliases":["io wait","slow disk","iostat","disk latency","high await","storage slow linux"],"source":"https://man7.org/linux/man-pages/man1/iostat.1.html","inputs":[],"steps":[{"title":"Measure per-device latency","cmd":"iostat -xz 2 3","risk":"safe","look":"The await column is average latency in milliseconds. Double digits on an SSD means something is wrong; hundreds means the device is saturated.","signals":[{"match":"await.*\\d{3,}\\.","means":"Latency in the hundreds of milliseconds. The device is saturated or failing.","goto":"cause:saturated"},{"match":"%util.*9\\d\\.","means":"Utilisation near 100%. The device has no headroom.","goto":"cause:saturated"}]},{"title":"Find which process is doing the I/O","cmd":"sudo iotop -b -n 2 -o 2>/dev/null | head -20","risk":"safe","look":"Per-process read and write rates. One process dominating is the usual answer."},{"title":"Check for processes blocked on I/O","cmd":"ps -eo state,pid,comm | grep '^D'","risk":"safe","look":"State D is uninterruptible sleep on I/O. Several of these confirm storage is the bottleneck rather than CPU."},{"title":"Check the device's health","cmd":"sudo smartctl -A /dev/sda 2>/dev/null | findstr /I \"reallocated pending error\"","risk":"safe","look":"Reallocated or pending sectors mean the disk is failing. Latency is a symptom and the priority becomes getting data off."}],"causes":[{"id":"saturated","cause":"The device is at its throughput limit.","fix":"Reduce I/O, or move to faster storage. More CPU will not help.","confirm":""},{"id":"one-process","cause":"A single process dominates.","fix":"Throttle it, or reschedule the work.","confirm":""},{"id":"failing-disk","cause":"The disk has reallocated sectors.","fix":"Replace it. Back up first; latency usually worsens.","confirm":""},{"id":"network-storage","cause":"The volume is network-attached.","fix":"Check the network path and any IOPS limit on the volume.","confirm":""},{"id":"swap-thrashing","cause":"The I/O is swap.","fix":"Follow the swap runbook. This is a memory problem wearing an I/O costume.","confirm":""}],"verify":["await is back to normal for the device type.","Processes are no longer stuck in D state."],"escalate":["iostat output over a minute","Which process dominates I/O","SMART attributes if physical"]}]</script>

const RISK={safe:["READ ONLY","c-safe"],state:["CHANGES STATE","c-state"],destructive:["DESTRUCTIVE","c-destructive"]};
const TECHS=[...new Set(BANK.map(r=>r.technology))].sort();
const catsOf=t=>[...new Set(BANK.filter(r=>r.technology===t).map(r=>r.category||"General"))].sort();
const inCat=(t,c)=>BANK.filter(r=>r.technology===t&&(r.category||"General")===c);

const flat=s=>String(s??"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
function score(r,q){if(!q.trim())return 1;const Q=flat(q),T=flat(r.title),A=(r.aliases||[]).map(flat);
  let s=0; if(T.includes(Q))s+=100; if(A.some(a=>a.includes(Q)||Q.includes(a)))s+=80;
  const hay=[T,flat(r.summary),A.join(" "),flat(r.category)].join(" ");
  for(const x of Q.split(" ").filter(y=>y.length>1)){
    if(T.includes(x))s+=18; else if(A.some(a=>a.includes(x)))s+=14; else if(hay.includes(x))s+=4;}
  return s;}
const results=q=>BANK.map(r=>({r,s:score(r,q)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.r);

/* ---------------- sidebar ---------------- */
function tree(){
  const q=$("#q").value, hits=results(q), searching=q.trim().length>0;
  if(!hits.length){$("#nav").innerHTML='<div class="nohit">Nothing matched. Try the exact error text.</div>';return;}
  const byT={};
  hits.forEach(r=>{const c=r.category||"General";
    (byT[r.technology]=byT[r.technology]||{}); (byT[r.technology][c]=byT[r.technology][c]||[]).push(r);});
  $("#nav").innerHTML=Object.keys(byT).sort().map(t=>{
    const n=Object.values(byT[t]).reduce((a,b)=>a+b.length,0);
    const to=searching||OPEN.t.has(t);
    return '<div class="tgroup'+(to?" open":"")+'" data-t="'+esc(t)+'">'+
      '<button class="thead"><span class="car">'+(to?"\u25BE":"\u25B8")+'</span>'+esc(t)+
      '<span class="ct">'+n+'</span></button><div class="tbody">'+
      Object.keys(byT[t]).sort().map(c=>{
        const co=searching||OPEN.c.has(t+"\u0001"+c);
        return '<div class="cgroup'+(co?" open":"")+'" data-t="'+esc(t)+'" data-c="'+esc(c)+'">'+
          '<button class="chead"><span class="car">'+(co?"\u25BE":"\u25B8")+'</span>'+esc(c)+
          '<span class="ct">'+byT[t][c].length+'</span></button><div class="cbody">'+
          byT[t][c].map(r=>'<button class="item'+(CUR&&CUR.id===r.id?" sel":"")+'" data-id="'+
            esc(r.id)+'">'+esc(r.title)+'</button>').join("")+'</div></div>';}).join("")+
      '</div></div>';}).join("");
  document.querySelectorAll(".thead").forEach(b=>b.onclick=()=>{
    const tech=b.closest(".tgroup").dataset.t;
    if(OPEN.t.has(tech)&&VIEW.k==="tech"&&VIEW.t===tech){OPEN.t.delete(tech);tree();}
    else{OPEN.t.add(tech);showTech(tech);}});
  document.querySelectorAll(".chead").forEach(b=>b.onclick=e=>{e.stopPropagation();
    const g=b.closest(".cgroup"), tech=g.dataset.t, cat=g.dataset.c, key=tech+"\u0001"+cat;
    if(OPEN.c.has(key)&&VIEW.k==="cat"&&VIEW.t===tech&&VIEW.c===cat){OPEN.c.delete(key);tree();}
    else{OPEN.t.add(tech);OPEN.c.add(key);showCat(tech,cat);}});
  document.querySelectorAll(".item").forEach(b=>b.onclick=()=>openRb(b.dataset.id));
}

/* ---------------- shared bits ---------------- */
function crumb(parts){
  $("#crumb").innerHTML=parts.map((p,i)=>i===parts.length-1
    ? '<b>'+esc(p.t)+'</b>'
    : '<button data-nav="'+esc(p.go)+'">'+esc(p.t)+'</button>').join(' &nbsp;\u203A&nbsp; ');
  document.querySelectorAll("#crumb button").forEach(b=>b.onclick=()=>{
    const g=b.dataset.nav;
    if(g==="home")home(); else if(g.indexOf("t:")===0)showTech(g.slice(2));
    else{const x=g.slice(2).split("\u0001");showCat(x[0],x[1]);}});
}
const card=r=>'<button class="lrow" data-id="'+esc(r.id)+'"><h4>'+esc(r.title)+'</h4>'+
  '<p>'+esc(r.summary)+'</p><span class="m"><span>'+r.steps.length+' steps</span><span>'+
  r.steps.reduce((a,s)=>a+(s.signals||[]).length,0)+' branches</span><span>'+
  r.causes.length+' causes</span></span></button>';
function wireRows(){document.querySelectorAll(".lrow").forEach(b=>b.onclick=()=>openRb(b.dataset.id));}

/* ---------------- views ---------------- */
function home(){
  CUR=null; VIEW={k:"home"}; $("#fields").innerHTML=""; $("#crumb").innerHTML="";
  const st=BANK.reduce((a,r)=>a+r.steps.length,0);
  const br=BANK.reduce((a,r)=>a+r.steps.reduce((b,s)=>b+(s.signals||[]).length,0),0);
  const cz=BANK.reduce((a,r)=>a+r.causes.length,0);
  $("#pane").innerHTML='<div class="hero"><h2>What is broken?</h2>'+
    '<p>Search the symptom, the error string, or what you were doing when it failed. Every runbook gives '+
    'the checks in order, what each output means, and where to go next.</p><div class="stats">'+
    '<div class="stat"><b>'+BANK.length+'</b><span>runbooks</span></div>'+
    '<div class="stat"><b>'+st+'</b><span>diagnostic steps</span></div>'+
    '<div class="stat"><b>'+br+'</b><span>decision branches</span></div>'+
    '<div class="stat"><b>'+cz+'</b><span>ranked causes</span></div>'+
    '<div class="stat"><b>'+TECHS.length+'</b><span>technologies</span></div></div><div class="cards">'+
    TECHS.map(t=>'<button class="card" data-tech="'+esc(t)+'"><h3>'+esc(t)+'</h3><p>'+
      BANK.filter(r=>r.technology===t).length+' runbooks across '+catsOf(t).length+
      ' sections</p></button>').join("")+'</div>'+
    '<p class="src" style="margin-top:30px">Runs entirely in this one file. Nothing is sent anywhere, '+
    'nothing is executed for you, and nothing is saved when you close the tab.</p></div>';
  document.querySelectorAll(".card").forEach(b=>b.onclick=()=>showTech(b.dataset.tech));
  window.scrollTo(0,0); tree();
}

function showTech(t){
  CUR=null; VIEW={k:"tech",t:t}; OPEN.t.add(t); $("#fields").innerHTML="";
  crumb([{t:"All technologies",go:"home"},{t:t}]);
  const cs=catsOf(t);
  $("#pane").innerHTML='<div class="hero"><h2>'+esc(t)+'</h2><p>'+
    BANK.filter(r=>r.technology===t).length+' runbooks across '+cs.length+
    ' sections. Pick a section, or search above.</p><div class="cards">'+
    cs.map(c=>'<button class="card" data-c="'+esc(c)+'"><h3>'+esc(c)+'</h3><p>'+
      inCat(t,c).length+' runbooks</p></button>').join("")+'</div></div>';
  document.querySelectorAll(".card").forEach(b=>b.onclick=()=>showCat(t,b.dataset.c));
  window.scrollTo(0,0); tree();
}

function showCat(t,c){
  CUR=null; VIEW={k:"cat",t:t,c:c}; OPEN.t.add(t); OPEN.c.add(t+"\u0001"+c); $("#fields").innerHTML="";
  crumb([{t:"All technologies",go:"home"},{t:t,go:"t:"+t},{t:c}]);
  $("#pane").innerHTML='<div class="hero"><h2>'+esc(c)+'</h2><p>'+esc(t)+' \u00B7 '+
    inCat(t,c).length+' runbooks</p></div><div class="list">'+inCat(t,c).map(card).join("")+'</div>';
  wireRows(); window.scrollTo(0,0); tree();
}

function showSearch(q){
  CUR=null; VIEW={k:"search"}; $("#fields").innerHTML="";
  const hits=results(q);
  crumb([{t:"All technologies",go:"home"},{t:'Search: "'+q+'"'}]);
  $("#pane").innerHTML='<div class="hero"><h2>'+hits.length+' result'+(hits.length===1?"":"s")+
    '</h2><p>Matching &ldquo;'+esc(q)+'&rdquo; across '+TECHS.length+' technologies.</p></div>'+
    (hits.length?'<div class="list">'+hits.slice(0,80).map(card).join("")+'</div>'
      :'<p class="src">Nothing matched. Try the exact error string from your terminal, or a plainer phrase.</p>');
  wireRows(); window.scrollTo(0,0); tree();
}

/* ---------------- runbook ---------------- */
function fill(cmd,html){return cmd.replace(/\{([a-z0-9_]+)\}/g,(m,k)=>{const v=CTX[k];
  return !html?(v||m):(v?'<span class="fill">'+esc(v)+'</span>':'<span class="un">'+esc(m)+'</span>');});}
function repaint(){document.querySelectorAll("[data-cmd]").forEach(e=>e.innerHTML=fill(e.dataset.cmd,true));}

function openRb(id){
  CUR=BANK.find(r=>r.id===id); if(!CUR)return;
  VIEW={k:"rb",t:CUR.technology,c:CUR.category||"General"};
  OPEN.t.add(VIEW.t); OPEN.c.add(VIEW.t+"\u0001"+VIEW.c);
  (CUR.inputs||[]).forEach(i=>{if(!(i.key in CTX))CTX[i.key]="";});
  $("#fields").innerHTML=(CUR.inputs||[]).map(i=>'<label>'+esc(i.label)+
    '<input data-k="'+esc(i.key)+'" placeholder="'+esc(i.example||"")+'" value="'+esc(CTX[i.key]||"")+'"></label>').join("");
  document.querySelectorAll("#fields input").forEach(x=>x.oninput=()=>{CTX[x.dataset.k]=x.value.trim();repaint();});
  crumb([{t:"All technologies",go:"home"},{t:CUR.technology,go:"t:"+CUR.technology},
         {t:VIEW.c,go:"c:"+CUR.technology+"\u0001"+VIEW.c},{t:CUR.title}]);

  const steps=(CUR.steps||[]).map((s,i)=>{
    const Rk=RISK[s.risk]||RISK.safe, dz=s.risk==="destructive";
    const body=dz?'<div class="veil" data-rv="'+i+'">\u25B8 Command hidden. Read the warning, then tap to reveal.</div>'
      :'<pre data-cmd="'+esc(s.cmd)+'"></pre><button class="cp" data-cp="'+i+'">Copy</button>';
    const br=(s.signals||[]).length?'<div class="br"><div class="brh">WHAT YOU MIGHT SEE</div>'+
      s.signals.map(g=>{const gt=g.goto||"";let nx="";
        if(gt.indexOf("cause:")===0){const k=(CUR.causes||[]).findIndex(x=>x.id===gt.slice(6));
          if(k>=0)nx='<span class="goto">\u2192 cause '+(k+1)+'</span>';}
        else if(gt.indexOf("step:")===0)nx='<span class="goto">\u2192 step '+gt.slice(5)+'</span>';
        return '<div class="brow"><div class="bif"><b>IF YOU SEE</b><code>'+esc(plain(g.match))+
          '</code></div><div class="bthen">'+esc(g.means)+' '+nx+'</div></div>';}).join("")+'</div>':"";
    return '<li class="step'+(dz?" d":"")+'"><div class="num">'+(i+1)+'</div><div class="sh">'+
      '<span class="st">'+esc(s.title)+'</span><span class="chip '+Rk[1]+'">'+Rk[0]+'</span></div>'+
      (s.note?'<p class="note'+(s.risk==="state"?" s":"")+'">'+esc(s.note)+'</p>':"")+
      '<div class="cmd">'+body+'</div><p class="look">'+esc(s.look)+'</p>'+br+'</li>';}).join("");
  const cz=(CUR.causes||[]).map((c,i)=>'<div class="cz"><div class="rk">'+(i+1)+'</div><div>'+
    '<div class="w">'+esc(c.cause)+'</div><div class="fx"><b>Fix.</b> '+esc(c.fix)+'</div></div></div>').join("");

  $("#pane").innerHTML='<div class="rb"><h2>'+esc(CUR.title)+'</h2><p class="sum">'+esc(CUR.summary)+'</p>'+
    '<div class="tags">'+(CUR.aliases||[]).slice(0,7).map(a=>'<span class="tag">'+esc(a)+'</span>').join("")+'</div>'+
    '<p class="src">Commands vary by version and environment \u2014 read each one before you run it.'+
    (CUR.source?' <a href="'+esc(CUR.source)+'" target="_blank" rel="noopener">Official documentation \u2197</a>':"")+'</p>'+
    '<ol class="steps">'+steps+'</ol>'+
    (cz?'<div class="sec"><h3>LIKELY CAUSES \u2014 MOST COMMON FIRST</h3>'+cz+'</div>':"")+
    ((CUR.verify||[]).length?'<div class="sec"><h3>YOU ARE DONE WHEN</h3><ul class="pl">'+
      CUR.verify.map(v=>'<li>'+esc(fill(v,false))+'</li>').join("")+'</ul></div>':"")+
    ((CUR.escalate||[]).length?'<div class="sec"><h3>IF YOU HAND THIS OVER, INCLUDE</h3><ul class="pl">'+
      CUR.escalate.map(v=>'<li>'+esc(fill(v,false))+'</li>').join("")+'</ul></div>':"")+'</div>';
  window.scrollTo(0,0); repaint();
  document.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>{
    const x=fill(CUR.steps[+b.dataset.cp].cmd,false);
    navigator.clipboard.writeText(x).then(()=>{const e=$("#toast");e.textContent="Command copied";
      e.style.display="block";setTimeout(()=>e.style.display="none",1500);},()=>prompt("Copy:",x));});
  document.querySelectorAll("[data-rv]").forEach(v=>v.onclick=()=>{
    const i=+v.dataset.rv,s=CUR.steps[i];
    v.outerHTML='<pre data-cmd="'+esc(s.cmd)+'"></pre><button class="cp" data-cp="'+i+'">Copy</button>';
    repaint();openRbRewire();});
  tree(); document.body.classList.remove("nav");
}
function openRbRewire(){document.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>{
  const x=fill(CUR.steps[+b.dataset.cp].cmd,false);
  navigator.clipboard.writeText(x).then(()=>{const e=$("#toast");e.textContent="Command copied";
    e.style.display="block";setTimeout(()=>e.style.display="none",1500);},()=>prompt("Copy:",x));});}

/* ---------------- wiring ---------------- */
let tmr=null;
$("#q").oninput=()=>{clearTimeout(tmr);tmr=setTimeout(()=>{
  const q=$("#q").value; if(q.trim())showSearch(q); else home();},180);};
$("#brandbtn").onclick=()=>{$("#q").value="";home();};
$("#burger").onclick=()=>document.body.classList.toggle("nav");
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&document.activeElement!==$("#q")){e.preventDefault();$("#q").focus();$("#q").select();}
  if(e.key==="Escape"){
    if(VIEW.k==="rb")showCat(VIEW.t,VIEW.c);
    else if(VIEW.k==="cat")showTech(VIEW.t);
    else{$("#q").value="";home();}}});
home();
</script>
</body>
</html>
