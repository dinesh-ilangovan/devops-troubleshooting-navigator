the default does not apply.","confirm":""},{"id":"no-requests","cause":"The quota requires requests and the pod declares none.","fix":"With a compute quota, every pod must declare requests. Add them or add a LimitRange.","confirm":""}],"verify":["New pods are admitted.","Used sits comfortably below Hard.","Requests reflect real needs rather than defaults."],"escalate":["describe resourcequota output","Any LimitRange in the namespace","Requests across existing pods"]},{"id":"k8s-apiserver-unreachable","tier":"guide","technology":"Kubernetes","category":"Access & RBAC","title":"kubectl cannot reach the cluster","summary":"Connection refused or timeout before any authentication happens.","aliases":["cannot connect to cluster","connection refused kubectl","unable to connect to the server","kubeconfig","no such host kubectl","i/o timeout apiserver"],"source":"https://kubernetes.io/docs/tasks/access-application-cluster/configure-access-multiple-clusters/","inputs":[],"steps":[{"title":"Read the exact connection error","cmd":"kubectl cluster-info","risk":"safe","look":"Refused, timeout and no-such-host are three different problems. The wording tells you which.","signals":[{"match":"(?i)no such host|could not resolve","means":"DNS cannot resolve the API server name.","goto":"cause:dns"},{"match":"(?i)connection refused","means":"Reached the host, nothing listening on the port.","goto":"cause:not-listening"},{"match":"(?i)i/o timeout","means":"No response at all, usually a firewall or missing VPN.","goto":"cause:firewall"},{"match":"(?i)x509|certificate","means":"TLS problem with the cluster certificate.","goto":"cause:cert"}]},{"title":"Check which context is active","cmd":"kubectl config current-context && kubectl config view --minify","risk":"safe","look":"The server URL in use. A stale context pointing at a deleted cluster produces exactly this and is very common with multiple clusters."},{"title":"Test the endpoint directly","cmd":"curl -k -sS -i https://<server-from-above>/version | findstr HTTP","risk":"safe","look":"A 401 or 403 is good news: the server is reachable and the problem is credentials. No response at all is network."},{"title":"Check the VPN or bastion requirement","cmd":"ipconfig | findstr /C:\"VPN\" ","risk":"safe","look":"Private clusters are only reachable over VPN or through a bastion. This is the most common cause of a sudden timeout that worked yesterday."}],"causes":[{"id":"dns","cause":"The API server name does not resolve.","fix":"Check the URL in the kubeconfig. Private clusters often resolve only over VPN.","confirm":""},{"id":"not-listening","cause":"Nothing is listening on that port.","fix":"Check the cluster exists and the endpoint is right. A deleted cluster leaves a working kubeconfig.","confirm":""},{"id":"firewall","cause":"Traffic is blocked.","fix":"Connect the VPN, or add your IP to the authorised networks list.","confirm":""},{"id":"cert","cause":"TLS verification fails against the cluster certificate.","fix":"Refresh the kubeconfig from the provider. Certificates rotate.","confirm":""},{"id":"expired-token","cause":"The credential expired.","fix":"Re-authenticate. Cloud kubeconfigs use short-lived tokens fetched by an exec plugin.","confirm":""},{"id":"wrong-context","cause":"The active context points elsewhere.","fix":"kubectl config use-context with the right name.","confirm":""}],"verify":["kubectl get nodes returns.","The active context is the intended cluster.","It works from a fresh shell."],"escalate":["The exact connection error","Active context and server URL","Whether the endpoint responds to curl"]},{"id":"k8s-probe-failing","tier":"guide","technology":"Kubernetes","category":"Pods & Containers","title":"Readiness or liveness probe keeps failing","summary":"The container runs but the probe says otherwise, so it is removed from service or restarted.","aliases":["readiness probe failed","liveness probe failed","probe failing","0/1 ready","unhealthy probe","connection refused probe"],"source":"https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/","inputs":[{"key":"pod","label":"Pod","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the probe failure events","cmd":"kubectl describe pod {pod} -n {namespace} | findstr /C:\"probe\"","risk":"safe","look":"Which probe and what it reported. Liveness failures restart the container; readiness failures only remove it from endpoints.","signals":[{"match":"(?i)connection refused","means":"Nothing is listening on the probe port.","goto":"cause:not-listening"},{"match":"(?i)HTTP probe failed with statuscode: 404","means":"The probe path does not exist.","goto":"cause:wrong-path"},{"match":"(?i)statuscode: 5","means":"The endpoint exists and reports an error.","goto":"cause:app-unhealthy"},{"match":"(?i)timeout|context deadline","means":"The endpoint is too slow for timeoutSeconds.","goto":"cause:too-slow"}]},{"title":"Read the probe configuration","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].readinessProbe}{\"|\"}{.spec.containers[*].livenessProbe}'","risk":"safe","look":"Path, port, initialDelaySeconds, timeoutSeconds and thresholds. A timeout of one second against an endpoint that touches a database is a recipe for flapping."},{"title":"Call the probe endpoint from inside the pod","cmd":"kubectl exec {pod} -n {namespace} -- wget -qO- http://localhost:<port><path>","risk":"safe","look":"What the kubelet would see. Working here but failing as a probe usually means the port or path in the spec is wrong."},{"title":"Check whether it needs a startup probe instead","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].startupProbe}'","risk":"safe","look":"A slow-starting app killed by liveness during boot should use a startupProbe. Inflating the liveness delay to compensate weakens it for the whole lifetime."}],"causes":[{"id":"not-listening","cause":"Nothing listens on the probe port.","fix":"Check the port matches and the app binds 0.0.0.0 rather than localhost.","confirm":""},{"id":"wrong-path","cause":"The probe path returns 404.","fix":"Point it at a real endpoint. A trailing slash can matter.","confirm":""},{"id":"app-unhealthy","cause":"The endpoint reports an error.","fix":"The probe is correct. Fix the application.","confirm":""},{"id":"too-slow","cause":"The endpoint is slower than timeoutSeconds.","fix":"Raise the timeout, or make the health check lightweight. It should not query the database.","confirm":""},{"id":"slow-start","cause":"The app needs longer to boot than initialDelaySeconds.","fix":"Use a startupProbe. That is exactly what it exists for.","confirm":""},{"id":"liveness-too-strict","cause":"Liveness restarts a container that is merely busy.","fix":"Liveness should detect deadlock, not load. Most services need only readiness.","confirm":""}],"verify":["The container reports Ready and stays Ready.","No probe failure events during normal load.","Liveness is not restarting a healthy container."],"escalate":["Probe failure events","The probe configuration","Result of calling the endpoint from inside the pod"]},{"id":"k8s-pvc-cannot-mount","tier":"guide","technology":"Kubernetes","category":"Storage","title":"Volume bound but pod cannot mount it","summary":"The PVC is Bound yet the pod fails with a mount or attach error.","aliases":["failedmount","unable to attach or mount","volume attach failed","multi-attach error","mount timeout","cannot mount volume"],"source":"https://kubernetes.io/docs/concepts/storage/persistent-volumes/","inputs":[{"key":"pod","label":"Pod","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the mount failure event","cmd":"kubectl describe pod {pod} -n {namespace} | findstr /C:\"FailedMount\" /C:\"FailedAttach\" -A3","risk":"safe","look":"The message names the volume and the reason. Multi-Attach, timeout and permission are three different fixes.","signals":[{"match":"(?i)Multi-Attach error","means":"The volume is still attached to another node.","goto":"cause:multi-attach"},{"match":"(?i)timed out waiting for the condition","means":"The attach never completed, usually a CSI driver problem.","goto":"cause:csi-stuck"},{"match":"(?i)permission denied","means":"Mounted, but the container's user cannot write to it.","goto":"cause:fsgroup"}]},{"title":"Find where the volume is currently attached","cmd":"kubectl get volumeattachment | findstr <pv-name>","risk":"safe","look":"Which node holds it. A ReadWriteOnce volume can only attach to one node at a time, which is the cause of every Multi-Attach error."},{"title":"Check the CSI driver pods are healthy","cmd":"kubectl get pods -n kube-system | findstr csi","risk":"safe","look":"The driver's node plugin must be running on the target node. A crashed node plugin makes every mount on that node hang."},{"title":"Check the access mode against the workload","cmd":"kubectl get pvc -n {namespace} -o jsonpath='{.items[*].spec.accessModes}'","risk":"safe","look":"ReadWriteOnce with a multi-replica Deployment is a guaranteed Multi-Attach failure during any rolling update."}],"causes":[{"id":"multi-attach","cause":"A ReadWriteOnce volume is attached elsewhere.","fix":"Ensure the old pod is fully gone. Use Recreate rather than RollingUpdate for single-writer volumes.","confirm":""},{"id":"csi-stuck","cause":"The CSI driver cannot complete the attach.","fix":"Check the driver's node plugin logs on the target node.","confirm":""},{"id":"fsgroup","cause":"The container user cannot write to the mount.","fix":"Set fsGroup in the pod security context so the volume is chowned on mount.","confirm":""},{"id":"node-limit","cause":"The node has reached its volume attachment limit.","fix":"Cloud providers cap attachments per instance. Spread the pods or use larger nodes.","confirm":""},{"id":"zone-mismatch","cause":"The volume is in a different zone than the node.","fix":"Use a topology-aware StorageClass with WaitForFirstConsumer.","confirm":""}],"verify":["The pod mounts and starts.","No FailedMount events remain.","The access mode matches how the workload actually runs."],"escalate":["The FailedMount message","Which node holds the volume attachment","CSI driver pod status on the target node"]},{"id":"k8s-wrong-container-logs","tier":"guide","technology":"Kubernetes","category":"Observability","title":"kubectl logs returns nothing or the wrong thing","summary":"You cannot see the output you need, so you are debugging blind.","aliases":["logs empty kubectl","no logs pod","choose a container","previous terminated container","logs not found","cannot read logs"],"source":"https://kubernetes.io/docs/reference/generated/kubectl/kubectl-commands#logs","inputs":[{"key":"pod","label":"Pod","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"List every container in the pod","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].name}{\" init: \"}{.spec.initContainers[*].name}'","risk":"safe","look":"A multi-container pod requires -c. Without it kubectl picks the first container, which in a service mesh is often the sidecar rather than your app.","signals":[{"match":"istio-proxy|linkerd-proxy|envoy","means":"A service mesh sidecar is present. The default container may be the proxy.","goto":"cause:sidecar-default"}]},{"title":"Read the previous instance for a restarting container","cmd":"kubectl logs {pod} -n {namespace} --previous --tail=100","risk":"safe","look":"For a crash loop, the current container has barely started. The previous one holds the failure."},{"title":"Check the container has started at all","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.status.containerStatuses[*].state}'","risk":"safe","look":"A container in Waiting has produced no logs because it has not run. That is not a logging problem."},{"title":"Check for a log rotation or collector taking them","cmd":"kubectl logs {pod} -n {namespace} --timestamps --tail=5","risk":"safe","look":"Timestamps reveal whether output is recent. The kubelet rotates container logs and only the current file is available through kubectl."}],"causes":[{"id":"multi-container","cause":"The pod has several containers.","fix":"Use -c with the container name. --all-containers works for a quick look.","confirm":""},{"id":"sidecar-default","cause":"The default container is a mesh sidecar.","fix":"Name your app container explicitly, or set the default-container annotation on the pod.","confirm":""},{"id":"not-started","cause":"The container has not run.","fix":"Nothing to read. Follow the Init or CrashLoop runbook.","confirm":""},{"id":"rotated","cause":"The kubelet rotated the log file.","fix":"Only the current file is available. Ship logs to a collector if you need history.","confirm":""},{"id":"writes-to-file","cause":"The app writes to a file inside the container.","fix":"Only stdout and stderr reach kubectl logs. Reconfigure the app.","confirm":""}],"verify":["You can read the output you need.","For a crash loop you have the previous container's logs.","The right container is being read."],"escalate":["Container names in the pod","Whether the container has started","Whether the app logs to stdout"]}]</script>
<script>
"use strict";
const BANK = JSON.parse(document.getElementById("data").textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- session state (in memory only; nothing is persisted) ---------- */
const CTX = {};                 // placeholder key -> value
let CUR = null;                 // open runbook
let LOG = [];                   // [{t, step, cmd, note}]
let CURSOR = -1;                // keyboard cursor in results

/* ---------- search ---------- */
const flat = s => String(s ?? "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
function score(r, q) {
  if (!q.trim()) return 1;
  const qq = flat(q), qt = qq.split(" ").filter(t => t.length > 1);
  const title = flat(r.title), al = (r.aliases || []).map(flat);
  let s = 0;
  if (title.includes(qq)) s += 100;
  if (al.some(a => a.includes(qq) || qq.includes(a))) s += 80;
  const hay = [title, flat(r.summary), al.join(" "), flat(r.category)].join(" ");
  for (const t of qt) {
    if (title.includes(t)) s += 18;
    else if (al.some(a => a.includes(t))) s += 14;
    else if (hay.includes(t)) s += 4;
  }
  return s;
}

let TECH = "All", CAT = "All";

function renderChips() {
  const techs = [...new Set(BANK.map(r => r.technology))].sort();
  $("#techchips").innerHTML = ["All", ...techs].map(t => {
    const n = t === "All" ? BANK.length : BANK.filter(r => r.technology === t).length;
    return `<button class="tab${t === TECH ? " on" : ""}" data-t="${esc(t)}">${esc(t)}<span class="n">${n}</span></button>`;
  }).join("");
  document.querySelectorAll("#techchips .tab").forEach(b => b.onclick = () => {
    TECH = b.dataset.t; CAT = "All"; renderChips(); renderResults();
  });

  const pool = TECH === "All" ? BANK : BANK.filter(r => r.technology === TECH);
  const cats = [...new Set(pool.map(r => r.category).filter(Boolean))].sort();
  $("#catchips").innerHTML = cats.length > 1
    ? ["All", ...cats].map(c =>
        `<button class="tab${c === CAT ? " on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")
    : "";
  document.querySelectorAll("#catchips .tab").forEach(b => b.onclick = () => {
    CAT = b.dataset.c; renderChips(); renderResults();
  });
}

function renderResults() {
  const q = $("#q").value;
  let pool = BANK;
  if (TECH !== "All") pool = pool.filter(r => r.technology === TECH);
  if (CAT !== "All") pool = pool.filter(r => r.category === CAT);
  const arr = pool.map(r => ({ r, s: score(r, q) })).filter(x => x.s > 0)
                  .sort((a, b) => b.s - a.s).slice(0, 60);
  CURSOR = arr.length ? 0 : -1;
  $("#results").innerHTML = arr.length ? arr.map((x, i) => {
    const r = x.r;
    return `<li><button class="hit${i === 0 ? " cur" : ""}" data-id="${esc(r.id)}">
      <h3>${esc(r.title)}</h3><p>${esc(r.summary)}</p>
      <span class="meta">
        <span>${esc(r.technology)}</span>
        <span>${esc(r.category || "")}</span>
        <span>${(r.steps || []).length} steps</span>
        <span>${(r.causes || []).length} causes</span>
      </span></button></li>`;
  }).join("") : `<li class="empty">Nothing matched. Try the exact error string from your terminal,
    or a plainer phrase like "pod won't start".</li>`;
  document.querySelectorAll(".hit").forEach(b => b.onclick = () => open(b.dataset.id));
}

/* ---------- placeholder substitution ---------- */
function fill(cmd, asHtml) {
  return cmd.replace(/\{([a-z0-9_]+)\}/g, (m, k) => {
    const v = CTX[k];
    if (!asHtml) return v || m;
    return v ? `<span class="fill">${esc(v)}</span>`
             : `<span class="unfilled">${esc(m)}</span>`;
  });
}

function ctxBar() {
  const keys = (CUR && CUR.inputs) || [];
  $("#ctxfields").innerHTML = keys.map(i =>
    `<label>${esc(i.label)}<input data-k="${esc(i.key)}" placeholder="${esc(i.example || "")}"
      value="${esc(CTX[i.key] || "")}" size="${Math.max(8, (i.example || "").length)}"></label>`).join("");
  document.querySelectorAll("#ctxfields input").forEach(inp => {
    inp.oninput = () => { CTX[inp.dataset.k] = inp.value.trim(); repaintCmds(); };
  });
}

function repaintCmds() {
  document.querySelectorAll("[data-cmd]").forEach(el => {
    el.innerHTML = fill(el.dataset.cmd, true);
  });
}

/* ---------- runbook view ---------- */
function open(id) {
  CUR = BANK.find(r => r.id === id);
  if (!CUR) return;
  LOG = [];
  (CUR.inputs || []).forEach(i => { if (!(i.key in CTX)) CTX[i.key] = ""; });
  ctxBar();

  const RISK = { safe: ["Read only", "c-safe"], state: ["Changes state", "c-state"],
                 destructive: ["Destructive", "c-destructive"] };

  const steps = (CUR.steps || []).map((s, i) => {
    const [label, cls] = RISK[s.risk] || RISK.safe;
    const danger = s.risk === "destructive";
    const body = danger
      ? `<div class="veil" data-reveal="${i}">Command hidden. Read the warning, then tap to reveal.</div>`
      : `<pre data-cmd="${esc(s.cmd)}"></pre><button class="copy" data-copy="${i}">Copy</button>`;
    const note = s.note ? `<p class="note${s.risk === "state" ? " note-state" : ""}">${esc(s.note)}</p>` : "";
    const sig = (s.signals || []).length
      ? `<details class="match"><summary>Paste your actual output to read it</summary>
           <textarea data-sig="${i}" placeholder="Paste the output you got, then release the key."></textarea>
           <div class="verdict miss" data-verdict="${i}">Nothing matched yet. Paste output above.</div>
         </details>` : "";
    return `<li class="step${danger ? " danger" : ""}" data-step="${i}">
      <button class="mark" data-done="${i}" aria-label="Mark step ${i + 1} done">${i + 1}</button>
      <div class="shead"><span class="stitle">${esc(s.title)}</span>
        <span class="chip ${cls}">${label}</span></div>
      ${note}
      <div class="cmd">${body}</div>
      <p class="look">${esc(s.look)}</p>
      ${sig}</li>`;
  }).join("");

  const causes = (CUR.causes || []).map((c, i) =>
    `<div class="cause" data-cause="${esc(c.id)}">
       <div><span class="rank">${i + 1}</span><span class="what">${esc(c.cause)}</span></div>
       <div class="fix"><b>Fix.</b> ${esc(c.fix)}</div></div>`).join("");

  const prov = `Commands vary by version and environment — read each one before you run it.`
    + (CUR.source ? ` <a href="${esc(CUR.source)}" target="_blank" rel="noopener">Official documentation</a>` : "");

  $("#rbview").innerHTML = `
    <button class="back" id="back">&larr; All runbooks</button>
    <h2>${esc(CUR.title)}</h2>
    <p class="sum">${esc(CUR.summary)}</p>
    <p class="prov">${prov}</p>
    <ol class="steps">${steps}</ol>
    ${causes ? `<div class="sec"><h3>Likely causes, most common first</h3>${causes}</div>` : ""}
    ${(CUR.verify || []).length ? `<div class="sec"><h3>You are done when</h3>
       <ul class="plain">${CUR.verify.map(v => `<li>${esc(fill(v, false))}</li>`).join("")}</ul></div>` : ""}`;

  $("#searchview").style.display = "none";
  $("#results").style.display = "none";
  $("#rbview").style.display = "block";
  $("#bar").style.display = "block";
  $("#foot").textContent = "";
  window.scrollTo(0, 0);
  repaintCmds(); wire(); progress();
}

function wire() {
  $("#back").onclick = home;

  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => {
    const s = CUR.steps[+b.dataset.copy];
    copy(fill(s.cmd, false), "Command copied");
  });

  document.querySelectorAll("[data-reveal]").forEach(v => v.onclick = () => {
    const i = +v.dataset.reveal, s = CUR.steps[i];
    v.outerHTML = `<pre data-cmd="${esc(s.cmd)}"></pre><button class="copy" data-copy="${i}">Copy</button>`;
    repaintCmds(); wire();
  });

  document.querySelectorAll("[data-done]").forEach(b => b.onclick = () => {
    const i = +b.dataset.done, li = b.closest(".step"), s = CUR.steps[i];
    li.classList.toggle("done");
    if (li.classList.contains("done")) {
      LOG.push({ t: new Date().toISOString().slice(11, 19), step: s.title, cmd: fill(s.cmd, false) });
    } else {
      LOG = LOG.filter(e => e.step !== s.title);
    }
    progress();
  });

  document.querySelectorAll("[data-sig]").forEach(ta => ta.oninput = () => {
    const i = +ta.dataset.sig, s = CUR.steps[i], text = ta.value;
    const out = $(`[data-verdict="${i}"]`);
    document.querySelectorAll(".cause").forEach(c => c.classList.remove("lit"));
    if (!text.trim()) {
      out.className = "verdict miss";
      out.textContent = "Nothing matched yet. Paste output above.";
      return;
    }
    const m = (s.signals || []).find(g => {
      const pat = String(g.match || "").replace(/^\(\?[imsx]+\)/, "");
      if (!pat) return false;
      try { return new RegExp(pat, "i").test(text); }
      catch (e) { console.warn("signal regex failed:", g.match, e.message); return false; }
    });
    if (!m) {
      out.className = "verdict miss";
      out.textContent = "No known signature in that output. It may still be fine — read the note above, "
        + "or add this output as a new signal so the next person gets a hit.";
      return;
    }
    out.className = "verdict hit";
    const target = m.goto || "";
    out.innerHTML = `<b>That output means:</b>${esc(m.means)}`;
    if (target.startsWith("cause:")) {
      const c = (CUR.causes || []).find(x => x.id === target.slice(6));
      const el = $(`[data-cause="${CSS.escape(target.slice(6))}"]`);
      if (el) el.classList.add("lit");
      if (c) out.innerHTML += `<button class="jump">Go to the fix: ${esc(c.cause)}</button>`;
      out.querySelector(".jump") && (out.querySelector(".jump").onclick =
        () => el && el.scrollIntoView({ behavior: "smooth", block: "center" }));
    } else if (target.startsWith("step:")) {
      const n = +target.slice(5);
      out.innerHTML += `<button class="jump">Go to step ${n}</button>`;
      out.querySelector(".jump").onclick = () =>
        document.querySelector(`[data-step="${n - 1}"]`).scrollIntoView({ behavior: "smooth", block: "center" });
    }
    LOG.push({ t: new Date().toISOString().slice(11, 19), step: s.title,
               cmd: fill(s.cmd, false), note: m.means });
  });
}

function progress() {
  const total = (CUR.steps || []).length;
  const done = document.querySelectorAll(".step.done").length;
  $("#prog").textContent = `${done} of ${total} checks done`;
}

/* ---------- exports ---------- */
function copy(t, msg) {
  navigator.clipboard.writeText(t).then(() => {
    const el = $("#toast"); el.textContent = msg; el.style.display = "block";
    setTimeout(() => el.style.display = "none", 1600);
  }, () => prompt("Copy manually:", t));
}

$("#a-safe").onclick = () => {
  const c = (CUR.steps || []).filter(s => s.risk === "safe").map(s => `# ${s.title}\n${fill(s.cmd, false)}`);
  copy(c.join("\n\n"), `${c.length} read-only commands copied`);
};

$("#a-esc").onclick = () => {
  const L = [`## ${CUR.title}`, "", "**What I checked**"];
  LOG.forEach(e => { L.push(`- ${e.step} — \`${e.cmd}\``); if (e.note) L.push(`  - saw: ${e.note}`); });
  if (!LOG.length) L.push("- (nothing recorded yet)");
  L.push("", "**Still needed**");
  (CUR.escalate || []).forEach(x => L.push(`- ${fill(x, false)}`));
  copy(L.join("\n"), "Handoff notes copied");
};

$("#a-log").onclick = () => {
  const L = [`# Incident: ${CUR.title}`, `Runbook: ${CUR.id} (verified ${CUR.verified_on || "n/a"})`, ""];
  Object.entries(CTX).filter(([, v]) => v).forEach(([k, v]) => L.push(`- ${k}: \`${v}\``));
  L.push("", "| time | check | command | observed |", "|---|---|---|---|");
  LOG.forEach(e => L.push(`| ${e.t} | ${e.step} | \`${e.cmd}\` | ${e.note || ""} |`));
  if (!LOG.length) L.push("| | no checks recorded | | |");
  copy(L.join("\n"), "Incident log copied as markdown");
};

/* ---------- navigation ---------- */
function home() {
  CUR = null; LOG = [];
  $("#searchview").style.display = "block";
  $("#results").style.display = "block";
  $("#rbview").style.display = "none";
  $("#bar").style.display = "none";
  $("#ctxfields").innerHTML = "";
  $("#foot").textContent = FOOT;
  $("#q").focus(); $("#q").select();
}

$("#q").oninput = renderResults;

document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); $("#q").select(); return; }
  if (e.key === "Escape" && CUR) { home(); return; }
  if (CUR || !["ArrowDown", "ArrowUp", "Enter"].includes(e.key)) return;
  const hits = [...document.querySelectorAll(".hit")];
  if (!hits.length) return;
  if (e.key === "Enter") { e.preventDefault(); hits[Math.max(0, CURSOR)].click(); return; }
  e.preventDefault();
  hits[CURSOR]?.classList.remove("cur");
  CURSOR = (CURSOR + (e.key === "ArrowDown" ? 1 : -1) + hits.length) % hits.length;
  hits[CURSOR].classList.add("cur");
  hits[CURSOR].scrollIntoView({ block: "nearest" });
});

const techs = [...new Set(BANK.map(r => r.technology))].sort();
const FOOT = `${BANK.length} runbooks across ${techs.length} technologies: ${techs.join(", ")}. `
  + `Runs entirely in this file — nothing is sent anywhere, nothing is executed for you, `
  + `and nothing is saved when you close the tab. Every command is yours to run.\n\n`
  + `Designed and built by Dinesh Ilangovan.`;
$("#foot").textContent = FOOT;
renderChips();
renderResults();
</script>
