<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Runbook</title>
<style>
:root{
  --paper:#EEF1F4; --surface:#fff; --ink:#141C24; --muted:#5A6976;
  --rule:#D5DCE3; --rule-soft:#E4E9ED;
  --safe:#0F7B54; --state:#A15C00; --destructive:#BC2C24;
  --focus:#1F5FA8;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --mono:"Cascadia Mono",ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.5;font-feature-settings:"tnum" 1}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:940px;margin:0 auto;padding:0 20px}

/* ---- context strip ---- */
.ctx{background:var(--ink);color:#DCE3EA;position:sticky;top:0;z-index:20}
.ctx .wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding-top:9px;padding-bottom:9px}
.ctx .brand{font-weight:650;letter-spacing:-.01em;color:#fff;margin-right:auto;font-size:15px}
.ctx .by{font-weight:400;color:#8095A8;font-size:12.5px;margin-left:7px}
@media(max-width:640px){.ctx .by{display:none}}
.ctx label{display:flex;align-items:baseline;gap:6px;font-size:12.5px;color:#9FB0BF}
.ctx input{background:transparent;border:0;border-bottom:1px solid #3C4A57;color:#fff;
  font-family:var(--mono);font-size:13px;padding:1px 2px;width:15ch;min-width:0}
.ctx input:focus{border-bottom-color:#7FA8D4;outline:none}
.ctx input::placeholder{color:#5A6976}

/* ---- search ---- */
.search{padding:44px 0 26px}
h1{font-size:28px;line-height:1.2;letter-spacing:-.02em;margin:0 0 6px;font-weight:640}
.lede{color:var(--muted);margin:0 0 22px;max-width:62ch}
#q{width:100%;padding:14px 16px;border:1px solid var(--rule);border-radius:6px;
  background:var(--surface);font-size:17px}
#q:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px rgba(31,95,168,.12)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
.chips.sub{margin-top:8px}
.tab{background:var(--surface);border:1px solid var(--rule);border-radius:20px;padding:6px 14px;
  font-size:13.5px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tab:hover{border-color:var(--ink)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab .n{font-size:11.5px;opacity:.6;font-variant-numeric:tabular-nums}
.chips.sub .tab{padding:4px 11px;font-size:12.5px;border-radius:4px;color:var(--muted)}
.chips.sub .tab.on{color:#fff}
.hint{margin-top:13px;font-size:12.5px;color:var(--muted)}
kbd{font-family:var(--mono);font-size:11.5px;border:1px solid var(--rule);border-bottom-width:2px;
  border-radius:3px;padding:1px 5px;background:var(--surface)}

/* ---- results ---- */
.results{list-style:none;margin:0;padding:0 0 56px}
.results li{border-top:1px solid var(--rule-soft)}
.results li:last-child{border-bottom:1px solid var(--rule-soft)}
.hit{display:block;width:100%;text-align:left;background:none;border:0;padding:15px 14px;cursor:pointer}
.hit:hover,.hit.cur{background:var(--surface)}
.hit h3{margin:0;font-size:16.5px;font-weight:600;letter-spacing:-.005em}
.hit p{margin:3px 0 0;color:var(--muted);font-size:14px}
.meta{margin-top:7px;font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.empty{padding:40px 14px;color:var(--muted);border-top:1px solid var(--rule-soft)}

/* ---- trust badge ---- */
.trust{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600}
.trust::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-verified{color:var(--safe)} .t-documented{color:var(--state)} .t-reference{color:var(--muted)}

/* ---- runbook ---- */
.rb{padding:26px 0 90px;display:none}
.back{background:none;border:0;padding:0;color:var(--muted);font-size:13.5px;cursor:pointer;margin-bottom:18px}
.back:hover{color:var(--ink)}
.rb h2{font-size:25px;line-height:1.2;letter-spacing:-.02em;margin:0 0 6px;font-weight:640}
.rb .sum{color:var(--muted);margin:0 0 14px;max-width:64ch}
.prov{font-size:12.5px;color:var(--muted);border-left:2px solid var(--rule);padding:2px 0 2px 11px;margin-bottom:26px}
.prov code{font-family:var(--mono);font-size:12px}
.prov a{color:var(--focus)}

/* ---- the rail ---- */
ol.steps{list-style:none;margin:0;padding:0}
.step{position:relative;padding:0 0 26px 40px}
.step::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:1px;background:var(--rule)}
.step:last-child::before{display:none}
.step.danger::before{background:var(--destructive);opacity:.35}
.mark{position:absolute;left:0;top:2px;width:23px;height:23px;border:1px solid var(--rule);
  background:var(--surface);border-radius:3px;cursor:pointer;padding:0;
  font-family:var(--mono);font-size:12px;color:var(--muted);line-height:21px;text-align:center}
.mark:hover{border-color:var(--ink)}
.step.done .mark{background:var(--ink);border-color:var(--ink);color:#fff}
.step.done .stitle{color:var(--muted)}
.step.danger .mark{border-color:var(--destructive);color:var(--destructive)}

.shead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:9px}
.stitle{font-weight:600;font-size:16px;letter-spacing:-.005em}
.chip{font-size:11px;font-weight:650;padding:2px 7px;border-radius:3px;white-space:nowrap}
.c-safe{color:var(--safe);background:rgba(15,123,84,.09)}
.c-state{color:var(--state);background:rgba(161,92,0,.10)}
.c-destructive{color:#fff;background:var(--destructive)}

.cmd{position:relative;background:var(--ink);border-radius:5px;margin:0 0 10px}
.cmd pre{margin:0;padding:13px 84px 13px 14px;overflow-x:auto;font-family:var(--mono);
  font-size:13.5px;line-height:1.55;color:#E8EEF3;white-space:pre-wrap;word-break:break-word}
.cmd .fill{color:#8FD0A8;font-weight:600}
.cmd .unfilled{color:#E0A86A;border-bottom:1px dashed #8A6A48}
.copy{position:absolute;top:8px;right:8px;background:#2A3640;border:0;color:#C6D3DD;
  font-size:12px;padding:5px 10px;border-radius:4px;cursor:pointer}
.copy:hover{background:#3A4854;color:#fff}
.veil{padding:13px 14px;color:#E0A86A;font-family:var(--mono);font-size:13px;cursor:pointer;
  display:flex;align-items:center;gap:9px}
.veil:hover{color:#fff}

.look{font-size:14.5px;color:var(--muted);margin:0 0 8px;max-width:66ch}
.look b{color:var(--ink);font-weight:600}
.note{font-size:14px;border-left:2px solid var(--destructive);padding:6px 0 6px 11px;
  margin:0 0 10px;max-width:64ch;color:var(--ink)}
.note-state{border-left-color:var(--state)}

/* ---- output matcher ---- */
.match{margin-top:10px}
.match summary{font-size:13.5px;color:var(--focus);cursor:pointer;list-style:none}
.match summary::-webkit-details-marker{display:none}
.match summary::before{content:"+ ";font-family:var(--mono)}
.match[open] summary::before{content:"- "}
.match textarea{width:100%;margin-top:9px;min-height:78px;padding:10px 12px;border:1px solid var(--rule);
  border-radius:5px;font-family:var(--mono);font-size:12.5px;background:var(--surface);resize:vertical}
.verdict{margin-top:9px;padding:11px 13px;border-radius:5px;font-size:14.5px;background:var(--surface);
  border:1px solid var(--rule)}
.verdict.hit{border-color:var(--safe);border-left:3px solid var(--safe)}
.verdict.miss{color:var(--muted)}
.verdict b{display:block;margin-bottom:3px}
.jump{background:none;border:0;color:var(--focus);padding:0;margin-top:6px;cursor:pointer;font-size:13.5px}

/* ---- causes ---- */
.sec{margin-top:34px;padding-top:20px;border-top:1px solid var(--rule)}
.sec h3{font-size:13px;font-weight:650;margin:0 0 14px;color:var(--muted);letter-spacing:.01em}
.cause{padding:13px 15px;background:var(--surface);border:1px solid var(--rule-soft);border-radius:5px;margin-bottom:9px}
.cause.lit{border-color:var(--safe);border-left:3px solid var(--safe)}
.cause .rank{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-right:7px}
.cause .what{font-weight:600;font-size:15px}
.cause .fix{color:var(--muted);font-size:14.5px;margin-top:4px;max-width:66ch}
.cause .fix b{color:var(--ink);font-weight:600}
ul.plain{margin:0;padding-left:19px;color:var(--muted);font-size:14.5px;max-width:66ch}
ul.plain li{margin-bottom:5px}

/* ---- action bar ---- */
.bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--rule);
  padding:11px 0;display:none;z-index:15}
.bar .wrap{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.bar .prog{font-size:13px;color:var(--muted);margin-right:auto;font-variant-numeric:tabular-nums}
.act{background:var(--surface);border:1px solid var(--rule);border-radius:5px;padding:7px 13px;
  font-size:13.5px;cursor:pointer}
.act:hover{border-color:var(--ink)}
.act.key{background:var(--ink);color:#fff;border-color:var(--ink)}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:9px 17px;border-radius:5px;font-size:13.5px;z-index:30;display:none}

footer{color:var(--muted);font-size:12.5px;padding:0 0 30px;max-width:70ch;white-space:pre-line}

@media(max-width:640px){
  .wrap{padding:0 15px}
  .search{padding:26px 0 18px} h1{font-size:23px} .rb h2{font-size:21px}
  .ctx .wrap{gap:11px} .ctx input{width:11ch}
  .step{padding-left:33px} .mark{width:21px;height:21px;line-height:19px}
  .step::before{left:10px}
  .cmd pre{padding-right:14px;padding-top:38px}
  .copy{top:6px;right:auto;left:8px}
}
</style>
</head>
<body>

<div class="ctx"><div class="wrap">
  <span class="brand">DevOps Runbook <span class="by">by Dinesh Ilangovan</span></span>
  <span id="ctxfields"></span>
</div></div>

<main class="wrap">

<section class="search" id="searchview">
  <h1>What is broken?</h1>
  <p class="lede">Type the symptom, the error string, or what you were doing when it failed.</p>
  <input id="q" placeholder="CrashLoopBackOff, pod pending, committed to main, force push..." autocomplete="off" autofocus>
  <div class="chips" id="techchips"></div>
  <div class="chips sub" id="catchips"></div>
  <p class="hint"><kbd>/</kbd> search &nbsp; <kbd>↑</kbd><kbd>↓</kbd> move &nbsp; <kbd>Enter</kbd> open &nbsp; <kbd>Esc</kbd> back</p>
</section>

<ul class="results" id="results"></ul>

<section class="rb" id="rbview"></section>

<footer id="foot"></footer>
</main>

<div class="bar" id="bar"><div class="wrap">
  <span class="prog" id="prog"></span>
  <button class="act" id="a-safe">Copy read-only steps</button>
  <button class="act" id="a-esc">Copy handoff notes</button>
  <button class="act key" id="a-log">Copy incident log</button>
</div></div>
<div class="toast" id="toast"></div>

<script id="data" type="application/json">[{"id":"k8s-crashloopbackoff","tier":"verified","technology":"Kubernetes","category":"Pods & Containers","title":"Pod is in CrashLoopBackOff","summary":"The container starts, exits, and Kubernetes keeps restarting it with growing delay.","aliases":["crashloop","crashloopbackoff","pod keeps restarting","restarts increasing","back-off restarting failed container","pod wont stay up"],"verified_on":"2026-09-11","verified_against":"kind v0.23 / Kubernetes 1.31","verified_by":"dinesh","source":"https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/","inputs":[{"key":"pod","label":"Pod name","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"},{"key":"container","label":"Container","example":"checkout-api"}],"steps":[{"title":"Confirm it is actually looping","cmd":"kubectl get pod {pod} -n {namespace} -o wide","risk":"safe","look":"RESTARTS climbing over successive checks. A high but static count is an old incident, not a live one.","signals":[{"match":"Completed","means":"This is a Job or a one-shot container that finished. restartPolicy is wrong, not the app.","goto":"cause:wrong-restart-policy"}]},{"title":"Read the previous container's logs","cmd":"kubectl logs {pod} -n {namespace} -c {container} --previous --tail=200","risk":"safe","look":"The FIRST fatal line, not the last. Startup errors scroll off the top and the tail is usually just the shutdown noise.","signals":[{"match":"(?i)connection refused|no route to host|timeout.*dial","means":"It died waiting on a dependency that was not reachable.","goto":"cause:dependency-unreachable"},{"match":"(?i)(not set|missing|undefined).*(env|variable|config)|panic.*nil","means":"Required configuration was absent at startup.","goto":"cause:missing-config"},{"match":"(?i)permission denied|operation not permitted","means":"The process cannot read a path or bind a port as its runAsUser.","goto":"cause:permissions"}]},{"title":"Read the termination state","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.status.containerStatuses[*].lastState.terminated}'","risk":"safe","look":"exitCode and reason. This is the single most decisive field in the whole runbook.","signals":[{"match":"OOMKilled|\"exitCode\":137","means":"The kernel killed it for memory. No amount of restarting will fix this.","goto":"cause:oom"},{"match":"\"exitCode\":126","means":"The entrypoint was found but is not executable. Check the file mode in the image.","goto":"cause:entrypoint-not-executable"},{"match":"\"exitCode\":127","means":"The entrypoint was not found at all. Wrong path, or missing shell in a distroless base.","goto":"cause:entrypoint-missing"},{"match":"\"exitCode\":1\\b","means":"The application chose to exit. The reason is in the logs, not here.","goto":"step:2"}]},{"title":"Check whether a probe is doing the killing","cmd":"kubectl describe pod {pod} -n {namespace}","risk":"safe","look":"Events for 'Liveness probe failed'. If present, the app may be healthy but slow to start, and the probe is executing it.","signals":[{"match":"Liveness probe failed","means":"The liveness probe is killing a container that may only need more startup time.","goto":"cause:liveness-too-aggressive"}]}],"causes":[{"id":"missing-config","cause":"A required env var, Secret key or ConfigMap key is absent, so the process exits during startup.","fix":"Fix the owning Deployment/Secret/ConfigMap in source control and reconcile. Do not patch the live Pod.","confirm":"kubectl get deploy -n {namespace} -o yaml | grep -A5 'envFrom\\|valueFrom'"},{"id":"oom","cause":"The container's memory limit is below its real working set.","fix":"Raise limits.memory in the owning Deployment, or fix the leak. Restarting will reproduce it every time.","confirm":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].resources}'"},{"id":"dependency-unreachable","cause":"A database, cache or upstream service was not reachable at startup.","fix":"Confirm the dependency's Service has endpoints, then decide whether the app should retry instead of exiting.","confirm":"kubectl get endpointslices -n {namespace}"},{"id":"liveness-too-aggressive","cause":"initialDelaySeconds is shorter than the app's real startup time, so liveness kills it mid-boot.","fix":"Move the slow-start allowance to a startupProbe rather than inflating the liveness delay.","confirm":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].livenessProbe}'"},{"id":"entrypoint-missing","cause":"Exit 127. The command in the image manifest does not exist at that path.","fix":"Check the Dockerfile ENTRYPOINT/CMD against the built image. A distroless base has no /bin/sh.","confirm":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].command}'"},{"id":"entrypoint-not-executable","cause":"Exit 126. The file exists but lacks the execute bit, or its interpreter line is wrong.","fix":"Add chmod +x in the Dockerfile, or fix the shebang. Rebuild the image.","confirm":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].image}'"},{"id":"permissions","cause":"runAsUser cannot read a mounted path or bind a privileged port.","fix":"Correct fsGroup on the volume, or move the app to a port above 1024.","confirm":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.securityContext}'"},{"id":"wrong-restart-policy","cause":"A one-shot workload is running under restartPolicy Always.","fix":"Run it as a Job with restartPolicy OnFailure or Never.","confirm":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.restartPolicy}'"}],"verify":["RESTARTS holds steady across at least three checks spanning the app's normal startup window.","The container reports Ready, and readiness has not flapped in recent events.","The original failing request or job path completes successfully."],"escalate":["Output of --previous logs, first 50 lines","The lastState.terminated block, verbatim","Image tag and digest, plus resources and probe definitions"]},{"id":"k8s-pod-pending","tier":"verified","technology":"Kubernetes","category":"Scheduling","title":"Pod stays Pending and is never scheduled","summary":"The Pod object exists but no node has accepted it.","aliases":["pod pending","not scheduled","failedscheduling","no nodes available","pod stuck pending","0/3 nodes are available"],"verified_on":"2026-09-11","verified_against":"kind v0.23 / Kubernetes 1.31","verified_by":"dinesh","source":"https://kubernetes.io/docs/concepts/scheduling-eviction/","inputs":[{"key":"pod","label":"Pod name","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the scheduler's own reason","cmd":"kubectl get event -n {namespace} --field-selector involvedObject.name={pod},reason=FailedScheduling -o jsonpath='{.items[-1:].message}'","risk":"safe","look":"The scheduler states exactly why each node was rejected, in the form '0/N nodes are available: ...'. Read that string before anything else.","signals":[{"match":"(?i)insufficient (cpu|memory|ephemeral-storage)","means":"No node has enough free allocatable resource for the requests.","goto":"cause:insufficient-resources"},{"match":"(?i)didn't match.*(node selector|affinity)","means":"The nodeSelector or affinity rule matches no node's labels.","goto":"cause:selector-mismatch"},{"match":"(?i)had (untolerated )?taint","means":"Every candidate node carries a taint this Pod does not tolerate.","goto":"cause:taint"},{"match":"(?i)pod has unbound immediate PersistentVolumeClaims","means":"This is a storage problem wearing a scheduling costume.","goto":"cause:unbound-pvc"},{"match":"(?i)node\\(s\\) didn't find available persistent volumes|volume node affinity conflict","means":"The PV is pinned to a zone the scheduler cannot place the Pod in.","goto":"cause:zone-conflict"}]},{"title":"Compare the request against real allocatable capacity","cmd":"kubectl describe nodes | grep -A6 'Allocated resources'","risk":"safe","look":"Requests, not usage. A node at 12% CPU usage can still be 100% requested and therefore unschedulable."},{"title":"Read what this Pod is actually asking for","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].resources.requests}{\"\\n\"}{.spec.nodeSelector}{\"\\n\"}{.spec.tolerations}'","risk":"safe","look":"Compare these three against the previous step. The mismatch is usually obvious once both are on screen."}],"causes":[{"id":"insufficient-resources","cause":"The sum of requests exceeds allocatable on every node.","fix":"Lower the request to the workload's real profile, or add capacity. Raising the limit does not help; the scheduler reads requests.","confirm":"kubectl top nodes"},{"id":"selector-mismatch","cause":"nodeSelector or nodeAffinity references labels no node carries, often after a node pool was replaced.","fix":"Correct the selector, or label the intended nodes. Check for typos in the label key first.","confirm":"kubectl get nodes --show-labels"},{"id":"taint","cause":"Nodes are tainted (NoSchedule) and the Pod has no matching toleration.","fix":"Add the toleration if the Pod belongs on those nodes, otherwise target a different pool.","confirm":"kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{\"\\t\"}{.spec.taints}{\"\\n\"}{end}'"},{"id":"unbound-pvc","cause":"A referenced PVC has not bound, so the Pod cannot be placed.","fix":"Follow the PVC Pending runbook. Nothing about the Pod spec will fix this.","confirm":"kubectl get pvc -n {namespace}"},{"id":"zone-conflict","cause":"An existing PV lives in one zone and the Pod cannot be scheduled there.","fix":"Use a topology-aware StorageClass with volumeBindingMode WaitForFirstConsumer.","confirm":"kubectl get pv -o jsonpath='{range .items[*]}{.metadata.name}{\"\\t\"}{.spec.nodeAffinity}{\"\\n\"}{end}'"}],"verify":["The Pod reports a nodeName and moves past Pending.","No new FailedScheduling events appear for this Pod.","The change was made in the owning manifest, not by editing the live Pod."],"escalate":["The full FailedScheduling message","Allocated resources block from describe nodes","The Pod's requests, nodeSelector and tolerations"]},{"id":"k8s-service-no-endpoints","tier":"verified","technology":"Kubernetes","category":"Services & Networking","title":"Service exists but returns connection refused","summary":"DNS resolves the Service, but nothing answers. Usually the Service has no endpoints.","aliases":["no endpoints","connection refused service","service not working","empty endpointslice","selector not matching","503 from service"],"verified_on":"2026-09-11","verified_against":"kind v0.23 / Kubernetes 1.31","verified_by":"dinesh","source":"https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/","inputs":[{"key":"service","label":"Service name","example":"checkout-api"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Check whether the Service has any endpoints at all","cmd":"kubectl get endpointslices -n {namespace} -l kubernetes.io/service-name={service}","risk":"safe","look":"ENDPOINTS column. If it is empty or <none>, the Service is pointing at nothing and the problem is the selector or pod readiness, not the network.","signals":[{"match":"(?i)<none>|No resources found","means":"No pods are backing this Service.","goto":"step:2"}]},{"title":"Compare the Service selector against real pod labels","cmd":"kubectl get svc {service} -n {namespace} -o jsonpath='{.spec.selector}{\"\\n\"}' && kubectl get pods -n {namespace} --show-labels","risk":"safe","look":"An exact match on every key. One extra or renamed label is enough to produce an empty Service, and this is the most common cause by a wide margin.","signals":[{"match":"(?i)app=","means":"Compare character by character. 'app' and 'app.kubernetes.io/name' are different keys.","goto":"cause:selector-mismatch"}]},{"title":"Check whether the backing pods are Ready","cmd":"kubectl get pods -n {namespace} -o wide","risk":"safe","look":"A pod that is Running but 0/1 Ready is excluded from endpoints. Readiness, not liveness, controls Service membership.","signals":[{"match":"0/1\\s+Running","means":"The pod is up but failing readiness, so it is deliberately kept out of the Service.","goto":"cause:not-ready"}]},{"title":"Confirm the target port matches the container port","cmd":"kubectl get svc {service} -n {namespace} -o jsonpath='{.spec.ports}'","risk":"safe","look":"targetPort must match the container's real listening port, or a named port the container declares. port is what clients dial; targetPort is where it lands."}],"causes":[{"id":"selector-mismatch","cause":"The Service selector does not match the pod labels.","fix":"Align them in the manifests. Changing the Deployment's pod labels forces a rollout, so prefer correcting the Service.","confirm":"kubectl get endpointslices -n {namespace} -l kubernetes.io/service-name={service}"},{"id":"not-ready","cause":"Pods are running but failing their readiness probe, so kube-proxy excludes them.","fix":"Fix the readiness endpoint or its threshold. The Service will populate on its own once pods report Ready.","confirm":"kubectl get pods -n {namespace} -o wide"},{"id":"wrong-target-port","cause":"targetPort points at a port nothing is listening on.","fix":"Set targetPort to the container's real port, or use a named port so the two cannot drift.","confirm":"kubectl get svc {service} -n {namespace} -o jsonpath='{.spec.ports}'"}],"verify":["EndpointSlice lists the expected pod IPs.","A request from inside the cluster to the Service name succeeds.","The count of endpoints matches the number of Ready replicas."],"escalate":["Service spec, selector and ports","Pod labels and readiness state","EndpointSlice contents"]},{"id":"k8s-imagepullbackoff","tier":"documented","technology":"Kubernetes","category":"Pods & Containers","title":"ImagePullBackOff or ErrImagePull","summary":"The kubelet cannot fetch the image. The event message says which of four reasons.","aliases":["imagepullbackoff","errimagepull","cannot pull image","image not found","unauthorized pull","pull secret"],"source":"https://kubernetes.io/docs/concepts/containers/images/","inputs":[{"key":"pod","label":"Pod name","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the pull failure message","cmd":"kubectl describe pod {pod} -n {namespace} | grep -A5 Events","risk":"safe","look":"The Failed event's message. It names the exact reason, and each reason has a different owner.","signals":[{"match":"(?i)not found|manifest unknown","means":"The tag does not exist in the registry.","goto":"cause:bad-tag"},{"match":"(?i)unauthorized|authentication required","means":"The node has no valid credentials for this registry.","goto":"cause:no-secret"},{"match":"(?i)x509|certificate","means":"TLS trust failure between the node and the registry.","goto":"cause:tls"},{"match":"(?i)timeout|i/o timeout|no such host","means":"The node could not reach the registry at all.","goto":"cause:unreachable"}]},{"title":"Check the image reference on the pod","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].image}'","risk":"safe","look":"Typos in the registry host or tag are the single most common cause. Read it character by character."},{"title":"Check whether a pull secret is attached","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.imagePullSecrets}'","risk":"safe","look":"Empty output on a private registry means the pod has no credentials. The secret must live in the same namespace as the pod."}],"causes":[{"id":"bad-tag","cause":"The tag does not exist in the repository.","fix":"Fix the tag in the manifest. Prefer pinning by digest for anything production.","confirm":""},{"id":"no-secret","cause":"No imagePullSecret, or it exists in a different namespace.","fix":"Create the secret in this namespace and reference it on the pod or its ServiceAccount.","confirm":""},{"id":"tls","cause":"The node does not trust the registry's certificate.","fix":"Install the CA on the nodes. Do not mark the registry insecure.","confirm":""},{"id":"unreachable","cause":"The node has no network path to the registry.","fix":"Check egress rules, the NAT gateway and any proxy configuration on the nodes.","confirm":""}],"verify":["The pod moves past ImagePullBackOff and the container starts.","No new Failed pull events appear."],"escalate":["The full Failed event message","The exact image reference","Whether an imagePullSecret is attached and in which namespace"]},{"id":"k8s-oomkilled","tier":"documented","technology":"Kubernetes","category":"Pods & Containers","title":"Container was OOMKilled","summary":"The kernel killed the container for exceeding its memory limit. Restarting reproduces it.","aliases":["oomkilled","exit 137","out of memory","memory limit","container killed memory","oom"],"source":"https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/","inputs":[{"key":"pod","label":"Pod name","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Confirm it was memory and not an external kill","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.status.containerStatuses[*].lastState.terminated.reason}'","risk":"safe","look":"OOMKilled specifically. Exit 137 alone only means SIGKILL, which something else could have sent.","signals":[{"match":"OOMKilled","means":"The kernel's OOM killer took it. This is a limit problem, not a crash.","goto":"cause:limit-too-low"}]},{"title":"Read the configured limit","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].resources}'","risk":"safe","look":"Compare limits.memory against what the process actually needs. If requests and limits differ widely, scheduling and eviction behave in ways you may not expect."},{"title":"Look at actual usage while it runs","cmd":"kubectl top pod {pod} -n {namespace} --containers","risk":"safe","look":"Usage climbing steadily towards the limit points at a leak. Usage spiking at a particular operation points at a batch size or a large request."},{"title":"Check whether the whole node is under pressure","cmd":"kubectl describe node $(kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.nodeName}') | grep -A5 Conditions","risk":"safe","look":"MemoryPressure true means the node is squeezed and eviction is in play, which is a different problem from a single container's limit."}],"causes":[{"id":"limit-too-low","cause":"The limit is below the real working set.","fix":"Raise limits.memory in the owning Deployment. Measure first with kubectl top rather than guessing.","confirm":""},{"id":"leak","cause":"Memory grows without bound until the limit is reached.","fix":"Raising the limit only delays it. Profile the application; the limit is doing its job.","confirm":""},{"id":"jvm-unaware","cause":"A JVM or Node process sized its heap against the node rather than the cgroup.","fix":"Set an explicit max heap, or use a runtime version that is container-aware.","confirm":""},{"id":"node-pressure","cause":"The node is out of memory and evicting pods.","fix":"Check requests across the node. Under-requesting causes overcommit and cascading evictions.","confirm":""}],"verify":["RESTARTS holds steady through a full workload cycle.","kubectl top shows headroom between usage and the limit."],"escalate":["lastState.terminated block","resources.requests and resources.limits","kubectl top output over a few minutes"]},{"id":"k8s-rollout-stuck","tier":"documented","technology":"Kubernetes","category":"Workloads","title":"Deployment rollout never finishes","summary":"kubectl rollout status hangs. New pods are not becoming ready, or the old ones will not go.","aliases":["rollout stuck","deployment not progressing","waiting for rollout","progressdeadlineexceeded","stuck deploying","rollout hangs"],"source":"https://kubernetes.io/docs/concepts/workloads/controllers/deployment/","inputs":[{"key":"deploy","label":"Deployment","example":"checkout-api"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the rollout condition","cmd":"kubectl get deploy {deploy} -n {namespace} -o jsonpath='{.status.conditions}'","risk":"safe","look":"The Progressing condition's reason. ProgressDeadlineExceeded means it gave up; that reason names the layer at fault.","signals":[{"match":"ProgressDeadlineExceeded","means":"The new ReplicaSet never became available in time.","goto":"step:2"},{"match":"(?i)ReplicaSetUpdated","means":"Still in progress. Give it the deadline before treating it as stuck.","goto":""}]},{"title":"Find what the new pods are doing","cmd":"kubectl get pods -n {namespace} -l app={deploy} --sort-by=.metadata.creationTimestamp","risk":"safe","look":"The newest pods. Pending means scheduling, CrashLoop means the app, 0/1 Running means readiness.","signals":[{"match":"Pending","means":"Scheduling, not deployment. Follow the Pending runbook.","goto":"cause:scheduling"},{"match":"CrashLoopBackOff","means":"The new image does not start. Follow the CrashLoop runbook.","goto":"cause:new-image-broken"},{"match":"0/1\\s+Running","means":"The container runs but fails readiness.","goto":"cause:readiness"}]},{"title":"Check whether a disruption budget is blocking removal","cmd":"kubectl get pdb -n {namespace}","risk":"safe","look":"ALLOWED DISRUPTIONS at zero means old pods cannot be evicted, so the rollout cannot proceed."},{"title":"Check the surge and unavailable settings","cmd":"kubectl get deploy {deploy} -n {namespace} -o jsonpath='{.spec.strategy}'","risk":"safe","look":"maxSurge 0 with maxUnavailable 0 is a deadlock: nothing new can start and nothing old can stop."}],"causes":[{"id":"new-image-broken","cause":"The new image fails to start.","fix":"Roll back, then fix the image. kubectl rollout undo restores the previous ReplicaSet.","confirm":""},{"id":"readiness","cause":"New pods run but never pass readiness.","fix":"Check the probe path, port and initial delay against the new image's real startup.","confirm":""},{"id":"scheduling","cause":"New pods cannot be placed.","fix":"Follow the Pending runbook. Often the surge replica has nowhere to go.","confirm":""},{"id":"pdb-block","cause":"A PodDisruptionBudget forbids removing the old pods.","fix":"Relax minAvailable, or scale up so the budget can be satisfied during the roll.","confirm":""},{"id":"strategy-deadlock","cause":"maxSurge and maxUnavailable are both zero.","fix":"Set at least one of them above zero.","confirm":""}],"verify":["kubectl rollout status returns successfully.","All replicas are on the new ReplicaSet and Ready."],"escalate":["Deployment status conditions","State of the newest pods","Strategy settings and any PDB"]},{"id":"k8s-node-notready","tier":"documented","technology":"Kubernetes","category":"Nodes","title":"Node is NotReady","summary":"The node stopped reporting healthy. Pods on it will be evicted after the toleration window.","aliases":["node notready","node not ready","kubelet down","node unreachable","node lost","kubelet stopped posting"],"source":"https://kubernetes.io/docs/concepts/architecture/nodes/","inputs":[{"key":"node","label":"Node name","example":"ip-10-0-3-14.ec2.internal"}],"steps":[{"title":"Read the node's conditions","cmd":"kubectl describe node {node} | grep -A10 Conditions","risk":"safe","look":"Which condition is false or unknown. Ready Unknown means the kubelet stopped reporting entirely, which is very different from a pressure condition.","signals":[{"match":"(?i)Ready\\s+Unknown","means":"The kubelet stopped posting status. The node may be gone or partitioned.","goto":"cause:kubelet-silent"},{"match":"(?i)DiskPressure\\s+True","means":"The node is out of disk.","goto":"cause:disk"},{"match":"(?i)MemoryPressure\\s+True","means":"The node is out of memory.","goto":"cause:memory"},{"match":"(?i)PIDPressure\\s+True","means":"Process ID exhaustion, usually a fork loop.","goto":"cause:pids"},{"match":"(?i)NetworkUnavailable\\s+True","means":"The CNI has not configured the node's network.","goto":"cause:cni"}]},{"title":"Check how long it has been unhealthy","cmd":"kubectl get node {node} -o wide","risk":"safe","look":"The age against the last transition. Pods are evicted after the not-ready toleration, five minutes by default."},{"title":"See what is still on it","cmd":"kubectl get pods --all-namespaces --field-selector spec.nodeName={node}","risk":"safe","look":"Anything not yet evicted. Stateful workloads here need attention before the node is replaced."},{"title":"Cordon it so nothing new lands","cmd":"kubectl cordon {node}","risk":"state","look":"The node shows SchedulingDisabled. Do this before investigating so the problem does not spread.","note":"Marks the node unschedulable. Running pods are not touched, but nothing new will be placed. Reverse with kubectl uncordon."}],"causes":[{"id":"kubelet-silent","cause":"The kubelet is not posting status.","fix":"Check the host: is it up, is the kubelet service running, can it reach the API server.","confirm":""},{"id":"disk","cause":"The node's disk is full, often image or log growth.","fix":"Clear space, then set image garbage collection and log rotation so it does not recur.","confirm":""},{"id":"memory","cause":"The node is out of memory.","fix":"Look for pods without limits. Overcommit on requests is the usual root cause.","confirm":""},{"id":"pids","cause":"Process ID exhaustion.","fix":"Find the fork loop. Set a pid limit on the offending workload.","confirm":""},{"id":"cni","cause":"The CNI plugin has not initialised on the node.","fix":"Check the CNI DaemonSet's pod on that node.","confirm":""}],"verify":["The node reports Ready.","Workloads have rescheduled and are serving.","The condition that flipped has a remediation, not just a restart."],"escalate":["Full conditions block","Whether the host is reachable outside Kubernetes","Pods still bound to the node"]},{"id":"k8s-pvc-pending","tier":"documented","technology":"Kubernetes","category":"Storage","title":"PersistentVolumeClaim stays Pending","summary":"The claim never binds, so every pod using it stays Pending too.","aliases":["pvc pending","volume not bound","waiting for first consumer","no persistent volumes available","storage class","pvc stuck"],"source":"https://kubernetes.io/docs/concepts/storage/persistent-volumes/","inputs":[{"key":"pvc","label":"PVC name","example":"postgres-data"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the binding events","cmd":"kubectl describe pvc {pvc} -n {namespace} | grep -A10 Events","risk":"safe","look":"The provisioner's own message. WaitForFirstConsumer is not an error at all; it is the expected state until a pod is scheduled.","signals":[{"match":"(?i)waiting for first consumer","means":"Normal. The volume binds when a pod that uses it gets scheduled.","goto":"cause:wait-first-consumer"},{"match":"(?i)storageclass.*not found","means":"The named StorageClass does not exist in this cluster.","goto":"cause:no-storageclass"},{"match":"(?i)no persistent volumes available","means":"Static provisioning with no matching PV.","goto":"cause:no-matching-pv"},{"match":"(?i)failed to provision|quota","means":"The provisioner tried and the backend refused.","goto":"cause:backend-refused"}]},{"title":"Check the requested class and access mode","cmd":"kubectl get pvc {pvc} -n {namespace} -o jsonpath='{.spec.storageClassName}{\" \"}{.spec.accessModes}{\" \"}{.spec.resources.requests.storage}'","risk":"safe","look":"ReadWriteMany is unsupported by most block storage drivers and is a common silent mismatch."},{"title":"List the classes that actually exist","cmd":"kubectl get storageclass","risk":"safe","look":"Whether the requested name exists, and which class is marked default. An empty storageClassName uses the default; a missing default leaves the claim Pending forever."}],"causes":[{"id":"wait-first-consumer","cause":"The class uses WaitForFirstConsumer.","fix":"Nothing is wrong. Schedule a pod that mounts it and it will bind.","confirm":""},{"id":"no-storageclass","cause":"The named class does not exist.","fix":"Correct the name, or install the class. Cluster migrations often leave stale names in manifests.","confirm":""},{"id":"no-matching-pv","cause":"Static provisioning with no PV matching size, class and access mode.","fix":"Create a matching PV, or move to dynamic provisioning.","confirm":""},{"id":"access-mode","cause":"The driver does not support the requested access mode.","fix":"Use ReadWriteOnce for block storage, or a filesystem driver for ReadWriteMany.","confirm":""},{"id":"backend-refused","cause":"The storage backend rejected the request, often on quota.","fix":"Read the provisioner's message and check the cloud-side quota.","confirm":""}],"verify":["The PVC reports Bound with a volume name.","The pod that needed it is scheduled and running."],"escalate":["PVC events","Requested class, size and access mode","Output of kubectl get storageclass"]},{"id":"k8s-dns-failure","tier":"documented","technology":"Kubernetes","category":"DNS","title":"DNS resolution fails inside pods","summary":"Names do not resolve from within the cluster. Work out whether it is CoreDNS, the pod's resolver, or upstream.","aliases":["dns not working","name resolution failed","coredns","cannot resolve","nxdomain","server misbehaving","temporary failure in name resolution"],"source":"https://kubernetes.io/docs/tasks/administer-cluster/dns-debugging-resolution/","inputs":[{"key":"pod","label":"Pod name","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Test resolution of a cluster name from the pod","cmd":"kubectl exec {pod} -n {namespace} -- getent hosts kubernetes.default.svc.cluster.local","risk":"safe","look":"An IP means cluster DNS works and the problem is narrower than you thought. Nothing means the resolver path is broken.","signals":[{"match":"\\d+\\.\\d+\\.\\d+\\.\\d+","means":"Cluster DNS works. Test an external name next.","goto":"step:4"},{"match":"^\\s*$","means":"Cluster DNS is not answering for this pod.","goto":"step:2"}]},{"title":"Check that CoreDNS is running","cmd":"kubectl get pods -n kube-system -l k8s-app=kube-dns -o wide","risk":"safe","look":"All replicas Ready. CrashLooping CoreDNS is usually a bad Corefile edit or a resolver loop.","signals":[{"match":"CrashLoopBackOff","means":"CoreDNS itself is failing. Check its logs for a loop plugin detection.","goto":"cause:coredns-down"},{"match":"0/1","means":"CoreDNS is not ready, so nothing in the cluster resolves.","goto":"cause:coredns-down"}]},{"title":"Read the pod's resolver configuration","cmd":"kubectl exec {pod} -n {namespace} -- cat /etc/resolv.conf","risk":"safe","look":"The nameserver should be the cluster DNS Service IP. A node-level resolver here means dnsPolicy is wrong for a cluster workload.","signals":[{"match":"(?i)ndots:5","means":"Normal, but it means short names try several search domains first, which looks like slow DNS under load.","goto":"cause:ndots"},{"match":"nameserver 169\\.254|nameserver 8\\.8","means":"The pod is using a node or public resolver, not cluster DNS.","goto":"cause:wrong-dnspolicy"}]},{"title":"Test an external name","cmd":"kubectl exec {pod} -n {namespace} -- getent hosts github.com","risk":"safe","look":"Cluster names working but external failing points at CoreDNS's upstream forwarder or egress, not at Kubernetes DNS itself."}],"causes":[{"id":"coredns-down","cause":"CoreDNS is unhealthy.","fix":"Read its logs. A loop plugin error means the upstream resolver points back at CoreDNS.","confirm":""},{"id":"wrong-dnspolicy","cause":"The pod uses host DNS instead of cluster DNS.","fix":"Set dnsPolicy ClusterFirst. hostNetwork pods need ClusterFirstWithHostNet explicitly.","confirm":""},{"id":"upstream","cause":"CoreDNS cannot reach its upstream resolver.","fix":"Check the forward directive in the Corefile and egress from the CoreDNS pods.","confirm":""},{"id":"ndots","cause":"Short names expand through five search domains before the real lookup.","fix":"Use fully qualified names with a trailing dot for hot paths, or tune ndots per pod.","confirm":""},{"id":"netpol","cause":"A NetworkPolicy blocks egress to port 53.","fix":"Allow UDP and TCP 53 to kube-system in the policy.","confirm":""}],"verify":["Both cluster and external names resolve from inside the pod.","CoreDNS replicas are Ready with no restarts."],"escalate":["resolv.conf from inside the pod","CoreDNS pod state and logs","Which names fail: cluster, external, or both"]},{"id":"k8s-ingress-503","tier":"documented","technology":"Kubernetes","category":"Ingress","title":"Ingress returns 502, 503 or 404","summary":"The ingress answers but the backend does not. Each status points at a different layer.","aliases":["ingress 503","502 bad gateway","ingress 404","service unavailable","no healthy upstream","default backend"],"source":"https://kubernetes.io/docs/concepts/services-networking/ingress/","inputs":[{"key":"ingress","label":"Ingress name","example":"checkout"},{"key":"namespace","label":"Namespace","example":"production"},{"key":"service","label":"Backend service","example":"checkout-api"}],"steps":[{"title":"Identify which status you get and from whom","cmd":"curl -sSI https://$(kubectl get ingress {ingress} -n {namespace} -o jsonpath='{.spec.rules[0].host}')/","risk":"safe","look":"The Server header tells you whether the ingress controller answered or something upstream did. 404 usually means no rule matched; 503 usually means no healthy backend.","signals":[{"match":"503","means":"The controller matched a rule but has no healthy endpoint behind it.","goto":"cause:no-endpoints"},{"match":"404","means":"No ingress rule matched this host and path.","goto":"cause:no-rule-match"},{"match":"502","means":"The controller reached a backend and got an invalid response.","goto":"cause:backend-error"}]},{"title":"Check the ingress has an address and correct rules","cmd":"kubectl get ingress {ingress} -n {namespace} -o wide","risk":"safe","look":"An empty ADDRESS means no controller has claimed it, usually a missing or wrong ingressClassName."},{"title":"Check the backend service has endpoints","cmd":"kubectl get endpointslices -n {namespace} -l kubernetes.io/service-name={service}","risk":"safe","look":"Empty endpoints produce 503 every time. This is the most common cause by a wide margin.","signals":[{"match":"(?i)<none>|No resources found","means":"No pods behind the service. Follow the no-endpoints runbook.","goto":"cause:no-endpoints"}]},{"title":"Read the controller's own logs","cmd":"kubectl logs -n ingress-nginx -l app.kubernetes.io/component=controller --tail=50","risk":"safe","look":"The controller logs the upstream it chose and why it failed. This is more precise than anything you can infer from the client side."}],"causes":[{"id":"no-endpoints","cause":"The backend service has no ready endpoints.","fix":"Fix pod readiness or the service selector. The ingress is working correctly by refusing to send traffic nowhere.","confirm":""},{"id":"no-rule-match","cause":"Host or path in the request does not match any rule.","fix":"Check pathType. Prefix and Exact behave differently, and this catches people out constantly.","confirm":""},{"id":"wrong-class","cause":"No controller claimed the ingress.","fix":"Set ingressClassName to a class that exists in the cluster.","confirm":""},{"id":"backend-error","cause":"The backend returned something the controller could not use.","fix":"Check the app's own logs. Often TLS expected on a plain-HTTP backend port.","confirm":""},{"id":"wrong-port","cause":"The ingress points at a service port that does not exist.","fix":"Match the port name or number to the service definition.","confirm":""}],"verify":["The URL returns the expected status from the application.","The controller logs show the correct upstream being selected."],"escalate":["The exact status and response headers","Ingress rules and class","Backend endpoints","Controller log lines for the request"]},{"id":"k8s-pod-evicted","tier":"documented","technology":"Kubernetes","category":"Nodes","title":"Pods are being Evicted","summary":"The kubelet is reclaiming resources on a node under pressure. The eviction message names which resource.","aliases":["pod evicted","evicted","node under pressure","ephemeral storage","the node was low on resource","diskpressure eviction"],"source":"https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/","inputs":[{"key":"namespace","label":"Namespace","example":"production"},{"key":"pod","label":"Evicted pod name","example":"checkout-api-7d9f6b8c5-x4k2m"}],"steps":[{"title":"List the evicted pods and read the reason","cmd":"kubectl get pods -n {namespace} --field-selector status.phase=Failed -o custom-columns=NAME:.metadata.name,REASON:.status.reason,MSG:.status.message","risk":"safe","look":"The message names the resource that ran out. That single word decides everything that follows.","signals":[{"match":"(?i)ephemeral-storage","means":"The pod wrote too much to its writable layer or an emptyDir.","goto":"cause:ephemeral"},{"match":"(?i)memory","means":"The node ran out of memory and reclaimed the largest offender over its request.","goto":"cause:node-memory"},{"match":"(?i)inodes","means":"The node exhausted inodes, usually many small files.","goto":"cause:inodes"}]},{"title":"Find which node is under pressure","cmd":"kubectl get nodes -o custom-columns=NAME:.metadata.name,CONDITIONS:.status.conditions[?(@.status==\\\"True\\\")].type","risk":"safe","look":"Which nodes report DiskPressure or MemoryPressure. If it is one node, it is a host problem; if it is all of them, it is a capacity problem."},{"title":"Check whether the evicted workload declared requests","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].resources.requests}' 2>/dev/null || echo 'pod already removed'","risk":"safe","look":"Pods without requests are evicted first. Declaring a request is what buys a workload protection."}],"causes":[{"id":"ephemeral","cause":"The container wrote more to local disk than its ephemeral-storage allowance.","fix":"Set an ephemeral-storage request and limit, and move logs to stdout rather than files.","confirm":""},{"id":"node-memory","cause":"The node ran out of memory.","fix":"Set memory requests on the workloads sharing that node. Eviction targets pods exceeding their request first.","confirm":""},{"id":"inodes","cause":"Inode exhaustion from many small files.","fix":"Find the directory generating them. Log rotation usually solves it.","confirm":""},{"id":"no-requests","cause":"Best-effort pods are evicted first.","fix":"Declare requests so the workload gets a guaranteed or burstable class.","confirm":""}],"verify":["No new evictions during a normal workload window.","The node's pressure conditions are false.","The affected workloads declare requests."],"escalate":["Eviction message verbatim","Node conditions","Whether the workload declares requests and limits"]}]</script>
<script>
"use strict";
const BANK = JSON.parse(document.getElementById("data").textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- session state (in memory only; nothing is persisted) ---------- */
const CTX = {};                 // placeholder key -> value
let CUR = null;                 // open runbook
let LOG = [];                   // [{t, step, cmd, note}]
let CURSOR = -1;                // keyboard cursor in results

/* ---------- search ---------- */
const flat = s => String(s ?? "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
function score(r, q) {
  if (!q.trim()) return 1;
  const qq = flat(q), qt = qq.split(" ").filter(t => t.length > 1);
  const title = flat(r.title), al = (r.aliases || []).map(flat);
  let s = 0;
  if (title.includes(qq)) s += 100;
  if (al.some(a => a.includes(qq) || qq.includes(a))) s += 80;
  const hay = [title, flat(r.summary), al.join(" "), flat(r.category)].join(" ");
  for (const t of qt) {
    if (title.includes(t)) s += 18;
    else if (al.some(a => a.includes(t))) s += 14;
    else if (hay.includes(t)) s += 4;
  }
  return s;
}

let TECH = "All", CAT = "All";

function renderChips() {
  const techs = [...new Set(BANK.map(r => r.technology))].sort();
  $("#techchips").innerHTML = ["All", ...techs].map(t => {
    const n = t === "All" ? BANK.length : BANK.filter(r => r.technology === t).length;
    return `<button class="tab${t === TECH ? " on" : ""}" data-t="${esc(t)}">${esc(t)}<span class="n">${n}</span></button>`;
  }).join("");
  document.querySelectorAll("#techchips .tab").forEach(b => b.onclick = () => {
    TECH = b.dataset.t; CAT = "All"; renderChips(); renderResults();
  });

  const pool = TECH === "All" ? BANK : BANK.filter(r => r.technology === TECH);
  const cats = [...new Set(pool.map(r => r.category).filter(Boolean))].sort();
  $("#catchips").innerHTML = cats.length > 1
    ? ["All", ...cats].map(c =>
        `<button class="tab${c === CAT ? " on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")
    : "";
  document.querySelectorAll("#catchips .tab").forEach(b => b.onclick = () => {
    CAT = b.dataset.c; renderChips(); renderResults();
  });
}

function renderResults() {
  const q = $("#q").value;
  let pool = BANK;
  if (TECH !== "All") pool = pool.filter(r => r.technology === TECH);
  if (CAT !== "All") pool = pool.filter(r => r.category === CAT);
  const arr = pool.map(r => ({ r, s: score(r, q) })).filter(x => x.s > 0)
                  .sort((a, b) => b.s - a.s).slice(0, 60);
  CURSOR = arr.length ? 0 : -1;
  $("#results").innerHTML = arr.length ? arr.map((x, i) => {
    const r = x.r, v = r.tier === "verified";
    return `<li><button class="hit${i === 0 ? " cur" : ""}" data-id="${esc(r.id)}">
      <h3>${esc(r.title)}</h3><p>${esc(r.summary)}</p>
      <span class="meta">
        <span class="trust t-${esc(r.tier)}">${v ? "Verified " + esc(r.verified_on) : esc(r.tier)}</span>
        <span>${esc(r.technology)}</span>
        <span>${(r.steps || []).length} steps</span>
      </span></button></li>`;
  }).join("") : `<li class="empty">Nothing matched. Try the exact error string from your terminal,
    or a plainer phrase like "pod won't start".</li>`;
  document.querySelectorAll(".hit").forEach(b => b.onclick = () => open(b.dataset.id));
}

/* ---------- placeholder substitution ---------- */
function fill(cmd, asHtml) {
  return cmd.replace(/\{([a-z0-9_]+)\}/g, (m, k) => {
    const v = CTX[k];
    if (!asHtml) return v || m;
    return v ? `<span class="fill">${esc(v)}</span>`
             : `<span class="unfilled">${esc(m)}</span>`;
  });
}

function ctxBar() {
  const keys = (CUR && CUR.inputs) || [];
  $("#ctxfields").innerHTML = keys.map(i =>
    `<label>${esc(i.label)}<input data-k="${esc(i.key)}" placeholder="${esc(i.example || "")}"
      value="${esc(CTX[i.key] || "")}" size="${Math.max(8, (i.example || "").length)}"></label>`).join("");
  document.querySelectorAll("#ctxfields input").forEach(inp => {
    inp.oninput = () => { CTX[inp.dataset.k] = inp.value.trim(); repaintCmds(); };
  });
}

function repaintCmds() {
  document.querySelectorAll("[data-cmd]").forEach(el => {
    el.innerHTML = fill(el.dataset.cmd, true);
  });
}

/* ---------- runbook view ---------- */
function open(id) {
  CUR = BANK.find(r => r.id === id);
  if (!CUR) return;
  LOG = [];
  (CUR.inputs || []).forEach(i => { if (!(i.key in CTX)) CTX[i.key] = ""; });
  ctxBar();

  const RISK = { safe: ["Read only", "c-safe"], state: ["Changes state", "c-state"],
                 destructive: ["Destructive", "c-destructive"] };

  const steps = (CUR.steps || []).map((s, i) => {
    const [label, cls] = RISK[s.risk] || RISK.safe;
    const danger = s.risk === "destructive";
    const body = danger
      ? `<div class="veil" data-reveal="${i}">Command hidden. Read the warning, then tap to reveal.</div>`
      : `<pre data-cmd="${esc(s.cmd)}"></pre><button class="copy" data-copy="${i}">Copy</button>`;
    const note = s.note ? `<p class="note${s.risk === "state" ? " note-state" : ""}">${esc(s.note)}</p>` : "";
    const sig = (s.signals || []).length
      ? `<details class="match"><summary>Paste your actual output to read it</summary>
           <textarea data-sig="${i}" placeholder="Paste the output you got, then release the key."></textarea>
           <div class="verdict miss" data-verdict="${i}">Nothing matched yet. Paste output above.</div>
         </details>` : "";
    return `<li class="step${danger ? " danger" : ""}" data-step="${i}">
      <button class="mark" data-done="${i}" aria-label="Mark step ${i + 1} done">${i + 1}</button>
      <div class="shead"><span class="stitle">${esc(s.title)}</span>
        <span class="chip ${cls}">${label}</span></div>
      ${note}
      <div class="cmd">${body}</div>
      <p class="look">${esc(s.look)}</p>
      ${sig}</li>`;
  }).join("");

  const causes = (CUR.causes || []).map((c, i) =>
    `<div class="cause" data-cause="${esc(c.id)}">
       <div><span class="rank">${i + 1}</span><span class="what">${esc(c.cause)}</span></div>
       <div class="fix"><b>Fix.</b> ${esc(c.fix)}</div></div>`).join("");

  const prov = CUR.tier === "verified"
    ? `Verified <b>${esc(CUR.verified_on)}</b> against <code>${esc(CUR.verified_against)}</code>
       by ${esc(CUR.verified_by)}.${CUR.source ? ` <a href="${esc(CUR.source)}" target="_blank" rel="noopener">Official docs</a>` : ""}`
    : `Written from documentation, not yet run against a live system. Treat every command as unconfirmed.`;

  $("#rbview").innerHTML = `
    <button class="back" id="back">&larr; All runbooks</button>
    <h2>${esc(CUR.title)}</h2>
    <p class="sum">${esc(CUR.summary)}</p>
    <p class="prov">${prov}</p>
    <ol class="steps">${steps}</ol>
    ${causes ? `<div class="sec"><h3>Likely causes, most common first</h3>${causes}</div>` : ""}
    ${(CUR.verify || []).length ? `<div class="sec"><h3>You are done when</h3>
       <ul class="plain">${CUR.verify.map(v => `<li>${esc(fill(v, false))}</li>`).join("")}</ul></div>` : ""}`;

  $("#searchview").style.display = "none";
  $("#results").style.display = "none";
  $("#rbview").style.display = "block";
  $("#bar").style.display = "block";
  $("#foot").textContent = "";
  window.scrollTo(0, 0);
  repaintCmds(); wire(); progress();
}

function wire() {
  $("#back").onclick = home;

  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => {
    const s = CUR.steps[+b.dataset.copy];
    copy(fill(s.cmd, false), "Command copied");
  });

  document.querySelectorAll("[data-reveal]").forEach(v => v.onclick = () => {
    const i = +v.dataset.reveal, s = CUR.steps[i];
    v.outerHTML = `<pre data-cmd="${esc(s.cmd)}"></pre><button class="copy" data-copy="${i}">Copy</button>`;
    repaintCmds(); wire();
  });

  document.querySelectorAll("[data-done]").forEach(b => b.onclick = () => {
    const i = +b.dataset.done, li = b.closest(".step"), s = CUR.steps[i];
    li.classList.toggle("done");
    if (li.classList.contains("done")) {
      LOG.push({ t: new Date().toISOString().slice(11, 19), step: s.title, cmd: fill(s.cmd, false) });
    } else {
      LOG = LOG.filter(e => e.step !== s.title);
    }
    progress();
  });

  document.querySelectorAll("[data-sig]").forEach(ta => ta.oninput = () => {
    const i = +ta.dataset.sig, s = CUR.steps[i], text = ta.value;
    const out = $(`[data-verdict="${i}"]`);
    document.querySelectorAll(".cause").forEach(c => c.classList.remove("lit"));
    if (!text.trim()) {
      out.className = "verdict miss";
      out.textContent = "Nothing matched yet. Paste output above.";
      return;
    }
    const m = (s.signals || []).find(g => { try { return new RegExp(g.match, "i").test(text); } catch { return false; } });
    if (!m) {
      out.className = "verdict miss";
      out.textContent = "No known signature in that output. It may still be fine — read the note above, "
        + "or add this output as a new signal so the next person gets a hit.";
      return;
    }
    out.className = "verdict hit";
    const target = m.goto || "";
    out.innerHTML = `<b>That output means:</b>${esc(m.means)}`;
    if (target.startsWith("cause:")) {
      const c = (CUR.causes || []).find(x => x.id === target.slice(6));
      const el = $(`[data-cause="${CSS.escape(target.slice(6))}"]`);
      if (el) el.classList.add("lit");
      if (c) out.innerHTML += `<button class="jump">Go to the fix: ${esc(c.cause)}</button>`;
      out.querySelector(".jump") && (out.querySelector(".jump").onclick =
        () => el && el.scrollIntoView({ behavior: "smooth", block: "center" }));
    } else if (target.startsWith("step:")) {
      const n = +target.slice(5);
      out.innerHTML += `<button class="jump">Go to step ${n}</button>`;
      out.querySelector(".jump").onclick = () =>
        document.querySelector(`[data-step="${n - 1}"]`).scrollIntoView({ behavior: "smooth", block: "center" });
    }
    LOG.push({ t: new Date().toISOString().slice(11, 19), step: s.title,
               cmd: fill(s.cmd, false), note: m.means });
  });
}

function progress() {
  const total = (CUR.steps || []).length;
  const done = document.querySelectorAll(".step.done").length;
  $("#prog").textContent = `${done} of ${total} checks done`;
}

/* ---------- exports ---------- */
function copy(t, msg) {
  navigator.clipboard.writeText(t).then(() => {
    const el = $("#toast"); el.textContent = msg; el.style.display = "block";
    setTimeout(() => el.style.display = "none", 1600);
  }, () => prompt("Copy manually:", t));
}

$("#a-safe").onclick = () => {
  const c = (CUR.steps || []).filter(s => s.risk === "safe").map(s => `# ${s.title}\n${fill(s.cmd, false)}`);
  copy(c.join("\n\n"), `${c.length} read-only commands copied`);
};

$("#a-esc").onclick = () => {
  const L = [`## ${CUR.title}`, "", "**What I checked**"];
  LOG.forEach(e => { L.push(`- ${e.step} — \`${e.cmd}\``); if (e.note) L.push(`  - saw: ${e.note}`); });
  if (!LOG.length) L.push("- (nothing recorded yet)");
  L.push("", "**Still needed**");
  (CUR.escalate || []).forEach(x => L.push(`- ${fill(x, false)}`));
  copy(L.join("\n"), "Handoff notes copied");
};

$("#a-log").onclick = () => {
  const L = [`# Incident: ${CUR.title}`, `Runbook: ${CUR.id} (verified ${CUR.verified_on || "n/a"})`, ""];
  Object.entries(CTX).filter(([, v]) => v).forEach(([k, v]) => L.push(`- ${k}: \`${v}\``));
  L.push("", "| time | check | command | observed |", "|---|---|---|---|");
  LOG.forEach(e => L.push(`| ${e.t} | ${e.step} | \`${e.cmd}\` | ${e.note || ""} |`));
  if (!LOG.length) L.push("| | no checks recorded | | |");
  copy(L.join("\n"), "Incident log copied as markdown");
};

/* ---------- navigation ---------- */
function home() {
  CUR = null; LOG = [];
  $("#searchview").style.display = "block";
  $("#results").style.display = "block";
  $("#rbview").style.display = "none";
  $("#bar").style.display = "none";
  $("#ctxfields").innerHTML = "";
  $("#foot").textContent = FOOT;
  $("#q").focus(); $("#q").select();
}

$("#q").oninput = renderResults;

document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); $("#q").select(); return; }
  if (e.key === "Escape" && CUR) { home(); return; }
  if (CUR || !["ArrowDown", "ArrowUp", "Enter"].includes(e.key)) return;
  const hits = [...document.querySelectorAll(".hit")];
  if (!hits.length) return;
  if (e.key === "Enter") { e.preventDefault(); hits[Math.max(0, CURSOR)].click(); return; }
  e.preventDefault();
  hits[CURSOR]?.classList.remove("cur");
  CURSOR = (CURSOR + (e.key === "ArrowDown" ? 1 : -1) + hits.length) % hits.length;
  hits[CURSOR].classList.add("cur");
  hits[CURSOR].scrollIntoView({ block: "nearest" });
});

const v = BANK.filter(r => r.tier === "verified").length;
const techs = [...new Set(BANK.map(r => r.technology))].sort();
const FOOT = `${v} verified runbook${v === 1 ? "" : "s"} across ${techs.join(", ")}. `
  + `Runs entirely in this file — nothing is sent anywhere, nothing is executed for you, `
  + `and nothing is saved when you close the tab. Every command is yours to run.\n\n`
  + `Designed and built by Dinesh Ilangovan. Every runbook marked verified was run `
  + `against a real system, with the date and version recorded on it.`;
$("#foot").textContent = FOOT;
renderChips();
renderResults();
</script>
</body>
</html>
