<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Runbook</title>
<style>
:root{
  --paper:#EEF1F4; --surface:#fff; --ink:#141C24; --muted:#5A6976;
  --rule:#D5DCE3; --rule-soft:#E4E9ED;
  --safe:#0F7B54; --state:#A15C00; --destructive:#BC2C24;
  --focus:#1F5FA8;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --mono:"Cascadia Mono",ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.5;font-feature-settings:"tnum" 1}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:940px;margin:0 auto;padding:0 20px}

/* ---- context strip ---- */
.ctx{background:var(--ink);color:#DCE3EA;position:sticky;top:0;z-index:20}
.ctx .wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding-top:9px;padding-bottom:9px}
.ctx .brand{font-weight:650;letter-spacing:-.01em;color:#fff;margin-right:auto;font-size:15px}
.ctx .by{font-weight:400;color:#8095A8;font-size:12.5px;margin-left:7px}
@media(max-width:640px){.ctx .by{display:none}}
.ctx label{display:flex;align-items:baseline;gap:6px;font-size:12.5px;color:#9FB0BF}
.ctx input{background:transparent;border:0;border-bottom:1px solid #3C4A57;color:#fff;
  font-family:var(--mono);font-size:13px;padding:1px 2px;width:15ch;min-width:0}
.ctx input:focus{border-bottom-color:#7FA8D4;outline:none}
.ctx input::placeholder{color:#5A6976}

/* ---- search ---- */
.search{padding:44px 0 26px}
h1{font-size:28px;line-height:1.2;letter-spacing:-.02em;margin:0 0 6px;font-weight:640}
.lede{color:var(--muted);margin:0 0 22px;max-width:62ch}
#q{width:100%;padding:14px 16px;border:1px solid var(--rule);border-radius:6px;
  background:var(--surface);font-size:17px}
#q:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px rgba(31,95,168,.12)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
.chips.sub{margin-top:8px}
.tab{background:var(--surface);border:1px solid var(--rule);border-radius:20px;padding:6px 14px;
  font-size:13.5px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tab:hover{border-color:var(--ink)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab .n{font-size:11.5px;opacity:.6;font-variant-numeric:tabular-nums}
.chips.sub .tab{padding:4px 11px;font-size:12.5px;border-radius:4px;color:var(--muted)}
.chips.sub .tab.on{color:#fff}
.hint{margin-top:13px;font-size:12.5px;color:var(--muted)}
kbd{font-family:var(--mono);font-size:11.5px;border:1px solid var(--rule);border-bottom-width:2px;
  border-radius:3px;padding:1px 5px;background:var(--surface)}

/* ---- results ---- */
.results{list-style:none;margin:0;padding:0 0 56px}
.results li{border-top:1px solid var(--rule-soft)}
.results li:last-child{border-bottom:1px solid var(--rule-soft)}
.hit{display:block;width:100%;text-align:left;background:none;border:0;padding:15px 14px;cursor:pointer}
.hit:hover,.hit.cur{background:var(--surface)}
.hit h3{margin:0;font-size:16.5px;font-weight:600;letter-spacing:-.005em}
.hit p{margin:3px 0 0;color:var(--muted);font-size:14px}
.meta{margin-top:7px;font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.empty{padding:40px 14px;color:var(--muted);border-top:1px solid var(--rule-soft)}

/* ---- trust badge ---- */
.trust{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600}
.trust::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-verified{color:var(--safe)} .t-documented{color:var(--state)} .t-reference{color:var(--muted)}

/* ---- runbook ---- */
.rb{padding:26px 0 90px;display:none}
.back{background:none;border:0;padding:0;color:var(--muted);font-size:13.5px;cursor:pointer;margin-bottom:18px}
.back:hover{color:var(--ink)}
.rb h2{font-size:25px;line-height:1.2;letter-spacing:-.02em;margin:0 0 6px;font-weight:640}
.rb .sum{color:var(--muted);margin:0 0 14px;max-width:64ch}
.prov{font-size:12.5px;color:var(--muted);border-left:2px solid var(--rule);padding:2px 0 2px 11px;margin-bottom:26px}
.prov code{font-family:var(--mono);font-size:12px}
.prov a{color:var(--focus)}

/* ---- the rail ---- */
ol.steps{list-style:none;margin:0;padding:0}
.step{position:relative;padding:0 0 26px 40px}
.step::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:1px;background:var(--rule)}
.step:last-child::before{display:none}
.step.danger::before{background:var(--destructive);opacity:.35}
.mark{position:absolute;left:0;top:2px;width:23px;height:23px;border:1px solid var(--rule);
  background:var(--surface);border-radius:3px;cursor:pointer;padding:0;
  font-family:var(--mono);font-size:12px;color:var(--muted);line-height:21px;text-align:center}
.mark:hover{border-color:var(--ink)}
.step.done .mark{background:var(--ink);border-color:var(--ink);color:#fff}
.step.done .stitle{color:var(--muted)}
.step.danger .mark{border-color:var(--destructive);color:var(--destructive)}

.shead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:9px}
.stitle{font-weight:600;font-size:16px;letter-spacing:-.005em}
.chip{font-size:11px;font-weight:650;padding:2px 7px;border-radius:3px;white-space:nowrap}
.c-safe{color:var(--safe);background:rgba(15,123,84,.09)}
.c-state{color:var(--state);background:rgba(161,92,0,.10)}
.c-destructive{color:#fff;background:var(--destructive)}

.cmd{position:relative;background:var(--ink);border-radius:5px;margin:0 0 10px}
.cmd pre{margin:0;padding:13px 84px 13px 14px;overflow-x:auto;font-family:var(--mono);
  font-size:13.5px;line-height:1.55;color:#E8EEF3;white-space:pre-wrap;word-break:break-word}
.cmd .fill{color:#8FD0A8;font-weight:600}
.cmd .unfilled{color:#E0A86A;border-bottom:1px dashed #8A6A48}
.copy{position:absolute;top:8px;right:8px;background:#2A3640;border:0;color:#C6D3DD;
  font-size:12px;padding:5px 10px;border-radius:4px;cursor:pointer}
.copy:hover{background:#3A4854;color:#fff}
.veil{padding:13px 14px;color:#E0A86A;font-family:var(--mono);font-size:13px;cursor:pointer;
  display:flex;align-items:center;gap:9px}
.veil:hover{color:#fff}

.look{font-size:14.5px;color:var(--muted);margin:0 0 8px;max-width:66ch}
.look b{color:var(--ink);font-weight:600}
.note{font-size:14px;border-left:2px solid var(--destructive);padding:6px 0 6px 11px;
  margin:0 0 10px;max-width:64ch;color:var(--ink)}
.note-state{border-left-color:var(--state)}

/* ---- output matcher ---- */
.match{margin-top:10px}
.match summary{font-size:13.5px;color:var(--focus);cursor:pointer;list-style:none}
.match summary::-webkit-details-marker{display:none}
.match summary::before{content:"+ ";font-family:var(--mono)}
.match[open] summary::before{content:"- "}
.match textarea{width:100%;margin-top:9px;min-height:78px;padding:10px 12px;border:1px solid var(--rule);
  border-radius:5px;font-family:var(--mono);font-size:12.5px;background:var(--surface);resize:vertical}
.verdict{margin-top:9px;padding:11px 13px;border-radius:5px;font-size:14.5px;background:var(--surface);
  border:1px solid var(--rule)}
.verdict.hit{border-color:var(--safe);border-left:3px solid var(--safe)}
.verdict.miss{color:var(--muted)}
.verdict b{display:block;margin-bottom:3px}
.jump{background:none;border:0;color:var(--focus);padding:0;margin-top:6px;cursor:pointer;font-size:13.5px}

/* ---- causes ---- */
.sec{margin-top:34px;padding-top:20px;border-top:1px solid var(--rule)}
.sec h3{font-size:13px;font-weight:650;margin:0 0 14px;color:var(--muted);letter-spacing:.01em}
.cause{padding:13px 15px;background:var(--surface);border:1px solid var(--rule-soft);border-radius:5px;margin-bottom:9px}
.cause.lit{border-color:var(--safe);border-left:3px solid var(--safe)}
.cause .rank{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-right:7px}
.cause .what{font-weight:600;font-size:15px}
.cause .fix{color:var(--muted);font-size:14.5px;margin-top:4px;max-width:66ch}
.cause .fix b{color:var(--ink);font-weight:600}
ul.plain{margin:0;padding-left:19px;color:var(--muted);font-size:14.5px;max-width:66ch}
ul.plain li{margin-bottom:5px}

/* ---- action bar ---- */
.bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--rule);
  padding:11px 0;display:none;z-index:15}
.bar .wrap{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.bar .prog{font-size:13px;color:var(--muted);margin-right:auto;font-variant-numeric:tabular-nums}
.act{background:var(--surface);border:1px solid var(--rule);border-radius:5px;padding:7px 13px;
  font-size:13.5px;cursor:pointer}
.act:hover{border-color:var(--ink)}
.act.key{background:var(--ink);color:#fff;border-color:var(--ink)}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:9px 17px;border-radius:5px;font-size:13.5px;z-index:30;display:none}

footer{color:var(--muted);font-size:12.5px;padding:0 0 30px;max-width:70ch;white-space:pre-line}

@media(max-width:640px){
  .wrap{padding:0 15px}
  .search{padding:26px 0 18px} h1{font-size:23px} .rb h2{font-size:21px}
  .ctx .wrap{gap:11px} .ctx input{width:11ch}
  .step{padding-left:33px} .mark{width:21px;height:21px;line-height:19px}
  .step::before{left:10px}
  .cmd pre{padding-right:14px;padding-top:38px}
  .copy{top:6px;right:auto;left:8px}
}
</style>
</head>
<body>

<div class="ctx"><div class="wrap">
  <span class="brand">DevOps Runbook <span class="by">by Dinesh Ilangovan</span></span>
  <span id="ctxfields"></span>
</div></div>

<main class="wrap">

<section class="search" id="searchview">
  <h1>What is broken?</h1>
  <p class="lede">Type the symptom, the error string, or what you were doing when it failed.</p>
  <input id="q" placeholder="CrashLoopBackOff, pod pending, committed to main, force push..." autocomplete="off" autofocus>
  <div class="chips" id="techchips"></div>
  <div class="chips sub" id="catchips"></div>
  <p class="hint"><kbd>/</kbd> search &nbsp; <kbd>↑</kbd><kbd>↓</kbd> move &nbsp; <kbd>Enter</kbd> open &nbsp; <kbd>Esc</kbd> back</p>
</section>

<ul class="results" id="results"></ul>

<section class="rb" id="rbview"></section>

<footer id="foot"></footer>
</main>

<div class="bar" id="bar"><div class="wrap">
  <span class="prog" id="prog"></span>
  <button class="act" id="a-safe">Copy read-only steps</button>
  <button class="act" id="a-esc">Copy handoff notes</button>
  <button class="act key" id="a-log">Copy incident log</button>
</div></div>
<div class="toast" id="toast"></div>

<script id="data" type="application/json">[{"id":"k8s-crashloopbackoff","tier":"guide","technology":"Kubernetes","category":"Pods & Containers","title":"Pod is in CrashLoopBackOff","summary":"The container starts, exits, and Kubernetes keeps restarting it with growing delay.","aliases":["crashloop","crashloopbackoff","pod keeps restarting","restarts increasing","back-off restarting failed container","pod wont stay up"],"source":"https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/","inputs":[{"key":"pod","label":"Pod name","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"},{"key":"container","label":"Container","example":"checkout-api"}],"steps":[{"title":"Confirm it is actually looping","cmd":"kubectl get pod {pod} -n {namespace} -o wide","risk":"safe","look":"RESTARTS climbing over successive checks. A high but static count is an old incident, not a live one.","signals":[{"match":"Completed","means":"This is a Job or a one-shot container that finished. restartPolicy is wrong, not the app.","goto":"cause:wrong-restart-policy"}]},{"title":"Read the previous container's logs","cmd":"kubectl logs {pod} -n {namespace} -c {container} --previous --tail=200","risk":"safe","look":"The FIRST fatal line, not the last. Startup errors scroll off the top and the tail is usually just the shutdown noise.","signals":[{"match":"(?i)connection refused|no route to host|timeout.*dial","means":"It died waiting on a dependency that was not reachable.","goto":"cause:dependency-unreachable"},{"match":"(?i)(not set|missing|undefined).*(env|variable|config)|panic.*nil","means":"Required configuration was absent at startup.","goto":"cause:missing-config"},{"match":"(?i)permission denied|operation not permitted","means":"The process cannot read a path or bind a port as its runAsUser.","goto":"cause:permissions"}]},{"title":"Read the termination state","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.status.containerStatuses[*].lastState.terminated}'","risk":"safe","look":"exitCode and reason. This is the single most decisive field in the whole runbook.","signals":[{"match":"OOMKilled|\"exitCode\":137","means":"The kernel killed it for memory. No amount of restarting will fix this.","goto":"cause:oom"},{"match":"\"exitCode\":126","means":"The entrypoint was found but is not executable. Check the file mode in the image.","goto":"cause:entrypoint-not-executable"},{"match":"\"exitCode\":127","means":"The entrypoint was not found at all. Wrong path, or missing shell in a distroless base.","goto":"cause:entrypoint-missing"},{"match":"\"exitCode\":1\\b","means":"The application chose to exit. The reason is in the logs, not here.","goto":"step:2"}]},{"title":"Check whether a probe is doing the killing","cmd":"kubectl describe pod {pod} -n {namespace}","risk":"safe","look":"Events for 'Liveness probe failed'. If present, the app may be healthy but slow to start, and the probe is executing it.","signals":[{"match":"Liveness probe failed","means":"The liveness probe is killing a container that may only need more startup time.","goto":"cause:liveness-too-aggressive"}]}],"causes":[{"id":"missing-config","cause":"A required env var, Secret key or ConfigMap key is absent, so the process exits during startup.","fix":"Fix the owning Deployment/Secret/ConfigMap in source control and reconcile. Do not patch the live Pod.","confirm":"kubectl get deploy -n {namespace} -o yaml | grep -A5 'envFrom\\|valueFrom'"},{"id":"oom","cause":"The container's memory limit is below its real working set.","fix":"Raise limits.memory in the owning Deployment, or fix the leak. Restarting will reproduce it every time.","confirm":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].resources}'"},{"id":"dependency-unreachable","cause":"A database, cache or upstream service was not reachable at startup.","fix":"Confirm the dependency's Service has endpoints, then decide whether the app should retry instead of exiting.","confirm":"kubectl get endpointslices -n {namespace}"},{"id":"liveness-too-aggressive","cause":"initialDelaySeconds is shorter than the app's real startup time, so liveness kills it mid-boot.","fix":"Move the slow-start allowance to a startupProbe rather than inflating the liveness delay.","confirm":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].livenessProbe}'"},{"id":"entrypoint-missing","cause":"Exit 127. The command in the image manifest does not exist at that path.","fix":"Check the Dockerfile ENTRYPOINT/CMD against the built image. A distroless base has no /bin/sh.","confirm":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].command}'"},{"id":"entrypoint-not-executable","cause":"Exit 126. The file exists but lacks the execute bit, or its interpreter line is wrong.","fix":"Add chmod +x in the Dockerfile, or fix the shebang. Rebuild the image.","confirm":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].image}'"},{"id":"permissions","cause":"runAsUser cannot read a mounted path or bind a privileged port.","fix":"Correct fsGroup on the volume, or move the app to a port above 1024.","confirm":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.securityContext}'"},{"id":"wrong-restart-policy","cause":"A one-shot workload is running under restartPolicy Always.","fix":"Run it as a Job with restartPolicy OnFailure or Never.","confirm":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.restartPolicy}'"}],"verify":["RESTARTS holds steady across at least three checks spanning the app's normal startup window.","The container reports Ready, and readiness has not flapped in recent events.","The original failing request or job path completes successfully."],"escalate":["Output of --previous logs, first 50 lines","The lastState.terminated block, verbatim","Image tag and digest, plus resources and probe definitions"]},{"id":"k8s-pod-pending","tier":"guide","technology":"Kubernetes","category":"Scheduling","title":"Pod stays Pending and is never scheduled","summary":"The Pod object exists but no node has accepted it.","aliases":["pod pending","not scheduled","failedscheduling","no nodes available","pod stuck pending","0/3 nodes are available"],"source":"https://kubernetes.io/docs/concepts/scheduling-eviction/","inputs":[{"key":"pod","label":"Pod name","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the scheduler's own reason","cmd":"kubectl get event -n {namespace} --field-selector involvedObject.name={pod},reason=FailedScheduling -o jsonpath='{.items[-1:].message}'","risk":"safe","look":"The scheduler states exactly why each node was rejected, in the form '0/N nodes are available: ...'. Read that string before anything else.","signals":[{"match":"(?i)insufficient (cpu|memory|ephemeral-storage)","means":"No node has enough free allocatable resource for the requests.","goto":"cause:insufficient-resources"},{"match":"(?i)didn't match.*(node selector|affinity)","means":"The nodeSelector or affinity rule matches no node's labels.","goto":"cause:selector-mismatch"},{"match":"(?i)had (untolerated )?taint","means":"Every candidate node carries a taint this Pod does not tolerate.","goto":"cause:taint"},{"match":"(?i)pod has unbound immediate PersistentVolumeClaims","means":"This is a storage problem wearing a scheduling costume.","goto":"cause:unbound-pvc"},{"match":"(?i)node\\(s\\) didn't find available persistent volumes|volume node affinity conflict","means":"The PV is pinned to a zone the scheduler cannot place the Pod in.","goto":"cause:zone-conflict"}]},{"title":"Compare the request against real allocatable capacity","cmd":"kubectl describe nodes | grep -A6 'Allocated resources'","risk":"safe","look":"Requests, not usage. A node at 12% CPU usage can still be 100% requested and therefore unschedulable."},{"title":"Read what this Pod is actually asking for","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].resources.requests}{\"\\n\"}{.spec.nodeSelector}{\"\\n\"}{.spec.tolerations}'","risk":"safe","look":"Compare these three against the previous step. The mismatch is usually obvious once both are on screen."}],"causes":[{"id":"insufficient-resources","cause":"The sum of requests exceeds allocatable on every node.","fix":"Lower the request to the workload's real profile, or add capacity. Raising the limit does not help; the scheduler reads requests.","confirm":"kubectl top nodes"},{"id":"selector-mismatch","cause":"nodeSelector or nodeAffinity references labels no node carries, often after a node pool was replaced.","fix":"Correct the selector, or label the intended nodes. Check for typos in the label key first.","confirm":"kubectl get nodes --show-labels"},{"id":"taint","cause":"Nodes are tainted (NoSchedule) and the Pod has no matching toleration.","fix":"Add the toleration if the Pod belongs on those nodes, otherwise target a different pool.","confirm":"kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{\"\\t\"}{.spec.taints}{\"\\n\"}{end}'"},{"id":"unbound-pvc","cause":"A referenced PVC has not bound, so the Pod cannot be placed.","fix":"Follow the PVC Pending runbook. Nothing about the Pod spec will fix this.","confirm":"kubectl get pvc -n {namespace}"},{"id":"zone-conflict","cause":"An existing PV lives in one zone and the Pod cannot be scheduled there.","fix":"Use a topology-aware StorageClass with volumeBindingMode WaitForFirstConsumer.","confirm":"kubectl get pv -o jsonpath='{range .items[*]}{.metadata.name}{\"\\t\"}{.spec.nodeAffinity}{\"\\n\"}{end}'"}],"verify":["The Pod reports a nodeName and moves past Pending.","No new FailedScheduling events appear for this Pod.","The change was made in the owning manifest, not by editing the live Pod."],"escalate":["The full FailedScheduling message","Allocated resources block from describe nodes","The Pod's requests, nodeSelector and tolerations"]},{"id":"k8s-service-no-endpoints","tier":"guide","technology":"Kubernetes","category":"Services & Networking","title":"Service exists but returns connection refused","summary":"DNS resolves the Service, but nothing answers. Usually the Service has no endpoints.","aliases":["no endpoints","connection refused service","service not working","empty endpointslice","selector not matching","503 from service"],"source":"https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/","inputs":[{"key":"service","label":"Service name","example":"checkout-api"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Check whether the Service has any endpoints at all","cmd":"kubectl get endpointslices -n {namespace} -l kubernetes.io/service-name={service}","risk":"safe","look":"ENDPOINTS column. If it is empty or <none>, the Service is pointing at nothing and the problem is the selector or pod readiness, not the network.","signals":[{"match":"(?i)<none>|No resources found","means":"No pods are backing this Service.","goto":"step:2"}]},{"title":"Compare the Service selector against real pod labels","cmd":"kubectl get svc {service} -n {namespace} -o jsonpath='{.spec.selector}{\"\\n\"}' && kubectl get pods -n {namespace} --show-labels","risk":"safe","look":"An exact match on every key. One extra or renamed label is enough to produce an empty Service, and this is the most common cause by a wide margin.","signals":[{"match":"(?i)app=","means":"Compare character by character. 'app' and 'app.kubernetes.io/name' are different keys.","goto":"cause:selector-mismatch"}]},{"title":"Check whether the backing pods are Ready","cmd":"kubectl get pods -n {namespace} -o wide","risk":"safe","look":"A pod that is Running but 0/1 Ready is excluded from endpoints. Readiness, not liveness, controls Service membership.","signals":[{"match":"0/1\\s+Running","means":"The pod is up but failing readiness, so it is deliberately kept out of the Service.","goto":"cause:not-ready"}]},{"title":"Confirm the target port matches the container port","cmd":"kubectl get svc {service} -n {namespace} -o jsonpath='{.spec.ports}'","risk":"safe","look":"targetPort must match the container's real listening port, or a named port the container declares. port is what clients dial; targetPort is where it lands."}],"causes":[{"id":"selector-mismatch","cause":"The Service selector does not match the pod labels.","fix":"Align them in the manifests. Changing the Deployment's pod labels forces a rollout, so prefer correcting the Service.","confirm":"kubectl get endpointslices -n {namespace} -l kubernetes.io/service-name={service}"},{"id":"not-ready","cause":"Pods are running but failing their readiness probe, so kube-proxy excludes them.","fix":"Fix the readiness endpoint or its threshold. The Service will populate on its own once pods report Ready.","confirm":"kubectl get pods -n {namespace} -o wide"},{"id":"wrong-target-port","cause":"targetPort points at a port nothing is listening on.","fix":"Set targetPort to the container's real port, or use a named port so the two cannot drift.","confirm":"kubectl get svc {service} -n {namespace} -o jsonpath='{.spec.ports}'"}],"verify":["EndpointSlice lists the expected pod IPs.","A request from inside the cluster to the Service name succeeds.","The count of endpoints matches the number of Ready replicas."],"escalate":["Service spec, selector and ports","Pod labels and readiness state","EndpointSlice contents"]},{"id":"k8s-imagepullbackoff","tier":"guide","technology":"Kubernetes","category":"Pods & Containers","title":"ImagePullBackOff or ErrImagePull","summary":"The kubelet cannot fetch the image. The event message says which of four reasons.","aliases":["imagepullbackoff","errimagepull","cannot pull image","image not found","unauthorized pull","pull secret"],"source":"https://kubernetes.io/docs/concepts/containers/images/","inputs":[{"key":"pod","label":"Pod name","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the pull failure message","cmd":"kubectl describe pod {pod} -n {namespace} | grep -A5 Events","risk":"safe","look":"The Failed event's message. It names the exact reason, and each reason has a different owner.","signals":[{"match":"(?i)not found|manifest unknown","means":"The tag does not exist in the registry.","goto":"cause:bad-tag"},{"match":"(?i)unauthorized|authentication required","means":"The node has no valid credentials for this registry.","goto":"cause:no-secret"},{"match":"(?i)x509|certificate","means":"TLS trust failure between the node and the registry.","goto":"cause:tls"},{"match":"(?i)timeout|i/o timeout|no such host","means":"The node could not reach the registry at all.","goto":"cause:unreachable"}]},{"title":"Check the image reference on the pod","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].image}'","risk":"safe","look":"Typos in the registry host or tag are the single most common cause. Read it character by character."},{"title":"Check whether a pull secret is attached","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.imagePullSecrets}'","risk":"safe","look":"Empty output on a private registry means the pod has no credentials. The secret must live in the same namespace as the pod."}],"causes":[{"id":"bad-tag","cause":"The tag does not exist in the repository.","fix":"Fix the tag in the manifest. Prefer pinning by digest for anything production.","confirm":""},{"id":"no-secret","cause":"No imagePullSecret, or it exists in a different namespace.","fix":"Create the secret in this namespace and reference it on the pod or its ServiceAccount.","confirm":""},{"id":"tls","cause":"The node does not trust the registry's certificate.","fix":"Install the CA on the nodes. Do not mark the registry insecure.","confirm":""},{"id":"unreachable","cause":"The node has no network path to the registry.","fix":"Check egress rules, the NAT gateway and any proxy configuration on the nodes.","confirm":""}],"verify":["The pod moves past ImagePullBackOff and the container starts.","No new Failed pull events appear."],"escalate":["The full Failed event message","The exact image reference","Whether an imagePullSecret is attached and in which namespace"]},{"id":"k8s-oomkilled","tier":"guide","technology":"Kubernetes","category":"Pods & Containers","title":"Container was OOMKilled","summary":"The kernel killed the container for exceeding its memory limit. Restarting reproduces it.","aliases":["oomkilled","exit 137","out of memory","memory limit","container killed memory","oom"],"source":"https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/","inputs":[{"key":"pod","label":"Pod name","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Confirm it was memory and not an external kill","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.status.containerStatuses[*].lastState.terminated.reason}'","risk":"safe","look":"OOMKilled specifically. Exit 137 alone only means SIGKILL, which something else could have sent.","signals":[{"match":"OOMKilled","means":"The kernel's OOM killer took it. This is a limit problem, not a crash.","goto":"cause:limit-too-low"}]},{"title":"Read the configured limit","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].resources}'","risk":"safe","look":"Compare limits.memory against what the process actually needs. If requests and limits differ widely, scheduling and eviction behave in ways you may not expect."},{"title":"Look at actual usage while it runs","cmd":"kubectl top pod {pod} -n {namespace} --containers","risk":"safe","look":"Usage climbing steadily towards the limit points at a leak. Usage spiking at a particular operation points at a batch size or a large request."},{"title":"Check whether the whole node is under pressure","cmd":"kubectl describe node $(kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.nodeName}') | grep -A5 Conditions","risk":"safe","look":"MemoryPressure true means the node is squeezed and eviction is in play, which is a different problem from a single container's limit."}],"causes":[{"id":"limit-too-low","cause":"The limit is below the real working set.","fix":"Raise limits.memory in the owning Deployment. Measure first with kubectl top rather than guessing.","confirm":""},{"id":"leak","cause":"Memory grows without bound until the limit is reached.","fix":"Raising the limit only delays it. Profile the application; the limit is doing its job.","confirm":""},{"id":"jvm-unaware","cause":"A JVM or Node process sized its heap against the node rather than the cgroup.","fix":"Set an explicit max heap, or use a runtime version that is container-aware.","confirm":""},{"id":"node-pressure","cause":"The node is out of memory and evicting pods.","fix":"Check requests across the node. Under-requesting causes overcommit and cascading evictions.","confirm":""}],"verify":["RESTARTS holds steady through a full workload cycle.","kubectl top shows headroom between usage and the limit."],"escalate":["lastState.terminated block","resources.requests and resources.limits","kubectl top output over a few minutes"]},{"id":"k8s-rollout-stuck","tier":"guide","technology":"Kubernetes","category":"Workloads","title":"Deployment rollout never finishes","summary":"kubectl rollout status hangs. New pods are not becoming ready, or the old ones will not go.","aliases":["rollout stuck","deployment not progressing","waiting for rollout","progressdeadlineexceeded","stuck deploying","rollout hangs"],"source":"https://kubernetes.io/docs/concepts/workloads/controllers/deployment/","inputs":[{"key":"deploy","label":"Deployment","example":"checkout-api"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the rollout condition","cmd":"kubectl get deploy {deploy} -n {namespace} -o jsonpath='{.status.conditions}'","risk":"safe","look":"The Progressing condition's reason. ProgressDeadlineExceeded means it gave up; that reason names the layer at fault.","signals":[{"match":"ProgressDeadlineExceeded","means":"The new ReplicaSet never became available in time.","goto":"step:2"},{"match":"(?i)ReplicaSetUpdated","means":"Still in progress. Give it the deadline before treating it as stuck.","goto":""}]},{"title":"Find what the new pods are doing","cmd":"kubectl get pods -n {namespace} -l app={deploy} --sort-by=.metadata.creationTimestamp","risk":"safe","look":"The newest pods. Pending means scheduling, CrashLoop means the app, 0/1 Running means readiness.","signals":[{"match":"Pending","means":"Scheduling, not deployment. Follow the Pending runbook.","goto":"cause:scheduling"},{"match":"CrashLoopBackOff","means":"The new image does not start. Follow the CrashLoop runbook.","goto":"cause:new-image-broken"},{"match":"0/1\\s+Running","means":"The container runs but fails readiness.","goto":"cause:readiness"}]},{"title":"Check whether a disruption budget is blocking removal","cmd":"kubectl get pdb -n {namespace}","risk":"safe","look":"ALLOWED DISRUPTIONS at zero means old pods cannot be evicted, so the rollout cannot proceed."},{"title":"Check the surge and unavailable settings","cmd":"kubectl get deploy {deploy} -n {namespace} -o jsonpath='{.spec.strategy}'","risk":"safe","look":"maxSurge 0 with maxUnavailable 0 is a deadlock: nothing new can start and nothing old can stop."}],"causes":[{"id":"new-image-broken","cause":"The new image fails to start.","fix":"Roll back, then fix the image. kubectl rollout undo restores the previous ReplicaSet.","confirm":""},{"id":"readiness","cause":"New pods run but never pass readiness.","fix":"Check the probe path, port and initial delay against the new image's real startup.","confirm":""},{"id":"scheduling","cause":"New pods cannot be placed.","fix":"Follow the Pending runbook. Often the surge replica has nowhere to go.","confirm":""},{"id":"pdb-block","cause":"A PodDisruptionBudget forbids removing the old pods.","fix":"Relax minAvailable, or scale up so the budget can be satisfied during the roll.","confirm":""},{"id":"strategy-deadlock","cause":"maxSurge and maxUnavailable are both zero.","fix":"Set at least one of them above zero.","confirm":""}],"verify":["kubectl rollout status returns successfully.","All replicas are on the new ReplicaSet and Ready."],"escalate":["Deployment status conditions","State of the newest pods","Strategy settings and any PDB"]},{"id":"k8s-node-notready","tier":"guide","technology":"Kubernetes","category":"Nodes","title":"Node is NotReady","summary":"The node stopped reporting healthy. Pods on it will be evicted after the toleration window.","aliases":["node notready","node not ready","kubelet down","node unreachable","node lost","kubelet stopped posting"],"source":"https://kubernetes.io/docs/concepts/architecture/nodes/","inputs":[{"key":"node","label":"Node name","example":"ip-10-0-3-14.ec2.internal"}],"steps":[{"title":"Read the node's conditions","cmd":"kubectl describe node {node} | grep -A10 Conditions","risk":"safe","look":"Which condition is false or unknown. Ready Unknown means the kubelet stopped reporting entirely, which is very different from a pressure condition.","signals":[{"match":"(?i)Ready\\s+Unknown","means":"The kubelet stopped posting status. The node may be gone or partitioned.","goto":"cause:kubelet-silent"},{"match":"(?i)DiskPressure\\s+True","means":"The node is out of disk.","goto":"cause:disk"},{"match":"(?i)MemoryPressure\\s+True","means":"The node is out of memory.","goto":"cause:memory"},{"match":"(?i)PIDPressure\\s+True","means":"Process ID exhaustion, usually a fork loop.","goto":"cause:pids"},{"match":"(?i)NetworkUnavailable\\s+True","means":"The CNI has not configured the node's network.","goto":"cause:cni"}]},{"title":"Check how long it has been unhealthy","cmd":"kubectl get node {node} -o wide","risk":"safe","look":"The age against the last transition. Pods are evicted after the not-ready toleration, five minutes by default."},{"title":"See what is still on it","cmd":"kubectl get pods --all-namespaces --field-selector spec.nodeName={node}","risk":"safe","look":"Anything not yet evicted. Stateful workloads here need attention before the node is replaced."},{"title":"Cordon it so nothing new lands","cmd":"kubectl cordon {node}","risk":"state","look":"The node shows SchedulingDisabled. Do this before investigating so the problem does not spread.","note":"Marks the node unschedulable. Running pods are not touched, but nothing new will be placed. Reverse with kubectl uncordon."}],"causes":[{"id":"kubelet-silent","cause":"The kubelet is not posting status.","fix":"Check the host: is it up, is the kubelet service running, can it reach the API server.","confirm":""},{"id":"disk","cause":"The node's disk is full, often image or log growth.","fix":"Clear space, then set image garbage collection and log rotation so it does not recur.","confirm":""},{"id":"memory","cause":"The node is out of memory.","fix":"Look for pods without limits. Overcommit on requests is the usual root cause.","confirm":""},{"id":"pids","cause":"Process ID exhaustion.","fix":"Find the fork loop. Set a pid limit on the offending workload.","confirm":""},{"id":"cni","cause":"The CNI plugin has not initialised on the node.","fix":"Check the CNI DaemonSet's pod on that node.","confirm":""}],"verify":["The node reports Ready.","Workloads have rescheduled and are serving.","The condition that flipped has a remediation, not just a restart."],"escalate":["Full conditions block","Whether the host is reachable outside Kubernetes","Pods still bound to the node"]},{"id":"k8s-pvc-pending","tier":"guide","technology":"Kubernetes","category":"Storage","title":"PersistentVolumeClaim stays Pending","summary":"The claim never binds, so every pod using it stays Pending too.","aliases":["pvc pending","volume not bound","waiting for first consumer","no persistent volumes available","storage class","pvc stuck"],"source":"https://kubernetes.io/docs/concepts/storage/persistent-volumes/","inputs":[{"key":"pvc","label":"PVC name","example":"postgres-data"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the binding events","cmd":"kubectl describe pvc {pvc} -n {namespace} | grep -A10 Events","risk":"safe","look":"The provisioner's own message. WaitForFirstConsumer is not an error at all; it is the expected state until a pod is scheduled.","signals":[{"match":"(?i)waiting for first consumer","means":"Normal. The volume binds when a pod that uses it gets scheduled.","goto":"cause:wait-first-consumer"},{"match":"(?i)storageclass.*not found","means":"The named StorageClass does not exist in this cluster.","goto":"cause:no-storageclass"},{"match":"(?i)no persistent volumes available","means":"Static provisioning with no matching PV.","goto":"cause:no-matching-pv"},{"match":"(?i)failed to provision|quota","means":"The provisioner tried and the backend refused.","goto":"cause:backend-refused"}]},{"title":"Check the requested class and access mode","cmd":"kubectl get pvc {pvc} -n {namespace} -o jsonpath='{.spec.storageClassName}{\" \"}{.spec.accessModes}{\" \"}{.spec.resources.requests.storage}'","risk":"safe","look":"ReadWriteMany is unsupported by most block storage drivers and is a common silent mismatch."},{"title":"List the classes that actually exist","cmd":"kubectl get storageclass","risk":"safe","look":"Whether the requested name exists, and which class is marked default. An empty storageClassName uses the default; a missing default leaves the claim Pending forever."}],"causes":[{"id":"wait-first-consumer","cause":"The class uses WaitForFirstConsumer.","fix":"Nothing is wrong. Schedule a pod that mounts it and it will bind.","confirm":""},{"id":"no-storageclass","cause":"The named class does not exist.","fix":"Correct the name, or install the class. Cluster migrations often leave stale names in manifests.","confirm":""},{"id":"no-matching-pv","cause":"Static provisioning with no PV matching size, class and access mode.","fix":"Create a matching PV, or move to dynamic provisioning.","confirm":""},{"id":"access-mode","cause":"The driver does not support the requested access mode.","fix":"Use ReadWriteOnce for block storage, or a filesystem driver for ReadWriteMany.","confirm":""},{"id":"backend-refused","cause":"The storage backend rejected the request, often on quota.","fix":"Read the provisioner's message and check the cloud-side quota.","confirm":""}],"verify":["The PVC reports Bound with a volume name.","The pod that needed it is scheduled and running."],"escalate":["PVC events","Requested class, size and access mode","Output of kubectl get storageclass"]},{"id":"k8s-dns-failure","tier":"guide","technology":"Kubernetes","category":"DNS","title":"DNS resolution fails inside pods","summary":"Names do not resolve from within the cluster. Work out whether it is CoreDNS, the pod's resolver, or upstream.","aliases":["dns not working","name resolution failed","coredns","cannot resolve","nxdomain","server misbehaving","temporary failure in name resolution"],"source":"https://kubernetes.io/docs/tasks/administer-cluster/dns-debugging-resolution/","inputs":[{"key":"pod","label":"Pod name","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Test resolution of a cluster name from the pod","cmd":"kubectl exec {pod} -n {namespace} -- getent hosts kubernetes.default.svc.cluster.local","risk":"safe","look":"An IP means cluster DNS works and the problem is narrower than you thought. Nothing means the resolver path is broken.","signals":[{"match":"\\d+\\.\\d+\\.\\d+\\.\\d+","means":"Cluster DNS works. Test an external name next.","goto":"step:4"},{"match":"^\\s*$","means":"Cluster DNS is not answering for this pod.","goto":"step:2"}]},{"title":"Check that CoreDNS is running","cmd":"kubectl get pods -n kube-system -l k8s-app=kube-dns -o wide","risk":"safe","look":"All replicas Ready. CrashLooping CoreDNS is usually a bad Corefile edit or a resolver loop.","signals":[{"match":"CrashLoopBackOff","means":"CoreDNS itself is failing. Check its logs for a loop plugin detection.","goto":"cause:coredns-down"},{"match":"0/1","means":"CoreDNS is not ready, so nothing in the cluster resolves.","goto":"cause:coredns-down"}]},{"title":"Read the pod's resolver configuration","cmd":"kubectl exec {pod} -n {namespace} -- cat /etc/resolv.conf","risk":"safe","look":"The nameserver should be the cluster DNS Service IP. A node-level resolver here means dnsPolicy is wrong for a cluster workload.","signals":[{"match":"(?i)ndots:5","means":"Normal, but it means short names try several search domains first, which looks like slow DNS under load.","goto":"cause:ndots"},{"match":"nameserver 169\\.254|nameserver 8\\.8","means":"The pod is using a node or public resolver, not cluster DNS.","goto":"cause:wrong-dnspolicy"}]},{"title":"Test an external name","cmd":"kubectl exec {pod} -n {namespace} -- getent hosts github.com","risk":"safe","look":"Cluster names working but external failing points at CoreDNS's upstream forwarder or egress, not at Kubernetes DNS itself."}],"causes":[{"id":"coredns-down","cause":"CoreDNS is unhealthy.","fix":"Read its logs. A loop plugin error means the upstream resolver points back at CoreDNS.","confirm":""},{"id":"wrong-dnspolicy","cause":"The pod uses host DNS instead of cluster DNS.","fix":"Set dnsPolicy ClusterFirst. hostNetwork pods need ClusterFirstWithHostNet explicitly.","confirm":""},{"id":"upstream","cause":"CoreDNS cannot reach its upstream resolver.","fix":"Check the forward directive in the Corefile and egress from the CoreDNS pods.","confirm":""},{"id":"ndots","cause":"Short names expand through five search domains before the real lookup.","fix":"Use fully qualified names with a trailing dot for hot paths, or tune ndots per pod.","confirm":""},{"id":"netpol","cause":"A NetworkPolicy blocks egress to port 53.","fix":"Allow UDP and TCP 53 to kube-system in the policy.","confirm":""}],"verify":["Both cluster and external names resolve from inside the pod.","CoreDNS replicas are Ready with no restarts."],"escalate":["resolv.conf from inside the pod","CoreDNS pod state and logs","Which names fail: cluster, external, or both"]},{"id":"k8s-ingress-503","tier":"guide","technology":"Kubernetes","category":"Ingress","title":"Ingress returns 502, 503 or 404","summary":"The ingress answers but the backend does not. Each status points at a different layer.","aliases":["ingress 503","502 bad gateway","ingress 404","service unavailable","no healthy upstream","default backend"],"source":"https://kubernetes.io/docs/concepts/services-networking/ingress/","inputs":[{"key":"ingress","label":"Ingress name","example":"checkout"},{"key":"namespace","label":"Namespace","example":"production"},{"key":"service","label":"Backend service","example":"checkout-api"}],"steps":[{"title":"Identify which status you get and from whom","cmd":"curl -sSI https://$(kubectl get ingress {ingress} -n {namespace} -o jsonpath='{.spec.rules[0].host}')/","risk":"safe","look":"The Server header tells you whether the ingress controller answered or something upstream did. 404 usually means no rule matched; 503 usually means no healthy backend.","signals":[{"match":"503","means":"The controller matched a rule but has no healthy endpoint behind it.","goto":"cause:no-endpoints"},{"match":"404","means":"No ingress rule matched this host and path.","goto":"cause:no-rule-match"},{"match":"502","means":"The controller reached a backend and got an invalid response.","goto":"cause:backend-error"}]},{"title":"Check the ingress has an address and correct rules","cmd":"kubectl get ingress {ingress} -n {namespace} -o wide","risk":"safe","look":"An empty ADDRESS means no controller has claimed it, usually a missing or wrong ingressClassName."},{"title":"Check the backend service has endpoints","cmd":"kubectl get endpointslices -n {namespace} -l kubernetes.io/service-name={service}","risk":"safe","look":"Empty endpoints produce 503 every time. This is the most common cause by a wide margin.","signals":[{"match":"(?i)<none>|No resources found","means":"No pods behind the service. Follow the no-endpoints runbook.","goto":"cause:no-endpoints"}]},{"title":"Read the controller's own logs","cmd":"kubectl logs -n ingress-nginx -l app.kubernetes.io/component=controller --tail=50","risk":"safe","look":"The controller logs the upstream it chose and why it failed. This is more precise than anything you can infer from the client side."}],"causes":[{"id":"no-endpoints","cause":"The backend service has no ready endpoints.","fix":"Fix pod readiness or the service selector. The ingress is working correctly by refusing to send traffic nowhere.","confirm":""},{"id":"no-rule-match","cause":"Host or path in the request does not match any rule.","fix":"Check pathType. Prefix and Exact behave differently, and this catches people out constantly.","confirm":""},{"id":"wrong-class","cause":"No controller claimed the ingress.","fix":"Set ingressClassName to a class that exists in the cluster.","confirm":""},{"id":"backend-error","cause":"The backend returned something the controller could not use.","fix":"Check the app's own logs. Often TLS expected on a plain-HTTP backend port.","confirm":""},{"id":"wrong-port","cause":"The ingress points at a service port that does not exist.","fix":"Match the port name or number to the service definition.","confirm":""}],"verify":["The URL returns the expected status from the application.","The controller logs show the correct upstream being selected."],"escalate":["The exact status and response headers","Ingress rules and class","Backend endpoints","Controller log lines for the request"]},{"id":"k8s-pod-evicted","tier":"guide","technology":"Kubernetes","category":"Nodes","title":"Pods are being Evicted","summary":"The kubelet is reclaiming resources on a node under pressure. The eviction message names which resource.","aliases":["pod evicted","evicted","node under pressure","ephemeral storage","the node was low on resource","diskpressure eviction"],"source":"https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/","inputs":[{"key":"namespace","label":"Namespace","example":"production"},{"key":"pod","label":"Evicted pod name","example":"checkout-api-7d9f6b8c5-x4k2m"}],"steps":[{"title":"List the evicted pods and read the reason","cmd":"kubectl get pods -n {namespace} --field-selector status.phase=Failed -o custom-columns=NAME:.metadata.name,REASON:.status.reason,MSG:.status.message","risk":"safe","look":"The message names the resource that ran out. That single word decides everything that follows.","signals":[{"match":"(?i)ephemeral-storage","means":"The pod wrote too much to its writable layer or an emptyDir.","goto":"cause:ephemeral"},{"match":"(?i)memory","means":"The node ran out of memory and reclaimed the largest offender over its request.","goto":"cause:node-memory"},{"match":"(?i)inodes","means":"The node exhausted inodes, usually many small files.","goto":"cause:inodes"}]},{"title":"Find which node is under pressure","cmd":"kubectl get nodes -o custom-columns=NAME:.metadata.name,CONDITIONS:.status.conditions[?(@.status==\\\"True\\\")].type","risk":"safe","look":"Which nodes report DiskPressure or MemoryPressure. If it is one node, it is a host problem; if it is all of them, it is a capacity problem."},{"title":"Check whether the evicted workload declared requests","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].resources.requests}' 2>/dev/null || echo 'pod already removed'","risk":"safe","look":"Pods without requests are evicted first. Declaring a request is what buys a workload protection."}],"causes":[{"id":"ephemeral","cause":"The container wrote more to local disk than its ephemeral-storage allowance.","fix":"Set an ephemeral-storage request and limit, and move logs to stdout rather than files.","confirm":""},{"id":"node-memory","cause":"The node ran out of memory.","fix":"Set memory requests on the workloads sharing that node. Eviction targets pods exceeding their request first.","confirm":""},{"id":"inodes","cause":"Inode exhaustion from many small files.","fix":"Find the directory generating them. Log rotation usually solves it.","confirm":""},{"id":"no-requests","cause":"Best-effort pods are evicted first.","fix":"Declare requests so the workload gets a guaranteed or burstable class.","confirm":""}],"verify":["No new evictions during a normal workload window.","The node's pressure conditions are false.","The affected workloads declare requests."],"escalate":["Eviction message verbatim","Node conditions","Whether the workload declares requests and limits"]},{"id":"k8s-rbac-forbidden","tier":"guide","technology":"Kubernetes","category":"Access & RBAC","title":"Forbidden: User cannot perform this action","summary":"The API server authenticated you but refused the operation. The message names exactly what is missing.","aliases":["forbidden","cannot list resource","rbac denied","user cannot get","access denied kubectl","no permission namespace"],"source":"https://kubernetes.io/docs/reference/access-authn-authz/rbac/","inputs":[{"key":"namespace","label":"Namespace","example":"production"},{"key":"verb","label":"Verb","example":"list"},{"key":"resource","label":"Resource","example":"pods"}],"steps":[{"title":"Read the forbidden message in full","cmd":"kubectl get {resource} -n {namespace}","risk":"safe","look":"The message names the identity, the verb, the resource and the namespace. All four matter and the fix depends on which one is wrong.","signals":[{"match":"(?i)system:serviceaccount","means":"A ServiceAccount, not you. Something is running with in-cluster credentials.","goto":"cause:serviceaccount"},{"match":"(?i)at the cluster scope","means":"The resource is cluster-scoped, so a namespaced Role cannot grant it.","goto":"cause:needs-clusterrole"},{"match":"(?i)in the namespace","means":"Namespaced. A RoleBinding in that namespace will do it.","goto":"cause:needs-rolebinding"}]},{"title":"Ask the API server directly whether you can do it","cmd":"kubectl auth can-i {verb} {resource} -n {namespace}","risk":"safe","look":"A definitive yes or no from the authorizer itself, with no guessing about which binding applies."},{"title":"List everything your identity can do here","cmd":"kubectl auth can-i --list -n {namespace}","risk":"safe","look":"The full effective permission set. Comparing this against what you expected usually makes the gap obvious."},{"title":"Find which bindings mention your identity","cmd":"kubectl get rolebindings,clusterrolebindings -A -o wide | findstr <your-identity>","risk":"safe","look":"Which roles are actually attached. An empty result means nothing grants you anything in this namespace."}],"causes":[{"id":"needs-rolebinding","cause":"No Role or RoleBinding grants this verb in this namespace.","fix":"Create a RoleBinding to a Role carrying that verb. Grant the narrowest set that works.","confirm":""},{"id":"needs-clusterrole","cause":"The resource is cluster-scoped.","fix":"A ClusterRoleBinding is required. A namespaced RoleBinding cannot grant cluster-scoped access however it is written.","confirm":""},{"id":"serviceaccount","cause":"The request is from a ServiceAccount, not your user.","fix":"Bind the role to that ServiceAccount. Pods use their SA, never your kubeconfig.","confirm":""},{"id":"wrong-context","cause":"You are authenticated as a different identity than you assumed.","fix":"Check kubectl config current-context. Multi-cluster setups make this a routine mistake.","confirm":""},{"id":"aggregation","cause":"A ClusterRole relies on aggregation labels that do not match.","fix":"Check the aggregationRule selectors against the labels on the contributing roles.","confirm":""}],"verify":["kubectl auth can-i returns yes.","The operation succeeds.","The grant is as narrow as the task requires."],"escalate":["The verbatim forbidden message","Output of kubectl auth can-i --list","Which identity is in use"]},{"id":"k8s-hpa-not-scaling","tier":"guide","technology":"Kubernetes","category":"Autoscaling","title":"HorizontalPodAutoscaler is not scaling","summary":"Load is high but replica count does not move. Usually metrics, not the policy.","aliases":["hpa not scaling","autoscaler not working","unknown metrics","failedgetresourcemetric","hpa targets unknown","replicas not increasing"],"source":"https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/","inputs":[{"key":"hpa","label":"HPA name","example":"checkout-api"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the HPA's current targets","cmd":"kubectl get hpa {hpa} -n {namespace}","risk":"safe","look":"The TARGETS column. <unknown> means no metrics are arriving and the HPA is inert; a real percentage means metrics work and the policy is the question.","signals":[{"match":"<unknown>","means":"No metrics. The HPA cannot make any decision at all.","goto":"cause:no-metrics"},{"match":"(?i)\\d+%/\\d+%","means":"Metrics are flowing. Read the conditions for why it is holding.","goto":"step:2"}]},{"title":"Read the scaling conditions","cmd":"kubectl describe hpa {hpa} -n {namespace} | findstr /C:\"Conditions\" /C:\"Events\" -A8","risk":"safe","look":"ScalingLimited with a reason names the exact constraint, such as having hit maxReplicas or being inside the stabilisation window.","signals":[{"match":"(?i)TooManyReplicas|at max","means":"Already at maxReplicas. The ceiling is the constraint.","goto":"cause:at-max"},{"match":"(?i)FailedGetResourceMetric","means":"metrics-server is not returning usage for these pods.","goto":"cause:no-metrics"},{"match":"(?i)desired.*within.*range","means":"It is deliberately holding, usually the stabilisation window.","goto":"cause:stabilisation"}]},{"title":"Check metrics-server is healthy","cmd":"kubectl top pods -n {namespace}","risk":"safe","look":"If this errors, the HPA has the same problem. metrics-server is the dependency for all resource-based autoscaling."},{"title":"Check the pods declare requests","cmd":"kubectl get deploy -n {namespace} -o jsonpath='{.items[*].spec.template.spec.containers[*].resources.requests}'","risk":"safe","look":"CPU utilisation is a percentage of the request. With no request declared there is no denominator, so the HPA can never compute a target."}],"causes":[{"id":"no-metrics","cause":"metrics-server is absent or not serving.","fix":"Install or repair it. Check its pod logs for TLS errors against the kubelet, which is the usual failure.","confirm":""},{"id":"no-requests","cause":"Containers declare no CPU request.","fix":"Set one. Utilisation is meaningless without it and the HPA will show unknown forever.","confirm":""},{"id":"at-max","cause":"Already at maxReplicas.","fix":"Raise maxReplicas if capacity allows. Confirm nodes can actually take more pods first.","confirm":""},{"id":"stabilisation","cause":"The scale-down stabilisation window is holding it.","fix":"Expected behaviour preventing flapping. Tune behaviour.scaleDown if genuinely too slow.","confirm":""},{"id":"wrong-target","cause":"scaleTargetRef points at something that does not exist.","fix":"Check the name and kind match the real workload exactly.","confirm":""}],"verify":["TARGETS shows real percentages.","Replicas move under load and settle after.","Pods have requests declared."],"escalate":["kubectl get hpa output","HPA conditions and events","Whether kubectl top works","Container resource requests"]},{"id":"k8s-configmap-not-applied","tier":"guide","technology":"Kubernetes","category":"Configuration","title":"ConfigMap or Secret change is not picked up","summary":"You updated the config but the application still uses the old values.","aliases":["configmap not updating","secret not applied","config change no effect","still old config","env not updated","restart needed configmap"],"source":"https://kubernetes.io/docs/concepts/configuration/configmap/","inputs":[{"key":"configmap","label":"ConfigMap name","example":"app-config"},{"key":"namespace","label":"Namespace","example":"production"},{"key":"deploy","label":"Deployment","example":"checkout-api"}],"steps":[{"title":"Confirm the ConfigMap itself actually changed","cmd":"kubectl get configmap {configmap} -n {namespace} -o yaml","risk":"safe","look":"The values as stored. If they are old here, the apply never landed and nothing downstream matters."},{"title":"Check how the pod consumes it","cmd":"kubectl get deploy {deploy} -n {namespace} -o jsonpath='{.spec.template.spec.containers[*].envFrom}{\" | \"}{.spec.template.spec.volumes}'","risk":"safe","look":"envFrom and env never update in a running container, ever. Volume mounts do update, but on the kubelet's sync period rather than instantly.","signals":[{"match":"(?i)configMapRef|configMapKeyRef","means":"Consumed as environment variables. These are fixed at container start and will never refresh.","goto":"cause:env-immutable"},{"match":"(?i)configMap.*name","means":"Mounted as a volume. It refreshes, but not immediately.","goto":"cause:volume-delay"}]},{"title":"Check when the pod started relative to the change","cmd":"kubectl get pod -n {namespace} -l app={deploy} -o jsonpath='{.items[*].status.startTime}'","risk":"safe","look":"A pod older than the ConfigMap edit is still holding whatever existed at its start."},{"title":"Restart the workload to pick up the new values","cmd":"kubectl rollout restart deployment/{deploy} -n {namespace}","risk":"state","look":"New pods with fresh timestamps. Watch rollout status rather than assuming it worked.","note":"Replaces every pod in the deployment with a rolling update. Brief capacity reduction during the roll, and if the new config is wrong the new pods will fail. Confirm the ConfigMap contents are correct before restarting rather than after."}],"causes":[{"id":"env-immutable","cause":"Consumed as environment variables, which are set once at container start.","fix":"Restart the workload. To make this automatic, hash the config into a pod annotation so any change triggers a roll.","confirm":""},{"id":"volume-delay","cause":"Mounted as a volume, which refreshes on the kubelet sync period.","fix":"Wait about a minute, or restart. subPath mounts never refresh at all, which surprises people.","confirm":""},{"id":"subpath","cause":"Mounted with subPath.","fix":"subPath mounts are a point-in-time copy and do not update. Mount the directory instead.","confirm":""},{"id":"not-applied","cause":"The change never reached the cluster.","fix":"Check you applied to the right namespace and context.","confirm":""},{"id":"app-caches","cause":"The application read the config once at startup.","fix":"Restarting is the only option unless the app watches the file itself.","confirm":""}],"verify":["The running pod shows the new values.","The application behaves according to the new config.","The mechanism for future updates is understood."],"escalate":["The ConfigMap as stored","How the deployment consumes it","Pod start time versus the change time"]},{"id":"k8s-statefulset-stuck","tier":"guide","technology":"Kubernetes","category":"Workloads","title":"StatefulSet will not progress past a pod","summary":"Ordered rollout blocks on one replica and nothing after it starts.","aliases":["statefulset stuck","sts not progressing","ordinal stuck","statefulset rollout","pod-0 pending","stateful pod not starting"],"source":"https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/","inputs":[{"key":"sts","label":"StatefulSet","example":"postgres"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"See which ordinal is blocking","cmd":"kubectl get pods -n {namespace} -l app={sts} --sort-by=.metadata.name","risk":"safe","look":"StatefulSets proceed strictly in order. The lowest-numbered unhealthy pod is the only one that matters; everything above it is simply waiting.","signals":[{"match":"Pending","means":"The blocking pod cannot be scheduled, very often because its PVC has not bound.","goto":"cause:pvc"},{"match":"CrashLoopBackOff","means":"The blocking pod starts and dies.","goto":"cause:app-failure"}]},{"title":"Check its volume claim","cmd":"kubectl get pvc -n {namespace} -l app={sts}","risk":"safe","look":"Each ordinal gets its own PVC. A single unbound claim halts the whole set, and this is the most common cause."},{"title":"Read the update strategy","cmd":"kubectl get sts {sts} -n {namespace} -o jsonpath='{.spec.updateStrategy}'","risk":"safe","look":"OnDelete means the controller will never replace pods by itself and you must delete them manually. A partition value means updates deliberately stop at that ordinal."},{"title":"Check whether pod management is the constraint","cmd":"kubectl get sts {sts} -n {namespace} -o jsonpath='{.spec.podManagementPolicy}'","risk":"safe","look":"OrderedReady is the default and enforces the strict sequence. Parallel lets pods start independently, which suits some workloads and not others."}],"causes":[{"id":"pvc","cause":"The blocking pod's PVC has not bound.","fix":"Follow the PVC Pending runbook. The StatefulSet is behaving correctly by waiting.","confirm":""},{"id":"app-failure","cause":"The application in that ordinal fails to start.","fix":"Treat it as a CrashLoop. Often ordinal zero is a cluster seed and its failure is different from the others.","confirm":""},{"id":"ondelete","cause":"updateStrategy is OnDelete.","fix":"Delete the pods yourself in order. The controller will not do it.","confirm":""},{"id":"partition","cause":"A partition is set on the rolling update.","fix":"Lower the partition value to allow more ordinals to update.","confirm":""},{"id":"quorum","cause":"A clustered application cannot reach quorum.","fix":"Check the app's own cluster state. Kubernetes sees healthy processes that refuse to serve.","confirm":""}],"verify":["All ordinals are Running and Ready in sequence.","Each has a bound PVC.","The application reports a healthy cluster."],"escalate":["Pod list in ordinal order","PVC state per ordinal","Update strategy and pod management policy"]},{"id":"k8s-networkpolicy-blocking","tier":"guide","technology":"Kubernetes","category":"Network & NetworkPolicy","title":"Traffic blocked between pods after a NetworkPolicy","summary":"Connections that used to work now time out. Policies are deny-by-default once any policy selects a pod.","aliases":["networkpolicy blocking","pod cannot reach pod","traffic blocked","netpol","connection timeout after policy","deny all"],"source":"https://kubernetes.io/docs/concepts/services-networking/network-policies/","inputs":[{"key":"namespace","label":"Namespace","example":"production"},{"key":"pod","label":"Pod name","example":"checkout-api-7d9f6b8c5-x4k2m"}],"steps":[{"title":"List policies affecting this namespace","cmd":"kubectl get networkpolicy -n {namespace}","risk":"safe","look":"Any policy at all changes the model for the pods it selects. Before the first policy everything is allowed; after it, only what is explicitly permitted.","signals":[{"match":"(?i)default-deny|deny-all","means":"A default-deny policy exists. Every allowed flow must now be stated explicitly.","goto":"cause:default-deny"}]},{"title":"Find which policies select this pod","cmd":"kubectl describe networkpolicy -n {namespace}","risk":"safe","look":"The podSelector on each policy against your pod's labels. A policy with an empty podSelector selects every pod in the namespace."},{"title":"Check the pod's own labels","cmd":"kubectl get pod {pod} -n {namespace} --show-labels","risk":"safe","look":"Whether the pod is selected by a policy and whether it matches any allow rule's peer selector. Both directions must permit the flow."},{"title":"Verify whether DNS is also blocked","cmd":"kubectl exec {pod} -n {namespace} -- getent hosts kubernetes.default","risk":"safe","look":"Egress policies frequently forget port 53, which makes everything look like a DNS outage when it is actually the policy.","signals":[{"match":"^\\s*$","means":"DNS is blocked too. The egress policy is missing a rule for port 53.","goto":"cause:dns-blocked"}]}],"causes":[{"id":"default-deny","cause":"A default-deny policy applies and no rule permits this flow.","fix":"Add an explicit allow for it. Policies are additive, so a new permissive policy is safer than editing the deny.","confirm":""},{"id":"dns-blocked","cause":"Egress policy omits DNS.","fix":"Allow UDP and TCP 53 to kube-system. Almost every egress policy needs this and almost every first attempt forgets it.","confirm":""},{"id":"both-directions","cause":"Egress is allowed on the client but ingress is not allowed on the server.","fix":"Both ends must permit the flow. Check the policies selecting each side.","confirm":""},{"id":"namespace-selector","cause":"namespaceSelector matches on labels the target namespace does not carry.","fix":"Label the namespace. Namespaces have no useful labels by default.","confirm":""},{"id":"no-cni-support","cause":"The CNI plugin does not enforce NetworkPolicy.","fix":"Flannel ignores them entirely, so policies appear to apply and do nothing. Confirm your CNI supports them.","confirm":""}],"verify":["The intended connection succeeds.","DNS still resolves from inside the pod.","Unintended flows remain blocked."],"escalate":["All policies in the namespace","Labels on both pods","Whether DNS works from the client pod"]},{"id":"k8s-init-container-stuck","tier":"guide","technology":"Kubernetes","category":"Pods & Containers","title":"Pod stuck in Init or PodInitializing","summary":"An init container has not completed, so the main container never starts.","aliases":["init stuck","podinitializing","init:0/1","init container failing","init crashloop","waiting for init"],"source":"https://kubernetes.io/docs/concepts/workloads/pods/init-containers/","inputs":[{"key":"pod","label":"Pod","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"See which init container is blocking","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.status.initContainerStatuses[*].name}{\"|\"}{.status.initContainerStatuses[*].state}'","risk":"safe","look":"Init containers run strictly in order. Only the first incomplete one matters; everything after it has not started.","signals":[{"match":"(?i)CrashLoopBackOff","means":"The init container runs and fails repeatedly.","goto":"cause:init-failing"},{"match":"(?i)waiting.*PodInitializing","means":"It is still running, not failed. It may be waiting on something.","goto":"cause:init-waiting"}]},{"title":"Read that init container's logs","cmd":"kubectl logs {pod} -n {namespace} -c <init-container-name>","risk":"safe","look":"Init containers are frequently wait loops for a database or a migration. The log usually says exactly what it is waiting for."},{"title":"Check what it is waiting on is actually reachable","cmd":"kubectl get endpointslices -n {namespace}","risk":"safe","look":"A wait-for-dependency init container blocks forever if the dependency never becomes ready, which looks like the pod being stuck."},{"title":"Check init containers have their own resources","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.initContainers[*].resources}'","risk":"safe","look":"Init containers are scheduled with the pod. An init container requesting more than the node has keeps the whole pod Pending."}],"causes":[{"id":"init-failing","cause":"The init container exits non-zero.","fix":"Read its logs. The pod will never start until it exits zero.","confirm":""},{"id":"init-waiting","cause":"It is waiting on an unavailable dependency.","fix":"Make the dependency ready. Add a timeout so it fails loudly rather than hanging forever.","confirm":""},{"id":"migration-lock","cause":"A database migration init container is blocked on a lock.","fix":"Find the holder. Concurrent replicas running the same migration cause this.","confirm":""},{"id":"wrong-order","cause":"Init containers are in the wrong order.","fix":"They run sequentially in declaration order. Reorder them.","confirm":""}],"verify":["The pod moves past Init and the main container starts.","Init containers complete in a few seconds, not minutes."],"escalate":["Init container statuses","Logs from the blocking init container","Whether its dependency is ready"]},{"id":"k8s-job-not-completing","tier":"guide","technology":"Kubernetes","category":"Workloads","title":"Job or CronJob never completes","summary":"The Job stays active, retries forever, or the CronJob never fires at all.","aliases":["job not completing","cronjob not running","job stuck","backofflimitexceeded","job failed","cronjob missed schedule"],"source":"https://kubernetes.io/docs/concepts/workloads/controllers/job/","inputs":[{"key":"job","label":"Job or CronJob","example":"nightly-report"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the Job's status","cmd":"kubectl get job {job} -n {namespace} -o jsonpath='{.status}'","risk":"safe","look":"Active, succeeded and failed counts with any condition. BackoffLimitExceeded means it gave up after repeated failures.","signals":[{"match":"(?i)BackoffLimitExceeded","means":"It retried up to the limit and failed every time.","goto":"cause:pod-failing"},{"match":"(?i)DeadlineExceeded","means":"It exceeded activeDeadlineSeconds and was killed.","goto":"cause:deadline"}]},{"title":"Read logs from the failed pods","cmd":"kubectl logs -n {namespace} -l job-name={job} --tail=60","risk":"safe","look":"The actual failure. Job pods are retained after failure specifically so you can read this."},{"title":"For a CronJob, check schedule and last run","cmd":"kubectl get cronjob {job} -n {namespace} -o jsonpath='{.spec.schedule}{\"|\"}{.status.lastScheduleTime}{\"|\"}{.spec.suspend}'","risk":"safe","look":"suspend true means it will never fire. The schedule is evaluated in the controller's timezone, which is UTC unless configured otherwise.","signals":[{"match":"\\|true$","means":"The CronJob is suspended.","goto":"cause:suspended"}]},{"title":"Check for concurrency blocking a new run","cmd":"kubectl get jobs -n {namespace} -l cronjob-name={job}","risk":"safe","look":"With concurrencyPolicy Forbid, a run still active blocks the next one. A hung job silently stops all future runs."}],"causes":[{"id":"pod-failing","cause":"The job's pod fails every attempt.","fix":"Fix the command. Raise backoffLimit only once the failure is understood.","confirm":""},{"id":"deadline","cause":"activeDeadlineSeconds was exceeded.","fix":"Raise it, or make the job faster. The deadline counts total time, not per attempt.","confirm":""},{"id":"suspended","cause":"The CronJob is suspended.","fix":"Set suspend to false. Often left on after an incident and forgotten.","confirm":""},{"id":"timezone","cause":"The schedule is in UTC, not local time.","fix":"Set spec.timeZone, or express the schedule in UTC deliberately.","confirm":""},{"id":"concurrency","cause":"A previous run is still active.","fix":"Find and clear it. Consider Replace rather than Forbid.","confirm":""},{"id":"no-restart-never","cause":"restartPolicy is not Never or OnFailure.","fix":"Job pods must use one of those two. Always is rejected.","confirm":""}],"verify":["The Job reports succeeded.","A CronJob fires on schedule.","Failed runs are visible rather than silent."],"escalate":["Job status block","Logs from the failing pod","CronJob schedule, suspend flag and last schedule time"]},{"id":"k8s-terminating-stuck","tier":"guide","technology":"Kubernetes","category":"Pods & Containers","title":"Pod stuck Terminating forever","summary":"Deletion was requested but the pod never goes. Usually a finalizer or an unresponsive node.","aliases":["stuck terminating","pod wont delete","terminating forever","finalizer","cannot delete pod","pod hangs on delete"],"source":"https://kubernetes.io/docs/concepts/overview/working-with-objects/finalizers/","inputs":[{"key":"pod","label":"Pod","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Check for finalizers and the grace period","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.metadata.finalizers}{\"|\"}{.spec.terminationGracePeriodSeconds}'","risk":"safe","look":"A finalizer means something must run before deletion completes. A long grace period means it may simply need more time.","signals":[{"match":"\\[.+\\]\\|","means":"A finalizer is present and its controller has not released it.","goto":"cause:finalizer"},{"match":"\\|\\d{3,}","means":"The grace period is very long. It may be working as configured.","goto":"cause:long-grace"}]},{"title":"Check whether the node is healthy","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.nodeName}' && kubectl get nodes","risk":"safe","look":"If the node is NotReady, the kubelet cannot confirm deletion. Pods on a dead node stay Terminating indefinitely by design.","signals":[{"match":"(?i)NotReady","means":"The node is unreachable, so deletion can never be confirmed.","goto":"cause:node-down"}]},{"title":"Check whether the process ignores SIGTERM","cmd":"kubectl describe pod {pod} -n {namespace} | findstr /C:\"Killing\"","risk":"safe","look":"A process ignoring SIGTERM runs until the grace period expires and is then SIGKILLed. That is slow but not stuck."},{"title":"Remove the finalizer to force deletion","cmd":"kubectl patch pod {pod} -n {namespace} -p '{\"metadata\":{\"finalizers\":null}}'","risk":"destructive","look":"The pod disappears. Check for orphaned resources on the cloud side afterwards.","note":"Removes the finalizer without letting its controller do the cleanup it was waiting to perform. That cleanup may include detaching a volume or deregistering from a load balancer, and skipping it can leave orphaned cloud resources or a volume that cannot attach elsewhere. Understand which controller owns the finalizer before doing this."}],"causes":[{"id":"finalizer","cause":"A controller's finalizer has not been released.","fix":"Find that controller and fix it. Removing the finalizer skips its cleanup.","confirm":""},{"id":"node-down","cause":"The node is unreachable.","fix":"The pod clears when the node returns, or when it is deleted from the cluster. Force deletion risks two copies running.","confirm":""},{"id":"long-grace","cause":"The grace period is genuinely long.","fix":"Wait. Or shorten terminationGracePeriodSeconds if the value is not justified.","confirm":""},{"id":"ignores-sigterm","cause":"The process does not handle SIGTERM.","fix":"Handle it in the application. PID 1 in a container does not get default signal handling.","confirm":""},{"id":"volume-detach","cause":"A volume cannot detach.","fix":"Check the CSI driver. This is common with cloud block storage under load.","confirm":""}],"verify":["The pod is gone.","No orphaned volume or load balancer registration remains.","The root cause was addressed, not just forced past."],"escalate":["Finalizers on the pod","Node status","Which controller owns the finalizer"]},{"id":"k8s-resource-quota-exceeded","tier":"guide","technology":"Kubernetes","category":"Configuration","title":"Cannot create pods: exceeded quota","summary":"The namespace has hit a ResourceQuota, so new workloads are refused at admission.","aliases":["exceeded quota","resourcequota","forbidden quota","limitrange","cannot create pod quota","quota exceeded namespace"],"source":"https://kubernetes.io/docs/concepts/policy/resource-quotas/","inputs":[{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the quota and current usage","cmd":"kubectl describe resourcequota -n {namespace}","risk":"safe","look":"Used against Hard for each resource. The one at its limit is named in the rejection message.","signals":[{"match":"(?i)requests\\.cpu|requests\\.memory","means":"A compute quota is exhausted.","goto":"cause:compute-quota"},{"match":"(?i)pods\\s","means":"The pod count limit is reached.","goto":"cause:pod-count"},{"match":"(?i)persistentvolumeclaims","means":"The PVC count limit is reached.","goto":"cause:pvc-quota"}]},{"title":"Check whether a LimitRange forces defaults","cmd":"kubectl describe limitrange -n {namespace}","risk":"safe","look":"A LimitRange injects default requests into pods that declare none. Those defaults count against the quota and are often larger than expected."},{"title":"Find what is consuming the quota","cmd":"kubectl get pods -n {namespace} -o custom-columns=NAME:.metadata.name,CPU:.spec.containers[*].resources.requests.cpu,MEM:.spec.containers[*].resources.requests.memory","risk":"safe","look":"Requests per pod. Completed Job pods still count until they are cleaned up, which surprises people."},{"title":"Clear completed pods holding quota","cmd":"kubectl delete pod -n {namespace} --field-selector status.phase=Succeeded","risk":"state","look":"The quota's Used figure drops. Recheck with describe resourcequota.","note":"Deletes every succeeded pod in the namespace, which also removes their logs. If anyone needs those logs for an audit or a debugging session, collect them first. Running pods are not affected."}],"causes":[{"id":"compute-quota","cause":"CPU or memory requests are exhausted.","fix":"Raise the quota, or lower requests on existing workloads. Requests count, not usage.","confirm":""},{"id":"pod-count","cause":"The pod count limit is reached.","fix":"Clean up completed pods, or raise the limit.","confirm":""},{"id":"pvc-quota","cause":"The PVC count or storage limit is reached.","fix":"Remove unused claims, or raise the quota.","confirm":""},{"id":"limitrange-default","cause":"LimitRange defaults are larger than the workload needs.","fix":"Declare explicit requests so
