resh container shows the VM's current view."}],"causes":[{"id":"tz-display","cause":"Only the timezone display differs.","fix":"Set the TZ environment variable if local time matters. Storing UTC and formatting at the edge is better practice.","confirm":""},{"id":"host-drift","cause":"The host clock is wrong.","fix":"Fix time sync on the host. Containers cannot have a different clock from the kernel.","confirm":""},{"id":"vm-suspend","cause":"The Docker Desktop VM clock lagged after sleep.","fix":"Restart Docker Desktop. It resyncs on start.","confirm":""},{"id":"no-tzdata","cause":"The image has no timezone database.","fix":"Install tzdata if the application needs named zones. Alpine omits it by default.","confirm":""}],"verify":["Container time matches the host.","Timestamps in logs are correct.","Certificate and token validation succeeds."],"escalate":["date inside and outside the container","TZ setting inside","Host time sync status"]},{"id":"docker-multistage-artifact-missing","tier":"guide","technology":"Docker","category":"Build & Cache","title":"Final image is missing the built artifact","summary":"The build succeeds but the runtime image does not contain what the build stage produced.","aliases":["copy from not found","artifact missing","multistage copy","file missing final image","build output missing","stage not found"],"source":"https://docs.docker.com/build/building/multi-stage/","inputs":[{"key":"image","label":"Image","example":"registry.local/checkout-api:1.4.2"}],"steps":[{"title":"Check what the final image contains","cmd":"docker run --rm --entrypoint ls {image} -la /app","risk":"safe","look":"Whether the artifact is there. An empty directory means the COPY --from did not bring what you expected."},{"title":"Check what the build stage produced","cmd":"docker build --target build -t tmp-build . && docker run --rm --entrypoint ls tmp-build -la /app","risk":"safe","look":"Building only the earlier stage lets you inspect it directly. The path there must match the COPY source exactly."},{"title":"Check the stage names match","cmd":"findstr /C:\"AS \" /C:\"--from\" Dockerfile","risk":"safe","look":"Stage names are case-sensitive. A --from referring to a nonexistent stage is treated as an external image and silently pulls instead.","signals":[{"match":"--from=\\d","means":"Referring to a stage by index. Fragile — any reorder breaks it silently.","goto":"cause:index-reference"}]},{"title":"Check the working directory in each stage","cmd":"findstr /C:\"WORKDIR\" Dockerfile","risk":"safe","look":"WORKDIR does not carry between stages. A relative COPY source resolves differently than you might assume."}],"causes":[{"id":"wrong-path","cause":"The source path does not exist in the earlier stage.","fix":"Build with --target and inspect. Use absolute paths in COPY --from.","confirm":""},{"id":"stage-name-typo","cause":"The stage name does not match.","fix":"Names are case-sensitive. A typo makes Docker treat it as an image name and pull it.","confirm":""},{"id":"index-reference","cause":"Referring to a stage by number.","fix":"Name your stages. Index references break silently when stages are reordered.","confirm":""},{"id":"workdir-reset","cause":"WORKDIR does not persist across stages.","fix":"Use absolute paths.","confirm":""},{"id":"build-failed-silently","cause":"The build step produced nothing but exited zero.","fix":"Add a check in the build stage that fails if the artifact is absent.","confirm":""}],"verify":["The artifact is present in the final image.","The container starts and finds it.","The build fails loudly if the artifact goes missing."],"escalate":["Listing of the expected path in the final image","Listing from the build stage","The COPY --from lines"]},{"id":"docker-container-cannot-reach-host","tier":"guide","technology":"Docker","category":"Networking & DNS","title":"Container cannot reach a service on the host machine","summary":"Connecting to localhost from inside a container reaches the container, not the host.","aliases":["cannot reach host","host.docker.internal","localhost inside container","connection refused host","container to host","127.0.0.1 container"],"source":"https://docs.docker.com/desktop/features/networking/","inputs":[{"key":"container","label":"Container","example":"checkout-api"},{"key":"port","label":"Host port","example":"5432"}],"steps":[{"title":"Confirm what localhost means inside the container","cmd":"docker exec {container} sh -c \"getent hosts localhost; getent hosts host.docker.internal\"","risk":"safe","look":"Inside a container, localhost is the container itself. Reaching the host needs a different name entirely.","signals":[{"match":"host.docker.internal","means":"The special host alias resolves. Use it instead of localhost.","goto":"cause:use-host-internal"},{"match":"^\\s*$","means":"The alias does not resolve, so it is not configured on this platform.","goto":"cause:alias-missing"}]},{"title":"Check the host service is listening on all interfaces","cmd":"netstat -ano | findstr :{port}","risk":"safe","look":"A host service bound to 127.0.0.1 is unreachable from containers. It must bind 0.0.0.0 or the Docker bridge address."},{"title":"Test from inside the container","cmd":"docker exec {container} sh -c \"nc -zv host.docker.internal {port} 2>&1 || echo FAIL\"","risk":"safe","look":"Whether the path works. FAIL with the host listening on 0.0.0.0 points at the firewall."},{"title":"Check the Windows firewall","cmd":"netsh advfirewall firewall show rule name=all | findstr /C:\"{port}\"","risk":"safe","look":"Windows Defender frequently blocks the Docker bridge reaching host ports, and it does so silently."}],"causes":[{"id":"use-host-internal","cause":"localhost inside a container is the container.","fix":"Use host.docker.internal on Docker Desktop. On Linux add --add-host=host.docker.internal:host-gateway.","confirm":""},{"id":"bound-loopback","cause":"The host service listens only on 127.0.0.1.","fix":"Bind it to 0.0.0.0. Nothing outside the host can reach a loopback-only service.","confirm":""},{"id":"firewall","cause":"The host firewall blocks the bridge.","fix":"Allow inbound on that port from the Docker network range.","confirm":""},{"id":"alias-missing","cause":"host.docker.internal is not available.","fix":"On Linux it must be added explicitly at run time.","confirm":""},{"id":"should-be-container","cause":"The dependency should run in a container too.","fix":"Put both on a user-defined network and use the service name.","confirm":""}],"verify":["The container reaches the host service.","It works after both are restarted.","The approach is recorded in the compose file."],"escalate":["What localhost and host.docker.internal resolve to","What the host service binds to","Firewall rules for the port"]},{"id":"docker-env-not-passed","tier":"guide","technology":"Docker","category":"Container Lifecycle","title":"Environment variable is empty inside the container","summary":"The app behaves as if unconfigured because a variable never reached it.","aliases":["env not set","environment variable empty","env missing container","variable not passed","docker -e not working"],"source":"https://docs.docker.com/reference/cli/docker/container/run/#env","inputs":[{"key":"container","label":"Container","example":"checkout-api"},{"key":"var","label":"Variable","example":"DATABASE_URL"}],"steps":[{"title":"Check what the container actually has","cmd":"docker exec {container} printenv {var}","risk":"safe","look":"Empty output means it was never set. This is the ground truth and everything else is a theory.","signals":[{"match":"^\\s*$","means":"The variable is absent inside the container.","goto":"step:2"}]},{"title":"Check what was passed at creation","cmd":"docker inspect {container} --format '{{json .Config.Env}}'","risk":"safe","look":"Environment is fixed when the container is created. Changing the compose file afterwards has no effect until the container is recreated."},{"title":"Check whether the shell expanded it before Docker saw it","cmd":"echo $env:{var}","risk":"safe","look":"Passing -e VAR without a value forwards the shell's value. If the shell does not have it, Docker receives nothing."},{"title":"Recreate the container to pick up new values","cmd":"docker compose up -d --force-recreate {container}","risk":"state","look":"The new container has the variable. Confirm with printenv.","note":"Destroys and recreates the container. Anything written inside it but not to a volume is lost, and there is a brief outage while it restarts. Check what is mounted before running this."}],"causes":[{"id":"not-recreated","cause":"The container predates the change.","fix":"Environment is set at creation. Recreate it.","confirm":""},{"id":"shell-not-set","cause":"-e VAR relied on a shell value that was empty.","fix":"Pass -e VAR=value explicitly, or set it in the shell first.","confirm":""},{"id":"wrong-case","cause":"The name differs in case.","fix":"Environment variable names are case-sensitive on Linux.","confirm":""},{"id":"dockerfile-overwritten","cause":"An ENV in the Dockerfile sets it after your value.","fix":"Runtime -e wins over ENV, but a later ENTRYPOINT script can overwrite it.","confirm":""},{"id":"entrypoint-clears","cause":"The entrypoint script resets the variable.","fix":"Read the entrypoint. Some images normalise their environment on start.","confirm":""}],"verify":["printenv shows the value inside the container.","The application behaves as configured.","The value is in the compose file, not typed by hand."],"escalate":["printenv result","Config.Env from inspect","How the variable was passed"]},{"id":"docker-volume-data-lost","tier":"guide","technology":"Docker","category":"Storage & Disk","title":"Data disappeared after recreating a container","summary":"Restarting or recreating lost everything the application had written.","aliases":["data lost","volume gone","data not persisting","database empty after restart","anonymous volume","lost data container"],"source":"https://docs.docker.com/engine/storage/volumes/","inputs":[{"key":"container","label":"Container","example":"checkout-api"}],"steps":[{"title":"Check what the container had mounted","cmd":"docker inspect {container} --format '{{json .Mounts}}'","risk":"safe","look":"Type volume with a long hex Name is an anonymous volume. Those are easy to orphan and are the usual cause.","signals":[{"match":"\"Type\":\"volume\".*\"Name\":\"[0-9a-f]{32,}","means":"An anonymous volume. A new container gets a fresh empty one.","goto":"cause:anonymous-volume"},{"match":"\"Mounts\":\\[\\]","means":"No volumes at all. Everything lived in the writable layer and is gone.","goto":"cause:no-volume"}]},{"title":"Look for orphaned volumes holding the data","cmd":"docker volume ls -f dangling=true","risk":"safe","look":"Dangling volumes are not attached to any container. Your data may well still be in one of them."},{"title":"Inspect a candidate volume","cmd":"docker run --rm -v <volume-name>:/data alpine ls -la /data","risk":"safe","look":"Mounts the volume read-write into a throwaway container just to list it. If you recognise the contents, the data survived."},{"title":"Check the compose file declares named volumes","cmd":"findstr /C:\"volumes:\" docker-compose.yml","risk":"safe","look":"Named volumes persist across recreation. Anonymous ones are replaced, and a missing volumes section means nothing persists at all."}],"causes":[{"id":"no-volume","cause":"No volume was mounted.","fix":"The writable layer dies with the container. Declare a named volume for anything that matters.","confirm":""},{"id":"anonymous-volume","cause":"An anonymous volume was used.","fix":"Name it. Anonymous volumes are orphaned on recreation and quietly replaced.","confirm":""},{"id":"volume-pruned","cause":"A prune removed it.","fix":"docker volume prune deletes unattached volumes. Check whether it ran.","confirm":""},{"id":"wrong-path","cause":"The volume is mounted at the wrong path.","fix":"It must cover where the app actually writes. Check the image's documentation.","confirm":""},{"id":"compose-down-v","cause":"docker compose down -v was run.","fix":"-v deletes the project's volumes. It is not the same as down.","confirm":""}],"verify":["Data survives a full recreate.","Volumes are named and declared in the compose file.","A backup exists for anything irreplaceable."],"escalate":["The Mounts block","Whether dangling volumes hold the data","The compose volumes section"]},{"id":"docker-slow-bind-mount","tier":"guide","technology":"Docker","category":"Storage & Disk","title":"Bind-mounted files are very slow","summary":"Builds and file watching crawl when the source is bind-mounted from Windows.","aliases":["slow bind mount","slow volume windows","file watching slow","hot reload slow","docker desktop slow files","wsl performance"],"source":"https://docs.docker.com/desktop/features/wsl/","inputs":[{"key":"container","label":"Container","example":"checkout-api"}],"steps":[{"title":"Check where the mount comes from","cmd":"docker inspect {container} --format '{{json .Mounts}}'","risk":"safe","look":"A Source under /c/ or C:\\ crosses the Windows to Linux filesystem boundary on every operation. That crossing is the cost.","signals":[{"match":"/mnt/c/|C:\\\\\\\\|/host_mnt/","means":"Mounted from the Windows filesystem, which is slow through the VM boundary.","goto":"cause:cross-fs"}]},{"title":"Measure the difference","cmd":"docker exec {container} sh -c \"time ls -R /app | wc -l\"","risk":"safe","look":"Compare against the same command on a path inside the container. An order of magnitude difference confirms it."},{"title":"Check whether the project is inside WSL","cmd":"wsl -l -v","risk":"safe","look":"Files stored in the WSL filesystem rather than on C: avoid the boundary entirely and are dramatically faster."},{"title":"Check what is being watched","cmd":"docker exec {container} sh -c \"cat /proc/sys/fs/inotify/max_user_watches\"","risk":"safe","look":"File watchers across the boundary are especially slow because inotify events do not propagate natively."}],"causes":[{"id":"cross-fs","cause":"Files live on the Windows filesystem.","fix":"Move the project into the WSL filesystem. This is the single biggest improvement available.","confirm":""},{"id":"too-many-files","cause":"node_modules or similar is bind-mounted.","fix":"Keep dependencies in a named volume so they never cross the boundary.","confirm":""},{"id":"watcher-polling","cause":"The watcher polls because inotify does not work.","fix":"Enable polling explicitly with a sensible interval, or move to WSL.","confirm":""},{"id":"antivirus","cause":"Windows Defender scans every file access.","fix":"Exclude the project directory.","confirm":""},{"id":"should-copy","cause":"Development bind mount used in production.","fix":"Copy files into the image for production. Bind mounts are a development convenience.","confirm":""}],"verify":["File operations are fast.","Hot reload responds promptly.","The project location is documented for the team."],"escalate":["The mount source path","Timing comparison inside and outside the mount","Whether the project is on WSL or C:"]},{"id":"docker-context-wrong","tier":"guide","technology":"Docker","category":"Daemon","title":"Commands hit the wrong Docker engine","summary":"Containers you created are invisible, or commands affect a remote host unexpectedly.","aliases":["wrong docker context","containers missing","docker context","remote docker","cannot see containers","context switch"],"source":"https://docs.docker.com/engine/manage-resources/contexts/","inputs":[],"steps":[{"title":"Show which context is active","cmd":"docker context ls","risk":"safe","look":"The asterisk marks the active one, with its endpoint. A remote endpoint means your commands leave this machine.","signals":[{"match":"\\*.*ssh://|\\*.*tcp://","means":"The active context points at a remote engine.","goto":"cause:remote-context"},{"match":"\\*.*desktop-linux","means":"Docker Desktop's own context, which is normal on Windows.","goto":""}]},{"title":"Check for an overriding environment variable","cmd":"echo $env:DOCKER_HOST $env:DOCKER_CONTEXT","risk":"safe","look":"DOCKER_HOST overrides the context entirely and silently. A leftover value in a shell profile causes exactly this."},{"title":"Confirm which engine answered","cmd":"docker info --format '{{.Name}} {{.OperatingSystem}}'","risk":"safe","look":"The engine's own identity. If that is not the machine you expect, you are talking to something else."},{"title":"Switch back to the default","cmd":"docker context use default","risk":"state","look":"docker context ls shows the asterisk on default, and docker ps shows what you expect.","note":"Changes the target engine for every subsequent docker command from this user account. Containers on the previous engine keep running but become invisible here until you switch back. On a remote engine, anything you started there is still running and still costing money."}],"causes":[{"id":"remote-context","cause":"The active context targets a remote engine.","fix":"Switch to default. Check what you may have created on the remote host.","confirm":""},{"id":"docker-host-set","cause":"DOCKER_HOST is set in the environment.","fix":"Unset it. It overrides the context with no warning.","confirm":""},{"id":"wrong-os","cause":"Windows containers mode instead of Linux.","fix":"Switch modes in Docker Desktop. Linux images cannot run in Windows mode.","confirm":""},{"id":"multiple-desktops","cause":"Several engines on the machine.","fix":"Name the contexts clearly so the active one is obvious.","confirm":""}],"verify":["docker ps shows the containers you expect.","The active context is intentional.","Nothing was left running on a remote engine."],"escalate":["Output of docker context ls","Whether DOCKER_HOST is set","Which engine docker info reports"]},{"id":"docker-layer-secret-leak","tier":"guide","technology":"Docker","category":"Images","title":"Secrets are baked into the image","summary":"Credentials used during build remain recoverable from the image layers.","aliases":["secret in image","credentials in layer","token in image","build secret","leaked credentials docker","remove secret layer"],"source":"https://docs.docker.com/build/building/secrets/","inputs":[{"key":"image","label":"Image","example":"registry.local/checkout-api:1.4.2"}],"steps":[{"title":"Search the layer history for secrets","cmd":"docker history --no-trunc {image} | findstr /I \"token password secret key\"","risk":"safe","look":"Build arguments and RUN commands are recorded in the history in plain text. Anyone with the image can read them.","signals":[{"match":"ARG|ENV.*(?:TOKEN|PASSWORD|SECRET)","means":"A secret was passed as a build argument and is in the metadata.","goto":"cause:build-arg"}]},{"title":"Search the filesystem in the image","cmd":"docker run --rm --entrypoint sh {image} -c \"ls -la /root/.npmrc /root/.docker /root/.aws 2>/dev/null; echo done\"","risk":"safe","look":"Credential files copied during build. Deleting them in a later layer does not remove them from the earlier one."},{"title":"Check for a secret deleted in a later layer","cmd":"docker history {image} | findstr /C:\"rm \"","risk":"safe","look":"An rm in a later instruction does not remove data from an earlier layer. The file is still extractable from the image."},{"title":"Confirm the image was pushed","cmd":"docker image inspect {image} --format '{{.RepoDigests}}'","risk":"safe","look":"A digest means it was pushed to a registry. Anyone with pull access has the secret and rotation is not optional."}],"causes":[{"id":"build-arg","cause":"A secret was passed via ARG.","fix":"Build arguments are stored in image metadata. Use BuildKit secret mounts instead.","confirm":""},{"id":"copied-credentials","cause":"A credentials file was copied in.","fix":"Use a secret mount, which is never persisted to a layer.","confirm":""},{"id":"deleted-later","cause":"The secret was deleted in a later layer.","fix":"It remains in the earlier layer. Multi-stage builds avoid this properly.","confirm":""},{"id":"must-rotate","cause":"The image was pushed.","fix":"Treat the secret as leaked and rotate it. Removing the image does not undo distribution.","confirm":""}],"verify":["No secret appears in history or in the filesystem.","Build secrets use mounts.","Anything exposed has been rotated."],"escalate":["What the history search found","Whether the image was pushed","Which secrets need rotation"]},{"id":"docker-container-high-cpu","tier":"guide","technology":"Docker","category":"Performance","title":"Container consuming excessive CPU","summary":"One container dominates the host and everything else slows down.","aliases":["container high cpu","docker cpu 100","container slow host","cpu limit docker","throttling container"],"source":"https://docs.docker.com/engine/containers/resource_constraints/","inputs":[{"key":"container","label":"Container","example":"checkout-api"}],"steps":[{"title":"Watch live resource usage","cmd":"docker stats --no-stream","risk":"safe","look":"CPU percentage per container. Over 100% means multiple cores. Compare against the limit, not against 100.","signals":[{"match":"\\d{3,}\\.\\d+%","means":"Using more than one core. Check whether a limit is set at all.","goto":"cause:no-limit"}]},{"title":"Check what limits are configured","cmd":"docker inspect {container} --format 'cpus={{.HostConfig.NanoCpus}} quota={{.HostConfig.CpuQuota}}'","risk":"safe","look":"Zero means unlimited, so the container can take the whole host. That is the default and it is rarely what you want."},{"title":"Look at what is running inside","cmd":"docker top {container}","risk":"safe","look":"The processes. A runaway worker or a busy loop is usually obvious from the process list alone."},{"title":"Apply a CPU limit","cmd":"docker update --cpus=2 {container}","risk":"state","look":"docker stats shows usage capped near the new limit.","note":"Changes the limit on the running container immediately. If the application genuinely needs more, throttling it will make it slower and may cause timeouts or failed health checks. Measure the real requirement before choosing a number."}],"causes":[{"id":"no-limit","cause":"No CPU limit is set.","fix":"Set --cpus. An unlimited container can starve everything else on the host.","confirm":""},{"id":"runaway-process","cause":"A process inside is looping.","fix":"Identify it from docker top and fix the application.","confirm":""},{"id":"gc-pressure","cause":"Garbage collection dominates.","fix":"The runtime may be sized against the host rather than the container. Set explicit heap limits.","confirm":""},{"id":"too-many-workers","cause":"The worker count was derived from host cores.","fix":"Configure it explicitly. Many runtimes read host core count, not the cgroup limit.","confirm":""},{"id":"genuinely-busy","cause":"The work really needs that much CPU.","fix":"Scale out rather than throttling a single container.","confirm":""}],"verify":["CPU usage is proportional to the work.","A limit exists.","Other containers are unaffected."],"escalate":["docker stats output","Configured limits","Process list inside the container"]}]</script>
<script>
"use strict";
const BANK=JSON.parse(document.getElementById("data").textContent);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plain=p=>String(p||"").replace(/^\(\?[imsx]+\)/,"").replace(/\\[sdwSDW]\+?/g," ")
  .replace(/[\^$]/g,"").replace(/\\/g,"").replace(/\.\*|\.\+|\?/g,"")
  .replace(/\(([^)]*)\)/g,"$1").replace(/\[[^\]]*\]/g,"").replace(/\{\d+,?\d*\}/g,"")
  .replace(/\|/g,"  /  ").replace(/\s{2,}/g,"  ").trim();

const CTX={}; let CUR=null;
const RISK={safe:["READ ONLY","c-safe"],state:["CHANGES STATE","c-state"],destructive:["DESTRUCTIVE","c-destructive"]};

const flat=s=>String(s??"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
function score(r,q){if(!q.trim())return 1;const Q=flat(q),T=flat(r.title),A=(r.aliases||[]).map(flat);
  let s=0; if(T.includes(Q))s+=100; if(A.some(a=>a.includes(Q)||Q.includes(a)))s+=80;
  const hay=[T,flat(r.summary),A.join(" "),flat(r.category)].join(" ");
  for(const t of Q.split(" ").filter(x=>x.length>1)){
    if(T.includes(t))s+=18; else if(A.some(a=>a.includes(t)))s+=14; else if(hay.includes(t))s+=4;}
  return s;}

function tree(){
  const q=$("#q").value;
  const hits=BANK.map(r=>({r,s:score(r,q)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  if(!hits.length){$("#nav").innerHTML='<div class="nohit">Nothing matched. Try the exact error text, or a plainer phrase.</div>';return;}
  const byT={};
  hits.forEach(({r})=>{if(!byT[r.technology])byT[r.technology]={};
    const c=r.category||"General"; if(!byT[r.technology][c])byT[r.technology][c]=[];
    byT[r.technology][c].push(r);});
  const searching=q.trim().length>0;
  $("#nav").innerHTML=Object.keys(byT).sort().map(t=>{
    const n=Object.values(byT[t]).reduce((a,b)=>a+b.length,0);
    const open=searching||(CUR&&CUR.technology===t);
    return '<div class="tgroup'+(open?" open":"")+'" data-t="'+esc(t)+'">'+
      '<button class="thead"><span class="car">'+(open?"\u25BE":"\u25B8")+'</span>'+esc(t)+
      '<span class="ct">'+n+'</span></button><div class="tbody">'+
      Object.keys(byT[t]).sort().map(c=>'<div class="chead">'+esc(c).toUpperCase()+'</div>'+
        byT[t][c].map(r=>'<button class="item'+(CUR&&CUR.id===r.id?" sel":"")+'" data-id="'+esc(r.id)+'">'+
          esc(r.title)+'</button>').join("")).join("")+'</div></div>';}).join("");
  document.querySelectorAll(".thead").forEach(b=>b.onclick=()=>{
    const g=b.closest(".tgroup"); g.classList.toggle("open");
    g.querySelector(".car").textContent=g.classList.contains("open")?"\u25BE":"\u25B8";});
  document.querySelectorAll(".item").forEach(b=>b.onclick=()=>{
    open(b.dataset.id);document.body.classList.remove("nav");});
}

function fill(cmd,html){return cmd.replace(/\{([a-z0-9_]+)\}/g,(m,k)=>{const v=CTX[k];
  return !html?(v||m):(v?'<span class="fill">'+esc(v)+'</span>':'<span class="un">'+esc(m)+'</span>');});}
function repaint(){document.querySelectorAll("[data-cmd]").forEach(e=>e.innerHTML=fill(e.dataset.cmd,true));}
function fields(){
  $("#fields").innerHTML=((CUR&&CUR.inputs)||[]).map(i=>
    '<label>'+esc(i.label)+'<input data-k="'+esc(i.key)+'" placeholder="'+esc(i.example||"")+
    '" value="'+esc(CTX[i.key]||"")+'"></label>').join("");
  document.querySelectorAll("#fields input").forEach(x=>x.oninput=()=>{
    CTX[x.dataset.k]=x.value.trim();repaint();});
}

function open(id){
  CUR=BANK.find(r=>r.id===id); if(!CUR)return;
  (CUR.inputs||[]).forEach(i=>{if(!(i.key in CTX))CTX[i.key]="";});
  fields();
  $("#crumb").innerHTML=esc(CUR.technology)+' &nbsp;\u203A&nbsp; '+esc(CUR.category||"")+
    ' &nbsp;\u203A&nbsp; <b>'+esc(CUR.title)+'</b>';

  const steps=(CUR.steps||[]).map((s,i)=>{
    const R=RISK[s.risk]||RISK.safe, dz=s.risk==="destructive";
    const body=dz?'<div class="veil" data-rv="'+i+'">\u25B8 Command hidden. Read the warning, then tap to reveal.</div>'
      :'<pre data-cmd="'+esc(s.cmd)+'"></pre><button class="cp" data-cp="'+i+'">Copy</button>';
    const br=(s.signals||[]).length?'<div class="br"><div class="brh">WHAT YOU MIGHT SEE</div>'+
      s.signals.map(g=>{const t=g.goto||"";let nx="";
        if(t.indexOf("cause:")===0){const k=(CUR.causes||[]).findIndex(x=>x.id===t.slice(6));
          if(k>=0)nx='<span class="goto">\u2192 cause '+(k+1)+'</span>';}
        else if(t.indexOf("step:")===0)nx='<span class="goto">\u2192 step '+t.slice(5)+'</span>';
        return '<div class="brow"><div class="bif"><b>IF YOU SEE</b><code>'+esc(plain(g.match))+
          '</code></div><div class="bthen">'+esc(g.means)+' '+nx+'</div></div>';}).join("")+'</div>':"";
    return '<li class="step'+(dz?" d":"")+'" data-step="'+i+'"><div class="num">'+(i+1)+'</div>'+
      '<div class="sh"><span class="st">'+esc(s.title)+'</span><span class="chip '+R[1]+'">'+R[0]+'</span></div>'+
      (s.note?'<p class="note'+(s.risk==="state"?" s":"")+'">'+esc(s.note)+'</p>':"")+
      '<div class="cmd">'+body+'</div><p class="look">'+esc(s.look)+'</p>'+br+'</li>';}).join("");

  const cz=(CUR.causes||[]).map((c,i)=>'<div class="cz"><div class="rk">'+(i+1)+'</div><div>'+
    '<div class="w">'+esc(c.cause)+'</div><div class="fx"><b>Fix.</b> '+esc(c.fix)+'</div></div></div>').join("");

  $("#pane").innerHTML='<div class="rb"><h2>'+esc(CUR.title)+'</h2>'+
    '<p class="sum">'+esc(CUR.summary)+'</p>'+
    '<div class="tags">'+(CUR.aliases||[]).slice(0,7).map(a=>'<span class="tag">'+esc(a)+'</span>').join("")+'</div>'+
    '<p class="src">Commands vary by version and environment \u2014 read each one before you run it.'+
    (CUR.source?' <a href="'+esc(CUR.source)+'" target="_blank" rel="noopener">Official documentation \u2197</a>':"")+'</p>'+
    '<ol class="steps">'+steps+'</ol>'+
    (cz?'<div class="sec"><h3>LIKELY CAUSES \u2014 MOST COMMON FIRST</h3>'+cz+'</div>':"")+
    ((CUR.verify||[]).length?'<div class="sec"><h3>YOU ARE DONE WHEN</h3><ul class="pl">'+
      CUR.verify.map(v=>'<li>'+esc(fill(v,false))+'</li>').join("")+'</ul></div>':"")+
    ((CUR.escalate||[]).length?'<div class="sec"><h3>IF YOU HAND THIS OVER, INCLUDE</h3><ul class="pl">'+
      CUR.escalate.map(v=>'<li>'+esc(fill(v,false))+'</li>').join("")+'</ul></div>':"")+'</div>';
  window.scrollTo(0,0); repaint(); wire(); tree();
}

function wire(){
  document.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>{
    const t=fill(CUR.steps[+b.dataset.cp].cmd,false);
    navigator.clipboard.writeText(t).then(()=>{const e=$("#toast");e.textContent="Command copied";
      e.style.display="block";setTimeout(()=>e.style.display="none",1500);},()=>prompt("Copy:",t));});
  document.querySelectorAll("[data-rv]").forEach(v=>v.onclick=()=>{
    const i=+v.dataset.rv,s=CUR.steps[i];
    v.outerHTML='<pre data-cmd="'+esc(s.cmd)+'"></pre><button class="cp" data-cp="'+i+'">Copy</button>';
    repaint();wire();});
}

function home(){
  CUR=null; $("#fields").innerHTML=""; $("#crumb").innerHTML="";
  const T=[...new Set(BANK.map(r=>r.technology))].sort();
  const st=BANK.reduce((a,r)=>a+r.steps.length,0);
  const br=BANK.reduce((a,r)=>a+r.steps.reduce((b,s)=>b+(s.signals||[]).length,0),0);
  const cz=BANK.reduce((a,r)=>a+r.causes.length,0);
  $("#pane").innerHTML='<div class="hero"><h2>What is broken?</h2>'+
    '<p>Search the symptom, the error string, or what you were doing when it failed. Every runbook gives '+
    'the checks in order, what each output means, and where to go next.</p>'+
    '<div class="stats">'+
    '<div class="stat"><b>'+BANK.length+'</b><span>runbooks</span></div>'+
    '<div class="stat"><b>'+st+'</b><span>diagnostic steps</span></div>'+
    '<div class="stat"><b>'+br+'</b><span>decision branches</span></div>'+
    '<div class="stat"><b>'+cz+'</b><span>ranked causes</span></div>'+
    '<div class="stat"><b>'+T.length+'</b><span>technologies</span></div></div>'+
    '<div class="cards">'+T.map(t=>{const n=BANK.filter(r=>r.technology===t).length;
      const c=[...new Set(BANK.filter(r=>r.technology===t).map(r=>r.category))].length;
      return '<button class="card" data-tech="'+esc(t)+'"><h3>'+esc(t)+'</h3><p>'+n+
        ' runbooks across '+c+' categories</p></button>';}).join("")+'</div>'+
    '<p class="src" style="margin-top:30px">Runs entirely in this one file. Nothing is sent anywhere, '+
    'nothing is executed for you, and nothing is saved when you close the tab.</p></div>';
  document.querySelectorAll(".card").forEach(b=>b.onclick=()=>{
    const g=[...document.querySelectorAll(".tgroup")].find(x=>x.dataset.t===b.dataset.tech);
    if(g){g.classList.add("open");g.querySelector(".car").textContent="\u25BE";
      g.scrollIntoView({block:"nearest"});}
    document.body.classList.add("nav");});
  tree();
}

$("#q").oninput=tree;
$("#burger").onclick=()=>document.body.classList.toggle("nav");
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&document.activeElement!==$("#q")){e.preventDefault();$("#q").focus();$("#q").select();}
  if(e.key==="Escape"){if(CUR)home();else{$("#q").value="";tree();}}});
home();
</script>
</body>
</html>
