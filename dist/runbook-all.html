 app fails.","signals":[{"match":"^\\s*$","means":"Not resolved through the normal path.","goto":"step:2"},{"match":"\\d+\\.\\d+\\.\\d+\\.\\d+","means":"It resolves. The application's failure is something else.","goto":"cause:not-dns"}]},{"title":"Check the resolver configuration","cmd":"cat /etc/resolv.conf","risk":"safe","look":"The nameserver entries. A 127.0.0.53 entry means systemd-resolved is the local stub, and the real servers are one layer further in."},{"title":"Check the lookup order","cmd":"cat /etc/nsswitch.conf | grep hosts","risk":"safe","look":"The hosts line decides whether files, DNS or mDNS are consulted and in what order. A missing dns entry means DNS is never used at all."},{"title":"Query the nameserver directly","cmd":"dig @$(grep -m1 nameserver /etc/resolv.conf | awk '{print $2}') {host} +short","risk":"safe","look":"Whether the configured server can answer. An answer here with getent failing points at nsswitch rather than DNS."}],"causes":[{"id":"no-nameserver","cause":"resolv.conf has no usable nameserver.","fix":"Add one, or fix whatever manages the file. NetworkManager and systemd-resolved both rewrite it.","confirm":""},{"id":"resolved-stub","cause":"systemd-resolved is the stub and its upstreams are wrong.","fix":"Check resolvectl status for the real upstream servers.","confirm":""},{"id":"nsswitch-order","cause":"The hosts line omits dns.","fix":"Add it. Without it, only /etc/hosts is consulted.","confirm":""},{"id":"search-domain","cause":"A search domain rewrites the query.","fix":"Use a fully qualified name with a trailing dot to bypass the search list.","confirm":""},{"id":"firewall","cause":"UDP 53 is blocked.","fix":"Check egress. Some networks force DNS through a specific resolver.","confirm":""},{"id":"not-dns","cause":"Resolution works; the application fails for another reason.","fix":"Check its own configuration and any proxy settings.","confirm":""}],"verify":["getent resolves the name.","The application connects.","It survives a network restart."],"escalate":["Output of getent hosts","resolv.conf and the nsswitch hosts line","Whether dig against the configured server answers"]},{"id":"linux-user-cannot-login","tier":"guide","technology":"Linux","category":"Access","title":"User cannot log in","summary":"Authentication fails or the session closes immediately after a successful login.","aliases":["cannot login","account locked","login incorrect","connection closed by remote host","no shell","expired password"],"source":"https://man7.org/linux/man-pages/man1/chage.1.html","inputs":[{"key":"user","label":"User","example":"deploy"}],"steps":[{"title":"Check the account's status","cmd":"sudo passwd -S {user} && sudo chage -l {user}","risk":"safe","look":"Locked state and expiry dates. An expired account or password blocks login even with correct credentials.","signals":[{"match":"\\sL\\s","means":"The password is locked.","goto":"cause:locked"},{"match":"(?i)Account expires.*:\\s*\\w{3}\\s\\d","means":"An expiry date is set. Check whether it has passed.","goto":"cause:expired"}]},{"title":"Check the login shell","cmd":"getent passwd {user}","risk":"safe","look":"The last field. /sbin/nologin or /bin/false means authentication succeeds and the session immediately ends, which looks like a login failure.","signals":[{"match":"(?i)nologin|/bin/false","means":"The account has no interactive shell by design.","goto":"cause:no-shell"}]},{"title":"Read the authentication log","cmd":"sudo tail -30 /var/log/auth.log","risk":"safe","look":"The precise reason. PAM states whether it was the password, the account state or an access restriction."},{"title":"Check whether a lockout policy is blocking them","cmd":"sudo faillock --user {user} 2>/dev/null || sudo pam_tally2 -u {user} 2>/dev/null","risk":"safe","look":"Failed attempt counts. Repeated failures can lock an account for a period, and the message given to the user does not say so."}],"causes":[{"id":"locked","cause":"The password is locked.","fix":"passwd -u to unlock. Find out why it was locked first.","confirm":""},{"id":"expired","cause":"The account or password expired.","fix":"chage to extend. Password expiry policies catch service accounts routinely.","confirm":""},{"id":"no-shell","cause":"The shell is nologin.","fix":"Intentional for service accounts. Change it only if interactive access is genuinely needed.","confirm":""},{"id":"faillock","cause":"Too many failed attempts.","fix":"faillock --reset. Then find out what was retrying with a bad password.","confirm":""},{"id":"pam-restriction","cause":"access.conf or a PAM rule denies them.","fix":"Read auth.log. It names the module that denied.","confirm":""},{"id":"home-missing","cause":"The home directory does not exist.","fix":"Login can fail or behave oddly. Create it with the right ownership.","confirm":""}],"verify":["The user logs in.","The session stays open.","auth.log shows a clean accepted entry."],"escalate":["Output of passwd -S and chage -l","The login shell","Relevant auth.log lines"]},{"id":"tf-state-lock","tier":"guide","technology":"Terraform","category":"State","title":"Error acquiring the state lock","summary":"Terraform will not run because another operation holds the lock, or a crashed run left it behind.","aliases":["state lock","error acquiring the state lock","lock id","conditionalcheckfailedexception","terraform locked","force-unlock"],"source":"https://developer.hashicorp.com/terraform/language/state/locking","inputs":[{"key":"lockid","label":"Lock ID from the error","example":"a1b2c3d4-0000-0000-0000-000000000000"}],"steps":[{"title":"Read the lock's own metadata","cmd":"terraform plan","risk":"safe","look":"The error block names Who, Created and Operation. Who and Created together tell you whether this is a live run or an abandoned lock.","signals":[{"match":"(?i)Who:.*@","means":"A named person or CI runner holds it. Check with them before doing anything.","goto":"cause:someone-running"},{"match":"(?i)Operation:\\s*OperationTypeApply","means":"An apply held this lock. If it crashed, state may be partially written.","goto":"cause:crashed-apply"}]},{"title":"Check whether a CI job is actually running","cmd":"echo 'Check your CI pipeline for a running plan or apply on this workspace'","risk":"safe","look":"Do this before force-unlocking. Breaking a live apply's lock is how state gets corrupted."},{"title":"Confirm the timestamp is genuinely stale","cmd":"terraform plan 2>&1 | findstr Created","risk":"safe","look":"A lock minutes old is probably live. Hours old with no running job is abandoned."},{"title":"Force-unlock the stale lock","cmd":"terraform force-unlock {lockid}","risk":"destructive","look":"Terraform confirms the lock was released. Run terraform plan immediately afterwards to check state consistency.","note":"Removes the lock without the holder's knowledge. If another apply is genuinely running, both processes will then write state concurrently and can corrupt it, which is far worse than waiting. Only run this once you have confirmed no job is active."}],"causes":[{"id":"someone-running","cause":"Another engineer or CI job holds the lock legitimately.","fix":"Wait. Do not force-unlock a live operation.","confirm":""},{"id":"crashed-apply","cause":"A previous apply died and left the lock.","fix":"Force-unlock, then plan carefully. Resources may have been created without being recorded.","confirm":""},{"id":"network-interrupt","cause":"A local run lost connectivity mid-operation.","fix":"Force-unlock, then plan to reconcile.","confirm":""},{"id":"permissions","cause":"The backend cannot write the lock at all.","fix":"Check IAM on the lock table or blob. This looks like a lock problem but is an access problem.","confirm":""}],"verify":["terraform plan runs without a lock error.","The plan shows no unexpected drift from a partial apply.","No concurrent operation was interrupted."],"escalate":["The full lock error including Who and Created","Whether any CI job was running","The plan output after unlocking"]},{"id":"tf-already-exists","tier":"guide","technology":"Terraform","category":"State","title":"Resource already exists in the provider","summary":"Apply fails because the real resource exists but Terraform's state does not know about it.","aliases":["already exists","entityalreadyexists","resource exists","import resource","alreadyexists","duplicate resource"],"source":"https://developer.hashicorp.com/terraform/cli/import","inputs":[{"key":"address","label":"Terraform address","example":"aws_s3_bucket.logs"},{"key":"realid","label":"Real resource ID","example":"my-logs-bucket"}],"steps":[{"title":"Confirm Terraform does not have it in state","cmd":"terraform state list | findstr {address}","risk":"safe","look":"No output means it is genuinely absent from state, and import is the right move. Output means state has it and the problem is different.","signals":[{"match":"\\w","means":"It is in state already. This is a naming collision or a second resource, not a missing import.","goto":"cause:name-collision"},{"match":"^\\s*$","means":"Absent from state. Import is appropriate.","goto":"cause:not-in-state"}]},{"title":"Check you are in the workspace you think","cmd":"terraform workspace show && terraform state list | measure-object -line","risk":"safe","look":"Applying against the wrong workspace produces exactly this error and is a common cause, especially in CI."},{"title":"Import the existing resource into state","cmd":"terraform import {address} {realid}","risk":"state","look":"Terraform confirms the import. Nothing in the real infrastructure has changed yet.","note":"Writes the real resource into state but does not generate configuration for you. If your .tf block does not match reality, the very next plan will propose changes to the live resource. Always plan immediately afterwards and read it carefully before applying."},{"title":"Check what Terraform now wants to change","cmd":"terraform plan","risk":"safe","look":"An empty plan means your configuration matches reality. Any proposed change is a real difference you must reconcile in the .tf file, not apply blindly.","signals":[{"match":"(?i)0 to add, 0 to change, 0 to destroy","means":"Configuration matches reality. The import is complete.","goto":""},{"match":"(?i)to destroy","means":"Stop. Your configuration would destroy something. Fix the .tf before applying.","goto":"cause:config-mismatch"}]}],"causes":[{"id":"not-in-state","cause":"The resource was created outside Terraform, or state was lost.","fix":"Import it, then reconcile the configuration until plan is empty.","confirm":""},{"id":"wrong-workspace","cause":"Applying against the wrong workspace or state file.","fix":"Check terraform workspace show. Confirm the backend key too.","confirm":""},{"id":"name-collision","cause":"A different resource already uses that name in the provider.","fix":"Rename one of them. Names are globally unique for some resource types.","confirm":""},{"id":"config-mismatch","cause":"Imported, but the configuration does not match reality.","fix":"Adjust the .tf until plan is empty. Never apply a plan that proposes destroying something you just imported.","confirm":""}],"verify":["terraform plan reports no changes.","The resource appears in terraform state list.","The configuration reflects the real resource accurately."],"escalate":["The exact already-exists error","Output of terraform workspace show","The plan output after import"]},{"id":"tf-unexpected-drift","tier":"guide","technology":"Terraform","category":"Plan","title":"Plan shows changes nobody made","summary":"A plan proposes changes to resources you did not touch. Distinguish real drift from provider noise.","aliases":["unexpected changes","drift","plan shows changes","forces replacement","perpetual diff","always shows changes"],"source":"https://developer.hashicorp.com/terraform/cli/commands/plan","inputs":[{"key":"address","label":"Resource address","example":"aws_ecs_service.api"}],"steps":[{"title":"Refresh state and see what actually drifted","cmd":"terraform plan -refresh-only","risk":"safe","look":"Differences between state and reality only. This separates genuine outside changes from configuration differences, which the normal plan blends together.","signals":[{"match":"(?i)No changes","means":"State matches reality. The diff comes from your configuration, not from drift.","goto":"cause:config-diff"},{"match":"(?i)has changed outside of Terraform","means":"Something modified the resource outside Terraform.","goto":"cause:manual-change"}]},{"title":"Read what specifically would change","cmd":"terraform plan -target={address}","risk":"safe","look":"The attribute-level diff. Watch for 'forces replacement' — that means destroy and recreate, not an in-place update."},{"title":"Check whether it is the same diff every time","cmd":"terraform plan -detailed-exitcode","risk":"safe","look":"Exit code 2 means changes are pending. The same diff reappearing after a successful apply is a perpetual diff, which is a provider or configuration issue rather than drift.","signals":[{"match":"(?i)forces replacement","means":"This would destroy and recreate the resource. Understand the downtime before proceeding.","goto":"cause:replacement"}]},{"title":"Inspect the stored state for the attribute","cmd":"terraform state show {address}","risk":"safe","look":"What Terraform believes. Comparing this against the provider console usually makes the source of the difference obvious."}],"causes":[{"id":"manual-change","cause":"Someone changed the resource in the console.","fix":"Either import the change into configuration, or apply to restore. Decide which is the intended source of truth.","confirm":""},{"id":"config-diff","cause":"The configuration differs from reality and always has.","fix":"A variable or default changed. Compare against the last applied configuration.","confirm":""},{"id":"perpetual-diff","cause":"The same diff returns after every apply.","fix":"Usually a provider normalising a value differently from how it is written. Match the provider's format, or use ignore_changes deliberately.","confirm":""},{"id":"provider-upgrade","cause":"A provider version change altered defaults.","fix":"Read the provider changelog. Pin the version so this does not happen unannounced.","confirm":""},{"id":"replacement","cause":"The change forces destroy and recreate.","fix":"Check which attribute is immutable. For stateful resources this may mean data loss, so plan the change properly.","confirm":""}],"verify":["A plan immediately after apply reports no changes.","Any drift was resolved deliberately, not by blind apply.","No resource was replaced without that being intended."],"escalate":["Output of terraform plan -refresh-only","The attribute-level diff","Provider version and whether it recently changed"]},{"id":"tf-provider-auth","tier":"guide","technology":"Terraform","category":"Providers","title":"Provider authentication fails","summary":"Terraform cannot authenticate to the cloud. The credential chain is layered and the error rarely says which layer.","aliases":["no valid credential","provider auth","invalidclienttokenid","unable to locate credentials","expiredtoken","terraform credentials"],"source":"https://developer.hashicorp.com/terraform/language/providers/configuration","inputs":[],"steps":[{"title":"Read which provider and which stage failed","cmd":"terraform plan","risk":"safe","look":"The provider name and the specific credential error. Expired and missing are completely different problems.","signals":[{"match":"(?i)ExpiredToken|expired","means":"The session token expired. Re-authenticate.","goto":"cause:expired"},{"match":"(?i)unable to locate credentials|no valid credential","means":"No credentials found anywhere in the chain.","goto":"cause:none-found"},{"match":"(?i)InvalidClientTokenId|SignatureDoesNotMatch","means":"Credentials exist but are wrong or from another account.","goto":"cause:wrong-creds"},{"match":"(?i)AccessDenied|not authorized","means":"Authenticated successfully, but lacking permission for the action.","goto":"cause:no-permission"}]},{"title":"See which identity is actually in use","cmd":"aws sts get-caller-identity","risk":"safe","look":"The account and ARN Terraform will use. Confirm it is the account you intend before anything else."},{"title":"Check what the environment is providing","cmd":"echo $env:AWS_PROFILE $env:AWS_REGION && terraform version","risk":"safe","look":"Environment variables override the shared config file. A leftover AWS_PROFILE in the shell is a very common cause."},{"title":"Check whether the provider block pins an assumed role","cmd":"findstr /S /C:\"assume_role\" *.tf","risk":"safe","look":"An assume_role block means your base credentials must be permitted to assume that role. The failure may be at the assume step rather than the base credentials."}],"causes":[{"id":"expired","cause":"The session token has expired.","fix":"Re-authenticate. SSO sessions are typically short-lived by design.","confirm":""},{"id":"none-found","cause":"No credentials in environment, shared config or instance metadata.","fix":"Set the profile or environment variables. Confirm with sts get-caller-identity before running Terraform.","confirm":""},{"id":"wrong-creds","cause":"Credentials belong to a different account.","fix":"Check AWS_PROFILE. A stale exported variable overrides the config file silently.","confirm":""},{"id":"no-permission","cause":"Authenticated but not authorized for the action.","fix":"Read the denied action in the error. It names the exact permission needed.","confirm":""},{"id":"assume-role-fail","cause":"The assume_role step failed.","fix":"Check the trust policy on the target role and whether your base identity is allowed to assume it.","confirm":""}],"verify":["terraform plan runs without a credential error.","sts get-caller-identity shows the intended account.","The credential source is explicit rather than accidental."],"escalate":["The provider error verbatim","Output of aws sts get-caller-identity","Which environment variables are set"]},{"id":"tf-destroy-blocked","tier":"guide","technology":"Terraform","category":"Plan","title":"Destroy fails on a dependency","summary":"Terraform cannot remove a resource because something still references it, or the provider refuses.","aliases":["destroy failed","dependency violation","resource in use","cannot delete","deleteconflict","has dependent objects"],"source":"https://developer.hashicorp.com/terraform/cli/commands/destroy","inputs":[{"key":"address","label":"Resource that will not destroy","example":"aws_security_group.api"}],"steps":[{"title":"Read which dependency is blocking","cmd":"terraform destroy","risk":"safe","look":"The provider names the dependent object. That object often lives outside this Terraform configuration entirely, which is why Terraform cannot see it.","signals":[{"match":"(?i)DependencyViolation|has dependent objects","means":"Something still references this resource.","goto":"cause:external-dependency"},{"match":"(?i)deletion protection|DeletionProtection","means":"Deletion protection is enabled on the resource.","goto":"cause:deletion-protection"},{"match":"(?i)timeout|context deadline","means":"The provider timed out rather than refused.","goto":"cause:timeout"}]},{"title":"See what Terraform itself knows depends on it","cmd":"terraform graph | findstr {address}","risk":"safe","look":"In-configuration dependencies only. If this shows nothing, the blocker is outside Terraform's knowledge."},{"title":"Inspect the resource's current state","cmd":"terraform state show {address}","risk":"safe","look":"Attributes that may indicate protection flags or attachments recorded at the last refresh."},{"title":"Remove it from state without destroying it","cmd":"terraform state rm {address}","risk":"destructive","look":"The address disappears from terraform state list. The real resource is untouched.","note":"Terraform forgets the resource but the real infrastructure keeps running and keeps costing money. It becomes unmanaged, and a future apply may try to create a duplicate. Only do this when you have deliberately decided to hand ownership elsewhere, and record where it went."}],"causes":[{"id":"external-dependency","cause":"Something outside this configuration references the resource.","fix":"Find and remove the dependent object first. Security group rules referencing each other are a classic case.","confirm":""},{"id":"deletion-protection","cause":"The provider has deletion protection enabled.","fix":"Disable it and apply that change, then destroy. Two steps, deliberately.","confirm":""},{"id":"timeout","cause":"The provider timed out during deletion.","fix":"Some resources take a long time to delete. Raise the timeout and retry before assuming failure.","confirm":""},{"id":"orphaned-state","cause":"The real resource is already gone but state still lists it.","fix":"terraform state rm to reconcile.","confirm":""}],"verify":["terraform destroy completes.","The provider console confirms the resource is gone.","Nothing was orphaned into an unmanaged state by accident."],"escalate":["The destroy error including the dependent object","terraform state show for the resource","Whether the dependency is inside or outside this configuration"]},{"id":"tf-for-each-error","tier":"guide","technology":"Terraform","category":"Language","title":"for_each or count fails on unknown values","summary":"The plan cannot proceed because the number of instances depends on something not yet created.","aliases":["invalid for_each argument","count cannot be determined","depends on resource attributes","unknown values","for_each error","cannot be determined until apply"],"source":"https://developer.hashicorp.com/terraform/language/meta-arguments/for_each","inputs":[{"key":"address","label":"Resource address","example":"aws_iam_policy.app"}],"steps":[{"title":"Read which value is unknown","cmd":"terraform plan","risk":"safe","look":"The error names the argument and why it cannot be resolved. for_each keys must be known before any resource is created.","signals":[{"match":"(?i)depends on resource attributes that cannot be determined","means":"The keys derive from something not yet created.","goto":"cause:unknown-keys"},{"match":"(?i)map or set of strings","means":"for_each received the wrong type, often a list of objects.","goto":"cause:wrong-type"},{"match":"(?i)duplicate.*key","means":"Two elements produce the same key.","goto":"cause:duplicate-keys"}]},{"title":"Inspect the expression producing the keys","cmd":"terraform console","risk":"safe","look":"Evaluate the expression interactively. Being able to see the actual value usually makes the problem obvious in seconds."},{"title":"Check whether it depends on an unbuilt resource","cmd":"terraform graph | findstr {address}","risk":"safe","look":"What this resource depends on. Any dependency on an attribute of an uncreated resource makes the keys unknown at plan time."},{"title":"Apply the dependency first as a targeted step","cmd":"terraform apply -target=<dependency-address>","risk":"state","look":"The dependency is created. The full plan can now resolve the keys.","note":"Applies only part of the configuration, deliberately leaving the rest inconsistent. HashiCorp recommends this only for recovery, not routine use. Follow it immediately with a full apply, and never leave a stack in a partially applied state."}],"causes":[{"id":"unknown-keys","cause":"for_each keys derive from an uncreated resource.","fix":"Base keys on static input such as a variable or a local, not on a computed attribute.","confirm":""},{"id":"wrong-type","cause":"for_each needs a map or a set of strings.","fix":"Convert with toset, or build a map keyed by a stable identifier.","confirm":""},{"id":"duplicate-keys","cause":"Two elements produce the same key.","fix":"Choose a genuinely unique key. Names collide more often than IDs.","confirm":""},{"id":"count-vs-foreach","cause":"Using count on a list that changes order.","fix":"count keys by index, so inserting an element shifts everything after it and forces recreation. for_each keyed by name avoids this entirely.","confirm":""}],"verify":["terraform plan resolves without unknown-value errors.","Keys are stable across runs.","Adding an element does not recreate unrelated resources."],"escalate":["The error naming the unknown value","The expression producing the keys","What the resource depends on"]},{"id":"tf-init-backend-error","tier":"guide","technology":"Terraform","category":"Backend","title":"terraform init fails on the backend","summary":"Initialisation cannot reach or configure remote state, so nothing else can run.","aliases":["backend initialization required","init failed","backend configuration changed","error loading state","cannot access backend","reconfigure"],"source":"https://developer.hashicorp.com/terraform/language/backend","inputs":[],"steps":[{"title":"Read the initialisation error","cmd":"terraform init","risk":"safe","look":"Whether it is access, a configuration change, or a missing resource. These are three different problems with similar wording.","signals":[{"match":"(?i)Backend configuration changed","means":"The backend block differs from what was initialised previously.","goto":"cause:config-changed"},{"match":"(?i)AccessDenied|403|Forbidden","means":"Credentials cannot reach the state store.","goto":"cause:no-access"},{"match":"(?i)NoSuchBucket|does not exist","means":"The state store itself is absent.","goto":"cause:missing-bucket"},{"match":"(?i)Failed to get existing workspaces","means":"Cannot list state, usually a permissions problem.","goto":"cause:no-access"}]},{"title":"Check which backend is recorded locally","cmd":"type .terraform\\terraform.tfstate","risk":"safe","look":"The backend configuration from the last successful init. Comparing it against your current backend block explains most of these errors."},{"title":"Confirm credentials reach the state store","cmd":"aws sts get-caller-identity && aws s3 ls s3://<state-bucket>","risk":"safe","look":"Whether this identity can actually list the bucket. Terraform needs read and write on the state object and on the lock table."},{"title":"Reinitialise with the new backend configuration","cmd":"terraform init -reconfigure","risk":"state","look":"Initialisation succeeds. Run terraform state list immediately and confirm your resources are there.","note":"Discards the local record of the previous backend and initialises the new one without copying state across. If you intended to move existing state, use -migrate-state instead; -reconfigure on a populated backend leaves Terraform pointing at empty state and the next plan will propose creating everything."}],"causes":[{"id":"config-changed","cause":"The backend block changed since the last init.","fix":"Use -migrate-state to move state, or -reconfigure only when the new backend already holds the correct state.","confirm":""},{"id":"no-access","cause":"Credentials cannot reach the state store.","fix":"Check IAM on both the bucket and the lock table. Read alone is not enough.","confirm":""},{"id":"missing-bucket","cause":"The state store does not exist.","fix":"Create it, in a separate configuration from the one that uses it.","confirm":""},{"id":"wrong-key","cause":"The state key points somewhere empty.","fix":"Check the key. A typo produces empty state and a plan proposing to create everything.","confirm":""},{"id":"partial-config","cause":"Backend values come from -backend-config and were not supplied.","fix":"Pass the same values, or commit a backend config file.","confirm":""}],"verify":["init completes.","terraform state list shows the expected resources.","A plan proposes no unexpected creation."],"escalate":["The init error verbatim","The recorded backend from .terraform","Whether credentials can list the state store"]},{"id":"tf-version-constraint","tier":"guide","technology":"Terraform","category":"Providers","title":"Version constraint conflict on init","summary":"Terraform cannot find a provider or module version satisfying all constraints at once.","aliases":["no available releases match","version constraint","provider version conflict","required_version","incompatible provider","constraint not satisfied"],"source":"https://developer.hashicorp.com/terraform/language/providers/requirements","inputs":[{"key":"provider","label":"Provider","example":"hashicorp/aws"}],"steps":[{"title":"Read which constraints conflict","cmd":"terraform init","risk":"safe","look":"The error lists every constraint and where each comes from. A module you did not write often carries the restrictive one.","signals":[{"match":"(?i)no available releases match","means":"No single version satisfies all constraints.","goto":"cause:impossible-constraint"},{"match":"(?i)locked provider.*does not match","means":"The lock file pins a version outside the constraints.","goto":"cause:lock-mismatch"},{"match":"(?i)Unsupported Terraform Core version","means":"The CLI version itself is outside required_version.","goto":"cause:core-version"}]},{"title":"See what is currently pinned","cmd":"terraform providers","risk":"safe","look":"The dependency tree with each module's constraint. This is the clearest view of who is asking for what."},{"title":"Check the lock file","cmd":"type .terraform.lock.hcl","risk":"safe","look":"The exact versions and hashes recorded. This file is meant to be committed, and a stale one causes exactly this error after a module upgrade."},{"title":"Upgrade within the constraints","cmd":"terraform init -upgrade","risk":"state","look":"init succeeds and the lock file updates. Run a plan and read it before applying.","note":"Rewrites .terraform.lock.hcl with the newest versions the constraints permit. A provider minor upgrade can change resource defaults and produce a plan with unexpected diffs. Review the plan carefully before applying, and commit the updated lock file so CI matches."}],"causes":[{"id":"impossible-constraint","cause":"Two modules require incompatible versions.","fix":"Upgrade the restrictive module. A single provider version is used for the whole configuration.","confirm":""},{"id":"lock-mismatch","cause":"The lock file pins a version outside the constraints.","fix":"terraform init -upgrade. Commit the result.","confirm":""},{"id":"core-version","cause":"The CLI version is outside required_version.","fix":"Install a matching version. tfenv or similar makes this manageable across projects.","confirm":""},{"id":"pessimistic-pin","cause":"A ~> constraint is narrower than intended.","fix":"~> 4.1 allows 4.x but not 5.0. Confirm that is what you meant.","confirm":""},{"id":"platform-hashes","cause":"The lock file lacks hashes for this platform.","fix":"terraform providers lock with the platforms your team and CI use.","confirm":""}],"verify":["init completes.","The lock file is committed and CI uses the same versions.","A plan after the upgrade shows no surprises."],"escalate":["The constraint error listing all sources","Output of terraform providers","The lock file contents"]},{"id":"tf-cycle-error","tier":"guide","technology":"Terraform","category":"Language","title":"Cycle error in the dependency graph","summary":"Two or more resources depend on each other, so Terraform cannot order them.","aliases":["cycle","dependency cycle","circular dependency","error cycle","graph cycle","resources depend on each other"],"source":"https://developer.hashicorp.com/terraform/internals/graph","inputs":[],"steps":[{"title":"Read the cycle Terraform reports","cmd":"terraform plan","risk":"safe","look":"The error lists every node in the cycle. Each arrow is a reference in your configuration, so the cycle is always findable by reading them."},{"title":"Render the graph around the cycle","cmd":"terraform graph | findstr /C:\"->\"","risk":"safe","look":"The edges. Following the chain from any node in the reported cycle back to itself locates the reference to break."},{"title":"Find the explicit depends_on entries","cmd":"findstr /S /C:\"depends_on\" *.tf","risk":"safe","look":"Manually added dependencies are the most common cause. Terraform infers dependencies from references already, so most depends_on entries are unnecessary and some are harmful."},{"title":"Find where the resources reference each other","cmd":"findstr /S /C:\"<resource-name>\" *.tf","risk":"safe","look":"Two resources naming each other in their arguments. Security groups referencing each other's IDs is the textbook case."}],"causes":[{"id":"mutual-reference","cause":"Two resources reference each other's attributes.","fix":"Break it with a separate association resource. For security groups, use standalone rule resources rather than inline rules.","confirm":""},{"id":"unnecessary-depends-on","cause":"A manual depends_on creates the cycle.","fix":"Remove it. Terraform infers ordering from references and usually gets it right.","confirm":""},{"id":"module-cycle","cause":"Two modules pass outputs to each other.","fix":"Restructure so data flows one way. Extract the shared piece into a third module.","confirm":""},{"id":"self-reference","cause":"A resource references its own attribute.","fix":"Use a local or a variable instead of referring to itself.","confirm":""},{"id":"destroy-cycle","cause":"The cycle only appears on destroy.","fix":"Destroy-time ordering is the reverse. A create_before_destroy lifecycle combined with depends_on frequently produces this.","confirm":""}],"verify":["terraform plan produces a graph with no cycle.","Ordering is inferred from references rather than forced.","Destroy also plans cleanly."],"escalate":["The cycle error listing every node","The relevant graph edges","Any depends_on entries involved"]},{"id":"tf-data-source-not-found","tier":"guide","technology":"Terraform","category":"Data Sources","title":"Data source finds no matching resource","summary":"A lookup returns nothing, so everything depending on it fails.","aliases":["no matching","data source not found","query returned no results","your query returned no results","data lookup failed","not found data"],"source":"https://developer.hashicorp.com/terraform/language/data-sources","inputs":[{"key":"address","label":"Data source address","example":"data.aws_vpc.main"}],"steps":[{"title":"Read which filter matched nothing","cmd":"terraform plan","risk":"safe","look":"The data source and its filters. The provider is usually explicit about which criteria produced no results.","signals":[{"match":"(?i)no matching.*found|returned no results","means":"The filters match nothing in the target account and region.","goto":"cause:filter-too-narrow"},{"match":"(?i)multiple.*found","means":"Too many matches. The data source needs exactly one.","goto":"cause:too-many-matches"}]},{"title":"Run the equivalent query with the CLI","cmd":"aws ec2 describe-vpcs --filters Name=tag:Name,Values=<value>","risk":"safe","look":"Whether the resource exists at all with those filters. This separates a wrong filter from a wrong account or region immediately."},{"title":"Confirm which account and region are in use","cmd":"terraform providers && aws sts get-caller-identity","risk":"safe","look":"A data source searches only the configured region. A resource in another region is invisible to it and the error looks identical."},{"title":"Check the resource is created before the lookup","cmd":"terraform graph | findstr {address}","risk":"safe","look":"A data source reading something created in the same apply resolves before it exists. That needs an explicit dependency or a direct reference instead."}],"causes":[{"id":"filter-too-narrow","cause":"The filters match nothing.","fix":"Verify with the CLI first. Tag values are case-sensitive.","confirm":""},{"id":"wrong-region","cause":"The resource is in a different region.","fix":"Data sources are region-scoped. Use a provider alias for cross-region lookups.","confirm":""},{"id":"wrong-account","cause":"The resource is in another account.","fix":"Use an aliased provider with the correct credentials.","confirm":""},{"id":"too-many-matches","cause":"More than one match.","fix":"Add a filter, or use most_recent where the provider supports it.","confirm":""},{"id":"not-yet-created","cause":"The resource is created in this same apply.","fix":"Reference the resource directly instead of looking it up, or add depends_on to the data source.","confirm":""},{"id":"deleted","cause":"The resource was removed.","fix":"The lookup is correct and the resource is gone. Find out who removed it.","confirm":""}],"verify":["The plan resolves the data source.","The same query returns one result via the CLI.","The account and region are correct."],"escalate":["The data source error","Result of the equivalent CLI query","Which account and region the provider targets"]},{"id":"tf-partial-apply","tier":"guide","technology":"Terraform","category":"Apply","title":"Apply failed partway through","summary":"Some resources were created and some were not. State may not reflect reality.","aliases":["apply failed","partial apply","some resources created","apply interrupted","error applying plan","resources left behind"],"source":"https://developer.hashicorp.com/terraform/cli/commands/apply","inputs":[],"steps":[{"title":"Read which resources completed before the failure","cmd":"terraform apply 2>&1 | findstr /C:\"Creation complete\" /C:\"Error\"","risk":"safe","look":"Everything up to the error was created and recorded. Terraform writes state as it goes, so completed resources are tracked.","signals":[{"match":"(?i)Error: .*timeout","means":"A timeout. The resource may have been created anyway despite the error.","goto":"cause:timeout-created"},{"match":"(?i)Error: .*quota|limit","means":"A service limit was reached mid-apply.","goto":"cause:quota"}]},{"title":"Compare state against reality","cmd":"terraform plan -refresh-only","risk":"safe","look":"Whether anything was created without being recorded. This is the real risk after a timeout, and it produces orphans nobody notices until the bill arrives."},{"title":"List what state currently holds","cmd":"terraform state list","risk":"safe","look":"The resources Terraform knows about. Anything created but absent here is an orphan needing import or manual deletion."},{"title":"Re-run apply to complete the remainder","cmd":"terraform apply","risk":"state","look":"The plan shows only the remaining resources. Read it before confirming rather than accepting by reflex.","note":"Creates only what is missing, since completed resources are already in state. If a resource was created but not recorded, this attempts to create a duplicate and may fail with an already-exists error. Run the refresh-only plan first and resolve any orphans before retrying."}],"causes":[{"id":"timeout-created","cause":"A timeout occurred but the resource was created.","fix":"Import it, then re-apply. This is the most common source of orphaned infrastructure.","confirm":""},{"id":"quota","cause":"A service quota was reached.","fix":"Raise the quota, then re-apply. Completed resources stay.","confirm":""},{"id":"dependency-failed","cause":"An early failure blocked everything after it.","fix":"Fix the root failure and re-apply. The ordering was correct.","confirm":""},{"id":"state-not-written","cause":"The process died before writing state.","fix":"Compare with refresh-only and import anything orphaned.","confirm":""},{"id":"lock-left","cause":"The lock was left behind.","fix":"Follow the state lock runbook before doing anything else.","confirm":""}],"verify":["A full apply completes with no errors.","A subsequent plan shows no changes.","Nothing was orphaned outside state."],"escalate":["Which resources completed before the error","The error verbatim","Output of terraform plan -refresh-only"]},{"id":"tf-module-not-found","tier":"guide","technology":"Terraform","category":"Modules","title":"Module not found or not installed","summary":"init cannot fetch a module, or plan says the module is not installed.","aliases":["module not installed","failed to download module","module source","could not download module","module not found","run terraform init"],"source":"https://developer.hashicorp.com/terraform/language/modules/sources","inputs":[{"key":"module","label":"Module name","example":"vpc"}],"steps":[{"title":"Read the module error","cmd":"terraform init","risk":"safe","look":"Whether it is the source, credentials or a version constraint. Each has a different fix and the wording distinguishes them.","signals":[{"match":"(?i)Module not installed","means":"The module was added but init has not run since.","goto":"cause:init-needed"},{"match":"(?i)Could not download module|failed to download","means":"The source is unreachable or needs authentication.","goto":"cause:source-unreachable"},{"match":"(?i)Unreadable module directory|no such file","means":"A local path that does not exist.","goto":"cause:bad-local-path"}]},{"title":"Check the source declaration","cmd":"findstr /S /C:\"source\" *.tf","risk":"safe","look":"Local paths must start with ./ or ../ or Terraform treats them as registry addresses. Registry sources need a version argument."},{"title":"Check what is actually installed","cmd":"type .terraform\\modules\\modules.json","risk":"safe","look":"The resolved module directories. A stale entry after changing a source causes confusing errors."},{"title":"Reinstall modules from scratch","cmd":"rmdir /s /q .terraform\\modules && terraform init","risk":"destructive","look":"init reports each module downloaded. modules.json is rebuilt.","note":"Deletes the local module cache and re-downloads everything. Safe for state, but any local edits you made inside .terraform/modules are lost — those edits were never a good idea, since they are overwritten by every init anyway. Requires network access to all module sources."}],"causes":[{"id":"init-needed","cause":"A module was added without running init.","fix":"terraform init. Required after any module source change.","confirm":""},{"id":"source-unreachable","cause":"The source cannot be reached.","fix":"Check network and credentials. Private registries and private Git both need auth configured for Terraform, not just for you.","confirm":""},{"id":"bad-local-path","cause":"A local path is wrong.","fix":"Local sources must begin with ./ or ../ and are relative to the file declaring them.","confirm":""},{"id":"version-constraint","cause":"No module version satisfies the constraint.","fix":"Check available versions in the registry.","confirm":""},{"id":"git-auth","cause":"A Git module source needs credentials.","fix":"Configure a credential helper, or use an insteadOf rule to rewrite the URL scheme.","confirm":""},{"id":"stale-cache","cause":"The module cache is inconsistent.","fix":"Remove .terraform/modules and init again.","confirm":""}],"verify":["init installs every module.","plan runs without module errors.","It works from a clean clone in CI."],"escalate":["The module error verbatim","The source declaration","Contents of modules.json"]},{"id":"tf-sensitive-output","tier":"guide","technology":"Terraform","category":"Outputs","title":"Output is redacted or a secret leaked into state","summary":"You cannot read a value you need, or you realise a secret is stored in plain text in state.","aliases":["sensitive value","output redacted","secret in state","cannot read output","sensitive = true","state contains secrets"],"source":"https://developer.hashicorp.com/terraform/language/values/outputs#sensitive","inputs":[{"key":"output","label":"Output name","example":"db_password"}],"steps":[{"title":"Read the output value explicitly","cmd":"terraform output -raw {output}","risk":"safe","look":"-raw prints a sensitive value directly. It is not a bypass; sensitive only suppresses incidental display in logs.","signals":[{"match":"(?i)Unsupported value for raw output","means":"The value is not a simple string. Use -json instead.","goto":"cause:not-string"}]},{"title":"Check whether the value is in state in plain text","cmd":"terraform state pull | findstr /I \"password secret token key\"","risk":"safe","look":"State holds every attribute in plain text, including sensitive ones. sensitive controls display only, never storage. This surprises most people."},{"title":"Check where state is stored and who can read it","cmd":"terraform show -json | python -c \"import json,sys;d=json.load(sys.stdin);print(d.get('values',{}).keys())\"","risk":"safe","look":"Anyone with read access to the state backend can read every secret in it. That is the real exposure, not the console output."},{"title":"Check the backend is encrypted and access-controlled","cmd":"aws s3api get-bucket-encryption --bucket <state-bucket>","risk":"safe","look":"Encryption at rest plus a tight bucket policy is the actual control. Without both, state is a plaintext secret store."}],"causes":[{"id":"not-string","cause":"The output is not a plain string.","fix":"Use terraform output -json and parse it.","confirm":""},{"id":"secret-in-state","cause":"A secret is stored in state in plain text.","fix":"Unavoidable for resources that manage secrets. Protect the backend: encrypt at rest, restrict read access, enable versioning and audit logging.","confirm":""},{"id":"should-not-output","cause":"The secret does not need to be an output at all.","fix":"Have the consuming system read it from the secret store directly instead.","confirm":""},{"id":"committed-state","cause":"State was committed to Git.","fix":"Treat every secret in it as leaked. Rotate them all, then move state to a remote backend.","confirm":""},{"id":"logged-in-ci","cause":"A sensitive value appeared in CI logs.","fix":"Mark it sensitive so Terraform suppresses it, and rotate what leaked.","confirm":""}],"verify":["You can read the value you need.","State is encrypted with restricted read access.","Nothing sensitive is in version control."],"escalate":["Whether the output is marked sensitive","Where state is stored and who can read it","Whether encryption and versioning are enabled"]},{"id":"tf-workspace-confusion","tier":"guide","technology":"Terraform","category":"State","title":"Applied against the wrong environment","summary":"Changes landed in the wrong environment, or plan shows everything being created in one that should exist.","aliases":["wrong workspace","wrong environment","plan wants to create everything","workspace confusion","applied to prod","empty state"],"source":"https://developer.hashicorp.com/terraform/language/state/workspaces","inputs":[],"steps":[{"title":"Confirm the current workspace and state contents","cmd":"terraform workspace show && terraform state list","risk":"safe","look":"An empty state list with a non-empty configuration is the warning sign. It means Terraform sees nothing and will propose creating everything.","signals":[{"match":"(?i)default","means":"The default workspace. If your team uses named workspaces, this is probably wrong.","goto":"cause:default-workspace"}]},{"title":"List every workspace and see which hold state","cmd":"terraform workspace list","risk":"safe","look":"The asterisk marks the current one. Workspace names rarely match environment names exactly, which is where mistakes come from."},{"title":"Check which backend key is in use","cmd":"type .terraform\\terraform.tfstate","risk":"safe","look":"The bucket and key. Workspaces append the workspace name to the key path, so the same configuration reads different state per workspace."},{"title":"Check which credentials are active","cmd":"aws sts get-caller-identity","risk":"safe","look":"Right workspace with production credentials is just as dangerous as the reverse. Both must match before you apply."}],"causes":[{"id":"default-workspace","cause":"You are in default when you meant a named one.","fix":"terraform workspace select <name>. Make the prompt show it so it is always visible.","confirm":""},{"id":"wrong-backend-key","cause":"The backend key points at different state.","fix":"Check the key. A per-environment directory is clearer than workspaces for many teams.","confirm":""},{"id":"wrong-credentials","cause":"Credentials target a different account.","fix":"Confirm with sts get-caller-identity before every apply against anything important.","confirm":""},{"id":"already-applied","cause":"You already applied to the wrong environment.","fix":"Do not immediately destroy. Work out what changed, then reverse it deliberately.","confirm":""},{"id":"no-guardrail","cause":"Nothing prevents this happening.","fix":"Require applies to go through CI with the environment fixed per pipeline. Human workspace selection is the weak point.","confirm":""}],"verify":["Workspace, backend key and credentials all agree.","plan shows only intended changes.","A guardrail exists so it cannot silently happen again."],"escalate":["Current workspace and state list","The backend key","Which account the credentials target"]}]</script>
<script>
"use strict";
const BANK = JSON.parse(document.getElementById("data").textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- session state (in memory only; nothing is persisted) ---------- */
const CTX = {};                 // placeholder key -> value
let CUR = null;                 // open runbook
let LOG = [];                   // [{t, step, cmd, note}]
let CURSOR = -1;                // keyboard cursor in results

/* ---------- search ---------- */
const flat = s => String(s ?? "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
function score(r, q) {
  if (!q.trim()) return 1;
  const qq = flat(q), qt = qq.split(" ").filter(t => t.length > 1);
  const title = flat(r.title), al = (r.aliases || []).map(flat);
  let s = 0;
  if (title.includes(qq)) s += 100;
  if (al.some(a => a.includes(qq) || qq.includes(a))) s += 80;
  const hay = [title, flat(r.summary), al.join(" "), flat(r.category)].join(" ");
  for (const t of qt) {
    if (title.includes(t)) s += 18;
    else if (al.some(a => a.includes(t))) s += 14;
    else if (hay.includes(t)) s += 4;
  }
  return s;
}

let TECH = "All", CAT = "All";

function renderChips() {
  const techs = [...new Set(BANK.map(r => r.technology))].sort();
  $("#techchips").innerHTML = ["All", ...techs].map(t => {
    const n = t === "All" ? BANK.length : BANK.filter(r => r.technology === t).length;
    return `<button class="tab${t === TECH ? " on" : ""}" data-t="${esc(t)}">${esc(t)}<span class="n">${n}</span></button>`;
  }).join("");
  document.querySelectorAll("#techchips .tab").forEach(b => b.onclick = () => {
    TECH = b.dataset.t; CAT = "All"; renderChips(); renderResults();
  });

  const pool = TECH === "All" ? BANK : BANK.filter(r => r.technology === TECH);
  const cats = [...new Set(pool.map(r => r.category).filter(Boolean))].sort();
  $("#catchips").innerHTML = cats.length > 1
    ? ["All", ...cats].map(c =>
        `<button class="tab${c === CAT ? " on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")
    : "";
  document.querySelectorAll("#catchips .tab").forEach(b => b.onclick = () => {
    CAT = b.dataset.c; renderChips(); renderResults();
  });
}

function renderResults() {
  const q = $("#q").value;
  let pool = BANK;
  if (TECH !== "All") pool = pool.filter(r => r.technology === TECH);
  if (CAT !== "All") pool = pool.filter(r => r.category === CAT);
  const arr = pool.map(r => ({ r, s: score(r, q) })).filter(x => x.s > 0)
                  .sort((a, b) => b.s - a.s).slice(0, 60);
  CURSOR = arr.length ? 0 : -1;
  $("#results").innerHTML = arr.length ? arr.map((x, i) => {
    const r = x.r;
    return `<li><button class="hit${i === 0 ? " cur" : ""}" data-id="${esc(r.id)}">
      <h3>${esc(r.title)}</h3><p>${esc(r.summary)}</p>
      <span class="meta">
        <span>${esc(r.technology)}</span>
        <span>${esc(r.category || "")}</span>
        <span>${(r.steps || []).length} steps</span>
        <span>${(r.causes || []).length} causes</span>
      </span></button></li>`;
  }).join("") : `<li class="empty">Nothing matched. Try the exact error string from your terminal,
    or a plainer phrase like "pod won't start".</li>`;
  document.querySelectorAll(".hit").forEach(b => b.onclick = () => open(b.dataset.id));
}

/* ---------- placeholder substitution ---------- */
function fill(cmd, asHtml) {
  return cmd.replace(/\{([a-z0-9_]+)\}/g, (m, k) => {
    const v = CTX[k];
    if (!asHtml) return v || m;
    return v ? `<span class="fill">${esc(v)}</span>`
             : `<span class="unfilled">${esc(m)}</span>`;
  });
}

function ctxBar() {
  const keys = (CUR && CUR.inputs) || [];
  $("#ctxfields").innerHTML = keys.map(i =>
    `<label>${esc(i.label)}<input data-k="${esc(i.key)}" placeholder="${esc(i.example || "")}"
      value="${esc(CTX[i.key] || "")}" size="${Math.max(8, (i.example || "").length)}"></label>`).join("");
  document.querySelectorAll("#ctxfields input").forEach(inp => {
    inp.oninput = () => { CTX[inp.dataset.k] = inp.value.trim(); repaintCmds(); };
  });
}

function repaintCmds() {
  document.querySelectorAll("[data-cmd]").forEach(el => {
    el.innerHTML = fill(el.dataset.cmd, true);
  });
}

/* ---------- runbook view ---------- */
function open(id) {
  CUR = BANK.find(r => r.id === id);
  if (!CUR) return;
  LOG = [];
  (CUR.inputs || []).forEach(i => { if (!(i.key in CTX)) CTX[i.key] = ""; });
  ctxBar();

  const RISK = { safe: ["Read only", "c-safe"], state: ["Changes state", "c-state"],
                 destructive: ["Destructive", "c-destructive"] };

  const steps = (CUR.steps || []).map((s, i) => {
    const [label, cls] = RISK[s.risk] || RISK.safe;
    const danger = s.risk === "destructive";
    const body = danger
      ? `<div class="veil" data-reveal="${i}">Command hidden. Read the warning, then tap to reveal.</div>`
      : `<pre data-cmd="${esc(s.cmd)}"></pre><button class="copy" data-copy="${i}">Copy</button>`;
    const note = s.note ? `<p class="note${s.risk === "state" ? " note-state" : ""}">${esc(s.note)}</p>` : "";
    const sig = (s.signals || []).length
      ? `<details class="match"><summary>Paste your actual output to read it</summary>
           <textarea data-sig="${i}" placeholder="Paste the output you got, then release the key."></textarea>
           <div class="verdict miss" data-verdict="${i}">Nothing matched yet. Paste output above.</div>
         </details>` : "";
    return `<li class="step${danger ? " danger" : ""}" data-step="${i}">
      <button class="mark" data-done="${i}" aria-label="Mark step ${i + 1} done">${i + 1}</button>
      <div class="shead"><span class="stitle">${esc(s.title)}</span>
        <span class="chip ${cls}">${label}</span></div>
      ${note}
      <div class="cmd">${body}</div>
      <p class="look">${esc(s.look)}</p>
      ${sig}</li>`;
  }).join("");

  const causes = (CUR.causes || []).map((c, i) =>
    `<div class="cause" data-cause="${esc(c.id)}">
       <div><span class="rank">${i + 1}</span><span class="what">${esc(c.cause)}</span></div>
       <div class="fix"><b>Fix.</b> ${esc(c.fix)}</div></div>`).join("");

  const prov = `Commands vary by version and environment — read each one before you run it.`
    + (CUR.source ? ` <a href="${esc(CUR.source)}" target="_blank" rel="noopener">Official documentation</a>` : "");

  $("#rbview").innerHTML = `
    <button class="back" id="back">&larr; All runbooks</button>
    <h2>${esc(CUR.title)}</h2>
    <p class="sum">${esc(CUR.summary)}</p>
    <p class="prov">${prov}</p>
    <ol class="steps">${steps}</ol>
    ${causes ? `<div class="sec"><h3>Likely causes, most common first</h3>${causes}</div>` : ""}
    ${(CUR.verify || []).length ? `<div class="sec"><h3>You are done when</h3>
       <ul class="plain">${CUR.verify.map(v => `<li>${esc(fill(v, false))}</li>`).join("")}</ul></div>` : ""}`;

  $("#searchview").style.display = "none";
  $("#results").style.display = "none";
  $("#rbview").style.display = "block";
  $("#bar").style.display = "block";
  $("#foot").textContent = "";
  window.scrollTo(0, 0);
  repaintCmds(); wire(); progress();
}

function wire() {
  $("#back").onclick = home;

  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => {
    const s = CUR.steps[+b.dataset.copy];
    copy(fill(s.cmd, false), "Command copied");
  });

  document.querySelectorAll("[data-reveal]").forEach(v => v.onclick = () => {
    const i = +v.dataset.reveal, s = CUR.steps[i];
    v.outerHTML = `<pre data-cmd="${esc(s.cmd)}"></pre><button class="copy" data-copy="${i}">Copy</button>`;
    repaintCmds(); wire();
  });

  document.querySelectorAll("[data-done]").forEach(b => b.onclick = () => {
    const i = +b.dataset.done, li = b.closest(".step"), s = CUR.steps[i];
    li.classList.toggle("done");
    if (li.classList.contains("done")) {
      LOG.push({ t: new Date().toISOString().slice(11, 19), step: s.title, cmd: fill(s.cmd, false) });
    } else {
      LOG = LOG.filter(e => e.step !== s.title);
    }
    progress();
  });

  document.querySelectorAll("[data-sig]").forEach(ta => ta.oninput = () => {
    const i = +ta.dataset.sig, s = CUR.steps[i], text = ta.value;
    const out = $(`[data-verdict="${i}"]`);
    document.querySelectorAll(".cause").forEach(c => c.classList.remove("lit"));
    if (!text.trim()) {
      out.className = "verdict miss";
      out.textContent = "Nothing matched yet. Paste output above.";
      return;
    }
    const m = (s.signals || []).find(g => { try { return new RegExp(g.match, "i").test(text); } catch { return false; } });
    if (!m) {
      out.className = "verdict miss";
      out.textContent = "No known signature in that output. It may still be fine — read the note above, "
        + "or add this output as a new signal so the next person gets a hit.";
      return;
    }
    out.className = "verdict hit";
    const target = m.goto || "";
    out.innerHTML = `<b>That output means:</b>${esc(m.means)}`;
    if (target.startsWith("cause:")) {
      const c = (CUR.causes || []).find(x => x.id === target.slice(6));
      const el = $(`[data-cause="${CSS.escape(target.slice(6))}"]`);
      if (el) el.classList.add("lit");
      if (c) out.innerHTML += `<button class="jump">Go to the fix: ${esc(c.cause)}</button>`;
      out.querySelector(".jump") && (out.querySelector(".jump").onclick =
        () => el && el.scrollIntoView({ behavior: "smooth", block: "center" }));
    } else if (target.startsWith("step:")) {
      const n = +target.slice(5);
      out.innerHTML += `<button class="jump">Go to step ${n}</button>`;
      out.querySelector(".jump").onclick = () =>
        document.querySelector(`[data-step="${n - 1}"]`).scrollIntoView({ behavior: "smooth", block: "center" });
    }
    LOG.push({ t: new Date().toISOString().slice(11, 19), step: s.title,
               cmd: fill(s.cmd, false), note: m.means });
  });
}

function progress() {
  const total = (CUR.steps || []).length;
  const done = document.querySelectorAll(".step.done").length;
  $("#prog").textContent = `${done} of ${total} checks done`;
}

/* ---------- exports ---------- */
function copy(t, msg) {
  navigator.clipboard.writeText(t).then(() => {
    const el = $("#toast"); el.textContent = msg; el.style.display = "block";
    setTimeout(() => el.style.display = "none", 1600);
  }, () => prompt("Copy manually:", t));
}

$("#a-safe").onclick = () => {
  const c = (CUR.steps || []).filter(s => s.risk === "safe").map(s => `# ${s.title}\n${fill(s.cmd, false)}`);
  copy(c.join("\n\n"), `${c.length} read-only commands copied`);
};

$("#a-esc").onclick = () => {
  const L = [`## ${CUR.title}`, "", "**What I checked**"];
  LOG.forEach(e => { L.push(`- ${e.step} — \`${e.cmd}\``); if (e.note) L.push(`  - saw: ${e.note}`); });
  if (!LOG.length) L.push("- (nothing recorded yet)");
  L.push("", "**Still needed**");
  (CUR.escalate || []).forEach(x => L.push(`- ${fill(x, false)}`));
  copy(L.join("\n"), "Handoff notes copied");
};

$("#a-log").onclick = () => {
  const L = [`# Incident: ${CUR.title}`, `Runbook: ${CUR.id} (verified ${CUR.verified_on || "n/a"})`, ""];
  Object.entries(CTX).filter(([, v]) => v).forEach(([k, v]) => L.push(`- ${k}: \`${v}\``));
  L.push("", "| time | check | command | observed |", "|---|---|---|---|");
  LOG.forEach(e => L.push(`| ${e.t} | ${e.step} | \`${e.cmd}\` | ${e.note || ""} |`));
  if (!LOG.length) L.push("| | no checks recorded | | |");
  copy(L.join("\n"), "Incident log copied as markdown");
};

/* ---------- navigation ---------- */
function home() {
  CUR = null; LOG = [];
  $("#searchview").style.display = "block";
  $("#results").style.display = "block";
  $("#rbview").style.display = "none";
  $("#bar").style.display = "none";
  $("#ctxfields").innerHTML = "";
  $("#foot").textContent = FOOT;
  $("#q").focus(); $("#q").select();
}

$("#q").oninput = renderResults;

document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); $("#q").select(); return; }
  if (e.key === "Escape" && CUR) { home(); return; }
  if (CUR || !["ArrowDown", "ArrowUp", "Enter"].includes(e.key)) return;
  const hits = [...document.querySelectorAll(".hit")];
  if (!hits.length) return;
  if (e.key === "Enter") { e.preventDefault(); hits[Math.max(0, CURSOR)].click(); return; }
  e.preventDefault();
  hits[CURSOR]?.classList.remove("cur");
  CURSOR = (CURSOR + (e.key === "ArrowDown" ? 1 : -1) + hits.length) % hits.length;
  hits[CURSOR].classList.add("cur");
  hits[CURSOR].scrollIntoView({ block: "nearest" });
});

const techs = [...new Set(BANK.map(r => r.technology))].sort();
const FOOT = `${BANK.length} runbooks across ${techs.length} technologies: ${techs.join(", ")}. `
  + `Runs entirely in this file — nothing is sent anywhere, nothing is executed for you, `
  + `and nothing is saved when you close the tab. Every command is yours to run.\n\n`
  + `Designed and built by Dinesh Ilangovan.`;
$("#foot").textContent = FOOT;
renderChips();
renderResults();
</script>
</body>
