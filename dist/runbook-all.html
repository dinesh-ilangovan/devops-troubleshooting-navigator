m.","note":"Permanently deletes every file in that directory older than seven days. Run the same command with -print instead of -delete first and read the list. On a directory with hundreds of thousands of entries this takes a long time and cannot be interrupted cleanly."}],"causes":[{"id":"inodes-full","cause":"Inodes are exhausted.","fix":"Delete small files. Adding disk does not add inodes on most filesystems.","confirm":""},{"id":"session-files","cause":"A web application accumulates session files.","fix":"Configure expiry, or move sessions to a cache server.","confirm":""},{"id":"mail-spool","cause":"Undelivered mail piled up.","fix":"Usually cron output with no MTA. Redirect cron output to a file.","confirm":""},{"id":"no-rotation","cause":"Small log files accumulate.","fix":"Configure rotation with a count limit.","confirm":""},{"id":"filesystem-format","cause":"The filesystem was created with too few inodes.","fix":"Only fixable by reformatting. Choose a higher inode ratio for file-heavy workloads.","confirm":""}],"verify":["df -i shows headroom.","Writes succeed.","The producer is fixed so it does not recur."],"escalate":["df -h and df -i side by side","The directories with the most entries","What is creating them"]},{"id":"tf-state-lock","tier":"guide","technology":"Terraform","category":"State","title":"Error acquiring the state lock","summary":"Terraform will not run because another operation holds the lock, or a crashed run left it behind.","aliases":["state lock","error acquiring the state lock","lock id","conditionalcheckfailedexception","terraform locked","force-unlock"],"source":"https://developer.hashicorp.com/terraform/language/state/locking","inputs":[{"key":"lockid","label":"Lock ID from the error","example":"a1b2c3d4-0000-0000-0000-000000000000"}],"steps":[{"title":"Read the lock's own metadata","cmd":"terraform plan","risk":"safe","look":"The error block names Who, Created and Operation. Who and Created together tell you whether this is a live run or an abandoned lock.","signals":[{"match":"(?i)Who:.*@","means":"A named person or CI runner holds it. Check with them before doing anything.","goto":"cause:someone-running"},{"match":"(?i)Operation:\\s*OperationTypeApply","means":"An apply held this lock. If it crashed, state may be partially written.","goto":"cause:crashed-apply"}]},{"title":"Check whether a CI job is actually running","cmd":"echo 'Check your CI pipeline for a running plan or apply on this workspace'","risk":"safe","look":"Do this before force-unlocking. Breaking a live apply's lock is how state gets corrupted."},{"title":"Confirm the timestamp is genuinely stale","cmd":"terraform plan 2>&1 | findstr Created","risk":"safe","look":"A lock minutes old is probably live. Hours old with no running job is abandoned."},{"title":"Force-unlock the stale lock","cmd":"terraform force-unlock {lockid}","risk":"destructive","look":"Terraform confirms the lock was released. Run terraform plan immediately afterwards to check state consistency.","note":"Removes the lock without the holder's knowledge. If another apply is genuinely running, both processes will then write state concurrently and can corrupt it, which is far worse than waiting. Only run this once you have confirmed no job is active."}],"causes":[{"id":"someone-running","cause":"Another engineer or CI job holds the lock legitimately.","fix":"Wait. Do not force-unlock a live operation.","confirm":""},{"id":"crashed-apply","cause":"A previous apply died and left the lock.","fix":"Force-unlock, then plan carefully. Resources may have been created without being recorded.","confirm":""},{"id":"network-interrupt","cause":"A local run lost connectivity mid-operation.","fix":"Force-unlock, then plan to reconcile.","confirm":""},{"id":"permissions","cause":"The backend cannot write the lock at all.","fix":"Check IAM on the lock table or blob. This looks like a lock problem but is an access problem.","confirm":""}],"verify":["terraform plan runs without a lock error.","The plan shows no unexpected drift from a partial apply.","No concurrent operation was interrupted."],"escalate":["The full lock error including Who and Created","Whether any CI job was running","The plan output after unlocking"]},{"id":"tf-already-exists","tier":"guide","technology":"Terraform","category":"State","title":"Resource already exists in the provider","summary":"Apply fails because the real resource exists but Terraform's state does not know about it.","aliases":["already exists","entityalreadyexists","resource exists","import resource","alreadyexists","duplicate resource"],"source":"https://developer.hashicorp.com/terraform/cli/import","inputs":[{"key":"address","label":"Terraform address","example":"aws_s3_bucket.logs"},{"key":"realid","label":"Real resource ID","example":"my-logs-bucket"}],"steps":[{"title":"Confirm Terraform does not have it in state","cmd":"terraform state list | findstr {address}","risk":"safe","look":"No output means it is genuinely absent from state, and import is the right move. Output means state has it and the problem is different.","signals":[{"match":"\\w","means":"It is in state already. This is a naming collision or a second resource, not a missing import.","goto":"cause:name-collision"},{"match":"^\\s*$","means":"Absent from state. Import is appropriate.","goto":"cause:not-in-state"}]},{"title":"Check you are in the workspace you think","cmd":"terraform workspace show && terraform state list | measure-object -line","risk":"safe","look":"Applying against the wrong workspace produces exactly this error and is a common cause, especially in CI."},{"title":"Import the existing resource into state","cmd":"terraform import {address} {realid}","risk":"state","look":"Terraform confirms the import. Nothing in the real infrastructure has changed yet.","note":"Writes the real resource into state but does not generate configuration for you. If your .tf block does not match reality, the very next plan will propose changes to the live resource. Always plan immediately afterwards and read it carefully before applying."},{"title":"Check what Terraform now wants to change","cmd":"terraform plan","risk":"safe","look":"An empty plan means your configuration matches reality. Any proposed change is a real difference you must reconcile in the .tf file, not apply blindly.","signals":[{"match":"(?i)0 to add, 0 to change, 0 to destroy","means":"Configuration matches reality. The import is complete.","goto":""},{"match":"(?i)to destroy","means":"Stop. Your configuration would destroy something. Fix the .tf before applying.","goto":"cause:config-mismatch"}]}],"causes":[{"id":"not-in-state","cause":"The resource was created outside Terraform, or state was lost.","fix":"Import it, then reconcile the configuration until plan is empty.","confirm":""},{"id":"wrong-workspace","cause":"Applying against the wrong workspace or state file.","fix":"Check terraform workspace show. Confirm the backend key too.","confirm":""},{"id":"name-collision","cause":"A different resource already uses that name in the provider.","fix":"Rename one of them. Names are globally unique for some resource types.","confirm":""},{"id":"config-mismatch","cause":"Imported, but the configuration does not match reality.","fix":"Adjust the .tf until plan is empty. Never apply a plan that proposes destroying something you just imported.","confirm":""}],"verify":["terraform plan reports no changes.","The resource appears in terraform state list.","The configuration reflects the real resource accurately."],"escalate":["The exact already-exists error","Output of terraform workspace show","The plan output after import"]},{"id":"tf-unexpected-drift","tier":"guide","technology":"Terraform","category":"Plan","title":"Plan shows changes nobody made","summary":"A plan proposes changes to resources you did not touch. Distinguish real drift from provider noise.","aliases":["unexpected changes","drift","plan shows changes","forces replacement","perpetual diff","always shows changes"],"source":"https://developer.hashicorp.com/terraform/cli/commands/plan","inputs":[{"key":"address","label":"Resource address","example":"aws_ecs_service.api"}],"steps":[{"title":"Refresh state and see what actually drifted","cmd":"terraform plan -refresh-only","risk":"safe","look":"Differences between state and reality only. This separates genuine outside changes from configuration differences, which the normal plan blends together.","signals":[{"match":"(?i)No changes","means":"State matches reality. The diff comes from your configuration, not from drift.","goto":"cause:config-diff"},{"match":"(?i)has changed outside of Terraform","means":"Something modified the resource outside Terraform.","goto":"cause:manual-change"}]},{"title":"Read what specifically would change","cmd":"terraform plan -target={address}","risk":"safe","look":"The attribute-level diff. Watch for 'forces replacement' — that means destroy and recreate, not an in-place update."},{"title":"Check whether it is the same diff every time","cmd":"terraform plan -detailed-exitcode","risk":"safe","look":"Exit code 2 means changes are pending. The same diff reappearing after a successful apply is a perpetual diff, which is a provider or configuration issue rather than drift.","signals":[{"match":"(?i)forces replacement","means":"This would destroy and recreate the resource. Understand the downtime before proceeding.","goto":"cause:replacement"}]},{"title":"Inspect the stored state for the attribute","cmd":"terraform state show {address}","risk":"safe","look":"What Terraform believes. Comparing this against the provider console usually makes the source of the difference obvious."}],"causes":[{"id":"manual-change","cause":"Someone changed the resource in the console.","fix":"Either import the change into configuration, or apply to restore. Decide which is the intended source of truth.","confirm":""},{"id":"config-diff","cause":"The configuration differs from reality and always has.","fix":"A variable or default changed. Compare against the last applied configuration.","confirm":""},{"id":"perpetual-diff","cause":"The same diff returns after every apply.","fix":"Usually a provider normalising a value differently from how it is written. Match the provider's format, or use ignore_changes deliberately.","confirm":""},{"id":"provider-upgrade","cause":"A provider version change altered defaults.","fix":"Read the provider changelog. Pin the version so this does not happen unannounced.","confirm":""},{"id":"replacement","cause":"The change forces destroy and recreate.","fix":"Check which attribute is immutable. For stateful resources this may mean data loss, so plan the change properly.","confirm":""}],"verify":["A plan immediately after apply reports no changes.","Any drift was resolved deliberately, not by blind apply.","No resource was replaced without that being intended."],"escalate":["Output of terraform plan -refresh-only","The attribute-level diff","Provider version and whether it recently changed"]},{"id":"tf-provider-auth","tier":"guide","technology":"Terraform","category":"Providers","title":"Provider authentication fails","summary":"Terraform cannot authenticate to the cloud. The credential chain is layered and the error rarely says which layer.","aliases":["no valid credential","provider auth","invalidclienttokenid","unable to locate credentials","expiredtoken","terraform credentials"],"source":"https://developer.hashicorp.com/terraform/language/providers/configuration","inputs":[],"steps":[{"title":"Read which provider and which stage failed","cmd":"terraform plan","risk":"safe","look":"The provider name and the specific credential error. Expired and missing are completely different problems.","signals":[{"match":"(?i)ExpiredToken|expired","means":"The session token expired. Re-authenticate.","goto":"cause:expired"},{"match":"(?i)unable to locate credentials|no valid credential","means":"No credentials found anywhere in the chain.","goto":"cause:none-found"},{"match":"(?i)InvalidClientTokenId|SignatureDoesNotMatch","means":"Credentials exist but are wrong or from another account.","goto":"cause:wrong-creds"},{"match":"(?i)AccessDenied|not authorized","means":"Authenticated successfully, but lacking permission for the action.","goto":"cause:no-permission"}]},{"title":"See which identity is actually in use","cmd":"aws sts get-caller-identity","risk":"safe","look":"The account and ARN Terraform will use. Confirm it is the account you intend before anything else."},{"title":"Check what the environment is providing","cmd":"echo $env:AWS_PROFILE $env:AWS_REGION && terraform version","risk":"safe","look":"Environment variables override the shared config file. A leftover AWS_PROFILE in the shell is a very common cause."},{"title":"Check whether the provider block pins an assumed role","cmd":"findstr /S /C:\"assume_role\" *.tf","risk":"safe","look":"An assume_role block means your base credentials must be permitted to assume that role. The failure may be at the assume step rather than the base credentials."}],"causes":[{"id":"expired","cause":"The session token has expired.","fix":"Re-authenticate. SSO sessions are typically short-lived by design.","confirm":""},{"id":"none-found","cause":"No credentials in environment, shared config or instance metadata.","fix":"Set the profile or environment variables. Confirm with sts get-caller-identity before running Terraform.","confirm":""},{"id":"wrong-creds","cause":"Credentials belong to a different account.","fix":"Check AWS_PROFILE. A stale exported variable overrides the config file silently.","confirm":""},{"id":"no-permission","cause":"Authenticated but not authorized for the action.","fix":"Read the denied action in the error. It names the exact permission needed.","confirm":""},{"id":"assume-role-fail","cause":"The assume_role step failed.","fix":"Check the trust policy on the target role and whether your base identity is allowed to assume it.","confirm":""}],"verify":["terraform plan runs without a credential error.","sts get-caller-identity shows the intended account.","The credential source is explicit rather than accidental."],"escalate":["The provider error verbatim","Output of aws sts get-caller-identity","Which environment variables are set"]},{"id":"tf-destroy-blocked","tier":"guide","technology":"Terraform","category":"Plan","title":"Destroy fails on a dependency","summary":"Terraform cannot remove a resource because something still references it, or the provider refuses.","aliases":["destroy failed","dependency violation","resource in use","cannot delete","deleteconflict","has dependent objects"],"source":"https://developer.hashicorp.com/terraform/cli/commands/destroy","inputs":[{"key":"address","label":"Resource that will not destroy","example":"aws_security_group.api"}],"steps":[{"title":"Read which dependency is blocking","cmd":"terraform destroy","risk":"safe","look":"The provider names the dependent object. That object often lives outside this Terraform configuration entirely, which is why Terraform cannot see it.","signals":[{"match":"(?i)DependencyViolation|has dependent objects","means":"Something still references this resource.","goto":"cause:external-dependency"},{"match":"(?i)deletion protection|DeletionProtection","means":"Deletion protection is enabled on the resource.","goto":"cause:deletion-protection"},{"match":"(?i)timeout|context deadline","means":"The provider timed out rather than refused.","goto":"cause:timeout"}]},{"title":"See what Terraform itself knows depends on it","cmd":"terraform graph | findstr {address}","risk":"safe","look":"In-configuration dependencies only. If this shows nothing, the blocker is outside Terraform's knowledge."},{"title":"Inspect the resource's current state","cmd":"terraform state show {address}","risk":"safe","look":"Attributes that may indicate protection flags or attachments recorded at the last refresh."},{"title":"Remove it from state without destroying it","cmd":"terraform state rm {address}","risk":"destructive","look":"The address disappears from terraform state list. The real resource is untouched.","note":"Terraform forgets the resource but the real infrastructure keeps running and keeps costing money. It becomes unmanaged, and a future apply may try to create a duplicate. Only do this when you have deliberately decided to hand ownership elsewhere, and record where it went."}],"causes":[{"id":"external-dependency","cause":"Something outside this configuration references the resource.","fix":"Find and remove the dependent object first. Security group rules referencing each other are a classic case.","confirm":""},{"id":"deletion-protection","cause":"The provider has deletion protection enabled.","fix":"Disable it and apply that change, then destroy. Two steps, deliberately.","confirm":""},{"id":"timeout","cause":"The provider timed out during deletion.","fix":"Some resources take a long time to delete. Raise the timeout and retry before assuming failure.","confirm":""},{"id":"orphaned-state","cause":"The real resource is already gone but state still lists it.","fix":"terraform state rm to reconcile.","confirm":""}],"verify":["terraform destroy completes.","The provider console confirms the resource is gone.","Nothing was orphaned into an unmanaged state by accident."],"escalate":["The destroy error including the dependent object","terraform state show for the resource","Whether the dependency is inside or outside this configuration"]},{"id":"tf-for-each-error","tier":"guide","technology":"Terraform","category":"Language","title":"for_each or count fails on unknown values","summary":"The plan cannot proceed because the number of instances depends on something not yet created.","aliases":["invalid for_each argument","count cannot be determined","depends on resource attributes","unknown values","for_each error","cannot be determined until apply"],"source":"https://developer.hashicorp.com/terraform/language/meta-arguments/for_each","inputs":[{"key":"address","label":"Resource address","example":"aws_iam_policy.app"}],"steps":[{"title":"Read which value is unknown","cmd":"terraform plan","risk":"safe","look":"The error names the argument and why it cannot be resolved. for_each keys must be known before any resource is created.","signals":[{"match":"(?i)depends on resource attributes that cannot be determined","means":"The keys derive from something not yet created.","goto":"cause:unknown-keys"},{"match":"(?i)map or set of strings","means":"for_each received the wrong type, often a list of objects.","goto":"cause:wrong-type"},{"match":"(?i)duplicate.*key","means":"Two elements produce the same key.","goto":"cause:duplicate-keys"}]},{"title":"Inspect the expression producing the keys","cmd":"terraform console","risk":"safe","look":"Evaluate the expression interactively. Being able to see the actual value usually makes the problem obvious in seconds."},{"title":"Check whether it depends on an unbuilt resource","cmd":"terraform graph | findstr {address}","risk":"safe","look":"What this resource depends on. Any dependency on an attribute of an uncreated resource makes the keys unknown at plan time."},{"title":"Apply the dependency first as a targeted step","cmd":"terraform apply -target=<dependency-address>","risk":"state","look":"The dependency is created. The full plan can now resolve the keys.","note":"Applies only part of the configuration, deliberately leaving the rest inconsistent. HashiCorp recommends this only for recovery, not routine use. Follow it immediately with a full apply, and never leave a stack in a partially applied state."}],"causes":[{"id":"unknown-keys","cause":"for_each keys derive from an uncreated resource.","fix":"Base keys on static input such as a variable or a local, not on a computed attribute.","confirm":""},{"id":"wrong-type","cause":"for_each needs a map or a set of strings.","fix":"Convert with toset, or build a map keyed by a stable identifier.","confirm":""},{"id":"duplicate-keys","cause":"Two elements produce the same key.","fix":"Choose a genuinely unique key. Names collide more often than IDs.","confirm":""},{"id":"count-vs-foreach","cause":"Using count on a list that changes order.","fix":"count keys by index, so inserting an element shifts everything after it and forces recreation. for_each keyed by name avoids this entirely.","confirm":""}],"verify":["terraform plan resolves without unknown-value errors.","Keys are stable across runs.","Adding an element does not recreate unrelated resources."],"escalate":["The error naming the unknown value","The expression producing the keys","What the resource depends on"]},{"id":"tf-init-backend-error","tier":"guide","technology":"Terraform","category":"Backend","title":"terraform init fails on the backend","summary":"Initialisation cannot reach or configure remote state, so nothing else can run.","aliases":["backend initialization required","init failed","backend configuration changed","error loading state","cannot access backend","reconfigure"],"source":"https://developer.hashicorp.com/terraform/language/backend","inputs":[],"steps":[{"title":"Read the initialisation error","cmd":"terraform init","risk":"safe","look":"Whether it is access, a configuration change, or a missing resource. These are three different problems with similar wording.","signals":[{"match":"(?i)Backend configuration changed","means":"The backend block differs from what was initialised previously.","goto":"cause:config-changed"},{"match":"(?i)AccessDenied|403|Forbidden","means":"Credentials cannot reach the state store.","goto":"cause:no-access"},{"match":"(?i)NoSuchBucket|does not exist","means":"The state store itself is absent.","goto":"cause:missing-bucket"},{"match":"(?i)Failed to get existing workspaces","means":"Cannot list state, usually a permissions problem.","goto":"cause:no-access"}]},{"title":"Check which backend is recorded locally","cmd":"type .terraform\\terraform.tfstate","risk":"safe","look":"The backend configuration from the last successful init. Comparing it against your current backend block explains most of these errors."},{"title":"Confirm credentials reach the state store","cmd":"aws sts get-caller-identity && aws s3 ls s3://<state-bucket>","risk":"safe","look":"Whether this identity can actually list the bucket. Terraform needs read and write on the state object and on the lock table."},{"title":"Reinitialise with the new backend configuration","cmd":"terraform init -reconfigure","risk":"state","look":"Initialisation succeeds. Run terraform state list immediately and confirm your resources are there.","note":"Discards the local record of the previous backend and initialises the new one without copying state across. If you intended to move existing state, use -migrate-state instead; -reconfigure on a populated backend leaves Terraform pointing at empty state and the next plan will propose creating everything."}],"causes":[{"id":"config-changed","cause":"The backend block changed since the last init.","fix":"Use -migrate-state to move state, or -reconfigure only when the new backend already holds the correct state.","confirm":""},{"id":"no-access","cause":"Credentials cannot reach the state store.","fix":"Check IAM on both the bucket and the lock table. Read alone is not enough.","confirm":""},{"id":"missing-bucket","cause":"The state store does not exist.","fix":"Create it, in a separate configuration from the one that uses it.","confirm":""},{"id":"wrong-key","cause":"The state key points somewhere empty.","fix":"Check the key. A typo produces empty state and a plan proposing to create everything.","confirm":""},{"id":"partial-config","cause":"Backend values come from -backend-config and were not supplied.","fix":"Pass the same values, or commit a backend config file.","confirm":""}],"verify":["init completes.","terraform state list shows the expected resources.","A plan proposes no unexpected creation."],"escalate":["The init error verbatim","The recorded backend from .terraform","Whether credentials can list the state store"]},{"id":"tf-version-constraint","tier":"guide","technology":"Terraform","category":"Providers","title":"Version constraint conflict on init","summary":"Terraform cannot find a provider or module version satisfying all constraints at once.","aliases":["no available releases match","version constraint","provider version conflict","required_version","incompatible provider","constraint not satisfied"],"source":"https://developer.hashicorp.com/terraform/language/providers/requirements","inputs":[{"key":"provider","label":"Provider","example":"hashicorp/aws"}],"steps":[{"title":"Read which constraints conflict","cmd":"terraform init","risk":"safe","look":"The error lists every constraint and where each comes from. A module you did not write often carries the restrictive one.","signals":[{"match":"(?i)no available releases match","means":"No single version satisfies all constraints.","goto":"cause:impossible-constraint"},{"match":"(?i)locked provider.*does not match","means":"The lock file pins a version outside the constraints.","goto":"cause:lock-mismatch"},{"match":"(?i)Unsupported Terraform Core version","means":"The CLI version itself is outside required_version.","goto":"cause:core-version"}]},{"title":"See what is currently pinned","cmd":"terraform providers","risk":"safe","look":"The dependency tree with each module's constraint. This is the clearest view of who is asking for what."},{"title":"Check the lock file","cmd":"type .terraform.lock.hcl","risk":"safe","look":"The exact versions and hashes recorded. This file is meant to be committed, and a stale one causes exactly this error after a module upgrade."},{"title":"Upgrade within the constraints","cmd":"terraform init -upgrade","risk":"state","look":"init succeeds and the lock file updates. Run a plan and read it before applying.","note":"Rewrites .terraform.lock.hcl with the newest versions the constraints permit. A provider minor upgrade can change resource defaults and produce a plan with unexpected diffs. Review the plan carefully before applying, and commit the updated lock file so CI matches."}],"causes":[{"id":"impossible-constraint","cause":"Two modules require incompatible versions.","fix":"Upgrade the restrictive module. A single provider version is used for the whole configuration.","confirm":""},{"id":"lock-mismatch","cause":"The lock file pins a version outside the constraints.","fix":"terraform init -upgrade. Commit the result.","confirm":""},{"id":"core-version","cause":"The CLI version is outside required_version.","fix":"Install a matching version. tfenv or similar makes this manageable across projects.","confirm":""},{"id":"pessimistic-pin","cause":"A ~> constraint is narrower than intended.","fix":"~> 4.1 allows 4.x but not 5.0. Confirm that is what you meant.","confirm":""},{"id":"platform-hashes","cause":"The lock file lacks hashes for this platform.","fix":"terraform providers lock with the platforms your team and CI use.","confirm":""}],"verify":["init completes.","The lock file is committed and CI uses the same versions.","A plan after the upgrade shows no surprises."],"escalate":["The constraint error listing all sources","Output of terraform providers","The lock file contents"]},{"id":"tf-cycle-error","tier":"guide","technology":"Terraform","category":"Language","title":"Cycle error in the dependency graph","summary":"Two or more resources depend on each other, so Terraform cannot order them.","aliases":["cycle","dependency cycle","circular dependency","error cycle","graph cycle","resources depend on each other"],"source":"https://developer.hashicorp.com/terraform/internals/graph","inputs":[],"steps":[{"title":"Read the cycle Terraform reports","cmd":"terraform plan","risk":"safe","look":"The error lists every node in the cycle. Each arrow is a reference in your configuration, so the cycle is always findable by reading them."},{"title":"Render the graph around the cycle","cmd":"terraform graph | findstr /C:\"->\"","risk":"safe","look":"The edges. Following the chain from any node in the reported cycle back to itself locates the reference to break."},{"title":"Find the explicit depends_on entries","cmd":"findstr /S /C:\"depends_on\" *.tf","risk":"safe","look":"Manually added dependencies are the most common cause. Terraform infers dependencies from references already, so most depends_on entries are unnecessary and some are harmful."},{"title":"Find where the resources reference each other","cmd":"findstr /S /C:\"<resource-name>\" *.tf","risk":"safe","look":"Two resources naming each other in their arguments. Security groups referencing each other's IDs is the textbook case."}],"causes":[{"id":"mutual-reference","cause":"Two resources reference each other's attributes.","fix":"Break it with a separate association resource. For security groups, use standalone rule resources rather than inline rules.","confirm":""},{"id":"unnecessary-depends-on","cause":"A manual depends_on creates the cycle.","fix":"Remove it. Terraform infers ordering from references and usually gets it right.","confirm":""},{"id":"module-cycle","cause":"Two modules pass outputs to each other.","fix":"Restructure so data flows one way. Extract the shared piece into a third module.","confirm":""},{"id":"self-reference","cause":"A resource references its own attribute.","fix":"Use a local or a variable instead of referring to itself.","confirm":""},{"id":"destroy-cycle","cause":"The cycle only appears on destroy.","fix":"Destroy-time ordering is the reverse. A create_before_destroy lifecycle combined with depends_on frequently produces this.","confirm":""}],"verify":["terraform plan produces a graph with no cycle.","Ordering is inferred from references rather than forced.","Destroy also plans cleanly."],"escalate":["The cycle error listing every node","The relevant graph edges","Any depends_on entries involved"]},{"id":"tf-data-source-not-found","tier":"guide","technology":"Terraform","category":"Data Sources","title":"Data source finds no matching resource","summary":"A lookup returns nothing, so everything depending on it fails.","aliases":["no matching","data source not found","query returned no results","your query returned no results","data lookup failed","not found data"],"source":"https://developer.hashicorp.com/terraform/language/data-sources","inputs":[{"key":"address","label":"Data source address","example":"data.aws_vpc.main"}],"steps":[{"title":"Read which filter matched nothing","cmd":"terraform plan","risk":"safe","look":"The data source and its filters. The provider is usually explicit about which criteria produced no results.","signals":[{"match":"(?i)no matching.*found|returned no results","means":"The filters match nothing in the target account and region.","goto":"cause:filter-too-narrow"},{"match":"(?i)multiple.*found","means":"Too many matches. The data source needs exactly one.","goto":"cause:too-many-matches"}]},{"title":"Run the equivalent query with the CLI","cmd":"aws ec2 describe-vpcs --filters Name=tag:Name,Values=<value>","risk":"safe","look":"Whether the resource exists at all with those filters. This separates a wrong filter from a wrong account or region immediately."},{"title":"Confirm which account and region are in use","cmd":"terraform providers && aws sts get-caller-identity","risk":"safe","look":"A data source searches only the configured region. A resource in another region is invisible to it and the error looks identical."},{"title":"Check the resource is created before the lookup","cmd":"terraform graph | findstr {address}","risk":"safe","look":"A data source reading something created in the same apply resolves before it exists. That needs an explicit dependency or a direct reference instead."}],"causes":[{"id":"filter-too-narrow","cause":"The filters match nothing.","fix":"Verify with the CLI first. Tag values are case-sensitive.","confirm":""},{"id":"wrong-region","cause":"The resource is in a different region.","fix":"Data sources are region-scoped. Use a provider alias for cross-region lookups.","confirm":""},{"id":"wrong-account","cause":"The resource is in another account.","fix":"Use an aliased provider with the correct credentials.","confirm":""},{"id":"too-many-matches","cause":"More than one match.","fix":"Add a filter, or use most_recent where the provider supports it.","confirm":""},{"id":"not-yet-created","cause":"The resource is created in this same apply.","fix":"Reference the resource directly instead of looking it up, or add depends_on to the data source.","confirm":""},{"id":"deleted","cause":"The resource was removed.","fix":"The lookup is correct and the resource is gone. Find out who removed it.","confirm":""}],"verify":["The plan resolves the data source.","The same query returns one result via the CLI.","The account and region are correct."],"escalate":["The data source error","Result of the equivalent CLI query","Which account and region the provider targets"]},{"id":"tf-partial-apply","tier":"guide","technology":"Terraform","category":"Apply","title":"Apply failed partway through","summary":"Some resources were created and some were not. State may not reflect reality.","aliases":["apply failed","partial apply","some resources created","apply interrupted","error applying plan","resources left behind"],"source":"https://developer.hashicorp.com/terraform/cli/commands/apply","inputs":[],"steps":[{"title":"Read which resources completed before the failure","cmd":"terraform apply 2>&1 | findstr /C:\"Creation complete\" /C:\"Error\"","risk":"safe","look":"Everything up to the error was created and recorded. Terraform writes state as it goes, so completed resources are tracked.","signals":[{"match":"(?i)Error: .*timeout","means":"A timeout. The resource may have been created anyway despite the error.","goto":"cause:timeout-created"},{"match":"(?i)Error: .*quota|limit","means":"A service limit was reached mid-apply.","goto":"cause:quota"}]},{"title":"Compare state against reality","cmd":"terraform plan -refresh-only","risk":"safe","look":"Whether anything was created without being recorded. This is the real risk after a timeout, and it produces orphans nobody notices until the bill arrives."},{"title":"List what state currently holds","cmd":"terraform state list","risk":"safe","look":"The resources Terraform knows about. Anything created but absent here is an orphan needing import or manual deletion."},{"title":"Re-run apply to complete the remainder","cmd":"terraform apply","risk":"state","look":"The plan shows only the remaining resources. Read it before confirming rather than accepting by reflex.","note":"Creates only what is missing, since completed resources are already in state. If a resource was created but not recorded, this attempts to create a duplicate and may fail with an already-exists error. Run the refresh-only plan first and resolve any orphans before retrying."}],"causes":[{"id":"timeout-created","cause":"A timeout occurred but the resource was created.","fix":"Import it, then re-apply. This is the most common source of orphaned infrastructure.","confirm":""},{"id":"quota","cause":"A service quota was reached.","fix":"Raise the quota, then re-apply. Completed resources stay.","confirm":""},{"id":"dependency-failed","cause":"An early failure blocked everything after it.","fix":"Fix the root failure and re-apply. The ordering was correct.","confirm":""},{"id":"state-not-written","cause":"The process died before writing state.","fix":"Compare with refresh-only and import anything orphaned.","confirm":""},{"id":"lock-left","cause":"The lock was left behind.","fix":"Follow the state lock runbook before doing anything else.","confirm":""}],"verify":["A full apply completes with no errors.","A subsequent plan shows no changes.","Nothing was orphaned outside state."],"escalate":["Which resources completed before the error","The error verbatim","Output of terraform plan -refresh-only"]},{"id":"tf-module-not-found","tier":"guide","technology":"Terraform","category":"Modules","title":"Module not found or not installed","summary":"init cannot fetch a module, or plan says the module is not installed.","aliases":["module not installed","failed to download module","module source","could not download module","module not found","run terraform init"],"source":"https://developer.hashicorp.com/terraform/language/modules/sources","inputs":[{"key":"module","label":"Module name","example":"vpc"}],"steps":[{"title":"Read the module error","cmd":"terraform init","risk":"safe","look":"Whether it is the source, credentials or a version constraint. Each has a different fix and the wording distinguishes them.","signals":[{"match":"(?i)Module not installed","means":"The module was added but init has not run since.","goto":"cause:init-needed"},{"match":"(?i)Could not download module|failed to download","means":"The source is unreachable or needs authentication.","goto":"cause:source-unreachable"},{"match":"(?i)Unreadable module directory|no such file","means":"A local path that does not exist.","goto":"cause:bad-local-path"}]},{"title":"Check the source declaration","cmd":"findstr /S /C:\"source\" *.tf","risk":"safe","look":"Local paths must start with ./ or ../ or Terraform treats them as registry addresses. Registry sources need a version argument."},{"title":"Check what is actually installed","cmd":"type .terraform\\modules\\modules.json","risk":"safe","look":"The resolved module directories. A stale entry after changing a source causes confusing errors."},{"title":"Reinstall modules from scratch","cmd":"rmdir /s /q .terraform\\modules && terraform init","risk":"destructive","look":"init reports each module downloaded. modules.json is rebuilt.","note":"Deletes the local module cache and re-downloads everything. Safe for state, but any local edits you made inside .terraform/modules are lost — those edits were never a good idea, since they are overwritten by every init anyway. Requires network access to all module sources."}],"causes":[{"id":"init-needed","cause":"A module was added without running init.","fix":"terraform init. Required after any module source change.","confirm":""},{"id":"source-unreachable","cause":"The source cannot be reached.","fix":"Check network and credentials. Private registries and private Git both need auth configured for Terraform, not just for you.","confirm":""},{"id":"bad-local-path","cause":"A local path is wrong.","fix":"Local sources must begin with ./ or ../ and are relative to the file declaring them.","confirm":""},{"id":"version-constraint","cause":"No module version satisfies the constraint.","fix":"Check available versions in the registry.","confirm":""},{"id":"git-auth","cause":"A Git module source needs credentials.","fix":"Configure a credential helper, or use an insteadOf rule to rewrite the URL scheme.","confirm":""},{"id":"stale-cache","cause":"The module cache is inconsistent.","fix":"Remove .terraform/modules and init again.","confirm":""}],"verify":["init installs every module.","plan runs without module errors.","It works from a clean clone in CI."],"escalate":["The module error verbatim","The source declaration","Contents of modules.json"]},{"id":"tf-sensitive-output","tier":"guide","technology":"Terraform","category":"Outputs","title":"Output is redacted or a secret leaked into state","summary":"You cannot read a value you need, or you realise a secret is stored in plain text in state.","aliases":["sensitive value","output redacted","secret in state","cannot read output","sensitive = true","state contains secrets"],"source":"https://developer.hashicorp.com/terraform/language/values/outputs#sensitive","inputs":[{"key":"output","label":"Output name","example":"db_password"}],"steps":[{"title":"Read the output value explicitly","cmd":"terraform output -raw {output}","risk":"safe","look":"-raw prints a sensitive value directly. It is not a bypass; sensitive only suppresses incidental display in logs.","signals":[{"match":"(?i)Unsupported value for raw output","means":"The value is not a simple string. Use -json instead.","goto":"cause:not-string"}]},{"title":"Check whether the value is in state in plain text","cmd":"terraform state pull | findstr /I \"password secret token key\"","risk":"safe","look":"State holds every attribute in plain text, including sensitive ones. sensitive controls display only, never storage. This surprises most people."},{"title":"Check where state is stored and who can read it","cmd":"terraform show -json | python -c \"import json,sys;d=json.load(sys.stdin);print(d.get('values',{}).keys())\"","risk":"safe","look":"Anyone with read access to the state backend can read every secret in it. That is the real exposure, not the console output."},{"title":"Check the backend is encrypted and access-controlled","cmd":"aws s3api get-bucket-encryption --bucket <state-bucket>","risk":"safe","look":"Encryption at rest plus a tight bucket policy is the actual control. Without both, state is a plaintext secret store."}],"causes":[{"id":"not-string","cause":"The output is not a plain string.","fix":"Use terraform output -json and parse it.","confirm":""},{"id":"secret-in-state","cause":"A secret is stored in state in plain text.","fix":"Unavoidable for resources that manage secrets. Protect the backend: encrypt at rest, restrict read access, enable versioning and audit logging.","confirm":""},{"id":"should-not-output","cause":"The secret does not need to be an output at all.","fix":"Have the consuming system read it from the secret store directly instead.","confirm":""},{"id":"committed-state","cause":"State was committed to Git.","fix":"Treat every secret in it as leaked. Rotate them all, then move state to a remote backend.","confirm":""},{"id":"logged-in-ci","cause":"A sensitive value appeared in CI logs.","fix":"Mark it sensitive so Terraform suppresses it, and rotate what leaked.","confirm":""}],"verify":["You can read the value you need.","State is encrypted with restricted read access.","Nothing sensitive is in version control."],"escalate":["Whether the output is marked sensitive","Where state is stored and who can read it","Whether encryption and versioning are enabled"]},{"id":"tf-workspace-confusion","tier":"guide","technology":"Terraform","category":"State","title":"Applied against the wrong environment","summary":"Changes landed in the wrong environment, or plan shows everything being created in one that should exist.","aliases":["wrong workspace","wrong environment","plan wants to create everything","workspace confusion","applied to prod","empty state"],"source":"https://developer.hashicorp.com/terraform/language/state/workspaces","inputs":[],"steps":[{"title":"Confirm the current workspace and state contents","cmd":"terraform workspace show && terraform state list","risk":"safe","look":"An empty state list with a non-empty configuration is the warning sign. It means Terraform sees nothing and will propose creating everything.","signals":[{"match":"(?i)default","means":"The default workspace. If your team uses named workspaces, this is probably wrong.","goto":"cause:default-workspace"}]},{"title":"List every workspace and see which hold state","cmd":"terraform workspace list","risk":"safe","look":"The asterisk marks the current one. Workspace names rarely match environment names exactly, which is where mistakes come from."},{"title":"Check which backend key is in use","cmd":"type .terraform\\terraform.tfstate","risk":"safe","look":"The bucket and key. Workspaces append the workspace name to the key path, so the same configuration reads different state per workspace."},{"title":"Check which credentials are active","cmd":"aws sts get-caller-identity","risk":"safe","look":"Right workspace with production credentials is just as dangerous as the reverse. Both must match before you apply."}],"causes":[{"id":"default-workspace","cause":"You are in default when you meant a named one.","fix":"terraform workspace select <name>. Make the prompt show it so it is always visible.","confirm":""},{"id":"wrong-backend-key","cause":"The backend key points at different state.","fix":"Check the key. A per-environment directory is clearer than workspaces for many teams.","confirm":""},{"id":"wrong-credentials","cause":"Credentials target a different account.","fix":"Confirm with sts get-caller-identity before every apply against anything important.","confirm":""},{"id":"already-applied","cause":"You already applied to the wrong environment.","fix":"Do not immediately destroy. Work out what changed, then reverse it deliberately.","confirm":""},{"id":"no-guardrail","cause":"Nothing prevents this happening.","fix":"Require applies to go through CI with the environment fixed per pipeline. Human workspace selection is the weak point.","confirm":""}],"verify":["Workspace, backend key and credentials all agree.","plan shows only intended changes.","A guardrail exists so it cannot silently happen again."],"escalate":["Current workspace and state list","The backend key","Which account the credentials target"]},{"id":"tf-resource-recreated-unexpectedly","tier":"guide","technology":"Terraform","category":"Plan","title":"Plan wants to destroy and recreate a resource","summary":"An apparently small change forces replacement, which for a stateful resource means data loss.","aliases":["forces replacement","must be replaced","destroy and recreate","replacement required","why is it recreating"],"source":"https://developer.hashicorp.com/terraform/language/meta-arguments/lifecycle","inputs":[{"key":"address","label":"Resource","example":"aws_db_instance.main"}],"steps":[{"title":"Find which attribute forces it","cmd":"terraform plan -target={address}","risk":"safe","look":"Terraform marks the specific attribute with 'forces replacement'. That one line is the entire answer.","signals":[{"match":"forces replacement","means":"An immutable attribute changed. In-place update is impossible.","goto":"cause:immutable-attr"},{"match":"must be replaced","means":"Replacement is planned. Understand the impact before applying.","goto":"cause:immutable-attr"}]},{"title":"Check what the current value is","cmd":"terraform state show {address}","risk":"safe","look":"The stored value against your configuration. Sometimes the difference is formatting rather than a real change."},{"title":"Check whether a provider upgrade changed defaults","cmd":"terraform providers","risk":"safe","look":"A provider version bump can change a default and force replacement on resources nobody touched."},{"title":"Protect the resource while you decide","cmd":"terraform plan","risk":"safe","look":"Add a prevent_destroy lifecycle block to the resource in code, then re-plan. Terraform will refuse to plan a destroy for it, which turns an accident into an explicit decision."}],"causes":[{"id":"immutable-attr","cause":"An immutable attribute changed.","fix":"Some attributes cannot change in place. For a database that means data loss unless you plan a migration.","confirm":""},{"id":"provider-default","cause":"A provider upgrade changed a default.","fix":"Read the changelog. Pin the value explicitly to match reality.","confirm":""},{"id":"formatting-only","cause":"The value differs only in formatting.","fix":"Match the provider's normalised form, or use ignore_changes.","confirm":""},{"id":"name-change","cause":"A name or identifier changed.","fix":"Most providers cannot rename in place. Plan a migration deliberately.","confirm":""},{"id":"moved-block","cause":"The resource address changed in code.","fix":"Use a moved block so Terraform tracks the rename instead of recreating.","confirm":""}],"verify":["The plan shows no unintended replacement.","Any genuine replacement is planned with a migration.","Stateful resources carry prevent_destroy."],"escalate":["The attribute marked forces replacement","Current value from state","Whether the provider version changed"]},{"id":"tf-output-not-updating","tier":"guide","technology":"Terraform","category":"Outputs","title":"Outputs are stale or missing after apply","summary":"terraform output shows old values or nothing at all.","aliases":["output not updating","no outputs","stale output","output empty","outputs missing"],"source":"https://developer.hashicorp.com/terraform/language/values/outputs","inputs":[{"key":"output","label":"Output name","example":"cluster_endpoint"}],"steps":[{"title":"Check what state holds","cmd":"terraform output -json","risk":"safe","look":"Outputs come from state, not from the configuration. Empty here means the last apply did not record them.","signals":[{"match":"\\{\\s*\\}","means":"No outputs in state at all.","goto":"cause:not-applied"},{"match":"\"sensitive\": true","means":"Present but redacted. Use -raw to read it.","goto":"cause:sensitive"}]},{"title":"Check the output is declared and reachable","cmd":"findstr /S /C:\"output \\\"{output}\\\"\" *.tf","risk":"safe","look":"An output inside a module is not exposed at the root unless the root also declares one that references it."},{"title":"Refresh state from reality","cmd":"terraform refresh 2>nul || terraform apply -refresh-only","risk":"state","look":"Outputs repopulate from current reality.","note":"Updates state to match the real infrastructure without changing anything. It rewrites the state file, so a concurrent apply elsewhere could conflict. It does not modify infrastructure, but it can reveal drift you were not expecting in the next plan."},{"title":"Check you are in the right workspace","cmd":"terraform workspace show","risk":"safe","look":"Outputs are per workspace. Reading from the wrong one returns different values or nothing, with no error."}],"causes":[{"id":"not-applied","cause":"Apply has not run since the outputs were added.","fix":"Run apply. Outputs are written to state at apply time.","confirm":""},{"id":"module-not-exposed","cause":"The output lives in a module.","fix":"Declare a root-level output referencing module.<name>.<output>.","confirm":""},{"id":"sensitive","cause":"The output is marked sensitive.","fix":"terraform output -raw <name>.","confirm":""},{"id":"wrong-workspace","cause":"Reading from a different workspace.","fix":"Select the right one.","confirm":""},{"id":"depends-on-unknown","cause":"The value was unknown at apply time.","fix":"Check the resource actually produced the attribute.","confirm":""}],"verify":["terraform output returns current values.","Values match reality.","The right workspace is selected."],"escalate":["Output of terraform output -json","Where the output is declared","Current workspace"]},{"id":"tf-plan-slow","tier":"guide","technology":"Terraform","category":"Performance","title":"Plan takes many minutes","summary":"Every plan is slow, which makes the whole workflow painful and discourages small changes.","aliases":["terraform slow","plan takes forever","slow refresh","performance terraform","plan timeout"],"source":"https://developer.hashicorp.com/terraform/cli/commands/plan","inputs":[],"steps":[{"title":"Count what is in state","cmd":"terraform state list | measure-object -line","risk":"safe","look":"Plan refreshes every resource by default. Several hundred resources in one state is the most common cause of a slow plan."},{"title":"Time a plan without refresh","cmd":"terraform plan -refresh=false","risk":"safe","look":"Much faster here means refresh is the cost, not evaluation. That points at API round trips rather than your configuration.","signals":[{"match":"No changes","means":"Fast without refresh. The API calls are the bottleneck.","goto":"cause:refresh-cost"}]},{"title":"Check provider parallelism","cmd":"terraform plan -parallelism=20","risk":"safe","look":"The default is ten concurrent operations. Raising it helps when the provider API is the limit, though rate limits apply."},{"title":"Check for large data sources","cmd":"findstr /S /C:\"data \\\"\" *.tf","risk":"safe","look":"A data source listing every object in an account runs on every plan. Those are frequently the real cost."}],"causes":[{"id":"refresh-cost","cause":"Refreshing every resource is slow.","fix":"Split the configuration into smaller states. One state per component is the usual answer.","confirm":""},{"id":"too-many-resources","cause":"Hundreds of resources in one state.","fix":"Split by lifecycle. Things that change together belong together.","confirm":""},{"id":"broad-data-source","cause":"A data source enumerates everything.","fix":"Filter it, or replace it with a variable.","confirm":""},{"id":"low-parallelism","cause":"Default parallelism limits throughput.","fix":"Raise it, watching for provider rate limits.","confirm":""},{"id":"remote-state-chain","cause":"Many remote state data sources.","fix":"Each is a fetch. Reduce the chain.","confirm":""}],"verify":["Plan completes in a reasonable time.","State size is manageable.","Data sources are filtered."],"escalate":["Resource count in state","Plan timing with and without refresh","Which data sources are used"]},{"id":"tf-state-drift-detection","tier":"guide","technology":"Terraform","category":"State","title":"State does not match reality","summary":"Someone changed infrastructure outside Terraform and you need to know what.","aliases":["drift detection","state mismatch","changed outside terraform","manual change","reconcile state","refresh drift"],"source":"https://developer.hashicorp.com/terraform/cli/commands/plan","inputs":[],"steps":[{"title":"Detect drift without proposing changes","cmd":"terraform plan -refresh-only","risk":"safe","look":"Differences between state and reality only. This separates outside changes from configuration changes, which a normal plan blends together.","signals":[{"match":"has changed outside of Terraform","means":"Real drift. Something modified the infrastructure directly.","goto":"cause:manual-change"},{"match":"No changes","means":"State matches reality. Any diff in a normal plan comes from your configuration.","goto":""}]},{"title":"See exactly which attributes drifted","cmd":"terraform show -json | findstr /C:\"drift\"","risk":"safe","look":"The attribute level. A tag added by a policy engine is very different from a security group rule someone opened."},{"title":"Check who changed it","cmd":"aws cloudtrail lookup-events --lookup-attributes AttributeKey=ResourceName,AttributeValue=<name> --max-items 5","risk":"safe","look":"The audit trail names the principal and the time. That matters more than the change itself, because it tells you whether the process failed."},{"title":"Accept the drift into state","cmd":"terraform apply -refresh-only","risk":"state","look":"A subsequent refresh-only plan shows no drift.","note":"Updates state to match reality without changing infrastructure. This makes Terraform accept the outside change as correct, which is right only if the change was intended. If it was not, you want a normal apply to revert it instead."}],"causes":[{"id":"manual-change","cause":"Someone changed it directly.","fix":"Decide which is the source of truth: accept with refresh-only, or revert with a normal apply.","confirm":""},{"id":"policy-engine","cause":"An automated policy added tags or rules.","fix":"Add them to configuration, or use ignore_changes for that attribute.","confirm":""},{"id":"provider-normalisation","cause":"The provider stores a value differently.","fix":"Not real drift. Match the provider's format.","confirm":""},{"id":"emergency-change","cause":"An incident fix was applied directly.","fix":"Bring it into code now. Undocumented emergency changes are how configurations diverge permanently.","confirm":""},{"id":"no-guardrail","cause":"Direct changes are possible at all.","fix":"Restrict console write access in environments Terraform manages.","confirm":""}],"verify":["refresh-only reports no drift.","Any accepted change is reflected in code.","The cause of the direct change was addressed."],"escalate":["The refresh-only plan output","Which attributes drifted","Who made the change and when"]},{"id":"tf-secrets-in-plan-output","tier":"guide","technology":"Terraform","category":"Outputs","title":"Sensitive values appear in plan output or CI logs","summary":"A password or key is printed where anyone with log access can read it.","aliases":["secret in plan","sensitive in logs","password in output","ci logs secret","plan shows password"],"source":"https://developer.hashicorp.com/terraform/language/values/variables#suppressing-values-in-cli-output","inputs":[],"steps":[{"title":"Find which values are shown","cmd":"terraform plan -no-color | findstr /I \"password secret token key\"","risk":"safe","look":"Anything readable here is readable in CI logs, which are usually retained and widely accessible."},{"title":"Check which variables are marked sensitive","cmd":"findstr /S /C:\"sensitive\" *.tf","risk":"safe","look":"Variables and outputs both support sensitive. Unmarked ones are printed in full."},{"title":"Check whether the value is in state too","cmd":"terraform state pull | findstr /I \"password\"","risk":"safe","look":"State always holds values in plain text regardless of the sensitive flag. Marking a value sensitive changes display, never storage."},{"title":"Check CI log retention","cmd":"echo 'Check your CI settings for log retention and who can read build logs'","risk":"safe","look":"A secret printed once in a log retained for months is exposed for months. Rotation is the only real remedy."}],"causes":[{"id":"not-marked","cause":"The variable or output is not marked sensitive.","fix":"Mark it. Terraform then redacts it in plan and apply output.","confirm":""},{"id":"already-logged","cause":"The value appeared in a CI log.","fix":"Rotate it. Marking it sensitive now does not unpublish the log.","confirm":""},{"id":"in-state","cause":"It is in state regardless.","fix":"Encrypt the backend and restrict read access. That is the real control.","confirm":""},{"id":"should-not-be-in-tf","cause":"Terraform should not hold this secret at all.","fix":"Generate it in a secret manager and have the application read it directly.","confirm":""},{"id":"output-unnecessary","cause":"The output exists but nothing consumes it.","fix":"Remove it. The safest secret is one that is never printed.","confirm":""}],"verify":["Plan output shows redacted values.","Anything previously logged has been rotated.","State is encrypted with restricted access."],"escalate":["What appeared in the output","Which variables are marked sensitive","Whether CI logs retained it"]},{"id":"tf-count-index-shift","tier":"guide","technology":"Terraform","category":"Language","title":"Adding an item recreates unrelated resources","summary":"Inserting one element into a list causes Terraform to destroy and recreate everything after it.","aliases":["count index shift","resources recreated list","for_each vs count","index change","everything recreated"],"source":"https://developer.hashicorp.com/terraform/language/meta-arguments/count","inputs":[{"key":"address","label":"Resource","example":"aws_instance.web"}],"steps":[{"title":"See what the plan proposes","cmd":"terraform plan","risk":"safe","look":"Multiple replacements after a single addition is the signature of count keyed by index.","signals":[{"match":"must be replaced.*\\[\\d+\\]","means":"Resources addressed by index are being recreated because their index moved.","goto":"cause:count-index"}]},{"title":"Check how the resource is keyed","cmd":"findstr /S /C:\"count\" /C:\"for_each\" *.tf","risk":"safe","look":"count keys by position, so inserting shifts everything after it. for_each keys by a stable string and does not."},{"title":"Look at the addresses in state","cmd":"terraform state list | findstr {address}","risk":"safe","look":"Bracketed numbers mean count. Bracketed quoted strings mean for_each and are stable."},{"title":"Move resources to their new addresses","cmd":"terraform state mv '{address}[1]' '{address}[2]'","risk":"state","look":"A subsequent plan proposes no replacement.","note":"Rewrites state so Terraform associates an existing resource with a different address. No infrastructure changes, but a mistake here leaves a resource tracked as something it is not, and the next apply will act on that belief. Back up state first with terraform state pull."}],"causes":[{"id":"count-index","cause":"count keys resources by position.","fix":"Switch to for_each keyed by name. This is the permanent fix.","confirm":""},{"id":"list-reordered","cause":"The list order changed.","fix":"With count, order is identity. Sort it, or move to for_each.","confirm":""},{"id":"migration-needed","cause":"Moving to for_each changes every address.","fix":"Use moved blocks so Terraform tracks the rename rather than recreating.","confirm":""},{"id":"acceptable","cause":"The resources are genuinely disposable.","fix":"count is fine for stateless identical resources.","confirm":""}],"verify":["The plan proposes only the intended change.","Addresses are stable when the list changes."],"escalate":["The plan showing replacements","Whether count or for_each is used","The addresses in state"]},{"id":"tf-remote-state-access","tier":"guide","technology":"Terraform","category":"State","title":"Cannot read another configuration's remote state","summary":"A terraform_remote_state data source fails, so downstream values are unavailable.","aliases":["remote state error","cannot read remote state","terraform_remote_state","outputs not found remote","state access denied"],"source":"https://developer.hashicorp.com/terraform/language/state/remote-state-data","inputs":[],"steps":[{"title":"Read the data source error","cmd":"terraform plan","risk":"safe","look":"Access denied, not found and no-outputs are three different problems.","signals":[{"match":"AccessDenied|403","means":"This configuration's credentials cannot read that state.","goto":"cause:no-read-access"},{"match":"NoSuchKey|does not exist","means":"The state file is not at that key.","goto":"cause:wrong-key"},{"match":"Unsupported attribute","means":"The state exists but does not export that output.","goto":"cause:output-missing"}]},{"title":"Check the key it is pointing at","cmd":"findstr /S /C:\"terraform_remote_state\" -A6 *.tf","risk":"safe","look":"Bucket, key and region must match the producing configuration exactly. A workspace suffix is easy to forget."},{"title":"Verify the state has the output","cmd":"terraform output -json","risk":"safe","look":"Run this in the producing configuration. Remote state only exposes declared outputs, not arbitrary resources."},{"title":"Check read permission on the backend","cmd":"aws s3 ls s3://<bucket>/<key>","risk":"safe","look":"Whether these credentials can read that object. Cross-account access needs an explicit grant."}],"causes":[{"id":"no-read-access","cause":"Credentials lack read access to the state object.","fix":"Grant s3:GetObject on that key. Read-only is enough.","confirm":""},{"id":"wrong-key","cause":"The key does not match.","fix":"Compare against the producing configuration's backend block, including any workspace prefix.","confirm":""},{"id":"output-missing","cause":"The value is not declared as an output.","fix":"Add it in the producing configuration and apply. Only outputs are exposed.","confirm":""},{"id":"stale-state","cause":"The producing configuration has not been applied.","fix":"Outputs are written at apply time.","confirm":""},{"id":"should-use-data-source","cause":"Reading state to get something the provider can look up.","fix":"Query the provider directly. It avoids the coupling entirely.","confirm":""}],"verify":["The data source resolves.","The expected values are available.","The coupling between configurations is deliberate."],"escalate":["The data source error","The key being read","Whether the output exists in the producing state"]},{"id":"tf-provider-plugin-error","tier":"guide","technology":"Terraform","category":"Providers","title":"Provider plugin fails to load or crashes","summary":"init or plan fails on the plugin itself rather than on your configuration.","aliases":["plugin crash","failed to load plugin","provider crashed","checksum mismatch","plugin not executable","registry error"],"source":"https://developer.hashicorp.com/terraform/cli/plugins","inputs":[],"steps":[{"title":"Read the plugin error","cmd":"terraform init","risk":"safe","look":"Checksum, download and crash errors point at different causes.","signals":[{"match":"checksum.*does not match|provider lock","means":"The lock file does not match the downloaded plugin.","goto":"cause:checksum"},{"match":"plugin crashed|panic","means":"The provider itself crashed.","goto":"cause:plugin-crash"},{"match":"could not query provider registry|connection","means":"The registry is unreachable.","goto":"cause:registry-unreachable"}]},{"title":"Check the plugin cache","cmd":"dir .terraform\\providers","risk":"safe","look":"A partially downloaded plugin causes confusing failures. Removing the directory forces a clean download."},{"title":"Check the lock file covers this platform","cmd":"type .terraform.lock.hcl | findstr /C:\"hashes\"","risk":"safe","look":"Hashes are per platform. A lock generated on Linux may not cover Windows, which fails in CI or vice versa."},{"title":"Clear the cache and reinitialise","cmd":"rmdir /s /q .terraform && terraform init","risk":"destructive","look":"init completes with providers freshly installed.","note":"Deletes the local plugin cache and backend configuration record, then re-downloads everything. State is not touched, but init will re-resolve the backend, so make sure you know which backend the configuration points at before running it. Requires network access."}],"causes":[{"id":"checksum","cause":"The lock file does not match the plugin.","fix":"terraform providers lock for all platforms your team uses.","confirm":""},{"id":"plugin-crash","cause":"The provider panicked.","fix":"Check the crash log. Usually a provider bug; upgrading often fixes it.","confirm":""},{"id":"registry-unreachable","cause":"No network path to the registry.","fix":"Check proxy settings. Terraform uses its own, not your shell's.","confirm":""},{"id":"platform-hashes","cause":"The lock lacks hashes for this OS.","fix":"terraform providers lock -platform=windows_amd64 -platform=linux_amd64.","confirm":""},{"id":"partial-download","cause":"The cache is corrupt.","fix":"Remove .terraform and init again.","confirm":""}],"verify":["init completes.","The lock file covers every platform in use.","plan runs without plugin errors."],"escalate":["The plugin error verbatim","Whether the lock covers this platform","Provider version in use"]}]</script>
<script>
"use strict";
const BANK=JSON.parse(document.getElementById("data").textContent);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plain=p=>String(p||"").replace(/^\(\?[imsx]+\)/,"").replace(/\\[sdwSDW]\+?/g," ")
  .replace(/[\^$]/g,"").replace(/\\/g,"").replace(/\.\*|\.\+|\?/g,"")
  .replace(/\(([^)]*)\)/g,"$1").replace(/\[[^\]]*\]/g,"").replace(/\{\d+,?\d*\}/g,"")
  .replace(/\|/g,"  /  ").replace(/\s{2,}/g,"  ").trim();

const CTX={}; let CUR=null;
const RISK={safe:["READ ONLY","c-safe"],state:["CHANGES STATE","c-state"],destructive:["DESTRUCTIVE","c-destructive"]};

const flat=s=>String(s??"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
function score(r,q){if(!q.trim())return 1;const Q=flat(q),T=flat(r.title),A=(r.aliases||[]).map(flat);
  let s=0; if(T.includes(Q))s+=100; if(A.some(a=>a.includes(Q)||Q.includes(a)))s+=80;
  const hay=[T,flat(r.summary),A.join(" "),flat(r.category)].join(" ");
  for(const t of Q.split(" ").filter(x=>x.length>1)){
    if(T.includes(t))s+=18; else if(A.some(a=>a.includes(t)))s+=14; else if(hay.includes(t))s+=4;}
  return s;}

function tree(){
  const q=$("#q").value;
  const hits=BANK.map(r=>({r,s:score(r,q)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  if(!hits.length){$("#nav").innerHTML='<div class="nohit">Nothing matched. Try the exact error text, or a plainer phrase.</div>';return;}
  const byT={};
  hits.forEach(({r})=>{if(!byT[r.technology])byT[r.technology]={};
    const c=r.category||"General"; if(!byT[r.technology][c])byT[r.technology][c]=[];
    byT[r.technology][c].push(r);});
  const searching=q.trim().length>0;
  $("#nav").innerHTML=Object.keys(byT).sort().map(t=>{
    const n=Object.values(byT[t]).reduce((a,b)=>a+b.length,0);
    const open=searching||(CUR&&CUR.technology===t);
    return '<div class="tgroup'+(open?" open":"")+'" data-t="'+esc(t)+'">'+
      '<button class="thead"><span class="car">'+(open?"\u25BE":"\u25B8")+'</span>'+esc(t)+
      '<span class="ct">'+n+'</span></button><div class="tbody">'+
      Object.keys(byT[t]).sort().map(c=>{
        const co=searching||(CUR&&CUR.technology===t&&CUR.category===c);
        return '<div class="cgroup'+(co?" open":"")+'" data-c="'+esc(c)+'">'+
          '<button class="chead"><span class="car">'+(co?"\u25BE":"\u25B8")+'</span>'+
          esc(c)+'<span class="ct">'+byT[t][c].length+'</span></button><div class="cbody">'+
          byT[t][c].map(r=>'<button class="item'+(CUR&&CUR.id===r.id?" sel":"")+'" data-id="'+
            esc(r.id)+'">'+esc(r.title)+'</button>').join("")+'</div></div>';}).join("")+
      '</div></div>';}).join("");
  document.querySelectorAll(".thead").forEach(b=>b.onclick=()=>{
    const g=b.closest(".tgroup"); g.classList.toggle("open");
    g.querySelector(".car").textContent=g.classList.contains("open")?"\u25BE":"\u25B8";});
  document.querySelectorAll(".chead").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const g=b.closest(".cgroup"); g.classList.toggle("open");
    g.querySelector(".car").textContent=g.classList.contains("open")?"\u25BE":"\u25B8";});
  document.querySelectorAll(".item").forEach(b=>b.onclick=()=>{
    open(b.dataset.id);document.body.classList.remove("nav");});
}

function fill(cmd,html){return cmd.replace(/\{([a-z0-9_]+)\}/g,(m,k)=>{const v=CTX[k];
  return !html?(v||m):(v?'<span class="fill">'+esc(v)+'</span>':'<span class="un">'+esc(m)+'</span>');});}
function repaint(){document.querySelectorAll("[data-cmd]").forEach(e=>e.innerHTML=fill(e.dataset.cmd,true));}
function fields(){
  $("#fields").innerHTML=((CUR&&CUR.inputs)||[]).map(i=>
    '<label>'+esc(i.label)+'<input data-k="'+esc(i.key)+'" placeholder="'+esc(i.example||"")+
    '" value="'+esc(CTX[i.key]||"")+'"></label>').join("");
  document.querySelectorAll("#fields input").forEach(x=>x.oninput=()=>{
    CTX[x.dataset.k]=x.value.trim();repaint();});
}

function open(id){
  CUR=BANK.find(r=>r.id===id); if(!CUR)return;
  (CUR.inputs||[]).forEach(i=>{if(!(i.key in CTX))CTX[i.key]="";});
  fields();
  $("#crumb").innerHTML=esc(CUR.technology)+' &nbsp;\u203A&nbsp; '+esc(CUR.category||"")+
    ' &nbsp;\u203A&nbsp; <b>'+esc(CUR.title)+'</b>';

  const steps=(CUR.steps||[]).map((s,i)=>{
    const R=RISK[s.risk]||RISK.safe, dz=s.risk==="destructive";
    const body=dz?'<div class="veil" data-rv="'+i+'">\u25B8 Command hidden. Read the warning, then tap to reveal.</div>'
      :'<pre data-cmd="'+esc(s.cmd)+'"></pre><button class="cp" data-cp="'+i+'">Copy</button>';
    const br=(s.signals||[]).length?'<div class="br"><div class="brh">WHAT YOU MIGHT SEE</div>'+
      s.signals.map(g=>{const t=g.goto||"";let nx="";
        if(t.indexOf("cause:")===0){const k=(CUR.causes||[]).findIndex(x=>x.id===t.slice(6));
          if(k>=0)nx='<span class="goto">\u2192 cause '+(k+1)+'</span>';}
        else if(t.indexOf("step:")===0)nx='<span class="goto">\u2192 step '+t.slice(5)+'</span>';
        return '<div class="brow"><div class="bif"><b>IF YOU SEE</b><code>'+esc(plain(g.match))+
          '</code></div><div class="bthen">'+esc(g.means)+' '+nx+'</div></div>';}).join("")+'</div>':"";
    return '<li class="step'+(dz?" d":"")+'" data-step="'+i+'"><div class="num">'+(i+1)+'</div>'+
      '<div class="sh"><span class="st">'+esc(s.title)+'</span><span class="chip '+R[1]+'">'+R[0]+'</span></div>'+
      (s.note?'<p class="note'+(s.risk==="state"?" s":"")+'">'+esc(s.note)+'</p>':"")+
      '<div class="cmd">'+body+'</div><p class="look">'+esc(s.look)+'</p>'+br+'</li>';}).join("");

  const cz=(CUR.causes||[]).map((c,i)=>'<div class="cz"><div class="rk">'+(i+1)+'</div><div>'+
    '<div class="w">'+esc(c.cause)+'</div><div class="fx"><b>Fix.</b> '+esc(c.fix)+'</div></div></div>').join("");

  $("#pane").innerHTML='<div class="rb"><h2>'+esc(CUR.title)+'</h2>'+
    '<p class="sum">'+esc(CUR.summary)+'</p>'+
    '<div class="tags">'+(CUR.aliases||[]).slice(0,7).map(a=>'<span class="tag">'+esc(a)+'</span>').join("")+'</div>'+
    '<p class="src">Commands vary by version and environment \u2014 read each one before you run it.'+
    (CUR.source?' <a href="'+esc(CUR.source)+'" target="_blank" rel="noopener">Official documentation \u2197</a>':"")+'</p>'+
    '<ol class="steps">'+steps+'</ol>'+
    (cz?'<div class="sec"><h3>LIKELY CAUSES \u2014 MOST COMMON FIRST</h3>'+cz+'</div>':"")+
    ((CUR.verify||[]).length?'<div class="sec"><h3>YOU ARE DONE WHEN</h3><ul class="pl">'+
      CUR.verify.map(v=>'<li>'+esc(fill(v,false))+'</li>').join("")+'</ul></div>':"")+
    ((CUR.escalate||[]).length?'<div class="sec"><h3>IF YOU HAND THIS OVER, INCLUDE</h3><ul class="pl">'+
      CUR.escalate.map(v=>'<li>'+esc(fill(v,false))+'</li>').join("")+'</ul></div>':"")+'</div>';
  window.scrollTo(0,0); repaint(); wire(); tree();
}

function wire(){
  document.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>{
    const t=fill(CUR.steps[+b.dataset.cp].cmd,false);
    navigator.clipboard.writeText(t).then(()=>{const e=$("#toast");e.textContent="Command copied";
      e.style.display="block";setTimeout(()=>e.style.display="none",1500);},()=>prompt("Copy:",t));});
  document.querySelectorAll("[data-rv]").forEach(v=>v.onclick=()=>{
    const i=+v.dataset.rv,s=CUR.steps[i];
    v.outerHTML='<pre data-cmd="'+esc(s.cmd)+'"></pre><button class="cp" data-cp="'+i+'">Copy</button>';
    repaint();wire();});
}

function home(){
  CUR=null; $("#fields").innerHTML=""; $("#crumb").innerHTML="";
  const T=[...new Set(BANK.map(r=>r.technology))].sort();
  const st=BANK.reduce((a,r)=>a+r.steps.length,0);
  const br=BANK.reduce((a,r)=>a+r.steps.reduce((b,s)=>b+(s.signals||[]).length,0),0);
  const cz=BANK.reduce((a,r)=>a+r.causes.length,0);
  $("#pane").innerHTML='<div class="hero"><h2>What is broken?</h2>'+
    '<p>Search the symptom, the error string, or what you were doing when it failed. Every runbook gives '+
    'the checks in order, what each output means, and where to go next.</p>'+
    '<div class="stats">'+
    '<div class="stat"><b>'+BANK.length+'</b><span>runbooks</span></div>'+
    '<div class="stat"><b>'+st+'</b><span>diagnostic steps</span></div>'+
    '<div class="stat"><b>'+br+'</b><span>decision branches</span></div>'+
    '<div class="stat"><b>'+cz+'</b><span>ranked causes</span></div>'+
    '<div class="stat"><b>'+T.length+'</b><span>technologies</span></div></div>'+
    '<div class="cards">'+T.map(t=>{const n=BANK.filter(r=>r.technology===t).length;
      const c=[...new Set(BANK.filter(r=>r.technology===t).map(r=>r.category))].length;
      return '<button class="card" data-tech="'+esc(t)+'"><h3>'+esc(t)+'</h3><p>'+n+
        ' runbooks across '+c+' categories</p></button>';}).join("")+'</div>'+
    '<p class="src" style="margin-top:30px">Runs entirely in this one file. Nothing is sent anywhere, '+
    'nothing is executed for you, and nothing is saved when you close the tab.</p></div>';
  document.querySelectorAll(".card").forEach(b=>b.onclick=()=>{
    const tech=b.dataset.tech;
    const g=[...document.querySelectorAll(".tgroup")].find(x=>x.dataset.t===tech);
    if(g){g.classList.add("open");g.querySelector(".car").textContent="\u25BE";
      const c=g.querySelector(".cgroup");
      if(c){c.classList.add("open");c.querySelector(".car").textContent="\u25BE";}
      g.scrollIntoView({block:"start",behavior:"smooth"});}
    document.body.classList.add("nav");
    const first=BANK.filter(r=>r.technology===tech)[0];
    if(first)open(first.id);});
  tree();
}

$("#q").oninput=tree;
$("#burger").onclick=()=>document.body.classList.toggle("nav");
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&document.activeElement!==$("#q")){e.preventDefault();$("#q").focus();$("#q").select();}
  if(e.key==="Escape"){if(CUR)home();else{$("#q").value="";tree();}}});
home();
</script>
</body>
</html>
