ion"}]},{"title":"Check metrics-server is healthy","cmd":"kubectl top pods -n {namespace}","risk":"safe","look":"If this errors, the HPA has the same problem. metrics-server is the dependency for all resource-based autoscaling."},{"title":"Check the pods declare requests","cmd":"kubectl get deploy -n {namespace} -o jsonpath='{.items[*].spec.template.spec.containers[*].resources.requests}'","risk":"safe","look":"CPU utilisation is a percentage of the request. With no request declared there is no denominator, so the HPA can never compute a target."}],"causes":[{"id":"no-metrics","cause":"metrics-server is absent or not serving.","fix":"Install or repair it. Check its pod logs for TLS errors against the kubelet, which is the usual failure.","confirm":""},{"id":"no-requests","cause":"Containers declare no CPU request.","fix":"Set one. Utilisation is meaningless without it and the HPA will show unknown forever.","confirm":""},{"id":"at-max","cause":"Already at maxReplicas.","fix":"Raise maxReplicas if capacity allows. Confirm nodes can actually take more pods first.","confirm":""},{"id":"stabilisation","cause":"The scale-down stabilisation window is holding it.","fix":"Expected behaviour preventing flapping. Tune behaviour.scaleDown if genuinely too slow.","confirm":""},{"id":"wrong-target","cause":"scaleTargetRef points at something that does not exist.","fix":"Check the name and kind match the real workload exactly.","confirm":""}],"verify":["TARGETS shows real percentages.","Replicas move under load and settle after.","Pods have requests declared."],"escalate":["kubectl get hpa output","HPA conditions and events","Whether kubectl top works","Container resource requests"]},{"id":"k8s-configmap-not-applied","tier":"guide","technology":"Kubernetes","category":"Configuration","title":"ConfigMap or Secret change is not picked up","summary":"You updated the config but the application still uses the old values.","aliases":["configmap not updating","secret not applied","config change no effect","still old config","env not updated","restart needed configmap"],"source":"https://kubernetes.io/docs/concepts/configuration/configmap/","inputs":[{"key":"configmap","label":"ConfigMap name","example":"app-config"},{"key":"namespace","label":"Namespace","example":"production"},{"key":"deploy","label":"Deployment","example":"checkout-api"}],"steps":[{"title":"Confirm the ConfigMap itself actually changed","cmd":"kubectl get configmap {configmap} -n {namespace} -o yaml","risk":"safe","look":"The values as stored. If they are old here, the apply never landed and nothing downstream matters."},{"title":"Check how the pod consumes it","cmd":"kubectl get deploy {deploy} -n {namespace} -o jsonpath='{.spec.template.spec.containers[*].envFrom}{\" | \"}{.spec.template.spec.volumes}'","risk":"safe","look":"envFrom and env never update in a running container, ever. Volume mounts do update, but on the kubelet's sync period rather than instantly.","signals":[{"match":"(?i)configMapRef|configMapKeyRef","means":"Consumed as environment variables. These are fixed at container start and will never refresh.","goto":"cause:env-immutable"},{"match":"(?i)configMap.*name","means":"Mounted as a volume. It refreshes, but not immediately.","goto":"cause:volume-delay"}]},{"title":"Check when the pod started relative to the change","cmd":"kubectl get pod -n {namespace} -l app={deploy} -o jsonpath='{.items[*].status.startTime}'","risk":"safe","look":"A pod older than the ConfigMap edit is still holding whatever existed at its start."},{"title":"Restart the workload to pick up the new values","cmd":"kubectl rollout restart deployment/{deploy} -n {namespace}","risk":"state","look":"New pods with fresh timestamps. Watch rollout status rather than assuming it worked.","note":"Replaces every pod in the deployment with a rolling update. Brief capacity reduction during the roll, and if the new config is wrong the new pods will fail. Confirm the ConfigMap contents are correct before restarting rather than after."}],"causes":[{"id":"env-immutable","cause":"Consumed as environment variables, which are set once at container start.","fix":"Restart the workload. To make this automatic, hash the config into a pod annotation so any change triggers a roll.","confirm":""},{"id":"volume-delay","cause":"Mounted as a volume, which refreshes on the kubelet sync period.","fix":"Wait about a minute, or restart. subPath mounts never refresh at all, which surprises people.","confirm":""},{"id":"subpath","cause":"Mounted with subPath.","fix":"subPath mounts are a point-in-time copy and do not update. Mount the directory instead.","confirm":""},{"id":"not-applied","cause":"The change never reached the cluster.","fix":"Check you applied to the right namespace and context.","confirm":""},{"id":"app-caches","cause":"The application read the config once at startup.","fix":"Restarting is the only option unless the app watches the file itself.","confirm":""}],"verify":["The running pod shows the new values.","The application behaves according to the new config.","The mechanism for future updates is understood."],"escalate":["The ConfigMap as stored","How the deployment consumes it","Pod start time versus the change time"]},{"id":"k8s-statefulset-stuck","tier":"guide","technology":"Kubernetes","category":"Workloads","title":"StatefulSet will not progress past a pod","summary":"Ordered rollout blocks on one replica and nothing after it starts.","aliases":["statefulset stuck","sts not progressing","ordinal stuck","statefulset rollout","pod-0 pending","stateful pod not starting"],"source":"https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/","inputs":[{"key":"sts","label":"StatefulSet","example":"postgres"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"See which ordinal is blocking","cmd":"kubectl get pods -n {namespace} -l app={sts} --sort-by=.metadata.name","risk":"safe","look":"StatefulSets proceed strictly in order. The lowest-numbered unhealthy pod is the only one that matters; everything above it is simply waiting.","signals":[{"match":"Pending","means":"The blocking pod cannot be scheduled, very often because its PVC has not bound.","goto":"cause:pvc"},{"match":"CrashLoopBackOff","means":"The blocking pod starts and dies.","goto":"cause:app-failure"}]},{"title":"Check its volume claim","cmd":"kubectl get pvc -n {namespace} -l app={sts}","risk":"safe","look":"Each ordinal gets its own PVC. A single unbound claim halts the whole set, and this is the most common cause."},{"title":"Read the update strategy","cmd":"kubectl get sts {sts} -n {namespace} -o jsonpath='{.spec.updateStrategy}'","risk":"safe","look":"OnDelete means the controller will never replace pods by itself and you must delete them manually. A partition value means updates deliberately stop at that ordinal."},{"title":"Check whether pod management is the constraint","cmd":"kubectl get sts {sts} -n {namespace} -o jsonpath='{.spec.podManagementPolicy}'","risk":"safe","look":"OrderedReady is the default and enforces the strict sequence. Parallel lets pods start independently, which suits some workloads and not others."}],"causes":[{"id":"pvc","cause":"The blocking pod's PVC has not bound.","fix":"Follow the PVC Pending runbook. The StatefulSet is behaving correctly by waiting.","confirm":""},{"id":"app-failure","cause":"The application in that ordinal fails to start.","fix":"Treat it as a CrashLoop. Often ordinal zero is a cluster seed and its failure is different from the others.","confirm":""},{"id":"ondelete","cause":"updateStrategy is OnDelete.","fix":"Delete the pods yourself in order. The controller will not do it.","confirm":""},{"id":"partition","cause":"A partition is set on the rolling update.","fix":"Lower the partition value to allow more ordinals to update.","confirm":""},{"id":"quorum","cause":"A clustered application cannot reach quorum.","fix":"Check the app's own cluster state. Kubernetes sees healthy processes that refuse to serve.","confirm":""}],"verify":["All ordinals are Running and Ready in sequence.","Each has a bound PVC.","The application reports a healthy cluster."],"escalate":["Pod list in ordinal order","PVC state per ordinal","Update strategy and pod management policy"]},{"id":"k8s-networkpolicy-blocking","tier":"guide","technology":"Kubernetes","category":"Network & NetworkPolicy","title":"Traffic blocked between pods after a NetworkPolicy","summary":"Connections that used to work now time out. Policies are deny-by-default once any policy selects a pod.","aliases":["networkpolicy blocking","pod cannot reach pod","traffic blocked","netpol","connection timeout after policy","deny all"],"source":"https://kubernetes.io/docs/concepts/services-networking/network-policies/","inputs":[{"key":"namespace","label":"Namespace","example":"production"},{"key":"pod","label":"Pod name","example":"checkout-api-7d9f6b8c5-x4k2m"}],"steps":[{"title":"List policies affecting this namespace","cmd":"kubectl get networkpolicy -n {namespace}","risk":"safe","look":"Any policy at all changes the model for the pods it selects. Before the first policy everything is allowed; after it, only what is explicitly permitted.","signals":[{"match":"(?i)default-deny|deny-all","means":"A default-deny policy exists. Every allowed flow must now be stated explicitly.","goto":"cause:default-deny"}]},{"title":"Find which policies select this pod","cmd":"kubectl describe networkpolicy -n {namespace}","risk":"safe","look":"The podSelector on each policy against your pod's labels. A policy with an empty podSelector selects every pod in the namespace."},{"title":"Check the pod's own labels","cmd":"kubectl get pod {pod} -n {namespace} --show-labels","risk":"safe","look":"Whether the pod is selected by a policy and whether it matches any allow rule's peer selector. Both directions must permit the flow."},{"title":"Verify whether DNS is also blocked","cmd":"kubectl exec {pod} -n {namespace} -- getent hosts kubernetes.default","risk":"safe","look":"Egress policies frequently forget port 53, which makes everything look like a DNS outage when it is actually the policy.","signals":[{"match":"^\\s*$","means":"DNS is blocked too. The egress policy is missing a rule for port 53.","goto":"cause:dns-blocked"}]}],"causes":[{"id":"default-deny","cause":"A default-deny policy applies and no rule permits this flow.","fix":"Add an explicit allow for it. Policies are additive, so a new permissive policy is safer than editing the deny.","confirm":""},{"id":"dns-blocked","cause":"Egress policy omits DNS.","fix":"Allow UDP and TCP 53 to kube-system. Almost every egress policy needs this and almost every first attempt forgets it.","confirm":""},{"id":"both-directions","cause":"Egress is allowed on the client but ingress is not allowed on the server.","fix":"Both ends must permit the flow. Check the policies selecting each side.","confirm":""},{"id":"namespace-selector","cause":"namespaceSelector matches on labels the target namespace does not carry.","fix":"Label the namespace. Namespaces have no useful labels by default.","confirm":""},{"id":"no-cni-support","cause":"The CNI plugin does not enforce NetworkPolicy.","fix":"Flannel ignores them entirely, so policies appear to apply and do nothing. Confirm your CNI supports them.","confirm":""}],"verify":["The intended connection succeeds.","DNS still resolves from inside the pod.","Unintended flows remain blocked."],"escalate":["All policies in the namespace","Labels on both pods","Whether DNS works from the client pod"]},{"id":"k8s-init-container-stuck","tier":"guide","technology":"Kubernetes","category":"Pods & Containers","title":"Pod stuck in Init or PodInitializing","summary":"An init container has not completed, so the main container never starts.","aliases":["init stuck","podinitializing","init:0/1","init container failing","init crashloop","waiting for init"],"source":"https://kubernetes.io/docs/concepts/workloads/pods/init-containers/","inputs":[{"key":"pod","label":"Pod","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"See which init container is blocking","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.status.initContainerStatuses[*].name}{\"|\"}{.status.initContainerStatuses[*].state}'","risk":"safe","look":"Init containers run strictly in order. Only the first incomplete one matters; everything after it has not started.","signals":[{"match":"(?i)CrashLoopBackOff","means":"The init container runs and fails repeatedly.","goto":"cause:init-failing"},{"match":"(?i)waiting.*PodInitializing","means":"It is still running, not failed. It may be waiting on something.","goto":"cause:init-waiting"}]},{"title":"Read that init container's logs","cmd":"kubectl logs {pod} -n {namespace} -c <init-container-name>","risk":"safe","look":"Init containers are frequently wait loops for a database or a migration. The log usually says exactly what it is waiting for."},{"title":"Check what it is waiting on is actually reachable","cmd":"kubectl get endpointslices -n {namespace}","risk":"safe","look":"A wait-for-dependency init container blocks forever if the dependency never becomes ready, which looks like the pod being stuck."},{"title":"Check init containers have their own resources","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.initContainers[*].resources}'","risk":"safe","look":"Init containers are scheduled with the pod. An init container requesting more than the node has keeps the whole pod Pending."}],"causes":[{"id":"init-failing","cause":"The init container exits non-zero.","fix":"Read its logs. The pod will never start until it exits zero.","confirm":""},{"id":"init-waiting","cause":"It is waiting on an unavailable dependency.","fix":"Make the dependency ready. Add a timeout so it fails loudly rather than hanging forever.","confirm":""},{"id":"migration-lock","cause":"A database migration init container is blocked on a lock.","fix":"Find the holder. Concurrent replicas running the same migration cause this.","confirm":""},{"id":"wrong-order","cause":"Init containers are in the wrong order.","fix":"They run sequentially in declaration order. Reorder them.","confirm":""}],"verify":["The pod moves past Init and the main container starts.","Init containers complete in a few seconds, not minutes."],"escalate":["Init container statuses","Logs from the blocking init container","Whether its dependency is ready"]},{"id":"k8s-job-not-completing","tier":"guide","technology":"Kubernetes","category":"Workloads","title":"Job or CronJob never completes","summary":"The Job stays active, retries forever, or the CronJob never fires at all.","aliases":["job not completing","cronjob not running","job stuck","backofflimitexceeded","job failed","cronjob missed schedule"],"source":"https://kubernetes.io/docs/concepts/workloads/controllers/job/","inputs":[{"key":"job","label":"Job or CronJob","example":"nightly-report"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the Job's status","cmd":"kubectl get job {job} -n {namespace} -o jsonpath='{.status}'","risk":"safe","look":"Active, succeeded and failed counts with any condition. BackoffLimitExceeded means it gave up after repeated failures.","signals":[{"match":"(?i)BackoffLimitExceeded","means":"It retried up to the limit and failed every time.","goto":"cause:pod-failing"},{"match":"(?i)DeadlineExceeded","means":"It exceeded activeDeadlineSeconds and was killed.","goto":"cause:deadline"}]},{"title":"Read logs from the failed pods","cmd":"kubectl logs -n {namespace} -l job-name={job} --tail=60","risk":"safe","look":"The actual failure. Job pods are retained after failure specifically so you can read this."},{"title":"For a CronJob, check schedule and last run","cmd":"kubectl get cronjob {job} -n {namespace} -o jsonpath='{.spec.schedule}{\"|\"}{.status.lastScheduleTime}{\"|\"}{.spec.suspend}'","risk":"safe","look":"suspend true means it will never fire. The schedule is evaluated in the controller's timezone, which is UTC unless configured otherwise.","signals":[{"match":"\\|true$","means":"The CronJob is suspended.","goto":"cause:suspended"}]},{"title":"Check for concurrency blocking a new run","cmd":"kubectl get jobs -n {namespace} -l cronjob-name={job}","risk":"safe","look":"With concurrencyPolicy Forbid, a run still active blocks the next one. A hung job silently stops all future runs."}],"causes":[{"id":"pod-failing","cause":"The job's pod fails every attempt.","fix":"Fix the command. Raise backoffLimit only once the failure is understood.","confirm":""},{"id":"deadline","cause":"activeDeadlineSeconds was exceeded.","fix":"Raise it, or make the job faster. The deadline counts total time, not per attempt.","confirm":""},{"id":"suspended","cause":"The CronJob is suspended.","fix":"Set suspend to false. Often left on after an incident and forgotten.","confirm":""},{"id":"timezone","cause":"The schedule is in UTC, not local time.","fix":"Set spec.timeZone, or express the schedule in UTC deliberately.","confirm":""},{"id":"concurrency","cause":"A previous run is still active.","fix":"Find and clear it. Consider Replace rather than Forbid.","confirm":""},{"id":"no-restart-never","cause":"restartPolicy is not Never or OnFailure.","fix":"Job pods must use one of those two. Always is rejected.","confirm":""}],"verify":["The Job reports succeeded.","A CronJob fires on schedule.","Failed runs are visible rather than silent."],"escalate":["Job status block","Logs from the failing pod","CronJob schedule, suspend flag and last schedule time"]},{"id":"k8s-terminating-stuck","tier":"guide","technology":"Kubernetes","category":"Pods & Containers","title":"Pod stuck Terminating forever","summary":"Deletion was requested but the pod never goes. Usually a finalizer or an unresponsive node.","aliases":["stuck terminating","pod wont delete","terminating forever","finalizer","cannot delete pod","pod hangs on delete"],"source":"https://kubernetes.io/docs/concepts/overview/working-with-objects/finalizers/","inputs":[{"key":"pod","label":"Pod","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Check for finalizers and the grace period","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.metadata.finalizers}{\"|\"}{.spec.terminationGracePeriodSeconds}'","risk":"safe","look":"A finalizer means something must run before deletion completes. A long grace period means it may simply need more time.","signals":[{"match":"\\[.+\\]\\|","means":"A finalizer is present and its controller has not released it.","goto":"cause:finalizer"},{"match":"\\|\\d{3,}","means":"The grace period is very long. It may be working as configured.","goto":"cause:long-grace"}]},{"title":"Check whether the node is healthy","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.nodeName}' && kubectl get nodes","risk":"safe","look":"If the node is NotReady, the kubelet cannot confirm deletion. Pods on a dead node stay Terminating indefinitely by design.","signals":[{"match":"(?i)NotReady","means":"The node is unreachable, so deletion can never be confirmed.","goto":"cause:node-down"}]},{"title":"Check whether the process ignores SIGTERM","cmd":"kubectl describe pod {pod} -n {namespace} | findstr /C:\"Killing\"","risk":"safe","look":"A process ignoring SIGTERM runs until the grace period expires and is then SIGKILLed. That is slow but not stuck."},{"title":"Remove the finalizer to force deletion","cmd":"kubectl patch pod {pod} -n {namespace} -p '{\"metadata\":{\"finalizers\":null}}'","risk":"destructive","look":"The pod disappears. Check for orphaned resources on the cloud side afterwards.","note":"Removes the finalizer without letting its controller do the cleanup it was waiting to perform. That cleanup may include detaching a volume or deregistering from a load balancer, and skipping it can leave orphaned cloud resources or a volume that cannot attach elsewhere. Understand which controller owns the finalizer before doing this."}],"causes":[{"id":"finalizer","cause":"A controller's finalizer has not been released.","fix":"Find that controller and fix it. Removing the finalizer skips its cleanup.","confirm":""},{"id":"node-down","cause":"The node is unreachable.","fix":"The pod clears when the node returns, or when it is deleted from the cluster. Force deletion risks two copies running.","confirm":""},{"id":"long-grace","cause":"The grace period is genuinely long.","fix":"Wait. Or shorten terminationGracePeriodSeconds if the value is not justified.","confirm":""},{"id":"ignores-sigterm","cause":"The process does not handle SIGTERM.","fix":"Handle it in the application. PID 1 in a container does not get default signal handling.","confirm":""},{"id":"volume-detach","cause":"A volume cannot detach.","fix":"Check the CSI driver. This is common with cloud block storage under load.","confirm":""}],"verify":["The pod is gone.","No orphaned volume or load balancer registration remains.","The root cause was addressed, not just forced past."],"escalate":["Finalizers on the pod","Node status","Which controller owns the finalizer"]},{"id":"k8s-resource-quota-exceeded","tier":"guide","technology":"Kubernetes","category":"Configuration","title":"Cannot create pods: exceeded quota","summary":"The namespace has hit a ResourceQuota, so new workloads are refused at admission.","aliases":["exceeded quota","resourcequota","forbidden quota","limitrange","cannot create pod quota","quota exceeded namespace"],"source":"https://kubernetes.io/docs/concepts/policy/resource-quotas/","inputs":[{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the quota and current usage","cmd":"kubectl describe resourcequota -n {namespace}","risk":"safe","look":"Used against Hard for each resource. The one at its limit is named in the rejection message.","signals":[{"match":"(?i)requests\\.cpu|requests\\.memory","means":"A compute quota is exhausted.","goto":"cause:compute-quota"},{"match":"(?i)pods\\s","means":"The pod count limit is reached.","goto":"cause:pod-count"},{"match":"(?i)persistentvolumeclaims","means":"The PVC count limit is reached.","goto":"cause:pvc-quota"}]},{"title":"Check whether a LimitRange forces defaults","cmd":"kubectl describe limitrange -n {namespace}","risk":"safe","look":"A LimitRange injects default requests into pods that declare none. Those defaults count against the quota and are often larger than expected."},{"title":"Find what is consuming the quota","cmd":"kubectl get pods -n {namespace} -o custom-columns=NAME:.metadata.name,CPU:.spec.containers[*].resources.requests.cpu,MEM:.spec.containers[*].resources.requests.memory","risk":"safe","look":"Requests per pod. Completed Job pods still count until they are cleaned up, which surprises people."},{"title":"Clear completed pods holding quota","cmd":"kubectl delete pod -n {namespace} --field-selector status.phase=Succeeded","risk":"state","look":"The quota's Used figure drops. Recheck with describe resourcequota.","note":"Deletes every succeeded pod in the namespace, which also removes their logs. If anyone needs those logs for an audit or a debugging session, collect them first. Running pods are not affected."}],"causes":[{"id":"compute-quota","cause":"CPU or memory requests are exhausted.","fix":"Raise the quota, or lower requests on existing workloads. Requests count, not usage.","confirm":""},{"id":"pod-count","cause":"The pod count limit is reached.","fix":"Clean up completed pods, or raise the limit.","confirm":""},{"id":"pvc-quota","cause":"The PVC count or storage limit is reached.","fix":"Remove unused claims, or raise the quota.","confirm":""},{"id":"limitrange-default","cause":"LimitRange defaults are larger than the workload needs.","fix":"Declare explicit requests so the default does not apply.","confirm":""},{"id":"no-requests","cause":"The quota requires requests and the pod declares none.","fix":"With a compute quota, every pod must declare requests. Add them or add a LimitRange.","confirm":""}],"verify":["New pods are admitted.","Used sits comfortably below Hard.","Requests reflect real needs rather than defaults."],"escalate":["describe resourcequota output","Any LimitRange in the namespace","Requests across existing pods"]},{"id":"k8s-apiserver-unreachable","tier":"guide","technology":"Kubernetes","category":"Access & RBAC","title":"kubectl cannot reach the cluster","summary":"Connection refused or timeout before any authentication happens.","aliases":["cannot connect to cluster","connection refused kubectl","unable to connect to the server","kubeconfig","no such host kubectl","i/o timeout apiserver"],"source":"https://kubernetes.io/docs/tasks/access-application-cluster/configure-access-multiple-clusters/","inputs":[],"steps":[{"title":"Read the exact connection error","cmd":"kubectl cluster-info","risk":"safe","look":"Refused, timeout and no-such-host are three different problems. The wording tells you which.","signals":[{"match":"(?i)no such host|could not resolve","means":"DNS cannot resolve the API server name.","goto":"cause:dns"},{"match":"(?i)connection refused","means":"Reached the host, nothing listening on the port.","goto":"cause:not-listening"},{"match":"(?i)i/o timeout","means":"No response at all, usually a firewall or missing VPN.","goto":"cause:firewall"},{"match":"(?i)x509|certificate","means":"TLS problem with the cluster certificate.","goto":"cause:cert"}]},{"title":"Check which context is active","cmd":"kubectl config current-context && kubectl config view --minify","risk":"safe","look":"The server URL in use. A stale context pointing at a deleted cluster produces exactly this and is very common with multiple clusters."},{"title":"Test the endpoint directly","cmd":"curl -k -sS -i https://<server-from-above>/version | findstr HTTP","risk":"safe","look":"A 401 or 403 is good news: the server is reachable and the problem is credentials. No response at all is network."},{"title":"Check the VPN or bastion requirement","cmd":"ipconfig | findstr /C:\"VPN\" ","risk":"safe","look":"Private clusters are only reachable over VPN or through a bastion. This is the most common cause of a sudden timeout that worked yesterday."}],"causes":[{"id":"dns","cause":"The API server name does not resolve.","fix":"Check the URL in the kubeconfig. Private clusters often resolve only over VPN.","confirm":""},{"id":"not-listening","cause":"Nothing is listening on that port.","fix":"Check the cluster exists and the endpoint is right. A deleted cluster leaves a working kubeconfig.","confirm":""},{"id":"firewall","cause":"Traffic is blocked.","fix":"Connect the VPN, or add your IP to the authorised networks list.","confirm":""},{"id":"cert","cause":"TLS verification fails against the cluster certificate.","fix":"Refresh the kubeconfig from the provider. Certificates rotate.","confirm":""},{"id":"expired-token","cause":"The credential expired.","fix":"Re-authenticate. Cloud kubeconfigs use short-lived tokens fetched by an exec plugin.","confirm":""},{"id":"wrong-context","cause":"The active context points elsewhere.","fix":"kubectl config use-context with the right name.","confirm":""}],"verify":["kubectl get nodes returns.","The active context is the intended cluster.","It works from a fresh shell."],"escalate":["The exact connection error","Active context and server URL","Whether the endpoint responds to curl"]},{"id":"k8s-probe-failing","tier":"guide","technology":"Kubernetes","category":"Pods & Containers","title":"Readiness or liveness probe keeps failing","summary":"The container runs but the probe says otherwise, so it is removed from service or restarted.","aliases":["readiness probe failed","liveness probe failed","probe failing","0/1 ready","unhealthy probe","connection refused probe"],"source":"https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/","inputs":[{"key":"pod","label":"Pod","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the probe failure events","cmd":"kubectl describe pod {pod} -n {namespace} | findstr /C:\"probe\"","risk":"safe","look":"Which probe and what it reported. Liveness failures restart the container; readiness failures only remove it from endpoints.","signals":[{"match":"(?i)connection refused","means":"Nothing is listening on the probe port.","goto":"cause:not-listening"},{"match":"(?i)HTTP probe failed with statuscode: 404","means":"The probe path does not exist.","goto":"cause:wrong-path"},{"match":"(?i)statuscode: 5","means":"The endpoint exists and reports an error.","goto":"cause:app-unhealthy"},{"match":"(?i)timeout|context deadline","means":"The endpoint is too slow for timeoutSeconds.","goto":"cause:too-slow"}]},{"title":"Read the probe configuration","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].readinessProbe}{\"|\"}{.spec.containers[*].livenessProbe}'","risk":"safe","look":"Path, port, initialDelaySeconds, timeoutSeconds and thresholds. A timeout of one second against an endpoint that touches a database is a recipe for flapping."},{"title":"Call the probe endpoint from inside the pod","cmd":"kubectl exec {pod} -n {namespace} -- wget -qO- http://localhost:<port><path>","risk":"safe","look":"What the kubelet would see. Working here but failing as a probe usually means the port or path in the spec is wrong."},{"title":"Check whether it needs a startup probe instead","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].startupProbe}'","risk":"safe","look":"A slow-starting app killed by liveness during boot should use a startupProbe. Inflating the liveness delay to compensate weakens it for the whole lifetime."}],"causes":[{"id":"not-listening","cause":"Nothing listens on the probe port.","fix":"Check the port matches and the app binds 0.0.0.0 rather than localhost.","confirm":""},{"id":"wrong-path","cause":"The probe path returns 404.","fix":"Point it at a real endpoint. A trailing slash can matter.","confirm":""},{"id":"app-unhealthy","cause":"The endpoint reports an error.","fix":"The probe is correct. Fix the application.","confirm":""},{"id":"too-slow","cause":"The endpoint is slower than timeoutSeconds.","fix":"Raise the timeout, or make the health check lightweight. It should not query the database.","confirm":""},{"id":"slow-start","cause":"The app needs longer to boot than initialDelaySeconds.","fix":"Use a startupProbe. That is exactly what it exists for.","confirm":""},{"id":"liveness-too-strict","cause":"Liveness restarts a container that is merely busy.","fix":"Liveness should detect deadlock, not load. Most services need only readiness.","confirm":""}],"verify":["The container reports Ready and stays Ready.","No probe failure events during normal load.","Liveness is not restarting a healthy container."],"escalate":["Probe failure events","The probe configuration","Result of calling the endpoint from inside the pod"]},{"id":"k8s-pvc-cannot-mount","tier":"guide","technology":"Kubernetes","category":"Storage","title":"Volume bound but pod cannot mount it","summary":"The PVC is Bound yet the pod fails with a mount or attach error.","aliases":["failedmount","unable to attach or mount","volume attach failed","multi-attach error","mount timeout","cannot mount volume"],"source":"https://kubernetes.io/docs/concepts/storage/persistent-volumes/","inputs":[{"key":"pod","label":"Pod","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the mount failure event","cmd":"kubectl describe pod {pod} -n {namespace} | findstr /C:\"FailedMount\" /C:\"FailedAttach\" -A3","risk":"safe","look":"The message names the volume and the reason. Multi-Attach, timeout and permission are three different fixes.","signals":[{"match":"(?i)Multi-Attach error","means":"The volume is still attached to another node.","goto":"cause:multi-attach"},{"match":"(?i)timed out waiting for the condition","means":"The attach never completed, usually a CSI driver problem.","goto":"cause:csi-stuck"},{"match":"(?i)permission denied","means":"Mounted, but the container's user cannot write to it.","goto":"cause:fsgroup"}]},{"title":"Find where the volume is currently attached","cmd":"kubectl get volumeattachment | findstr <pv-name>","risk":"safe","look":"Which node holds it. A ReadWriteOnce volume can only attach to one node at a time, which is the cause of every Multi-Attach error."},{"title":"Check the CSI driver pods are healthy","cmd":"kubectl get pods -n kube-system | findstr csi","risk":"safe","look":"The driver's node plugin must be running on the target node. A crashed node plugin makes every mount on that node hang."},{"title":"Check the access mode against the workload","cmd":"kubectl get pvc -n {namespace} -o jsonpath='{.items[*].spec.accessModes}'","risk":"safe","look":"ReadWriteOnce with a multi-replica Deployment is a guaranteed Multi-Attach failure during any rolling update."}],"causes":[{"id":"multi-attach","cause":"A ReadWriteOnce volume is attached elsewhere.","fix":"Ensure the old pod is fully gone. Use Recreate rather than RollingUpdate for single-writer volumes.","confirm":""},{"id":"csi-stuck","cause":"The CSI driver cannot complete the attach.","fix":"Check the driver's node plugin logs on the target node.","confirm":""},{"id":"fsgroup","cause":"The container user cannot write to the mount.","fix":"Set fsGroup in the pod security context so the volume is chowned on mount.","confirm":""},{"id":"node-limit","cause":"The node has reached its volume attachment limit.","fix":"Cloud providers cap attachments per instance. Spread the pods or use larger nodes.","confirm":""},{"id":"zone-mismatch","cause":"The volume is in a different zone than the node.","fix":"Use a topology-aware StorageClass with WaitForFirstConsumer.","confirm":""}],"verify":["The pod mounts and starts.","No FailedMount events remain.","The access mode matches how the workload actually runs."],"escalate":["The FailedMount message","Which node holds the volume attachment","CSI driver pod status on the target node"]},{"id":"k8s-wrong-container-logs","tier":"guide","technology":"Kubernetes","category":"Observability","title":"kubectl logs returns nothing or the wrong thing","summary":"You cannot see the output you need, so you are debugging blind.","aliases":["logs empty kubectl","no logs pod","choose a container","previous terminated container","logs not found","cannot read logs"],"source":"https://kubernetes.io/docs/reference/generated/kubectl/kubectl-commands#logs","inputs":[{"key":"pod","label":"Pod","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"List every container in the pod","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].name}{\" init: \"}{.spec.initContainers[*].name}'","risk":"safe","look":"A multi-container pod requires -c. Without it kubectl picks the first container, which in a service mesh is often the sidecar rather than your app.","signals":[{"match":"istio-proxy|linkerd-proxy|envoy","means":"A service mesh sidecar is present. The default container may be the proxy.","goto":"cause:sidecar-default"}]},{"title":"Read the previous instance for a restarting container","cmd":"kubectl logs {pod} -n {namespace} --previous --tail=100","risk":"safe","look":"For a crash loop, the current container has barely started. The previous one holds the failure."},{"title":"Check the container has started at all","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.status.containerStatuses[*].state}'","risk":"safe","look":"A container in Waiting has produced no logs because it has not run. That is not a logging problem."},{"title":"Check for a log rotation or collector taking them","cmd":"kubectl logs {pod} -n {namespace} --timestamps --tail=5","risk":"safe","look":"Timestamps reveal whether output is recent. The kubelet rotates container logs and only the current file is available through kubectl."}],"causes":[{"id":"multi-container","cause":"The pod has several containers.","fix":"Use -c with the container name. --all-containers works for a quick look.","confirm":""},{"id":"sidecar-default","cause":"The default container is a mesh sidecar.","fix":"Name your app container explicitly, or set the default-container annotation on the pod.","confirm":""},{"id":"not-started","cause":"The container has not run.","fix":"Nothing to read. Follow the Init or CrashLoop runbook.","confirm":""},{"id":"rotated","cause":"The kubelet rotated the log file.","fix":"Only the current file is available. Ship logs to a collector if you need history.","confirm":""},{"id":"writes-to-file","cause":"The app writes to a file inside the container.","fix":"Only stdout and stderr reach kubectl logs. Reconfigure the app.","confirm":""}],"verify":["You can read the output you need.","For a crash loop you have the previous container's logs.","The right container is being read."],"escalate":["Container names in the pod","Whether the container has started","Whether the app logs to stdout"]},{"id":"linux-disk-full","tier":"guide","technology":"Linux","category":"Storage","title":"Filesystem is full","summary":"Writes fail with no space left. Find what is consuming it before deleting anything.","aliases":["no space left","disk full","filesystem full","cannot write","df full","100% used"],"source":"https://man7.org/linux/man-pages/man1/du.1.html","inputs":[{"key":"path","label":"Filesystem or path","example":"/"}],"steps":[{"title":"See which filesystem is actually full","cmd":"df -h","risk":"safe","look":"The Use% column, and note the mount point. A full /var is a very different problem from a full /home.","signals":[{"match":"100%","means":"That filesystem is completely full.","goto":"step:2"},{"match":"(?i)/dev/loop|overlay","means":"Container or snap storage, not the host's own data.","goto":"cause:container-storage"}]},{"title":"Check inodes, because df can lie","cmd":"df -i","risk":"safe","look":"Space free but IUse% at 100 means inode exhaustion. The error is identical but the fix is completely different."},{"title":"Find the largest directories","cmd":"du -xh {path} --max-depth=2 2>/dev/null | sort -rh | head -20","risk":"safe","look":"The -x keeps it on one filesystem so you are not misled by other mounts. Work downward from the largest entry."},{"title":"Find space held by deleted but still-open files","cmd":"lsof +L1 2>/dev/null | head -20","risk":"safe","look":"A deleted file held open by a running process still occupies disk. This explains the case where du shows far less than df.","signals":[{"match":"(?i)deleted","means":"Space is held by a deleted file still open. Restarting that process releases it.","goto":"cause:deleted-open"}]}],"causes":[{"id":"logs","cause":"Log files grew without rotation.","fix":"Truncate with : > file rather than deleting, so the open handle stays valid. Then fix logrotate.","confirm":""},{"id":"deleted-open","cause":"A process holds a deleted file open.","fix":"Restart that process. No amount of deleting will reclaim the space otherwise.","confirm":""},{"id":"inodes","cause":"Inodes exhausted by many small files.","fix":"Find the directory with the most entries and clear it. Often a session or cache directory.","confirm":""},{"id":"container-storage","cause":"Container images and layers.","fix":"Prune the container runtime's storage, with a time filter rather than wholesale.","confirm":""}],"verify":["df shows meaningful free space.","The write that was failing now succeeds.","Rotation or cleanup is configured so it does not recur."],"escalate":["df -h and df -i output","The top entries from du","Whether any deleted files are still held open"]},{"id":"linux-port-in-use","tier":"guide","technology":"Linux","category":"Networking","title":"Address already in use","summary":"A service will not start because something already holds its port.","aliases":["address already in use","port in use","bind failed","cannot bind","eaddrinuse","port already bound"],"source":"https://man7.org/linux/man-pages/man8/ss.8.html","inputs":[{"key":"port","label":"Port","example":"8080"}],"steps":[{"title":"Find what is listening","cmd":"sudo ss -tlnp 'sport = :{port}'","risk":"safe","look":"The process name and PID in the last column. Without sudo you will not see the owner for another user's process.","signals":[{"match":"users:\\(\\(","means":"A process holds it. The name and PID are in the parentheses.","goto":"cause:other-process"},{"match":"^\\s*$","means":"Nothing is listening, so the failure is something else.","goto":"step:3"}]},{"title":"Check whether it is bound on a different interface","cmd":"sudo ss -tlnp | grep :{port}","risk":"safe","look":"0.0.0.0 versus 127.0.0.1 versus a specific IP. Two processes can bind the same port on different addresses, which looks contradictory until you see this."},{"title":"Check for a socket stuck in TIME_WAIT","cmd":"ss -tan | grep :{port} | head","risk":"safe","look":"TIME_WAIT entries without a listener mean the old socket has not been released. SO_REUSEADDR in the application is the correct fix, not waiting."},{"title":"Stop the process holding the port","cmd":"sudo kill <pid>","risk":"destructive","look":"Re-run ss to confirm the port is free before starting your service.","note":"Terminates the process. If it is a production service, its clients drop immediately. Confirm what the PID actually is with ps before running this, and prefer the service manager's stop command so it shuts down cleanly."}],"causes":[{"id":"other-process","cause":"Another process is bound to the port.","fix":"Stop it through its service manager, or configure your service to use a different port.","confirm":""},{"id":"time-wait","cause":"An old socket has not been released.","fix":"Enable SO_REUSEADDR in the application. Waiting works but is not a fix.","confirm":""},{"id":"interface-conflict","cause":"Bound to a specific address that overlaps your wildcard bind.","fix":"Bind to a specific address instead of 0.0.0.0.","confirm":""},{"id":"systemd-socket","cause":"A systemd socket unit holds the port.","fix":"Stop the .socket unit, not just the .service.","confirm":""}],"verify":["The service starts and is listening.","ss shows it as the owner of the port."],"escalate":["ss -tlnp output for the port","What the holding process is","Whether it is managed by systemd"]},{"id":"linux-service-fails","tier":"guide","technology":"Linux","category":"systemd","title":"systemd service will not start","summary":"systemctl start fails or the unit restarts in a loop. The journal has the real reason.","aliases":["service failed","systemctl start failed","unit failed","job failed see systemctl status","service wont start","activating auto-restart"],"source":"https://man7.org/linux/man-pages/man1/systemctl.1.html","inputs":[{"key":"unit","label":"Unit name","example":"checkout-api.service"}],"steps":[{"title":"Read the unit's current state and last lines","cmd":"systemctl status {unit} --no-pager -l","risk":"safe","look":"The Active line and the exit status. 'code=exited status=N' is the application's own exit code and the most useful number on the screen.","signals":[{"match":"(?i)status=203/EXEC","means":"systemd could not execute the binary. Wrong path, or not executable.","goto":"cause:bad-exec"},{"match":"(?i)status=200/CHDIR","means":"WorkingDirectory does not exist.","goto":"cause:bad-workdir"},{"match":"(?i)status=217/USER","means":"The configured User does not exist.","goto":"cause:bad-user"},{"match":"(?i)Result: timeout","means":"It started but never signalled readiness in time.","goto":"cause:type-mismatch"}]},{"title":"Read the journal for this unit's last start","cmd":"journalctl -u {unit} -n 80 --no-pager","risk":"safe","look":"The application's own output. systemctl status truncates; this does not."},{"title":"Validate the unit file itself","cmd":"systemd-analyze verify /etc/systemd/system/{unit}","risk":"safe","look":"Syntax problems and unresolvable references that status will never mention."},{"title":"Reload systemd after editing a unit","cmd":"sudo systemctl daemon-reload","risk":"state","look":"No output means success. Start the unit again afterwards.","note":"Re-reads all unit files. Running services are not restarted and nothing is interrupted, but forgetting this after an edit means systemd keeps using the old definition and your change appears to do nothing."}],"causes":[{"id":"bad-exec","cause":"ExecStart points at something that cannot be executed.","fix":"Use an absolute path and check the execute bit. systemd does not use your shell's PATH.","confirm":""},{"id":"bad-user","cause":"The User directive names an account that does not exist.","fix":"Create the user or correct the name.","confirm":""},{"id":"bad-workdir","cause":"WorkingDirectory does not exist.","fix":"Create it, or remove the directive.","confirm":""},{"id":"type-mismatch","cause":"Type=notify or forking, but the process does not behave that way.","fix":"Use Type=simple for a process that stays in the foreground. This mismatch causes start timeouts constantly.","confirm":""},{"id":"stale-unit","cause":"The unit file was edited without a daemon-reload.","fix":"Run systemctl daemon-reload after every unit file change.","confirm":""}],"verify":["systemctl status shows active and running.","It survives a reboot if it is enabled.","The journal shows a clean startup."],"escalate":["Full systemctl status output","journalctl for the last start attempt","The unit file contents"]},{"id":"linux-high-load","tier":"guide","technology":"Linux","category":"Performance","title":"Load average is high and the box feels slow","summary":"High load can mean CPU, disk wait or thread explosion. They look identical at first and need different fixes.","aliases":["high load","load average","server slow","cpu high","system unresponsive","load spike"],"source":"https://man7.org/linux/man-pages/man1/top.1.html","inputs":[],"steps":[{"title":"Separate CPU from I/O wait","cmd":"top -bn1 | head -5","risk":"safe","look":"The %Cpu line. High us means real computation; high wa means processes blocked on disk; high sy means kernel overhead, often context switching.","signals":[{"match":"(?i)wa[,\\s]*[1-9]\\d\\.","means":"Significant I/O wait. The disk, not the CPU, is the bottleneck.","goto":"cause:io-wait"},{"match":"(?i)st[,\\s]*[1-9]","means":"Steal time. The hypervisor is taking cycles; this is a noisy-neighbour problem.","goto":"cause:steal"}]},{"title":"Compare load against core count","cmd":"uptime && nproc","risk":"safe","look":"Load equal to core count is fully busy, not broken. Load at several times the core count is where queuing hurts."},{"title":"Find the top consumers","cmd":"ps -eo pid,ppid,pcpu,pmem,etime,comm --sort=-pcpu | head -15","risk":"safe","look":"The elapsed time column matters as much as the CPU column. A process at 100% for three seconds is normal; for three hours it is not."},{"title":"Check whether processes are blocked rather than running","cmd":"ps -eo state,pid,comm | grep '^D' | head","risk":"safe","look":"State D is uninterruptible sleep, almost always disk or NFS. Load counts these, which is why a box can show high load with idle CPUs."}],"causes":[{"id":"io-wait","cause":"Processes are blocked on disk.","fix":"Find the process doing the I/O. The CPU is not the constraint and adding cores will not help.","confirm":""},{"id":"runaway-process","cause":"One process is consuming the CPU.","fix":"Identify it from the elapsed time. Restart or throttle it depending on what it is.","confirm":""},{"id":"thread-explosion","cause":"A large number of threads or processes.","fix":"Check the thread count. An unbounded worker pool is a common cause.","confirm":""},{"id":"steal","cause":"The hypervisor is taking CPU time.","fix":"This is not fixable from inside the guest. Raise it with the platform owner.","confirm":""},{"id":"normal","cause":"Load is roughly equal to core count under real work.","fix":"Nothing is wrong. Measure response time rather than load average.","confirm":""}],"verify":["Load is proportional to core count under normal work.","Response times are acceptable.","The specific contributor was identified, not just observed."],"escalate":["top header lines","Load average with nproc","Top processes by CPU with elapsed time"]},{"id":"linux-ssh-denied","tier":"guide","technology":"Linux","category":"Access","title":"SSH permission denied (publickey)","summary":"The server rejected your key. Verbose output names the exact reason.","aliases":["permission denied publickey","ssh denied","cannot ssh","key rejected","authentication failed ssh","too open private key"],"source":"https://man7.org/linux/man-pages/man8/sshd.8.html","inputs":[{"key":"host","label":"Host","example":"bastion.example.com"},{"key":"user","label":"User","example":"ubuntu"}],"steps":[{"title":"Run with verbose output and read which keys were offered","cmd":"ssh -vvv {user}@{host} 2>&1 | findstr /C:\"Offering\" /C:\"Authentications\" /C:\"debug1: Next\"","risk":"safe","look":"Which keys the client offered and which methods the server accepts. If your key was never offered, the problem is local, not on the server.","signals":[{"match":"(?i)Offering public key","means":"The key was offered and rejected. The problem is server-side authorization.","goto":"cause:not-authorized"},{"match":"(?i)no such identity","means":"The key file does not exist at the path the client expects.","goto":"cause:missing-key"},{"match":"(?i)bad permissions|too open","means":"The private key is readable by others, so ssh refuses to use it.","goto":"cause:key-permissions"}]},{"title":"Check local key permissions","cmd":"ls -l ~/.ssh/","risk":"safe","look":"The private key must be 600 and the directory 700. ssh silently refuses keys that are more permissive."},{"title":"Confirm which key the client will use for this host","cmd":"ssh -G {host} | findstr identityfile","risk":"safe","look":"The resolved config. A ~/.ssh/config entry may be pointing at a different key than you assume."},{"title":"Check the server side if you have another way in","cmd":"sudo tail -30 /var/log/auth.log","risk":"safe","look":"sshd states the precise reason, including permission problems on the remote authorized_keys file, which the client can never see."}],"causes":[{"id":"not-authorized","cause":"The public key is not in the remote authorized_keys.","fix":"Add it. Confirm you copied the .pub file, not the private key.","confirm":""},{"id":"key-permissions","cause":"Local private key permissions are too open.","fix":"chmod 600 on the key and 700 on ~/.ssh.","confirm":""},{"id":"remote-permissions","cause":"The remote ~/.ssh or authorized_keys is group-writable.","fix":"chmod 700 ~/.ssh and 600 authorized_keys on the server. sshd refuses them otherwise and logs the reason.","confirm":""},{"id":"missing-key","cause":"The key file is not where the client looks.","fix":"Point at it with -i, or add an IdentityFile entry to ~/.ssh/config.","confirm":""},{"id":"wrong-user","cause":"Correct key, wrong username.","fix":"Cloud images each have their own default user. ubuntu, ec2-user and admin are not interchangeable.","confirm":""}],"verify":["SSH connects without a password prompt.","It works from a fresh shell, not only with an explicit -i flag."],"escalate":["ssh -vvv output around the authentication attempt","Local key permissions","auth.log from the server if reachable"]},{"id":"linux-oom-killer","tier":"guide","technology":"Linux","category":"Memory","title":"Process was killed by the OOM killer","summary":"A process vanished with no error. The kernel killed it to reclaim memory.","aliases":["oom killer","process killed","out of memory kernel","killed process","oom-kill","process disappeared"],"source":"https://man7.org/linux/man-pages/man5/proc.5.html","inputs":[{"key":"process","label":"Process name","example":"java"}],"steps":[{"title":"Confirm the kernel did it","cmd":"sudo dmesg -T | grep -i -E 'killed process|oom' | tail -10","risk":"safe","look":"The timestamp, the process name and its RSS at the moment of death. This is definitive; without it you are only guessing.","signals":[{"match":"(?i)Killed process","means":"Confirmed. The kernel chose this process as the victim.","goto":"cause:host-oom"},{"match":"(?i)memory cgroup out of memory","means":"A cgroup limit, not the whole host. Only that container or unit was constrained.","goto":"cause:cgroup-limit"}]},{"title":"See the current memory picture","cmd":"free -h","risk":"safe","look":"available, not free. Linux uses free memory for cache by design, so a low free number is normal and not a problem."},{"title":"Find the current biggest consumers","cmd":"ps -eo pid,rss,comm --sort=-rss | head -10","risk":"safe","look":"RSS in kilobytes. Compare the top entry against total memory to see whether one process dominates."},{"title":"Check what the kernel would kill next","cmd":"for p in $(pgrep {process}); do echo \"$p $(cat /proc/$p/oom_score)\"; done","risk":"safe","look":"Higher score means more likely to be chosen. Useful for predicting the next victim before it happens."}],"causes":[{"id":"host-oom","cause":"The host ran out of memory.","fix":"Reduce the workload, add memory, or set limits so one process cannot take everything.","confirm":""},{"id":"cgroup-limit","cause":"A container or systemd unit hit its own limit.","fix":"Raise MemoryMax or the container limit, having measured the real requirement first.","confirm":""},{"id":"no-swap","cause":"No swap, so there is no buffer before the killer runs.","fix":"A small swap file gives the kernel room to reclaim before killing. Not a substitute for enough RAM.","confirm":""},{"id":"leak","cause":"Memory grows without bound.","fix":"Profile the process. The OOM killer is a symptom, not the problem.","confirm":""}],"verify":["The process stays running through a full workload cycle.","free shows headroom in available.","A limit exists so one process cannot take the whole host."],"escalate":["The dmesg OOM lines verbatim","free -h output","RSS of the top processes"]},{"id":"linux-cron-not-running","tier":"guide","technology":"Linux","category":"Scheduling","title":"Cron job never runs","summary":"The entry is in the crontab but nothing happens. Almost always environment or the schedule itself.","aliases":["cron not running","crontab not working","cron job not executing","scheduled job missing","cron silent","job did not run"],"source":"https://man7.org/linux/man-pages/man5/crontab.5.html","inputs":[{"key":"user","label":"Crontab owner","example":"deploy"},{"key":"job","label":"Command","example":"/opt/app/backup.sh"}],"steps":[{"title":"Confirm cron attempted to run it","cmd":"sudo grep CRON /var/log/syslog | tail -20","risk":"safe","look":"A line for your job means cron fired and the problem is in the script. No line at all means cron never scheduled it.","signals":[{"match":"(?i)CMD \\(","means":"Cron ran it. The failure is inside the command.","goto":"cause:script-fails"},{"match":"^\\s*$","means":"Cron never fired it.","goto":"step:2"},{"match":"(?i)No MTA installed","means":"It ran and produced output cron could not mail. The output is being lost.","goto":"cause:output-lost"}]},{"title":"Check the entry is in the crontab you think","cmd":"sudo crontab -l -u {user} && cat /etc/crontab","risk":"safe","look":"User crontabs and /etc/crontab are separate. The system file has an extra user field; the user crontab does not, and putting a user field in a user crontab breaks the line silently."},{"title":"Check the schedule expression is what you intend","cmd":"echo 'Read the five fields: minute hour day-of-month month day-of-week'","risk":"safe","look":"Setting both day-of-month and day-of-week means OR, not AND, which surprises almost everyone. A job set for the 1st and Monday runs on both."},{"title":"Run the command in cron's own environment","cmd":"sudo -u {user} env -i /bin/sh -c \"{job}\"","risk":"safe","look":"env -i strips the environment the way cron does. A script that works in your shell and fails here has a PATH problem, which is the single most common cause."}],"causes":[{"id":"script-fails","cause":"Cron ran it and it failed.","fix":"Redirect output to a file in the crontab line so the failure is visible.","confirm":""},{"id":"path","cause":"Cron's PATH is minimal.","fix":"Use absolute paths for every binary, or set PATH at the top of the crontab.","confirm":""},{"id":"output-lost","cause":"Output goes to mail and there is no mail transfer agent.","fix":"Append >> /var/log/myjob.log 2>&1 to the crontab line.","confirm":""},{"id":"percent-sign","cause":"An unescaped % in the command.","fix":"In crontab, % means newline. Escape it as \\% — date format strings hit this constantly.","confirm":""},{"id":"no-newline","cause":"The crontab file has no trailing newline.","fix":"The last line is ignored without one. Always edit with crontab -e.","confirm":""},{"id":"wrong-crontab","cause":"Entry is in a different crontab than the one running.","fix":"Check both the user crontab and /etc/cron.d.","confirm":""}],"verify":["The job appears in syslog at the expected time.","Its output lands in a log file.","It works from a clean environment, not just your shell."],"escalate":["Syslog CRON lines for the job","The crontab entry verbatim","Result of running under env -i"]},{"id":"linux-too-many-open-files","tier":"guide","technology":"Linux","category":"Limits","title":"Too many open files","summary":"A process hits its file descriptor limit. Sockets count as files, so busy servers hit this without touching disk.","aliases":["too many open files","emfile","file descriptor limit","ulimit","cannot open socket","fd limit reached"],"source":"https://man7.org/linux/man-pages/man5/limits.conf.5.html","inputs":[{"key":"pid","label":"Process ID","example":"1234"}],"steps":[{"title":"Read the limit the running process actually has","cmd":"cat /proc/{pid}/limits | grep -i 'open files'","risk":"safe","look":"The running process's real limit, which is what matters. Your shell's ulimit is irrelevant to a process started by systemd."},{"title":"Count how many it currently holds","cmd":"ls /proc/{pid}/fd | wc -l","risk":"safe","look":"Compare against the soft limit. Close to it under normal load means the limit is too low; growing steadily means a leak."},{"title":"See what kind of descriptors they are","cmd":"ls -l /proc/{pid}/fd | awk '{print $NF}' | sort | uniq -c | sort -rn | head","risk":"safe","look":"Mostly sockets points at connection handling. Many copies of one file points at a leak in the code.","signals":[{"match":"(?i)socket","means":"Sockets dominate. Connection churn or unclosed connections.","goto":"cause:socket-leak"},{"match":"(?i)deleted","means":"Deleted files still held open. Also consuming disk.","goto":"cause:fd-leak"}]},{"title":"Check the system-wide ceiling too","cmd":"sysctl fs.file-nr fs.file-max","risk":"safe","look":"The first number in file-nr is allocated across the whole system. Near file-max means a host-wide limit rather than a per-process one."}],"causes":[{"id":"limit-too-low","cause":"The per-process limit is below what the workload needs.","fix":"Raise LimitNOFILE in the systemd unit. limits.conf does not apply to systemd services, which catches people out.","confirm":""},{"id":"socket-leak","cause":"Connections are not being closed.","fix":"Check for missing close calls or an unbounded connection pool.","confirm":""},{"id":"fd-leak","cause":"The process opens files and never closes them.","fix":"Deleted-but-open entries are a strong signal. Fix the code; raising the limit only delays it.","confirm":""},{"id":"system-wide","cause":"The host-wide maximum is reached.","fix":"Raise fs.file-max, and find which process is consuming them.","confirm":""},{"id":"wrong-place","cause":"The limit was set in the wrong file.","fix":"For systemd services use LimitNOFILE in the unit. For login shells use limits.conf.","confirm":""}],"verify":["The process runs without hitting the limit under normal load.","The descriptor count is stable rather than growing.","The limit is set where the service actually reads it."],"escalate":["Contents of /proc/PID/limits","Current descriptor count and types","System-wide file-nr and file-max"]},{"id":"linux-time-drift","tier":"guide","technology":"Linux","category":"Time","title":"System clock is wrong or drifting","summary":"Certificate errors, token rejections and confusing log ordering all trace back to clock skew.","aliases":["clock skew","time wrong","ntp not syncing","certificate not yet valid","time drift","chrony not working"],"source":"https://man7.org/linux/man-pages/man1/timedatectl.1.html","inputs":[],"steps":[{"title":"Check the sync status","cmd":"timedatectl status","risk":"safe","look":"System clock synchronized and the NTP service state. Both must be yes and active; either one alone is not enough.","signals":[{"match":"(?i)synchronized: no","means":"Not synchronised. The service is not working.","goto":"cause:not-syncing"},{"match":"(?i)NTP service: inactive","means":"No time daemon is running at all.","goto":"cause:no-daemon"},{"match":"(?i)RTC in local TZ: yes","means":"Hardware clock in local time, which causes drift on dual-boot machines.","goto":"cause:rtc-local"}]},{"title":"Check how far off it actually is","cmd":"chronyc tracking 2>/dev/null || ntpq -p 2>/dev/null || timedatectl show","risk":"safe","look":"System time offset in seconds. Kerberos and many token systems reject anything beyond about five minutes."},{"title":"Check the daemon can reach its sources","cmd":"chronyc sources -v 2>/dev/null || ntpq -pn","risk":"safe","look":"A caret and asterisk marks the selected source. All sources unreachable means egress to UDP 123 is blocked."},{"title":"Force an immediate step correction","cmd":"sudo chronyc makestep","risk":"state","look":"chronyc tracking shows the offset near zero afterwards.","note":"Jumps the clock rather than slewing it gradually. A backward jump can confuse applications that assume time only moves forward, and databases in particular dislike it. Prefer letting chrony slew unless the offset is too large to correct that way."}],"causes":[{"id":"no-daemon","cause":"No time synchronisation service is running.","fix":"Install and enable chrony. Do not run two time daemons together.","confirm":""},{"id":"not-syncing","cause":"The daemon runs but cannot sync.","fix":"Check the sources. UDP 123 egress is often blocked by default in cloud security groups.","confirm":""},{"id":"blocked-egress","cause":"NTP traffic cannot leave the host.","fix":"Allow UDP 123, or point at an internal NTP server.","confirm":""},{"id":"rtc-local","cause":"The hardware clock is in local time.","fix":"Set it to UTC. Dual-boot machines with Windows commonly get this wrong.","confirm":""},{"id":"vm-pause","cause":"The VM was suspended and resumed.","fix":"The guest agent normally corrects this. Check it is installed and running.","confirm":""}],"verify":["timedatectl reports synchronised.","The offset is small and stable.","Certificate and token errors have stopped."],"escalate":["Output of timedatectl status","Tracking offset","Whether NTP sources are reachable"]},{"id":"linux-package-lock","tier":"guide","technology":"Linux","category":"Packages","title":"Could not get lock on the package manager","summary":"apt or yum refuses to run because another process holds the lock.","aliases":["could not get lock","dpkg lock","apt lock","yum lock","another process is using","unattended-upgrades lock"],"source":"https://manpages.debian.org/stable/apt/apt.8.en.html","inputs":[],"steps":[{"title":"Find which process holds the lock","cmd":"sudo lsof /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock 2>/dev/null","risk":"safe","look":"The process name and PID. unattended-upgrades appearing here is normal on a freshly booted machine and will finish on its own.","signals":[{"match":"(?i)unattended|apt\\.system","means":"Automatic updates are running. Wait rather than intervene.","goto":"cause:unattended"},{"match":"(?i)apt|dpkg","means":"Another apt session. Possibly your own in a different terminal.","goto":"cause:other-session"},{"match":"^\\s*$","means":"Nothing holds it. The lock is stale.","goto":"cause:stale-lock"}]},{"title":"Check whether automatic updates are active","cmd":"systemctl is-active unattended-upgrades apt-daily.service","risk":"safe","look":"Active means waiting is correct. This typically clears within a few minutes of boot."},{"title":"Check whether dpkg was interrupted","cmd":"sudo dpkg --audit","risk":"safe","look":"Packages left half-configured by an interrupted run. These must be resolved before anything else will work."},{"title":"Repair an interrupted installation","cmd":"sudo dpkg --configure -a","risk":"state","look":"No output means all packages are consistent. Retry the original command afterwards.","note":"Finishes configuring every half-installed package. Services belonging to those packages may restart as part of it, so on a production host do this in a maintenance window. It does not remove anything."}],"causes":[{"id":"unattended","cause":"Automatic updates hold the lock.","fix":"Wait. Killing it mid-transaction leaves the package database inconsistent.","confirm":""},{"id":"other-session","cause":"Another apt session is open.","fix":"Finish or close it. Check other terminals and any running automation.","confirm":""},{"id":"stale-lock","cause":"The lock file remains after a killed process.","fix":"Only after confirming nothing holds it, remove the lock files and run dpkg --configure -a.","confirm":""},{"id":"interrupted-dpkg","cause":"A previous run was interrupted.","fix":"dpkg --configure -a repairs it. Nothing else will proceed until this is done.","confirm":""},{"id":"cloud-init","cause":"cloud-init is still running on a new instance.","fix":"Wait for it to finish. It installs packages during first boot.","confirm":""}],"verify":["The package command completes.","dpkg --audit reports nothing.","No transaction was killed mid-way."],"escalate":["Which process held the lock","Output of dpkg --audit","Whether automatic updates were running"]},{"id":"linux-sudo-failing","tier":"guide","technology":"Linux","category":"Access","title":"sudo fails or asks for an unexpected password","summary":"Privilege escalation is refused, or a script that expects passwordless sudo hangs waiting for input.","aliases":["sudo password required","user is not in the sudoers file","sudo not working","permission denied sudo","sudo hangs","nopasswd"],"source":"https://man7.org/linux/man-pages/man5/sudoers.5.html","inputs":[{"key":"user","label":"User","example":"deploy"}],"steps":[{"title":"Check what the user is permitted to do","cmd":"sudo -l -U {user}","risk":"safe","look":"The exact rules that apply. NOPASSWD must appear for the specific command if automation is to run unattended.","signals":[{"match":"(?i)not allowed to run sudo","means":"No sudo rule applies to this user at all.","goto":"cause:not-in-sudoers"},{"match":"(?i)NOPASSWD","means":"Passwordless is configured. Check it covers the command you are running.","goto":"cause:command-not-covered"},{"match":"(?i)\\(ALL\\) ALL","means":"Full sudo, but a password is required.","goto":"cause:password-required"}]},{"title":"Check group membership","cmd":"id {user}","risk":"safe","look":"sudo or wheel in the group list, depending on the distribution. A group added during the current session does not apply until a new login."},{"title":"Validate the sudoers configuration parses","cmd":"sudo visudo -c","risk":"safe","look":"A syntax error anywhere in sudoers or sudoers.d can disable sudo entirely, which is why visudo exists."},{"title":"Check the drop-in files, which override the main file","cmd":"sudo ls -la /etc/sudoers.d/","risk":"safe","look":"Later files override earlier ones. A file with the wrong permissions or a dot in its name is ignored silently, which is a very common cause."}],"causes":[{"id":"not-in-sudoers","cause":"The user has no sudo rule.","fix":"Add them to the sudo or wheel group, or create a drop-in file. Always edit with visudo.","confirm":""},{"id":"group-not-applied","cause":"Group membership was added during the current session.","fix":"Log out and back in. Group membership is fixed at login.","confirm":""},{"id":"password-required","cause":"A password is required and automation cannot supply one.","fix":"Add a NOPASSWD rule scoped to the specific commands, never to ALL.","confirm":""},{"id":"command-not-covered","cause":"NOPASSWD covers different commands.","fix":"The path must match exactly, including arguments if specified.","confirm":""},{"id":"dropin-ignored","cause":"A sudoers.d file is ignored.","fix":"It must be mode 0440 and its name must contain no dot or tilde. sudo says nothing when it skips a file.","confirm":""},{"id":"syntax-error","cause":"sudoers has a syntax error.","fix":"visudo -c names the line. If sudo is already broken you need root or single-user mode.","confirm":""}],"verify":["sudo -l shows the intended permissions.","The command runs without an unexpected prompt.","visudo -c reports no errors."],"escalate":["Output of sudo -l -U","Group membership from id","Listing of /etc/sudoers.d with permissions"]},{"id":"linux-cert-expired","tier":"guide","technology":"Linux","category":"TLS","title":"Certificate verification failed","summary":"TLS connections fail. Expiry, an untrusted issuer and a hostname mismatch all look similar at first.","aliases":["certificate verify failed","x509","certificate expired","unable to get local issuer","ssl error","self signed certificate"],"source":"https://www.openssl.org/docs/man3.0/man1/openssl-s_client.html","inputs":[{"key":"host","label":"Host","example":"api.internal.example.com"},{"key":"port","label":"Port","example":"443"}],"steps":[{"title":"Read the certificate the server presents","cmd":"openssl s_client -connect {host}:{port} -servername {host} < /dev/null 2>/dev/null | openssl x509 -noout -dates -subject -issuer","risk":"safe","look":"notAfter, the subject and the issuer. These three answer expiry, hostname and trust in one command.","signals":[{"match":"(?i)notAfter","means":"Compare the date against now. An expired certificate is the simplest case.","goto":"cause:expired"},{"match":"(?i)self.signed|self-signed","means":"Self-signed, so no public CA vouches for it.","goto":"cause:self-signed"}]},{"title":"Read the verification result specifically","cmd":"openssl s_client -connect {host}:{port} -servername {host} < /dev/null 2>&1 | grep -i 'verify'","risk":"safe","look":"The verify return code and its text. Code 10 is expired, 18 is self-signed, 20 is an unobtainable issuer, and each has a different fix.","signals":[{"match":"(?i)verify error:num=10","means":"Expired.","goto":"cause:expired"},{"match":"(?i)verify error:num=(18|19)","means":"Self-signed or a self-signed root in the chain.","goto":"cause:self-signed"},{"match":"(?i)verify error:num=20|unable to get local issuer","means":"The chain is incomplete or the CA is not trusted.","goto":"cause:incomplete-chain"}]},{"title":"Check the hostname matches the certificate","cmd":"openssl s_client -connect {host}:{port} -servername {host} < /dev/null 2>/dev/null | openssl x509 -noout -text | grep -A2 'Subject Alternative Name'","risk":"safe","look":"The name you connect to must appear in the SAN list. The Common Name is no longer used by modern clients at all."},{"title":"Check the host's own trust store is current","cmd":"ls -la /etc/ssl/certs/ca-certificates.crt","risk":"safe","look":"An old container image can carry a trust store predating a CA change, which makes a perfectly valid certificate fail."}],"causes":[{"id":"expired","cause":"The certificate has expired.","fix":"Renew it. If renewal is automated, find out why it stopped rather than only renewing by hand.","confirm":""},{"id":"incomplete-chain","cause":"The server does not send intermediates.","fix":"Configure the full chain. Browsers often fetch missing intermediates; command-line clients do not, which is why it works in a browser and fails in a script.","confirm":""},{"id":"self-signed","cause":"Self-signed or issued by a private CA.","fix":"Add the CA to the trust store. Never disable verification to make it pass.","confirm":""},{"id":"hostname-mismatch","cause":"The name is not in the SAN list.","fix":"Reissue with the correct names. CN alone is ignored by modern clients.","confirm":""},{"id":"stale-trust-store","cause":"The client's CA bundle is out of date.","fix":"Update ca-certificates. Old base images are the usual cause.","confirm":""},{"id":"clock-wrong","cause":"The host clock is wrong, so a valid certificate appears not yet valid.","fix":"Follow the time drift runbook.","confirm":""}],"verify":["openssl reports verify return code 0.","The application connects without disabling verification.","Renewal is automated with monitoring on expiry."],"escalate":["Certificate dates, subject and issuer","The verify error number","Whether the SAN list covers the hostname"]},{"id":"linux-cannot-write-readonly","tier":"guide","technology":"Linux","category":"Storage","title":"Read-only file system","summary":"Writes fail even as root. The filesystem was remounted read-only, usually to protect it.","aliases":["read-only file system","cannot write readonly","remount read only","filesystem readonly","ro filesystem","cannot touch"],"source":"https://man7.org/linux/man-pages/man8/mount.8.html","inputs":[{"key":"path","label":"Path","example":"/var"}],"steps":[{"title":"Confirm the mount is read-only","cmd":"mount | grep -E ' on {path} | on / '","risk":"safe","look":"The (ro flag in the options. Present means read-only, and something caused that.","signals":[{"match":"\\(ro","means":"Mounted read-only.","goto":"step:2"}]},{"title":"Check whether the kernel remounted it after an error","cmd":"sudo dmesg -T | grep -i -E 'remount|read-only|EXT4-fs error|I/O error' | tail -15","risk":"safe","look":"The kernel remounts read-only after filesystem errors to prevent further damage. That is a hardware or corruption signal, not a configuration one.","signals":[{"match":"(?i)EXT4-fs error|I/O error","means":"Filesystem or disk errors forced the remount. Do not simply remount it writable.","goto":"cause:fs-error"},{"match":"(?i)remounting.*read-only","means":"The kernel deliberately protected the filesystem.","goto":"cause:fs-error"}]},{"title":"Check whether fstab declares it read-only","cmd":"grep {path} /etc/fstab","risk":"safe","look":"An ro option in fstab means it was mounted this way intentionally, which is entirely different from an error-driven remount."},{"title":"Check the disk's own health","cmd":"sudo smartctl -H /dev/sda 2>/dev/null || echo 'smartctl not installed'","risk":"safe","look":"Failing hardware behind a read-only remount means the priority is getting data off, not fixing the mount."}],"causes":[{"id":"fs-error","cause":"The kernel remounted after filesystem errors.","fix":"Do not force it writable. Take a backup, then run fsck from a live environment or rescue boot.","confirm":""},{"id":"intentional-ro","cause":"fstab declares it read-only.","fix":"Someone chose this. Find out why before changing it.","confirm":""},{"id":"disk-failing","cause":"The underlying disk is failing.","fix":"Recover data first. A writable remount on failing hardware makes things worse.","confirm":""},{"id":"container-rootfs","cause":"A container's root filesystem is read-only by design.","fix":"Mount a writable volume where writes are needed. Keep the rootfs read-only.","confirm":""},{"id":"full-then-ro","cause":"The filesystem filled and then errored.","fix":"Follow the disk-full runbook after fsck.","confirm":""}],"verify":["Writes succeed.","dmesg shows no new filesystem errors.","If it was an error, the cause was found rather than bypassed."],"escalate":["The mount line with its options","Relevant dmesg lines","fstab entry and disk health"]},{"id":"linux-process-wont-die","tier":"guide","technology":"Linux","category":"Processes","title":"Process will not terminate","summary":"kill has no effect. The process is in an uninterruptible state or being restarted.","aliases":["process wont die","cannot kill process","kill -9 not working","zombie process","defunct","uninterruptible sleep"],"source":"https://man7.org/linux/man-pages/man1/kill.1.html","inputs":[{"key":"pid","label":"PID","example":"1234"}],"steps":[{"title":"Check the process state","cmd":"ps -o pid,ppid,state,wchan:20,comm -p {pid}","risk":"safe","look":"State D means uninterruptible sleep and no signal will reach it. State Z means it is already dead and only the exit status remains.","signals":[{"match":"\\sD\\s","means":"Uninterruptible sleep, usually blocked on I/O. Signals are queued, not delivered.","goto":"cause:uninterruptible"},{"match":"\\sZ\\s","means":"A zombie. Already dead; the parent has not reaped it.","goto":"cause:zombie"}]},{"title":"Find what it is blocked on","cmd":"cat /proc/{pid}/stack 2>/dev/null; cat /proc/{pid}/wchan; echo","risk":"safe","look":"The kernel function it is waiting in. NFS and failing block devices are the classic causes of a permanent D state."},{"title":"Check whether a supervisor restarts it","cmd":"systemctl status {pid} 2>/dev/null || ps -o ppid= -p {pid}","risk":"safe","look":"If systemd or another supervisor owns it, killing the process just makes it come back. Stop the unit instead."},{"title":"Stop it through its supervisor","cmd":"sudo systemctl stop <unit>","risk":"state","look":"ps shows the process gone and not replaced by a new PID.","note":"Stops the service cleanly and prevents the automatic restart. The service is unavailable until started again, so on a production host arrange cover first. This is the correct approach; killing a supervised PID only triggers a restart."}],"causes":[{"id":"uninterruptible","cause":"The process is in D state on blocked I/O.","fix":"Signals cannot reach it. Fix the I/O: a hung NFS mount or a failing disk. It exits once the I/O completes or errors.","confirm":""},{"id":"zombie","cause":"It is already dead.","fix":"Zombies consume only a process table entry. Fix or restart the parent, which is failing to reap children.","confirm":""},{"id":"supervised","cause":"A supervisor restarts it.","fix":"Stop the unit rather than the process.","confirm":""},{"id":"nfs-hang","cause":"Blocked on an unreachable NFS server.","fix":"Restore the server, or force-unmount. This is the most common cause of permanent D state.","confirm":""},{"id":"kernel-thread","cause":"It is a kernel thread.","fix":"Kernel threads cannot be killed. Names in square brackets in ps are kernel threads.","confirm":""}],"verify":["The process is gone and does not return.","Whatever blocked it was resolved.","No new zombies accumulate."],"escalate":["Process state and wchan","What it is blocked on","Whether a supervisor owns it"]},{"id":"linux-hostname-resolution","tier":"guide","technology":"Linux","category":"Networking","title":"Hostname does not resolve on this machine","summary":"Name lookups fail locally even though the network is fine.","aliases":["cannot resolve hostname","name or service not known","dns not working linux","resolv.conf","getaddrinfo failed","temporary failure in name resolution"],"source":"https://man7.org/linux/man-pages/man5/nsswitch.conf.5.html","inputs":[{"key":"host","label":"Hostname","example":"api.internal.example.com"}],"steps":[{"title":"Test resolution through the full name service stack","cmd":"getent hosts {host}","risk":"safe","look":"getent follows nsswitch.conf exactly as applications do. dig and nslookup bypass it, which is why they can succeed while your
