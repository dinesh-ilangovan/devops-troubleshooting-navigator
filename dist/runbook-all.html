e":"Node is NotReady","summary":"The node stopped reporting healthy. Pods on it will be evicted after the toleration window.","aliases":["node notready","node not ready","kubelet down","node unreachable","node lost","kubelet stopped posting"],"source":"https://kubernetes.io/docs/concepts/architecture/nodes/","inputs":[{"key":"node","label":"Node name","example":"ip-10-0-3-14.ec2.internal"}],"steps":[{"title":"Read the node's conditions","cmd":"kubectl describe node {node} | grep -A10 Conditions","risk":"safe","look":"Which condition is false or unknown. Ready Unknown means the kubelet stopped reporting entirely, which is very different from a pressure condition.","signals":[{"match":"(?i)Ready\\s+Unknown","means":"The kubelet stopped posting status. The node may be gone or partitioned.","goto":"cause:kubelet-silent"},{"match":"(?i)DiskPressure\\s+True","means":"The node is out of disk.","goto":"cause:disk"},{"match":"(?i)MemoryPressure\\s+True","means":"The node is out of memory.","goto":"cause:memory"},{"match":"(?i)PIDPressure\\s+True","means":"Process ID exhaustion, usually a fork loop.","goto":"cause:pids"},{"match":"(?i)NetworkUnavailable\\s+True","means":"The CNI has not configured the node's network.","goto":"cause:cni"}]},{"title":"Check how long it has been unhealthy","cmd":"kubectl get node {node} -o wide","risk":"safe","look":"The age against the last transition. Pods are evicted after the not-ready toleration, five minutes by default."},{"title":"See what is still on it","cmd":"kubectl get pods --all-namespaces --field-selector spec.nodeName={node}","risk":"safe","look":"Anything not yet evicted. Stateful workloads here need attention before the node is replaced."},{"title":"Cordon it so nothing new lands","cmd":"kubectl cordon {node}","risk":"state","look":"The node shows SchedulingDisabled. Do this before investigating so the problem does not spread.","note":"Marks the node unschedulable. Running pods are not touched, but nothing new will be placed. Reverse with kubectl uncordon."}],"causes":[{"id":"kubelet-silent","cause":"The kubelet is not posting status.","fix":"Check the host: is it up, is the kubelet service running, can it reach the API server.","confirm":""},{"id":"disk","cause":"The node's disk is full, often image or log growth.","fix":"Clear space, then set image garbage collection and log rotation so it does not recur.","confirm":""},{"id":"memory","cause":"The node is out of memory.","fix":"Look for pods without limits. Overcommit on requests is the usual root cause.","confirm":""},{"id":"pids","cause":"Process ID exhaustion.","fix":"Find the fork loop. Set a pid limit on the offending workload.","confirm":""},{"id":"cni","cause":"The CNI plugin has not initialised on the node.","fix":"Check the CNI DaemonSet's pod on that node.","confirm":""}],"verify":["The node reports Ready.","Workloads have rescheduled and are serving.","The condition that flipped has a remediation, not just a restart."],"escalate":["Full conditions block","Whether the host is reachable outside Kubernetes","Pods still bound to the node"]},{"id":"k8s-pvc-pending","tier":"documented","technology":"Kubernetes","category":"Storage","title":"PersistentVolumeClaim stays Pending","summary":"The claim never binds, so every pod using it stays Pending too.","aliases":["pvc pending","volume not bound","waiting for first consumer","no persistent volumes available","storage class","pvc stuck"],"source":"https://kubernetes.io/docs/concepts/storage/persistent-volumes/","inputs":[{"key":"pvc","label":"PVC name","example":"postgres-data"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the binding events","cmd":"kubectl describe pvc {pvc} -n {namespace} | grep -A10 Events","risk":"safe","look":"The provisioner's own message. WaitForFirstConsumer is not an error at all; it is the expected state until a pod is scheduled.","signals":[{"match":"(?i)waiting for first consumer","means":"Normal. The volume binds when a pod that uses it gets scheduled.","goto":"cause:wait-first-consumer"},{"match":"(?i)storageclass.*not found","means":"The named StorageClass does not exist in this cluster.","goto":"cause:no-storageclass"},{"match":"(?i)no persistent volumes available","means":"Static provisioning with no matching PV.","goto":"cause:no-matching-pv"},{"match":"(?i)failed to provision|quota","means":"The provisioner tried and the backend refused.","goto":"cause:backend-refused"}]},{"title":"Check the requested class and access mode","cmd":"kubectl get pvc {pvc} -n {namespace} -o jsonpath='{.spec.storageClassName}{\" \"}{.spec.accessModes}{\" \"}{.spec.resources.requests.storage}'","risk":"safe","look":"ReadWriteMany is unsupported by most block storage drivers and is a common silent mismatch."},{"title":"List the classes that actually exist","cmd":"kubectl get storageclass","risk":"safe","look":"Whether the requested name exists, and which class is marked default. An empty storageClassName uses the default; a missing default leaves the claim Pending forever."}],"causes":[{"id":"wait-first-consumer","cause":"The class uses WaitForFirstConsumer.","fix":"Nothing is wrong. Schedule a pod that mounts it and it will bind.","confirm":""},{"id":"no-storageclass","cause":"The named class does not exist.","fix":"Correct the name, or install the class. Cluster migrations often leave stale names in manifests.","confirm":""},{"id":"no-matching-pv","cause":"Static provisioning with no PV matching size, class and access mode.","fix":"Create a matching PV, or move to dynamic provisioning.","confirm":""},{"id":"access-mode","cause":"The driver does not support the requested access mode.","fix":"Use ReadWriteOnce for block storage, or a filesystem driver for ReadWriteMany.","confirm":""},{"id":"backend-refused","cause":"The storage backend rejected the request, often on quota.","fix":"Read the provisioner's message and check the cloud-side quota.","confirm":""}],"verify":["The PVC reports Bound with a volume name.","The pod that needed it is scheduled and running."],"escalate":["PVC events","Requested class, size and access mode","Output of kubectl get storageclass"]},{"id":"k8s-dns-failure","tier":"documented","technology":"Kubernetes","category":"DNS","title":"DNS resolution fails inside pods","summary":"Names do not resolve from within the cluster. Work out whether it is CoreDNS, the pod's resolver, or upstream.","aliases":["dns not working","name resolution failed","coredns","cannot resolve","nxdomain","server misbehaving","temporary failure in name resolution"],"source":"https://kubernetes.io/docs/tasks/administer-cluster/dns-debugging-resolution/","inputs":[{"key":"pod","label":"Pod name","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Test resolution of a cluster name from the pod","cmd":"kubectl exec {pod} -n {namespace} -- getent hosts kubernetes.default.svc.cluster.local","risk":"safe","look":"An IP means cluster DNS works and the problem is narrower than you thought. Nothing means the resolver path is broken.","signals":[{"match":"\\d+\\.\\d+\\.\\d+\\.\\d+","means":"Cluster DNS works. Test an external name next.","goto":"step:4"},{"match":"^\\s*$","means":"Cluster DNS is not answering for this pod.","goto":"step:2"}]},{"title":"Check that CoreDNS is running","cmd":"kubectl get pods -n kube-system -l k8s-app=kube-dns -o wide","risk":"safe","look":"All replicas Ready. CrashLooping CoreDNS is usually a bad Corefile edit or a resolver loop.","signals":[{"match":"CrashLoopBackOff","means":"CoreDNS itself is failing. Check its logs for a loop plugin detection.","goto":"cause:coredns-down"},{"match":"0/1","means":"CoreDNS is not ready, so nothing in the cluster resolves.","goto":"cause:coredns-down"}]},{"title":"Read the pod's resolver configuration","cmd":"kubectl exec {pod} -n {namespace} -- cat /etc/resolv.conf","risk":"safe","look":"The nameserver should be the cluster DNS Service IP. A node-level resolver here means dnsPolicy is wrong for a cluster workload.","signals":[{"match":"(?i)ndots:5","means":"Normal, but it means short names try several search domains first, which looks like slow DNS under load.","goto":"cause:ndots"},{"match":"nameserver 169\\.254|nameserver 8\\.8","means":"The pod is using a node or public resolver, not cluster DNS.","goto":"cause:wrong-dnspolicy"}]},{"title":"Test an external name","cmd":"kubectl exec {pod} -n {namespace} -- getent hosts github.com","risk":"safe","look":"Cluster names working but external failing points at CoreDNS's upstream forwarder or egress, not at Kubernetes DNS itself."}],"causes":[{"id":"coredns-down","cause":"CoreDNS is unhealthy.","fix":"Read its logs. A loop plugin error means the upstream resolver points back at CoreDNS.","confirm":""},{"id":"wrong-dnspolicy","cause":"The pod uses host DNS instead of cluster DNS.","fix":"Set dnsPolicy ClusterFirst. hostNetwork pods need ClusterFirstWithHostNet explicitly.","confirm":""},{"id":"upstream","cause":"CoreDNS cannot reach its upstream resolver.","fix":"Check the forward directive in the Corefile and egress from the CoreDNS pods.","confirm":""},{"id":"ndots","cause":"Short names expand through five search domains before the real lookup.","fix":"Use fully qualified names with a trailing dot for hot paths, or tune ndots per pod.","confirm":""},{"id":"netpol","cause":"A NetworkPolicy blocks egress to port 53.","fix":"Allow UDP and TCP 53 to kube-system in the policy.","confirm":""}],"verify":["Both cluster and external names resolve from inside the pod.","CoreDNS replicas are Ready with no restarts."],"escalate":["resolv.conf from inside the pod","CoreDNS pod state and logs","Which names fail: cluster, external, or both"]},{"id":"k8s-ingress-503","tier":"documented","technology":"Kubernetes","category":"Ingress","title":"Ingress returns 502, 503 or 404","summary":"The ingress answers but the backend does not. Each status points at a different layer.","aliases":["ingress 503","502 bad gateway","ingress 404","service unavailable","no healthy upstream","default backend"],"source":"https://kubernetes.io/docs/concepts/services-networking/ingress/","inputs":[{"key":"ingress","label":"Ingress name","example":"checkout"},{"key":"namespace","label":"Namespace","example":"production"},{"key":"service","label":"Backend service","example":"checkout-api"}],"steps":[{"title":"Identify which status you get and from whom","cmd":"curl -sSI https://$(kubectl get ingress {ingress} -n {namespace} -o jsonpath='{.spec.rules[0].host}')/","risk":"safe","look":"The Server header tells you whether the ingress controller answered or something upstream did. 404 usually means no rule matched; 503 usually means no healthy backend.","signals":[{"match":"503","means":"The controller matched a rule but has no healthy endpoint behind it.","goto":"cause:no-endpoints"},{"match":"404","means":"No ingress rule matched this host and path.","goto":"cause:no-rule-match"},{"match":"502","means":"The controller reached a backend and got an invalid response.","goto":"cause:backend-error"}]},{"title":"Check the ingress has an address and correct rules","cmd":"kubectl get ingress {ingress} -n {namespace} -o wide","risk":"safe","look":"An empty ADDRESS means no controller has claimed it, usually a missing or wrong ingressClassName."},{"title":"Check the backend service has endpoints","cmd":"kubectl get endpointslices -n {namespace} -l kubernetes.io/service-name={service}","risk":"safe","look":"Empty endpoints produce 503 every time. This is the most common cause by a wide margin.","signals":[{"match":"(?i)<none>|No resources found","means":"No pods behind the service. Follow the no-endpoints runbook.","goto":"cause:no-endpoints"}]},{"title":"Read the controller's own logs","cmd":"kubectl logs -n ingress-nginx -l app.kubernetes.io/component=controller --tail=50","risk":"safe","look":"The controller logs the upstream it chose and why it failed. This is more precise than anything you can infer from the client side."}],"causes":[{"id":"no-endpoints","cause":"The backend service has no ready endpoints.","fix":"Fix pod readiness or the service selector. The ingress is working correctly by refusing to send traffic nowhere.","confirm":""},{"id":"no-rule-match","cause":"Host or path in the request does not match any rule.","fix":"Check pathType. Prefix and Exact behave differently, and this catches people out constantly.","confirm":""},{"id":"wrong-class","cause":"No controller claimed the ingress.","fix":"Set ingressClassName to a class that exists in the cluster.","confirm":""},{"id":"backend-error","cause":"The backend returned something the controller could not use.","fix":"Check the app's own logs. Often TLS expected on a plain-HTTP backend port.","confirm":""},{"id":"wrong-port","cause":"The ingress points at a service port that does not exist.","fix":"Match the port name or number to the service definition.","confirm":""}],"verify":["The URL returns the expected status from the application.","The controller logs show the correct upstream being selected."],"escalate":["The exact status and response headers","Ingress rules and class","Backend endpoints","Controller log lines for the request"]},{"id":"k8s-pod-evicted","tier":"documented","technology":"Kubernetes","category":"Nodes","title":"Pods are being Evicted","summary":"The kubelet is reclaiming resources on a node under pressure. The eviction message names which resource.","aliases":["pod evicted","evicted","node under pressure","ephemeral storage","the node was low on resource","diskpressure eviction"],"source":"https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/","inputs":[{"key":"namespace","label":"Namespace","example":"production"},{"key":"pod","label":"Evicted pod name","example":"checkout-api-7d9f6b8c5-x4k2m"}],"steps":[{"title":"List the evicted pods and read the reason","cmd":"kubectl get pods -n {namespace} --field-selector status.phase=Failed -o custom-columns=NAME:.metadata.name,REASON:.status.reason,MSG:.status.message","risk":"safe","look":"The message names the resource that ran out. That single word decides everything that follows.","signals":[{"match":"(?i)ephemeral-storage","means":"The pod wrote too much to its writable layer or an emptyDir.","goto":"cause:ephemeral"},{"match":"(?i)memory","means":"The node ran out of memory and reclaimed the largest offender over its request.","goto":"cause:node-memory"},{"match":"(?i)inodes","means":"The node exhausted inodes, usually many small files.","goto":"cause:inodes"}]},{"title":"Find which node is under pressure","cmd":"kubectl get nodes -o custom-columns=NAME:.metadata.name,CONDITIONS:.status.conditions[?(@.status==\\\"True\\\")].type","risk":"safe","look":"Which nodes report DiskPressure or MemoryPressure. If it is one node, it is a host problem; if it is all of them, it is a capacity problem."},{"title":"Check whether the evicted workload declared requests","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].resources.requests}' 2>/dev/null || echo 'pod already removed'","risk":"safe","look":"Pods without requests are evicted first. Declaring a request is what buys a workload protection."}],"causes":[{"id":"ephemeral","cause":"The container wrote more to local disk than its ephemeral-storage allowance.","fix":"Set an ephemeral-storage request and limit, and move logs to stdout rather than files.","confirm":""},{"id":"node-memory","cause":"The node ran out of memory.","fix":"Set memory requests on the workloads sharing that node. Eviction targets pods exceeding their request first.","confirm":""},{"id":"inodes","cause":"Inode exhaustion from many small files.","fix":"Find the directory generating them. Log rotation usually solves it.","confirm":""},{"id":"no-requests","cause":"Best-effort pods are evicted first.","fix":"Declare requests so the workload gets a guaranteed or burstable class.","confirm":""}],"verify":["No new evictions during a normal workload window.","The node's pressure conditions are false.","The affected workloads declare requests."],"escalate":["Eviction message verbatim","Node conditions","Whether the workload declares requests and limits"]},{"id":"linux-disk-full","tier":"documented","technology":"Linux","category":"Storage","title":"Filesystem is full","summary":"Writes fail with no space left. Find what is consuming it before deleting anything.","aliases":["no space left","disk full","filesystem full","cannot write","df full","100% used"],"source":"https://man7.org/linux/man-pages/man1/du.1.html","inputs":[{"key":"path","label":"Filesystem or path","example":"/"}],"steps":[{"title":"See which filesystem is actually full","cmd":"df -h","risk":"safe","look":"The Use% column, and note the mount point. A full /var is a very different problem from a full /home.","signals":[{"match":"100%","means":"That filesystem is completely full.","goto":"step:2"},{"match":"(?i)/dev/loop|overlay","means":"Container or snap storage, not the host's own data.","goto":"cause:container-storage"}]},{"title":"Check inodes, because df can lie","cmd":"df -i","risk":"safe","look":"Space free but IUse% at 100 means inode exhaustion. The error is identical but the fix is completely different."},{"title":"Find the largest directories","cmd":"du -xh {path} --max-depth=2 2>/dev/null | sort -rh | head -20","risk":"safe","look":"The -x keeps it on one filesystem so you are not misled by other mounts. Work downward from the largest entry."},{"title":"Find space held by deleted but still-open files","cmd":"lsof +L1 2>/dev/null | head -20","risk":"safe","look":"A deleted file held open by a running process still occupies disk. This explains the case where du shows far less than df.","signals":[{"match":"(?i)deleted","means":"Space is held by a deleted file still open. Restarting that process releases it.","goto":"cause:deleted-open"}]}],"causes":[{"id":"logs","cause":"Log files grew without rotation.","fix":"Truncate with : > file rather than deleting, so the open handle stays valid. Then fix logrotate.","confirm":""},{"id":"deleted-open","cause":"A process holds a deleted file open.","fix":"Restart that process. No amount of deleting will reclaim the space otherwise.","confirm":""},{"id":"inodes","cause":"Inodes exhausted by many small files.","fix":"Find the directory with the most entries and clear it. Often a session or cache directory.","confirm":""},{"id":"container-storage","cause":"Container images and layers.","fix":"Prune the container runtime's storage, with a time filter rather than wholesale.","confirm":""}],"verify":["df shows meaningful free space.","The write that was failing now succeeds.","Rotation or cleanup is configured so it does not recur."],"escalate":["df -h and df -i output","The top entries from du","Whether any deleted files are still held open"]},{"id":"linux-port-in-use","tier":"documented","technology":"Linux","category":"Networking","title":"Address already in use","summary":"A service will not start because something already holds its port.","aliases":["address already in use","port in use","bind failed","cannot bind","eaddrinuse","port already bound"],"source":"https://man7.org/linux/man-pages/man8/ss.8.html","inputs":[{"key":"port","label":"Port","example":"8080"}],"steps":[{"title":"Find what is listening","cmd":"sudo ss -tlnp 'sport = :{port}'","risk":"safe","look":"The process name and PID in the last column. Without sudo you will not see the owner for another user's process.","signals":[{"match":"users:\\(\\(","means":"A process holds it. The name and PID are in the parentheses.","goto":"cause:other-process"},{"match":"^\\s*$","means":"Nothing is listening, so the failure is something else.","goto":"step:3"}]},{"title":"Check whether it is bound on a different interface","cmd":"sudo ss -tlnp | grep :{port}","risk":"safe","look":"0.0.0.0 versus 127.0.0.1 versus a specific IP. Two processes can bind the same port on different addresses, which looks contradictory until you see this."},{"title":"Check for a socket stuck in TIME_WAIT","cmd":"ss -tan | grep :{port} | head","risk":"safe","look":"TIME_WAIT entries without a listener mean the old socket has not been released. SO_REUSEADDR in the application is the correct fix, not waiting."},{"title":"Stop the process holding the port","cmd":"sudo kill <pid>","risk":"destructive","look":"Re-run ss to confirm the port is free before starting your service.","note":"Terminates the process. If it is a production service, its clients drop immediately. Confirm what the PID actually is with ps before running this, and prefer the service manager's stop command so it shuts down cleanly."}],"causes":[{"id":"other-process","cause":"Another process is bound to the port.","fix":"Stop it through its service manager, or configure your service to use a different port.","confirm":""},{"id":"time-wait","cause":"An old socket has not been released.","fix":"Enable SO_REUSEADDR in the application. Waiting works but is not a fix.","confirm":""},{"id":"interface-conflict","cause":"Bound to a specific address that overlaps your wildcard bind.","fix":"Bind to a specific address instead of 0.0.0.0.","confirm":""},{"id":"systemd-socket","cause":"A systemd socket unit holds the port.","fix":"Stop the .socket unit, not just the .service.","confirm":""}],"verify":["The service starts and is listening.","ss shows it as the owner of the port."],"escalate":["ss -tlnp output for the port","What the holding process is","Whether it is managed by systemd"]},{"id":"linux-service-fails","tier":"documented","technology":"Linux","category":"systemd","title":"systemd service will not start","summary":"systemctl start fails or the unit restarts in a loop. The journal has the real reason.","aliases":["service failed","systemctl start failed","unit failed","job failed see systemctl status","service wont start","activating auto-restart"],"source":"https://man7.org/linux/man-pages/man1/systemctl.1.html","inputs":[{"key":"unit","label":"Unit name","example":"checkout-api.service"}],"steps":[{"title":"Read the unit's current state and last lines","cmd":"systemctl status {unit} --no-pager -l","risk":"safe","look":"The Active line and the exit status. 'code=exited status=N' is the application's own exit code and the most useful number on the screen.","signals":[{"match":"(?i)status=203/EXEC","means":"systemd could not execute the binary. Wrong path, or not executable.","goto":"cause:bad-exec"},{"match":"(?i)status=200/CHDIR","means":"WorkingDirectory does not exist.","goto":"cause:bad-workdir"},{"match":"(?i)status=217/USER","means":"The configured User does not exist.","goto":"cause:bad-user"},{"match":"(?i)Result: timeout","means":"It started but never signalled readiness in time.","goto":"cause:type-mismatch"}]},{"title":"Read the journal for this unit's last start","cmd":"journalctl -u {unit} -n 80 --no-pager","risk":"safe","look":"The application's own output. systemctl status truncates; this does not."},{"title":"Validate the unit file itself","cmd":"systemd-analyze verify /etc/systemd/system/{unit}","risk":"safe","look":"Syntax problems and unresolvable references that status will never mention."},{"title":"Reload systemd after editing a unit","cmd":"sudo systemctl daemon-reload","risk":"state","look":"No output means success. Start the unit again afterwards.","note":"Re-reads all unit files. Running services are not restarted and nothing is interrupted, but forgetting this after an edit means systemd keeps using the old definition and your change appears to do nothing."}],"causes":[{"id":"bad-exec","cause":"ExecStart points at something that cannot be executed.","fix":"Use an absolute path and check the execute bit. systemd does not use your shell's PATH.","confirm":""},{"id":"bad-user","cause":"The User directive names an account that does not exist.","fix":"Create the user or correct the name.","confirm":""},{"id":"bad-workdir","cause":"WorkingDirectory does not exist.","fix":"Create it, or remove the directive.","confirm":""},{"id":"type-mismatch","cause":"Type=notify or forking, but the process does not behave that way.","fix":"Use Type=simple for a process that stays in the foreground. This mismatch causes start timeouts constantly.","confirm":""},{"id":"stale-unit","cause":"The unit file was edited without a daemon-reload.","fix":"Run systemctl daemon-reload after every unit file change.","confirm":""}],"verify":["systemctl status shows active and running.","It survives a reboot if it is enabled.","The journal shows a clean startup."],"escalate":["Full systemctl status output","journalctl for the last start attempt","The unit file contents"]},{"id":"linux-high-load","tier":"documented","technology":"Linux","category":"Performance","title":"Load average is high and the box feels slow","summary":"High load can mean CPU, disk wait or thread explosion. They look identical at first and need different fixes.","aliases":["high load","load average","server slow","cpu high","system unresponsive","load spike"],"source":"https://man7.org/linux/man-pages/man1/top.1.html","inputs":[],"steps":[{"title":"Separate CPU from I/O wait","cmd":"top -bn1 | head -5","risk":"safe","look":"The %Cpu line. High us means real computation; high wa means processes blocked on disk; high sy means kernel overhead, often context switching.","signals":[{"match":"(?i)wa[,\\s]*[1-9]\\d\\.","means":"Significant I/O wait. The disk, not the CPU, is the bottleneck.","goto":"cause:io-wait"},{"match":"(?i)st[,\\s]*[1-9]","means":"Steal time. The hypervisor is taking cycles; this is a noisy-neighbour problem.","goto":"cause:steal"}]},{"title":"Compare load against core count","cmd":"uptime && nproc","risk":"safe","look":"Load equal to core count is fully busy, not broken. Load at several times the core count is where queuing hurts."},{"title":"Find the top consumers","cmd":"ps -eo pid,ppid,pcpu,pmem,etime,comm --sort=-pcpu | head -15","risk":"safe","look":"The elapsed time column matters as much as the CPU column. A process at 100% for three seconds is normal; for three hours it is not."},{"title":"Check whether processes are blocked rather than running","cmd":"ps -eo state,pid,comm | grep '^D' | head","risk":"safe","look":"State D is uninterruptible sleep, almost always disk or NFS. Load counts these, which is why a box can show high load with idle CPUs."}],"causes":[{"id":"io-wait","cause":"Processes are blocked on disk.","fix":"Find the process doing the I/O. The CPU is not the constraint and adding cores will not help.","confirm":""},{"id":"runaway-process","cause":"One process is consuming the CPU.","fix":"Identify it from the elapsed time. Restart or throttle it depending on what it is.","confirm":""},{"id":"thread-explosion","cause":"A large number of threads or processes.","fix":"Check the thread count. An unbounded worker pool is a common cause.","confirm":""},{"id":"steal","cause":"The hypervisor is taking CPU time.","fix":"This is not fixable from inside the guest. Raise it with the platform owner.","confirm":""},{"id":"normal","cause":"Load is roughly equal to core count under real work.","fix":"Nothing is wrong. Measure response time rather than load average.","confirm":""}],"verify":["Load is proportional to core count under normal work.","Response times are acceptable.","The specific contributor was identified, not just observed."],"escalate":["top header lines","Load average with nproc","Top processes by CPU with elapsed time"]},{"id":"linux-ssh-denied","tier":"documented","technology":"Linux","category":"Access","title":"SSH permission denied (publickey)","summary":"The server rejected your key. Verbose output names the exact reason.","aliases":["permission denied publickey","ssh denied","cannot ssh","key rejected","authentication failed ssh","too open private key"],"source":"https://man7.org/linux/man-pages/man8/sshd.8.html","inputs":[{"key":"host","label":"Host","example":"bastion.example.com"},{"key":"user","label":"User","example":"ubuntu"}],"steps":[{"title":"Run with verbose output and read which keys were offered","cmd":"ssh -vvv {user}@{host} 2>&1 | findstr /C:\"Offering\" /C:\"Authentications\" /C:\"debug1: Next\"","risk":"safe","look":"Which keys the client offered and which methods the server accepts. If your key was never offered, the problem is local, not on the server.","signals":[{"match":"(?i)Offering public key","means":"The key was offered and rejected. The problem is server-side authorization.","goto":"cause:not-authorized"},{"match":"(?i)no such identity","means":"The key file does not exist at the path the client expects.","goto":"cause:missing-key"},{"match":"(?i)bad permissions|too open","means":"The private key is readable by others, so ssh refuses to use it.","goto":"cause:key-permissions"}]},{"title":"Check local key permissions","cmd":"ls -l ~/.ssh/","risk":"safe","look":"The private key must be 600 and the directory 700. ssh silently refuses keys that are more permissive."},{"title":"Confirm which key the client will use for this host","cmd":"ssh -G {host} | findstr identityfile","risk":"safe","look":"The resolved config. A ~/.ssh/config entry may be pointing at a different key than you assume."},{"title":"Check the server side if you have another way in","cmd":"sudo tail -30 /var/log/auth.log","risk":"safe","look":"sshd states the precise reason, including permission problems on the remote authorized_keys file, which the client can never see."}],"causes":[{"id":"not-authorized","cause":"The public key is not in the remote authorized_keys.","fix":"Add it. Confirm you copied the .pub file, not the private key.","confirm":""},{"id":"key-permissions","cause":"Local private key permissions are too open.","fix":"chmod 600 on the key and 700 on ~/.ssh.","confirm":""},{"id":"remote-permissions","cause":"The remote ~/.ssh or authorized_keys is group-writable.","fix":"chmod 700 ~/.ssh and 600 authorized_keys on the server. sshd refuses them otherwise and logs the reason.","confirm":""},{"id":"missing-key","cause":"The key file is not where the client looks.","fix":"Point at it with -i, or add an IdentityFile entry to ~/.ssh/config.","confirm":""},{"id":"wrong-user","cause":"Correct key, wrong username.","fix":"Cloud images each have their own default user. ubuntu, ec2-user and admin are not interchangeable.","confirm":""}],"verify":["SSH connects without a password prompt.","It works from a fresh shell, not only with an explicit -i flag."],"escalate":["ssh -vvv output around the authentication attempt","Local key permissions","auth.log from the server if reachable"]},{"id":"linux-oom-killer","tier":"documented","technology":"Linux","category":"Memory","title":"Process was killed by the OOM killer","summary":"A process vanished with no error. The kernel killed it to reclaim memory.","aliases":["oom killer","process killed","out of memory kernel","killed process","oom-kill","process disappeared"],"source":"https://man7.org/linux/man-pages/man5/proc.5.html","inputs":[{"key":"process","label":"Process name","example":"java"}],"steps":[{"title":"Confirm the kernel did it","cmd":"sudo dmesg -T | grep -i -E 'killed process|oom' | tail -10","risk":"safe","look":"The timestamp, the process name and its RSS at the moment of death. This is definitive; without it you are only guessing.","signals":[{"match":"(?i)Killed process","means":"Confirmed. The kernel chose this process as the victim.","goto":"cause:host-oom"},{"match":"(?i)memory cgroup out of memory","means":"A cgroup limit, not the whole host. Only that container or unit was constrained.","goto":"cause:cgroup-limit"}]},{"title":"See the current memory picture","cmd":"free -h","risk":"safe","look":"available, not free. Linux uses free memory for cache by design, so a low free number is normal and not a problem."},{"title":"Find the current biggest consumers","cmd":"ps -eo pid,rss,comm --sort=-rss | head -10","risk":"safe","look":"RSS in kilobytes. Compare the top entry against total memory to see whether one process dominates."},{"title":"Check what the kernel would kill next","cmd":"for p in $(pgrep {process}); do echo \"$p $(cat /proc/$p/oom_score)\"; done","risk":"safe","look":"Higher score means more likely to be chosen. Useful for predicting the next victim before it happens."}],"causes":[{"id":"host-oom","cause":"The host ran out of memory.","fix":"Reduce the workload, add memory, or set limits so one process cannot take everything.","confirm":""},{"id":"cgroup-limit","cause":"A container or systemd unit hit its own limit.","fix":"Raise MemoryMax or the container limit, having measured the real requirement first.","confirm":""},{"id":"no-swap","cause":"No swap, so there is no buffer before the killer runs.","fix":"A small swap file gives the kernel room to reclaim before killing. Not a substitute for enough RAM.","confirm":""},{"id":"leak","cause":"Memory grows without bound.","fix":"Profile the process. The OOM killer is a symptom, not the problem.","confirm":""}],"verify":["The process stays running through a full workload cycle.","free shows headroom in available.","A limit exists so one process cannot take the whole host."],"escalate":["The dmesg OOM lines verbatim","free -h output","RSS of the top processes"]},{"id":"tf-state-lock","tier":"documented","technology":"Terraform","category":"State","title":"Error acquiring the state lock","summary":"Terraform will not run because another operation holds the lock, or a crashed run left it behind.","aliases":["state lock","error acquiring the state lock","lock id","conditionalcheckfailedexception","terraform locked","force-unlock"],"source":"https://developer.hashicorp.com/terraform/language/state/locking","inputs":[{"key":"lockid","label":"Lock ID from the error","example":"a1b2c3d4-0000-0000-0000-000000000000"}],"steps":[{"title":"Read the lock's own metadata","cmd":"terraform plan","risk":"safe","look":"The error block names Who, Created and Operation. Who and Created together tell you whether this is a live run or an abandoned lock.","signals":[{"match":"(?i)Who:.*@","means":"A named person or CI runner holds it. Check with them before doing anything.","goto":"cause:someone-running"},{"match":"(?i)Operation:\\s*OperationTypeApply","means":"An apply held this lock. If it crashed, state may be partially written.","goto":"cause:crashed-apply"}]},{"title":"Check whether a CI job is actually running","cmd":"echo 'Check your CI pipeline for a running plan or apply on this workspace'","risk":"safe","look":"Do this before force-unlocking. Breaking a live apply's lock is how state gets corrupted."},{"title":"Confirm the timestamp is genuinely stale","cmd":"terraform plan 2>&1 | findstr Created","risk":"safe","look":"A lock minutes old is probably live. Hours old with no running job is abandoned."},{"title":"Force-unlock the stale lock","cmd":"terraform force-unlock {lockid}","risk":"destructive","look":"Terraform confirms the lock was released. Run terraform plan immediately afterwards to check state consistency.","note":"Removes the lock without the holder's knowledge. If another apply is genuinely running, both processes will then write state concurrently and can corrupt it, which is far worse than waiting. Only run this once you have confirmed no job is active."}],"causes":[{"id":"someone-running","cause":"Another engineer or CI job holds the lock legitimately.","fix":"Wait. Do not force-unlock a live operation.","confirm":""},{"id":"crashed-apply","cause":"A previous apply died and left the lock.","fix":"Force-unlock, then plan carefully. Resources may have been created without being recorded.","confirm":""},{"id":"network-interrupt","cause":"A local run lost connectivity mid-operation.","fix":"Force-unlock, then plan to reconcile.","confirm":""},{"id":"permissions","cause":"The backend cannot write the lock at all.","fix":"Check IAM on the lock table or blob. This looks like a lock problem but is an access problem.","confirm":""}],"verify":["terraform plan runs without a lock error.","The plan shows no unexpected drift from a partial apply.","No concurrent operation was interrupted."],"escalate":["The full lock error including Who and Created","Whether any CI job was running","The plan output after unlocking"]},{"id":"tf-already-exists","tier":"documented","technology":"Terraform","category":"State","title":"Resource already exists in the provider","summary":"Apply fails because the real resource exists but Terraform's state does not know about it.","aliases":["already exists","entityalreadyexists","resource exists","import resource","alreadyexists","duplicate resource"],"source":"https://developer.hashicorp.com/terraform/cli/import","inputs":[{"key":"address","label":"Terraform address","example":"aws_s3_bucket.logs"},{"key":"realid","label":"Real resource ID","example":"my-logs-bucket"}],"steps":[{"title":"Confirm Terraform does not have it in state","cmd":"terraform state list | findstr {address}","risk":"safe","look":"No output means it is genuinely absent from state, and import is the right move. Output means state has it and the problem is different.","signals":[{"match":"\\w","means":"It is in state already. This is a naming collision or a second resource, not a missing import.","goto":"cause:name-collision"},{"match":"^\\s*$","means":"Absent from state. Import is appropriate.","goto":"cause:not-in-state"}]},{"title":"Check you are in the workspace you think","cmd":"terraform workspace show && terraform state list | measure-object -line","risk":"safe","look":"Applying against the wrong workspace produces exactly this error and is a common cause, especially in CI."},{"title":"Import the existing resource into state","cmd":"terraform import {address} {realid}","risk":"state","look":"Terraform confirms the import. Nothing in the real infrastructure has changed yet.","note":"Writes the real resource into state but does not generate configuration for you. If your .tf block does not match reality, the very next plan will propose changes to the live resource. Always plan immediately afterwards and read it carefully before applying."},{"title":"Check what Terraform now wants to change","cmd":"terraform plan","risk":"safe","look":"An empty plan means your configuration matches reality. Any proposed change is a real difference you must reconcile in the .tf file, not apply blindly.","signals":[{"match":"(?i)0 to add, 0 to change, 0 to destroy","means":"Configuration matches reality. The import is complete.","goto":""},{"match":"(?i)to destroy","means":"Stop. Your configuration would destroy something. Fix the .tf before applying.","goto":"cause:config-mismatch"}]}],"causes":[{"id":"not-in-state","cause":"The resource was created outside Terraform, or state was lost.","fix":"Import it, then reconcile the configuration until plan is empty.","confirm":""},{"id":"wrong-workspace","cause":"Applying against the wrong workspace or state file.","fix":"Check terraform workspace show. Confirm the backend key too.","confirm":""},{"id":"name-collision","cause":"A different resource already uses that name in the provider.","fix":"Rename one of them. Names are globally unique for some resource types.","confirm":""},{"id":"config-mismatch","cause":"Imported, but the configuration does not match reality.","fix":"Adjust the .tf until plan is empty. Never apply a plan that proposes destroying something you just imported.","confirm":""}],"verify":["terraform plan reports no changes.","The resource appears in terraform state list.","The configuration reflects the real resource accurately."],"escalate":["The exact already-exists error","Output of terraform workspace show","The plan output after import"]},{"id":"tf-unexpected-drift","tier":"documented","technology":"Terraform","category":"Plan","title":"Plan shows changes nobody made","summary":"A plan proposes changes to resources you did not touch. Distinguish real drift from provider noise.","aliases":["unexpected changes","drift","plan shows changes","forces replacement","perpetual diff","always shows changes"],"source":"https://developer.hashicorp.com/terraform/cli/commands/plan","inputs":[{"key":"address","label":"Resource address","example":"aws_ecs_service.api"}],"steps":[{"title":"Refresh state and see what actually drifted","cmd":"terraform plan -refresh-only","risk":"safe","look":"Differences between state and reality only. This separates genuine outside changes from configuration differences, which the normal plan blends together.","signals":[{"match":"(?i)No changes","means":"State matches reality. The diff comes from your configuration, not from drift.","goto":"cause:config-diff"},{"match":"(?i)has changed outside of Terraform","means":"Something modified the resource outside Terraform.","goto":"cause:manual-change"}]},{"title":"Read what specifically would change","cmd":"terraform plan -target={address}","risk":"safe","look":"The attribute-level diff. Watch for 'forces replacement' — that means destroy and recreate, not an in-place update."},{"title":"Check whether it is the same diff every time","cmd":"terraform plan -detailed-exitcode","risk":"safe","look":"Exit code 2 means changes are pending. The same diff reappearing after a successful apply is a perpetual diff, which is a provider or configuration issue rather than drift.","signals":[{"match":"(?i)forces replacement","means":"This would destroy and recreate the resource. Understand the downtime before proceeding.","goto":"cause:replacement"}]},{"title":"Inspect the stored state for the attribute","cmd":"terraform state show {address}","risk":"safe","look":"What Terraform believes. Comparing this against the provider console usually makes the source of the difference obvious."}],"causes":[{"id":"manual-change","cause":"Someone changed the resource in the console.","fix":"Either import the change into configuration, or apply to restore. Decide which is the intended source of truth.","confirm":""},{"id":"config-diff","cause":"The configuration differs from reality and always has.","fix":"A variable or default changed. Compare against the last applied configuration.","confirm":""},{"id":"perpetual-diff","cause":"The same diff returns after every apply.","fix":"Usually a provider normalising a value differently from how it is written. Match the provider's format, or use ignore_changes deliberately.","confirm":""},{"id":"provider-upgrade","cause":"A provider version change altered defaults.","fix":"Read the provider changelog. Pin the version so this does not happen unannounced.","confirm":""},{"id":"replacement","cause":"The change forces destroy and recreate.","fix":"Check which attribute is immutable. For stateful resources this may mean data loss, so plan the change properly.","confirm":""}],"verify":["A plan immediately after apply reports no changes.","Any drift was resolved deliberately, not by blind apply.","No resource was replaced without that being intended."],"escalate":["Output of terraform plan -refresh-only","The attribute-level diff","Provider version and whether it recently changed"]},{"id":"tf-provider-auth","tier":"documented","technology":"Terraform","category":"Providers","title":"Provider authentication fails","summary":"Terraform cannot authenticate to the cloud. The credential chain is layered and the error rarely says which layer.","aliases":["no valid credential","provider auth","invalidclienttokenid","unable to locate credentials","expiredtoken","terraform credentials"],"source":"https://developer.hashicorp.com/terraform/language/providers/configuration","inputs":[],"steps":[{"title":"Read which provider and which stage failed","cmd":"terraform plan","risk":"safe","look":"The provider name and the specific credential error. Expired and missing are completely different problems.","signals":[{"match":"(?i)ExpiredToken|expired","means":"The session token expired. Re-authenticate.","goto":"cause:expired"},{"match":"(?i)unable to locate credentials|no valid credential","means":"No credentials found anywhere in the chain.","goto":"cause:none-found"},{"match":"(?i)InvalidClientTokenId|SignatureDoesNotMatch","means":"Credentials exist but are wrong or from another account.","goto":"cause:wrong-creds"},{"match":"(?i)AccessDenied|not authorized","means":"Authenticated successfully, but lacking permission for the action.","goto":"cause:no-permission"}]},{"title":"See which identity is actually in use","cmd":"aws sts get-caller-identity","risk":"safe","look":"The account and ARN Terraform will use. Confirm it is the account you intend before anything else."},{"title":"Check what the environment is providing","cmd":"echo $env:AWS_PROFILE $env:AWS_REGION && terraform version","risk":"safe","look":"Environment variables override the shared config file. A leftover AWS_PROFILE in the shell is a very common cause."},{"title":"Check whether the provider block pins an assumed role","cmd":"findstr /S /C:\"assume_role\" *.tf","risk":"safe","look":"An assume_role block means your base credentials must be permitted to assume that role. The failure may be at the assume step rather than the base credentials."}],"causes":[{"id":"expired","cause":"The session token has expired.","fix":"Re-authenticate. SSO sessions are typically short-lived by design.","confirm":""},{"id":"none-found","cause":"No credentials in environment, shared config or instance metadata.","fix":"Set the profile or environment variables. Confirm with sts get-caller-identity before running Terraform.","confirm":""},{"id":"wrong-creds","cause":"Credentials belong to a different account.","fix":"Check AWS_PROFILE. A stale exported variable overrides the config file silently.","confirm":""},{"id":"no-permission","cause":"Authenticated but not authorized for the action.","fix":"Read the denied action in the error. It names the exact permission needed.","confirm":""},{"id":"assume-role-fail","cause":"The assume_role step failed.","fix":"Check the trust policy on the target role and whether your base identity is allowed to assume it.","confirm":""}],"verify":["terraform plan runs without a credential error.","sts get-caller-identity shows the intended account.","The credential source is explicit rather than accidental."],"escalate":["The provider error verbatim","Output of aws sts get-caller-identity","Which environment variables are set"]},{"id":"tf-destroy-blocked","tier":"documented","technology":"Terraform","category":"Plan","title":"Destroy fails on a dependency","summary":"Terraform cannot remove a resource because something still references it, or the provider refuses.","aliases":["destroy failed","dependency violation","resource in use","cannot delete","deleteconflict","has dependent objects"],"source":"https://developer.hashicorp.com/terraform/cli/commands/destroy","inputs":[{"key":"address","label":"Resource that will not destroy","example":"aws_security_group.api"}],"steps":[{"title":"Read which dependency is blocking","cmd":"terraform destroy","risk":"safe","look":"The provider names the dependent object. That object often lives outside this Terraform configuration entirely, which is why Terraform cannot see it.","signals":[{"match":"(?i)DependencyViolation|has dependent objects","means":"Something still references this resource.","goto":"cause:external-dependency"},{"match":"(?i)deletion protection|DeletionProtection","means":"Deletion protection is enabled on the resource.","goto":"cause:deletion-protection"},{"match":"(?i)timeout|context deadline","means":"The provider timed out rather than refused.","goto":"cause:timeout"}]},{"title":"See what Terraform itself knows depends on it","cmd":"terraform graph | findstr {address}","risk":"safe","look":"In-configuration dependencies only. If this shows nothing, the blocker is outside Terraform's knowledge."},{"title":"Inspect the resource's current state","cmd":"terraform state show {address}","risk":"safe","look":"Attributes that may indicate protection flags or attachments recorded at the last refresh."},{"title":"Remove it from state without destroying it","cmd":"terraform state rm {address}","risk":"destructive","look":"The address disappears from terraform state list. The real resource is untouched.","note":"Terraform forgets the resource but the real infrastructure keeps running and keeps costing money. It becomes unmanaged, and a future apply may try to create a duplicate. Only do this when you have deliberately decided to hand ownership elsewhere, and record where it went."}],"causes":[{"id":"external-dependency","cause":"Something outside this configuration references the resource.","fix":"Find and remove the dependent object first. Security group rules referencing each other are a classic case.","confirm":""},{"id":"deletion-protection","cause":"The provider has deletion protection enabled.","fix":"Disable it and apply that change, then destroy. Two steps, deliberately.","confirm":""},{"id":"timeout","cause":"The provider timed out during deletion.","fix":"Some resources take a long time to delete. Raise the timeout and retry before assuming failure.","confirm":""},{"id":"orphaned-state","cause":"The real resource is already gone but state still lists it.","fix":"terraform state rm to reconcile.","confirm":""}],"verify":["terraform destroy completes.","The provider console confirms the resource is gone.","Nothing was orphaned into an unmanaged state by accident."],"escalate":["The destroy error including the dependent object","terraform state show for the resource","Whether the dependency is inside or outside this configuration"]}]</script>
<script>
"use strict";
const BANK = JSON.parse(document.getElementById("data").textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- session state (in memory only; nothing is persisted) ---------- */
const CTX = {};                 // placeholder key -> value
let CUR = null;                 // open runbook
let LOG = [];                   // [{t, step, cmd, note}]
let CURSOR = -1;                // keyboard cursor in results

/* ---------- search ---------- */
const flat = s => String(s ?? "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
function score(r, q) {
  if (!q.trim()) return 1;
  const qq = flat(q), qt = qq.split(" ").filter(t => t.length > 1);
  const title = flat(r.title), al = (r.aliases || []).map(flat);
  let s = 0;
  if (title.includes(qq)) s += 100;
  if (al.some(a => a.includes(qq) || qq.includes(a))) s += 80;
  const hay = [title, flat(r.summary), al.join(" "), flat(r.category)].join(" ");
  for (const t of qt) {
    if (title.includes(t)) s += 18;
    else if (al.some(a => a.includes(t))) s += 14;
    else if (hay.includes(t)) s += 4;
  }
  return s;
}

let TECH = "All", CAT = "All";

function renderChips() {
  const techs = [...new Set(BANK.map(r => r.technology))].sort();
  $("#techchips").innerHTML = ["All", ...techs].map(t => {
    const n = t === "All" ? BANK.length : BANK.filter(r => r.technology === t).length;
    return `<button class="tab${t === TECH ? " on" : ""}" data-t="${esc(t)}">${esc(t)}<span class="n">${n}</span></button>`;
  }).join("");
  document.querySelectorAll("#techchips .tab").forEach(b => b.onclick = () => {
    TECH = b.dataset.t; CAT = "All"; renderChips(); renderResults();
  });

  const pool = TECH === "All" ? BANK : BANK.filter(r => r.technology === TECH);
  const cats = [...new Set(pool.map(r => r.category).filter(Boolean))].sort();
  $("#catchips").innerHTML = cats.length > 1
    ? ["All", ...cats].map(c =>
        `<button class="tab${c === CAT ? " on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")
    : "";
  document.querySelectorAll("#catchips .tab").forEach(b => b.onclick = () => {
    CAT = b.dataset.c; renderChips(); renderResults();
  });
}

function renderResults() {
  const q = $("#q").value;
  let pool = BANK;
  if (TECH !== "All") pool = pool.filter(r => r.technology === TECH);
  if (CAT !== "All") pool = pool.filter(r => r.category === CAT);
  const arr = pool.map(r => ({ r, s: score(r, q) })).filter(x => x.s > 0)
                  .sort((a, b) => b.s - a.s).slice(0, 60);
  CURSOR = arr.length ? 0 : -1;
  $("#results").innerHTML = arr.length ? arr.map((x, i) => {
    const r = x.r, v = r.tier === "verified";
    return `<li><button class="hit${i === 0 ? " cur" : ""}" data-id="${esc(r.id)}">
      <h3>${esc(r.title)}</h3><p>${esc(r.summary)}</p>
      <span class="meta">
        <span class="trust t-${esc(r.tier)}">${v ? "Verified " + esc(r.verified_on) : esc(r.tier)}</span>
        <span>${esc(r.technology)}</span>
        <span>${(r.steps || []).length} steps</span>
      </span></button></li>`;
  }).join("") : `<li class="empty">Nothing matched. Try the exact error string from your terminal,
    or a plainer phrase like "pod won't start".</li>`;
  document.querySelectorAll(".hit").forEach(b => b.onclick = () => open(b.dataset.id));
}

/* ---------- placeholder substitution ---------- */
function fill(cmd, asHtml) {
  return cmd.replace(/\{([a-z0-9_]+)\}/g, (m, k) => {
    const v = CTX[k];
    if (!asHtml) return v || m;
    return v ? `<span class="fill">${esc(v)}</span>`
             : `<span class="unfilled">${esc(m)}</span>`;
  });
}

function ctxBar() {
  const keys = (CUR && CUR.inputs) || [];
  $("#ctxfields").innerHTML = keys.map(i =>
    `<label>${esc(i.label)}<input data-k="${esc(i.key)}" placeholder="${esc(i.example || "")}"
      value="${esc(CTX[i.key] || "")}" size="${Math.max(8, (i.example || "").length)}"></label>`).join("");
  document.querySelectorAll("#ctxfields input").forEach(inp => {
    inp.oninput = () => { CTX[inp.dataset.k] = inp.value.trim(); repaintCmds(); };
  });
}

function repaintCmds() {
  document.querySelectorAll("[data-cmd]").forEach(el => {
    el.innerHTML = fill(el.dataset.cmd, true);
  });
}

/* ---------- runbook view ---------- */
function open(id) {
  CUR = BANK.find(r => r.id === id);
  if (!CUR) return;
  LOG = [];
  (CUR.inputs || []).forEach(i => { if (!(i.key in CTX)) CTX[i.key] = ""; });
  ctxBar();

  const RISK = { safe: ["Read only", "c-safe"], state: ["Changes state", "c-state"],
                 destructive: ["Destructive", "c-destructive"] };

  const steps = (CUR.steps || []).map((s, i) => {
    const [label, cls] = RISK[s.risk] || RISK.safe;
    const danger = s.risk === "destructive";
    const body = danger
      ? `<div class="veil" data-reveal="${i}">Command hidden. Read the warning, then tap to reveal.</div>`
      : `<pre data-cmd="${esc(s.cmd)}"></pre><button class="copy" data-copy="${i}">Copy</button>`;
    const note = s.note ? `<p class="note${s.risk === "state" ? " note-state" : ""}">${esc(s.note)}</p>` : "";
    const sig = (s.signals || []).length
      ? `<details class="match"><summary>Paste your actual output to read it</summary>
           <textarea data-sig="${i}" placeholder="Paste the output you got, then release the key."></textarea>
           <div class="verdict miss" data-verdict="${i}">Nothing matched yet. Paste output above.</div>
         </details>` : "";
    return `<li class="step${danger ? " danger" : ""}" data-step="${i}">
      <button class="mark" data-done="${i}" aria-label="Mark step ${i + 1} done">${i + 1}</button>
      <div class="shead"><span class="stitle">${esc(s.title)}</span>
        <span class="chip ${cls}">${label}</span></div>
      ${note}
      <div class="cmd">${body}</div>
      <p class="look">${esc(s.look)}</p>
      ${sig}</li>`;
  }).join("");

  const causes = (CUR.causes || []).map((c, i) =>
    `<div class="cause" data-cause="${esc(c.id)}">
       <div><span class="rank">${i + 1}</span><span class="what">${esc(c.cause)}</span></div>
       <div class="fix"><b>Fix.</b> ${esc(c.fix)}</div></div>`).join("");

  const prov = CUR.tier === "verified"
    ? `Verified <b>${esc(CUR.verified_on)}</b> against <code>${esc(CUR.verified_against)}</code>
       by ${esc(CUR.verified_by)}.${CUR.source ? ` <a href="${esc(CUR.source)}" target="_blank" rel="noopener">Official docs</a>` : ""}`
    : `Written from documentation, not yet run against a live system. Treat every command as unconfirmed.`;

  $("#rbview").innerHTML = `
    <button class="back" id="back">&larr; All runbooks</button>
    <h2>${esc(CUR.title)}</h2>
    <p class="sum">${esc(CUR.summary)}</p>
    <p class="prov">${prov}</p>
    <ol class="steps">${steps}</ol>
    ${causes ? `<div class="sec"><h3>Likely causes, most common first</h3>${causes}</div>` : ""}
    ${(CUR.verify || []).length ? `<div class="sec"><h3>You are done when</h3>
       <ul class="plain">${CUR.verify.map(v => `<li>${esc(fill(v, false))}</li>`).join("")}</ul></div>` : ""}`;

  $("#searchview").style.display = "none";
  $("#results").style.display = "none";
  $("#rbview").style.display = "block";
  $("#bar").style.display = "block";
  $("#foot").textContent = "";
  window.scrollTo(0, 0);
  repaintCmds(); wire(); progress();
}

function wire() {
  $("#back").onclick = home;

  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => {
    const s = CUR.steps[+b.dataset.copy];
    copy(fill(s.cmd, false), "Command copied");
  });

  document.querySelectorAll("[data-reveal]").forEach(v => v.onclick = () => {
    const i = +v.dataset.reveal, s = CUR.steps[i];
    v.outerHTML = `<pre data-cmd="${esc(s.cmd)}"></pre><button class="copy" data-copy="${i}">Copy</button>`;
    repaintCmds(); wire();
  });

  document.querySelectorAll("[data-done]").forEach(b => b.onclick = () => {
    const i = +b.dataset.done, li = b.closest(".step"), s = CUR.steps[i];
    li.classList.toggle("done");
    if (li.classList.contains("done")) {
      LOG.push({ t: new Date().toISOString().slice(11, 19), step: s.title, cmd: fill(s.cmd, false) });
    } else {
      LOG = LOG.filter(e => e.step !== s.title);
    }
    progress();
  });

  document.querySelectorAll("[data-sig]").forEach(ta => ta.oninput = () => {
    const i = +ta.dataset.sig, s = CUR.steps[i], text = ta.value;
    const out = $(`[data-verdict="${i}"]`);
    document.querySelectorAll(".cause").forEach(c => c.classList.remove("lit"));
    if (!text.trim()) {
      out.className = "verdict miss";
      out.textContent = "Nothing matched yet. Paste output above.";
      return;
    }
    const m = (s.signals || []).find(g => { try { return new RegExp(g.match, "i").test(text); } catch { return false; } });
    if (!m) {
      out.className = "verdict miss";
      out.textContent = "No known signature in that output. It may still be fine — read the note above, "
        + "or add this output as a new signal so the next person gets a hit.";
      return;
    }
    out.className = "verdict hit";
    const target = m.goto || "";
    out.innerHTML = `<b>That output means:</b>${esc(m.means)}`;
    if (target.startsWith("cause:")) {
      const c = (CUR.causes || []).find(x => x.id === target.slice(6));
      const el = $(`[data-cause="${CSS.escape(target.slice(6))}"]`);
      if (el) el.classList.add("lit");
      if (c) out.innerHTML += `<button class="jump">Go to the fix: ${esc(c.cause)}</button>`;
      out.querySelector(".jump") && (out.querySelector(".jump").onclick =
        () => el && el.scrollIntoView({ behavior: "smooth", block: "center" }));
    } else if (target.startsWith("step:")) {
      const n = +target.slice(5);
      out.innerHTML += `<button class="jump">Go to step ${n}</button>`;
      out.querySelector(".jump").onclick = () =>
        document.querySelector(`[data-step="${n - 1}"]`).scrollIntoView({ behavior: "smooth", block: "center" });
    }
    LOG.push({ t: new Date().toISOString().slice(11, 19), step: s.title,
               cmd: fill(s.cmd, false), note: m.means });
  });
}

function progress() {
  const total = (CUR.steps || []).length;
  const done = document.querySelectorAll(".step.done").length;
  $("#prog").textContent = `${done} of ${total} checks done`;
}

/* ---------- exports ---------- */
function copy(t, msg) {
  navigator.clipboard.writeText(t).then(() => {
    const el = $("#toast"); el.textContent = msg; el.style.display = "block";
    setTimeout(() => el.style.display = "none", 1600);
  }, () => prompt("Copy manually:", t));
}

$("#a-safe").onclick = () => {
  const c = (CUR.steps || []).filter(s => s.risk === "safe").map(s => `# ${s.title}\n${fill(s.cmd, false)}`);
  copy(c.join("\n\n"), `${c.length} read-only commands copied`);
};

$("#a-esc").onclick = () => {
  const L = [`## ${CUR.title}`, "", "**What I checked**"];
  LOG.forEach(e => { L.push(`- ${e.step} — \`${e.cmd}\``); if (e.note) L.push(`  - saw: ${e.note}`); });
  if (!LOG.length) L.push("- (nothing recorded yet)");
  L.push("", "**Still needed**");
  (CUR.escalate || []).forEach(x => L.push(`- ${fill(x, false)}`));
  copy(L.join("\n"), "Handoff notes copied");
};

$("#a-log").onclick = () => {
  const L = [`# Incident: ${CUR.title}`, `Runbook: ${CUR.id} (verified ${CUR.verified_on || "n/a"})`, ""];
  Object.entries(CTX).filter(([, v]) => v).forEach(([k, v]) => L.push(`- ${k}: \`${v}\``));
  L.push("", "| time | check | command | observed |", "|---|---|---|---|");
  LOG.forEach(e => L.push(`| ${e.t} | ${e.step} | \`${e.cmd}\` | ${e.note || ""} |`));
  if (!LOG.length) L.push("| | no checks recorded | | |");
  copy(L.join("\n"), "Incident log copied as markdown");
};

/* ---------- navigation ---------- */
function home() {
  CUR = null; LOG = [];
  $("#searchview").style.display = "block";
  $("#results").style.display = "block";
  $("#rbview").style.display = "none";
  $("#bar").style.display = "none";
  $("#ctxfields").innerHTML = "";
  $("#foot").textContent = FOOT;
  $("#q").focus(); $("#q").select();
}

$("#q").oninput = renderResults;

document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); $("#q").select(); return; }
  if (e.key === "Escape" && CUR) { home(); return; }
  if (CUR || !["ArrowDown", "ArrowUp", "Enter"].includes(e.key)) return;
  const hits = [...document.querySelectorAll(".hit")];
  if (!hits.length) return;
  if (e.key === "Enter") { e.preventDefault(); hits[Math.max(0, CURSOR)].click(); return; }
  e.preventDefault();
  hits[CURSOR]?.classList.remove("cur");
  CURSOR = (CURSOR + (e.key === "ArrowDown" ? 1 : -1) + hits.length) % hits.length;
  hits[CURSOR].classList.add("cur");
  hits[CURSOR].scrollIntoView({ block: "nearest" });
});

const v = BANK.filter(r => r.tier === "verified").length;
const techs = [...new Set(BANK.map(r => r.technology))].sort();
const FOOT = `${v} verified runbook${v === 1 ? "" : "s"} across ${techs.join(", ")}. `
  + `Runs entirely in this file — nothing is sent anywhere, nothing is executed for you, `
  + `and nothing is saved when you close the tab. Every command is yours to run.\n\n`
  + `Designed and built by Dinesh Ilangovan. Every runbook marked verified was run `
  + `against a real system, with the date and version recorded on it.`;
$("#foot").textContent = FOOT;
renderChips();
renderResults();
</script>
</body>
</html>
