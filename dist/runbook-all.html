resh container shows the VM's current view."}],"causes":[{"id":"tz-display","cause":"Only the timezone display differs.","fix":"Set the TZ environment variable if local time matters. Storing UTC and formatting at the edge is better practice.","confirm":""},{"id":"host-drift","cause":"The host clock is wrong.","fix":"Fix time sync on the host. Containers cannot have a different clock from the kernel.","confirm":""},{"id":"vm-suspend","cause":"The Docker Desktop VM clock lagged after sleep.","fix":"Restart Docker Desktop. It resyncs on start.","confirm":""},{"id":"no-tzdata","cause":"The image has no timezone database.","fix":"Install tzdata if the application needs named zones. Alpine omits it by default.","confirm":""}],"verify":["Container time matches the host.","Timestamps in logs are correct.","Certificate and token validation succeeds."],"escalate":["date inside and outside the container","TZ setting inside","Host time sync status"]},{"id":"docker-multistage-artifact-missing","tier":"guide","technology":"Docker","category":"Build & Cache","title":"Final image is missing the built artifact","summary":"The build succeeds but the runtime image does not contain what the build stage produced.","aliases":["copy from not found","artifact missing","multistage copy","file missing final image","build output missing","stage not found"],"source":"https://docs.docker.com/build/building/multi-stage/","inputs":[{"key":"image","label":"Image","example":"registry.local/checkout-api:1.4.2"}],"steps":[{"title":"Check what the final image contains","cmd":"docker run --rm --entrypoint ls {image} -la /app","risk":"safe","look":"Whether the artifact is there. An empty directory means the COPY --from did not bring what you expected."},{"title":"Check what the build stage produced","cmd":"docker build --target build -t tmp-build . && docker run --rm --entrypoint ls tmp-build -la /app","risk":"safe","look":"Building only the earlier stage lets you inspect it directly. The path there must match the COPY source exactly."},{"title":"Check the stage names match","cmd":"findstr /C:\"AS \" /C:\"--from\" Dockerfile","risk":"safe","look":"Stage names are case-sensitive. A --from referring to a nonexistent stage is treated as an external image and silently pulls instead.","signals":[{"match":"--from=\\d","means":"Referring to a stage by index. Fragile — any reorder breaks it silently.","goto":"cause:index-reference"}]},{"title":"Check the working directory in each stage","cmd":"findstr /C:\"WORKDIR\" Dockerfile","risk":"safe","look":"WORKDIR does not carry between stages. A relative COPY source resolves differently than you might assume."}],"causes":[{"id":"wrong-path","cause":"The source path does not exist in the earlier stage.","fix":"Build with --target and inspect. Use absolute paths in COPY --from.","confirm":""},{"id":"stage-name-typo","cause":"The stage name does not match.","fix":"Names are case-sensitive. A typo makes Docker treat it as an image name and pull it.","confirm":""},{"id":"index-reference","cause":"Referring to a stage by number.","fix":"Name your stages. Index references break silently when stages are reordered.","confirm":""},{"id":"workdir-reset","cause":"WORKDIR does not persist across stages.","fix":"Use absolute paths.","confirm":""},{"id":"build-failed-silently","cause":"The build step produced nothing but exited zero.","fix":"Add a check in the build stage that fails if the artifact is absent.","confirm":""}],"verify":["The artifact is present in the final image.","The container starts and finds it.","The build fails loudly if the artifact goes missing."],"escalate":["Listing of the expected path in the final image","Listing from the build stage","The COPY --from lines"]},{"id":"docker-container-cannot-reach-host","tier":"guide","technology":"Docker","category":"Networking & DNS","title":"Container cannot reach a service on the host machine","summary":"Connecting to localhost from inside a container reaches the container, not the host.","aliases":["cannot reach host","host.docker.internal","localhost inside container","connection refused host","container to host","127.0.0.1 container"],"source":"https://docs.docker.com/desktop/features/networking/","inputs":[{"key":"container","label":"Container","example":"checkout-api"},{"key":"port","label":"Host port","example":"5432"}],"steps":[{"title":"Confirm what localhost means inside the container","cmd":"docker exec {container} sh -c \"getent hosts localhost; getent hosts host.docker.internal\"","risk":"safe","look":"Inside a container, localhost is the container itself. Reaching the host needs a different name entirely.","signals":[{"match":"host.docker.internal","means":"The special host alias resolves. Use it instead of localhost.","goto":"cause:use-host-internal"},{"match":"^\\s*$","means":"The alias does not resolve, so it is not configured on this platform.","goto":"cause:alias-missing"}]},{"title":"Check the host service is listening on all interfaces","cmd":"netstat -ano | findstr :{port}","risk":"safe","look":"A host service bound to 127.0.0.1 is unreachable from containers. It must bind 0.0.0.0 or the Docker bridge address."},{"title":"Test from inside the container","cmd":"docker exec {container} sh -c \"nc -zv host.docker.internal {port} 2>&1 || echo FAIL\"","risk":"safe","look":"Whether the path works. FAIL with the host listening on 0.0.0.0 points at the firewall."},{"title":"Check the Windows firewall","cmd":"netsh advfirewall firewall show rule name=all | findstr /C:\"{port}\"","risk":"safe","look":"Windows Defender frequently blocks the Docker bridge reaching host ports, and it does so silently."}],"causes":[{"id":"use-host-internal","cause":"localhost inside a container is the container.","fix":"Use host.docker.internal on Docker Desktop. On Linux add --add-host=host.docker.internal:host-gateway.","confirm":""},{"id":"bound-loopback","cause":"The host service listens only on 127.0.0.1.","fix":"Bind it to 0.0.0.0. Nothing outside the host can reach a loopback-only service.","confirm":""},{"id":"firewall","cause":"The host firewall blocks the bridge.","fix":"Allow inbound on that port from the Docker network range.","confirm":""},{"id":"alias-missing","cause":"host.docker.internal is not available.","fix":"On Linux it must be added explicitly at run time.","confirm":""},{"id":"should-be-container","cause":"The dependency should run in a container too.","fix":"Put both on a user-defined network and use the service name.","confirm":""}],"verify":["The container reaches the host service.","It works after both are restarted.","The approach is recorded in the compose file."],"escalate":["What localhost and host.docker.internal resolve to","What the host service binds to","Firewall rules for the port"]},{"id":"docker-env-not-passed","tier":"guide","technology":"Docker","category":"Container Lifecycle","title":"Environment variable is empty inside the container","summary":"The app behaves as if unconfigured because a variable never reached it.","aliases":["env not set","environment variable empty","env missing container","variable not passed","docker -e not working"],"source":"https://docs.docker.com/reference/cli/docker/container/run/#env","inputs":[{"key":"container","label":"Container","example":"checkout-api"},{"key":"var","label":"Variable","example":"DATABASE_URL"}],"steps":[{"title":"Check what the container actually has","cmd":"docker exec {container} printenv {var}","risk":"safe","look":"Empty output means it was never set. This is the ground truth and everything else is a theory.","signals":[{"match":"^\\s*$","means":"The variable is absent inside the container.","goto":"step:2"}]},{"title":"Check what was passed at creation","cmd":"docker inspect {container} --format '{{json .Config.Env}}'","risk":"safe","look":"Environment is fixed when the container is created. Changing the compose file afterwards has no effect until the container is recreated."},{"title":"Check whether the shell expanded it before Docker saw it","cmd":"echo $env:{var}","risk":"safe","look":"Passing -e VAR without a value forwards the shell's value. If the shell does not have it, Docker receives nothing."},{"title":"Recreate the container to pick up new values","cmd":"docker compose up -d --force-recreate {container}","risk":"state","look":"The new container has the variable. Confirm with printenv.","note":"Destroys and recreates the container. Anything written inside it but not to a volume is lost, and there is a brief outage while it restarts. Check what is mounted before running this."}],"causes":[{"id":"not-recreated","cause":"The container predates the change.","fix":"Environment is set at creation. Recreate it.","confirm":""},{"id":"shell-not-set","cause":"-e VAR relied on a shell value that was empty.","fix":"Pass -e VAR=value explicitly, or set it in the shell first.","confirm":""},{"id":"wrong-case","cause":"The name differs in case.","fix":"Environment variable names are case-sensitive on Linux.","confirm":""},{"id":"dockerfile-overwritten","cause":"An ENV in the Dockerfile sets it after your value.","fix":"Runtime -e wins over ENV, but a later ENTRYPOINT script can overwrite it.","confirm":""},{"id":"entrypoint-clears","cause":"The entrypoint script resets the variable.","fix":"Read the entrypoint. Some images normalise their environment on start.","confirm":""}],"verify":["printenv shows the value inside the container.","The application behaves as configured.","The value is in the compose file, not typed by hand."],"escalate":["printenv result","Config.Env from inspect","How the variable was passed"]},{"id":"docker-volume-data-lost","tier":"guide","technology":"Docker","category":"Storage & Disk","title":"Data disappeared after recreating a container","summary":"Restarting or recreating lost everything the application had written.","aliases":["data lost","volume gone","data not persisting","database empty after restart","anonymous volume","lost data container"],"source":"https://docs.docker.com/engine/storage/volumes/","inputs":[{"key":"container","label":"Container","example":"checkout-api"}],"steps":[{"title":"Check what the container had mounted","cmd":"docker inspect {container} --format '{{json .Mounts}}'","risk":"safe","look":"Type volume with a long hex Name is an anonymous volume. Those are easy to orphan and are the usual cause.","signals":[{"match":"\"Type\":\"volume\".*\"Name\":\"[0-9a-f]{32,}","means":"An anonymous volume. A new container gets a fresh empty one.","goto":"cause:anonymous-volume"},{"match":"\"Mounts\":\\[\\]","means":"No volumes at all. Everything lived in the writable layer and is gone.","goto":"cause:no-volume"}]},{"title":"Look for orphaned volumes holding the data","cmd":"docker volume ls -f dangling=true","risk":"safe","look":"Dangling volumes are not attached to any container. Your data may well still be in one of them."},{"title":"Inspect a candidate volume","cmd":"docker run --rm -v <volume-name>:/data alpine ls -la /data","risk":"safe","look":"Mounts the volume read-write into a throwaway container just to list it. If you recognise the contents, the data survived."},{"title":"Check the compose file declares named volumes","cmd":"findstr /C:\"volumes:\" docker-compose.yml","risk":"safe","look":"Named volumes persist across recreation. Anonymous ones are replaced, and a missing volumes section means nothing persists at all."}],"causes":[{"id":"no-volume","cause":"No volume was mounted.","fix":"The writable layer dies with the container. Declare a named volume for anything that matters.","confirm":""},{"id":"anonymous-volume","cause":"An anonymous volume was used.","fix":"Name it. Anonymous volumes are orphaned on recreation and quietly replaced.","confirm":""},{"id":"volume-pruned","cause":"A prune removed it.","fix":"docker volume prune deletes unattached volumes. Check whether it ran.","confirm":""},{"id":"wrong-path","cause":"The volume is mounted at the wrong path.","fix":"It must cover where the app actually writes. Check the image's documentation.","confirm":""},{"id":"compose-down-v","cause":"docker compose down -v was run.","fix":"-v deletes the project's volumes. It is not the same as down.","confirm":""}],"verify":["Data survives a full recreate.","Volumes are named and declared in the compose file.","A backup exists for anything irreplaceable."],"escalate":["The Mounts block","Whether dangling volumes hold the data","The compose volumes section"]},{"id":"docker-slow-bind-mount","tier":"guide","technology":"Docker","category":"Storage & Disk","title":"Bind-mounted files are very slow","summary":"Builds and file watching crawl when the source is bind-mounted from Windows.","aliases":["slow bind mount","slow volume windows","file watching slow","hot reload slow","docker desktop slow files","wsl performance"],"source":"https://docs.docker.com/desktop/features/wsl/","inputs":[{"key":"container","label":"Container","example":"checkout-api"}],"steps":[{"title":"Check where the mount comes from","cmd":"docker inspect {container} --format '{{json .Mounts}}'","risk":"safe","look":"A Source under /c/ or C:\\ crosses the Windows to Linux filesystem boundary on every operation. That crossing is the cost.","signals":[{"match":"/mnt/c/|C:\\\\\\\\|/host_mnt/","means":"Mounted from the Windows filesystem, which is slow through the VM boundary.","goto":"cause:cross-fs"}]},{"title":"Measure the difference","cmd":"docker exec {container} sh -c \"time ls -R /app | wc -l\"","risk":"safe","look":"Compare against the same command on a path inside the container. An order of magnitude difference confirms it."},{"title":"Check whether the project is inside WSL","cmd":"wsl -l -v","risk":"safe","look":"Files stored in the WSL filesystem rather than on C: avoid the boundary entirely and are dramatically faster."},{"title":"Check what is being watched","cmd":"docker exec {container} sh -c \"cat /proc/sys/fs/inotify/max_user_watches\"","risk":"safe","look":"File watchers across the boundary are especially slow because inotify events do not propagate natively."}],"causes":[{"id":"cross-fs","cause":"Files live on the Windows filesystem.","fix":"Move the project into the WSL filesystem. This is the single biggest improvement available.","confirm":""},{"id":"too-many-files","cause":"node_modules or similar is bind-mounted.","fix":"Keep dependencies in a named volume so they never cross the boundary.","confirm":""},{"id":"watcher-polling","cause":"The watcher polls because inotify does not work.","fix":"Enable polling explicitly with a sensible interval, or move to WSL.","confirm":""},{"id":"antivirus","cause":"Windows Defender scans every file access.","fix":"Exclude the project directory.","confirm":""},{"id":"should-copy","cause":"Development bind mount used in production.","fix":"Copy files into the image for production. Bind mounts are a development convenience.","confirm":""}],"verify":["File operations are fast.","Hot reload responds promptly.","The project location is documented for the team."],"escalate":["The mount source path","Timing comparison inside and outside the mount","Whether the project is on WSL or C:"]},{"id":"docker-context-wrong","tier":"guide","technology":"Docker","category":"Daemon","title":"Commands hit the wrong Docker engine","summary":"Containers you created are invisible, or commands affect a remote host unexpectedly.","aliases":["wrong docker context","containers missing","docker context","remote docker","cannot see containers","context switch"],"source":"https://docs.docker.com/engine/manage-resources/contexts/","inputs":[],"steps":[{"title":"Show which context is active","cmd":"docker context ls","risk":"safe","look":"The asterisk marks the active one, with its endpoint. A remote endpoint means your commands leave this machine.","signals":[{"match":"\\*.*ssh://|\\*.*tcp://","means":"The active context points at a remote engine.","goto":"cause:remote-context"},{"match":"\\*.*desktop-linux","means":"Docker Desktop's own context, which is normal on Windows.","goto":""}]},{"title":"Check for an overriding environment variable","cmd":"echo $env:DOCKER_HOST $env:DOCKER_CONTEXT","risk":"safe","look":"DOCKER_HOST overrides the context entirely and silently. A leftover value in a shell profile causes exactly this."},{"title":"Confirm which engine answered","cmd":"docker info --format '{{.Name}} {{.OperatingSystem}}'","risk":"safe","look":"The engine's own identity. If that is not the machine you expect, you are talking to something else."},{"title":"Switch back to the default","cmd":"docker context use default","risk":"state","look":"docker context ls shows the asterisk on default, and docker ps shows what you expect.","note":"Changes the target engine for every subsequent docker command from this user account. Containers on the previous engine keep running but become invisible here until you switch back. On a remote engine, anything you started there is still running and still costing money."}],"causes":[{"id":"remote-context","cause":"The active context targets a remote engine.","fix":"Switch to default. Check what you may have created on the remote host.","confirm":""},{"id":"docker-host-set","cause":"DOCKER_HOST is set in the environment.","fix":"Unset it. It overrides the context with no warning.","confirm":""},{"id":"wrong-os","cause":"Windows containers mode instead of Linux.","fix":"Switch modes in Docker Desktop. Linux images cannot run in Windows mode.","confirm":""},{"id":"multiple-desktops","cause":"Several engines on the machine.","fix":"Name the contexts clearly so the active one is obvious.","confirm":""}],"verify":["docker ps shows the containers you expect.","The active context is intentional.","Nothing was left running on a remote engine."],"escalate":["Output of docker context ls","Whether DOCKER_HOST is set","Which engine docker info reports"]},{"id":"docker-layer-secret-leak","tier":"guide","technology":"Docker","category":"Images","title":"Secrets are baked into the image","summary":"Credentials used during build remain recoverable from the image layers.","aliases":["secret in image","credentials in layer","token in image","build secret","leaked credentials docker","remove secret layer"],"source":"https://docs.docker.com/build/building/secrets/","inputs":[{"key":"image","label":"Image","example":"registry.local/checkout-api:1.4.2"}],"steps":[{"title":"Search the layer history for secrets","cmd":"docker history --no-trunc {image} | findstr /I \"token password secret key\"","risk":"safe","look":"Build arguments and RUN commands are recorded in the history in plain text. Anyone with the image can read them.","signals":[{"match":"ARG|ENV.*(?:TOKEN|PASSWORD|SECRET)","means":"A secret was passed as a build argument and is in the metadata.","goto":"cause:build-arg"}]},{"title":"Search the filesystem in the image","cmd":"docker run --rm --entrypoint sh {image} -c \"ls -la /root/.npmrc /root/.docker /root/.aws 2>/dev/null; echo done\"","risk":"safe","look":"Credential files copied during build. Deleting them in a later layer does not remove them from the earlier one."},{"title":"Check for a secret deleted in a later layer","cmd":"docker history {image} | findstr /C:\"rm \"","risk":"safe","look":"An rm in a later instruction does not remove data from an earlier layer. The file is still extractable from the image."},{"title":"Confirm the image was pushed","cmd":"docker image inspect {image} --format '{{.RepoDigests}}'","risk":"safe","look":"A digest means it was pushed to a registry. Anyone with pull access has the secret and rotation is not optional."}],"causes":[{"id":"build-arg","cause":"A secret was passed via ARG.","fix":"Build arguments are stored in image metadata. Use BuildKit secret mounts instead.","confirm":""},{"id":"copied-credentials","cause":"A credentials file was copied in.","fix":"Use a secret mount, which is never persisted to a layer.","confirm":""},{"id":"deleted-later","cause":"The secret was deleted in a later layer.","fix":"It remains in the earlier layer. Multi-stage builds avoid this properly.","confirm":""},{"id":"must-rotate","cause":"The image was pushed.","fix":"Treat the secret as leaked and rotate it. Removing the image does not undo distribution.","confirm":""}],"verify":["No secret appears in history or in the filesystem.","Build secrets use mounts.","Anything exposed has been rotated."],"escalate":["What the history search found","Whether the image was pushed","Which secrets need rotation"]},{"id":"docker-container-high-cpu","tier":"guide","technology":"Docker","category":"Performance","title":"Container consuming excessive CPU","summary":"One container dominates the host and everything else slows down.","aliases":["container high cpu","docker cpu 100","container slow host","cpu limit docker","throttling container"],"source":"https://docs.docker.com/engine/containers/resource_constraints/","inputs":[{"key":"container","label":"Container","example":"checkout-api"}],"steps":[{"title":"Watch live resource usage","cmd":"docker stats --no-stream","risk":"safe","look":"CPU percentage per container. Over 100% means multiple cores. Compare against the limit, not against 100.","signals":[{"match":"\\d{3,}\\.\\d+%","means":"Using more than one core. Check whether a limit is set at all.","goto":"cause:no-limit"}]},{"title":"Check what limits are configured","cmd":"docker inspect {container} --format 'cpus={{.HostConfig.NanoCpus}} quota={{.HostConfig.CpuQuota}}'","risk":"safe","look":"Zero means unlimited, so the container can take the whole host. That is the default and it is rarely what you want."},{"title":"Look at what is running inside","cmd":"docker top {container}","risk":"safe","look":"The processes. A runaway worker or a busy loop is usually obvious from the process list alone."},{"title":"Apply a CPU limit","cmd":"docker update --cpus=2 {container}","risk":"state","look":"docker stats shows usage capped near the new limit.","note":"Changes the limit on the running container immediately. If the application genuinely needs more, throttling it will make it slower and may cause timeouts or failed health checks. Measure the real requirement before choosing a number."}],"causes":[{"id":"no-limit","cause":"No CPU limit is set.","fix":"Set --cpus. An unlimited container can starve everything else on the host.","confirm":""},{"id":"runaway-process","cause":"A process inside is looping.","fix":"Identify it from docker top and fix the application.","confirm":""},{"id":"gc-pressure","cause":"Garbage collection dominates.","fix":"The runtime may be sized against the host rather than the container. Set explicit heap limits.","confirm":""},{"id":"too-many-workers","cause":"The worker count was derived from host cores.","fix":"Configure it explicitly. Many runtimes read host core count, not the cgroup limit.","confirm":""},{"id":"genuinely-busy","cause":"The work really needs that much CPU.","fix":"Scale out rather than throttling a single container.","confirm":""}],"verify":["CPU usage is proportional to the work.","A limit exists.","Other containers are unaffected."],"escalate":["docker stats output","Configured limits","Process list inside the container"]},{"id":"docker-build-secret-mount","tier":"guide","technology":"Docker","category":"Build & Cache","title":"Build needs credentials without baking them in","summary":"A private dependency needs auth during build but the token must not end up in the image.","aliases":["build secret","private npm build","pip private index","ssh key build","credentials during build","buildkit secret"],"source":"https://docs.docker.com/build/building/secrets/","inputs":[],"steps":[{"title":"Check whether BuildKit is active","cmd":"docker buildx version","risk":"safe","look":"Secret mounts require BuildKit. Without it the only options leave the credential in a layer."},{"title":"Check how the credential is currently passed","cmd":"findstr /S /C:\"ARG\" /C:\"COPY .npmrc\" /C:\"ENV\" Dockerfile","risk":"safe","look":"ARG and COPY both persist into the image. Anything visible here is recoverable from the built image.","signals":[{"match":"ARG.*TOKEN|ARG.*PASSWORD","means":"A build argument carrying a secret. It is stored in image metadata.","goto":"cause:arg-leak"},{"match":"COPY.*npmrc|COPY.*netrc","means":"A credentials file copied in. It remains in that layer.","goto":"cause:copied-file"}]},{"title":"Use a secret mount instead","cmd":"docker build --secret id=npm,src=$HOME/.npmrc -t myimage .","risk":"safe","look":"The file is available only during that RUN instruction and is never written to a layer. The Dockerfile uses a mount=type=secret flag on the RUN line."},{"title":"Verify nothing leaked","cmd":"docker history --no-trunc myimage | findstr /I \"token npmrc\"","risk":"safe","look":"Empty output means the secret did not persist. Check the filesystem too if the build wrote it anywhere."}],"causes":[{"id":"arg-leak","cause":"A secret passed via ARG is in image metadata.","fix":"Switch to a secret mount. Rotate the token that was exposed.","confirm":""},{"id":"copied-file","cause":"A credentials file was copied into a layer.","fix":"Use a secret mount. Deleting it later does not remove it.","confirm":""},{"id":"no-buildkit","cause":"BuildKit is disabled.","fix":"Enable it. Secret mounts are not available otherwise.","confirm":""},{"id":"already-pushed","cause":"The image with the secret was pushed.","fix":"Rotate the credential. Assume it is public.","confirm":""}],"verify":["The build succeeds without the secret in any layer.","docker history shows nothing sensitive.","Exposed credentials were rotated."],"escalate":["How the credential is passed","Whether BuildKit is in use","Result of the history search"]},{"id":"docker-registry-push-fails","tier":"guide","technology":"Docker","category":"Registry & Auth","title":"docker push fails","summary":"The image builds but will not upload.","aliases":["push denied","push failed","cannot push image","unauthorized push","blob upload unknown","push timeout"],"source":"https://docs.docker.com/reference/cli/docker/image/push/","inputs":[{"key":"image","label":"Image","example":"registry.local/checkout-api:1.4.2"}],"steps":[{"title":"Read the push failure","cmd":"docker push {image}","risk":"safe","look":"Denied, unauthorized and blob errors are three different problems.","signals":[{"match":"denied: requested access","means":"Authenticated but not permitted to write to this repository.","goto":"cause:no-write-access"},{"match":"unauthorized|authentication required","means":"Not logged in to this registry.","goto":"cause:not-logged-in"},{"match":"blob upload unknown|blob upload invalid","means":"The upload was interrupted or the registry has a storage problem.","goto":"cause:blob-error"},{"match":"name unknown|repository does not exist","means":"The repository must be created first on this registry.","goto":"cause:repo-missing"}]},{"title":"Check the tag matches the registry","cmd":"docker image inspect {image} --format '{{.RepoTags}}'","risk":"safe","look":"The tag must include the registry host, or Docker pushes to Docker Hub by default. That is the most common surprise."},{"title":"Confirm you can authenticate","cmd":"docker login <registry>","risk":"safe","look":"A successful login proves credentials. Push can still fail on repository-level permission, which is a different grant."},{"title":"Check image size against registry limits","cmd":"docker image inspect {image} --format '{{.Size}}'","risk":"safe","look":"Some registries reject very large layers. A timeout mid-push on a huge image points here rather than at auth."}],"causes":[{"id":"not-logged-in","cause":"No credentials for this registry.","fix":"docker login. Tokens expire.","confirm":""},{"id":"no-write-access","cause":"Read access but not write.","fix":"Ask for push permission on that repository path.","confirm":""},{"id":"repo-missing","cause":"The repository does not exist.","fix":"Some registries require creating it first rather than on first push.","confirm":""},{"id":"wrong-tag","cause":"The tag has no registry prefix.","fix":"Retag with the full registry host.","confirm":""},{"id":"blob-error","cause":"Upload was interrupted.","fix":"Retry. Persistent failures point at registry storage.","confirm":""}],"verify":["The push completes and reports a digest.","The image is pullable from another machine."],"escalate":["The push error verbatim","The full image tag","Whether login succeeds"]},{"id":"docker-container-cannot-write-tmp","tier":"guide","technology":"Docker","category":"Storage & Disk","title":"Container fails writing to a temporary path","summary":"The app errors on /tmp or a cache directory it expects to be writable.","aliases":["cannot write tmp","read-only tmp","no space tmp","tmpfs full","cache directory error"],"source":"https://docs.docker.com/engine/storage/tmpfs/","inputs":[{"key":"container","label":"Container","example":"checkout-api"}],"steps":[{"title":"Check whether the rootfs is read-only","cmd":"docker inspect {container} --format 'ro={{.HostConfig.ReadonlyRootfs}} tmpfs={{json .HostConfig.Tmpfs}}'","risk":"safe","look":"A read-only rootfs with no tmpfs means every temp write fails by design.","signals":[{"match":"ro=true","means":"The root filesystem is read-only. Temp paths need an explicit mount.","goto":"cause:readonly-no-tmpfs"}]},{"title":"Check space inside the container","cmd":"docker exec {container} df -h /tmp","risk":"safe","look":"A tmpfs has a fixed size, often much smaller than the host disk. Filling it produces a no-space error that looks like a host problem."},{"title":"Check ownership of the path","cmd":"docker exec {container} ls -ld /tmp","risk":"safe","look":"A non-root user needs write permission. A tmpfs mounted without the right mode can exclude the app's user."}],"causes":[{"id":"readonly-no-tmpfs","cause":"Read-only rootfs with no writable temp.","fix":"Add --tmpfs /tmp. Keep the rootfs read-only.","confirm":""},{"id":"tmpfs-too-small","cause":"The tmpfs size limit was reached.","fix":"Raise the size, or write less. tmpfs consumes RAM.","confirm":""},{"id":"wrong-ownership","cause":"The user cannot write to the path.","fix":"Set the mode on the tmpfs mount, or run as a user that owns it.","confirm":""},{"id":"app-assumes-disk","cause":"The app writes large temp files.","fix":"Mount a real volume rather than a tmpfs for anything large.","confirm":""}],"verify":["The application writes successfully.","The rootfs stays read-only.","tmpfs size is sufficient."],"escalate":["Read-only and tmpfs settings","Space and ownership on the path","What the app writes there"]},{"id":"docker-zombie-processes","tier":"guide","technology":"Docker","category":"Container Lifecycle","title":"Zombie processes accumulate in a container","summary":"Defunct processes build up because PID 1 does not reap children.","aliases":["zombie processes container","defunct","pid 1 init","tini","process not reaped","zombies docker"],"source":"https://docs.docker.com/engine/containers/multi-service_container/","inputs":[{"key":"container","label":"Container","example":"checkout-api"}],"steps":[{"title":"Count the zombies","cmd":"docker exec {container} sh -c \"ps -eo stat,ppid,cmd | grep -c '^Z'\"","risk":"safe","look":"A growing count means PID 1 is not reaping. Each zombie holds a process table entry until it is."},{"title":"See what PID 1 actually is","cmd":"docker exec {container} ps -p 1 -o comm=","risk":"safe","look":"A shell or an application as PID 1 usually does not reap. An init process does.","signals":[{"match":"sh|bash","means":"A shell as PID 1 does not reap orphaned children.","goto":"cause:shell-pid1"},{"match":"tini|dumb-init|docker-init","means":"A proper init is present. Zombies here point at the application.","goto":"cause:app-not-reaping"}]},{"title":"Check whether init is enabled","cmd":"docker inspect {container} --format '{{.HostConfig.Init}}'","risk":"safe","look":"The --init flag inserts a minimal init as PID 1 that reaps orphans automatically."},{"title":"Recreate with an init process","cmd":"docker run --init ...","risk":"state","look":"ps -p 1 shows docker-init and the zombie count stays at zero.","note":"Requires recreating the container, so it restarts and anything in the writable layer is lost. The change is otherwise harmless: --init only inserts a tiny process reaper as PID 1."}],"causes":[{"id":"shell-pid1","cause":"A shell is PID 1 and does not reap.","fix":"Use --init, or exec the real process so it replaces the shell.","confirm":""},{"id":"app-not-reaping","cause":"The application spawns children and ignores SIGCHLD.","fix":"Handle it in the app, or run under an init.","confirm":""},{"id":"shell-form-cmd","cause":"CMD in shell form wraps the process in a shell.","fix":"Use exec form so the application becomes PID 1 directly.","confirm":""},{"id":"many-execs","cause":"Frequent docker exec leaves orphans.","fix":"--init reaps these too.","confirm":""}],"verify":["Zombie count stays at zero.","PID 1 is an init or the real application.","The process table does not grow."],"escalate":["Zombie count over time","What PID 1 is","Whether --init is enabled"]},{"id":"docker-image-tag-confusion","tier":"guide","technology":"Docker","category":"Images","title":"Running an older image than expected","summary":"Changes do not appear because a stale image with the same tag is being used.","aliases":["old image running","latest not updating","stale image","tag not updated","changes not showing docker"],"source":"https://docs.docker.com/engine/manage-resources/pruning/","inputs":[{"key":"container","label":"Container","example":"checkout-api"},{"key":"image","label":"Image","example":"registry.local/checkout-api:1.4.2"}],"steps":[{"title":"Compare the running image digest against the registry","cmd":"docker inspect {container} --format '{{.Image}}' && docker image inspect {image} --format '{{.Id}} {{.RepoDigests}}'","risk":"safe","look":"Different IDs mean the container runs an older build than the local tag points at.","signals":[{"match":"sha256:\\w+\\s+\\[\\]","means":"No repo digest, so this image was built locally and never pushed.","goto":"cause:local-only"}]},{"title":"Check when the local image was built","cmd":"docker image inspect {image} --format '{{.Created}}'","risk":"safe","look":"An old creation date with a fresh tag means the pull did not happen or brought nothing new."},{"title":"Check the pull policy in use","cmd":"docker inspect {container} --format '{{.Config.Image}}'","risk":"safe","look":"docker run uses a local image if the tag exists, without checking the registry. Only an explicit pull refreshes it."},{"title":"Force a fresh pull","cmd":"docker pull {image}","risk":"state","look":"The digest changes. Recreate the container to actually use it.","note":"Downloads the current image for that tag and moves the local tag to it. The running container keeps the old image until recreated, and the old image remains on disk until pruned. On a mutable tag this can bring a different build than the one you tested."}],"causes":[{"id":"mutable-tag","cause":"A tag like latest was reused for a new build.","fix":"Pin by digest, or use immutable version tags.","confirm":""},{"id":"no-pull","cause":"Docker used the cached local image.","fix":"Pull explicitly, or use --pull always on run.","confirm":""},{"id":"local-only","cause":"The image was built locally and never pushed.","fix":"Push it, or build on the machine that runs it.","confirm":""},{"id":"not-recreated","cause":"The container predates the new image.","fix":"Recreate it. Pulling alone changes nothing running.","confirm":""},{"id":"cache-hit","cause":"The build reused a cached layer with old source.","fix":"Check the build context actually included your changes.","confirm":""}],"verify":["The running container uses the intended build.","Tags are immutable or pinned by digest."],"escalate":["Running image ID against the local tag","Image creation date","Whether it was pushed"]},{"id":"git-committed-to-main","tier":"guide","technology":"Git","category":"History & Undo","title":"I committed to main by mistake","summary":"The commit is on the wrong branch. What you do next depends entirely on whether it has been pushed.","aliases":["committed to main","wrong branch","committed accidentally","undo commit","committed by mistake","move commit to branch","oops committed"],"source":"https://git-scm.com/docs/git-reset","inputs":[{"key":"branch","label":"Branch you meant to use","example":"feature/checkout-retry"},{"key":"remote","label":"Remote","example":"origin"}],"steps":[{"title":"Find out whether the commit has left your machine","cmd":"git status -sb && git log --oneline -3","risk":"safe","look":"The first line. 'ahead 1' means it is still local and you have easy options. If it is not ahead, it is already on the remote and rewriting is now other people's problem too.","signals":[{"match":"ahead \\d+","means":"Still local. You can move it cleanly.","goto":"cause:local-only"},{"match":"\\[origin/main\\]\\s*$","means":"Already pushed. Do not rewrite shared history.","goto":"cause:already-pushed"}]},{"title":"Move the commit onto the branch it belonged on","cmd":"git branch {branch} && git reset --hard HEAD~1 && git switch {branch}","risk":"destructive","note":"reset --hard discards every uncommitted change in your working tree. Run git stash first if you have any. This is only safe because git branch {branch} was created on the line before, so the commit itself survives on that branch.","look":"After this, main is back where it was and your commit sits on {branch}.","signals":[{"match":"(?i)error: .*already exists","means":"That branch already exists. Pick another name or switch to it and cherry-pick instead.","goto":"cause:branch-exists"}]},{"title":"Confirm nothing was lost","cmd":"git log --oneline -3 {branch} && git log --oneline -3 main","risk":"safe","look":"Your commit on {branch}, and main matching the remote. If anything looks wrong, git reflog still has every prior position for about 90 days."}],"causes":[{"id":"local-only","cause":"The commit exists only in your clone.","fix":"Create the branch at the current commit, then reset main back one. Nobody else is affected.","confirm":"git status -sb"},{"id":"already-pushed","cause":"The commit is on the remote and others may have pulled it.","fix":"Do not reset and force-push. Use git revert to add a new commit that undoes it, then apply the original work on a proper branch.","confirm":"git log --oneline {remote}/main -3"},{"id":"branch-exists","cause":"A branch with that name is already present.","fix":"Switch to it and cherry-pick the commit across, then reset main.","confirm":"git branch --list {branch}"}],"verify":["git log on main matches the remote's main.","Your commit appears in git log on {branch}.","git status reports a clean working tree, or exactly the changes you stashed."],"escalate":["Output of git status -sb","git log --oneline -5 for both branches","Whether the commit was pushed, and whether anyone has pulled since"]},{"id":"git-force-push-safely","tier":"guide","technology":"Git","category":"Remotes","title":"I need to force-push a rebased branch","summary":"Rewriting a shared branch can silently destroy a colleague's commits. There is a safe form of this command.","aliases":["force push","push -f","rebase then push","force-with-lease","non-fast-forward","rejected push"],"source":"https://git-scm.com/docs/git-push","inputs":[{"key":"branch","label":"Branch","example":"feature/checkout-retry"},{"key":"remote","label":"Remote","example":"origin"}],"steps":[{"title":"Check whether anyone else has pushed to this branch","cmd":"git fetch {remote} && git log --oneline {remote}/{branch} -5","risk":"safe","look":"Commits you do not recognise. If someone else's work is on this branch, a force-push will delete it and they will not get a warning.","signals":[{"match":"(?i)commit","means":"Read the author of each. Anything not yours means stop and talk to them first.","goto":"cause:shared-branch"}]},{"title":"Force-push, but only if the remote is where you last saw it","cmd":"git push --force-with-lease={branch} {remote} {branch}","risk":"destructive","note":"This rewrites remote history. --force-with-lease aborts if someone pushed since your last fetch, which plain --force does not. Never use plain --force on a shared branch. If this is a protected branch, it should be rejected by policy, not by your judgement.","look":"A forced update line. If it is rejected with 'stale info', someone pushed after your fetch and the lease did its job.","signals":[{"match":"(?i)stale info|rejected","means":"The lease saved you. Someone pushed after your last fetch. Fetch again and re-examine before retrying.","goto":"cause:raced"},{"match":"(?i)protected branch|pre-receive hook declined","means":"Branch protection blocked it. That is working as intended; open a PR instead.","goto":"cause:protected"}]}],"causes":[{"id":"shared-branch","cause":"Other people have commits on this branch.","fix":"Do not force-push. Merge their work in, or coordinate a window with them first.","confirm":"git log --format='%an %s' {remote}/{branch} -10"},{"id":"raced","cause":"Someone pushed between your fetch and your push.","fix":"Fetch, inspect what arrived, rebase onto it, then retry with --force-with-lease.","confirm":"git fetch {remote} && git log --oneline {remote}/{branch} -5"},{"id":"protected","cause":"Branch protection rules forbid force-push.","fix":"Open a pull request. If the rewrite is genuinely required, it needs a repo admin, not a workaround.","confirm":"git ls-remote {remote} {branch}"}],"verify":["{remote}/{branch} points at your intended commit.","No commits by other authors disappeared from the log.","CI on the branch is green after the rewrite."],"escalate":["git log --oneline of local and remote branch","The exact push output including any rejection reason","Whether the branch is protected and who owns it"]},{"id":"git-merge-conflict","tier":"guide","technology":"Git","category":"Merging","title":"Merge or rebase stopped with conflicts","summary":"Git cannot combine two changes automatically and is waiting for you to decide.","aliases":["merge conflict","conflict","both modified","fix conflicts and run commit","rebase conflict","unmerged paths"],"source":"https://git-scm.com/docs/git-merge","inputs":[{"key":"branch","label":"Branch being merged","example":"main"}],"steps":[{"title":"See exactly which files are unmerged","cmd":"git status --short","risk":"safe","look":"Lines starting UU are both-modified. AA is both-added, DU and UD are delete-versus-modify, which need a decision rather than an edit.","signals":[{"match":"^UU ","means":"Both sides changed the same file. Edit it and resolve.","goto":"cause:both-modified"},{"match":"^(DU|UD) ","means":"One side deleted what the other changed. Neither version is automatically right.","goto":"cause:delete-modify"}]},{"title":"Understand which operation you are inside","cmd":"git status | head -3","risk":"safe","look":"Rebase and merge resolve identically but finish differently. Finishing the wrong way is where people lose work."},{"title":"See both sides of a conflicting file","cmd":"git diff --diff-filter=U","risk":"safe","look":"The conflict markers with both versions. The section above ======= is your current branch, below it is what you are bringing in."},{"title":"Abort and return to where you started","cmd":"git merge --abort","risk":"destructive","look":"A clean working tree back at the pre-merge commit. This is always safe for committed history, and is the right move when a merge has gone badly.","note":"Discards the entire in-progress merge and any conflict resolution you have done so far. Committed work is untouched, but unsaved resolution effort is lost. Inside a rebase, the equivalent is git rebase --abort."}],"causes":[{"id":"both-modified","cause":"Both branches changed the same lines.","fix":"Edit the file to the intended final state, remove the markers, git add it, then continue.","confirm":""},{"id":"delete-modify","cause":"One branch deleted a file the other modified.","fix":"Decide deliberately: git rm to accept the deletion, or git add to keep the modified version.","confirm":""},{"id":"wrong-finish","cause":"Finished a rebase with git commit instead of git rebase --continue.","fix":"Inside a rebase always use git rebase --continue. Inside a merge, git commit is correct.","confirm":""}],"verify":["git status reports a clean tree with no unmerged paths.","The build and tests pass on the merged result.","Neither side's intent was silently dropped."],"escalate":["git status --short output","Whether it is a merge or a rebase","Which files conflicted and how each was resolved"]},{"id":"git-detached-head","tier":"guide","technology":"Git","category":"Branches","title":"You are in detached HEAD state","summary":"Commits made here belong to no branch and become unreachable when you switch away.","aliases":["detached head","not on any branch","head detached at","lost my commits","commits disappeared after checkout"],"source":"https://git-scm.com/docs/git-checkout","inputs":[{"key":"branch","label":"Branch to keep the work on","example":"feature/fix-checkout"}],"steps":[{"title":"Confirm the state and whether you have made commits","cmd":"git status -sb && git log --oneline -5","risk":"safe","look":"'HEAD detached at' confirms it. If the log shows commits you made here, they exist but nothing points at them yet.","signals":[{"match":"(?i)HEAD detached","means":"Detached. Any commits here need a branch before you move.","goto":"cause:detached"}]},{"title":"Create a branch at your current position","cmd":"git switch -c {branch}","risk":"safe","look":"Your commits are now on a real branch and safe. Do this before anything else, and before switching away."},{"title":"If you already switched away and lost them, find them in reflog","cmd":"git reflog -20","risk":"safe","look":"Every position HEAD has held, with its SHA. Detached commits remain here for about ninety days, so almost nothing is truly lost."},{"title":"Recover a specific lost commit","cmd":"git branch recovered <sha-from-reflog>","risk":"state","look":"A branch named recovered holding the work. Verify with git log before relying on it.","note":"Creates a new branch pointing at that commit. Nothing existing is modified and no history is rewritten, but pick the SHA carefully or you will branch from the wrong point."}],"causes":[{"id":"detached","cause":"HEAD points at a commit rather than a branch.","fix":"Create a branch here with git switch -c. Do it before switching away.","confirm":""},{"id":"already-switched","cause":"You left detached HEAD and the commits seem gone.","fix":"They are in the reflog. Find the SHA and branch from it.","confirm":""},{"id":"intentional","cause":"You checked out a tag or old commit deliberately.","fix":"Fine as long as you make no commits. If you do, branch first.","confirm":""}],"verify":["git status shows you on a named branch.","git log on that branch contains your commits.","The branch is pushed, or you know it is local only."],"escalate":["git status -sb output","git reflog around the time the work was done","Which commits are missing"]},{"id":"git-large-file-rejected","tier":"guide","technology":"Git","category":"Remotes","title":"Push rejected for file size","summary":"The remote refuses a file over its limit. Deleting it in a new commit does not help; it is still in history.","aliases":["file too large","push rejected size","large file","gh001","exceeds file size limit","git lfs"],"source":"https://docs.github.com/en/repositories/working-with-files/managing-large-files","inputs":[{"key":"file","label":"The oversized file","example":"data/dump.sql"}],"steps":[{"title":"Read the rejection and identify the file and commit","cmd":"git push 2>&1 | more","risk":"safe","look":"The remote names the file and the commit that introduced it. That commit is what must change, not your latest one.","signals":[{"match":"(?i)exceeds|too large|GH001","means":"Size limit. The file is embedded in history and must be removed from it.","goto":"cause:in-history"}]},{"title":"Find the largest objects actually in history","cmd":"git rev-list --objects --all | git cat-file --batch-check=\"%(objecttype) %(objectname) %(objectsize) %(rest)\" | findstr blob","risk":"safe","look":"Sizes are in bytes. This shows what is really in the repository, which is often not what you expected."},{"title":"If it is only in your last commit, remove it there","cmd":"git rm --cached {file} && git commit --amend --no-edit","risk":"destructive","look":"git show --stat no longer lists the file. The file remains on disk because only the index entry was removed.","note":"Rewrites your most recent commit. Safe if that commit has not been pushed. If it has been pushed and others have pulled it, do not amend — the file needs removing from shared history through a coordinated rewrite instead."}],"causes":[{"id":"in-history","cause":"The file is in an earlier commit, so deleting it now changes nothing.","fix":"It must be removed from history. For a single unpushed commit, amend. For anything shared, coordinate a rewrite with the repository owner.","confirm":""},{"id":"should-be-lfs","cause":"The file is a legitimate large asset.","fix":"Track it with Git LFS and add the pattern to .gitattributes before committing it again.","confirm":""},{"id":"should-not-be-committed","cause":"A build artifact or database dump got committed.","fix":"Add it to .gitignore. Artifacts belong in a registry, not in Git.","confirm":""}],"verify":["The push is accepted.","The repository size is reasonable for a fresh clone.",".gitignore or .gitattributes prevents a recurrence."],"escalate":["The verbatim rejection message","Which commit introduced the file","Whether that commit has been pushed and pulled by others"]},{"id":"git-wrong-author","tier":"guide","technology":"Git","category":"History & Undo","title":"Commits show the wrong author or email","summary":"Work commits attributed to a personal address, or the reverse. Usually a missing per-repository config.","aliases":["wrong author","wrong email commit","commits not showing github","unverified commit","wrong git config","author email"],"source":"https://git-scm.com/docs/git-config","inputs":[{"key":"email","label":"Correct email","example":"dinesh@example.com"},{"key":"name","label":"Correct name","example":"Dinesh Ilangovan"}],"steps":[{"title":"See what identity the recent commits carry","cmd":"git log --format='%h %an <%ae>' -5","risk":"safe","look":"The email is what matters for attribution on the hosting side. The display name is cosmetic."},{"title":"See which config is being used and from where","cmd":"git config --show-origin user.email && git config --show-origin user.name","risk":"safe","look":"The file path in the output tells you whether this is global or repository-local. A missing local value means the global one applies."},{"title":"Set the correct identity for this repository only","cmd":"git config user.email \"{email}\" && git config user.name \"{name}\"","risk":"state","look":"git config --show-origin now points at the repository's own config file.","note":"Writes to .git/config for this repository only. Existing commits are unaffected — this changes future commits, nothing more. Setting it locally is the right move when you mix work and personal repositories on one machine."},{"title":"Fix the identity on the most recent commit","cmd":"git commit --amend --reset-author --no-edit","risk":"destructive","look":"git log shows the corrected author on the top commit.","note":"Rewrites the last commit, changing its SHA. Safe while unpushed. If it has been pushed, this creates a divergence that requires a force-push, which rewrites shared history."}],"causes":[{"id":"no-local-config","cause":"No repository-local identity, so a global one applied.","fix":"Set user.email locally in each work repository. Consider clearing the global value so it can never apply silently.","confirm":""},{"id":"already-pushed","cause":"The wrong-author commits are already on the remote.","fix":"Leave them. Rewriting shared history to fix a display name is not a worthwhile trade.","confirm":""},{"id":"unverified","cause":"The email is right but commits show as unverified.","fix":"That is signing, not authorship. Set up commit signing separately.","confirm":""}],"verify":["New commits carry the correct author.","git config --show-origin points at the local config.","No shared history was rewritten to achieve it."],"escalate":["git log with author format","Output of git config --show-origin for user.email","Whether the affected commits are pushed"]},{"id":"git-non-fast-forward","tier":"guide","technology":"Git","category":"Remotes","title":"Push rejected as non-fast-forward","summary":"The remote has commits you do not have locally. Fetch and integrate before pushing.","aliases":["non-fast-forward","push rejected","updates were rejected","fetch first","remote contains work","rejected behind"],"source":"https://git-scm.com/docs/git-push","inputs":[{"key":"branch","label":"Branch","example":"main"},{"key":"remote","label":"Remote","example":"origin"}],"steps":[{"title":"See how far the branches have diverged","cmd":"git fetch {remote} && git status -sb","risk":"safe","look":"The ahead and behind counts. Behind only means a simple pull; both ahead and behind means real divergence that needs a decision.","signals":[{"match":"behind \\d+\\] *$","means":"Only behind. A pull will fast-forward cleanly.","goto":"cause:simply-behind"},{"match":"ahead \\d+, behind \\d+","means":"Diverged. You must choose merge or rebase.","goto":"cause:diverged"}]},{"title":"See exactly which commits are on each side","cmd":"git log --oneline --left-right {remote}/{branch}...HEAD","risk":"safe","look":"Arrows point to which side each commit is on. Read the remote-side commits before deciding; someone else wrote them."},{"title":"Bring the remote work in beneath yours","cmd":"git pull --rebase {remote} {branch}","risk":"state","look":"git status shows ahead only. Conflicts may pause the rebase; resolve then continue.","note":"Replays your local commits on top of the remote ones, which rewrites their SHAs. Safe for commits you have not pushed. If any of your local commits are already public elsewhere, use a merge instead so their identity does not change."},{"title":"Push once it is a fast-forward","cmd":"git push {remote} {branch}","risk":"safe","look":"The push is accepted. If it is rejected again, someone pushed while you were rebasing; fetch and repeat."}],"causes":[{"id":"simply-behind","cause":"You are only behind.","fix":"git pull. Nothing of yours is at risk.","confirm":""},{"id":"diverged","cause":"Both sides have commits.","fix":"Rebase for a linear history, merge to preserve exact commit identity. Team convention decides.","confirm":""},{"id":"force-temptation","cause":"Tempted to force-push past it.","fix":"Do not. Those remote commits are someone's work and force-push deletes them silently.","confirm":""},{"id":"wrong-branch","cause":"Pushing to a branch you did not intend.","fix":"Check git status -sb. The upstream may not be what you assume.","confirm":""}],"verify":["The push is accepted.","git log shows both sets of commits.","Nothing from the remote disappeared."],"escalate":["Output of git status -sb","The left-right log","Whether you rebased or merged"]},{"id":"git-cannot-pull-local-changes","tier":"guide","technology":"Git","category":"Working Tree","title":"Pull refuses because of local changes","summary":"Git will not overwrite uncommitted work. It is protecting you, not blocking you.","aliases":["your local changes would be overwritten","cannot pull","commit your changes or stash","please commit","pull blocked","unstaged changes pull"],"source":"https://git-scm.com/docs/git-stash","inputs":[],"steps":[{"title":"See exactly what is uncommitted","cmd":"git status --short && git diff --stat","risk":"safe","look":"Which files are modified. Git names the conflicting ones in the error, and those are the only ones that matter.","signals":[{"match":"^\\?\\?","means":"Untracked files. These only block if the incoming change adds the same path.","goto":"cause:untracked-collision"},{"match":"^ M|^M ","means":"Modified tracked files that the pull would overwrite.","goto":"cause:modified-tracked"}]},{"title":"Check whether the changes are worth keeping","cmd":"git diff","risk":"safe","look":"The actual content. Often this is debug output or a local config tweak you do not want anyway."},{"title":"Set the work aside and pull","cmd":"git stash push -m \"before pull\" && git pull","risk":"state","look":"The pull succeeds. Your changes are listed in git stash list.","note":"Moves your uncommitted changes onto the stash and restores a clean tree. The work is recoverable with git stash pop, but untracked files are not stashed by default and can still block the pull. Add -u if you need them included."},{"title":"Bring your work back on top","cmd":"git stash pop","risk":"state","look":"Your changes reappear. Resolve any conflicts as with a normal merge.","note":"Reapplies the stashed changes and removes the entry from the stash. If it conflicts with what you just pulled, the entry is kept rather than dropped, so nothing is lost. Use git stash apply instead if you want to keep the entry regardless."}],"causes":[{"id":"modified-tracked","cause":"Tracked files differ from the incoming version.","fix":"Stash, pull, pop. Or commit them on a branch if they are real work.","confirm":""},{"id":"untracked-collision","cause":"An untracked file has the same path as an incoming one.","fix":"Move or delete yours. Git will not silently overwrite it.","confirm":""},{"id":"not-worth-keeping","cause":"The changes are local noise.","fix":"git checkout -- <file> discards them. Confirm with git diff first; this cannot be undone.","confirm":""},{"id":"should-be-committed","cause":"The changes are real work.","fix":"Commit them on a branch, then pull. The stash is for short-lived interruptions, not storage.","confirm":""}],"verify":["The pull completes.","Your changes are back and intact.","The stash list is empty or intentionally populated."],"escalate":["Output of git status --short","The diff of the blocking files","Whether the work was stashed or discarded"]},{"id":"git-crlf-issues","tier":"guide","technology":"Git","category":"Working Tree","title":"Every file shows as modified with no real change","summary":"git diff reports whole-file changes you did not make. Line ending conversion.","aliases":["whole file changed","crlf","line endings","warning lf will be replaced","everything modified","diff shows every line"],"source":"https://git-scm.com/docs/gitattributes","inputs":[{"key":"file","label":"A file showing as changed","example":"scripts/deploy.sh"}],"steps":[{"title":"Confirm the change is only line endings","cmd":"git diff --stat && git diff --ignore-all-space --stat","risk":"safe","look":"If the second command shows nothing, the difference is purely whitespace and line endings. That is definitive.","signals":[{"match":"(?i)0 files changed|^\\s*$","means":"Only line endings differ. No real content changed.","goto":"cause:autocrlf"}]},{"title":"Check the current conversion setting","cmd":"git config --show-origin core.autocrlf","risk":"safe","look":"On Windows true converts to CRLF on checkout and back to LF on commit. A value of false or an inconsistent one across the team produces exactly this."},{"title":"Check what Git thinks each file should be","cmd":"git check-attr text eol -- {file}","risk":"safe","look":"What .gitattributes declares. Unspecified means Git guesses per machine, which is why it differs between teammates."},{"title":"Normalise the repository","cmd":"git add --renormalize .","risk":"state","look":"git status shows the normalised files staged. Commit them as a single dedicated change.","note":"Rewrites the index using the current .gitattributes rules, producing one large commit touching many files. Coordinate it with the team: anyone with in-flight branches will hit conflicts across every touched file. Commit it alone, with nothing else in the change."}],"causes":[{"id":"autocrlf","cause":"core.autocrlf differs between machines.","fix":"Stop relying on it. Commit a .gitattributes file so behaviour is defined by the repository, not by each laptop.","confirm":""},{"id":"no-gitattributes","cause":"No .gitattributes, so Git guesses.","fix":"Add one. At minimum * text=auto, with eol=lf pinned for shell scripts.","confirm":""},{"id":"script-broken","cause":"A shell script has CRLF and fails at runtime.","fix":"Pin *.sh text eol=lf. CRLF in a shebang produces exec format errors in containers.","confirm":""},{"id":"editor-converts","cause":"The editor saves with different endings.","fix":"Configure it to respect .gitattributes. VS Code does by default.","confirm":""}],"verify":["git status is clean after a fresh checkout.","Shell scripts run in containers.",".gitattributes is committed so it applies to everyone."],"escalate":["git diff with and without --ignore-all-space","The core.autocrlf value and its origin","Whether .gitattributes exists"]},{"id":"git-gitignore-not-working","tier":"guide","technology":"Git","category":"Working Tree","title":"gitignore is ignored for a file","summary":"You added a pattern but Git keeps tracking the file.","aliases":["gitignore not working","file still tracked","ignore not applied","still showing in status","gitignore ignored","cannot ignore file"],"source":"https://git-scm.com/docs/gitignore","inputs":[{"key":"file","label":"File","example":"config/local.env"}],"steps":[{"title":"Ask Git which rule applies","cmd":"git check-ignore -v {file}","risk":"safe","look":"The file and line of the matching rule. No output means no rule matches, which is a pattern problem rather than a caching one.","signals":[{"match":":\\d+:","means":"A rule does match. If the file is still tracked, the cache is the reason.","goto":"cause:already-tracked"},{"match":"^\\s*$","means":"No rule matches this path.","goto":"cause:pattern-wrong"}]},{"title":"Check whether the file is already tracked","cmd":"git ls-files --error-unmatch {file}","risk":"safe","look":"gitignore only affects untracked files. Once a file is tracked, no pattern will ever make Git stop following it."},{"title":"Check for a negation rule later in the file","cmd":"type .gitignore","risk":"safe","look":"Rules are applied in order and a later negation wins. Also note that a directory excluded by an earlier rule cannot have its contents re-included."},{"title":"Stop tracking it without deleting it","cmd":"git rm --cached {file}","risk":"state","look":"git status shows the deletion staged and the file no longer tracked. Commit, and it will then be ignored.","note":"Removes the file from Git's index while leaving it on disk. On the next pull, anyone else's checkout will have this file deleted from their working tree, so tell the team. If it holds secrets, removing it now does not remove it from history."}],"causes":[{"id":"already-tracked","cause":"The file is already tracked.","fix":"git rm --cached, then commit. gitignore has no effect on tracked files.","confirm":""},{"id":"pattern-wrong","cause":"No rule matches the path.","fix":"Check for a leading slash, which anchors to the repository root. Patterns are relative to the .gitignore file's own location.","confirm":""},{"id":"negation","cause":"A later rule re-includes it.","fix":"Rules apply in order. Reorder them.","confirm":""},{"id":"parent-excluded","cause":"A parent directory is excluded.","fix":"Git does not descend into excluded directories, so a negation inside one never applies. Unexclude the directory first.","confirm":""},{"id":"secrets-in-history","cause":"The file contains secrets and was committed.","fix":"Ignoring it now does not remove it from history. Rotate the secret; treat it as leaked.","confirm":""}],"verify":["git status no longer lists the file.","check-ignore names the intended rule.","Any leaked secret has been rotated."],"escalate":["Output of git check-ignore -v","Whether the file is tracked","The .gitignore contents"]},{"id":"git-recover-deleted-branch","tier":"guide","technology":"Git","category":"History & Undo","title":"I deleted a branch that had work on it","summary":"The branch is gone but the commits almost certainly still exist.","aliases":["deleted branch","lost branch","recover branch","branch gone","deleted by mistake","restore branch"],"source":"https://git-scm.com/docs/git-reflog","inputs":[{"key":"branch","label":"Branch that was deleted","example":"feature/checkout-retry"}],"steps":[{"title":"Find the branch's last position in the reflog","cmd":"git reflog --all | findstr {branch}","risk":"safe","look":"Deletion is recorded with the SHA the branch pointed at. That SHA is everything you need.","signals":[{"match":"[0-9a-f]{7,}","means":"The commit is recorded. Recovery is straightforward.","goto":"cause:in-reflog"},{"match":"^\\s*$","means":"Nothing in this clone's reflog. It may have been deleted elsewhere.","goto":"cause:not-in-reflog"}]},{"title":"Check whether the commits are unreachable but present","cmd":"git fsck --lost-found --no-reflogs 2>&1 | findstr commit","risk":"safe","look":"Dangling commits still in the object store. This finds work the reflog missed, such as after a clone or a reflog expiry."},{"title":"Look at a candidate before acting on it","cmd":"git show --stat <sha>","risk":"safe","look":"Confirm it is the right work. Branching from the wrong SHA wastes time and creates confusion."},{"title":"Recreate the branch at that commit","cmd":"git branch {branch} <sha>","risk":"safe","look":"The branch exists again, pointing at the same commit. Nothing else is modified. Verify with git log before continuing."}],"causes":[{"id":"in-reflog","cause":"The commit is in the reflog.","fix":"git branch <name> <sha>. Reflog entries last about ninety days by default.","confirm":""},{"id":"not-in-reflog","cause":"Not in this clone's reflog.","fix":"Check the remote, or another teammate's clone. Reflogs are strictly local and are not shared.","confirm":""},{"id":"was-pushed","cause":"The branch existed on the remote.","fix":"git fetch origin <branch>:<branch> restores it directly. Far simpler than reflog archaeology.","confirm":""},{"id":"gc-collected","cause":"Garbage collection removed the objects.","fix":"If fsck finds nothing and no remote has it, the work is gone. This is rare within the reflog window.","confirm":""}],"verify":["The branch exists with the expected commits.","git log matches what you remember.","It is pushed so it cannot be lost locally again."],"escalate":["Reflog entries mentioning the branch","Output of git fsck --lost-found","Whether the branch was ever pushed"]},{"id":"git-submodule-empty","tier":"guide","technology":"Git","category":"Submodules","title":"Submodule directory is empty after clone","summary":"The folder exists but contains nothing. Submodules are not fetched by default.","aliases":["submodule empty","submodule not cloned","empty directory clone","submodule init","missing submodule","submodule not updating"],"source":"https://git-scm.com/docs/git-submodule","inputs":[{"key":"submodule","label":"Submodule path","example":"vendor/shared-lib"}],"steps":[{"title":"Check the submodule's recorded state","cmd":"git submodule status","risk":"safe","look":"A leading minus means not initialised. A plus means it is at a different commit than the parent records. A space means it is correct.","signals":[{"match":"^-","means":"Not initialised. Nothing has been fetched.","goto":"cause:not-initialised"},{"match":"^\\+","means":"Checked out at a different commit than the parent expects.","goto":"cause:wrong-commit"}]},{"title":"Initialise and fetch everything","cmd":"git submodule update --init --recursive","risk":"safe","look":"Populates every submodule at the commit the parent records. Recursive matters when submodules contain their own."},{"title":"Check the submodule URL is reachable","cmd":"git config --file .gitmodules --get-regexp url","risk":"safe","look":"An SSH URL fails in CI that only has HTTPS credentials. This is a very common cause of submodules working locally and not in a pipeline."},{"title":"Check the parent records a commit that still exists","cmd":"git ls-tree HEAD {submodule}","risk":"safe","look":"The recorded SHA. If that commit was force-pushed away in the submodule repository, the checkout can never succeed."}],"causes":[{"id":"not-initialised","cause":"Submodules were not fetched on clone.","fix":"git submodule update --init --recursive, or clone with --recurse-submodules.","confirm":""},{"id":"wrong-commit","cause":"The submodule is at a different commit.","fix":"update restores the recorded one. If you intended the new commit, commit that pointer in the parent.","confirm":""},{"id":"url-unreachable","cause":"The submodule URL cannot be reached.","fix":"Use a URL scheme the environment can authenticate to. Add an insteadOf rule for CI.","confirm":""},{"id":"commit-gone","cause":"The recorded commit no longer exists upstream.","fix":"Someone force-pushed the submodule repository. Update the parent to a commit that exists.","confirm":""},{"id":"ci-not-fetching","cause":"CI does not fetch submodules.","fix":"Enable submodules in the checkout step. Most CI systems skip them by default.","confirm":""}],"verify":["The submodule directory has content.","git submodule status shows no prefix.","A fresh clone works in CI, not only locally."],"escalate":["Output of git submodule status","The submodule URLs from .gitmodules","Whether it works in CI as well as locally"]},{"id":"git-credential-loop","tier":"guide","technology":"Git","category":"Remotes","title":"Git keeps asking for credentials","summary":"Every push or pull prompts, or an old credential is reused and rejected.","aliases":["asking for password","credential prompt","authentication failed git","support for password authentication was removed","credential manager","keeps asking username"],"source":"https://git-scm.com/docs/gitcredentials","inputs":[{"key":"remote","label":"Remote","example":"origin"}],"steps":[{"title":"Check the remote URL scheme","cmd":"git remote -v","risk":"safe","look":"HTTPS uses a token through a credential helper. SSH uses a key. Which one you have determines everything that follows.","signals":[{"match":"https://","means":"HTTPS. A personal access token is needed; passwords no longer work.","goto":"cause:needs-token"},{"match":"git@|ssh://","means":"SSH. The key is the credential.","goto":"cause:ssh-key"}]},{"title":"Check which credential helper is configured","cmd":"git config --show-origin credential.helper","risk":"safe","look":"On Windows this should be manager. No helper means Git cannot store anything and will prompt every time."},{"title":"Check what is cached for the host","cmd":"cmdkey /list | findstr git","risk":"safe","look":"Stored Windows credentials. A stale entry with an expired token is reused silently and produces repeated failures."},{"title":"Remove the stale credential","cmd":"cmdkey /delete:git:https://github.com","risk":"state","look":"The next push prompts once, then stores the new credential and stops asking.","note":"Deletes the stored credential for that host from Windows Credential Manager. The next Git operation will prompt for a fresh one, so have the new token ready. Other tools using the same stored credential will also start prompting."}],"causes":[{"id":"needs-token","cause":"HTTPS with a password.","fix":"Password authentication was removed. Use a personal access token as the password.","confirm":""},{"id":"stale-credential","cause":"An expired token is cached.","fix":"Delete it from Credential Manager. Git will not overwrite it on its own.","confirm":""},{"id":"no-helper","cause":"No credential helper.","fix":"git config --global credential.helper manager.","confirm":""},{"id":"ssh-key","cause":"SSH key is not loaded or not authorised.","fix":"Follow the SSH runbook. Test with ssh -T git@github.com.","confirm":""},{"id":"wrong-account","cause":"Cached credentials belong to another account.","fix":"Common with work and personal accounts. Clear the entry and use the right one.","confirm":""},{"id":"token-scope","cause":"The token lacks repo scope.","fix":"Regenerate with the right scopes. Read-only tokens fail on push with a confusing message.","confirm":""}],"verify":["Push and pull work without prompting.","The stored credential is for the right account.","The token has an expiry you know about."],"escalate":["Remote URL scheme","Configured credential helper","Stored credentials for the host"]},{"id":"git-lost-stash","tier":"guide","technology":"Git","category":"History & Undo","title":"I lost a stash","summary":"A stash was dropped, popped into a conflict, or cleared. The content usually still exists.","aliases":["lost stash","stash gone","stash drop","stash clear","recover stash","stash disappeared"],"source":"https://git-scm.com/docs/git-stash","inputs":[],"steps":[{"title":"Check what stashes remain","cmd":"git stash list","risk":"safe","look":"Empty means they were dropped or cleared. Stash entries are commits, and dropping one only removes the reference.","signals":[{"match":"stash@\\{","means":"Stashes exist. Check whether the one you want is among them.","goto":""},{"match":"^\\s*$","means":"No stashes listed. Look for dangling commits.","goto":"step:2"}]},{"title":"Find dangling stash commits","cmd":"git fsck --unreachable 2>&1 | findstr commit","risk":"safe","look":"Unreachable commits still in the object store. A stash creates a merge commit, which is a strong identifying signal."},{"title":"Inspect a candidate before acting","cmd":"git show --stat <sha>","risk":"safe","look":"Confirm it is your work. A stash commit shows the working tree state at the time it was created."},{"title":"Restore it as a branch","cmd":"git branch recovered-stash <sha>","risk":"safe","look":"Creates a branch at that commit so it can never be garbage collected. Nothing else is modified."}],"causes":[{"id":"dropped","cause":"The stash was dropped.","fix":"Find the commit in fsck output and branch from it. git stash drop prints the SHA; scroll back in the terminal.","confirm":""},{"id":"popped-conflict","cause":"A pop conflicted and the entry was kept.","fix":"Check git stash list. Pop keeps the entry when it conflicts, precisely so nothing is lost.","confirm":""},{"id":"cleared","cause":"git stash clear was run.","fix":"The commits become unreachable but remain until garbage collection. fsck finds them.","confirm":""},{"id":"wrong-repo","cause":"The stash is in a different clone.","fix":"Stashes are local and are never pushed. Check other clones.","confirm":""},{"id":"gc-collected","cause":"Garbage collection removed them.","fix":"If fsck finds nothing, they are gone. This is why stashes are for hours, not weeks.","confirm":""}],"verify":["The work is on a branch.","git log shows the expected content.","It is committed properly rather than stashed again."],"escalate":["Output of git stash list","Unreachable commits from fsck","What git show reveals for each candidate"]},{"id":"git-slow-repo","tier":"guide","technology":"Git","category":"Performance","title":"Git operations are very slow","summary":"status, checkout and commit take many seconds in a repository that should be fast.","aliases":["git slow","status slow","checkout slow","large repository","git performance","slow commit"],"source":"https://git-scm.com/docs/git-gc","inputs":[],"steps":[{"title":"Measure where the time goes","cmd":"git count-objects -vH","risk":"safe","look":"size-pack and the loose object count. Many loose objects or a very large pack both slow everything down.","signals":[{"match":"count: [1-9]\\d{4,}","means":"Tens of thousands of loose objects. Repacking will help substantially.","goto":"cause:loose-objects"},{"match":"size-pack: \\d+\\.\\d+ GiB","means":"A multi-gigabyte pack. Large binaries are likely in history.","goto":"cause:large-history"}]},{"title":"Find the largest objects in history","cmd":"git rev-list --objects --all | git cat-file --batch-check=\"%(objectsize) %(rest)\" | sort -rn | head -10","risk":"safe","look":"Sizes in bytes with paths. Binaries committed years ago still cost every clone, forever."},{"title":"Check the working tree size","cmd":"git status --porcelain | measure-object -line && dir /s /b | measure-object -line","risk":"safe","look":"A very large working tree makes status slow regardless of history. Untracked build output is a common cause."},{"title":"Repack the repository","cmd":"git gc --aggressive --prune=now","risk":"destructive","look":"count-objects shows far fewer loose objects and a smaller total.","note":"Repacks objects and permanently deletes anything unreachable, including reflog entries beyond the expiry and dropped stashes. If you are also trying to recover lost work, do that first — this removes exactly the objects fsck would have found. It can take a long time on a large repository."}],"causes":[{"id":"loose-objects","cause":"Many loose objects.","fix":"git gc packs them. Routine maintenance usually handles it automatically.","confirm":""},{"id":"large-history","cause":"Large binaries in history.","fix":"They cost every clone forever. Removing them requires a coordinated history rewrite.","confirm":""},{"id":"untracked-files","cause":"Many untracked files slow status.","fix":"Add build output to .gitignore. Git scans everything otherwise.","confirm":""},{"id":"no-fsmonitor","cause":"Status scans the whole tree every time.","fix":"Enable core.fsmonitor on a large repository.","confirm":""},{"id":"antivirus","cause":"Antivirus scans every file Git touches.","fix":"Exclude the repository directory. On Windows this is frequently the dominant cost.","confirm":""},{"id":"should-use-lfs","cause":"Large assets are tracked directly.","fix":"Move them to Git LFS going forward.","confirm":""}],"verify":["Common operations feel fast.","Loose object count is low.","Large binaries are in LFS or excluded."],"escalate":["Output of git count-objects -vH","The largest objects in history","Whether antivirus scans the repository"]},{"id":"git-cherry-pick-conflict","tier":"guide","technology":"Git","category":"Merging","title":"Cherry-pick stops with a conflict","summary":"A commit does not apply cleanly to this branch because its context differs.","aliases":["cherry-pick conflict","could not apply","cherry pick failed","after resolving conflicts","backport conflict","cherry-pick error"],"source":"https://git-scm.com/docs/git-cherry-pick","inputs":[{"key":"sha","label":"Commit to pick","example":"a1b2c3d"}],"steps":[{"title":"See which files conflicted","cmd":"git status --short","risk":"safe","look":"UU entries are conflicts. Cherry-pick applies a diff, so it fails whenever surrounding context differs from the original branch.","signals":[{"match":"^UU ","means":"Content conflict. Resolve as with a merge.","goto":"cause:context-differs"},{"match":"^(DU|UD) ","means":"The file does not exist here in the same form.","goto":"cause:missing-file"}]},{"title":"Look at what the original commit changed","cmd":"git show {sha}","risk":"safe","look":"The intended change. Resolving well means reproducing that intent here, not just making the markers go away."},{"title":"Check whether the change is already present","cmd":"git log --oneline --grep=\"$(git log -1 --format=%s {sha})\"","risk":"safe","look":"A commit with the same subject already on this branch means it was backported and the pick is unnecessary."},{"title":"Abort and return to a clean state","cmd":"git cherry-pick --abort","risk":"destructive","look":"A clean working tree at the pre-pick commit.","note":"Discards the in-progress cherry-pick along with any conflict resolution you have done. Commit
