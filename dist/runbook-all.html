,"summary":"Rewriting a shared branch can silently destroy a colleague's commits. There is a safe form of this command.","aliases":["force push","push -f","rebase then push","force-with-lease","non-fast-forward","rejected push"],"source":"https://git-scm.com/docs/git-push","inputs":[{"key":"branch","label":"Branch","example":"feature/checkout-retry"},{"key":"remote","label":"Remote","example":"origin"}],"steps":[{"title":"Check whether anyone else has pushed to this branch","cmd":"git fetch {remote} && git log --oneline {remote}/{branch} -5","risk":"safe","look":"Commits you do not recognise. If someone else's work is on this branch, a force-push will delete it and they will not get a warning.","signals":[{"match":"(?i)commit","means":"Read the author of each. Anything not yours means stop and talk to them first.","goto":"cause:shared-branch"}]},{"title":"Force-push, but only if the remote is where you last saw it","cmd":"git push --force-with-lease={branch} {remote} {branch}","risk":"destructive","note":"This rewrites remote history. --force-with-lease aborts if someone pushed since your last fetch, which plain --force does not. Never use plain --force on a shared branch. If this is a protected branch, it should be rejected by policy, not by your judgement.","look":"A forced update line. If it is rejected with 'stale info', someone pushed after your fetch and the lease did its job.","signals":[{"match":"(?i)stale info|rejected","means":"The lease saved you. Someone pushed after your last fetch. Fetch again and re-examine before retrying.","goto":"cause:raced"},{"match":"(?i)protected branch|pre-receive hook declined","means":"Branch protection blocked it. That is working as intended; open a PR instead.","goto":"cause:protected"}]}],"causes":[{"id":"shared-branch","cause":"Other people have commits on this branch.","fix":"Do not force-push. Merge their work in, or coordinate a window with them first.","confirm":"git log --format='%an %s' {remote}/{branch} -10"},{"id":"raced","cause":"Someone pushed between your fetch and your push.","fix":"Fetch, inspect what arrived, rebase onto it, then retry with --force-with-lease.","confirm":"git fetch {remote} && git log --oneline {remote}/{branch} -5"},{"id":"protected","cause":"Branch protection rules forbid force-push.","fix":"Open a pull request. If the rewrite is genuinely required, it needs a repo admin, not a workaround.","confirm":"git ls-remote {remote} {branch}"}],"verify":["{remote}/{branch} points at your intended commit.","No commits by other authors disappeared from the log.","CI on the branch is green after the rewrite."],"escalate":["git log --oneline of local and remote branch","The exact push output including any rejection reason","Whether the branch is protected and who owns it"]},{"id":"git-merge-conflict","tier":"guide","technology":"Git","category":"Merging","title":"Merge or rebase stopped with conflicts","summary":"Git cannot combine two changes automatically and is waiting for you to decide.","aliases":["merge conflict","conflict","both modified","fix conflicts and run commit","rebase conflict","unmerged paths"],"source":"https://git-scm.com/docs/git-merge","inputs":[{"key":"branch","label":"Branch being merged","example":"main"}],"steps":[{"title":"See exactly which files are unmerged","cmd":"git status --short","risk":"safe","look":"Lines starting UU are both-modified. AA is both-added, DU and UD are delete-versus-modify, which need a decision rather than an edit.","signals":[{"match":"^UU ","means":"Both sides changed the same file. Edit it and resolve.","goto":"cause:both-modified"},{"match":"^(DU|UD) ","means":"One side deleted what the other changed. Neither version is automatically right.","goto":"cause:delete-modify"}]},{"title":"Understand which operation you are inside","cmd":"git status | head -3","risk":"safe","look":"Rebase and merge resolve identically but finish differently. Finishing the wrong way is where people lose work."},{"title":"See both sides of a conflicting file","cmd":"git diff --diff-filter=U","risk":"safe","look":"The conflict markers with both versions. The section above ======= is your current branch, below it is what you are bringing in."},{"title":"Abort and return to where you started","cmd":"git merge --abort","risk":"destructive","look":"A clean working tree back at the pre-merge commit. This is always safe for committed history, and is the right move when a merge has gone badly.","note":"Discards the entire in-progress merge and any conflict resolution you have done so far. Committed work is untouched, but unsaved resolution effort is lost. Inside a rebase, the equivalent is git rebase --abort."}],"causes":[{"id":"both-modified","cause":"Both branches changed the same lines.","fix":"Edit the file to the intended final state, remove the markers, git add it, then continue.","confirm":""},{"id":"delete-modify","cause":"One branch deleted a file the other modified.","fix":"Decide deliberately: git rm to accept the deletion, or git add to keep the modified version.","confirm":""},{"id":"wrong-finish","cause":"Finished a rebase with git commit instead of git rebase --continue.","fix":"Inside a rebase always use git rebase --continue. Inside a merge, git commit is correct.","confirm":""}],"verify":["git status reports a clean tree with no unmerged paths.","The build and tests pass on the merged result.","Neither side's intent was silently dropped."],"escalate":["git status --short output","Whether it is a merge or a rebase","Which files conflicted and how each was resolved"]},{"id":"git-detached-head","tier":"guide","technology":"Git","category":"Branches","title":"You are in detached HEAD state","summary":"Commits made here belong to no branch and become unreachable when you switch away.","aliases":["detached head","not on any branch","head detached at","lost my commits","commits disappeared after checkout"],"source":"https://git-scm.com/docs/git-checkout","inputs":[{"key":"branch","label":"Branch to keep the work on","example":"feature/fix-checkout"}],"steps":[{"title":"Confirm the state and whether you have made commits","cmd":"git status -sb && git log --oneline -5","risk":"safe","look":"'HEAD detached at' confirms it. If the log shows commits you made here, they exist but nothing points at them yet.","signals":[{"match":"(?i)HEAD detached","means":"Detached. Any commits here need a branch before you move.","goto":"cause:detached"}]},{"title":"Create a branch at your current position","cmd":"git switch -c {branch}","risk":"safe","look":"Your commits are now on a real branch and safe. Do this before anything else, and before switching away."},{"title":"If you already switched away and lost them, find them in reflog","cmd":"git reflog -20","risk":"safe","look":"Every position HEAD has held, with its SHA. Detached commits remain here for about ninety days, so almost nothing is truly lost."},{"title":"Recover a specific lost commit","cmd":"git branch recovered <sha-from-reflog>","risk":"state","look":"A branch named recovered holding the work. Verify with git log before relying on it.","note":"Creates a new branch pointing at that commit. Nothing existing is modified and no history is rewritten, but pick the SHA carefully or you will branch from the wrong point."}],"causes":[{"id":"detached","cause":"HEAD points at a commit rather than a branch.","fix":"Create a branch here with git switch -c. Do it before switching away.","confirm":""},{"id":"already-switched","cause":"You left detached HEAD and the commits seem gone.","fix":"They are in the reflog. Find the SHA and branch from it.","confirm":""},{"id":"intentional","cause":"You checked out a tag or old commit deliberately.","fix":"Fine as long as you make no commits. If you do, branch first.","confirm":""}],"verify":["git status shows you on a named branch.","git log on that branch contains your commits.","The branch is pushed, or you know it is local only."],"escalate":["git status -sb output","git reflog around the time the work was done","Which commits are missing"]},{"id":"git-large-file-rejected","tier":"guide","technology":"Git","category":"Remotes","title":"Push rejected for file size","summary":"The remote refuses a file over its limit. Deleting it in a new commit does not help; it is still in history.","aliases":["file too large","push rejected size","large file","gh001","exceeds file size limit","git lfs"],"source":"https://docs.github.com/en/repositories/working-with-files/managing-large-files","inputs":[{"key":"file","label":"The oversized file","example":"data/dump.sql"}],"steps":[{"title":"Read the rejection and identify the file and commit","cmd":"git push 2>&1 | more","risk":"safe","look":"The remote names the file and the commit that introduced it. That commit is what must change, not your latest one.","signals":[{"match":"(?i)exceeds|too large|GH001","means":"Size limit. The file is embedded in history and must be removed from it.","goto":"cause:in-history"}]},{"title":"Find the largest objects actually in history","cmd":"git rev-list --objects --all | git cat-file --batch-check=\"%(objecttype) %(objectname) %(objectsize) %(rest)\" | findstr blob","risk":"safe","look":"Sizes are in bytes. This shows what is really in the repository, which is often not what you expected."},{"title":"If it is only in your last commit, remove it there","cmd":"git rm --cached {file} && git commit --amend --no-edit","risk":"destructive","look":"git show --stat no longer lists the file. The file remains on disk because only the index entry was removed.","note":"Rewrites your most recent commit. Safe if that commit has not been pushed. If it has been pushed and others have pulled it, do not amend — the file needs removing from shared history through a coordinated rewrite instead."}],"causes":[{"id":"in-history","cause":"The file is in an earlier commit, so deleting it now changes nothing.","fix":"It must be removed from history. For a single unpushed commit, amend. For ow-origin now points at the repository's own config file.","note":"Writes to .git/config for this repository only. Existing commits are unaffected — this changes future commits, nothing more. Setting it locally is the right move when you mix work and personal repositories on one machine."},{"title":"Fix the identity on the most recent commit","cmd":"git commit --amend --reset-author --no-edit","risk":"destructive","look":"git log shows the corrected author on the top commit.","note":"Rewrites the last commit, changing its SHA. Safe while unpushed. If it has been pushed, this creates a divergence that requires a force-push, which rewrites shared history."}],"causes":[{"id":"no-local-config","cause":"No repository-local identity, so a global one applied.","fix":"Set user.email locally in each work repository. Consider clearing the global value so it can never apply silently.","confirm":""},{"id":"already-pushed","cause":"The wrong-author commits are already on the remote.","fix":"Leave them. Rewriting shared history to fix a display name is not a worthwhile trade.","confirm":""},{"id":"unverified","cause":"The email is right but commits show as unverified.","fix":"That is signing, not authorship. Set up commit signing separately.","confirm":""}],"verify":["New commits carry the correct author.","git config --show-origin points at the local config.","No shared history was rewritten to achieve it."],"escalate":["git log with author format","Output of git config --show-origin for user.email","Whether the affected commits are pushed"]},{"id":"git-non-fast-forward","tier":"guide","technology":"Git","category":"Remotes","title":"Push rejected as non-fast-forward","summary":"The remote has commits you do not have locally. Fetch and integrate before pushing.","aliases":["non-fast-forward","push rejected","updates were rejected","fetch first","remote contains work","rejected behind"],"source":"https://git-scm.com/docs/git-push","inputs":[{"key":"branch","label":"Branch","example":"main"},{"key":"remote","label":"Remote","example":"origin"}],"steps":[{"title":"See how far the branches have diverged","cmd":"git fetch {remote} && git status -sb","risk":"safe","look":"The ahead and behind counts. Behind only means a simple pull; both ahead and behind means real divergence that needs a decision.","signals":[{"match":"behind \\d+\\] *$","means":"Only behind. A pull will fast-forward cleanly.","goto":"cause:simply-behind"},{"match":"ahead \\d+, behind \\d+","means":"Diverged. You must choose merge or rebase.","goto":"cause:diverged"}]},{"title":"See exactly which commits are on each side","cmd":"git log --oneline --left-right {remote}/{branch}...HEAD","risk":"safe","look":"Arrows point to which side each commit is on. Read the remote-side commits before deciding; someone else wrote them."},{"title":"Bring the remote work in beneath yours","cmd":"git pull --rebase {remote} {branch}","risk":"state","look":"git status shows ahead only. Conflicts may pause the rebase; resolve then continue.","note":"Replays your local commits on top of the remote ones, which rewrites their SHAs. Safe for commits you have not pushed. If any of your local commits are already public elsewhere, use a merge instead so their identity does not change."},{"title":"Push once it is a fast-forward","cmd":"git push {remote} {branch}","risk":"safe","look":"The push is accepted. If it is rejected again, someone pushed while you were rebasing; fetch and repeat."}],"causes":[{"id":"simply-behind","cause":"You are only behind.","fix":"git pull. Nothing of yours is at risk.","confirm":""},{"id":"diverged","cause":"Both sides have commits.","fix":"Rebase for a linear history, merge to preserve exact commit identity. Team convention decides.","confirm":""},{"id":"force-temptation","cause":"Tempted to force-push past it.","fix":"Do not. Those remote commits are someone's work and force-push deletes them silently.","confirm":""},{"id":"wrong-branch","cause":"Pushing to a branch you did als":[{"match":"(?i)0 files changed|^\\s*$","means":"Only line endings differ. No real content changed.","goto":"cause:autocrlf"}]},{"title":"Check the current conversion setting","cmd":"git config --show-origin core.autocrlf","risk":"safe","look":"On Windows true converts to CRLF on checkout and back to LF on commit. A value of false or an inconsistent one across the team produces exactly this."},{"title":"Check what Git thinks each file should be","cmd":"git check-attr text eol -- {file}","risk":"safe","look":"What .gitattributes declares. Unspecified means Git guesses per machine, which is why it differs between teammates."},{"title":"Normalise the repository","cmd":"git add --renormalize .","risk":"state","look":"git status shows the normalised files staged. Commit them as a single dedicated change.","note":"Rewrites the index using the current .gitattributes rules, producing one large commit touching many files. Coordinate it with the team: anyone with in-flight branches will hit conflicts across every touched file. Commit it alone, with nothing else in the change."}],"causes":[{"id":"autocrlf","cause":"core.autocrlf differs between machines.","fix":"Stop relying on it. Commit a .gitattributes file so behaviour is defined by the repository, not by each laptop.","confirm":""},{"id":"no-gitattributes","cause":"No .gitattributes, so Git guesses.","fix":"Add one. At minimum * text=auto, with eol=lf pinned for shell scripts.","confirm":""},{"id":"script-broken","cause":"A shell script has CRLF and fails at runtime.","fix":"Pin *.sh text eol=lf. CRLF in a shebang produces exec format errors in containers.","confirm":""},{"id":"editor-converts","cause":"The editor saves with different endings.","fix":"Configure it to respect .gitattributes. VS Code does by default.","confirm":""}],"verify":["git status is clean after a fresh checkout.","Shell scripts run in containers.",".gitattributes is committed so it applies to everyone."],"escalate":["git diff with and without --ignore-all-space","The core.autocrlf value and its origin","Whether .gitattributes exists"]},{"id":"git-gitignore-not-working","tier":"guide","technology":"Git","category":"Working Tree","title":"gitignore is ignored for a file","summary":"You added a pattern but Git keeps tracking the file.","aliases":["gitignore not working","file still tracked","ignore not applied","still showing in status","gitignore ignored","cannot ignore file"],"source":"https://git-scm.com/docs/gitignore","inputs":[{"key":"file","label":"File","example":"config/local.env"}],"steps":[{"title":"Ask Git which rule applies","cmd":"git check-ignore -v {file}","risk":"safe","look":"The file and line of the matching rule. No output means no rule matches, which is a pattern problem rather than a caching one.","signals":[{"match":":\\d+:","means":"A rule does match. If the file is still tracked, the cache is the reason.","goto":"cause:already-tracked"},{"match":"^\\s*$","means":"No rule matches this path.","goto":"cause:pattern-wrong"}]},{"title":"Check whether the file is already tracked","cmd":"git ls-files --error-unmatch {file}","risk":"safe","look":"gitignore only affects untracked files. Once a file is tracked, no pattern will ever make Git stop following it."},{"title":"Check for a negation rule later in the file","cmd":"type .gitignore","risk":"safe","look":"Rules are applied in order and a later negation wins. Also note that a directory excluded by an earlier rule cannot have its contents re-included."},{"title":"Stop tracking it without deleting it","cmd":"git rm --cached {file}","risk":"state","look":"git status shows the deletion staged and the file no longer tracked. Commit, and it will then be ignored.","note":"Removes the file from Git's index while leaving it on disk. On the next pull, anyone else's checkout will have this file deleted from their working tree, so tell the team. If it holds secrets, removing it now does not remove it from history."}],"causes":[{"id":"already-tracked","cause":"The file is already tracked.","fix":"git rm --cached, then commit. gitignore has no effect on tracked files.","confirm":""},{"id":"pattern-wrong","cause":"No rule matches the path.","fix":"Check for a leading slash, which anchors to the repository root. Patterns are relative to the .gitignore file's own location.","confirm":""},{"id":"negation","cause":"A later rule re-includes it.","fix":"Rules apply in order. Reorder them.","confirm":""},{"id":"parent-excluded","cause":"A parent directory is excluded.","fix":"Git does not descend into excluded directories, so a negation inside one never applies. Unexclude the directory first.","confirm":""},{"id":"secrets-in-history","cause":"The file contains secrets and was committed.","fix":"Ignoring it now does not remove it from history. Rotate the secret; treat it as leaked.","confirm":""}],"verify":["git status no longer lists the file.","check-ignore names the intended rule.","Any leaked secret has been rotated."],"escalate":["Output of git check-ignore -v","Whether the file is tracked","The .gitignore contents"]},{"id":"git-recover-deleted-branch","tier":"guide","technology":"Git","category":"History & Undo","title":"I deleted a branch that had work on it","summary":"The branch is gone but the commits almost certainly still exist.","aliases":["deleted branch","lost branch","recover branch","branch gone","deleted by mistake","restore branch"],"source":"https://git-scm.com/docs/git-reflog","inputs":[{"key":"branch","label":"Branch that was deleted","example":"feature/checkout-retry"}],"steps":[{"title":"Find the branch's last position in the reflog","cmd":"git reflog --all | findstr {branch}","risk":"safe","look":"Deletion is recorded with the SHA the branch pointed at. That SHA is everything you need.","signals":[{"match":"[0-9a-f]{7,}","means":"The commit is recorded. Recovery is straightforward.","goto":"cause:in-reflog"},{"match":"^\\s*$","means":"Nothing in this clone's reflog. It may have been deleted elsewhere.","goto":"cause:not-in-reflog"}]},{"title":"Check whether the commits are unreachable but present","cmd":"git fsck --lost-found --no-reflogs 2>&1 | findstr commit","risk":"safe","look":"Dangling commits still in the object store. This finds work the reflog missed, such as after a clone or a reflog expiry."},{"title":"Look at a candidate before acting on it","cmd":"git show --stat <sha>","risk":"safe","look":"Confirm it is the right work. Branching from the wrong SHA wastes time and creates confusion."},{"title":"Recreate the branch at that commit","cmd":"git branch {branch} <sha>","risk":"safe","look":"The branch exists again, pointing at the same commit. Nothing else is modified. Verify with git log before continuing."}],"causes":[{"id":"in-reflog","cause":"The commit is in the reflog.","fix":"git branch <name> <sha>. Reflog entries last about ninety days by default.","confirm":""},{"id":"not-in-reflog","cause":"Not in this clone's reflog.","fix":"Check the remote, or another teammate's clone. Reflogs are strictly local and are not shared.","confirm":""},{"id":"was-pushed","cause":"The branch existed on the remote.","fix":"git fetch origin <branch>:<branch> restores it directly. Far simpler than reflog archaeology.","confirm":""},{"id":"gc-collected","cause":"Garbage collection removed the objects.","fix":"If fsck finds nothing and no remote has it, the work is gone. This is rare within the reflog window.","confirm":""}],"verify":["The branch exists with the expected commits.","git log matches what you remember.","It is pushed so it cannot be lost locally again."],"escalate":["Reflog entries mentioning the branch","Output of git fsck --lost-found","Whether the branch was ever pushed"]},{"id":"git-submodule-empty","tier":"guide","technology":"Git","category":"Submodules","title":"Submodule directory is empty after clone","summary":"The folder exists but contains nothing. Submodules are not fetched by default.","aliases":["submodule empty","submodule not cloned","empty directory clone","submodule init","missing submodule","submodule not updating"],"source":"https://git-scm.com/docs/git-submodule","inputs":[{"key":"submodule","label":"Submodule path","example":"vendor/shared-lib"}],"steps":[{"title":"Check the submodule's recorded state","cmd":"git submodule status","risk":"safe","look":"A leading minus means not initialised. A plus means it is at a different commit than the parent records. A space means it is correct.","signals":[{"match":"^-","means":"Not initialised. Nothing has been fetched.","goto":"cause:not-initialised"},{"match":"^\\+","means":"Checked out at a different commit than the parent expects.","goto":"cause:wrong-commit"}]},{"title":"Initialise and fetch everything","cmd":"git submodule update --init --recursive","risk":"safe","look":"Populates every submodule at the commit the parent records. Recursive matters when submodules contain their own."},{"title":"Check the submodule URL is reachable","cmd":"git config --file .gitmodules --get-regexp url","risk":"safe","look":"An SSH URL fails in CI that only has HTTPS credentials. This is a very common cause of submodules working locally and not in a pipeline."},{"title":"Check the parent records a commit that still exists","cmd":"git ls-tree HEAD {submodule}","risk":"safe","look":"The recorded SHA. If that commit was force-pushed away in the submodule repository, the checkout can never succeed."}],"causes":[{"id":"not-initialised","cause":"Submodules were not fetched on clone.","fix":"git submodule update --init --recursive, or clone with --recurse-submodules.","confirm":""},{"id":"wrong-commit","cause":"The submodule is at a different commit.","fix":"update restores the recorded one. If you intended the new commit, commit that pointer in the parent.","confirm":""},{"id":"url-unreachable","cause":"The submodule URL cannot be reached.","fix":"Use a URL scheme the environment can authenticate to. Add an insteadOf rule for CI.","confirm":""},{"id":"commit-gone","cause":"The recorded commit no longer exists upstream.","fix":"Someone force-pushed the submodule repository. Update the parent to a commit that exists.","confirm":""},{"id":"ci-not-fetching","cause":"CI does not fetch submodules.","fix":"Enable submodules in the checkout step. Most CI systems skip them by default.","confirm":""}],"verify":["The submodule directory has content.","git submodule status shows no prefix.","A fresh clone works in CI, not only locally."],"escalate":["Output of git submodule status","The submodule URLs from .gitmodules","Whether it works in CI as well as locally"]},{"id":"git-credential-loop","tier":"guide","technology":"Git","category":"Remotes","title":"Git keeps asking for credentials","summary":"Every push or pull prompts, or an old credential is reused and rejected.","aliases":["asking for password","credential prompt","authentication failed git","support for password authentication was removed","credential manager","keeps asking username"],"source":"https://git-scm.com/docs/gitcredentials","inputs":[{"key":"remote","label":"Remote","example":"origin"}],"steps":[{"title":"Check the remote URL scheme","cmd":"git remote -v","risk":"safe","look":"HTTPS uses a token through a credential helper. SSH uses a key. Which one you have determines everything that follows.","signals":[{"match":"https://","means":"HTTPS. A personal access token is needed; passwords no longer work.","goto":"cause:needs-token"},{"match":"git@|ssh://","means":"SSH. The key is the credential.","goto":"cause:ssh-key"}]},{"title":"Check which credential helper is configured","cmd":"git config --show-origin credential.helper","risk":"safe","look":"On Windows this should be manager. No helper means Git cannot store anything and will prompt every time."},{"title":"Check what is cached for the host","cmd":"cmdkey /list | findstr git","risk":"safe","look":"Stored Windows credentials. A stale entry with an expired token is reused silently and produces repeated failures."},{"title":"Remove the stale credential","cmd":"cmdkey /delete:git:https://github.com","risk":"state","look":"The next push prompts once, then stores the new credential and stops asking.","note":"Deletes the stored credential for that host from Windows Credential Manager. The next Git operation will prompt for a fresh one, so have the new token ready. Other tools using the same stored credential will also start prompting."}],"causes":[{"id":"needs-token","cause":"HTTPS with a password.","fix":"Password authentication was removed. Use a personal access token as the password.","confirm":""},{"id":"stale-credential","cause":"An expired token is cached.","fix":"Delete it from Credential Manager. Git will not overwrite it on its own.","confirm":""},{"id":"no-helper","cause":"No credential helper.","fix":"git config --global credential.helper manager.","confirm":""},{"id":"ssh-key","cause":"SSH key is not loaded or not authorised.","fix":"Follow the SSH runbook. Test with ssh -T git@github.com.","confirm":""},{"id":"wrong-account","cause":"Cached credentials belong to another account.","fix":"Common with work and personal accounts. Clear the entry and use the right one.","confirm":""},{"id":"token-scope","cause":"The token lacks repo scope.","fix":"Regenerate with the right scopes. Read-only tokens fail on push with a confusing message.","confirm":""}],"verify":["Push and pull work without prompting.","The stored credential is for the right account.","The token has an expiry you know about."],"escalate":["Remote URL scheme","Configured credential helper","Stored credentials for the host"]},{"id":"git-lost-stash","tier":"guide","technology":"Git","category":"History & Undo","title":"I lost a stash","summary":"A stash was dropped, popped into a conflict, or cleared. The content usually still exists.","aliases":["lost stash","stash gone","stash drop","stash clear","recover stash","stash disappeared"],"source":"https://git-scm.com/docs/git-stash","inputs":[],"steps":[{"title":"Check what stashes remain","cmd":"git stash list","risk":"safe","look":"Empty means they were dropped or cleared. Stash entries are commits, and dropping one only removes the reference.","signals":[{"match":"stash@\\{","means":"Stashes exist. Check whether the one you want is among them.","goto":""},{"match":"^\\s*$","means":"No stashes listed. Look for dangling commits.","goto":"step:2"}]},{"title":"Find dangling stash commits","cmd":"git fsck --unreachable 2>&1 | findstr commit","risk":"safe","look":"Unreachable commits still in the object store. A stash creates a merge commit, which is a strong identifying signal."},{"title":"Inspect a candidate before acting","cmd":"git show --stat <sha>","risk":"safe","look":"Confirm it is your work. A stash commit shows the working tree state at the time it was created."},{"title":"Restore it as a branch","cmd":"git branch recovered-stash <sha>","risk":"safe","look":"Creates a branch at that commit so it can never be garbage collected. Nothing else is modified."}],"causes":[{"id":"dropped","cause":"The stash was dropped.","fix":"Find the commit in fsck output and branch from it. git stash drop prints the SHA; scroll back in the terminal.","confirm":""},{"id":"popped-conflict","cause":"A pop conflicted and the entry was kept.","fix":"Check git stash list. Pop keeps the entry when it conflicts, precisely so nothing is lost.","confirm":""},{"id":"cleared","cause":"git stash clear was run.","fix":"The commits become unreachable but remain until garbage collection. fsck finds them.","confirm":""},{"id":"wrong-repo","cause":"The stash is in a different clone.","fix":"Stashes are local and are never pushed. Check other clones.","confirm":""},{"id":"gc-collected","cause":"Garbage collection removed them.","fix":"If fsck finds nothing, they are gone. This is why stashes are for hours, not weeks.","confirm":""}],"verify":["The work is on a branch.","git log shows the expected content.","It is committed properly rather than stashed again."],"escalate":["Output of git stash list","Unreachable commits from fsck","What git show reveals for each candidate"]},{"id":"git-slow-repo","tier":"guide","technology":"Git","category":"Performance","title":"Git operations are very slow","summary":"status, checkout and commit take many seconds in a repository that should be fast.","aliases":["git slow","status slow","checkout slow","large repository","git performance","slow commit"],"source":"https://git-scm.com/docs/git-gc","inputs":[],"steps":[{"title":"Measure where the time goes","cmd":"git count-objects -vH","risk":"safe","look":"size-pack and the loose object count. Many loose objects or a very large pack both slow everything down.","signals":[{"match":"count: [1-9]\\d{4,}","means":"Tens of thousands of loose objects. Repacking will help substantially.","goto":"cause:loose-objects"},{"match":"size-pack: \\d+\\.\\d+ GiB","means":"A multi-gigabyte pack. Large binaries are likely in history.","goto":"cause:large-history"}]},{"title":"Find the largest objects in history","cmd":"git rev-list --objects --all | git cat-file --batch-check=\"%(objectsize) %(rest)\" | sort -rn | head -10","risk":"safe","look":"Sizes in bytes with paths. Binaries committed years ago still cost every clone, forever."},{"title":"Check the working tree size","cmd":"git status --porcelain | measure-object -line && dir /s /b | measure-object -line","risk":"safe","look":"A very large working tree makes status slow regardless of history. Untracked build output is a common cause."},{"title":"Repack the repository","cmd":"git gc --aggressive --prune=now","risk":"destructive","look":"count-objects shows far fewer loose objects and a smaller total.","note":"Repacks objects and permanently deletes anything unreachable, including reflog entries beyond the expiry and dropped stashes. If you are also trying to recover lost work, do that first — this removes exactly the objects fsck would have found. It can take a long time on a large repository."}],"causes":[{"id":"loose-objects","cause":"Many loose objects.","fix":"git gc packs them. Routine maintenance usually handles it automatically.","confirm":""},{"id":"large-history","cause":"Large binaries in history.","fix":"They cost every clone forever. Removing them requires a coordinated history rewrite.","confirm":""},{"id":"untracked-files","cause":"Many untracked files slow status.","fix":"Add build output to .gitignore. Git scans everything otherwise.","confirm":""},{"id":"no-fsmonitor","cause":"Status scans the whole tree every time.","fix":"Enable core.fsmonitor on a large repository.","confirm":""},{"id":"antivirus","cause":"Antivirus scans every file Git touches.","fix":"Exclude the repository directory. On Windows this is frequently the dominant cost.","confirm":""},{"id":"should-use-lfs","cause":"Large assets are tracked directly.","fix":"Move them to Git LFS going forward.","confirm":""}],"verify":["Common operations feel fast.","Loose object count is low.","Large binaries are in LFS or excluded."],"escalate":["Output of git count-objects -vH","The largest objects in history","Whether antivirus scans the repository"]},{"id":"git-cherry-pick-conflict","tier":"guide","technology":"Git","category":"Merging","title":"Cherry-pick stops with a conflict","summary":"A commit does not apply cleanly to this branch because its context differs.","aliases":["cherry-pick conflict","could not apply","cherry pick failed","after resolving conflicts","backport conflict","cherry-pick error"],"source":"https://git-scm.com/docs/git-cherry-pick","inputs":[{"key":"sha","label":"Commit to pick","example":"a1b2c3d"}],"steps":[{"title":"See which files conflicted","cmd":"git status --short","risk":"safe","look":"UU entries are conflicts. Cherry-pick applies a diff, so it fails whenever surrounding context differs from the original branch.","signals":[{"match":"^UU ","means":"Content conflict. Resolve as with a merge.","goto":"cause:context-differs"},{"match":"^(DU|UD) ","means":"The file does not exist here in the same form.","goto":"cause:missing-file"}]},{"title":"Look at what the original commit changed","cmd":"git show {sha}","risk":"safe","look":"The intended change. Resolving well means reproducing that intent here, not just making the markers go away."},{"title":"Check whether the change is already present","cmd":"git log --oneline --grep=\"$(git log -1 --format=%s {sha})\"","risk":"safe","look":"A commit with the same subject already on this branch means it was backported and the pick is unnecessary."},{"title":"Abort and return to a clean state","cmd":"git cherry-pick --abort","risk":"destructive","look":"A clean working tree at the pre-pick commit.","note":"Discards the in-progress cherry-pick along with any conflict resolution you have done. Committed history is untouched, but unsaved resolution work is lost. Use --skip instead if you want to abandon only this commit in a multi-commit pick."}],"causes":[{"id":"context-differs","cause":"The surrounding code differs from the source branch.","fix":"Resolve to the intended final state. Read the original commit to understand the intent.","confirm":""},{"id":"missing-file","cause":"The file does not exist on this branch.","fix":"The change may need adapting rather than picking. Consider whether it applies at all.","confirm":""},{"id":"already-applied","cause":"The change is already here.","fix":"Skip it. git cherry-pick --skip moves on in a multi-commit pick.","confirm":""},{"id":"needs-dependency","cause":"The commit depends on an earlier one not present.","fix":"Pick the dependency first, or pick the range.","confirm":""},{"id":"should-merge","cause":"You are picking many commits.","fix":"A merge or rebase is usually better than a long sequence of cherry-picks.","confirm":""}],"verify":["The cherry-pick completes.","The change works on this branch, not just compiles.","Tests pass."],"escalate":["Which files conflicted","The original commit's diff","Whether the change is already present"]},{"id":"k8s-crashloopbackoff","tier":"guide","technology":"Kubernetes","category":"Pods & Containers","title":"Pod is in CrashLoopBackOff","summary":"The container starts, exits, and Kubernetes keeps restarting it with growing delay.","aliases":["crashloop","crashloopbackoff","pod keeps restarting","restarts increasing","back-off restarting failed container","pod wont stay up"],"source":"https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/","inputs":[{"key":"pod","label":"Pod name","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"},{"key":"container","label":"Container","example":"checkout-api"}],"steps":[{"title":"Confirm it is actually looping","cmd":"kubectl get pod {pod} -n {namespace} -o wide","risk":"safe","look":"RESTARTS climbing over successive checks. A high but static count is an old incident, not a live one.","signals":[{"match":"Completed","means":"This is a Job or a one-shot container that finished. restartPolicy is wrong, not the app.","goto":"cause:wrong-restart-policy"}]},{"title":"Read the previous container's logs","cmd":"kubectl logs {pod} -n {namespace} -c {container} --previous --tail=200","risk":"safe","look":"The FIRST fatal line, not the last. Startup errors scroll off the top and the tail is usually just the shutdown noise.","signals":[{"match":"(?i)connection refused|no route to host|timeout.*dial","means":"It died waiting on a dependency that was not reachable.","goto":"cause:dependency-unreachable"},{"match":"(?i)(not set|missing|undefined).*(env|variable|config)|panic.*nil","means":"Required configuration was absent at startup.","goto":"cause:missing-config"},{"match":"(?i)permission denied|operation not permitted","means":"The process cannot read a path or bind a port as its runAsUser.","goto":"cause:permissions"}]},{"title":"Read the termination state","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.status.containerStatuses[*].lastState.terminated}'","risk":"safe","look":"exitCode and reason. This is the single most decisive field in the whole runbook.","signals":[{"match":"OOMKilled|\"exitCode\":137","means":"The kernel killed it for memory. No amount of restarting will fix this.","goto":"cause:oom"},{"match":"\"exitCode\":126","means":"The entrypoint was found but is not executable. Check the file mode in the image.","goto":"cause:entrypoint-not-executable"},{"match":"\"exitCode\":127","means":"The entrypoint was not found at all. Wrong path, or missing shell in a distroless base.","goto":"cause:entrypoint-missing"},{"match":"\"exitCode\":1\\b","means":"The application chose to exit. The reason is in the logs, not here.","goto":"step:2"}]},{"title":"Check whether a probe is doing the killing","cmd":"kubectl describe pod {pod} -n {namespace}","risk":"safe","look":"Events for 'Liveness probe failed'. If present, the app may be healthy but slow to start, and the probe is executing it.","signals":[{"match":"Liveness probe failed","means":"The liveness probe is killing a container that may only need more startup time.","goto":"cause:liveness-too-aggressive"}]}],"causes":[{"id":"missing-config","cause":"A required env var, Secret key or ConfigMap key is absent, so the process exits during startup.","fix":"Fix the owning Deployment/Secret/ConfigMap in source control and reconcile. Do not patch the live Pod.","confirm":"kubectl get deploy -n {namespace} -o yaml | grep -A5 'envFrom\\|valueFrom'"},{"id":"oom","cause":"The container's memory limit is below its real working set.","fix":"Raise limits.memory in the owning Deployment, or fix the leak. Restarting will reproduce it every time.","confirm":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].resources}'"},{"id":"dependency-unreachable","cause":"A database, cache or upstream service was not reachable at startup.","fix":"Confirm the dependency's Service has endpoints, then decide whether the app should retry instead of exiting.","confirm":"kubectl get endpointslices -n {namespace}"},{"id":"liveness-too-aggressive","cause":"initialDelaySeconds is shorter than the app's real startup time, so liveness kills it mid-boot.","fix":"Move the slow-start allowance to a startupProbe rather than inflating the liveness delay.","confirm":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].livenessProbe}'"},{"id":"entrypoint-missing","cause":"Exit 127. The command in the image manifest does not exist at that path.","fix":"Check the Dockerfile ENTRYPOINT/CMD against the built image. A distroless base has no /bin/sh.","confirm":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].command}'"},{"id":"entrypoint-not-executable","cause":"Exit 126. The file exists but lacks the execute bit, or its interpreter line is wrong.","fix":"Add chmod +x in the Dockerfile, or fix the shebang. Rebuild the image.","confirm":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].image}'"},{"id":"permissions","cause":"runAsUser cannot read a mounted path or bind a privileged port.","fix":"Correct fsGroup on the volume, or move the app to a port above 1024.","confirm":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.securityContext}'"},{"id":"wrong-restart-policy","cause":"A one-shot workload is running under restartPolicy Always.","fix":"Run it as a Job with restartPolicy OnFailure or Never.","confirm":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.restartPolicy}'"}],"verify":["RESTARTS holds steady across at least three checks spanning the app's normal startup window.","The container reports Ready, and readiness has not flapped in recent events.","The original failing request or job path completes successfully."],"escalate":["Output of --previous logs, first 50 lines","The lastState.terminated block, verbatim","Image tag and digest, plus resources and probe definitions"]},{"id":"k8s-pod-pending","tier":"guide","technology":"Kubernetes","category":"Scheduling","title":"Pod stays Pending and is never scheduled","summary":"The Pod object exists but no node has accepted it.","aliases":["pod pending","not scheduled","failedscheduling","no nodes available","pod stuck pending","0/3 nodes are available"],"source":"https://kubernetes.io/docs/concepts/scheduling-eviction/","inputs":[{"key":"pod","label":"Pod name","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the scheduler's own reason","cmd":"kubectl get event -n {namespace} --field-selector involvedObject.name={pod},reason=FailedScheduling -o jsonpath='{.items[-1:].message}'","risk":"safe","look":"The scheduler states exactly why each node was rejected, in the form '0/N nodes are available: ...'. Read that string before anything else.","signals":[{"match":"(?i)insufficient (cpu|memory|ephemeral-storage)","means":"No node has enough free allocatable resource for the requests.","goto":"cause:insufficient-resources"},{"match":"(?i)didn't match.*(node selector|affinity)","means":"The nodeSelector or affinity rule matches no node's labels.","goto":"cause:selector-mismatch"},{"match":"(?i)had (untolerated )?taint","means":"Every candidate node carries a taint this Pod does not tolerate.","goto":"cause:taint"},{"match":"(?i)pod has unbound immediate PersistentVolumeClaims","means":"This is a storage problem wearing a scheduling costume.","goto":"cause:unbound-pvc"},{"match":"(?i)node\\(s\\) didn't find available persistent volumes|volume node affinity conflict","means":"The PV is pinned to a zone the scheduler cannot place the Pod in.","goto":"cause:zone-conflict"}]},{"title":"Compare the request against real allocatable capacity","cmd":"kubectl describe nodes | grep -A6 'Allocated resources'","risk":"safe","look":"Requests, not usage. A node at 12% CPU usage can still be 100% requested and therefore unschedulable."},{"title":"Read what this Pod is actually asking for","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].resources.requests}{\"\\n\"}{.spec.nodeSelector}{\"\\n\"}{.spec.tolerations}'","risk":"safe","look":"Compare these three against the previous step. The mismatch is usually obvious once both are on screen."}],"causes":[{"id":"insufficient-resources","cause":"The sum of requests exceeds allocatable on every node.","fix":"Lower the request to the workload's real profile, or add capacity. Raising the limit does not help; the scheduler reads requests.","confirm":"kubectl top nodes"},{"id":"selector-mismatch","cause":"nodeSelector or nodeAffinity references labels no node carries, often after a node pool was replaced.","fix":"Correct the selector, or label the intended nodes. Check for typos in the label key first.","confirm":"kubectl get nodes --show-labels"},{"id":"taint","cause":"Nodes are tainted (NoSchedule) and the Pod has no matching toleration.","fix":"Add the toleration if the Pod belongs on those nodes, otherwise target a different pool.","confirm":"kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{\"\\t\"}{.spec.taints}{\"\\n\"}{end}'"},{"id":"unbound-pvc","cause":"A referenced PVC has not bound, so the Pod cannot be placed.","fix":"Follow the PVC Pending runbook. Nothing about the Pod spec will fix this.","confirm":"kubectl get pvc -n {namespace}"},{"id":"zone-conflict","cause":"An existing PV lives in one zone and the Pod cannot be scheduled there.","fix":"Use a topology-aware StorageClass with volumeBindingMode WaitForFirstConsumer.","confirm":"kubectl get pv -o jsonpath='{range .items[*]}{.metadata.name}{\"\\t\"}{.spec.nodeAffinity}{\"\\n\"}{end}'"}],"verify":["The Pod reports a nodeName and moves past Pending.","No new FailedScheduling events appear for this Pod.","The change was made in the owning manifest, not by editing the live Pod."],"escalate":["The full FailedScheduling message","Allocated resources block from describe nodes","The Pod's requests, nodeSelector and tolerations"]},{"id":"k8s-service-no-endpoints","tier":"guide","technology":"Kubernetes","category":"Services & Networking","title":"Service exists but returns connection refused","summary":"DNS resolves the Service, but nothing answers. Usually the Service has no endpoints.","aliases":["no endpoints","connection refused service","service not working","empty endpointslice","selector not matching","503 from service"],"source":"https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/","inputs":[{"key":"service","label":"Service name","example":"checkout-api"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Check whether the Service has any endpoints at all","cmd":"kubectl get endpointslices -n {namespace} -l kubernetes.io/service-name={service}","risk":"safe","look":"ENDPOINTS column. If it is empty or <none>, the Service is pointing at nothing and the problem is the selector or pod readiness, not the network.","signals":[{"match":"(?i)<none>|No resources found","means":"No pods are backing this Service.","goto":"step:2"}]},{"title":"Compare the Service selector against real pod labels","cmd":"kubectl get svc {service} -n {namespace} -o jsonpath='{.spec.selector}{\"\\n\"}' && kubectl get pods -n {namespace} --show-labels","risk":"safe","look":"An exact match on every key. One extra or renamed label is enough to produce an empty Service, and this is the most common cause by a wide margin.","signals":[{"match":"(?i)app=","means":"Compare character by character. 'app' and 'app.kubernetes.io/name' are different keys.","goto":"cause:selector-mismatch"}]},{"title":"Check whether the backing pods are Ready","cmd":"kubectl get pods -n {namespace} -o wide","risk":"safe","look":"A pod that is Running but 0/1 Ready is excluded from endpoints. Readiness, not liveness, controls Service membership.","signals":[{"match":"0/1\\s+Running","means":"The pod is up but failing readiness, so it is deliberately kept out of the Service.","goto":"cause:not-ready"}]},{"title":"Confirm the target port matches the container port","cmd":"kubectl get svc {service} -n {namespace} -o jsonpath='{.spec.ports}'","risk":"safe","look":"targetPort must match the container's real listening port, or a named port the container declares. port is what clients dial; targetPort is where it lands."}],"causes":[{"id":"selector-mismatch","cause":"The Service selector does not match the pod labels.","fix":"Align them in the manifests. Changing the Deployment's pod labels forces a rollout, so prefer correcting the Service.","confirm":"kubectl get endpointslices -n {namespace} -l kubernetes.io/service-name={service}"},{"id":"not-ready","cause":"Pods are running but failing their readiness probe, so kube-proxy excludes them.","fix":"Fix the readiness endpoint or its threshold. The Service will populate on its own once pods report Ready.","confirm":"kubectl get pods -n {namespace} -o wide"},{"id":"wrong-target-port","cause":"targetPort points at a port nothing is listening on.","fix":"Set targetPort to the container's real port, or use a named port so the two cannot drift.","confirm":"kubectl get svc {service} -n {namespace} -o jsonpath='{.spec.ports}'"}],"verify":["EndpointSlice lists the expected pod IPs.","A request from inside the cluster to the Service name succeeds.","The count of endpoints matches the number of Ready replicas."],"escalate":["Service spec, selector and ports","Pod labels and readiness state","EndpointSlice contents"]},{"id":"k8s-imagepullbackoff","tier":"guide","technology":"Kubernetes","category":"Pods & Containers","title":"ImagePullBackOff or ErrImagePull","summary":"The kubelet cannot fetch the image. The event message says which of four reasons.","aliases":["imagepullbackoff","errimagepull","cannot pull image","image not found","unauthorized pull","pull secret"],"source":"https://kubernetes.io/docs/concepts/containers/images/","inputs":[{"key":"pod","label":"Pod name","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the pull failure message","cmd":"kubectl describe pod {pod} -n {namespace} | grep -A5 Events","risk":"safe","look":"The Failed event's message. It names the exact reason, and each reason has a different owner.","signals":[{"match":"(?i)not found|manifest unknown","means":"The tag does not exist in the registry.","goto":"cause:bad-tag"},{"match":"(?i)unauthorized|authentication required","means":"The node has no valid credentials for this registry.","goto":"cause:no-secret"},{"match":"(?i)x509|certificate","means":"TLS trust failure between the node and the registry.","goto":"cause:tls"},{"match":"(?i)timeout|i/o timeout|no such host","means":"The node could not reach the registry at all.","goto":"cause:unreachable"}]},{"title":"Check the image reference on the pod","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].image}'","risk":"safe","look":"Typos in the registry host or tag are the single most common cause. Read it character by character."},{"title":"Check whether a pull secret is attached","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.imagePullSecrets}'","risk":"safe","look":"Empty output on a private registry means the pod has no credentials. The secret must live in the same namespace as the pod."}],"causes":[{"id":"bad-tag","cause":"The tag does not exist in the repository.","fix":"Fix the tag in the manifest. Prefer pinning by digest for anything production.","confirm":""},{"id":"no-secret","cause":"No imagePullSecret, or it exists in a different namespace.","fix":"Create the secret in this namespace and reference it on the pod or its ServiceAccount.","confirm":""},{"id":"tls","cause":"The node does not trust the registry's certificate.","fix":"Install the CA on the nodes. Do not mark the registry insecure.","confirm":""},{"id":"unreachable","cause":"The node has no network path to the registry.","fix":"Check egress rules, the NAT gateway and any proxy configuration on the nodes.","confirm":""}],"verify":["The pod moves past ImagePullBackOff and the container starts.","No new Failed pull events appear."],"escalate":["The full Failed event message","The exact image reference","Whether an imagePullSecret is attached and in which namespace"]},{"id":"k8s-oomkilled","tier":"guide","technology":"Kubernetes","category":"Pods & Containers","title":"Container was OOMKilled","summary":"The kernel killed the container for exceeding its memory limit. Restarting reproduces it.","aliases":["oomkilled","exit 137","out of memory","memory limit","container killed memory","oom"],"source":"https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/","inputs":[{"key":"pod","label":"Pod name","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Confirm it was memory and not an external kill","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.status.containerStatuses[*].lastState.terminated.reason}'","risk":"safe","look":"OOMKilled specifically. Exit 137 alone only means SIGKILL, which something else could have sent.","signals":[{"match":"OOMKilled","means":"The kernel's OOM killer took it. This is a limit problem, not a crash.","goto":"cause:limit-too-low"}]},{"title":"Read the configured limit","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].resources}'","risk":"safe","look":"Compare limits.memory against what the process actually needs. If requests and limits differ widely, scheduling and eviction behave in ways you may not expect."},{"title":"Look at actual usage while it runs","cmd":"kubectl top pod {pod} -n {namespace} --containers","risk":"safe","look":"Usage climbing steadily towards the limit points at a leak. Usage spiking at a particular operation points at a batch size or a large request."},{"title":"Check whether the whole node is under pressure","cmd":"kubectl describe node $(kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.nodeName}') | grep -A5 Conditions","risk":"safe","look":"MemoryPressure true means the node is squeezed and eviction is in play, which is a different problem from a single container's limit."}],"causes":[{"id":"limit-too-low","cause":"The limit is below the real working set.","fix":"Raise limits.memory in the owning Deployment. Measure first with kubectl top rather than guessing.","confirm":""},{"id":"leak","cause":"Memory grows without bound until the limit is reached.","fix":"Raising the limit only delays it. Profile the application; the limit is doing its job.","confirm":""},{"id":"jvm-unaware","cause":"A JVM or Node process sized its heap against the node rather than the cgroup.","fix":"Set an explicit max heap, or use a runtime version that is container-aware.","confirm":""},{"id":"node-pressure","cause":"The node is out of memory and evicting pods.","fix":"Check requests across the node. Under-requesting causes overcommit and cascading evictions.","confirm":""}],"verify":["RESTARTS holds steady through a full workload cycle.","kubectl top shows headroom between usage and the limit."],"escalate":["lastState.terminated block","resources.requests and resources.limits","kubectl top output over a few minutes"]},{"id":"k8s-rollout-stuck","tier":"guide","technology":"Kubernetes","category":"Workloads","title":"Deployment rollout never finishes","summary":"kubectl rollout status hangs. New pods are not becoming ready, or the old ones will not go.","aliases":["rollout stuck","deployment not progressing","waiting for rollout","progressdeadlineexceeded","stuck deploying","rollout hangs"],"source":"https://kubernetes.io/docs/concepts/workloads/controllers/deployment/","inputs":[{"key":"deploy","label":"Deployment","example":"checkout-api"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the rollout condition","cmd":"kubectl get deploy {deploy} -n {namespace} -o jsonpath='{.status.conditions}'","risk":"safe","look":"The Progressing condition's reason. ProgressDeadlineExceeded means it gave up; that reason names the layer at fault.","signals":[{"match":"ProgressDeadlineExceeded","means":"The new ReplicaSet never became available in time.","goto":"step:2"},{"match":"(?i)ReplicaSetUpdated","means":"Still in progress. Give it the deadline before treating it as stuck.","goto":""}]},{"title":"Find what the new pods are doing","cmd":"kubectl get pods -n {namespace} -l app={deploy} --sort-by=.metadata.creationTimestamp","risk":"safe","look":"The newest pods. Pending means scheduling, CrashLoop means the app, 0/1 Running means readiness.","signals":[{"match":"Pending","means":"Scheduling, not deployment. Follow the Pending runbook.","goto":"cause:scheduling"},{"match":"CrashLoopBackOff","means":"The new image does not start. Follow the CrashLoop runbook.","goto":"cause:new-image-broken"},{"match":"0/1\\s+Running","means":"The container runs but fails readiness.","goto":"cause:readiness"}]},{"title":"Check whether a disruption budget is blocking removal","cmd":"kubectl get pdb -n {namespace}","risk":"safe","look":"ALLOWED DISRUPTIONS at zero means old pods cannot be evicted, so the rollout cannot proceed."},{"title":"Check the surge and unavailable settings","cmd":"kubectl get deploy {deploy} -n {namespace} -o jsonpath='{.spec.strategy}'","risk":"safe","look":"maxSurge 0 with maxUnavailable 0 is a deadlock: nothing new can start and nothing old can stop."}],"causes":[{"id":"new-image-broken","cause":"The new image fails to start.","fix":"Roll back, then fix the image. kubectl rollout undo restores the previous ReplicaSet.","confirm":""},{"id":"readiness","cause":"New pods run but never pass readiness.","fix":"Check the probe path, port and initial delay against the new image's real startup.","confirm":""},{"id":"scheduling","cause":"New pods cannot be placed.","fix":"Follow the Pending runbook. Often the surge replica has nowhere to go.","confirm":""},{"id":"pdb-block","cause":"A PodDisruptionBudget forbids removing the old pods.","fix":"Relax minAvailable, or scale up so the budget can be satisfied during the roll.","confirm":""},{"id":"strategy-deadlock","cause":"maxSurge and maxUnavailable are both zero.","fix":"Set at least one of them above zero.","confirm":""}],"verify":["kubectl rollout status returns successfully.","All replicas are on the new ReplicaSet and Ready."],"escalate":["Deployment status conditions","State of the newest pods","Strategy settings and any PDB"]},{"id":"k8s-node-notready","tier":"guide","technology":"Kubernetes","category":"Nodes","title":"Node is NotReady","summary":"The node stopped reporting healthy. Pods on it will be evicted after the toleration window.","aliases":["node notready","node not ready","kubelet down","node unreachable","node lost","kubelet stopped posting"],"source":"https://kubernetes.io/docs/concepts/architecture/nodes/","inputs":[{"key":"node","label":"Node name","example":"ip-10-0-3-14.ec2.internal"}],"steps":[{"title":"Read the node's conditions","cmd":"kubectl describe node {node} | grep -A10 Conditions","risk":"safe","look":"Which condition is false or unknown. Ready Unknown means the kubelet stopped reporting entirely, which is very different from a pressure condition.","signals":[{"match":"(?i)Ready\\s+Unknown","means":"The kubelet stopped posting status. The node may be gone or partitioned.","goto":"cause:kubelet-silent"},{"match":"(?i)DiskPressure\\s+True","means":"The node is out of disk.","goto":"cause:disk"},{"match":"(?i)MemoryPressure\\s+True","means":"The node is out of memory.","goto":"cause:memory"},{"match":"(?i)PIDPressure\\s+True","means":"Process ID exhaustion, usually a fork loop.","goto":"cause:pids"},{"match":"(?i)NetworkUnavailable\\s+True","means":"The CNI has not configured the node's network.","goto":"cause:cni"}]},{"title":"Check how long it has been unhealthy","cmd":"kubectl get node {node} -o wide","risk":"safe","look":"The age against the last transition. Pods are evicted after the not-ready toleration, five minutes by default."},{"title":"See what is still on it","cmd":"kubectl get pods --all-namespaces --field-selector spec.nodeName={node}","risk":"safe","look":"Anything not yet evicted. Stateful workloads here need attention before the node is replaced."},{"title":"Cordon it so nothing new lands","cmd":"kubectl cordon {node}","risk":"state","look":"The node shows SchedulingDisabled. Do this before investigating so the problem does not spread.","note":"Marks the node unschedulable. Running pods are not touched, but nothing new will be placed. Reverse with kubectl uncordon."}],"causes":[{"id":"kubelet-silent","cause":"The kubelet is not posting status.","fix":"Check the host: is it up, is the kubelet service running, can it reach the API server.","confirm":""},{"id":"disk","cause":"The node's disk is full, often image or log growth.","fix":"Clear space, then set image garbage collection and log rotation so it does not recur.","confirm":""},{"id":"memory","cause":"The node is out of memory.","fix":"Look for pods without limits. Overcommit on requests is the usual root cause.","confirm":""},{"id":"pids","cause":"Process ID exhaustion.","fix":"Find the fork loop. Set a pid limit on the offending workload.","confirm":""},{"id":"cni","cause":"The CNI plugin has not initialised on the node.","fix":"Check the CNI DaemonSet's pod on that node.","confirm":""}],"verify":["The node reports Ready.","Workloads have rescheduled and are serving.","The condition that flipped has a remediation, not just a restart."],"escalate":["Full conditions block","Whether the host is reachable outside Kubernetes","Pods still bound to the node"]},{"id":"k8s-pvc-pending","tier":"guide","technology":"Kubernetes","category":"Storage","title":"PersistentVolumeClaim stays Pending","summary":"The claim never binds, so every pod using it stays Pending too.","aliases":["pvc pending","volume not bound","waiting for first consumer","no persistent volumes available","storage class","pvc stuck"],"source":"https://kubernetes.io/docs/concepts/storage/persistent-volumes/","inputs":[{"key":"pvc","label":"PVC name","example":"postgres-data"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the binding events","cmd":"kubectl describe pvc {pvc} -n {namespace} | grep -A10 Events","risk":"safe","look":"The provisioner's own message. WaitForFirstConsumer is not an error at all; it is the expected state until a pod is scheduled.","signals":[{"match":"(?i)waiting for first consumer","means":"Normal. The volume binds when a pod that uses it gets scheduled.","goto":"cause:wait-first-consumer"},{"match":"(?i)storageclass.*not found","means":"The named StorageClass does not exist in this cluster.","goto":"cause:no-storageclass"},{"match":"(?i)no persistent volumes available","means":"Static provisioning with no matching PV.","goto":"cause:no-matching-pv"},{"match":"(?i)failed to provision|quota","means":"The provisioner tried and the backend refused.","goto":"cause:backend-refused"}]},{"title":"Check the requested class and access mode","cmd":"kubectl get pvc {pvc} -n {namespace} -o jsonpath='{.spec.storageClassName}{\" \"}{.spec.accessModes}{\" \"}{.spec.resources.requests.storage}'","risk":"safe","look":"ReadWriteMany is unsupported by most block storage drivers and is a common silent mismatch."},{"title":"List the classes that actually exist","cmd":"kubectl get storageclass","risk":"safe","look":"Whether the requested name exists, and which class is marked default. An empty storageClassName uses the default; a missing default leaves the claim Pending forever."}],"causes":[{"id":"wait-first-consumer","cause":"The class uses WaitForFirstConsumer.","fix":"Nothing is wrong. Schedule a pod that mounts it and it will bind.","confirm":""},{"id":"no-storageclass","cause":"The named class does not exist.","fix":"Correct the name, or install the class. Cluster migrations often leave stale names in manifests.","confirm":""},{"id":"no-matching-pv","cause":"Static provisioning with no PV matching size, class and access mode.","fix":"Create a matching PV, or move to dynamic provisioning.","confirm":""},{"id":"access-mode","cause":"The driver does not support the requested access mode.","fix":"Use ReadWriteOnce for block storage, or a filesystem driver for ReadWriteMany.","confirm":""},{"id":"backend-refused","cause":"The storage backend rejected the request, often on quota.","fix":"Read the provisioner's message and check the cloud-side quota.","confirm":""}],"verify":["The PVC reports Bound with a volume name.","The pod that needed it is scheduled and running."],"escalate":["PVC events","Requested class, size and access mode","Output of kubectl get storageclass"]},{"id":"k8s-dns-failure","tier":"guide","technology":"Kubernetes","category":"DNS","title":"DNS resolution fails inside pods","summary":"Names do not resolve from within the cluster. Work out whether it is CoreDNS, the pod's resolver, or upstream.","aliases":["dns not working","name resolution failed","coredns","cannot resolve","nxdomain","server misbehaving","temporary failure in name resolution"],"source":"https://kubernetes.io/docs/tasks/administer-cluster/dns-debugging-resolution/","inputs":[{"key":"pod","label":"Pod name","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Test resolution of a cluster name from the pod","cmd":"kubectl exec {pod} -n {namespace} -- getent hosts kubernetes.default.svc.cluster.local","risk":"safe","look":"An IP means cluster DNS works and the problem is narrower than you thought. Nothing means the resolver path is broken.","signals":[{"match":"\\d+\\.\\d+\\.\\d+\\.\\d+","means":"Cluster DNS works. Test an external name next.","goto":"step:4"},{"match":"^\\s*$","means":"Cluster DNS is not answering for this pod.","goto":"step:2"}]},{"title":"Check that CoreDNS is running","cmd":"kubectl get pods -n kube-system -l k8s-app=kube-dns -o wide","risk":"safe","look":"All replicas Ready. CrashLooping CoreDNS is usually a bad Corefile edit or a resolver loop.","signals":[{"match":"CrashLoopBackOff","means":"CoreDNS itself is failing. Check its logs for a loop plugin detection.","goto":"cause:coredns-down"},{"match":"0/1","means":"CoreDNS is not ready, so nothing in the cluster resolves.","goto":"cause:coredns-down"}]},{"title":"Read the pod's resolver configuration","cmd":"kubectl exec {pod} -n {namespace} -- cat /etc/resolv.conf","risk":"safe","look":"The nameserver should be the cluster DNS Service IP. A node-level resolver here means dnsPolicy is wrong for a cluster workload.","signals":[{"match":"(?i)ndots:5","means":"Normal, but it means short names try several search domains first, which looks like slow DNS under load.","goto":"cause:ndots"},{"match":"nameserver 169\\.254|nameserver 8\\.8","means":"The pod is using a node or public resolver, not cluster DNS.","goto":"cause:wrong-dnspolicy"}]},{"title":"Test an external name","cmd":"kubectl exec {pod} -n {namespace} -- getent hosts github.com","risk":"safe","look":"Cluster names working but external failing points at CoreDNS's upstream forwarder or egress, not at Kubernetes DNS itself."}],"causes":[{"id":"coredns-down","cause":"CoreDNS is unhealthy.","fix":"Read its logs. A loop plugin error means the upstream resolver points back at CoreDNS.","confirm":""},{"id":"wrong-dnspolicy","cause":"The pod uses host DNS instead of cluster DNS.","fix":"Set dnsPolicy ClusterFirst. hostNetwork pods need ClusterFirstWithHostNet explicitly.","confirm":""},{"id":"upstream","cause":"CoreDNS cannot reach its upstream resolver.","fix":"Check the forward directive in the Corefile and egress from the CoreDNS pods.","confirm":""},{"id":"ndots","cause":"Short names expand through five search domains before the real lookup.","fix":"Use fully qualified names with a trailing dot for hot paths, or tune ndots per pod.","confirm":""},{"id":"netpol","cause":"A NetworkPolicy blocks egress to port 53.","fix":"Allow UDP and TCP 53 to kube-system in the policy.","confirm":""}],"verify":["Both cluster and external names resolve from inside the pod.","CoreDNS replicas are Ready with no restarts."],"escalate":["resolv.conf from inside the pod","CoreDNS pod state and logs","Which names fail: cluster, external, or both"]},{"id":"k8s-ingress-503","tier":"guide","technology":"Kubernetes","category":"Ingress","title":"Ingress returns 502, 503 or 404","summary":"The ingress answers but the backend does not. Each status points at a different layer.","aliases":["ingress 503","502 bad gateway","ingress 404","service unavailable","no healthy upstream","default backend"],"source":"https://kubernetes.io/docs/concepts/services-networking/ingress/","inputs":[{"key":"ingress","label":"Ingress name","example":"checkout"},{"key":"namespace","label":"Namespace","example":"production"},{"key":"service","label":"Backend service","example":"checkout-api"}],"steps":[{"title":"Identify which status you get and from whom","cmd":"curl -sSI https://$(kubectl get ingress {ingress} -n {namespace} -o jsonpath='{.spec.rules[0].host}')/","risk":"safe","look":"The Server header tells you whether the ingress controller answered or something upstream did. 404 usually means no rule matched; 503 usually means no healthy backend.","signals":[{"match":"503","means":"The controller matched a rule but has no healthy endpoint behind it.","goto":"cause:no-endpoints"},{"match":"404","means":"No ingress rule matched this host and path.","goto":"cause:no-rule-match"},{"match":"502","means":"The controller reached a backend and got an invalid response.","goto":"cause:backend-error"}]},{"title":"Check the ingress has an address and correct rules","cmd":"kubectl get ingress {ingress} -n {namespace} -o wide","risk":"safe","look":"An empty ADDRESS means no controller has claimed it, usually a missing or wrong ingressClassName."},{"title":"Check the backend service has endpoints","cmd":"kubectl get endpointslices -n {namespace} -l kubernetes.io/service-name={service}","risk":"safe","look":"Empty endpoints produce 503 every time. This is the most common cause by a wide margin.","signals":[{"match":"(?i)<none>|No resources found","means":"No pods behind the service. Follow the no-endpoints runbook.","goto":"cause:no-endpoints"}]},{"title":"Read the controller's own logs","cmd":"kubectl logs -n ingress-nginx -l app.kubernetes.io/component=controller --tail=50","risk":"safe","look":"The controller logs the upstream it chose and why it failed. This is more precise than anything you can infer from the client side."}],"causes":[{"id":"no-endpoints","cause":"The backend service has no ready endpoints.","fix":"Fix pod readiness or the service selector. The ingress is working correctly by refusing to send traffic nowhere.","confirm":""},{"id":"no-rule-match","cause":"Host or path in the request does not match any rule.","fix":"Check pathType. Prefix and Exact behave differently, and this catches people out constantly.","confirm":""},{"id":"wrong-class","cause":"No controller claimed the ingress.","fix":"Set ingressClassName to a class that exists in the cluster.","confirm":""},{"id":"backend-error","cause":"The backend returned something the controller could not use.","fix":"Check the app's own logs. Often TLS expected on a plain-HTTP backend port.","confirm":""},{"id":"wrong-port","cause":"The ingress points at a service port that does not exist.","fix":"Match the port name or number to the service definition.","confirm":""}],"verify":["The URL returns the expected status from the application.","The controller logs show the correct upstream being selected."],"escalate":["The exact status and response headers","Ingress rules and class","Backend endpoints","Controller log lines for the request"]},{"id":"k8s-pod-evicted","tier":"guide","technology":"Kubernetes","category":"Nodes","title":"Pods are being Evicted","summary":"The kubelet is reclaiming resources on a node under pressure. The eviction message names which resource.","aliases":["pod evicted","evicted","node under pressure","ephemeral storage","the node was low on resource","diskpressure eviction"],"source":"https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/","inputs":[{"key":"namespace","label":"Namespace","example":"production"},{"key":"pod","label":"Evicted pod name","example":"checkout-api-7d9f6b8c5-x4k2m"}],"steps":[{"title":"List the evicted pods and read the reason","cmd":"kubectl get pods -n {namespace} --field-selector status.phase=Failed -o custom-columns=NAME:.metadata.name,REASON:.status.reason,MSG:.status.message","risk":"safe","look":"The message names the resource that ran out. That single word decides everything that follows.","signals":[{"match":"(?i)ephemeral-storage","means":"The pod wrote too much to its writable layer or an emptyDir.","goto":"cause:ephemeral"},{"match":"(?i)memory","means":"The node ran out of memory and reclaimed the largest offender over its request.","goto":"cause:node-memory"},{"match":"(?i)inodes","means":"The node exhausted inodes, usually many small files.","goto":"cause:inodes"}]},{"title":"Find which node is under pressure","cmd":"kubectl get nodes -o custom-columns=NAME:.metadata.name,CONDITIONS:.status.conditions[?(@.status==\\\"True\\\")].type","risk":"safe","look":"Which nodes report DiskPressure or MemoryPressure. If it is one node, it is a host problem; if it is all of them, it is a capacity problem."},{"title":"Check whether the evicted workload declared requests","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].resources.requests}' 2>/dev/null || echo 'pod already removed'","risk":"safe","look":"Pods without requests are evicted first. Declaring a request is what buys a workload protection."}],"causes":[{"id":"ephemeral","cause":"The container wrote more to local disk than its ephemeral-storage allowance.","fix":"Set an ephemeral-storage request and limit, and move logs to stdout rather than files.","confirm":""},{"id":"node-memory","cause":"The node ran out of memory.","fix":"Set memory requests on the workloads sharing that node. Eviction targets pods exceeding their request first.","confirm":""},{"id":"inodes","cause":"Inode exhaustion from many small files.","fix":"Find the directory generating them. Log rotation usually solves it.","confirm":""},{"id":"no-requests","cause":"Best-effort pods are evicted first.","fix":"Declare requests so the workload gets a guaranteed or burstable class.","confirm":""}],"verify":["No new evictions during a normal workload window.","The node's pressure conditions are false.","The affected workloads declare requests."],"escalate":["Eviction message verbatim","Node conditions","Whether the workload declares requests and limits"]},{"id":"k8s-rbac-forbidden","tier":"guide","technology":"Kubernetes","category":"Access & RBAC","title":"Forbidden: User cannot perform this action","summary":"The API server authenticated you but refused the operation. The message names exactly what is missing.","aliases":["forbidden","cannot list resource","rbac denied","user cannot get","access denied kubectl","no permission namespace"],"source":"https://kubernetes.io/docs/reference/access-authn-authz/rbac/","inputs":[{"key":"namespace","label":"Namespace","example":"production"},{"key":"verb","label":"Verb","example":"list"},{"key":"resource","label":"Resource","example":"pods"}],"steps":[{"title":"Read the forbidden message in full","cmd":"kubectl get {resource} -n {namespace}","risk":"safe","look":"The message names the identity, the verb, the resource and the namespace. All four matter and the fix depends on which one is wrong.","signals":[{"match":"(?i)system:serviceaccount","means":"A ServiceAccount, not you. Something is running with in-cluster credentials.","goto":"cause:serviceaccount"},{"match":"(?i)at the cluster scope","means":"The resource is cluster-scoped, so a namespaced Role cannot grant it.","goto":"cause:needs-clusterrole"},{"match":"(?i)in the namespace","means":"Namespaced. A RoleBinding in that namespace will do it.","goto":"cause:needs-rolebinding"}]},{"title":"Ask the API server directly whether you can do it","cmd":"kubectl auth can-i {verb} {resource} -n {namespace}","risk":"safe","look":"A definitive yes or no from the authorizer itself, with no guessing about which binding applies."},{"title":"List everything your identity can do here","cmd":"kubectl auth can-i --list -n {namespace}","risk":"safe","look":"The full effective permission set. Comparing this against what you expected usually makes the gap obvious."},{"title":"Find which bindings mention your identity","cmd":"kubectl get rolebindings,clusterrolebindings -A -o wide | findstr <your-identity>","risk":"safe","look":"Which roles are actually attached. An empty result means nothing grants you anything in this namespace."}],"causes":[{"id":"needs-rolebinding","cause":"No Role or RoleBinding grants this verb in this namespace.","fix":"Create a RoleBinding to a Role carrying that verb. Grant the narrowest set that works.","confirm":""},{"id":"needs-clusterrole","cause":"The resource is cluster-scoped.","fix":"A ClusterRoleBinding is required. A namespaced RoleBinding cannot grant cluster-scoped access however it is written.","confirm":""},{"id":"serviceaccount","cause":"The request is from a ServiceAccount, not your user.","fix":"Bind the role to that ServiceAccount. Pods use their SA, never your kubeconfig.","confirm":""},{"id":"wrong-context","cause":"You are authenticated as a different identity than you assumed.","fix":"Check kubectl config current-context. Multi-cluster setups make this a routine mistake.","confirm":""},{"id":"aggregation","cause":"A ClusterRole relies on aggregation labels that do not match.","fix":"Check the aggregationRule selectors against the labels on the contributing roles.","confirm":""}],"verify":["kubectl auth can-i returns yes.","The operation succeeds.","The grant is as narrow as the task requires."],"escalate":["The verbatim forbidden message","Output of kubectl auth can-i --list","Which identity is in use"]},{"id":"k8s-hpa-not-scaling","tier":"guide","technology":"Kubernetes","category":"Autoscaling","title":"HorizontalPodAutoscaler is not scaling","summary":"Load is high but replica count does not move. Usually metrics, not the policy.","aliases":["hpa not scaling","autoscaler not working","unknown metrics","failedgetresourcemetric","hpa targets unknown","replicas not increasing"],"source":"https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/","inputs":[{"key":"hpa","label":"HPA name","example":"checkout-api"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the HPA's current targets","cmd":"kubectl get hpa {hpa} -n {namespace}","risk":"safe","look":"The TARGETS column. <unknown> means no metrics are arriving and the HPA is inert; a real percentage means metrics work and the policy is the question.","signals":[{"match":"<unknown>","means":"No metrics. The HPA cannot make any decision at all.","goto":"cause:no-metrics"},{"match":"(?i)\\d+%/\\d+%","means":"Metrics are flowing. Read the conditions for why it is holding.","goto":"step:2"}]},{"title":"Read the scaling conditions","cmd":"kubectl describe hpa {hpa} -n {namespace} | findstr /C:\"Conditions\" /C:\"Events\" -A8","risk":"safe","look":"ScalingLimited with a reason names the exact constraint, such as having hit maxReplicas or being inside the stabilisation window.","signals":[{"match":"(?i)TooManyReplicas|at max","means":"Already at maxReplicas. The ceiling is the constraint.","goto":"cause:at-max"},{"match":"(?i)FailedGetResourceMetric","means":"metrics-server is not returning usage for these pods.","goto":"cause:no-metrics"},{"match":"(?i)desired.*within.*range","means":"It is deliberately holding, usually the stabilisation window.","goto":"cause:stabilisat
