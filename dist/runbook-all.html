<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Runbook</title>
<style>
:root{
  --paper:#EEF1F4; --surface:#fff; --ink:#141C24; --muted:#5A6976;
  --rule:#D5DCE3; --rule-soft:#E4E9ED;
  --safe:#0F7B54; --state:#A15C00; --destructive:#BC2C24;
  --focus:#1F5FA8;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --mono:"Cascadia Mono",ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.5;font-feature-settings:"tnum" 1}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:940px;margin:0 auto;padding:0 20px}

/* ---- context strip ---- */
.ctx{background:var(--ink);color:#DCE3EA;position:sticky;top:0;z-index:20}
.ctx .wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding-top:9px;padding-bottom:9px}
.ctx .brand{font-weight:650;letter-spacing:-.01em;color:#fff;margin-right:auto;font-size:15px}
.ctx .by{font-weight:400;color:#8095A8;font-size:12.5px;margin-left:7px}
@media(max-width:640px){.ctx .by{display:none}}
.ctx label{display:flex;align-items:baseline;gap:6px;font-size:12.5px;color:#9FB0BF}
.ctx input{background:transparent;border:0;border-bottom:1px solid #3C4A57;color:#fff;
  font-family:var(--mono);font-size:13px;padding:1px 2px;width:15ch;min-width:0}
.ctx input:focus{border-bottom-color:#7FA8D4;outline:none}
.ctx input::placeholder{color:#5A6976}

/* ---- search ---- */
.search{padding:44px 0 26px}
h1{font-size:28px;line-height:1.2;letter-spacing:-.02em;margin:0 0 6px;font-weight:640}
.lede{color:var(--muted);margin:0 0 22px;max-width:62ch}
#q{width:100%;padding:14px 16px;border:1px solid var(--rule);border-radius:6px;
  background:var(--surface);font-size:17px}
#q:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px rgba(31,95,168,.12)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
.chips.sub{margin-top:8px}
.tab{background:var(--surface);border:1px solid var(--rule);border-radius:20px;padding:6px 14px;
  font-size:13.5px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tab:hover{border-color:var(--ink)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab .n{font-size:11.5px;opacity:.6;font-variant-numeric:tabular-nums}
.chips.sub .tab{padding:4px 11px;font-size:12.5px;border-radius:4px;color:var(--muted)}
.chips.sub .tab.on{color:#fff}
.hint{margin-top:13px;font-size:12.5px;color:var(--muted)}
kbd{font-family:var(--mono);font-size:11.5px;border:1px solid var(--rule);border-bottom-width:2px;
  border-radius:3px;padding:1px 5px;background:var(--surface)}

/* ---- results ---- */
.results{list-style:none;margin:0;padding:0 0 56px}
.results li{border-top:1px solid var(--rule-soft)}
.results li:last-child{border-bottom:1px solid var(--rule-soft)}
.hit{display:block;width:100%;text-align:left;background:none;border:0;padding:15px 14px;cursor:pointer}
.hit:hover,.hit.cur{background:var(--surface)}
.hit h3{margin:0;font-size:16.5px;font-weight:600;letter-spacing:-.005em}
.hit p{margin:3px 0 0;color:var(--muted);font-size:14px}
.meta{margin-top:7px;font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.empty{padding:40px 14px;color:var(--muted);border-top:1px solid var(--rule-soft)}

/* ---- trust badge ---- */
.trust{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600}
.trust::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-verified{color:var(--safe)} .t-documented{color:var(--state)} .t-reference{color:var(--muted)}

/* ---- runbook ---- */
.rb{padding:26px 0 90px;display:none}
.back{background:none;border:0;padding:0;color:var(--muted);font-size:13.5px;cursor:pointer;margin-bottom:18px}
.back:hover{color:var(--ink)}
.rb h2{font-size:25px;line-height:1.2;letter-spacing:-.02em;margin:0 0 6px;font-weight:640}
.rb .sum{color:var(--muted);margin:0 0 14px;max-width:64ch}
.prov{font-size:12.5px;color:var(--muted);border-left:2px solid var(--rule);padding:2px 0 2px 11px;margin-bottom:26px}
.prov code{font-family:var(--mono);font-size:12px}
.prov a{color:var(--focus)}

/* ---- the rail ---- */
ol.steps{list-style:none;margin:0;padding:0}
.step{position:relative;padding:0 0 26px 40px}
.step::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:1px;background:var(--rule)}
.step:last-child::before{display:none}
.step.danger::before{background:var(--destructive);opacity:.35}
.mark{position:absolute;left:0;top:2px;width:23px;height:23px;border:1px solid var(--rule);
  background:var(--surface);border-radius:3px;cursor:pointer;padding:0;
  font-family:var(--mono);font-size:12px;color:var(--muted);line-height:21px;text-align:center}
.mark:hover{border-color:var(--ink)}
.step.done .mark{background:var(--ink);border-color:var(--ink);color:#fff}
.step.done .stitle{color:var(--muted)}
.step.danger .mark{border-color:var(--destructive);color:var(--destructive)}

.shead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:9px}
.stitle{font-weight:600;font-size:16px;letter-spacing:-.005em}
.chip{font-size:11px;font-weight:650;padding:2px 7px;border-radius:3px;white-space:nowrap}
.c-safe{color:var(--safe);background:rgba(15,123,84,.09)}
.c-state{color:var(--state);background:rgba(161,92,0,.10)}
.c-destructive{color:#fff;background:var(--destructive)}

.cmd{position:relative;background:var(--ink);border-radius:5px;margin:0 0 10px}
.cmd pre{margin:0;padding:13px 84px 13px 14px;overflow-x:auto;font-family:var(--mono);
  font-size:13.5px;line-height:1.55;color:#E8EEF3;white-space:pre-wrap;word-break:break-word}
.cmd .fill{color:#8FD0A8;font-weight:600}
.cmd .unfilled{color:#E0A86A;border-bottom:1px dashed #8A6A48}
.copy{position:absolute;top:8px;right:8px;background:#2A3640;border:0;color:#C6D3DD;
  font-size:12px;padding:5px 10px;border-radius:4px;cursor:pointer}
.copy:hover{background:#3A4854;color:#fff}
.veil{padding:13px 14px;color:#E0A86A;font-family:var(--mono);font-size:13px;cursor:pointer;
  display:flex;align-items:center;gap:9px}
.veil:hover{color:#fff}

.look{font-size:14.5px;color:var(--muted);margin:0 0 8px;max-width:66ch}
.look b{color:var(--ink);font-weight:600}
.note{font-size:14px;border-left:2px solid var(--destructive);padding:6px 0 6px 11px;
  margin:0 0 10px;max-width:64ch;color:var(--ink)}
.note-state{border-left-color:var(--state)}

/* ---- output matcher ---- */
.match{margin-top:10px}
.match summary{font-size:13.5px;color:var(--focus);cursor:pointer;list-style:none}
.match summary::-webkit-details-marker{display:none}
.match summary::before{content:"+ ";font-family:var(--mono)}
.match[open] summary::before{content:"- "}
.match textarea{width:100%;margin-top:9px;min-height:78px;padding:10px 12px;border:1px solid var(--rule);
  border-radius:5px;font-family:var(--mono);font-size:12.5px;background:var(--surface);resize:vertical}
.verdict{margin-top:9px;padding:11px 13px;border-radius:5px;font-size:14.5px;background:var(--surface);
  border:1px solid var(--rule)}
.verdict.hit{border-color:var(--safe);border-left:3px solid var(--safe)}
.verdict.miss{color:var(--muted)}
.verdict b{display:block;margin-bottom:3px}
.jump{background:none;border:0;color:var(--focus);padding:0;margin-top:6px;cursor:pointer;font-size:13.5px}

/* ---- causes ---- */
.sec{margin-top:34px;padding-top:20px;border-top:1px solid var(--rule)}
.sec h3{font-size:13px;font-weight:650;margin:0 0 14px;color:var(--muted);letter-spacing:.01em}
.cause{padding:13px 15px;background:var(--surface);border:1px solid var(--rule-soft);border-radius:5px;margin-bottom:9px}
.cause.lit{border-color:var(--safe);border-left:3px solid var(--safe)}
.cause .rank{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-right:7px}
.cause .what{font-weight:600;font-size:15px}
.cause .fix{color:var(--muted);font-size:14.5px;margin-top:4px;max-width:66ch}
.cause .fix b{color:var(--ink);font-weight:600}
ul.plain{margin:0;padding-left:19px;color:var(--muted);font-size:14.5px;max-width:66ch}
ul.plain li{margin-bottom:5px}

/* ---- action bar ---- */
.bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--rule);
  padding:11px 0;display:none;z-index:15}
.bar .wrap{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.bar .prog{font-size:13px;color:var(--muted);margin-right:auto;font-variant-numeric:tabular-nums}
.act{background:var(--surface);border:1px solid var(--rule);border-radius:5px;padding:7px 13px;
  font-size:13.5px;cursor:pointer}
.act:hover{border-color:var(--ink)}
.act.key{background:var(--ink);color:#fff;border-color:var(--ink)}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:9px 17px;border-radius:5px;font-size:13.5px;z-index:30;display:none}

footer{color:var(--muted);font-size:12.5px;padding:0 0 30px;max-width:70ch;white-space:pre-line}

@media(max-width:640px){
  .wrap{padding:0 15px}
  .search{padding:26px 0 18px} h1{font-size:23px} .rb h2{font-size:21px}
  .ctx .wrap{gap:11px} .ctx input{width:11ch}
  .step{padding-left:33px} .mark{width:21px;height:21px;line-height:19px}
  .step::before{left:10px}
  .cmd pre{padding-right:14px;padding-top:38px}
  .copy{top:6px;right:auto;left:8px}
}
</style>
</head>
<body>

<div class="ctx"><div class="wrap">
  <span class="brand">DevOps Runbook <span class="by">by Dinesh Ilangovan</span></span>
  <span id="ctxfields"></span>
</div></div>

<main class="wrap">

<section class="search" id="searchview">
  <h1>What is broken?</h1>
  <p class="lede">Type the symptom, the error string, or what you were doing when it failed.</p>
  <input id="q" placeholder="CrashLoopBackOff, pod pending, committed to main, force push..." autocomplete="off" autofocus>
  <div class="chips" id="techchips"></div>
  <div class="chips sub" id="catchips"></div>
  <p class="hint"><kbd>/</kbd> search &nbsp; <kbd>↑</kbd><kbd>↓</kbd> move &nbsp; <kbd>Enter</kbd> open &nbsp; <kbd>Esc</kbd> back</p>
</section>

<ul class="results" id="results"></ul>

<section class="rb" id="rbview"></section>

<footer id="foot"></footer>
</main>

<div class="bar" id="bar"><div class="wrap">
  <span class="prog" id="prog"></span>
  <button class="act" id="a-safe">Copy read-only steps</button>
  <button class="act" id="a-esc">Copy handoff notes</button>
  <button class="act key" id="a-log">Copy incident log</button>
</div></div>
<div class="toast" id="toast"></div>

<script id="data" type="application/json">[{"id":"docker-exits-immediately","tier":"documented","technology":"Docker","category":"Container Lifecycle","title":"Container exits straight after docker run","summary":"The container starts and dies within a second. The exit code tells you which of five very different problems you have.","aliases":["container exits immediately","exits right away","wont stay running","container stops","exited (1)","exited (126)","exited (127)","exited (137)","docker run does nothing"],"source":"https://docs.docker.com/engine/reference/run/#exit-status","inputs":[{"key":"container","label":"Container","example":"checkout-api"},{"key":"image","label":"Image","example":"registry.local/checkout-api:1.4.2"}],"steps":[{"title":"Read the exit code","cmd":"docker ps -a --filter name={container} --format '{{.Names}}\\t{{.Status}}'","risk":"safe","look":"The number in Exited (N). This single number splits the problem five ways, and every branch below has a different fix. Do not skip to the logs before you have it.","signals":[{"match":"Exited \\(125\\)","means":"Docker itself refused to start the container. The error is in your run flags, not the image.","goto":"cause:bad-run-flags"},{"match":"Exited \\(126\\)","means":"The entrypoint was found but could not be executed. Missing execute bit, or a CRLF line ending in a shell script.","goto":"cause:not-executable"},{"match":"Exited \\(127\\)","means":"The entrypoint was not found at all. Wrong path, or no shell in a distroless or scratch base.","goto":"cause:not-found"},{"match":"Exited \\(137\\)","means":"SIGKILL. Either the memory limit was hit or something sent a kill.","goto":"cause:oom"},{"match":"Exited \\(0\\)","means":"It ran and finished normally. There was no long-running process to keep it alive.","goto":"cause:no-foreground-process"},{"match":"Exited \\(1\\)","means":"The application itself chose to exit. The reason is in the logs.","goto":"step:2"}]},{"title":"Read the logs it managed to write","cmd":"docker logs {container} --tail=100","risk":"safe","look":"The first error, not the last. If this is empty, the process died before it could log anything, which points back at the entrypoint rather than the app.","signals":[{"match":"(?i)permission denied","means":"The process cannot read a path or bind a port as its user.","goto":"cause:not-executable"},{"match":"(?i)no such file or directory","means":"A path in the entrypoint or a required file is absent from the image.","goto":"cause:not-found"},{"match":"^\\s*$","means":"Empty. The container died before logging, so the fault is in the entrypoint or the run flags.","goto":"step:3"}]},{"title":"Check what the image says it should run","cmd":"docker image inspect {image} --format 'entrypoint={{json .Config.Entrypoint}} cmd={{json .Config.Cmd}} user={{.Config.User}}'","risk":"safe","look":"Compare this against what actually exists in the image. A null Cmd with a shell-form Entrypoint is a common source of exit 127."},{"title":"Open a shell in the image to see what is really there","cmd":"docker run --rm -it --entrypoint sh {image}","risk":"state","note":"Creates a new container. It is removed on exit because of --rm, but it does consume a container slot and will pull the image if absent. If this fails with 'exec sh not found', the base image has no shell at all, which is itself the answer.","look":"Whether the entrypoint file exists, whether it is executable, and whether the interpreter on its first line is present."}],"causes":[{"id":"no-foreground-process","cause":"Exit 0. The image's command finished. A container lives exactly as long as PID 1.","fix":"Run the real server process in the foreground, not backgrounded or daemonised. A CMD that ends is a container that ends.","confirm":"docker image inspect {image} --format '{{json .Config.Cmd}}'"},{"id":"not-found","cause":"Exit 127. The entrypoint path does not exist inside the image.","fix":"Check the path in the Dockerfile against the built layers. On distroless or scratch there is no /bin/sh, so shell-form CMD will always fail.","confirm":"docker run --rm --entrypoint ls {image} -la /"},{"id":"not-executable","cause":"Exit 126. The file exists but cannot be run. Usually a missing execute bit, or a script saved with Windows CRLF line endings.","fix":"Add RUN chmod +x in the Dockerfile. If you edited the script on Windows, convert it to LF — CRLF makes the shebang unresolvable.","confirm":"docker run --rm --entrypoint ls {image} -l /entrypoint.sh"},{"id":"oom","cause":"Exit 137. SIGKILL, almost always the memory limit.","fix":"Raise --memory, or fix the allocation. Check OOMKilled in inspect to confirm it was memory rather than an external kill.","confirm":"docker inspect {container} --format '{{.State.OOMKilled}}'"},{"id":"bad-run-flags","cause":"Exit 125. The Docker daemon rejected the run request before the image was involved.","fix":"Re-read the docker run line. A bad mount path, an unknown flag, or a port already bound will all produce this.","confirm":"docker inspect {container} --format '{{.State.Error}}'"}],"verify":["docker ps shows the container in Up state, not Restarting.","The status stays Up across at least a minute.","docker logs shows the application's normal startup output."],"escalate":["The exact Exited (N) status","First 50 lines of docker logs, or a note that it was empty","Entrypoint, Cmd and User from image inspect, plus the full docker run line"]},{"id":"docker-pull-denied","tier":"documented","technology":"Docker","category":"Registry & Auth","title":"docker pull fails with denied or unauthorized","summary":"The registry refused you. Whether that is authentication, authorisation, or a typo in the tag depends on the exact wording.","aliases":["pull access denied","unauthorized","denied requested access","authentication required","cannot pull image","imagepullbackoff local","no basic auth credentials"],"source":"https://docs.docker.com/reference/cli/docker/login/","inputs":[{"key":"image","label":"Image reference","example":"registry.local/checkout-api:1.4.2"},{"key":"registry","label":"Registry host","example":"registry.local"}],"steps":[{"title":"Read the exact refusal","cmd":"docker pull {image}","risk":"safe","look":"The precise wording. 'denied' and 'unauthorized' and 'manifest unknown' are three different problems that look identical at a glance.","signals":[{"match":"(?i)manifest unknown|manifest for .* not found","means":"You are authenticated fine. That tag does not exist in that repository.","goto":"cause:bad-tag"},{"match":"(?i)no basic auth credentials|authentication required","means":"You are not logged in to this registry at all.","goto":"cause:not-logged-in"},{"match":"(?i)denied: requested access to the resource is denied","means":"You are logged in, but this account cannot read this repository.","goto":"cause:no-permission"},{"match":"(?i)x509|certificate signed by unknown authority","means":"TLS trust failure, not an auth failure. The registry's CA is not trusted by your Docker daemon.","goto":"cause:tls"},{"match":"(?i)i/o timeout|no such host","means":"You never reached the registry. This is DNS or egress, not credentials.","goto":"cause:unreachable"}]},{"title":"Check which registries you are actually logged in to","cmd":"docker info --format '{{.RegistryConfig.IndexConfigs}}' && type %USERPROFILE%\\.docker\\config.json","risk":"safe","look":"Whether {registry} appears in the auths block. A credential helper means the token lives in Windows Credential Manager rather than the file, so an empty auths block is not proof you are logged out."},{"title":"Confirm the tag exists before blaming credentials","cmd":"docker manifest inspect {image}","risk":"safe","look":"A manifest means the tag is real and readable. An error here with a valid login means the tag is wrong or was garbage-collected."}],"causes":[{"id":"not-logged-in","cause":"No credentials cached for this registry.","fix":"docker login {registry}. If a credential helper is configured, log in through that rather than storing a token in plain config.json.","confirm":"docker login {registry}"},{"id":"no-permission","cause":"Authenticated, but the account lacks pull rights on that repository.","fix":"Ask the registry owner for read access on that path. A token scoped to another project produces exactly this message.","confirm":"docker manifest inspect {image}"},{"id":"bad-tag","cause":"The tag does not exist. Very often a typo, or a tag that was cleaned up by a retention policy.","fix":"List the available tags and pick a real one. Prefer pinning by digest for anything that matters.","confirm":"docker manifest inspect {image}"},{"id":"tls","cause":"The registry's certificate is not trusted by the Docker daemon.","fix":"Install the CA into the daemon's trust store. Do not add the host to insecure-registries to make this go away.","confirm":"docker info --format '{{.RegistryConfig.InsecureRegistryCIDRs}}'"},{"id":"unreachable","cause":"The registry host did not resolve or did not answer.","fix":"Check DNS and any corporate proxy. Docker reads proxy settings from its own config, not from your shell environment.","confirm":"nslookup {registry}"}],"verify":["docker pull completes and reports a digest.","docker images lists the image locally.","A fresh shell can repeat the pull without logging in again."],"escalate":["The verbatim error line from docker pull","Which registry and repository path, with the tag","Whether docker manifest inspect succeeds or fails"]},{"id":"docker-no-space-left","tier":"documented","technology":"Docker","category":"Storage & Disk","title":"no space left on device","summary":"Builds or containers fail on disk. Find out what is consuming it before you reclaim anything, because the fast fix deletes real data.","aliases":["no space left","disk full","cannot write","build fails disk","out of disk","docker full","reclaim space"],"source":"https://docs.docker.com/reference/cli/docker/system/prune/","inputs":[],"steps":[{"title":"Find out what is actually using the space","cmd":"docker system df -v","risk":"safe","look":"The RECLAIMABLE column per category. Build cache is usually the largest and the safest to drop. Volumes are usually the smallest and the most dangerous.","signals":[{"match":"(?i)Build Cache","means":"Read the build cache line specifically. On a CI-style machine it is often most of the total and costs nothing but rebuild time.","goto":"cause:build-cache"},{"match":"(?i)Local Volumes","means":"Volumes hold real data. Nothing in this runbook should delete them without you knowing what is inside.","goto":"cause:volumes"}]},{"title":"Check whether the host disk is full rather than Docker","cmd":"docker run --rm -v /:/host alpine df -h /host","risk":"state","note":"Starts a throwaway container and mounts the host root read-write into it. It only runs df, but anything with this mount could write to the host filesystem. On Docker Desktop for Windows this inspects the Linux VM's disk, not your C: drive.","look":"Whether the filesystem holding /var/lib/docker is full, or whether something else on the host filled the disk and Docker is just the victim."},{"title":"Reclaim the build cache only","cmd":"docker builder prune --filter until=168h","risk":"destructive","note":"Permanently deletes build cache older than seven days. Nothing running is affected and no image or volume is touched, but your next build of an affected image will be slow because it has to rebuild those layers. This cannot be undone.","look":"The reclaimed total at the end. Re-run docker system df to confirm the space actually came back."},{"title":"Remove stopped containers and dangling images","cmd":"docker container prune && docker image prune","risk":"destructive","note":"Deletes every stopped container and every untagged image. A stopped container that someone intended to restart or inspect is gone, along with its writable layer and anything written outside a volume. Run docker ps -a first and read the list. Never use docker system prune -a --volumes here — that also removes named volumes and is how people lose databases.","look":"The list of deleted IDs. If you see something you recognise, stop and check what it was before continuing."}],"causes":[{"id":"build-cache","cause":"BuildKit cache has accumulated across many builds.","fix":"Prune with a time filter rather than wholesale, and set a cache ceiling in the daemon config so it bounds itself.","confirm":"docker system df"},{"id":"stopped-containers","cause":"Exited containers are retained along with their writable layers.","fix":"Prune them, and add --rm to throwaway docker run commands so they clean up on exit.","confirm":"docker ps -a --filter status=exited"},{"id":"dangling-images","cause":"Rebuilt tags leave the previous image untagged but still on disk.","fix":"docker image prune. Schedule it rather than doing it in a panic mid-incident.","confirm":"docker images -f dangling=true"},{"id":"volumes","cause":"Anonymous volumes from removed containers persist and are never cleaned automatically.","fix":"Inspect each one before deleting anything. Use named volumes so ownership is obvious from the name.","confirm":"docker volume ls -f dangling=true"},{"id":"log-growth","cause":"Container JSON log files grew unbounded because no rotation was configured.","fix":"Set max-size and max-file in the daemon's log-opts. This is the fix that stops it recurring.","confirm":"docker inspect --format '{{.HostConfig.LogConfig}}' $(docker ps -q)"}],"verify":["docker system df shows meaningful free space.","The build or container that was failing now succeeds.","Log rotation is configured, so the same disk does not fill again next week."],"escalate":["Full docker system df -v output","Which category held the space","Whether anything was pruned, and exactly which command was run"]},{"id":"docker-container-no-network","tier":"documented","technology":"Docker","category":"Networking & DNS","title":"Container cannot reach another container or the internet","summary":"Connection refused or name not resolving from inside a container. Work outward: name, then network membership, then egress.","aliases":["container cannot connect","dns not resolving container","connection refused between containers","cannot reach service","compose networking","name or service not known"],"source":"https://docs.docker.com/engine/network/","inputs":[{"key":"container","label":"Container","example":"checkout-api"},{"key":"target","label":"What it is trying to reach","example":"postgres"}],"steps":[{"title":"Check whether the name resolves from inside the container","cmd":"docker exec {container} getent hosts {target}","risk":"safe","look":"An IP means DNS is fine and the problem is the port or the listener. No output means Docker's embedded DNS does not know that name.","signals":[{"match":"^\\s*$","means":"The name did not resolve. Either the containers are not on the same user-defined network, or the name is wrong.","goto":"cause:not-same-network"},{"match":"\\d+\\.\\d+\\.\\d+\\.\\d+","means":"DNS is working. Move to the port and the listener.","goto":"step:3"}]},{"title":"Compare which networks each container is attached to","cmd":"docker inspect {container} --format '{{json .NetworkSettings.Networks}}' && docker inspect {target} --format '{{json .NetworkSettings.Networks}}'","risk":"safe","look":"The same user-defined network name in both. The default bridge gives no DNS between containers at all, which is the single most common cause of this symptom.","signals":[{"match":"\"bridge\"","means":"On the default bridge, container name resolution does not work. You need a user-defined network.","goto":"cause:default-bridge"}]},{"title":"Check that the target is listening where you think","cmd":"docker exec {target} sh -c \"netstat -tlnp 2>/dev/null || ss -tlnp\"","risk":"safe","look":"Whether it is bound to 0.0.0.0 or to 127.0.0.1. A process bound to localhost inside a container is unreachable from every other container, no matter how correct the network is.","signals":[{"match":"127\\.0\\.0\\.1:","means":"It is only listening on loopback inside its own namespace. Nothing outside that container can reach it.","goto":"cause:bound-localhost"}]},{"title":"Test egress to the outside world","cmd":"docker exec {container} sh -c \"getent hosts registry-1.docker.io || echo DNS_FAIL\"","risk":"safe","look":"DNS_FAIL means the container has no working resolver, which usually points at a host DNS or corporate proxy setting that Docker did not inherit."}],"causes":[{"id":"not-same-network","cause":"The containers are not attached to a common user-defined network.","fix":"Put both on the same named network. In Compose this is automatic within a project, so this usually means they are in two different projects.","confirm":"docker network inspect $(docker inspect {container} --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}')"},{"id":"default-bridge","cause":"Both are on the default bridge network, which has no embedded DNS for container names.","fix":"Create a user-defined network and attach both. Only user-defined networks give name-based service discovery.","confirm":"docker network ls"},{"id":"bound-localhost","cause":"The target process listens on 127.0.0.1 inside its own network namespace.","fix":"Bind it to 0.0.0.0 in the application's own configuration. No Docker flag can work around this.","confirm":"docker exec {target} sh -c \"ss -tlnp\""},{"id":"wrong-port","cause":"The client is dialling the published host port rather than the container port.","fix":"Between containers, use the container's internal port. Published ports are for traffic arriving from the host.","confirm":"docker port {target}"},{"id":"host-dns","cause":"Corporate DNS or proxy settings were not inherited by the daemon.","fix":"Set dns in the daemon config, or pass --dns. Docker does not read your shell's proxy variables.","confirm":"docker exec {container} cat /etc/resolv.conf"}],"verify":["getent hosts resolves the target name from inside the container.","A connection to the target's internal port succeeds.","The same works after both containers are restarted."],"escalate":["Networks block from inspect for both containers","Listening sockets inside the target","Contents of /etc/resolv.conf inside the client"]},{"id":"docker-port-allocated","tier":"documented","technology":"Docker","category":"Networking & DNS","title":"port is already allocated","summary":"docker run fails because something already holds the host port.","aliases":["port already allocated","address already in use","bind failed","port in use","cannot start port"],"source":"https://docs.docker.com/engine/network/","inputs":[{"key":"port","label":"Host port","example":"8080"}],"steps":[{"title":"Find which container holds it","cmd":"docker ps --filter publish={port} --format '{{.Names}}\\t{{.Ports}}'","risk":"safe","look":"A container name means Docker itself is holding it, and you can stop that container. Nothing means a host process has it.","signals":[{"match":"\\w","means":"A container already publishes this port.","goto":"cause:other-container"},{"match":"^\\s*$","means":"No container has it, so a host process does.","goto":"step:2"}]},{"title":"Find the host process holding it","cmd":"netstat -ano | findstr :{port}","risk":"safe","look":"The PID in the last column. Look it up in Task Manager before killing anything."},{"title":"Check for a stopped container still reserving it","cmd":"docker ps -a --filter publish={port}","risk":"safe","look":"On some versions a container in a bad state keeps the mapping. Removing it releases the port."}],"causes":[{"id":"other-container","cause":"Another container publishes the same host port.","fix":"Stop it, or publish this one on a different host port. The container port does not need to change.","confirm":""},{"id":"host-process","cause":"A non-Docker process on the host owns the port.","fix":"Stop that process, or pick another host port.","confirm":""},{"id":"stale-mapping","cause":"A dead container is still holding the reservation.","fix":"docker rm the container. If it persists, restart the Docker daemon.","confirm":""}],"verify":["docker run starts and publishes the port.","The service answers on the host port."],"escalate":["Output of docker ps --filter publish","The netstat line including PID","The full docker run command"]},{"id":"docker-volume-permission","tier":"documented","technology":"Docker","category":"Storage & Disk","title":"Permission denied on a mounted volume","summary":"The container cannot read or write a bind-mounted path. It is almost always a UID mismatch.","aliases":["permission denied volume","cannot write to mount","bind mount permission","read only file system","eacces container"],"source":"https://docs.docker.com/engine/storage/bind-mounts/","inputs":[{"key":"container","label":"Container","example":"checkout-api"},{"key":"path","label":"Mount path in container","example":"/data"}],"steps":[{"title":"Find which user the container runs as","cmd":"docker inspect {container} --format 'user={{.Config.User}} readonly={{.HostConfig.ReadonlyRootfs}}'","risk":"safe","look":"An empty user means root, which rarely hits permission errors. A numeric UID that does not own the host directory is the usual cause.","signals":[{"match":"readonly=true","means":"The root filesystem is read-only by design. Writes outside a volume will always fail.","goto":"cause:readonly-rootfs"}]},{"title":"Check the ownership the container sees","cmd":"docker exec {container} ls -ldn {path}","risk":"safe","look":"The numeric owner UID, not the name. Names differ between host and container; only the number matters."},{"title":"Check the mount type","cmd":"docker inspect {container} --format '{{json .Mounts}}'","risk":"safe","look":"A bind mount inherits host permissions exactly. A named volume is initialised from the image and usually avoids this entirely.","signals":[{"match":"\"Type\":\"bind\"","means":"Bind mount, so host ownership applies directly.","goto":"cause:uid-mismatch"},{"match":"\"Mode\":\"ro\"|\"RW\":false","means":"Mounted read-only. The flag, not the permissions.","goto":"cause:mounted-ro"}]}],"causes":[{"id":"uid-mismatch","cause":"The container's UID does not own the host directory.","fix":"Either chown the host directory to that UID, or run the container as the UID that owns it with --user.","confirm":""},{"id":"mounted-ro","cause":"The mount was declared read-only.","fix":"Drop the :ro suffix if writes are genuinely needed.","confirm":""},{"id":"readonly-rootfs","cause":"The container's root filesystem is read-only.","fix":"Mount a writable volume at the path that needs writes. Keep the rootfs read-only; it is a good default.","confirm":""},{"id":"selinux","cause":"SELinux is blocking the bind mount on the host.","fix":"Add the :z or :Z suffix to the mount. Not applicable on Docker Desktop for Windows.","confirm":""}],"verify":["The container reads and writes the path successfully.","The fix is in the compose file or run command, not a manual chmod that will be lost."],"escalate":["Container user and mount definition","ls -ldn output from inside the container","Host-side ownership of the directory"]},{"id":"docker-build-cache-miss","tier":"documented","technology":"Docker","category":"Build & Cache","title":"Docker build reruns every step instead of using cache","summary":"Builds that should take seconds take minutes. One early layer is invalidating everything after it.","aliases":["cache not working","build slow","rebuilds everything","cache miss","no cache used","docker build slow"],"source":"https://docs.docker.com/build/cache/","inputs":[{"key":"dockerfile","label":"Dockerfile","example":"Dockerfile"}],"steps":[{"title":"Build with plain progress and find the first miss","cmd":"docker build --progress=plain -f {dockerfile} . 2>&1 | findstr /C:\"CACHED\" /C:\"RUN\"","risk":"safe","look":"The first step that is not CACHED. Everything after it is invalidated by definition, so only that first miss matters.","signals":[{"match":"(?i)COPY \\. ","means":"Copying the whole context early invalidates the cache on any file change.","goto":"cause:copy-everything"}]},{"title":"Check how large the context being sent is","cmd":"docker build --progress=plain . 2>&1 | findstr /C:\"transferring context\"","risk":"safe","look":"A large context means .dockerignore is missing entries. node_modules and .git are the usual culprits."},{"title":"Check whether .dockerignore exists at all","cmd":"type .dockerignore","risk":"safe","look":"Its absence is the single most common reason builds are slow. Without it, every local file change busts the cache."}],"causes":[{"id":"copy-everything","cause":"COPY . happens before dependency installation.","fix":"Copy only the manifest files, install dependencies, then copy the rest. Dependencies then cache independently of source changes.","confirm":""},{"id":"no-dockerignore","cause":"No .dockerignore, so the whole directory is context.","fix":"Add one covering .git, node_modules, build output and local env files.","confirm":""},{"id":"timestamp-layer","cause":"An early RUN embeds a date or fetches something that changes each run.","fix":"Move it later, or pin what it fetches.","confirm":""},{"id":"no-cache-in-ci","cause":"CI starts with an empty cache every run.","fix":"Use a registry cache with --cache-from and --cache-to.","confirm":""}],"verify":["A rebuild with no source changes is almost entirely CACHED.","Context transfer is small."],"escalate":["The plain-progress output showing the first cache miss","Context size","The Dockerfile's first ten lines"]},{"id":"docker-compose-unhealthy","tier":"documented","technology":"Docker","category":"Compose","title":"Compose service never becomes healthy","summary":"docker compose up hangs on a dependency, or a service restarts forever waiting on another.","aliases":["compose unhealthy","dependency failed to start","waiting for healthy","compose hangs","service is unhealthy","depends_on"],"source":"https://docs.docker.com/reference/compose-file/services/","inputs":[{"key":"service","label":"Service name","example":"postgres"}],"steps":[{"title":"See which service is failing its health check","cmd":"docker compose ps","risk":"safe","look":"The STATUS column. 'starting' for a long time means the health check has not passed yet; 'unhealthy' means it has failed its retries.","signals":[{"match":"(?i)unhealthy","means":"The health check ran and failed repeatedly.","goto":"step:2"},{"match":"(?i)starting","means":"Still inside start_period. It may just need a longer allowance.","goto":"cause:start-period"}]},{"title":"Read the health check's actual output","cmd":"docker inspect $(docker compose ps -q {service}) --format '{{json .State.Health}}'","risk":"safe","look":"The Log array holds the last few probe results with their exit codes and output. This is the actual reason, not a guess."},{"title":"Read the service's own logs","cmd":"docker compose logs {service} --tail=80","risk":"safe","look":"Whether the process is genuinely failing or simply slower to start than the health check allows."}],"causes":[{"id":"healthcheck-wrong","cause":"The health check command is wrong for the image.","fix":"Test it manually with docker exec first. curl is often absent from slim images.","confirm":""},{"id":"start-period","cause":"The service needs longer to start than start_period allows.","fix":"Raise start_period. It exists precisely so slow starts are not counted as failures.","confirm":""},{"id":"dependency-order","cause":"depends_on without condition only waits for start, not for health.","fix":"Use condition: service_healthy so the dependent service actually waits.","confirm":""},{"id":"app-failing","cause":"The application is genuinely failing to start.","fix":"Fix the app. The health check is reporting correctly.","confirm":""}],"verify":["docker compose ps shows every service healthy.","A fresh docker compose up reaches healthy without manual intervention."],"escalate":["docker compose ps output","The State.Health log array","Service logs from startup"]},{"id":"git-committed-to-main","tier":"verified","technology":"Git","category":"History & Undo","title":"I committed to main by mistake","summary":"The commit is on the wrong branch. What you do next depends entirely on whether it has been pushed.","aliases":["committed to main","wrong branch","committed accidentally","undo commit","committed by mistake","move commit to branch","oops committed"],"verified_on":"2026-09-11","verified_against":"git 2.45","verified_by":"dinesh","source":"https://git-scm.com/docs/git-reset","inputs":[{"key":"branch","label":"Branch you meant to use","example":"feature/checkout-retry"},{"key":"remote","label":"Remote","example":"origin"}],"steps":[{"title":"Find out whether the commit has left your machine","cmd":"git status -sb && git log --oneline -3","risk":"safe","look":"The first line. 'ahead 1' means it is still local and you have easy options. If it is not ahead, it is already on the remote and rewriting is now other people's problem too.","signals":[{"match":"ahead \\d+","means":"Still local. You can move it cleanly.","goto":"cause:local-only"},{"match":"\\[origin/main\\]\\s*$","means":"Already pushed. Do not rewrite shared history.","goto":"cause:already-pushed"}]},{"title":"Move the commit onto the branch it belonged on","cmd":"git branch {branch} && git reset --hard HEAD~1 && git switch {branch}","risk":"destructive","note":"reset --hard discards every uncommitted change in your working tree. Run git stash first if you have any. This is only safe because git branch {branch} was created on the line before, so the commit itself survives on that branch.","look":"After this, main is back where it was and your commit sits on {branch}.","signals":[{"match":"(?i)error: .*already exists","means":"That branch already exists. Pick another name or switch to it and cherry-pick instead.","goto":"cause:branch-exists"}]},{"title":"Confirm nothing was lost","cmd":"git log --oneline -3 {branch} && git log --oneline -3 main","risk":"safe","look":"Your commit on {branch}, and main matching the remote. If anything looks wrong, git reflog still has every prior position for about 90 days."}],"causes":[{"id":"local-only","cause":"The commit exists only in your clone.","fix":"Create the branch at the current commit, then reset main back one. Nobody else is affected.","confirm":"git status -sb"},{"id":"already-pushed","cause":"The commit is on the remote and others may have pulled it.","fix":"Do not reset and force-push. Use git revert to add a new commit that undoes it, then apply the original work on a proper branch.","confirm":"git log --oneline {remote}/main -3"},{"id":"branch-exists","cause":"A branch with that name is already present.","fix":"Switch to it and cherry-pick the commit across, then reset main.","confirm":"git branch --list {branch}"}],"verify":["git log on main matches the remote's main.","Your commit appears in git log on {branch}.","git status reports a clean working tree, or exactly the changes you stashed."],"escalate":["Output of git status -sb","git log --oneline -5 for both branches","Whether the commit was pushed, and whether anyone has pulled since"]},{"id":"git-force-push-safely","tier":"verified","technology":"Git","category":"Remotes","title":"I need to force-push a rebased branch","summary":"Rewriting a shared branch can silently destroy a colleague's commits. There is a safe form of this command.","aliases":["force push","push -f","rebase then push","force-with-lease","non-fast-forward","rejected push"],"verified_on":"2026-09-11","verified_against":"git 2.45","verified_by":"dinesh","source":"https://git-scm.com/docs/git-push","inputs":[{"key":"branch","label":"Branch","example":"feature/checkout-retry"},{"key":"remote","label":"Remote","example":"origin"}],"steps":[{"title":"Check whether anyone else has pushed to this branch","cmd":"git fetch {remote} && git log --oneline {remote}/{branch} -5","risk":"safe","look":"Commits you do not recognise. If someone else's work is on this branch, a force-push will delete it and they will not get a warning.","signals":[{"match":"(?i)commit","means":"Read the author of each. Anything not yours means stop and talk to them first.","goto":"cause:shared-branch"}]},{"title":"Force-push, but only if the remote is where you last saw it","cmd":"git push --force-with-lease={branch} {remote} {branch}","risk":"destructive","note":"This rewrites remote history. --force-with-lease aborts if someone pushed since your last fetch, which plain --force does not. Never use plain --force on a shared branch. If this is a protected branch, it should be rejected by policy, not by your judgement.","look":"A forced update line. If it is rejected with 'stale info', someone pushed after your fetch and the lease did its job.","signals":[{"match":"(?i)stale info|rejected","means":"The lease saved you. Someone pushed after your last fetch. Fetch again and re-examine before retrying.","goto":"cause:raced"},{"match":"(?i)protected branch|pre-receive hook declined","means":"Branch protection blocked it. That is working as intended; open a PR instead.","goto":"cause:protected"}]}],"causes":[{"id":"shared-branch","cause":"Other people have commits on this branch.","fix":"Do not force-push. Merge their work in, or coordinate a window with them first.","confirm":"git log --format='%an %s' {remote}/{branch} -10"},{"id":"raced","cause":"Someone pushed between your fetch and your push.","fix":"Fetch, inspect what arrived, rebase onto it, then retry with --force-with-lease.","confirm":"git fetch {remote} && git log --oneline {remote}/{branch} -5"},{"id":"protected","cause":"Branch protection rules forbid force-push.","fix":"Open a pull request. If the rewrite is genuinely required, it needs a repo admin, not a workaround.","confirm":"git ls-remote {remote} {branch}"}],"verify":["{remote}/{branch} points at your intended commit.","No commits by other authors disappeared from the log.","CI on the branch is green after the rewrite."],"escalate":["git log --oneline of local and remote branch","The exact push output including any rejection reason","Whether the branch is protected and who owns it"]},{"id":"git-merge-conflict","tier":"documented","technology":"Git","category":"Merging","title":"Merge or rebase stopped with conflicts","summary":"Git cannot combine two changes automatically and is waiting for you to decide.","aliases":["merge conflict","conflict","both modified","fix conflicts and run commit","rebase conflict","unmerged paths"],"source":"https://git-scm.com/docs/git-merge","inputs":[{"key":"branch","label":"Branch being merged","example":"main"}],"steps":[{"title":"See exactly which files are unmerged","cmd":"git status --short","risk":"safe","look":"Lines starting UU are both-modified. AA is both-added, DU and UD are delete-versus-modify, which need a decision rather than an edit.","signals":[{"match":"^UU ","means":"Both sides changed the same file. Edit it and resolve.","goto":"cause:both-modified"},{"match":"^(DU|UD) ","means":"One side deleted what the other changed. Neither version is automatically right.","goto":"cause:delete-modify"}]},{"title":"Understand which operation you are inside","cmd":"git status | head -3","risk":"safe","look":"Rebase and merge resolve identically but finish differently. Finishing the wrong way is where people lose work."},{"title":"See both sides of a conflicting file","cmd":"git diff --diff-filter=U","risk":"safe","look":"The conflict markers with both versions. The section above ======= is your current branch, below it is what you are bringing in."},{"title":"Abort and return to where you started","cmd":"git merge --abort","risk":"destructive","look":"A clean working tree back at the pre-merge commit. This is always safe for committed history, and is the right move when a merge has gone badly.","note":"Discards the entire in-progress merge and any conflict resolution you have done so far. Committed work is untouched, but unsaved resolution effort is lost. Inside a rebase, the equivalent is git rebase --abort."}],"causes":[{"id":"both-modified","cause":"Both branches changed the same lines.","fix":"Edit the file to the intended final state, remove the markers, git add it, then continue.","confirm":""},{"id":"delete-modify","cause":"One branch deleted a file the other modified.","fix":"Decide deliberately: git rm to accept the deletion, or git add to keep the modified version.","confirm":""},{"id":"wrong-finish","cause":"Finished a rebase with git commit instead of git rebase --continue.","fix":"Inside a rebase always use git rebase --continue. Inside a merge, git commit is correct.","confirm":""}],"verify":["git status reports a clean tree with no unmerged paths.","The build and tests pass on the merged result.","Neither side's intent was silently dropped."],"escalate":["git status --short output","Whether it is a merge or a rebase","Which files conflicted and how each was resolved"]},{"id":"git-detached-head","tier":"documented","technology":"Git","category":"Branches","title":"You are in detached HEAD state","summary":"Commits made here belong to no branch and become unreachable when you switch away.","aliases":["detached head","not on any branch","head detached at","lost my commits","commits disappeared after checkout"],"source":"https://git-scm.com/docs/git-checkout","inputs":[{"key":"branch","label":"Branch to keep the work on","example":"feature/fix-checkout"}],"steps":[{"title":"Confirm the state and whether you have made commits","cmd":"git status -sb && git log --oneline -5","risk":"safe","look":"'HEAD detached at' confirms it. If the log shows commits you made here, they exist but nothing points at them yet.","signals":[{"match":"(?i)HEAD detached","means":"Detached. Any commits here need a branch before you move.","goto":"cause:detached"}]},{"title":"Create a branch at your current position","cmd":"git switch -c {branch}","risk":"safe","look":"Your commits are now on a real branch and safe. Do this before anything else, and before switching away."},{"title":"If you already switched away and lost them, find them in reflog","cmd":"git reflog -20","risk":"safe","look":"Every position HEAD has held, with its SHA. Detached commits remain here for about ninety days, so almost nothing is truly lost."},{"title":"Recover a specific lost commit","cmd":"git branch recovered <sha-from-reflog>","risk":"state","look":"A branch named recovered holding the work. Verify with git log before relying on it.","note":"Creates a new branch pointing at that commit. Nothing existing is modified and no history is rewritten, but pick the SHA carefully or you will branch from the wrong point."}],"causes":[{"id":"detached","cause":"HEAD points at a commit rather than a branch.","fix":"Create a branch here with git switch -c. Do it before switching away.","confirm":""},{"id":"already-switched","cause":"You left detached HEAD and the commits seem gone.","fix":"They are in the reflog. Find the SHA and branch from it.","confirm":""},{"id":"intentional","cause":"You checked out a tag or old commit deliberately.","fix":"Fine as long as you make no commits. If you do, branch first.","confirm":""}],"verify":["git status shows you on a named branch.","git log on that branch contains your commits.","The branch is pushed, or you know it is local only."],"escalate":["git status -sb output","git reflog around the time the work was done","Which commits are missing"]},{"id":"git-large-file-rejected","tier":"documented","technology":"Git","category":"Remotes","title":"Push rejected for file size","summary":"The remote refuses a file over its limit. Deleting it in a new commit does not help; it is still in history.","aliases":["file too large","push rejected size","large file","gh001","exceeds file size limit","git lfs"],"source":"https://docs.github.com/en/repositories/working-with-files/managing-large-files","inputs":[{"key":"file","label":"The oversized file","example":"data/dump.sql"}],"steps":[{"title":"Read the rejection and identify the file and commit","cmd":"git push 2>&1 | more","risk":"safe","look":"The remote names the file and the commit that introduced it. That commit is what must change, not your latest one.","signals":[{"match":"(?i)exceeds|too large|GH001","means":"Size limit. The file is embedded in history and must be removed from it.","goto":"cause:in-history"}]},{"title":"Find the largest objects actually in history","cmd":"git rev-list --objects --all | git cat-file --batch-check=\"%(objecttype) %(objectname) %(objectsize) %(rest)\" | findstr blob","risk":"safe","look":"Sizes are in bytes. This shows what is really in the repository, which is often not what you expected."},{"title":"If it is only in your last commit, remove it there","cmd":"git rm --cached {file} && git commit --amend --no-edit","risk":"destructive","look":"git show --stat no longer lists the file. The file remains on disk because only the index entry was removed.","note":"Rewrites your most recent commit. Safe if that commit has not been pushed. If it has been pushed and others have pulled it, do not amend — the file needs removing from shared history through a coordinated rewrite instead."}],"causes":[{"id":"in-history","cause":"The file is in an earlier commit, so deleting it now changes nothing.","fix":"It must be removed from history. For a single unpushed commit, amend. For anything shared, coordinate a rewrite with the repository owner.","confirm":""},{"id":"should-be-lfs","cause":"The file is a legitimate large asset.","fix":"Track it with Git LFS and add the pattern to .gitattributes before committing it again.","confirm":""},{"id":"should-not-be-committed","cause":"A build artifact or database dump got committed.","fix":"Add it to .gitignore. Artifacts belong in a registry, not in Git.","confirm":""}],"verify":["The push is accepted.","The repository size is reasonable for a fresh clone.",".gitignore or .gitattributes prevents a recurrence."],"escalate":["The verbatim rejection message","Which commit introduced the file","Whether that commit has been pushed and pulled by others"]},{"id":"git-wrong-author","tier":"documented","technology":"Git","category":"History & Undo","title":"Commits show the wrong author or email","summary":"Work commits attributed to a personal address, or the reverse. Usually a missing per-repository config.","aliases":["wrong author","wrong email commit","commits not showing github","unverified commit","wrong git config","author email"],"source":"https://git-scm.com/docs/git-config","inputs":[{"key":"email","label":"Correct email","example":"dinesh@example.com"},{"key":"name","label":"Correct name","example":"Dinesh Ilangovan"}],"steps":[{"title":"See what identity the recent commits carry","cmd":"git log --format='%h %an <%ae>' -5","risk":"safe","look":"The email is what matters for attribution on the hosting side. The display name is cosmetic."},{"title":"See which config is being used and from where","cmd":"git config --show-origin user.email && git config --show-origin user.name","risk":"safe","look":"The file path in the output tells you whether this is global or repository-local. A missing local value means the global one applies."},{"title":"Set the correct identity for this repository only","cmd":"git config user.email \"{email}\" && git config user.name \"{name}\"","risk":"state","look":"git config --show-origin now points at the repository's own config file.","note":"Writes to .git/config for this repository only. Existing commits are unaffected — this changes future commits, nothing more. Setting it locally is the right move when you mix work and personal repositories on one machine."},{"title":"Fix the identity on the most recent commit","cmd":"git commit --amend --reset-author --no-edit","risk":"destructive","look":"git log shows the corrected author on the top commit.","note":"Rewrites the last commit, changing its SHA. Safe while unpushed. If it has been pushed, this creates a divergence that requires a force-push, which rewrites shared history."}],"causes":[{"id":"no-local-config","cause":"No repository-local identity, so a global one applied.","fix":"Set user.email locally in each work repository. Consider clearing the global value so it can never apply silently.","confirm":""},{"id":"already-pushed","cause":"The wrong-author commits are already on the remote.","fix":"Leave them. Rewriting shared history to fix a display name is not a worthwhile trade.","confirm":""},{"id":"unverified","cause":"The email is right but commits show as unverified.","fix":"That is signing, not authorship. Set up commit signing separately.","confirm":""}],"verify":["New commits carry the correct author.","git config --show-origin points at the local config.","No shared history was rewritten to achieve it."],"escalate":["git log with author format","Output of git config --show-origin for user.email","Whether the affected commits are pushed"]},{"id":"k8s-crashloopbackoff","tier":"verified","technology":"Kubernetes","category":"Pods & Containers","title":"Pod is in CrashLoopBackOff","summary":"The container starts, exits, and Kubernetes keeps restarting it with growing delay.","aliases":["crashloop","crashloopbackoff","pod keeps restarting","restarts increasing","back-off restarting failed container","pod wont stay up"],"verified_on":"2026-09-11","verified_against":"kind v0.23 / Kubernetes 1.31","verified_by":"dinesh","source":"https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/","inputs":[{"key":"pod","label":"Pod name","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"},{"key":"container","label":"Container","example":"checkout-api"}],"steps":[{"title":"Confirm it is actually looping","cmd":"kubectl get pod {pod} -n {namespace} -o wide","risk":"safe","look":"RESTARTS climbing over successive checks. A high but static count is an old incident, not a live one.","signals":[{"match":"Completed","means":"This is a Job or a one-shot container that finished. restartPolicy is wrong, not the app.","goto":"cause:wrong-restart-policy"}]},{"title":"Read the previous container's logs","cmd":"kubectl logs {pod} -n {namespace} -c {container} --previous --tail=200","risk":"safe","look":"The FIRST fatal line, not the last. Startup errors scroll off the top and the tail is usually just the shutdown noise.","signals":[{"match":"(?i)connection refused|no route to host|timeout.*dial","means":"It died waiting on a dependency that was not reachable.","goto":"cause:dependency-unreachable"},{"match":"(?i)(not set|missing|undefined).*(env|variable|config)|panic.*nil","means":"Required configuration was absent at startup.","goto":"cause:missing-config"},{"match":"(?i)permission denied|operation not permitted","means":"The process cannot read a path or bind a port as its runAsUser.","goto":"cause:permissions"}]},{"title":"Read the termination state","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.status.containerStatuses[*].lastState.terminated}'","risk":"safe","look":"exitCode and reason. This is the single most decisive field in the whole runbook.","signals":[{"match":"OOMKilled|\"exitCode\":137","means":"The kernel killed it for memory. No amount of restarting will fix this.","goto":"cause:oom"},{"match":"\"exitCode\":126","means":"The entrypoint was found but is not executable. Check the file mode in the image.","goto":"cause:entrypoint-not-executable"},{"match":"\"exitCode\":127","means":"The entrypoint was not found at all. Wrong path, or missing shell in a distroless base.","goto":"cause:entrypoint-missing"},{"match":"\"exitCode\":1\\b","means":"The application chose to exit. The reason is in the logs, not here.","goto":"step:2"}]},{"title":"Check whether a probe is doing the killing","cmd":"kubectl describe pod {pod} -n {namespace}","risk":"safe","look":"Events for 'Liveness probe failed'. If present, the app may be healthy but slow to start, and the probe is executing it.","signals":[{"match":"Liveness probe failed","means":"The liveness probe is killing a container that may only need more startup time.","goto":"cause:liveness-too-aggressive"}]}],"causes":[{"id":"missing-config","cause":"A required env var, Secret key or ConfigMap key is absent, so the process exits during startup.","fix":"Fix the owning Deployment/Secret/ConfigMap in source control and reconcile. Do not patch the live Pod.","confirm":"kubectl get deploy -n {namespace} -o yaml | grep -A5 'envFrom\\|valueFrom'"},{"id":"oom","cause":"The container's memory limit is below its real working set.","fix":"Raise limits.memory in the owning Deployment, or fix the leak. Restarting will reproduce it every time.","confirm":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].resources}'"},{"id":"dependency-unreachable","cause":"A database, cache or upstream service was not reachable at startup.","fix":"Confirm the dependency's Service has endpoints, then decide whether the app should retry instead of exiting.","confirm":"kubectl get endpointslices -n {namespace}"},{"id":"liveness-too-aggressive","cause":"initialDelaySeconds is shorter than the app's real startup time, so liveness kills it mid-boot.","fix":"Move the slow-start allowance to a startupProbe rather than inflating the liveness delay.","confirm":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].livenessProbe}'"},{"id":"entrypoint-missing","cause":"Exit 127. The command in the image manifest does not exist at that path.","fix":"Check the Dockerfile ENTRYPOINT/CMD against the built image. A distroless base has no /bin/sh.","confirm":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].command}'"},{"id":"entrypoint-not-executable","cause":"Exit 126. The file exists but lacks the execute bit, or its interpreter line is wrong.","fix":"Add chmod +x in the Dockerfile, or fix the shebang. Rebuild the image.","confirm":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].image}'"},{"id":"permissions","cause":"runAsUser cannot read a mounted path or bind a privileged port.","fix":"Correct fsGroup on the volume, or move the app to a port above 1024.","confirm":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.securityContext}'"},{"id":"wrong-restart-policy","cause":"A one-shot workload is running under restartPolicy Always.","fix":"Run it as a Job with restartPolicy OnFailure or Never.","confirm":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.restartPolicy}'"}],"verify":["RESTARTS holds steady across at least three checks spanning the app's normal startup window.","The container reports Ready, and readiness has not flapped in recent events.","The original failing request or job path completes successfully."],"escalate":["Output of --previous logs, first 50 lines","The lastState.terminated block, verbatim","Image tag and digest, plus resources and probe definitions"]},{"id":"k8s-pod-pending","tier":"verified","technology":"Kubernetes","category":"Scheduling","title":"Pod stays Pending and is never scheduled","summary":"The Pod object exists but no node has accepted it.","aliases":["pod pending","not scheduled","failedscheduling","no nodes available","pod stuck pending","0/3 nodes are available"],"verified_on":"2026-09-11","verified_against":"kind v0.23 / Kubernetes 1.31","verified_by":"dinesh","source":"https://kubernetes.io/docs/concepts/scheduling-eviction/","inputs":[{"key":"pod","label":"Pod name","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the scheduler's own reason","cmd":"kubectl get event -n {namespace} --field-selector involvedObject.name={pod},reason=FailedScheduling -o jsonpath='{.items[-1:].message}'","risk":"safe","look":"The scheduler states exactly why each node was rejected, in the form '0/N nodes are available: ...'. Read that string before anything else.","signals":[{"match":"(?i)insufficient (cpu|memory|ephemeral-storage)","means":"No node has enough free allocatable resource for the requests.","goto":"cause:insufficient-resources"},{"match":"(?i)didn't match.*(node selector|affinity)","means":"The nodeSelector or affinity rule matches no node's labels.","goto":"cause:selector-mismatch"},{"match":"(?i)had (untolerated )?taint","means":"Every candidate node carries a taint this Pod does not tolerate.","goto":"cause:taint"},{"match":"(?i)pod has unbound immediate PersistentVolumeClaims","means":"This is a storage problem wearing a scheduling costume.","goto":"cause:unbound-pvc"},{"match":"(?i)node\\(s\\) didn't find available persistent volumes|volume node affinity conflict","means":"The PV is pinned to a zone the scheduler cannot place the Pod in.","goto":"cause:zone-conflict"}]},{"title":"Compare the request against real allocatable capacity","cmd":"kubectl describe nodes | grep -A6 'Allocated resources'","risk":"safe","look":"Requests, not usage. A node at 12% CPU usage can still be 100% requested and therefore unschedulable."},{"title":"Read what this Pod is actually asking for","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].resources.requests}{\"\\n\"}{.spec.nodeSelector}{\"\\n\"}{.spec.tolerations}'","risk":"safe","look":"Compare these three against the previous step. The mismatch is usually obvious once both are on screen."}],"causes":[{"id":"insufficient-resources","cause":"The sum of requests exceeds allocatable on every node.","fix":"Lower the request to the workload's real profile, or add capacity. Raising the limit does not help; the scheduler reads requests.","confirm":"kubectl top nodes"},{"id":"selector-mismatch","cause":"nodeSelector or nodeAffinity references labels no node carries, often after a node pool was replaced.","fix":"Correct the selector, or label the intended nodes. Check for typos in the label key first.","confirm":"kubectl get nodes --show-labels"},{"id":"taint","cause":"Nodes are tainted (NoSchedule) and the Pod has no matching toleration.","fix":"Add the toleration if the Pod belongs on those nodes, otherwise target a different pool.","confirm":"kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{\"\\t\"}{.spec.taints}{\"\\n\"}{end}'"},{"id":"unbound-pvc","cause":"A referenced PVC has not bound, so the Pod cannot be placed.","fix":"Follow the PVC Pending runbook. Nothing about the Pod spec will fix this.","confirm":"kubectl get pvc -n {namespace}"},{"id":"zone-conflict","cause":"An existing PV lives in one zone and the Pod cannot be scheduled there.","fix":"Use a topology-aware StorageClass with volumeBindingMode WaitForFirstConsumer.","confirm":"kubectl get pv -o jsonpath='{range .items[*]}{.metadata.name}{\"\\t\"}{.spec.nodeAffinity}{\"\\n\"}{end}'"}],"verify":["The Pod reports a nodeName and moves past Pending.","No new FailedScheduling events appear for this Pod.","The change was made in the owning manifest, not by editing the live Pod."],"escalate":["The full FailedScheduling message","Allocated resources block from describe nodes","The Pod's requests, nodeSelector and tolerations"]},{"id":"k8s-service-no-endpoints","tier":"verified","technology":"Kubernetes","category":"Services & Networking","title":"Service exists but returns connection refused","summary":"DNS resolves the Service, but nothing answers. Usually the Service has no endpoints.","aliases":["no endpoints","connection refused service","service not working","empty endpointslice","selector not matching","503 from service"],"verified_on":"2026-09-11","verified_against":"kind v0.23 / Kubernetes 1.31","verified_by":"dinesh","source":"https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/","inputs":[{"key":"service","label":"Service name","example":"checkout-api"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Check whether the Service has any endpoints at all","cmd":"kubectl get endpointslices -n {namespace} -l kubernetes.io/service-name={service}","risk":"safe","look":"ENDPOINTS column. If it is empty or <none>, the Service is pointing at nothing and the problem is the selector or pod readiness, not the network.","signals":[{"match":"(?i)<none>|No resources found","means":"No pods are backing this Service.","goto":"step:2"}]},{"title":"Compare the Service selector against real pod labels","cmd":"kubectl get svc {service} -n {namespace} -o jsonpath='{.spec.selector}{\"\\n\"}' && kubectl get pods -n {namespace} --show-labels","risk":"safe","look":"An exact match on every key. One extra or renamed label is enough to produce an empty Service, and this is the most common cause by a wide margin.","signals":[{"match":"(?i)app=","means":"Compare character by character. 'app' and 'app.kubernetes.io/name' are different keys.","goto":"cause:selector-mismatch"}]},{"title":"Check whether the backing pods are Ready","cmd":"kubectl get pods -n {namespace} -o wide","risk":"safe","look":"A pod that is Running but 0/1 Ready is excluded from endpoints. Readiness, not liveness, controls Service membership.","signals":[{"match":"0/1\\s+Running","means":"The pod is up but failing readiness, so it is deliberately kept out of the Service.","goto":"cause:not-ready"}]},{"title":"Confirm the target port matches the container port","cmd":"kubectl get svc {service} -n {namespace} -o jsonpath='{.spec.ports}'","risk":"safe","look":"targetPort must match the container's real listening port, or a named port the container declares. port is what clients dial; targetPort is where it lands."}],"causes":[{"id":"selector-mismatch","cause":"The Service selector does not match the pod labels.","fix":"Align them in the manifests. Changing the Deployment's pod labels forces a rollout, so prefer correcting the Service.","confirm":"kubectl get endpointslices -n {namespace} -l kubernetes.io/service-name={service}"},{"id":"not-ready","cause":"Pods are running but failing their readiness probe, so kube-proxy excludes them.","fix":"Fix the readiness endpoint or its threshold. The Service will populate on its own once pods report Ready.","confirm":"kubectl get pods -n {namespace} -o wide"},{"id":"wrong-target-port","cause":"targetPort points at a port nothing is listening on.","fix":"Set targetPort to the container's real port, or use a named port so the two cannot drift.","confirm":"kubectl get svc {service} -n {namespace} -o jsonpath='{.spec.ports}'"}],"verify":["EndpointSlice lists the expected pod IPs.","A request from inside the cluster to the Service name succeeds.","The count of endpoints matches the number of Ready replicas."],"escalate":["Service spec, selector and ports","Pod labels and readiness state","EndpointSlice contents"]},{"id":"k8s-imagepullbackoff","tier":"documented","technology":"Kubernetes","category":"Pods & Containers","title":"ImagePullBackOff or ErrImagePull","summary":"The kubelet cannot fetch the image. The event message says which of four reasons.","aliases":["imagepullbackoff","errimagepull","cannot pull image","image not found","unauthorized pull","pull secret"],"source":"https://kubernetes.io/docs/concepts/containers/images/","inputs":[{"key":"pod","label":"Pod name","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the pull failure message","cmd":"kubectl describe pod {pod} -n {namespace} | grep -A5 Events","risk":"safe","look":"The Failed event's message. It names the exact reason, and each reason has a different owner.","signals":[{"match":"(?i)not found|manifest unknown","means":"The tag does not exist in the registry.","goto":"cause:bad-tag"},{"match":"(?i)unauthorized|authentication required","means":"The node has no valid credentials for this registry.","goto":"cause:no-secret"},{"match":"(?i)x509|certificate","means":"TLS trust failure between the node and the registry.","goto":"cause:tls"},{"match":"(?i)timeout|i/o timeout|no such host","means":"The node could not reach the registry at all.","goto":"cause:unreachable"}]},{"title":"Check the image reference on the pod","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].image}'","risk":"safe","look":"Typos in the registry host or tag are the single most common cause. Read it character by character."},{"title":"Check whether a pull secret is attached","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.imagePullSecrets}'","risk":"safe","look":"Empty output on a private registry means the pod has no credentials. The secret must live in the same namespace as the pod."}],"causes":[{"id":"bad-tag","cause":"The tag does not exist in the repository.","fix":"Fix the tag in the manifest. Prefer pinning by digest for anything production.","confirm":""},{"id":"no-secret","cause":"No imagePullSecret, or it exists in a different namespace.","fix":"Create the secret in this namespace and reference it on the pod or its ServiceAccount.","confirm":""},{"id":"tls","cause":"The node does not trust the registry's certificate.","fix":"Install the CA on the nodes. Do not mark the registry insecure.","confirm":""},{"id":"unreachable","cause":"The node has no network path to the registry.","fix":"Check egress rules, the NAT gateway and any proxy configuration on the nodes.","confirm":""}],"verify":["The pod moves past ImagePullBackOff and the container starts.","No new Failed pull events appear."],"escalate":["The full Failed event message","The exact image reference","Whether an imagePullSecret is attached and in which namespace"]},{"id":"k8s-oomkilled","tier":"documented","technology":"Kubernetes","category":"Pods & Containers","title":"Container was OOMKilled","summary":"The kernel killed the container for exceeding its memory limit. Restarting reproduces it.","aliases":["oomkilled","exit 137","out of memory","memory limit","container killed memory","oom"],"source":"https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/","inputs":[{"key":"pod","label":"Pod name","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Confirm it was memory and not an external kill","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.status.containerStatuses[*].lastState.terminated.reason}'","risk":"safe","look":"OOMKilled specifically. Exit 137 alone only means SIGKILL, which something else could have sent.","signals":[{"match":"OOMKilled","means":"The kernel's OOM killer took it. This is a limit problem, not a crash.","goto":"cause:limit-too-low"}]},{"title":"Read the configured limit","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].resources}'","risk":"safe","look":"Compare limits.memory against what the process actually needs. If requests and limits differ widely, scheduling and eviction behave in ways you may not expect."},{"title":"Look at actual usage while it runs","cmd":"kubectl top pod {pod} -n {namespace} --containers","risk":"safe","look":"Usage climbing steadily towards the limit points at a leak. Usage spiking at a particular operation points at a batch size or a large request."},{"title":"Check whether the whole node is under pressure","cmd":"kubectl describe node $(kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.nodeName}') | grep -A5 Conditions","risk":"safe","look":"MemoryPressure true means the node is squeezed and eviction is in play, which is a different problem from a single container's limit."}],"causes":[{"id":"limit-too-low","cause":"The limit is below the real working set.","fix":"Raise limits.memory in the owning Deployment. Measure first with kubectl top rather than guessing.","confirm":""},{"id":"leak","cause":"Memory grows without bound until the limit is reached.","fix":"Raising the limit only delays it. Profile the application; the limit is doing its job.","confirm":""},{"id":"jvm-unaware","cause":"A JVM or Node process sized its heap against the node rather than the cgroup.","fix":"Set an explicit max heap, or use a runtime version that is container-aware.","confirm":""},{"id":"node-pressure","cause":"The node is out of memory and evicting pods.","fix":"Check requests across the node. Under-requesting causes overcommit and cascading evictions.","confirm":""}],"verify":["RESTARTS holds steady through a full workload cycle.","kubectl top shows headroom between usage and the limit."],"escalate":["lastState.terminated block","resources.requests and resources.limits","kubectl top output over a few minutes"]},{"id":"k8s-rollout-stuck","tier":"documented","technology":"Kubernetes","category":"Workloads","title":"Deployment rollout never finishes","summary":"kubectl rollout status hangs. New pods are not becoming ready, or the old ones will not go.","aliases":["rollout stuck","deployment not progressing","waiting for rollout","progressdeadlineexceeded","stuck deploying","rollout hangs"],"source":"https://kubernetes.io/docs/concepts/workloads/controllers/deployment/","inputs":[{"key":"deploy","label":"Deployment","example":"checkout-api"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the rollout condition","cmd":"kubectl get deploy {deploy} -n {namespace} -o jsonpath='{.status.conditions}'","risk":"safe","look":"The Progressing condition's reason. ProgressDeadlineExceeded means it gave up; that reason names the layer at fault.","signals":[{"match":"ProgressDeadlineExceeded","means":"The new ReplicaSet never became available in time.","goto":"step:2"},{"match":"(?i)ReplicaSetUpdated","means":"Still in progress. Give it the deadline before treating it as stuck.","goto":""}]},{"title":"Find what the new pods are doing","cmd":"kubectl get pods -n {namespace} -l app={deploy} --sort-by=.metadata.creationTimestamp","risk":"safe","look":"The newest pods. Pending means scheduling, CrashLoop means the app, 0/1 Running means readiness.","signals":[{"match":"Pending","means":"Scheduling, not deployment. Follow the Pending runbook.","goto":"cause:scheduling"},{"match":"CrashLoopBackOff","means":"The new image does not start. Follow the CrashLoop runbook.","goto":"cause:new-image-broken"},{"match":"0/1\\s+Running","means":"The container runs but fails readiness.","goto":"cause:readiness"}]},{"title":"Check whether a disruption budget is blocking removal","cmd":"kubectl get pdb -n {namespace}","risk":"safe","look":"ALLOWED DISRUPTIONS at zero means old pods cannot be evicted, so the rollout cannot proceed."},{"title":"Check the surge and unavailable settings","cmd":"kubectl get deploy {deploy} -n {namespace} -o jsonpath='{.spec.strategy}'","risk":"safe","look":"maxSurge 0 with maxUnavailable 0 is a deadlock: nothing new can start and nothing old can stop."}],"causes":[{"id":"new-image-broken","cause":"The new image fails to start.","fix":"Roll back, then fix the image. kubectl rollout undo restores the previous ReplicaSet.","confirm":""},{"id":"readiness","cause":"New pods run but never pass readiness.","fix":"Check the probe path, port and initial delay against the new image's real startup.","confirm":""},{"id":"scheduling","cause":"New pods cannot be placed.","fix":"Follow the Pending runbook. Often the surge replica has nowhere to go.","confirm":""},{"id":"pdb-block","cause":"A PodDisruptionBudget forbids removing the old pods.","fix":"Relax minAvailable, or scale up so the budget can be satisfied during the roll.","confirm":""},{"id":"strategy-deadlock","cause":"maxSurge and maxUnavailable are both zero.","fix":"Set at least one of them above zero.","confirm":""}],"verify":["kubectl rollout status returns successfully.","All replicas are on the new ReplicaSet and Ready."],"escalate":["Deployment status conditions","State of the newest pods","Strategy settings and any PDB"]},{"id":"k8s-node-notready","tier":"documented","technology":"Kubernetes","category":"Nodes","titl
