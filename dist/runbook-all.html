ctl get networkpolicy -n {namespace}","risk":"safe","look":"Any policy at all changes the model for the pods it selects. Before the first policy everything is allowed; after it, only what is explicitly permitted.","signals":[{"match":"(?i)default-deny|deny-all","means":"A default-deny policy exists. Every allowed flow must now be stated explicitly.","goto":"cause:default-deny"}]},{"title":"Find which policies select this pod","cmd":"kubectl describe networkpolicy -n {namespace}","risk":"safe","look":"The podSelector on each policy against your pod's labels. A policy with an empty podSelector selects every pod in the namespace."},{"title":"Check the pod's own labels","cmd":"kubectl get pod {pod} -n {namespace} --show-labels","risk":"safe","look":"Whether the pod is selected by a policy and whether it matches any allow rule's peer selector. Both directions must permit the flow."},{"title":"Verify whether DNS is also blocked","cmd":"kubectl exec {pod} -n {namespace} -- getent hosts kubernetes.default","risk":"safe","look":"Egress policies frequently forget port 53, which makes everything look like a DNS outage when it is actually the policy.","signals":[{"match":"^\\s*$","means":"DNS is blocked too. The egress policy is missing a rule for port 53.","goto":"cause:dns-blocked"}]}],"causes":[{"id":"default-deny","cause":"A default-deny policy applies and no rule permits this flow.","fix":"Add an explicit allow for it. Policies are additive, so a new permissive policy is safer than editing the deny.","confirm":""},{"id":"dns-blocked","cause":"Egress policy omits DNS.","fix":"Allow UDP and TCP 53 to kube-system. Almost every egress policy needs this and almost every first attempt forgets it.","confirm":""},{"id":"both-directions","cause":"Egress is allowed on the client but ingress is not allowed on the server.","fix":"Both ends must permit the flow. Check the policies selecting each side.","confirm":""},{"id":"namespace-selector","cause":"namespaceSelector matches on labels the target namespace does not carry.","fix":"Label the namespace. Namespaces have no useful labels by default.","confirm":""},{"id":"no-cni-support","cause":"The CNI plugin does not enforce NetworkPolicy.","fix":"Flannel ignores them entirely, so policies appear to apply and do nothing. Confirm your CNI supports them.","confirm":""}],"verify":["The intended connection succeeds.","DNS still resolves from inside the pod.","Unintended flows remain blocked."],"escalate":["All policies in the namespace","Labels on both pods","Whether DNS works from the client pod"]},{"id":"k8s-init-container-stuck","tier":"guide","technology":"Kubernetes","category":"Pods & Containers","title":"Pod stuck in Init or PodInitializing","summary":"An init container has not completed, so the main container never starts.","aliases":["init stuck","podinitializing","init:0/1","init container failing","init crashloop","waiting for init"],"source":"https://kubernetes.io/docs/concepts/workloads/pods/init-containers/","inputs":[{"key":"pod","label":"Pod","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"See which init container is blocking","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.status.initContainerStatuses[*].name}{\"|\"}{.status.initContainerStatuses[*].state}'","risk":"safe","look":"Init containers run strictly in order. Only the first incomplete one matters; everything after it has not started.","signals":[{"match":"(?i)CrashLoopBackOff","means":"The init container runs and fails repeatedly.","goto":"cause:init-failing"},{"match":"(?i)waiting.*PodInitializing","means":"It is still running, not failed. It may be waiting on something.","goto":"cause:init-waiting"}]},{"title":"Read that init container's logs","cmd":"kubectl logs {pod} -n {namespace} -c <init-container-name>","risk":"safe","look":"Init containers are frequently wait loops for a database or a migration. The log usually says exactly what it is waiting for."},{"title":"Check what it is waiting on is actually reachable","cmd":"kubectl get endpointslices -n {namespace}","risk":"safe","look":"A wait-for-dependency init container blocks forever if the dependency never becomes ready, which looks like the pod being stuck."},{"title":"Check init containers have their own resources","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.initContainers[*].resources}'","risk":"safe","look":"Init containers are scheduled with the pod. An init container requesting more than the node has keeps the whole pod Pending."}],"causes":[{"id":"init-failing","cause":"The init container exits non-zero.","fix":"Read its logs. The pod will never start until it exits zero.","confirm":""},{"id":"init-waiting","cause":"It is waiting on an unavailable dependency.","fix":"Make the dependency ready. Add a timeout so it fails loudly rather than hanging forever.","confirm":""},{"id":"migration-lock","cause":"A database migration init container is blocked on a lock.","fix":"Find the holder. Concurrent replicas running the same migration cause this.","confirm":""},{"id":"wrong-order","cause":"Init containers are in the wrong order.","fix":"They run sequentially in declaration order. Reorder them.","confirm":""}],"verify":["The pod moves past Init and the main container starts.","Init containers complete in a few seconds, not minutes."],"escalate":["Init container statuses","Logs from the blocking init container","Whether its dependency is ready"]},{"id":"k8s-job-not-completing","tier":"guide","technology":"Kubernetes","category":"Workloads","title":"Job or CronJob never completes","summary":"The Job stays active, retries forever, or the CronJob never fires at all.","aliases":["job not completing","cronjob not running","job stuck","backofflimitexceeded","job failed","cronjob missed schedule"],"source":"https://kubernetes.io/docs/concepts/workloads/controllers/job/","inputs":[{"key":"job","label":"Job or CronJob","example":"nightly-report"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the Job's status","cmd":"kubectl get job {job} -n {namespace} -o jsonpath='{.status}'","risk":"safe","look":"Active, succeeded and failed counts with any condition. BackoffLimitExceeded means it gave up after repeated failures.","signals":[{"match":"(?i)BackoffLimitExceeded","means":"It retried up to the limit and failed every time.","goto":"cause:pod-failing"},{"match":"(?i)DeadlineExceeded","means":"It exceeded activeDeadlineSeconds and was killed.","goto":"cause:deadline"}]},{"title":"Read logs from the failed pods","cmd":"kubectl logs -n {namespace} -l job-name={job} --tail=60","risk":"safe","look":"The actual failure. Job pods are retained after failure specifically so you can read this."},{"title":"For a CronJob, check schedule and last run","cmd":"kubectl get cronjob {job} -n {namespace} -o jsonpath='{.spec.schedule}{\"|\"}{.status.lastScheduleTime}{\"|\"}{.spec.suspend}'","risk":"safe","look":"suspend true means it will never fire. The schedule is evaluated in the controller's timezone, which is UTC unless configured otherwise.","signals":[{"match":"\\|true$","means":"The CronJob is suspended.","goto":"cause:suspended"}]},{"title":"Check for concurrency blocking a new run","cmd":"kubectl get jobs -n {namespace} -l cronjob-name={job}","risk":"safe","look":"With concurrencyPolicy Forbid, a run still active blocks the next one. A hung job silently stops all future runs."}],"causes":[{"id":"pod-failing","cause":"The job's pod fails every attempt.","fix":"Fix the command. Raise backoffLimit only once the failure is understood.","confirm":""},{"id":"deadline","cause":"activeDeadlineSeconds was exceeded.","fix":"Raise it, or make the job faster. The deadline counts total time, not per attempt.","confirm":""},{"id":"suspended","cause":"The CronJob is suspended.","fix":"Set suspend to false. Often left on after an incident and forgotten.","confirm":""},{"id":"timezone","cause":"The schedule is in UTC, not local time.","fix":"Set spec.timeZone, or express the schedule in UTC deliberately.","confirm":""},{"id":"concurrency","cause":"A previous run is still active.","fix":"Find and clear it. Consider Replace rather than Forbid.","confirm":""},{"id":"no-restart-never","cause":"restartPolicy is not Never or OnFailure.","fix":"Job pods must use one of those two. Always is rejected.","confirm":""}],"verify":["The Job reports succeeded.","A CronJob fires on schedule.","Failed runs are visible rather than silent."],"escalate":["Job status block","Logs from the failing pod","CronJob schedule, suspend flag and last schedule time"]},{"id":"k8s-terminating-stuck","tier":"guide","technology":"Kubernetes","category":"Pods & Containers","title":"Pod stuck Terminating forever","summary":"Deletion was requested but the pod never goes. Usually a finalizer or an unresponsive node.","aliases":["stuck terminating","pod wont delete","terminating forever","finalizer","cannot delete pod","pod hangs on delete"],"source":"https://kubernetes.io/docs/concepts/overview/working-with-objects/finalizers/","inputs":[{"key":"pod","label":"Pod","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Check for finalizers and the grace period","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.metadata.finalizers}{\"|\"}{.spec.terminationGracePeriodSeconds}'","risk":"safe","look":"A finalizer means something must run before deletion completes. A long grace period means it may simply need more time.","signals":[{"match":"\\[.+\\]\\|","means":"A finalizer is present and its controller has not released it.","goto":"cause:finalizer"},{"match":"\\|\\d{3,}","means":"The grace period is very long. It may be working as configured.","goto":"cause:long-grace"}]},{"title":"Check whether the node is healthy","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.nodeName}' && kubectl get nodes","risk":"safe","look":"If the node is NotReady, the kubelet cannot confirm deletion. Pods on a dead node stay Terminating indefinitely by design.","signals":[{"match":"(?i)NotReady","means":"The node is unreachable, so deletion can never be confirmed.","goto":"cause:node-down"}]},{"title":"Check whether the process ignores SIGTERM","cmd":"kubectl describe pod {pod} -n {namespace} | findstr /C:\"Killing\"","risk":"safe","look":"A process ignoring SIGTERM runs until the grace period expires and is then SIGKILLed. That is slow but not stuck."},{"title":"Remove the finalizer to force deletion","cmd":"kubectl patch pod {pod} -n {namespace} -p '{\"metadata\":{\"finalizers\":null}}'","risk":"destructive","look":"The pod disappears. Check for orphaned resources on the cloud side afterwards.","note":"Removes the finalizer without letting its controller do the cleanup it was waiting to perform. That cleanup may include detaching a volume or deregistering from a load balancer, and skipping it can leave orphaned cloud resources or a volume that cannot attach elsewhere. Understand which controller owns the finalizer before doing this."}],"causes":[{"id":"finalizer","cause":"A controller's finalizer has not been released.","fix":"Find that controller and fix it. Removing the finalizer skips its cleanup.","confirm":""},{"id":"node-down","cause":"The node is unreachable.","fix":"The pod clears when the node returns, or when it is deleted from the cluster. Force deletion risks two copies running.","confirm":""},{"id":"long-grace","cause":"The grace period is genuinely long.","fix":"Wait. Or shorten terminationGracePeriodSeconds if the value is not justified.","confirm":""},{"id":"ignores-sigterm","cause":"The process does not handle SIGTERM.","fix":"Handle it in the application. PID 1 in a container does not get default signal handling.","confirm":""},{"id":"volume-detach","cause":"A volume cannot detach.","fix":"Check the CSI driver. This is common with cloud block storage under load.","confirm":""}],"verify":["The pod is gone.","No orphaned volume or load balancer registration remains.","The root cause was addressed, not just forced past."],"escalate":["Finalizers on the pod","Node status","Which controller owns the finalizer"]},{"id":"k8s-resource-quota-exceeded","tier":"guide","technology":"Kubernetes","category":"Configuration","title":"Cannot create pods: exceeded quota","summary":"The namespace has hit a ResourceQuota, so new workloads are refused at admission.","aliases":["exceeded quota","resourcequota","forbidden quota","limitrange","cannot create pod quota","quota exceeded namespace"],"source":"https://kubernetes.io/docs/concepts/policy/resource-quotas/","inputs":[{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the quota and current usage","cmd":"kubectl describe resourcequota -n {namespace}","risk":"safe","look":"Used against Hard for each resource. The one at its limit is named in the rejection message.","signals":[{"match":"(?i)requests\\.cpu|requests\\.memory","means":"A compute quota is exhausted.","goto":"cause:compute-quota"},{"match":"(?i)pods\\s","means":"The pod count limit is reached.","goto":"cause:pod-count"},{"match":"(?i)persistentvolumeclaims","means":"The PVC count limit is reached.","goto":"cause:pvc-quota"}]},{"title":"Check whether a LimitRange forces defaults","cmd":"kubectl describe limitrange -n {namespace}","risk":"safe","look":"A LimitRange injects default requests into pods that declare none. Those defaults count against the quota and are often larger than expected."},{"title":"Find what is consuming the quota","cmd":"kubectl get pods -n {namespace} -o custom-columns=NAME:.metadata.name,CPU:.spec.containers[*].resources.requests.cpu,MEM:.spec.containers[*].resources.requests.memory","risk":"safe","look":"Requests per pod. Completed Job pods still count until they are cleaned up, which surprises people."},{"title":"Clear completed pods holding quota","cmd":"kubectl delete pod -n {namespace} --field-selector status.phase=Succeeded","risk":"state","look":"The quota's Used figure drops. Recheck with describe resourcequota.","note":"Deletes every succeeded pod in the namespace, which also removes their logs. If anyone needs those logs for an audit or a debugging session, collect them first. Running pods are not affected."}],"causes":[{"id":"compute-quota","cause":"CPU or memory requests are exhausted.","fix":"Raise the quota, or lower requests on existing workloads. Requests count, not usage.","confirm":""},{"id":"pod-count","cause":"The pod count limit is reached.","fix":"Clean up completed pods, or raise the limit.","confirm":""},{"id":"pvc-quota","cause":"The PVC count or storage limit is reached.","fix":"Remove unused claims, or raise the quota.","confirm":""},{"id":"limitrange-default","cause":"LimitRange defaults are larger than the workload needs.","fix":"Declare explicit requests so the default does not apply.","confirm":""},{"id":"no-requests","cause":"The quota requires requests and the pod declares none.","fix":"With a compute quota, every pod must declare requests. Add them or add a LimitRange.","confirm":""}],"verify":["New pods are admitted.","Used sits comfortably below Hard.","Requests reflect real needs rather than defaults."],"escalate":["describe resourcequota output","Any LimitRange in the namespace","Requests across existing pods"]},{"id":"k8s-apiserver-unreachable","tier":"guide","technology":"Kubernetes","category":"Access & RBAC","title":"kubectl cannot reach the cluster","summary":"Connection refused or timeout before any authentication happens.","aliases":["cannot connect to cluster","connection refused kubectl","unable to connect to the server","kubeconfig","no such host kubectl","i/o timeout apiserver"],"source":"https://kubernetes.io/docs/tasks/access-application-cluster/configure-access-multiple-clusters/","inputs":[],"steps":[{"title":"Read the exact connection error","cmd":"kubectl cluster-info","risk":"safe","look":"Refused, timeout and no-such-host are three different problems. The wording tells you which.","signals":[{"match":"(?i)no such host|could not resolve","means":"DNS cannot resolve the API server name.","goto":"cause:dns"},{"match":"(?i)connection refused","means":"Reached the host, nothing listening on the port.","goto":"cause:not-listening"},{"match":"(?i)i/o timeout","means":"No response at all, usually a firewall or missing VPN.","goto":"cause:firewall"},{"match":"(?i)x509|certificate","means":"TLS problem with the cluster certificate.","goto":"cause:cert"}]},{"title":"Check which context is active","cmd":"kubectl config current-context && kubectl config view --minify","risk":"safe","look":"The server URL in use. A stale context pointing at a deleted cluster produces exactly this and is very common with multiple clusters."},{"title":"Test the endpoint directly","cmd":"curl -k -sS -i https://<server-from-above>/version | findstr HTTP","risk":"safe","look":"A 401 or 403 is good news: the server is reachable and the problem is credentials. No response at all is network."},{"title":"Check the VPN or bastion requirement","cmd":"ipconfig | findstr /C:\"VPN\" ","risk":"safe","look":"Private clusters are only reachable over VPN or through a bastion. This is the most common cause of a sudden timeout that worked yesterday."}],"causes":[{"id":"dns","cause":"The API server name does not resolve.","fix":"Check the URL in the kubeconfig. Private clusters often resolve only over VPN.","confirm":""},{"id":"not-listening","cause":"Nothing is listening on that port.","fix":"Check the cluster exists and the endpoint is right. A deleted cluster leaves a working kubeconfig.","confirm":""},{"id":"firewall","cause":"Traffic is blocked.","fix":"Connect the VPN, or add your IP to the authorised networks list.","confirm":""},{"id":"cert","cause":"TLS verification fails against the cluster certificate.","fix":"Refresh the kubeconfig from the provider. Certificates rotate.","confirm":""},{"id":"expired-token","cause":"The credential expired.","fix":"Re-authenticate. Cloud kubeconfigs use short-lived tokens fetched by an exec plugin.","confirm":""},{"id":"wrong-context","cause":"The active context points elsewhere.","fix":"kubectl config use-context with the right name.","confirm":""}],"verify":["kubectl get nodes returns.","The active context is the intended cluster.","It works from a fresh shell."],"escalate":["The exact connection error","Active context and server URL","Whether the endpoint responds to curl"]},{"id":"k8s-probe-failing","tier":"guide","technology":"Kubernetes","category":"Pods & Containers","title":"Readiness or liveness probe keeps failing","summary":"The container runs but the probe says otherwise, so it is removed from service or restarted.","aliases":["readiness probe failed","liveness probe failed","probe failing","0/1 ready","unhealthy probe","connection refused probe"],"source":"https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/","inputs":[{"key":"pod","label":"Pod","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the probe failure events","cmd":"kubectl describe pod {pod} -n {namespace} | findstr /C:\"probe\"","risk":"safe","look":"Which probe and what it reported. Liveness failures restart the container; readiness failures only remove it from endpoints.","signals":[{"match":"(?i)connection refused","means":"Nothing is listening on the probe port.","goto":"cause:not-listening"},{"match":"(?i)HTTP probe failed with statuscode: 404","means":"The probe path does not exist.","goto":"cause:wrong-path"},{"match":"(?i)statuscode: 5","means":"The endpoint exists and reports an error.","goto":"cause:app-unhealthy"},{"match":"(?i)timeout|context deadline","means":"The endpoint is too slow for timeoutSeconds.","goto":"cause:too-slow"}]},{"title":"Read the probe configuration","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].readinessProbe}{\"|\"}{.spec.containers[*].livenessProbe}'","risk":"safe","look":"Path, port, initialDelaySeconds, timeoutSeconds and thresholds. A timeout of one second against an endpoint that touches a database is a recipe for flapping."},{"title":"Call the probe endpoint from inside the pod","cmd":"kubectl exec {pod} -n {namespace} -- wget -qO- http://localhost:<port><path>","risk":"safe","look":"What the kubelet would see. Working here but failing as a probe usually means the port or path in the spec is wrong."},{"title":"Check whether it needs a startup probe instead","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].startupProbe}'","risk":"safe","look":"A slow-starting app killed by liveness during boot should use a startupProbe. Inflating the liveness delay to compensate weakens it for the whole lifetime."}],"causes":[{"id":"not-listening","cause":"Nothing listens on the probe port.","fix":"Check the port matches and the app binds 0.0.0.0 rather than localhost.","confirm":""},{"id":"wrong-path","cause":"The probe path returns 404.","fix":"Point it at a real endpoint. A trailing slash can matter.","confirm":""},{"id":"app-unhealthy","cause":"The endpoint reports an error.","fix":"The probe is correct. Fix the application.","confirm":""},{"id":"too-slow","cause":"The endpoint is slower than timeoutSeconds.","fix":"Raise the timeout, or make the health check lightweight. It should not query the database.","confirm":""},{"id":"slow-start","cause":"The app needs longer to boot than initialDelaySeconds.","fix":"Use a startupProbe. That is exactly what it exists for.","confirm":""},{"id":"liveness-too-strict","cause":"Liveness restarts a container that is merely busy.","fix":"Liveness should detect deadlock, not load. Most services need only readiness.","confirm":""}],"verify":["The container reports Ready and stays Ready.","No probe failure events during normal load.","Liveness is not restarting a healthy container."],"escalate":["Probe failure events","The probe configuration","Result of calling the endpoint from inside the pod"]},{"id":"k8s-pvc-cannot-mount","tier":"guide","technology":"Kubernetes","category":"Storage","title":"Volume bound but pod cannot mount it","summary":"The PVC is Bound yet the pod fails with a mount or attach error.","aliases":["failedmount","unable to attach or mount","volume attach failed","multi-attach error","mount timeout","cannot mount volume"],"source":"https://kubernetes.io/docs/concepts/storage/persistent-volumes/","inputs":[{"key":"pod","label":"Pod","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the mount failure event","cmd":"kubectl describe pod {pod} -n {namespace} | findstr /C:\"FailedMount\" /C:\"FailedAttach\" -A3","risk":"safe","look":"The message names the volume and the reason. Multi-Attach, timeout and permission are three different fixes.","signals":[{"match":"(?i)Multi-Attach error","means":"The volume is still attached to another node.","goto":"cause:multi-attach"},{"match":"(?i)timed out waiting for the condition","means":"The attach never completed, usually a CSI driver problem.","goto":"cause:csi-stuck"},{"match":"(?i)permission denied","means":"Mounted, but the container's user cannot write to it.","goto":"cause:fsgroup"}]},{"title":"Find where the volume is currently attached","cmd":"kubectl get volumeattachment | findstr <pv-name>","risk":"safe","look":"Which node holds it. A ReadWriteOnce volume can only attach to one node at a time, which is the cause of every Multi-Attach error."},{"title":"Check the CSI driver pods are healthy","cmd":"kubectl get pods -n kube-system | findstr csi","risk":"safe","look":"The driver's node plugin must be running on the target node. A crashed node plugin makes every mount on that node hang."},{"title":"Check the access mode against the workload","cmd":"kubectl get pvc -n {namespace} -o jsonpath='{.items[*].spec.accessModes}'","risk":"safe","look":"ReadWriteOnce with a multi-replica Deployment is a guaranteed Multi-Attach failure during any rolling update."}],"causes":[{"id":"multi-attach","cause":"A ReadWriteOnce volume is attached elsewhere.","fix":"Ensure the old pod is fully gone. Use Recreate rather than RollingUpdate for single-writer volumes.","confirm":""},{"id":"csi-stuck","cause":"The CSI driver cannot complete the attach.","fix":"Check the driver's node plugin logs on the target node.","confirm":""},{"id":"fsgroup","cause":"The container user cannot write to the mount.","fix":"Set fsGroup in the pod security context so the volume is chowned on mount.","confirm":""},{"id":"node-limit","cause":"The node has reached its volume attachment limit.","fix":"Cloud providers cap attachments per instance. Spread the pods or use larger nodes.","confirm":""},{"id":"zone-mismatch","cause":"The volume is in a different zone than the node.","fix":"Use a topology-aware StorageClass with WaitForFirstConsumer.","confirm":""}],"verify":["The pod mounts and starts.","No FailedMount events remain.","The access mode matches how the workload actually runs."],"escalate":["The FailedMount message","Which node holds the volume attachment","CSI driver pod status on the target node"]},{"id":"k8s-wrong-container-logs","tier":"guide","technology":"Kubernetes","category":"Observability","title":"kubectl logs returns nothing or the wrong thing","summary":"You cannot see the output you need, so you are debugging blind.","aliases":["logs empty kubectl","no logs pod","choose a container","previous terminated container","logs not found","cannot read logs"],"source":"https://kubernetes.io/docs/reference/generated/kubectl/kubectl-commands#logs","inputs":[{"key":"pod","label":"Pod","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"List every container in the pod","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].name}{\" init: \"}{.spec.initContainers[*].name}'","risk":"safe","look":"A multi-container pod requires -c. Without it kubectl picks the first container, which in a service mesh is often the sidecar rather than your app.","signals":[{"match":"istio-proxy|linkerd-proxy|envoy","means":"A service mesh sidecar is present. The default container may be the proxy.","goto":"cause:sidecar-default"}]},{"title":"Read the previous instance for a restarting container","cmd":"kubectl logs {pod} -n {namespace} --previous --tail=100","risk":"safe","look":"For a crash loop, the current container has barely started. The previous one holds the failure."},{"title":"Check the container has started at all","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.status.containerStatuses[*].state}'","risk":"safe","look":"A container in Waiting has produced no logs because it has not run. That is not a logging problem."},{"title":"Check for a log rotation or collector taking them","cmd":"kubectl logs {pod} -n {namespace} --timestamps --tail=5","risk":"safe","look":"Timestamps reveal whether output is recent. The kubelet rotates container logs and only the current file is available through kubectl."}],"causes":[{"id":"multi-container","cause":"The pod has several containers.","fix":"Use -c with the container name. --all-containers works for a quick look.","confirm":""},{"id":"sidecar-default","cause":"The default container is a mesh sidecar.","fix":"Name your app container explicitly, or set the default-container annotation on the pod.","confirm":""},{"id":"not-started","cause":"The container has not run.","fix":"Nothing to read. Follow the Init or CrashLoop runbook.","confirm":""},{"id":"rotated","cause":"The kubelet rotated the log file.","fix":"Only the current file is available. Ship logs to a collector if you need history.","confirm":""},{"id":"writes-to-file","cause":"The app writes to a file inside the container.","fix":"Only stdout and stderr reach kubectl logs. Reconfigure the app.","confirm":""}],"verify":["You can read the output you need.","For a crash loop you have the previous container's logs.","The right container is being read."],"escalate":["Container names in the pod","Whether the container has started","Whether the app logs to stdout"]},{"id":"k8s-secret-not-found","tier":"guide","technology":"Kubernetes","category":"Configuration","title":"Pod fails because a Secret or ConfigMap is missing","summary":"The pod cannot start because a referenced Secret or ConfigMap does not exist in this namespace.","aliases":["secret not found","configmap not found","createcontainerconfigerror","couldn't find key","optional false","missing secret"],"source":"https://kubernetes.io/docs/concepts/configuration/secret/","inputs":[{"key":"pod","label":"Pod","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the config error","cmd":"kubectl describe pod {pod} -n {namespace} | findstr /C:\"Error\" /C:\"Warning\"","risk":"safe","look":"CreateContainerConfigError names the exact object and key. This is the whole answer most of the time.","signals":[{"match":"secret .* not found","means":"The Secret does not exist in this namespace.","goto":"cause:missing-object"},{"match":"configmap .* not found","means":"The ConfigMap does not exist in this namespace.","goto":"cause:missing-object"},{"match":"couldn't find key","means":"The object exists but the specific key does not.","goto":"cause:missing-key"}]},{"title":"Check the object exists here","cmd":"kubectl get secret,configmap -n {namespace}","risk":"safe","look":"Secrets and ConfigMaps are namespaced. An object in another namespace is invisible, which is the most common cause after a copy-paste between environments."},{"title":"Check the key name inside it","cmd":"kubectl get secret <name> -n {namespace} -o jsonpath='{.data}'","risk":"safe","look":"The key names, not the values. Key names are case-sensitive and a hyphen against an underscore is enough to fail."},{"title":"Check what the pod is asking for","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].envFrom}{.spec.containers[*].env}'","risk":"safe","look":"Compare the requested names against what exists. Marking a reference optional lets the pod start without it, which may or may not be what you want."}],"causes":[{"id":"missing-object","cause":"The Secret or ConfigMap does not exist in this namespace.","fix":"Create it here. Objects do not cross namespaces.","confirm":""},{"id":"missing-key","cause":"The object exists but lacks the key.","fix":"Check spelling and case. Base64 encoding hides typos in values but not in key names.","confirm":""},{"id":"wrong-namespace","cause":"It exists in a different namespace.","fix":"Copy it, or use an operator that replicates it deliberately.","confirm":""},{"id":"not-optional","cause":"The reference is required and absent.","fix":"Either create the object or mark the reference optional if the app can run without it.","confirm":""},{"id":"deleted-by-prune","cause":"A GitOps prune removed it.","fix":"Ensure it is managed in Git, or excluded from pruning if managed elsewhere.","confirm":""}],"verify":["The pod starts.","The environment inside the container has the expected values."],"escalate":["The CreateContainerConfigError message","What exists in the namespace","Which keys the pod requests"]},{"id":"k8s-hostport-conflict","tier":"guide","technology":"Kubernetes","category":"Scheduling","title":"Pod cannot schedule due to a host port conflict","summary":"Only one pod per node can bind a given hostPort, so replicas collide.","aliases":["hostport conflict","node ports conflict","didn't have free ports","hostport","port taken node","cannot schedule port"],"source":"https://kubernetes.io/docs/concepts/services-networking/","inputs":[{"key":"pod","label":"Pod","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the scheduling reason","cmd":"kubectl get event -n {namespace} --field-selector reason=FailedScheduling -o jsonpath='{.items[-1:].message}'","risk":"safe","look":"A message about free ports means hostPort, not resources. That distinction saves a lot of wasted investigation.","signals":[{"match":"didn't have free ports","means":"A hostPort is already taken on every candidate node.","goto":"cause:hostport-used"},{"match":"node\\(s\\) didn't match","means":"A selector is also narrowing the candidates.","goto":"cause:few-nodes"}]},{"title":"Check whether the pod declares a hostPort","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].ports}'","risk":"safe","look":"hostPort binds the node's own port. Replicas exceeding the node count can never all be placed."},{"title":"Find what already holds it","cmd":"kubectl get pods -A -o wide | findstr /R \"[0-9]\" && kubectl get ds -A","risk":"safe","look":"Every pod using a hostPort cluster-wide. Usually a DaemonSet already occupies it."},{"title":"Count schedulable nodes","cmd":"kubectl get nodes --no-headers | measure-object -line","risk":"safe","look":"Replicas using hostPort cannot exceed the node count. That is a hard ceiling."}],"causes":[{"id":"hostport-used","cause":"Another pod holds that host port on every node.","fix":"Drop hostPort and use a Service. hostPort is rarely the right tool outside DaemonSets.","confirm":""},{"id":"too-many-replicas","cause":"More replicas than nodes.","fix":"hostPort caps replicas at one per node.","confirm":""},{"id":"few-nodes","cause":"Selectors narrow the candidate nodes further.","fix":"Widen the selector or add nodes.","confirm":""},{"id":"daemonset-holds","cause":"A DaemonSet already binds the port.","fix":"Pick a different port, or reconsider the design.","confirm":""}],"verify":["The pod is scheduled.","The chosen approach scales past one pod per node."],"escalate":["The FailedScheduling message","The pod's port declarations","What else uses that hostPort"]},{"id":"k8s-cannot-exec","tier":"guide","technology":"Kubernetes","category":"Access & RBAC","title":"kubectl exec fails","summary":"You cannot get a shell in a running pod.","aliases":["cannot exec","exec failed","OCI runtime exec failed","executable file not found","unable to upgrade connection","no shell in container"],"source":"https://kubernetes.io/docs/tasks/debug/debug-application/get-shell-running-container/","inputs":[{"key":"pod","label":"Pod","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the exec failure","cmd":"kubectl exec -it {pod} -n {namespace} -- sh","risk":"safe","look":"The wording separates a missing shell from a permissions problem from a connection problem.","signals":[{"match":"executable file not found","means":"The image has no shell. Distroless and scratch images contain nothing but the binary.","goto":"cause:no-shell"},{"match":"unable to upgrade connection","means":"The API server cannot reach the kubelet.","goto":"cause:kubelet-unreachable"},{"match":"forbidden","means":"RBAC does not permit exec on pods.","goto":"cause:rbac"},{"match":"container not found","means":"The pod has several containers and none was named.","goto":"cause:multi-container"}]},{"title":"Check the pod is actually running","cmd":"kubectl get pod {pod} -n {namespace}","risk":"safe","look":"You cannot exec into a pod that is not Running. Terminating or Pending pods have no process to attach to."},{"title":"Try other shells the image might have","cmd":"kubectl exec -it {pod} -n {namespace} -- /bin/bash","risk":"safe","look":"Alpine has sh but not bash. Some images have neither, which is a deliberate hardening choice."},{"title":"Attach a debug container instead","cmd":"kubectl debug {pod} -n {namespace} -it --image=busybox --target=<container>","risk":"state","look":"A shell with the target container's namespaces. The original container is untouched.","note":"Adds an ephemeral container to the running pod. The pod is not restarted and the application keeps serving, but the container persists for the pod's lifetime and shares its namespaces, so it can see the application's processes and network. On a cluster with admission policies this may be blocked or audited."}],"causes":[{"id":"no-shell","cause":"The image contains no shell.","fix":"Use kubectl debug with an ephemeral container. Do not add a shell to a hardened image just for debugging.","confirm":""},{"id":"multi-container","cause":"The pod has several containers.","fix":"Name one with -c.","confirm":""},{"id":"rbac","cause":"You lack pods/exec permission.","fix":"Grant it. exec is a separate RBAC subresource from get.","confirm":""},{"id":"kubelet-unreachable","cause":"The API server cannot reach the kubelet.","fix":"A node or network problem. Check node status.","confirm":""},{"id":"not-running","cause":"The pod is not in Running state.","fix":"There is no process to attach to yet.","confirm":""}],"verify":["You get a shell, or a debug container attached.","The original container was not modified."],"escalate":["The exec error verbatim","Pod state and container names","Whether the image has a shell"]},{"id":"k8s-endpoints-flapping","tier":"guide","technology":"Kubernetes","category":"Services & Networking","title":"Service endpoints keep appearing and disappearing","summary":"Intermittent 502s because pods flap in and out of the Service.","aliases":["endpoints flapping","intermittent 502","pods flapping ready","readiness flapping","service unstable","random errors service"],"source":"https://kubernetes.io/docs/concepts/services-networking/service/","inputs":[{"key":"service","label":"Service","example":"checkout-api"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Watch the endpoints change","cmd":"kubectl get endpointslices -n {namespace} -l kubernetes.io/service-name={service} -w","risk":"safe","look":"Whether addresses come and go. A stable list means the problem is elsewhere; a changing one confirms flapping."},{"title":"Check readiness transitions on the pods","cmd":"kubectl get events -n {namespace} --field-selector reason=Unhealthy --sort-by=.lastTimestamp","risk":"safe","look":"Repeated Unhealthy events mean the readiness probe is failing intermittently, which is the usual cause.","signals":[{"match":"Readiness probe failed","means":"Readiness is flapping, so pods leave and rejoin the Service.","goto":"cause:probe-flapping"}]},{"title":"Check whether restarts are occurring","cmd":"kubectl get pods -n {namespace} -l app={service}","risk":"safe","look":"Climbing RESTARTS means liveness is killing containers, which is a stronger problem than readiness flapping."},{"title":"Check resource pressure on the pods","cmd":"kubectl top pods -n {namespace} -l app={service}","risk":"safe","look":"CPU at the limit causes throttling, which makes probes time out. That is the most common hidden cause of flapping."}],"causes":[{"id":"probe-flapping","cause":"Readiness fails intermittently.","fix":"Raise timeoutSeconds and failureThreshold. The probe should not be as slow as a real request.","confirm":""},{"id":"cpu-throttling","cause":"CPU limits cause throttling under load.","fix":"Raise the limit. A throttled container fails probes even though it is healthy.","confirm":""},{"id":"probe-too-heavy","cause":"The readiness endpoint does real work.","fix":"Make it cheap. It should not query the database on every probe.","confirm":""},{"id":"gc-pauses","cause":"Garbage collection pauses exceed the probe timeout.","fix":"Tune the heap, or raise the timeout above the worst pause.","confirm":""},{"id":"liveness-restarts","cause":"Liveness is restarting containers.","fix":"Most services need only readiness. Liveness should detect deadlock, not slowness.","confirm":""}],"verify":["The endpoint list is stable over several minutes.","No Unhealthy events during normal load.","Error rate returns to baseline."],"escalate":["Endpoint changes over time","Unhealthy events","CPU usage against limits"]},{"id":"k8s-namespace-terminating","tier":"guide","technology":"Kubernetes","category":"Configuration","title":"Namespace stuck Terminating","summary":"Deleting a namespace hangs forever because something in it will not finalize.","aliases":["namespace terminating","namespace stuck","cannot delete namespace","finalizer namespace","namespace wont delete"],"source":"https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/","inputs":[{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the namespace conditions","cmd":"kubectl get namespace {namespace} -o jsonpath='{.status.conditions}'","risk":"safe","look":"The conditions name which resources cannot be removed. This is far more useful than the Terminating status alone.","signals":[{"match":"SomeResourcesRemain|ContentDeletionFailed","means":"Resources inside still exist and cannot be deleted.","goto":"cause:resources-remain"},{"match":"DiscoveryFailed|ResourcesRemaining","means":"An API service backing a custom resource is unavailable.","goto":"cause:apiservice-down"}]},{"title":"Find what is still in it","cmd":"kubectl api-resources --verbs=list --namespaced -o name | ForEach-Object { kubectl get $_ -n {namespace} --ignore-not-found }","risk":"safe","look":"Everything remaining. Custom resources with finalizers are the usual blocker."},{"title":"Check for unavailable API services","cmd":"kubectl get apiservice | findstr False","risk":"safe","look":"A broken aggregated API server blocks namespace deletion entirely, because Kubernetes cannot enumerate its resources."},{"title":"Remove the finalizer from a blocking resource","cmd":"kubectl patch <kind> <name> -n {namespace} -p '{\"metadata\":{\"finalizers\":null}}' --type=merge","risk":"destructive","look":"The resource is deleted and the namespace proceeds. Check for orphaned cloud resources afterwards.","note":"Skips the cleanup that the owning controller was waiting to perform. For a resource representing cloud infrastructure, that infrastructure is orphaned and keeps costing money with nothing tracking it. Identify which controller owns the finalizer and why it is stuck before removing it."}],"causes":[{"id":"resources-remain","cause":"Resources with finalizers remain.","fix":"Find the owning controller. If it is gone, its finalizers will never be released and must be removed manually.","confirm":""},{"id":"apiservice-down","cause":"An aggregated API service is unavailable.","fix":"Fix or delete the APIService. Metrics-server and custom API servers commonly cause this.","confirm":""},{"id":"operator-gone","cause":"An operator that owned finalizers was uninstalled.","fix":"Remove its finalizers. Uninstalling an operator before its resources is the usual sequence error.","confirm":""},{"id":"webhook-blocking","cause":"A webhook rejects the deletion.","fix":"Check failurePolicy. A webhook pointing at a deleted service blocks everything.","confirm":""}],"verify":["The namespace is gone.","No orphaned cloud resources remain.","The root cause was addressed rather than forced past."],"escalate":["Namespace conditions","What resources remain","Whether any APIService is unavailable"]},{"id":"k8s-image-pull-slow","tier":"guide","technology":"Kubernetes","category":"Pods & Containers","title":"Pods take a very long time to start pulling images","summary":"Deployments crawl because image pulls dominate startup time.","aliases":["slow image pull","pulling image slow","deployment slow","pull takes minutes","image pull performance"],"source":"https://kubernetes.io/docs/concepts/containers/images/","inputs":[{"key":"pod","label":"Pod","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Measure how long the pull took","cmd":"kubectl describe pod {pod} -n {namespace} | findstr /C:\"Pulling\" /C:\"Pulled\"","risk":"safe","look":"The Pulled event includes the elapsed time. Anything over a minute for a normal service image is worth investigating.","signals":[{"match":"Successfully pulled.*in (\\d+m|[1-9]\\d+\\.\\d+s)","means":"The pull is slow enough to matter.","goto":"cause:large-image"},{"match":"Pulling image","means":"Still pulling. Watch rather than assume it is stuck.","goto":""}]},{"title":"Check the image size","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].image}'","risk":"safe","look":"Then check that image's size in the registry. Multi-gigabyte images are the most common cause and the easiest to fix."},{"title":"Check the pull policy","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].imagePullPolicy}'","risk":"safe","look":"Always re-checks the registry every start. With a mutable tag like latest that means a full pull far more often than you expect."},{"title":"Check whether the node already has it cached","cmd":"kubectl get nodes -o wide","risk":"safe","look":"A pod scheduled onto a fresh node always pulls cold. Autoscaled clusters pay this cost constantly."}],"causes":[{"id":"large-image","cause":"The image is very large.","fix":"Use multi-stage builds and a slim base. This is the highest-leverage fix.","confirm":""},{"id":"always-policy","cause":"imagePullPolicy Always with a mutable tag.","fix":"Pin by digest and use IfNotPresent where the tag is immutable.","confirm":""},{"id":"registry-far","cause":"The registry is geographically distant.","fix":"Use a regional mirror or a pull-through cache.","confirm":""},{"id":"no-cache","cause":"New nodes have no cached layers.","fix":"Pre-pull critical images with a DaemonSet, or use a node image that includes them.","confirm":""},{"id":"registry-throttling","cause":"The registry is rate-limiting.","fix":"Authenticate, or mirror the image internally. Anonymous pulls from public registries are limited.","confirm":""}],"verify":["Pull time is a few seconds on a warm node.","Rollouts complete in a reasonable window."],"escalate":["Pulling and Pulled event timestamps","Image size","Pull policy and tag strategy"]},{"id":"k8s-taint-toleration","tier":"guide","technology":"Kubernetes","category":"Scheduling","title":"Pods will not run on a specific node pool","summary":"Nodes exist and have capacity but the scheduler avoids them.","aliases":["taint","toleration","node pool empty","pods avoid nodes","nodeselector pool","dedicated nodes","spot nodes empty"],"source":"https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/","inputs":[{"key":"pod","label":"Pod","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"List taints on every node","cmd":"kubectl get nodes -o custom-columns=NAME:.metadata.name,TAINTS:.spec.taints","risk":"safe","look":"Which nodes carry taints and with what effect. NoSchedule blocks new pods; NoExecute also evicts running ones.","signals":[{"match":"NoExecute","means":"Existing pods are evicted too, not just new ones blocked.","goto":"cause:noexecute"},{"match":"NoSchedule","means":"New pods are blocked unless they tolerate the taint.","goto":"cause:missing-toleration"}]},{"title":"Check the pod's tolerations","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.tolerations}'","risk":"safe","look":"A toleration must match the key, value and effect. Kubernetes adds default tolerations for node conditions, so ignore those."},{"title":"Check node labels against the selector","cmd":"kubectl get nodes --show-labels","risk":"safe","look":"Taints and selectors are separate mechanisms. A pod usually needs both a toleration and a matching selector to land on dedicated nodes."},{"title":"Check whether the autoscaler knows about the taint","cmd":"kubectl get nodes -l node.kubernetes.io/instance-type -o wide","risk":"safe","look":"A cluster autoscaler will not scale up a tainted pool for a pod that does not tolerate it, so the pod stays Pending forever."}],"causes":[{"id":"missing-toleration","cause":"The pod does not tolerate the node's taint.","fix":"Add a toleration matching key, value and effect exactly.","confirm":""},{"id":"noexecute","cause":"A NoExecute taint evicts running pods.","fix":"Add a toleration with tolerationSeconds, or remove the taint if it was not intended.","confirm":""},{"id":"no-selector","cause":"The pod tolerates the taint but has no reason to prefer those nodes.","fix":"Tolerations permit; they do not attract. Add nodeAffinity to target the pool.","confirm":""},{"id":"taint-typo","cause":"The toleration key or value does not match.","fix":"These are exact string comparisons. Compare character by character.","confirm":""}],"verify":["The pod schedules onto the intended pool.","Nodes in that pool are used as expected."],"escalate":["Node taints","Pod tolerations and selectors","Whether the pool autoscales"]},{"id":"k8s-pdb-blocking-drain","tier":"guide","technology":"Kubernetes","category":"Nodes","title":"Node drain hangs forever","summary":"kubectl drain never completes because a disruption budget will not allow eviction.","aliases":["drain stuck","cannot evict pod","pdb blocking","disruption budget","drain hangs","node maintenance stuck"],"source":"https://kubernetes.io/docs/tasks/run-application/configure-pdb/","inputs":[{"key":"node","label":"Node","example":"ip-10-0-3-14"}],"steps":[{"title":"Read what drain is waiting on","cmd":"kubectl drain {node} --ignore-daemonsets --dry-run=server","risk":"safe","look":"The pods it cannot evict and why. Cannot evict due to a budget is very different from a pod with local storage.","signals":[{"match":"Cannot evict pod.*budget","means":"A PodDisruptionBudget forbids the eviction.","goto":"cause:pdb"},{"match":"local storage|emptyDir","means":"The pod uses local storage, which drain refuses to discard without a flag.","goto":"cause:local-storage"},{"match":"DaemonSet-managed","means":"Normal. DaemonSet pods are not drained.","goto":""}]},{"title":"Check allowed disruptions on each budget","cmd":"kubectl get pdb -A","risk":"safe","look":"ALLOWED DISRUPTIONS at zero means eviction is blocked. That is the budget doing its job, not a bug."},{"title":"Check whether the workload has healthy replicas elsewhere","cmd":"kubectl get pods -A -o wide | findstr {node}","risk":"safe","look":"If all replicas sit on this node, no eviction can satisfy the budget. That is a spread problem."},{"title":"Check for pods with no controller","cmd":"kubectl get pods -A --field-selector spec.nodeName={node} -o json | findstr ownerReferences","risk":"safe","look":"A bare pod with no controller will not be recreated elsewhere, so drain refuses it without --force."}],"causes":[{"id":"pdb","cause":"A disruption budget forbids eviction.","fix":"Scale the workload up so the budget can be satisfied, or relax minAvailable during maintenance.","confirm":""},{"id":"all-on-one-node","cause":"Every replica is on this node.","fix":"Add pod anti-affinity or topology spread so replicas distribute.","confirm":""},{"id":"local-storage","cause":"Pods use emptyDir or local volumes.","fix":"--delete-emptydir-data discards that data. Confirm nothing important is in it.","confirm":""},{"id":"bare-pod","cause":"A pod has no owning controller.","fix":"--force deletes it permanently; it will not come back. Move it to a Deployment instead.","confirm":""}],"verify":["The drain completes.","Workloads are running on other nodes.","No budget was permanently weakened."],"escalate":["Drain dry-run output","PDB allowed disruptions","Where the replicas are placed"]},{"id":"k8s-cronjob-overlap","tier":"guide","technology":"Kubernetes","category":"Workloads","title":"CronJob runs pile up or overlap","summary":"Jobs accumulate, or two runs execute at once and corrupt each other.","aliases":["cronjob overlap","jobs piling up","concurrencypolicy","too many jobs","cronjob duplicate","missed schedule"],"source":"https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/","inputs":[{"key":"job","label":"CronJob","example":"nightly-report"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Count how many jobs exist","cmd":"kubectl get jobs -n {namespace} | findstr {job}","risk":"safe","look":"Many completed jobs means history limits are too high. Many active jobs at once means concurrency is not restricted.","signals":[{"match":"Running.*Running","means":"More than one run is active simultaneously.","goto":"cause:concurrency-allow"}]},{"title":"Read the concurrency and history settings","cmd":"kubectl get cronjob {job} -n {namespace} -o jsonpath='{.spec.concurrencyPolicy}{\"|\"}{.spec.successfulJobsHistoryLimit}{\"|\"}{.spec.failedJobsHistoryLimit}'","risk":"safe","look":"Allow is the default and permits overlap. History limits control how many finished jobs are retained."},{"title":"Check for missed schedules","cmd":"kubectl describe cronjob {job} -n {namespace} | findstr /C:\"missed\"","risk":"safe","look":"If the controller was down past startingDeadlineSeconds, runs are skipped entirely rather than queued."},{"title":"Clean up finished jobs","cmd":"kubectl delete jobs -n {namespace} --field-selector status.successful=1","risk":"destructive","look":"The job list shrinks. Set history limits so this does not need doing by hand again.","note":"Deletes every successful Job in the namespace along with its pods and their logs. If anyone needs those logs for an audit trail, collect them first. Running jobs are untouched."}],"causes":[{"id":"concurrency-allow","cause":"concurrencyPolicy is Allow.","fix":"Use Forbid for jobs that must not overlap, or Replace to cancel the previous run.","confirm":""},{"id":"history-too-high","cause":"History limits retain too many jobs.","fix":"Lower successfulJobsHistoryLimit. The default of three is usually right.","confirm":""},{"id":"job-too-slow","cause":"Runs take longer than the interval.","fix":"Either make the job faster or widen the schedule. Overlap is a symptom.","confirm":""},{"id":"missed-deadline","cause":"startingDeadlineSeconds expired.","fix":"Raise it, or accept that runs are skipped when the controller is unavailable.","confirm":""}],"verify":["One run active at a time.","Job history stays bounded.","No schedule is silently missed."],"escalate":["Job count and states","Concurrency and history settings","Any missed-schedule events"]},{"id":"k8s-sa-token-issues","tier":"guide","technology":"Kubernetes","category":"Access & RBAC","title":"Application cannot authenticate to the API server","summary":"In-cluster code gets 401 or cannot find its ServiceAccount token.","aliases":["serviceaccount token","401 in cluster","cannot read token","projected token","bound token","unauthorized in pod"],"source":"https://kubernetes.io/docs/concepts/security/service-accounts/","inputs":[{"key":"pod","label":"Pod","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Check the ServiceAccount on the pod","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.serviceAccountName}'","risk":"safe","look":"Empty means the default ServiceAccount, which typically has almost no permissions. That is the usual cause of an in-cluster 401.","signals":[{"match":"^default$|^$","means":"Using the default ServiceAccount, which has no meaningful RBAC.","goto":"cause:default-sa"}]},{"title":"Check the token is mounted","cmd":"kubectl exec {pod} -n {namespace} -- ls -la /var/run/secrets/kubernetes.io/serviceaccount/","risk":"safe","look":"token, ca.crt and namespace should be present. Absent means automountServiceAccountToken is false somewhere.","signals":[{"match":"No such file","means":"No token is mounted at all.","goto":"cause:automount-off"}]},{"title":"Check automount settings","cmd":"kubectl get sa <name> -n {namespace} -o jsonpath='{.automountServiceAccountToken}'","risk":"safe","look":"This can be disabled on the ServiceAccount or on the pod. The pod setting wins."},{"title":"Check what that identity is allowed to do","cmd":"kubectl auth can-i --list --as=system:serviceaccount:{namespace}:<name> -n {namespace}","risk":"safe","look":"The effective permissions for that ServiceAccount. Comparing against what the app needs usually makes the gap obvious."}],"causes":[{"id":"default-sa","cause":"Using the default ServiceAccount.","fix":"Create a dedicated one and bind only the permissions the app needs.","confirm":""},{"id":"automount-off","cause":"Token automounting is disabled.","fix":"Enable it on the pod if the app genuinely needs API access.","confirm":""},{"id":"no-rbac","cause":"The ServiceAccount has no binding.","fix":"Create a Role and RoleBinding. Grant the narrowest set that works.","confirm":""},{"id":"expired-token","cause":"A legacy long-lived token expired.","fix":"Modern tokens are projected and rotate automatically. Use the projected volume rather than a Secret.","confirm":""},{"id":"wrong-namespace","cause":"The binding is in a different namespace.","fix":"RoleBindings are namespaced. The binding must be where the resource lives.","confirm":""}],"verify":["The application authenticates.","It has only the permissions it needs.","The token rotates rather than being a static Secret."],"escalate":["ServiceAccount name","Whether the token is mounted","Effective permissions from auth can-i"]},{"id":"k8s-container-readonly-fs","tier":"guide","technology":"Kubernetes","category":"Pods & Containers","title":"Container cannot write to its filesystem","summary":"The app fails on writes even though it worked before hardening was applied.","aliases":["read-only file system pod","cannot write container","readonlyrootfilesystem","securitycontext write","permission denied write pod"],"source":"https://kubernetes.io/docs/tasks/configure-pod-container/security-context/","inputs":[{"key":"pod","label":"Pod","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Check the security context","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].securityContext}'","risk":"safe","look":"readOnlyRootFilesystem true means every write outside a mounted volume fails by design.","signals":[{"match":"readOnlyRootFilesystem.*true","means":"The root filesystem is read-only on purpose.","goto":"cause:readonly-rootfs"},{"match":"runAsUser","means":"Running as a specific UID. It may not own the paths it needs.","goto":"cause:uid-ownership"}]},{"title":"Find where it is trying to write","cmd":"kubectl logs {pod} -n {namespace} --tail=50","risk":"safe","look":"The path in the error. Temp directories and cache paths are the usual ones applications forget about."},{"title":"Check what volumes are mounted","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].volumeMounts}'","risk":"safe","look":"Whether a writable volume covers the path it needs. An emptyDir at that path is usually the whole fix."},{"title":"Check volume ownership settings","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.securityContext.fsGroup}'","risk":"safe","look":"fsGroup chowns mounted volumes to that group on mount. Without it, a non-root user often cannot write to a fresh volume."}],"causes":[{"id":"readonly-rootfs","cause":"The root filesystem is read-only.","fix":"Mount an emptyDir at the path that needs writes. Keep the rootfs read-only; it is a good default.","confirm":""},{"id":"uid-ownership","cause":"The container user does not own the path.","fix":"Set fsGroup so volumes are chowned on mount.","confirm":""},{"id":"no-tmp-volume","cause":"The app writes to /tmp with a read-only rootfs.","fix":"Mount an emptyDir at /tmp. Almost every hardened workload needs this.","confirm":""},{"id":"hostpath-permissions","cause":"A hostPath mount has restrictive ownership.","fix":"Fix ownership on the host, or use a proper volume type.","confirm":""}],"verify":["The application writes successfully.","The root filesystem stays read-only.","Writable paths are explicit volumes."],"escalate":["The security context","Which path the write failed on","Mounted volumes and fsGroup"]},{"id":"k8s-nodeport-not-reachable","tier":"guide","technology":"Kubernetes","category":"Services & Networking","title":"NodePort service is not reachable from outside","summary":"The Service exists with a node port but connections from outside the cluster time out.","aliases":["nodeport not working","cannot reach nodeport","service external","nodeport timeout","port not open node"],"source":"https://kubernetes.io/docs/concepts/services-networking/service/","inputs":[{"key":"service","label":"Service","example":"checkout-api"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Confirm the allocated node port","cmd":"kubectl get svc {service} -n {namespace} -o jsonpath='{.spec.type}{\"|\"}{.spec.ports[*].nodePort}'","risk":"safe","look":"The type must be NodePort or LoadBalancer. The port is in the 30000 to 32767 range unless configured otherwise.","signals":[{"match":"ClusterIP","means":"ClusterIP is internal only. There is no node port to reach.","goto":"cause:wrong-type"}]},{"title":"Check the Service has endpoints","cmd":"kubectl get endpointslices -n {namespace} -l kubernetes.io/service-name={service}","risk":"safe","look":"No endpoints means the node port answers with nothing. Fix that before looking at the network."},{"title":"Test from a node itself","cmd":"kubectl get nodes -o wide","risk":"safe","look":"Get a node IP, then curl that IP on the node port from somewhere inside the network. Working there but not from outside isolates it to the firewall."},{"title":"Check externalTrafficPolicy","cmd":"kubectl get svc {service} -n {namespace} -o jsonpath='{.spec.externalTrafficPolicy}'","risk":"safe","look":"Local means only nodes actually running a pod will answer. Hitting any other node gives a timeout that looks like a firewall problem."}],"causes":[{"id":"wrong-type","cause":"The Service is ClusterIP.","fix":"Change the type to NodePort or LoadBalancer.","confirm":""},{"id":"firewall","cause":"The node port is blocked at the cloud firewall.","fix":"Open the port range in the security group. It is closed by default.","confirm":""},{"id":"policy-local","cause":"externalTrafficPolicy is Local.","fix":"Only nodes with a pod respond. Use Cluster, or target nodes that host the workload.","confirm":""},{"id":"no-endpoints","cause":"The Service has no ready endpoints.","fix":"Follow the no-endpoints runbook.","confirm":""},{"id":"wrong-node-ip","cause":"Using an internal IP from outside the network.","fix":"Use the external address, or a load balancer in front.","confirm":""}],"verify":["The service answers on the node port from outside.","It answers from any node, or Local is understood."],"escalate":["Service type and node port","Endpoint list","Whether it works from inside the network"]},{"id":"k8s-kubeconfig-context-mess","tier":"guide","technology":"Kubernetes","category":"Access & RBAC","title":"Commands run against the wrong cluster","summary":"You applied something and it landed in the wrong environment.","aliases":["wrong cluster","wrong context","applied to prod","kubeconfig context","current-context","multiple clusters"],"source":"https://kubernetes.io/docs/tasks/access-application-cluster/configure-access-multiple-clusters/","inputs":[],"steps":[{"title":"Show the active context and its cluster","cmd":"kubectl config current-context && kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}'","risk":"safe","look":"The server URL, not just the context name. Names lie; the URL does not."},{"title":"List every context available","cmd":"kubectl config get-contexts","risk":"safe","look":"The asterisk marks the active one. Similar names between environments are how accidents happen."},{"title":"Check the default namespace for this context","cmd":"kubectl config view --minify -o jsonpath='{.contexts[0].context.namespace}'","risk":"safe","look":"An empty value means default. Commands without -n go there, which is rarely what you want in a shared cluster."},{"title":"Switch deliberately before doing anything","cmd":"kubectl config use-context <name>","risk":"state","look":"current-context shows the intended cluster. Confirm the server URL again.","note":"Changes which cluster every subsequent kubectl command talks to, for every shell on this machine. If another terminal is mid-task it will silently switch too. Prefer --context on individual commands when working across clusters at the same time."}],"causes":[{"id":"similar-names","cause":"Context names look alike.","fix":"Rename them to be unmistakable. Put the environment first.","confirm":""},{"id":"no-prompt","cause":"Nothing shows the active context.","fix":"Add it to your shell prompt. This single change prevents most of these incidents.","confirm":""},{"id":"default-namespace","cause":"The context has no namespace set.","fix":"Set one per context so bare commands land somewhere predictable.","confirm":""},{"id":"shared-kubeconfig","cause":"One kubeconfig for every cluster.","fix":"Use --context explicitly, or separate files with KUBECONFIG.","confirm":""},{"id":"already-applied","cause":"You already applied to the wrong cluster.","fix":"Check what changed before reverting. A blind delete can make it worse.","confirm":""}],"verify":["The context matches the intended environment.","The prompt shows it.","A guardrail exists for production."],"escalate":["Active context and server URL","All available contexts","What was applied and where"]},{"id":"k8s-hpa-flapping","tier":"guide","technology":"Kubernetes","category":"Autoscaling","title":"Replica count oscillates up and down","summary":"The autoscaler scales up then straight back down, churning pods continuously.","aliases":["hpa flapping","replicas oscillating","scaling up and down","thrashing autoscaler","pods churning"],"source":"https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/","inputs":[{"key":"hpa","label":"HPA","example":"checkout-api"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Watch the replica count over time","cmd":"kubectl get hpa {hpa} -n {namespace} -w","risk":"safe","look":"How often REPLICAS changes. Several changes a minute is flapping; a change every few minutes is normal response.","signals":[{"match":"\\d+\\s+\\d+\\s+\\d+","means":"Read the current, min and max. A target close to the actual utilisation makes small swings trigger scaling.","goto":"cause:target-too-tight"}]},{"title":"Read the scaling behaviour policy","cmd":"kubectl get hpa {hpa} -n {namespace} -o jsonpath='{.spec.behavior}'","risk":"safe","look":"Empty means defaults. The default scale-down stabilisation is five minutes, so flapping faster than that means something overrides it."},{"title":"Check whether new pods distort the metric","cmd":"kubectl top pods -n {namespace}","risk":"safe","look":"A pod still warming up reports high CPU, which triggers more scaling, which adds more warming pods. That is the feedback loop."}],"causes":[{"id":"target-too-tight","cause":"The target utilisation sits right at normal load.","fix":"Lower the target so ordinary variation does not cross it.","confirm":""},{"id":"no-stabilisation","cause":"Scale-down stabilisation is too short.","fix":"Raise behavior.scaleDown.stabilizationWindowSeconds.","confirm":""},{"id":"warmup-distortion","cause":"New pods report high usage while starting.","fix":"Add a startup allowance, or scale on a metric that excludes warmup.","confirm":""},{"id":"spiky-workload","cause":"The load itself is spiky.","fix":"Scale on a smoothed metric such as queue depth rather than instantaneous CPU.","confirm":""}],"verify":["Replica count settles and changes only with real load trends.","Pod churn stops."],"escalate":["Replica changes over ten minutes","The behavior policy","Whether new pods distort the metric"]},{"id":"k8s-webhook-blocking","tier":"guide","technology":"Kubernetes","category":"Configuration","title":"Every create fails with a webhook error","summary":"Admission webhooks reject or time out, so nothing can be applied.","aliases":["webhook denied","admission webhook","failed calling webhook","x509 webhook","context deadline webhook","cannot create resource"],"source":"https://kubernetes.io/docs/reference/access-authn-authz/extensible-admission-controllers/","inputs":[{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the admission error","cmd":"kubectl apply -f <manifest>","risk":"safe","look":"The webhook name is in the message. That tells you which controller to look at.","signals":[{"match":"failed calling webhook.*context deadline","means":"The webhook did not answer in time.","goto":"cause:webhook-timeout"},{"match":"x509|certificate signed by unknown","means":"The API server does not trust the webhook's certificate.","goto":"cause:webhook-cert"},{"match":"denied the request","means":"The webhook answered and refused. This is policy working.","goto":"cause:policy-denied"}]},{"title":"Check the webhook's backing service","cmd":"kubectl get validatingwebhookconfigurations,mutatingwebhookconfigurations","risk":"safe","look":"Which configurations exist and what service each points at. A webhook pointing at a deleted service blocks everything it matches."},{"title":"Check the webhook pods are running","cmd":"kubectl get pods -A | findstr /I \"webhook admission policy\"","risk":"safe","look":"The controller must be running and ready. A crashed policy engine takes the cluster's write path with it."},{"title":"Check the failure policy","cmd":"kubectl get validatingwebhookconfigurations -o jsonpath='{.items[*].webhooks[*].failurePolicy}'","risk":"safe","look":"Fail means an unreachable webhook blocks everything. Ignore means it is skipped. That single setting decides whether an outage is total."}],"causes":[{"id":"webhook-timeout","cause":"The webhook is slow or unreachable.","fix":"Fix the controller. Consider a namespaceSelector so kube-system is exempt.","confirm":""},{"id":"webhook-cert","cause":"The certificate is untrusted or expired.","fix":"Rotate the caBundle. Cert-manager-issued webhook certs expire like any other.","confirm":""},{"id":"policy-denied","cause":"A policy genuinely rejected the resource.","fix":"Read the message and fix the manifest. This is the system working.","confirm":""},{"id":"service-gone","cause":"The backing service was deleted.","fix":"Delete the webhook configuration too, or restore the service.","confirm":""},{"id":"fail-closed","cause":"failurePolicy is Fail with no exemptions.","fix":"Exempt kube-system so a broken webhook cannot lock you out entirely.","confirm":""}],"verify":["Resources apply successfully.","The webhook controller is healthy.","System namespaces are exempt."],"escalate":["The webhook error verbatim","Which configurations exist","Whether the backing pods are ready"]},{"id":"k8s-metrics-server-down","tier":"guide","technology":"Kubernetes","category":"Observability","title":"kubectl top does not work","summary":"Resource metrics are unavailable, which also breaks autoscaling.","aliases":["metrics not available","kubectl top error","metrics-server","metrics api not available","no metrics"],"source":"https://kubernetes.io/docs/tasks/debug/debug-cluster/resource-metrics-pipeline/","inputs":[],"steps":[{"title":"Read the error from top","cmd":"kubectl top nodes","risk":"safe","look":"Whether the API is absent or present but failing. Those are different problems.","signals":[{"match":"Metrics API not available","means":"The API service is not registered or not ready.","goto":"cause:apiservice-down"},{"match":"error: You must be logged in","means":"An authentication problem rather than a metrics one.","goto":"cause:auth"}]},{"title":"Check the API service is available","cmd":"kubectl get apiservice v1beta1.metrics.k8s.io","risk":"safe","look":"AVAILABLE must be True. False carries a reason, usually that the service endpoint is unreachable."},{"title":"Check the metrics-server pod","cmd":"kubectl get pods -n kube-system -l k8s-app=metrics-server","risk":"safe","look":"Running and ready. CrashLooping is usually a TLS problem talking to kubelets."},{"title":"Read its logs","cmd":"kubectl logs -n kube-system -l k8s-app=metrics-server --tail=40","risk":"safe","look":"Certificate errors against the kubelet are the most common failure on self-managed clusters."}],"causes":[{"id":"not-installed","cause":"metrics-server is not installed.","fix":"Install it. It is not part of a base cluster.","confirm":""},{"id":"apiservice-down","cause":"The API service cannot reach the pod.","fix":"Check the service and any NetworkPolicy in kube-system.","confirm":""},{"id":"kubelet-tls","cause":"metrics-server cannot verify kubelet certificates.","fix":"Configure it properly, or use --kubelet-insecure-tls only in a lab.","confirm":""},{"id":"auth","cause":"Your credentials are the problem, not metrics.","fix":"Follow the API access runbook.","confirm":""}],"verify":["kubectl top returns figures.","The API service reports available.","HPAs show real targets."],"escalate":["The top error","API service status","metrics-server pod logs"]},{"id":"k8s-pod-security-blocked","tier":"guide","technology":"Kubernetes","category":"Access & RBAC","title":"Pod rejected by Pod Security admission","summary":"Creating a pod fails because it violates the namespace's security level.","aliases":["pod security","violates PodSecurity","privileged denied","restricted policy","psa","security context denied"],"source":"https://kubernetes.io/docs/concepts/security/pod-security-admission/","inputs":[{"key":"namespace","label":"Namespace","example":"production"},{"key":"pod","label":"Pod","example":"checkout-api-7d9f6b8c5-x4k2m"}],"steps":[{"title":"Read the violation message","cmd":"kubectl apply -f <manifest> -n {namespace}","risk":"safe","look":"It lists every field that violates the policy. Each one must be fixed; there is no partial pass.","signals":[{"match":"allowPrivilegeEscalation","means":"Must be set to false explicitly.","goto":"cause:privilege-escalation"},{"match":"runAsNonRoot","means":"The pod must declare it runs as non-root.","goto":"cause:runs-as-root"},{"match":"seccompProfile","means":"A seccomp profile must be specified.","goto":"cause:no-seccomp"},{"match":"hostPath|hostNetwork|hostPID","means":"Host access is forbidden at this level.","goto":"cause:host-access"}]},{"title":"Check the namespace's enforced level","cmd":"kubectl get ns {namespace} -o jsonpath='{.metadata.labels}'","risk":"safe","look":"The pod-security labels. baseline is permissive; restricted requires a full security context on every container."},{"title":"Check what the pod declares","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.securityContext}{.spec.containers[*].securityContext}'","risk":"safe","look":"Compare against the requirements. Under restricted, omitting a field is a violation rather than a default."}],"causes":[{"id":"privilege-escalation","cause":"allowPrivilegeEscalation is not false.","fix":"Set it explicitly. Omitting it fails under restricted.","confirm":""},{"id":"runs-as-root","cause":"The pod does not declare runAsNonRoot.","fix":"Set runAsNonRoot true and give a numeric runAsUser. The image must support it.","confirm":""},{"id":"no-seccomp","cause":"No seccomp profile.","fix":"Set seccompProfile type RuntimeDefault.","confirm":""},{"id":"host-access","cause":"The pod requests host namespaces or paths.","fix":"Not permitted at baseline or above. Redesign, or run it in a dedicated namespace with a lower level.","confirm":""},{"id":"wrong-level","cause":"The namespace level is stricter than intended.","fix":"Adjust the label deliberately, with a reason recorded.","confirm":""}],"verify":["The pod is admitted.","It runs as non-root with a full security context.","The namespace level was not weakened casually."],"escalate":["The full violation message","The namespace security labels","The pod's declared security context"]},{"id":"k8s-node-disk-pressure","tier":"guide","technology":"Kubernetes","category":"Nodes","title":"Node reports DiskPressure","summary":"The kubelet is evicting pods because the node is low on disk.","aliases":["diskpressure","node disk full","image garbage collection","evicted disk","node out of space","kubelet disk"],"source":"https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/","inputs":[{"key":"node","label":"Node","example":"ip-10-0-3-14"}],"steps":[{"title":"Confirm the condition","cmd":"kubectl describe node {node} | findstr /C:\"DiskPressure\" -A3","risk":"safe","look":"True with a message naming which resource. nodefs and imagefs are separate thresholds with separate causes.","signals":[{"match":"imagefs","means":"Image storage is full. Garbage collection is not keeping up.","goto":"cause:image-bloat"},{"match":"nodefs","means":"The node's own filesystem is full, usually logs or ephemeral storage.","goto":"cause:node-logs"}]},{"title":"See what pods were evicted","cmd":"kubectl get pods -A --field-selector status.phase=Failed","risk":"safe","look":"Evicted pods with their reason. Best-effort pods go first, which tells you who was not declaring requests."},{"title":"Check image garbage collection thresholds","cmd":"kubectl get --raw /api/v1/nodes/{node}/proxy/configz","risk":"safe","look":"imageGCHighThresholdPercent and low. Defaults of 85 and 80 are too tight on nodes running large images."},{"title":"Cordon the node while you work","cmd":"kubectl cordon {node}","risk":"state","look":"The node shows SchedulingDisabled.","note":"Marks the node unschedulable so nothing new lands while you clear space. Running pods are unaffected, but capacity elsewhere must absorb new work. Remember to uncordon afterwards or the node stays out of the pool permanently."}],"causes":[{"id":"image-bloat","cause":"Too many images cached on the node.","fix":"Lower the GC thresholds, and shrink your images. Both help.","confirm":""},{"id":"node-logs","cause":"Container logs filled the disk.","fix":"Set containerLogMaxSize and containerLogMaxFiles in the kubelet config.","confirm":""},{"id":"ephemeral-storage","cause":"A pod wrote large files to its writable layer.","fix":"Set ephemeral-storage limits so one workload cannot fill the node.","confirm":""},{"id":"small-disk","cause":"The node disk is simply too small.","fix":"Resize, or use a node type with more storage for image-heavy workloads.","confirm":""}],"verify":["DiskPressure is false.","No new evictions.","GC thresholds and log rotation are configured."],"escalate":["The node condition message","Which pods were evicted","GC thresholds in the kubelet config"]},{"id":"k8s-cluster-autoscaler-not-scaling","tier":"guide","technology":"Kubernetes","category":"Autoscaling","title":"Cluster does not add nodes for pending pods","summary":"Pods stay Pending and no new node appears.","aliases":["cluster autoscaler not scaling","no new nodes","pending forever","scale up failed","autoscaler ignored"],"source":"https://kubernetes.io/docs/concepts/cluster-administration/cluster-autoscaling/","inputs":[{"key":"pod","label":"Pod","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the autoscaler's decision","cmd":"kubectl logs -n kube-system -l app=cluster-autoscaler --tail=60","risk":"safe","look":"It logs why it did or did not scale. That log is the answer; everything else is inference.","signals":[{"match":"max node group size reached","means":"The pool is already at its ceiling.","goto":"cause:at-max"},{"match":"pod didn't trigger scale-up","means":"The pod would not fit on a new node of any available type.","goto":"cause:wont-fit"},{"match":"no matching node group","means":"No pool satisfies the pod's selectors or to
