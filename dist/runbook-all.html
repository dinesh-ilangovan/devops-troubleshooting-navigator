lerations.","goto":"cause:no-matching-pool"}]},{"title":"Check the pod's requests against node capacity","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].resources.requests}'","risk":"safe","look":"A request larger than any node type can provide means no amount of scaling will help."},{"title":"Check the pod's scheduling constraints","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.nodeSelector}{.spec.tolerations}'","risk":"safe","look":"The autoscaler only scales pools the pod could actually use. A selector matching no pool is invisible to it."},{"title":"Check pool limits","cmd":"kubectl get nodes -l node.kubernetes.io/instance-type --show-labels","risk":"safe","look":"Which pools exist and how many nodes each has. Compare against the configured maximum."}],"causes":[{"id":"at-max","cause":"The node pool is at its maximum size.","fix":"Raise the maximum. The autoscaler will not exceed it.","confirm":""},{"id":"wont-fit","cause":"The pod is larger than any node type.","fix":"Reduce the request, or add a larger node type.","confirm":""},{"id":"no-matching-pool","cause":"No pool matches the pod's constraints.","fix":"Label a pool to match, or relax the selector.","confirm":""},{"id":"quota","cause":"The cloud account is at its instance quota.","fix":"Raise the quota. The autoscaler reports the provider's refusal.","confirm":""},{"id":"local-storage","cause":"The pod uses local storage, which blocks scale-down but also confuses placement.","fix":"Check the autoscaler's safe-to-evict annotations.","confirm":""}],"verify":["A new node appears and the pod schedules.","The autoscaler log shows a successful scale-up."],"escalate":["Autoscaler log lines for this pod","The pod's requests and constraints","Pool maximum and current size"]},{"id":"linux-disk-full","tier":"guide","technology":"Linux","category":"Storage","title":"Filesystem is full","summary":"Writes fail with no space left. Find what is consuming it before deleting anything.","aliases":["no space left","disk full","filesystem full","cannot write","df full","100% used"],"source":"https://man7.org/linux/man-pages/man1/du.1.html","inputs":[{"key":"path","label":"Filesystem or path","example":"/"}],"steps":[{"title":"See which filesystem is actually full","cmd":"df -h","risk":"safe","look":"The Use% column, and note the mount point. A full /var is a very different problem from a full /home.","signals":[{"match":"100%","means":"That filesystem is completely full.","goto":"step:2"},{"match":"(?i)/dev/loop|overlay","means":"Container or snap storage, not the host's own data.","goto":"cause:container-storage"}]},{"title":"Check inodes, because df can lie","cmd":"df -i","risk":"safe","look":"Space free but IUse% at 100 means inode exhaustion. The error is identical but the fix is completely different."},{"title":"Find the largest directories","cmd":"du -xh {path} --max-depth=2 2>/dev/null | sort -rh | head -20","risk":"safe","look":"The -x keeps it on one filesystem so you are not misled by other mounts. Work downward from the largest entry."},{"title":"Find space held by deleted but still-open files","cmd":"lsof +L1 2>/dev/null | head -20","risk":"safe","look":"A deleted file held open by a running process still occupies disk. This explains the case where du shows far less than df.","signals":[{"match":"(?i)deleted","means":"Space is held by a deleted file still open. Restarting that process releases it.","goto":"cause:deleted-open"}]}],"causes":[{"id":"logs","cause":"Log files grew without rotation.","fix":"Truncate with : > file rather than deleting, so the open handle stays valid. Then fix logrotate.","confirm":""},{"id":"deleted-open","cause":"A process holds a deleted file open.","fix":"Restart that process. No amount of deleting will reclaim the space otherwise.","confirm":""},{"id":"inodes","cause":"Inodes exhausted by many small files.","fix":"Find the directory with the most entries and clear it. Often a session or cache directory.","confirm":""},{"id":"container-storage","cause":"Container images and layers.","fix":"Prune the container runtime's storage, with a time filter rather than wholesale.","confirm":""}],"verify":["df shows meaningful free space.","The write that was failing now succeeds.","Rotation or cleanup is configured so it does not recur."],"escalate":["df -h and df -i output","The top entries from du","Whether any deleted files are still held open"]},{"id":"linux-port-in-use","tier":"guide","technology":"Linux","category":"Networking","title":"Address already in use","summary":"A service will not start because something already holds its port.","aliases":["address already in use","port in use","bind failed","cannot bind","eaddrinuse","port already bound"],"source":"https://man7.org/linux/man-pages/man8/ss.8.html","inputs":[{"key":"port","label":"Port","example":"8080"}],"steps":[{"title":"Find what is listening","cmd":"sudo ss -tlnp 'sport = :{port}'","risk":"safe","look":"The process name and PID in the last column. Without sudo you will not see the owner for another user's process.","signals":[{"match":"users:\\(\\(","means":"A process holds it. The name and PID are in the parentheses.","goto":"cause:other-process"},{"match":"^\\s*$","means":"Nothing is listening, so the failure is something else.","goto":"step:3"}]},{"title":"Check whether it is bound on a different interface","cmd":"sudo ss -tlnp | grep :{port}","risk":"safe","look":"0.0.0.0 versus 127.0.0.1 versus a specific IP. Two processes can bind the same port on different addresses, which looks contradictory until you see this."},{"title":"Check for a socket stuck in TIME_WAIT","cmd":"ss -tan | grep :{port} | head","risk":"safe","look":"TIME_WAIT entries without a listener mean the old socket has not been released. SO_REUSEADDR in the application is the correct fix, not waiting."},{"title":"Stop the process holding the port","cmd":"sudo kill <pid>","risk":"destructive","look":"Re-run ss to confirm the port is free before starting your service.","note":"Terminates the process. If it is a production service, its clients drop immediately. Confirm what the PID actually is with ps before running this, and prefer the service manager's stop command so it shuts down cleanly."}],"causes":[{"id":"other-process","cause":"Another process is bound to the port.","fix":"Stop it through its service manager, or configure your service to use a different port.","confirm":""},{"id":"time-wait","cause":"An old socket has not been released.","fix":"Enable SO_REUSEADDR in the application. Waiting works but is not a fix.","confirm":""},{"id":"interface-conflict","cause":"Bound to a specific address that overlaps your wildcard bind.","fix":"Bind to a specific address instead of 0.0.0.0.","confirm":""},{"id":"systemd-socket","cause":"A systemd socket unit holds the port.","fix":"Stop the .socket unit, not just the .service.","confirm":""}],"verify":["The service starts and is listening.","ss shows it as the owner of the port."],"escalate":["ss -tlnp output for the port","What the holding process is","Whether it is managed by systemd"]},{"id":"linux-service-fails","tier":"guide","technology":"Linux","category":"systemd","title":"systemd service will not start","summary":"systemctl start fails or the unit restarts in a loop. The journal has the real reason.","aliases":["service failed","systemctl start failed","unit failed","job failed see systemctl status","service wont start","activating auto-restart"],"source":"https://man7.org/linux/man-pages/man1/systemctl.1.html","inputs":[{"key":"unit","label":"Unit name","example":"checkout-api.service"}],"steps":[{"title":"Read the unit's current state and last lines","cmd":"systemctl status {unit} --no-pager -l","risk":"safe","look":"The Active line and the exit status. 'code=exited status=N' is the application's own exit code and the most useful number on the screen.","signals":[{"match":"(?i)status=203/EXEC","means":"systemd could not execute the binary. Wrong path, or not executable.","goto":"cause:bad-exec"},{"match":"(?i)status=200/CHDIR","means":"WorkingDirectory does not exist.","goto":"cause:bad-workdir"},{"match":"(?i)status=217/USER","means":"The configured User does not exist.","goto":"cause:bad-user"},{"match":"(?i)Result: timeout","means":"It started but never signalled readiness in time.","goto":"cause:type-mismatch"}]},{"title":"Read the journal for this unit's last start","cmd":"journalctl -u {unit} -n 80 --no-pager","risk":"safe","look":"The application's own output. systemctl status truncates; this does not."},{"title":"Validate the unit file itself","cmd":"systemd-analyze verify /etc/systemd/system/{unit}","risk":"safe","look":"Syntax problems and unresolvable references that status will never mention."},{"title":"Reload systemd after editing a unit","cmd":"sudo systemctl daemon-reload","risk":"state","look":"No output means success. Start the unit again afterwards.","note":"Re-reads all unit files. Running services are not restarted and nothing is interrupted, but forgetting this after an edit means systemd keeps using the old definition and your change appears to do nothing."}],"causes":[{"id":"bad-exec","cause":"ExecStart points at something that cannot be executed.","fix":"Use an absolute path and check the execute bit. systemd does not use your shell's PATH.","confirm":""},{"id":"bad-user","cause":"The User directive names an account that does not exist.","fix":"Create the user or correct the name.","confirm":""},{"id":"bad-workdir","cause":"WorkingDirectory does not exist.","fix":"Create it, or remove the directive.","confirm":""},{"id":"type-mismatch","cause":"Type=notify or forking, but the process does not behave that way.","fix":"Use Type=simple for a process that stays in the foreground. This mismatch causes start timeouts constantly.","confirm":""},{"id":"stale-unit","cause":"The unit file was edited without a daemon-reload.","fix":"Run systemctl daemon-reload after every unit file change.","confirm":""}],"verify":["systemctl status shows active and running.","It survives a reboot if it is enabled.","The journal shows a clean startup."],"escalate":["Full systemctl status output","journalctl for the last start attempt","The unit file contents"]},{"id":"linux-high-load","tier":"guide","technology":"Linux","category":"Performance","title":"Load average is high and the box feels slow","summary":"High load can mean CPU, disk wait or thread explosion. They look identical at first and need different fixes.","aliases":["high load","load average","server slow","cpu high","system unresponsive","load spike"],"source":"https://man7.org/linux/man-pages/man1/top.1.html","inputs":[],"steps":[{"title":"Separate CPU from I/O wait","cmd":"top -bn1 | head -5","risk":"safe","look":"The %Cpu line. High us means real computation; high wa means processes blocked on disk; high sy means kernel overhead, often context switching.","signals":[{"match":"(?i)wa[,\\s]*[1-9]\\d\\.","means":"Significant I/O wait. The disk, not the CPU, is the bottleneck.","goto":"cause:io-wait"},{"match":"(?i)st[,\\s]*[1-9]","means":"Steal time. The hypervisor is taking cycles; this is a noisy-neighbour problem.","goto":"cause:steal"}]},{"title":"Compare load against core count","cmd":"uptime && nproc","risk":"safe","look":"Load equal to core count is fully busy, not broken. Load at several times the core count is where queuing hurts."},{"title":"Find the top consumers","cmd":"ps -eo pid,ppid,pcpu,pmem,etime,comm --sort=-pcpu | head -15","risk":"safe","look":"The elapsed time column matters as much as the CPU column. A process at 100% for three seconds is normal; for three hours it is not."},{"title":"Check whether processes are blocked rather than running","cmd":"ps -eo state,pid,comm | grep '^D' | head","risk":"safe","look":"State D is uninterruptible sleep, almost always disk or NFS. Load counts these, which is why a box can show high load with idle CPUs."}],"causes":[{"id":"io-wait","cause":"Processes are blocked on disk.","fix":"Find the process doing the I/O. The CPU is not the constraint and adding cores will not help.","confirm":""},{"id":"runaway-process","cause":"One process is consuming the CPU.","fix":"Identify it from the elapsed time. Restart or throttle it depending on what it is.","confirm":""},{"id":"thread-explosion","cause":"A large number of threads or processes.","fix":"Check the thread count. An unbounded worker pool is a common cause.","confirm":""},{"id":"steal","cause":"The hypervisor is taking CPU time.","fix":"This is not fixable from inside the guest. Raise it with the platform owner.","confirm":""},{"id":"normal","cause":"Load is roughly equal to core count under real work.","fix":"Nothing is wrong. Measure response time rather than load average.","confirm":""}],"verify":["Load is proportional to core count under normal work.","Response times are acceptable.","The specific contributor was identified, not just observed."],"escalate":["top header lines","Load average with nproc","Top processes by CPU with elapsed time"]},{"id":"linux-ssh-denied","tier":"guide","technology":"Linux","category":"Access","title":"SSH permission denied (publickey)","summary":"The server rejected your key. Verbose output names the exact reason.","aliases":["permission denied publickey","ssh denied","cannot ssh","key rejected","authentication failed ssh","too open private key"],"source":"https://man7.org/linux/man-pages/man8/sshd.8.html","inputs":[{"key":"host","label":"Host","example":"bastion.example.com"},{"key":"user","label":"User","example":"ubuntu"}],"steps":[{"title":"Run with verbose output and read which keys were offered","cmd":"ssh -vvv {user}@{host} 2>&1 | findstr /C:\"Offering\" /C:\"Authentications\" /C:\"debug1: Next\"","risk":"safe","look":"Which keys the client offered and which methods the server accepts. If your key was never offered, the problem is local, not on the server.","signals":[{"match":"(?i)Offering public key","means":"The key was offered and rejected. The problem is server-side authorization.","goto":"cause:not-authorized"},{"match":"(?i)no such identity","means":"The key file does not exist at the path the client expects.","goto":"cause:missing-key"},{"match":"(?i)bad permissions|too open","means":"The private key is readable by others, so ssh refuses to use it.","goto":"cause:key-permissions"}]},{"title":"Check local key permissions","cmd":"ls -l ~/.ssh/","risk":"safe","look":"The private key must be 600 and the directory 700. ssh silently refuses keys that are more permissive."},{"title":"Confirm which key the client will use for this host","cmd":"ssh -G {host} | findstr identityfile","risk":"safe","look":"The resolved config. A ~/.ssh/config entry may be pointing at a different key than you assume."},{"title":"Check the server side if you have another way in","cmd":"sudo tail -30 /var/log/auth.log","risk":"safe","look":"sshd states the precise reason, including permission problems on the remote authorized_keys file, which the client can never see."}],"causes":[{"id":"not-authorized","cause":"The public key is not in the remote authorized_keys.","fix":"Add it. Confirm you copied the .pub file, not the private key.","confirm":""},{"id":"key-permissions","cause":"Local private key permissions are too open.","fix":"chmod 600 on the key and 700 on ~/.ssh.","confirm":""},{"id":"remote-permissions","cause":"The remote ~/.ssh or authorized_keys is group-writable.","fix":"chmod 700 ~/.ssh and 600 authorized_keys on the server. sshd refuses them otherwise and logs the reason.","confirm":""},{"id":"missing-key","cause":"The key file is not where the client looks.","fix":"Point at it with -i, or add an IdentityFile entry to ~/.ssh/config.","confirm":""},{"id":"wrong-user","cause":"Correct key, wrong username.","fix":"Cloud images each have their own default user. ubuntu, ec2-user and admin are not interchangeable.","confirm":""}],"verify":["SSH connects without a password prompt.","It works from a fresh shell, not only with an explicit -i flag."],"escalate":["ssh -vvv output around the authentication attempt","Local key permissions","auth.log from the server if reachable"]},{"id":"linux-oom-killer","tier":"guide","technology":"Linux","category":"Memory","title":"Process was killed by the OOM killer","summary":"A process vanished with no error. The kernel killed it to reclaim memory.","aliases":["oom killer","process killed","out of memory kernel","killed process","oom-kill","process disappeared"],"source":"https://man7.org/linux/man-pages/man5/proc.5.html","inputs":[{"key":"process","label":"Process name","example":"java"}],"steps":[{"title":"Confirm the kernel did it","cmd":"sudo dmesg -T | grep -i -E 'killed process|oom' | tail -10","risk":"safe","look":"The timestamp, the process name and its RSS at the moment of death. This is definitive; without it you are only guessing.","signals":[{"match":"(?i)Killed process","means":"Confirmed. The kernel chose this process as the victim.","goto":"cause:host-oom"},{"match":"(?i)memory cgroup out of memory","means":"A cgroup limit, not the whole host. Only that container or unit was constrained.","goto":"cause:cgroup-limit"}]},{"title":"See the current memory picture","cmd":"free -h","risk":"safe","look":"available, not free. Linux uses free memory for cache by design, so a low free number is normal and not a problem."},{"title":"Find the current biggest consumers","cmd":"ps -eo pid,rss,comm --sort=-rss | head -10","risk":"safe","look":"RSS in kilobytes. Compare the top entry against total memory to see whether one process dominates."},{"title":"Check what the kernel would kill next","cmd":"for p in $(pgrep {process}); do echo \"$p $(cat /proc/$p/oom_score)\"; done","risk":"safe","look":"Higher score means more likely to be chosen. Useful for predicting the next victim before it happens."}],"causes":[{"id":"host-oom","cause":"The host ran out of memory.","fix":"Reduce the workload, add memory, or set limits so one process cannot take everything.","confirm":""},{"id":"cgroup-limit","cause":"A container or systemd unit hit its own limit.","fix":"Raise MemoryMax or the container limit, having measured the real requirement first.","confirm":""},{"id":"no-swap","cause":"No swap, so there is no buffer before the killer runs.","fix":"A small swap file gives the kernel room to reclaim before killing. Not a substitute for enough RAM.","confirm":""},{"id":"leak","cause":"Memory grows without bound.","fix":"Profile the process. The OOM killer is a symptom, not the problem.","confirm":""}],"verify":["The process stays running through a full workload cycle.","free shows headroom in available.","A limit exists so one process cannot take the whole host."],"escalate":["The dmesg OOM lines verbatim","free -h output","RSS of the top processes"]},{"id":"linux-cron-not-running","tier":"guide","technology":"Linux","category":"Scheduling","title":"Cron job never runs","summary":"The entry is in the crontab but nothing happens. Almost always environment or the schedule itself.","aliases":["cron not running","crontab not working","cron job not executing","scheduled job missing","cron silent","job did not run"],"source":"https://man7.org/linux/man-pages/man5/crontab.5.html","inputs":[{"key":"user","label":"Crontab owner","example":"deploy"},{"key":"job","label":"Command","example":"/opt/app/backup.sh"}],"steps":[{"title":"Confirm cron attempted to run it","cmd":"sudo grep CRON /var/log/syslog | tail -20","risk":"safe","look":"A line for your job means cron fired and the problem is in the script. No line at all means cron never scheduled it.","signals":[{"match":"(?i)CMD \\(","means":"Cron ran it. The failure is inside the command.","goto":"cause:script-fails"},{"match":"^\\s*$","means":"Cron never fired it.","goto":"step:2"},{"match":"(?i)No MTA installed","means":"It ran and produced output cron could not mail. The output is being lost.","goto":"cause:output-lost"}]},{"title":"Check the entry is in the crontab you think","cmd":"sudo crontab -l -u {user} && cat /etc/crontab","risk":"safe","look":"User crontabs and /etc/crontab are separate. The system file has an extra user field; the user crontab does not, and putting a user field in a user crontab breaks the line silently."},{"title":"Check the schedule expression is what you intend","cmd":"echo 'Read the five fields: minute hour day-of-month month day-of-week'","risk":"safe","look":"Setting both day-of-month and day-of-week means OR, not AND, which surprises almost everyone. A job set for the 1st and Monday runs on both."},{"title":"Run the command in cron's own environment","cmd":"sudo -u {user} env -i /bin/sh -c \"{job}\"","risk":"safe","look":"env -i strips the environment the way cron does. A script that works in your shell and fails here has a PATH problem, which is the single most common cause."}],"causes":[{"id":"script-fails","cause":"Cron ran it and it failed.","fix":"Redirect output to a file in the crontab line so the failure is visible.","confirm":""},{"id":"path","cause":"Cron's PATH is minimal.","fix":"Use absolute paths for every binary, or set PATH at the top of the crontab.","confirm":""},{"id":"output-lost","cause":"Output goes to mail and there is no mail transfer agent.","fix":"Append >> /var/log/myjob.log 2>&1 to the crontab line.","confirm":""},{"id":"percent-sign","cause":"An unescaped % in the command.","fix":"In crontab, % means newline. Escape it as \\% — date format strings hit this constantly.","confirm":""},{"id":"no-newline","cause":"The crontab file has no trailing newline.","fix":"The last line is ignored without one. Always edit with crontab -e.","confirm":""},{"id":"wrong-crontab","cause":"Entry is in a different crontab than the one running.","fix":"Check both the user crontab and /etc/cron.d.","confirm":""}],"verify":["The job appears in syslog at the expected time.","Its output lands in a log file.","It works from a clean environment, not just your shell."],"escalate":["Syslog CRON lines for the job","The crontab entry verbatim","Result of running under env -i"]},{"id":"linux-too-many-open-files","tier":"guide","technology":"Linux","category":"Limits","title":"Too many open files","summary":"A process hits its file descriptor limit. Sockets count as files, so busy servers hit this without touching disk.","aliases":["too many open files","emfile","file descriptor limit","ulimit","cannot open socket","fd limit reached"],"source":"https://man7.org/linux/man-pages/man5/limits.conf.5.html","inputs":[{"key":"pid","label":"Process ID","example":"1234"}],"steps":[{"title":"Read the limit the running process actually has","cmd":"cat /proc/{pid}/limits | grep -i 'open files'","risk":"safe","look":"The running process's real limit, which is what matters. Your shell's ulimit is irrelevant to a process started by systemd."},{"title":"Count how many it currently holds","cmd":"ls /proc/{pid}/fd | wc -l","risk":"safe","look":"Compare against the soft limit. Close to it under normal load means the limit is too low; growing steadily means a leak."},{"title":"See what kind of descriptors they are","cmd":"ls -l /proc/{pid}/fd | awk '{print $NF}' | sort | uniq -c | sort -rn | head","risk":"safe","look":"Mostly sockets points at connection handling. Many copies of one file points at a leak in the code.","signals":[{"match":"(?i)socket","means":"Sockets dominate. Connection churn or unclosed connections.","goto":"cause:socket-leak"},{"match":"(?i)deleted","means":"Deleted files still held open. Also consuming disk.","goto":"cause:fd-leak"}]},{"title":"Check the system-wide ceiling too","cmd":"sysctl fs.file-nr fs.file-max","risk":"safe","look":"The first number in file-nr is allocated across the whole system. Near file-max means a host-wide limit rather than a per-process one."}],"causes":[{"id":"limit-too-low","cause":"The per-process limit is below what the workload needs.","fix":"Raise LimitNOFILE in the systemd unit. limits.conf does not apply to systemd services, which catches people out.","confirm":""},{"id":"socket-leak","cause":"Connections are not being closed.","fix":"Check for missing close calls or an unbounded connection pool.","confirm":""},{"id":"fd-leak","cause":"The process opens files and never closes them.","fix":"Deleted-but-open entries are a strong signal. Fix the code; raising the limit only delays it.","confirm":""},{"id":"system-wide","cause":"The host-wide maximum is reached.","fix":"Raise fs.file-max, and find which process is consuming them.","confirm":""},{"id":"wrong-place","cause":"The limit was set in the wrong file.","fix":"For systemd services use LimitNOFILE in the unit. For login shells use limits.conf.","confirm":""}],"verify":["The process runs without hitting the limit under normal load.","The descriptor count is stable rather than growing.","The limit is set where the service actually reads it."],"escalate":["Contents of /proc/PID/limits","Current descriptor count and types","System-wide file-nr and file-max"]},{"id":"linux-time-drift","tier":"guide","technology":"Linux","category":"Time","title":"System clock is wrong or drifting","summary":"Certificate errors, token rejections and confusing log ordering all trace back to clock skew.","aliases":["clock skew","time wrong","ntp not syncing","certificate not yet valid","time drift","chrony not working"],"source":"https://man7.org/linux/man-pages/man1/timedatectl.1.html","inputs":[],"steps":[{"title":"Check the sync status","cmd":"timedatectl status","risk":"safe","look":"System clock synchronized and the NTP service state. Both must be yes and active; either one alone is not enough.","signals":[{"match":"(?i)synchronized: no","means":"Not synchronised. The service is not working.","goto":"cause:not-syncing"},{"match":"(?i)NTP service: inactive","means":"No time daemon is running at all.","goto":"cause:no-daemon"},{"match":"(?i)RTC in local TZ: yes","means":"Hardware clock in local time, which causes drift on dual-boot machines.","goto":"cause:rtc-local"}]},{"title":"Check how far off it actually is","cmd":"chronyc tracking 2>/dev/null || ntpq -p 2>/dev/null || timedatectl show","risk":"safe","look":"System time offset in seconds. Kerberos and many token systems reject anything beyond about five minutes."},{"title":"Check the daemon can reach its sources","cmd":"chronyc sources -v 2>/dev/null || ntpq -pn","risk":"safe","look":"A caret and asterisk marks the selected source. All sources unreachable means egress to UDP 123 is blocked."},{"title":"Force an immediate step correction","cmd":"sudo chronyc makestep","risk":"state","look":"chronyc tracking shows the offset near zero afterwards.","note":"Jumps the clock rather than slewing it gradually. A backward jump can confuse applications that assume time only moves forward, and databases in particular dislike it. Prefer letting chrony slew unless the offset is too large to correct that way."}],"causes":[{"id":"no-daemon","cause":"No time synchronisation service is running.","fix":"Install and enable chrony. Do not run two time daemons together.","confirm":""},{"id":"not-syncing","cause":"The daemon runs but cannot sync.","fix":"Check the sources. UDP 123 egress is often blocked by default in cloud security groups.","confirm":""},{"id":"blocked-egress","cause":"NTP traffic cannot leave the host.","fix":"Allow UDP 123, or point at an internal NTP server.","confirm":""},{"id":"rtc-local","cause":"The hardware clock is in local time.","fix":"Set it to UTC. Dual-boot machines with Windows commonly get this wrong.","confirm":""},{"id":"vm-pause","cause":"The VM was suspended and resumed.","fix":"The guest agent normally corrects this. Check it is installed and running.","confirm":""}],"verify":["timedatectl reports synchronised.","The offset is small and stable.","Certificate and token errors have stopped."],"escalate":["Output of timedatectl status","Tracking offset","Whether NTP sources are reachable"]},{"id":"linux-package-lock","tier":"guide","technology":"Linux","category":"Packages","title":"Could not get lock on the package manager","summary":"apt or yum refuses to run because another process holds the lock.","aliases":["could not get lock","dpkg lock","apt lock","yum lock","another process is using","unattended-upgrades lock"],"source":"https://manpages.debian.org/stable/apt/apt.8.en.html","inputs":[],"steps":[{"title":"Find which process holds the lock","cmd":"sudo lsof /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock 2>/dev/null","risk":"safe","look":"The process name and PID. unattended-upgrades appearing here is normal on a freshly booted machine and will finish on its own.","signals":[{"match":"(?i)unattended|apt\\.system","means":"Automatic updates are running. Wait rather than intervene.","goto":"cause:unattended"},{"match":"(?i)apt|dpkg","means":"Another apt session. Possibly your own in a different terminal.","goto":"cause:other-session"},{"match":"^\\s*$","means":"Nothing holds it. The lock is stale.","goto":"cause:stale-lock"}]},{"title":"Check whether automatic updates are active","cmd":"systemctl is-active unattended-upgrades apt-daily.service","risk":"safe","look":"Active means waiting is correct. This typically clears within a few minutes of boot."},{"title":"Check whether dpkg was interrupted","cmd":"sudo dpkg --audit","risk":"safe","look":"Packages left half-configured by an interrupted run. These must be resolved before anything else will work."},{"title":"Repair an interrupted installation","cmd":"sudo dpkg --configure -a","risk":"state","look":"No output means all packages are consistent. Retry the original command afterwards.","note":"Finishes configuring every half-installed package. Services belonging to those packages may restart as part of it, so on a production host do this in a maintenance window. It does not remove anything."}],"causes":[{"id":"unattended","cause":"Automatic updates hold the lock.","fix":"Wait. Killing it mid-transaction leaves the package database inconsistent.","confirm":""},{"id":"other-session","cause":"Another apt session is open.","fix":"Finish or close it. Check other terminals and any running automation.","confirm":""},{"id":"stale-lock","cause":"The lock file remains after a killed process.","fix":"Only after confirming nothing holds it, remove the lock files and run dpkg --configure -a.","confirm":""},{"id":"interrupted-dpkg","cause":"A previous run was interrupted.","fix":"dpkg --configure -a repairs it. Nothing else will proceed until this is done.","confirm":""},{"id":"cloud-init","cause":"cloud-init is still running on a new instance.","fix":"Wait for it to finish. It installs packages during first boot.","confirm":""}],"verify":["The package command completes.","dpkg --audit reports nothing.","No transaction was killed mid-way."],"escalate":["Which process held the lock","Output of dpkg --audit","Whether automatic updates were running"]},{"id":"linux-sudo-failing","tier":"guide","technology":"Linux","category":"Access","title":"sudo fails or asks for an unexpected password","summary":"Privilege escalation is refused, or a script that expects passwordless sudo hangs waiting for input.","aliases":["sudo password required","user is not in the sudoers file","sudo not working","permission denied sudo","sudo hangs","nopasswd"],"source":"https://man7.org/linux/man-pages/man5/sudoers.5.html","inputs":[{"key":"user","label":"User","example":"deploy"}],"steps":[{"title":"Check what the user is permitted to do","cmd":"sudo -l -U {user}","risk":"safe","look":"The exact rules that apply. NOPASSWD must appear for the specific command if automation is to run unattended.","signals":[{"match":"(?i)not allowed to run sudo","means":"No sudo rule applies to this user at all.","goto":"cause:not-in-sudoers"},{"match":"(?i)NOPASSWD","means":"Passwordless is configured. Check it covers the command you are running.","goto":"cause:command-not-covered"},{"match":"(?i)\\(ALL\\) ALL","means":"Full sudo, but a password is required.","goto":"cause:password-required"}]},{"title":"Check group membership","cmd":"id {user}","risk":"safe","look":"sudo or wheel in the group list, depending on the distribution. A group added during the current session does not apply until a new login."},{"title":"Validate the sudoers configuration parses","cmd":"sudo visudo -c","risk":"safe","look":"A syntax error anywhere in sudoers or sudoers.d can disable sudo entirely, which is why visudo exists."},{"title":"Check the drop-in files, which override the main file","cmd":"sudo ls -la /etc/sudoers.d/","risk":"safe","look":"Later files override earlier ones. A file with the wrong permissions or a dot in its name is ignored silently, which is a very common cause."}],"causes":[{"id":"not-in-sudoers","cause":"The user has no sudo rule.","fix":"Add them to the sudo or wheel group, or create a drop-in file. Always edit with visudo.","confirm":""},{"id":"group-not-applied","cause":"Group membership was added during the current session.","fix":"Log out and back in. Group membership is fixed at login.","confirm":""},{"id":"password-required","cause":"A password is required and automation cannot supply one.","fix":"Add a NOPASSWD rule scoped to the specific commands, never to ALL.","confirm":""},{"id":"command-not-covered","cause":"NOPASSWD covers different commands.","fix":"The path must match exactly, including arguments if specified.","confirm":""},{"id":"dropin-ignored","cause":"A sudoers.d file is ignored.","fix":"It must be mode 0440 and its name must contain no dot or tilde. sudo says nothing when it skips a file.","confirm":""},{"id":"syntax-error","cause":"sudoers has a syntax error.","fix":"visudo -c names the line. If sudo is already broken you need root or single-user mode.","confirm":""}],"verify":["sudo -l shows the intended permissions.","The command runs without an unexpected prompt.","visudo -c reports no errors."],"escalate":["Output of sudo -l -U","Group membership from id","Listing of /etc/sudoers.d with permissions"]},{"id":"linux-cert-expired","tier":"guide","technology":"Linux","category":"TLS","title":"Certificate verification failed","summary":"TLS connections fail. Expiry, an untrusted issuer and a hostname mismatch all look similar at first.","aliases":["certificate verify failed","x509","certificate expired","unable to get local issuer","ssl error","self signed certificate"],"source":"https://www.openssl.org/docs/man3.0/man1/openssl-s_client.html","inputs":[{"key":"host","label":"Host","example":"api.internal.example.com"},{"key":"port","label":"Port","example":"443"}],"steps":[{"title":"Read the certificate the server presents","cmd":"openssl s_client -connect {host}:{port} -servername {host} < /dev/null 2>/dev/null | openssl x509 -noout -dates -subject -issuer","risk":"safe","look":"notAfter, the subject and the issuer. These three answer expiry, hostname and trust in one command.","signals":[{"match":"(?i)notAfter","means":"Compare the date against now. An expired certificate is the simplest case.","goto":"cause:expired"},{"match":"(?i)self.signed|self-signed","means":"Self-signed, so no public CA vouches for it.","goto":"cause:self-signed"}]},{"title":"Read the verification result specifically","cmd":"openssl s_client -connect {host}:{port} -servername {host} < /dev/null 2>&1 | grep -i 'verify'","risk":"safe","look":"The verify return code and its text. Code 10 is expired, 18 is self-signed, 20 is an unobtainable issuer, and each has a different fix.","signals":[{"match":"(?i)verify error:num=10","means":"Expired.","goto":"cause:expired"},{"match":"(?i)verify error:num=(18|19)","means":"Self-signed or a self-signed root in the chain.","goto":"cause:self-signed"},{"match":"(?i)verify error:num=20|unable to get local issuer","means":"The chain is incomplete or the CA is not trusted.","goto":"cause:incomplete-chain"}]},{"title":"Check the hostname matches the certificate","cmd":"openssl s_client -connect {host}:{port} -servername {host} < /dev/null 2>/dev/null | openssl x509 -noout -text | grep -A2 'Subject Alternative Name'","risk":"safe","look":"The name you connect to must appear in the SAN list. The Common Name is no longer used by modern clients at all."},{"title":"Check the host's own trust store is current","cmd":"ls -la /etc/ssl/certs/ca-certificates.crt","risk":"safe","look":"An old container image can carry a trust store predating a CA change, which makes a perfectly valid certificate fail."}],"causes":[{"id":"expired","cause":"The certificate has expired.","fix":"Renew it. If renewal is automated, find out why it stopped rather than only renewing by hand.","confirm":""},{"id":"incomplete-chain","cause":"The server does not send intermediates.","fix":"Configure the full chain. Browsers often fetch missing intermediates; command-line clients do not, which is why it works in a browser and fails in a script.","confirm":""},{"id":"self-signed","cause":"Self-signed or issued by a private CA.","fix":"Add the CA to the trust store. Never disable verification to make it pass.","confirm":""},{"id":"hostname-mismatch","cause":"The name is not in the SAN list.","fix":"Reissue with the correct names. CN alone is ignored by modern clients.","confirm":""},{"id":"stale-trust-store","cause":"The client's CA bundle is out of date.","fix":"Update ca-certificates. Old base images are the usual cause.","confirm":""},{"id":"clock-wrong","cause":"The host clock is wrong, so a valid certificate appears not yet valid.","fix":"Follow the time drift runbook.","confirm":""}],"verify":["openssl reports verify return code 0.","The application connects without disabling verification.","Renewal is automated with monitoring on expiry."],"escalate":["Certificate dates, subject and issuer","The verify error number","Whether the SAN list covers the hostname"]},{"id":"linux-cannot-write-readonly","tier":"guide","technology":"Linux","category":"Storage","title":"Read-only file system","summary":"Writes fail even as root. The filesystem was remounted read-only, usually to protect it.","aliases":["read-only file system","cannot write readonly","remount read only","filesystem readonly","ro filesystem","cannot touch"],"source":"https://man7.org/linux/man-pages/man8/mount.8.html","inputs":[{"key":"path","label":"Path","example":"/var"}],"steps":[{"title":"Confirm the mount is read-only","cmd":"mount | grep -E ' on {path} | on / '","risk":"safe","look":"The (ro flag in the options. Present means read-only, and something caused that.","signals":[{"match":"\\(ro","means":"Mounted read-only.","goto":"step:2"}]},{"title":"Check whether the kernel remounted it after an error","cmd":"sudo dmesg -T | grep -i -E 'remount|read-only|EXT4-fs error|I/O error' | tail -15","risk":"safe","look":"The kernel remounts read-only after filesystem errors to prevent further damage. That is a hardware or corruption signal, not a configuration one.","signals":[{"match":"(?i)EXT4-fs error|I/O error","means":"Filesystem or disk errors forced the remount. Do not simply remount it writable.","goto":"cause:fs-error"},{"match":"(?i)remounting.*read-only","means":"The kernel deliberately protected the filesystem.","goto":"cause:fs-error"}]},{"title":"Check whether fstab declares it read-only","cmd":"grep {path} /etc/fstab","risk":"safe","look":"An ro option in fstab means it was mounted this way intentionally, which is entirely different from an error-driven remount."},{"title":"Check the disk's own health","cmd":"sudo smartctl -H /dev/sda 2>/dev/null || echo 'smartctl not installed'","risk":"safe","look":"Failing hardware behind a read-only remount means the priority is getting data off, not fixing the mount."}],"causes":[{"id":"fs-error","cause":"The kernel remounted after filesystem errors.","fix":"Do not force it writable. Take a backup, then run fsck from a live environment or rescue boot.","confirm":""},{"id":"intentional-ro","cause":"fstab declares it read-only.","fix":"Someone chose this. Find out why before changing it.","confirm":""},{"id":"disk-failing","cause":"The underlying disk is failing.","fix":"Recover data first. A writable remount on failing hardware makes things worse.","confirm":""},{"id":"container-rootfs","cause":"A container's root filesystem is read-only by design.","fix":"Mount a writable volume where writes are needed. Keep the rootfs read-only.","confirm":""},{"id":"full-then-ro","cause":"The filesystem filled and then errored.","fix":"Follow the disk-full runbook after fsck.","confirm":""}],"verify":["Writes succeed.","dmesg shows no new filesystem errors.","If it was an error, the cause was found rather than bypassed."],"escalate":["The mount line with its options","Relevant dmesg lines","fstab entry and disk health"]},{"id":"linux-process-wont-die","tier":"guide","technology":"Linux","category":"Processes","title":"Process will not terminate","summary":"kill has no effect. The process is in an uninterruptible state or being restarted.","aliases":["process wont die","cannot kill process","kill -9 not working","zombie process","defunct","uninterruptible sleep"],"source":"https://man7.org/linux/man-pages/man1/kill.1.html","inputs":[{"key":"pid","label":"PID","example":"1234"}],"steps":[{"title":"Check the process state","cmd":"ps -o pid,ppid,state,wchan:20,comm -p {pid}","risk":"safe","look":"State D means uninterruptible sleep and no signal will reach it. State Z means it is already dead and only the exit status remains.","signals":[{"match":"\\sD\\s","means":"Uninterruptible sleep, usually blocked on I/O. Signals are queued, not delivered.","goto":"cause:uninterruptible"},{"match":"\\sZ\\s","means":"A zombie. Already dead; the parent has not reaped it.","goto":"cause:zombie"}]},{"title":"Find what it is blocked on","cmd":"cat /proc/{pid}/stack 2>/dev/null; cat /proc/{pid}/wchan; echo","risk":"safe","look":"The kernel function it is waiting in. NFS and failing block devices are the classic causes of a permanent D state."},{"title":"Check whether a supervisor restarts it","cmd":"systemctl status {pid} 2>/dev/null || ps -o ppid= -p {pid}","risk":"safe","look":"If systemd or another supervisor owns it, killing the process just makes it come back. Stop the unit instead."},{"title":"Stop it through its supervisor","cmd":"sudo systemctl stop <unit>","risk":"state","look":"ps shows the process gone and not replaced by a new PID.","note":"Stops the service cleanly and prevents the automatic restart. The service is unavailable until started again, so on a production host arrange cover first. This is the correct approach; killing a supervised PID only triggers a restart."}],"causes":[{"id":"uninterruptible","cause":"The process is in D state on blocked I/O.","fix":"Signals cannot reach it. Fix the I/O: a hung NFS mount or a failing disk. It exits once the I/O completes or errors.","confirm":""},{"id":"zombie","cause":"It is already dead.","fix":"Zombies consume only a process table entry. Fix or restart the parent, which is failing to reap children.","confirm":""},{"id":"supervised","cause":"A supervisor restarts it.","fix":"Stop the unit rather than the process.","confirm":""},{"id":"nfs-hang","cause":"Blocked on an unreachable NFS server.","fix":"Restore the server, or force-unmount. This is the most common cause of permanent D state.","confirm":""},{"id":"kernel-thread","cause":"It is a kernel thread.","fix":"Kernel threads cannot be killed. Names in square brackets in ps are kernel threads.","confirm":""}],"verify":["The process is gone and does not return.","Whatever blocked it was resolved.","No new zombies accumulate."],"escalate":["Process state and wchan","What it is blocked on","Whether a supervisor owns it"]},{"id":"linux-hostname-resolution","tier":"guide","technology":"Linux","category":"Networking","title":"Hostname does not resolve on this machine","summary":"Name lookups fail locally even though the network is fine.","aliases":["cannot resolve hostname","name or service not known","dns not working linux","resolv.conf","getaddrinfo failed","temporary failure in name resolution"],"source":"https://man7.org/linux/man-pages/man5/nsswitch.conf.5.html","inputs":[{"key":"host","label":"Hostname","example":"api.internal.example.com"}],"steps":[{"title":"Test resolution through the full name service stack","cmd":"getent hosts {host}","risk":"safe","look":"getent follows nsswitch.conf exactly as applications do. dig and nslookup bypass it, which is why they can succeed while your app fails.","signals":[{"match":"^\\s*$","means":"Not resolved through the normal path.","goto":"step:2"},{"match":"\\d+\\.\\d+\\.\\d+\\.\\d+","means":"It resolves. The application's failure is something else.","goto":"cause:not-dns"}]},{"title":"Check the resolver configuration","cmd":"cat /etc/resolv.conf","risk":"safe","look":"The nameserver entries. A 127.0.0.53 entry means systemd-resolved is the local stub, and the real servers are one layer further in."},{"title":"Check the lookup order","cmd":"cat /etc/nsswitch.conf | grep hosts","risk":"safe","look":"The hosts line decides whether files, DNS or mDNS are consulted and in what order. A missing dns entry means DNS is never used at all."},{"title":"Query the nameserver directly","cmd":"dig @$(grep -m1 nameserver /etc/resolv.conf | awk '{print $2}') {host} +short","risk":"safe","look":"Whether the configured server can answer. An answer here with getent failing points at nsswitch rather than DNS."}],"causes":[{"id":"no-nameserver","cause":"resolv.conf has no usable nameserver.","fix":"Add one, or fix whatever manages the file. NetworkManager and systemd-resolved both rewrite it.","confirm":""},{"id":"resolved-stub","cause":"systemd-resolved is the stub and its upstreams are wrong.","fix":"Check resolvectl status for the real upstream servers.","confirm":""},{"id":"nsswitch-order","cause":"The hosts line omits dns.","fix":"Add it. Without it, only /etc/hosts is consulted.","confirm":""},{"id":"search-domain","cause":"A search domain rewrites the query.","fix":"Use a fully qualified name with a trailing dot to bypass the search list.","confirm":""},{"id":"firewall","cause":"UDP 53 is blocked.","fix":"Check egress. Some networks force DNS through a specific resolver.","confirm":""},{"id":"not-dns","cause":"Resolution works; the application fails for another reason.","fix":"Check its own configuration and any proxy settings.","confirm":""}],"verify":["getent resolves the name.","The application connects.","It survives a network restart."],"escalate":["Output of getent hosts","resolv.conf and the nsswitch hosts line","Whether dig against the configured server answers"]},{"id":"linux-user-cannot-login","tier":"guide","technology":"Linux","category":"Access","title":"User cannot log in","summary":"Authentication fails or the session closes immediately after a successful login.","aliases":["cannot login","account locked","login incorrect","connection closed by remote host","no shell","expired password"],"source":"https://man7.org/linux/man-pages/man1/chage.1.html","inputs":[{"key":"user","label":"User","example":"deploy"}],"steps":[{"title":"Check the account's status","cmd":"sudo passwd -S {user} && sudo chage -l {user}","risk":"safe","look":"Locked state and expiry dates. An expired account or password blocks login even with correct credentials.","signals":[{"match":"\\sL\\s","means":"The password is locked.","goto":"cause:locked"},{"match":"(?i)Account expires.*:\\s*\\w{3}\\s\\d","means":"An expiry date is set. Check whether it has passed.","goto":"cause:expired"}]},{"title":"Check the login shell","cmd":"getent passwd {user}","risk":"safe","look":"The last field. /sbin/nologin or /bin/false means authentication succeeds and the session immediately ends, which looks like a login failure.","signals":[{"match":"(?i)nologin|/bin/false","means":"The account has no interactive shell by design.","goto":"cause:no-shell"}]},{"title":"Read the authentication log","cmd":"sudo tail -30 /var/log/auth.log","risk":"safe","look":"The precise reason. PAM states whether it was the password, the account state or an access restriction."},{"title":"Check whether a lockout policy is blocking them","cmd":"sudo faillock --user {user} 2>/dev/null || sudo pam_tally2 -u {user} 2>/dev/null","risk":"safe","look":"Failed attempt counts. Repeated failures can lock an account for a period, and the message given to the user does not say so."}],"causes":[{"id":"locked","cause":"The password is locked.","fix":"passwd -u to unlock. Find out why it was locked first.","confirm":""},{"id":"expired","cause":"The account or password expired.","fix":"chage to extend. Password expiry policies catch service accounts routinely.","confirm":""},{"id":"no-shell","cause":"The shell is nologin.","fix":"Intentional for service accounts. Change it only if interactive access is genuinely needed.","confirm":""},{"id":"faillock","cause":"Too many failed attempts.","fix":"faillock --reset. Then find out what was retrying with a bad password.","confirm":""},{"id":"pam-restriction","cause":"access.conf or a PAM rule denies them.","fix":"Read auth.log. It names the module that denied.","confirm":""},{"id":"home-missing","cause":"The home directory does not exist.","fix":"Login can fail or behave oddly. Create it with the right ownership.","confirm":""}],"verify":["The user logs in.","The session stays open.","auth.log shows a clean accepted entry."],"escalate":["Output of passwd -S and chage -l","The login shell","Relevant auth.log lines"]},{"id":"linux-service-slow-start","tier":"guide","technology":"Linux","category":"systemd","title":"Service takes a very long time to start or stop","summary":"Boot or shutdown hangs on one unit, often for a fixed timeout.","aliases":["service slow","job running for","timeout stopping","boot slow","a stop job is running","systemd hangs"],"source":"https://man7.org/linux/man-pages/man5/systemd.service.5.html","inputs":[{"key":"unit","label":"Unit","example":"checkout-api.service"}],"steps":[{"title":"Find what is slow at boot","cmd":"systemd-analyze blame | head -10","risk":"safe","look":"Time taken per unit. One unit taking exactly ninety seconds is a timeout, not slow work.","signals":[{"match":"1min 30|90\\.\\d+s","means":"Exactly the default timeout. Something is waiting and failing rather than working.","goto":"cause:timeout-hit"}]},{"title":"Check the critical chain","cmd":"systemd-analyze critical-chain {unit}","risk":"safe","look":"What this unit waits for. A dependency that is itself slow accounts for most apparent slowness."},{"title":"Check the timeout settings","cmd":"systemctl show {unit} -p TimeoutStartUSec -p TimeoutStopUSec -p Type","risk":"safe","look":"Type notify with an app that never signals readiness always waits the full timeout, then is killed. That mismatch is the classic cause."},{"title":"Read what it was doing","cmd":"journalctl -u {unit} -b --no-pager | tail -40","risk":"safe","look":"The unit's own output during the slow period. Usually a network wait or a DNS lookup that eventually times out."}],"causes":[{"id":"timeout-hit","cause":"The unit hits its start or stop timeout.","fix":"Find what it waits for. Raising the timeout hides the problem rather than fixing it.","confirm":""},{"id":"type-mismatch","cause":"Type notify or forking but the app does not behave that way.","fix":"Use Type=simple for a foreground process. This is the most common systemd misconfiguration.","confirm":""},{"id":"network-wait","cause":"Waiting on network-online.target.","fix":"Only order after it if genuinely required. Most services can start and retry.","confirm":""},{"id":"dns-timeout","cause":"A DNS lookup at startup times out.","fix":"Fix resolution, or make the lookup lazy.","confirm":""},{"id":"no-sigterm-handler","cause":"The process ignores SIGTERM, so stop waits the full timeout.","fix":"Handle SIGTERM in the application.","confirm":""}],"verify":["The unit starts and stops promptly.","systemd-analyze blame shows no outlier.","The cause was fixed rather than the timeout raised."],"escalate":["systemd-analyze blame output","The critical chain","Unit Type and timeout settings"]},{"id":"linux-permission-denied-execute","tier":"guide","technology":"Linux","category":"Access","title":"Permission denied running a script or binary","summary":"The file exists and looks right but will not run.","aliases":["permission denied","cannot execute","bad interpreter","not executable","exec format error","command not found script"],"source":"https://man7.org/linux/man-pages/man1/chmod.1.html","inputs":[{"key":"file","label":"File","example":"/opt/app/deploy.sh"}],"steps":[{"title":"Read the exact error","cmd":"{file}","risk":"safe","look":"Permission denied, bad interpreter and not found are three different problems that all look like the script being broken.","signals":[{"match":"Permission denied","means":"The execute bit is missing, or the filesystem is mounted noexec.","goto":"cause:no-exec-bit"},{"match":"bad interpreter","means":"The shebang points at something that does not exist, often because of CRLF line endings.","goto":"cause:bad-shebang"},{"match":"cannot execute binary file","means":"Wrong architecture for this machine.","goto":"cause:wrong-arch"}]},{"title":"Check the permissions and ownership","cmd":"ls -l {file}","risk":"safe","look":"The x bits and the owner. A file owned by root with 700 is unrunnable by anyone else, which is easy to miss."},{"title":"Check the interpreter line","cmd":"head -1 {file} | cat -A","risk":"safe","look":"cat -A reveals a trailing ^M, which is a Windows CRLF ending. That makes the interpreter path invalid and produces bad interpreter."},{"title":"Check whether the filesystem forbids execution","cmd":"findmnt -T {file} -o TARGET,OPTIONS","risk":"safe","look":"A noexec mount option blocks execution regardless of permissions. Common on /tmp and on some hardened mounts."}],"causes":[{"id":"no-exec-bit","cause":"The execute bit is not set.","fix":"chmod +x. If it came from a Windows checkout, set it in Git too with update-index --chmod=+x.","confirm":""},{"id":"bad-shebang","cause":"The shebang is invalid, usually CRLF endings.","fix":"Convert to LF. Add the pattern to .gitattributes so it does not recur.","confirm":""},{"id":"wrong-arch","cause":"The binary is for a different architecture.","fix":"Get the right build. Check with the file command.","confirm":""},{"id":"noexec-mount","cause":"The filesystem is mounted noexec.","fix":"Move the file elsewhere. Remounting is usually the wrong answer.","confirm":""},{"id":"not-owner","cause":"The permissions exclude your user.","fix":"Check ownership and group. Adding yourself to a group needs a new session.","confirm":""}],"verify":["The script runs.","It runs for the intended user.","The permission is recorded in Git so it survives a fresh checkout."],"escalate":["The exact error","ls -l output","The shebang shown with cat -A","Mount options"]},{"id":"linux-log-not-rotating","tier":"guide","technology":"Linux","category":"Storage","title":"Log files grow until the disk fills","summary":"Rotation is configured but not happening, or not happening often enough.","aliases":["logs not rotating","logrotate not working","log file huge","disk full logs","logrotate","journal too big"],"source":"https://man7.org/linux/man-pages/man8/logrotate.8.html","inputs":[{"key":"logfile","label":"Log file","example":"/var/log/app/app.log"}],"steps":[{"title":"Check the file size and rotation state","cmd":"ls -lh {logfile}* && cat /var/lib/logrotate/status 2>/dev/null | grep app","risk":"safe","look":"Whether rotated copies exist and when rotation last ran for this file. No entry means logrotate has never processed it."},{"title":"Test the configuration without changing anything","cmd":"sudo logrotate -d /etc/logrotate.conf 2>&1 | grep -A5 {logfile}","risk":"safe","look":"Debug mode shows what logrotate would do and why it would skip. This is the fastest way to find the problem.","signals":[{"match":"(?:does not need rotating)","means":"Conditions are not met yet. Check size and time settings.","goto":"cause:conditions-not-met"},{"match":"(?:skipping|error)","means":"A configuration or permission problem prevents rotation.","goto":"cause:config-error"}]},{"title":"Check the timer is running","cmd":"systemctl status logrotate.timer","risk":"safe","look":"logrotate runs from a timer. A disabled timer means it never runs at all, whatever the config says."},{"title":"Check the journal's own size separately","cmd":"journalctl --disk-usage","risk":"safe","look":"The systemd journal is not managed by logrotate. It has its own size limits in journald.conf and is a common cause of a full /var."}],"causes":[{"id":"conditions-not-met","cause":"The size or time threshold is not reached.","fix":"Lower it, or add a size directive if only daily is set.","confirm":""},{"id":"timer-disabled","cause":"The logrotate timer is not running.","fix":"Enable and start it.","confirm":""},{"id":"config-error","cause":"A configuration error stops rotation.","fix":"The debug output names it. Wrong permissions on the directory are common.","confirm":""},{"id":"app-holds-handle","cause":"The application keeps writing to the rotated file.","fix":"Use copytruncate, or send the app a signal in postrotate so it reopens.","confirm":""},{"id":"journal-unbounded","cause":"The systemd journal has no size cap.","fix":"Set SystemMaxUse in journald.conf.","confirm":""},{"id":"should-be-stdout","cause":"The application writes its own log files.","fix":"Log to stdout and let the platform handle it. Simpler everywhere.","confirm":""}],"verify":["Old logs are rotated and compressed.","Disk usage is stable.","The application keeps writing after rotation."],"escalate":["File sizes and rotation state","logrotate debug output","Whether the timer is active"]},{"id":"linux-swap-thrashing","tier":"guide","technology":"Linux","category":"Memory","title":"System is slow and swapping heavily","summary":"Everything crawls. Memory pressure is pushing active pages to disk.","aliases":["swapping","thrashing","system slow memory","high swap usage","swap full","si so high"],"source":"https://man7.org/linux/man-pages/man8/vmstat.8.html","inputs":[],"steps":[{"title":"Check swap activity rather than swap usage","cmd":"vmstat 2 5","risk":"safe","look":"The si and so columns. Sustained non-zero values mean active thrashing. Swap merely being used is normal and harmless.","signals":[{"match":"\\s[1-9]\\d*\\s+[1-9]\\d*\\s","means":"Sustained swap in and out. This is thrashing and it is the cause of the slowness.","goto":"cause:thrashing"}]},{"title":"See the memory picture","cmd":"free -h","risk":"safe","look":"available, not free. Low available with high swap used means genuine pressure rather than the kernel being efficient."},{"title":"Find which processes are swapped","cmd":"for p in /proc/[0-9]*; do awk '/VmSwap/{print $2, FILENAME}' $p/status 2>/dev/null; done | sort -rn | head -10","risk":"safe","look":"Swap usage per process. The biggest one is usually the cause rather than the victim."},{"title":"Check the swappiness setting","cmd":"sysctl vm.swappiness","risk":"safe","look":"Higher values swap more eagerly. On a server with enough RAM, a low value is usually preferable, but it is not a fix for genuine shortage."}],"causes":[{"id":"thrashing","cause":"Active pages are being swapped continuously.","fix":"Reduce memory demand or add RAM. Nothing else resolves genuine thrashing.","confirm":""},{"id":"one-process","cause":"One process dominates memory.","fix":"Limit it with a cgroup or fix the leak.","confirm":""},{"id":"swappiness-high","cause":"The kernel swaps too eagerly.","fix":"Lower vm.swappiness. Helps only when there is enough RAM overall.","confirm":""},{"id":"no-swap-worse","cause":"Removing swap seems tempting.","fix":"Without swap the OOM killer acts instead. Swap gives the kernel room to reclaim.","confirm":""},{"id":"normal-usage","cause":"Swap is used but si and so are zero.","fix":"Nothing is wrong. Idle pages in swap are the kernel doing its job.","confirm":""}],"verify":["si and so return to zero under normal load.","available memory is healthy.","Response times are back to baseline."],"escalate":["vmstat output over a minute","free -h","Per-process swap usage"]},{"id":"linux-cannot-bind-privileged-port","tier":"guide","technology":"Linux","category":"Networking","title":"Cannot bind to a port below 1024","summary":"A service fails to start on port 80 or 443 as a non-root user.","aliases":["permission denied port 80","cannot bind privileged port","port 443 permission","bind capability","low port"],"source":"https://man7.org/linux/man-pages/man7/capabilities.7.html","inputs":[{"key":"port","label":"Port","example":"80"}],"steps":[{"title":"Confirm the error is a permission problem","cmd":"ss -tlnp 'sport = :{port}'","risk":"safe","look":"Nothing listening plus a permission denied on start means the privileged port restriction, not a conflict.","signals":[{"match":"users:\\(\\(","means":"Something already holds it. That is a conflict, not a permission problem.","goto":"cause:already-bound"}]},{"title":"Check what user the service runs as","cmd":"systemctl show <unit> -p User -p AmbientCapabilities","risk":"safe","look":"A non-root user needs CAP_NET_BIND_SERVICE to bind below 1024. Without it the bind always fails."},{"title":"Check the kernel's unprivileged port floor","cmd":"sysctl net.ipv4.ip_unprivileged_port_start","risk":"safe","look":"The default is 1024. Lowering it is possible but weakens a long-standing security boundary."},{"title":"Grant the capability to the unit","cmd":"sudo systemctl edit <unit>","risk":"state","look":"The service starts and ss shows it listening on the port.","note":"Adds AmbientCapabilities=CAP_NET_BIND_SERVICE to the unit. This is far narrower than running as root, but it does grant the process the ability to bind any low port for its lifetime. Requires a daemon-reload and a restart, so the service goes down briefly."}],"causes":[{"id":"no-capability","cause":"The process lacks CAP_NET_BIND_SERVICE.","fix":"Add it to the unit. Much safer than running the whole service as root.","confirm":""},{"id":"already-bound","cause":"Another process holds the port.","fix":"Follow the port-in-use runbook.","confirm":""},{"id":"should-proxy","cause":"The application binds low ports directly.","fix":"Put a reverse proxy in front and let the app use a high port.","confirm":""},{"id":"container-context","cause":"Running in a container without the capability.","fix":"Add the capability to the container, or publish a high port and map it.","confirm":""}],"verify":["The service binds the port.","It runs as a non-root user.","The grant is the narrowest that works."],"escalate":["The bind error","Unit User and capabilities","Whether anything else holds the port"]},{"id":"linux-nfs-hang","tier":"guide","technology":"Linux","category":"Storage","title":"Commands hang on an NFS mount","summary":"ls or df hangs forever and cannot be interrupted.","aliases":["nfs hang","df hangs","stale file handle","nfs server not responding","mount hangs","uninterruptible nfs"],"source":"https://man7.org/linux/man-pages/man5/nfs.5.html","inputs":[{"key":"mount","label":"Mount point","example":"/mnt/shared"}],"steps":[{"title":"Check which mounts exist without touching them","cmd":"cat /proc/mounts | grep nfs","risk":"safe","look":"Reading /proc/mounts does not touch the server, so it will not hang the way df does."},{"title":"Check the kernel log","cmd":"sudo dmesg -T | grep -i nfs | tail -15","risk":"safe","look":"The kernel reports server timeouts here. 'server not responding' confirms the server rather than the client.","signals":[{"match":"not responding","means":"The NFS server is unreachable. The client is behaving correctly by waiting.","goto":"cause:server-down"},{"match":"Stale file handle","means":"The exported object changed on the server.","goto":"cause:stale-handle"}]},{"title":"Test whether the server answers at all","cmd":"rpcinfo -t <server> nfs 2>&1 | head -3","risk":"safe","look":"Whether the server responds. This does not touch the hung mount, so it is safe to run."},{"title":"Force-unmount the dead mount","cmd":"sudo umount -f -l {mount}","risk":"destructive","look":"The mount is gone from /proc/mounts and commands stop hanging.","note":"Detaches the mount forcibly and lazily. Any process with an open file there gets an I/O error, and unwritten data is lost. Processes already stuck in uninterruptible sleep may not recover until reboot. Identify what is using the mount with lsof first if you can."}],"causes":[{"id":"server-down","cause":"The NFS server is unreachable.","fix":"Restore it. A hard mount waits indefinitely by design, which is why nothing times out.","confirm":""},{"id":"hard-mount","cause":"Mounted hard with no timeout.","fix":"Consider soft with a timeout for non-critical mounts. Hard is safer for data but hangs on failure.","confirm":""},{"id":"stale-handle","cause":"The exported filesystem changed on the server.","fix":"Unmount and remount. The handle no longer refers to anything.","confirm":""},{"id":"network-partition","cause":"The path to the server is broken.","fix":"Check routing and firewall rather than the NFS configuration.","confirm":""},{"id":"processes-stuck","cause":"Processes are in uninterruptible sleep.","fix":"They cannot be killed. They exit once the I/O completes or errors.","confirm":""}],"verify":["Commands on the mount return.","No processes remain in D state.","The mount options suit how critical the data is."],"escalate":["Relevant dmesg lines","Whether the server responds to rpcinfo","Which processes were stuck"]},{"id":"linux-locale-errors","tier":"guide","technology":"Linux","category":"Configuration","title":"Locale warnings on every command","summary":"Constant setlocale warnings, and sometimes commands producing wrong sort order or encoding.","aliases":["setlocale","cannot set locale","LC_ALL","locale not supported","perl locale warning","encoding wrong"],"source":"https://man7.org/linux/man-pages/man1/locale.1.html","inputs":[],"steps":[{"title":"See the current locale settings","cmd":"locale","risk":"safe","look":"Any variable set to a locale not generated on the system produces the warning on every command.","signals":[{"match":"Cannot set LC_","means":"A requested locale is not available on this machine.","goto":"cause:not-generated"}]},{"title":"List what is actually available","cmd":"locale -a | head -20","risk":"safe","look":"Only these can be used. Minimal container images often ship with C and POSIX only."},{"title":"Check whether SSH is forwarding your local settings","cmd":"grep -i sendenv /etc/ssh/ssh_config","risk":"safe","look":"SSH forwards LANG and LC_* by default, so your laptop's locale is sent to a server that may not have it. That is the most common cause."},{"title":"Generate the missing locale","cmd":"sudo locale-gen en_US.UTF-8 && sudo update-locale LANG=en_US.UTF-8","risk":"state","look":"locale runs without warnings and the variables show the new value.","note":"Generates the locale and changes the system-wide default. Existing sessions keep their old settings until they reconnect. Changing the default locale can alter sort order and number formatting for scripts that relied on the previous value."}],"causes":[{"id":"not-generated","cause":"The requested locale is not generated.","fix":"Generate it, or set LANG to something available such as C.UTF-8.","confirm":""},{"id":"ssh-forwarded","cause":"SSH forwards your client locale.","fix":"Generate it on the server, or stop forwarding LC_* in your client config.","confirm":""},{"id":"minimal-image","cause":"The container image has no locales.","fix":"Install locales and generate one, or use C.UTF-8 which needs no generation.","confirm":""},{"id":"affects-sorting","cause":"Scripts depend on sort order.","fix":"Set LC_ALL=C explicitly in scripts so behaviour does not vary by environment.","confirm":""}],"verify":["No locale warnings.","Encoding and sort order behave as expected.","Scripts pin LC_ALL where it matters."],"escalate":["Output of locale","Which locales are available","Whether SSH forwards the setting"]},{"id":"linux-cannot-resolve-after-vpn","tier":"guide","technology":"Linux","category":"Networking","title":"DNS breaks after connecting a VPN","summary":"Internal names fail, or everything fails, once the VPN comes up.","aliases":["vpn dns broken","cannot resolve after vpn","split dns","resolvectl","vpn breaks internet","internal dns vpn"],"source":"https://www.freedesktop.org/software/systemd/man/resolvectl.html","inputs":[{"key":"host","label":"Hostname","example":"api.internal.example.com"}],"steps":[{"title":"See which resolver handles which domain","cmd":"resolvectl status","risk":"safe","look":"Per-interface DNS servers and domain routing. Split DNS means different domains resolve through different links.","signals":[{"match":"DNS Domain: ~","means":"Split DNS is configured. Only listed domains go through the VPN.","goto":"cause:split-dns"},{"match":"Current DNS Server:","means":"One resolver handles everything. Internal names may not be reachable through it.","goto":"cause:no-split"}]},{"title":"Test which link answers","cmd":"resolvectl query {host}","risk":"safe","look":"Names the interface that answered. That tells you whether the query went through the VPN or around it."},{"title":"Check the VPN interface has a domain route","cmd":"resolvectl domain","risk":"safe","look":"The VPN link needs the internal domain listed, or queries for it never reach the internal resolver."},{"title":"Check for a stale resolv.conf","cmd":"ls -la /etc/resolv.conf","risk":"safe","look":"It should be a symlink to the stub resolver. A plain file means something overwrote it and systemd-resolved is being bypassed."}],"causes":[{"id":"split-dns","cause":"Split DNS routes only some domains via the VPN.","fix":"Add the internal domain to the VPN link with resolvectl domain.","confirm":""},{"id":"no-split","cause":"All queries go to one resolver.","fix":"If it is the VPN resolver, external names may fail; if it is the local one, internal names fail.","confirm":""},{"id":"resolv-overwritten","cause":"resolv.conf was replaced by a plain file.","fix":"Restore the symlink to the stub resolver.","confirm":""},{"id":"vpn-client-config","cause":"The VPN client does not push DNS settings.","fix":"Configure them in the client, not by editing resolv.conf which gets rewritten.","confirm":""},{"id":"dns-leak-protection","cause":"The VPN blocks outside resolvers.","fix":"Intentional. Use the VPN's own resolver for everything.","confirm":""}],"verify":["Both internal and external names resolve.","It survives a VPN reconnect.","The configuration is in the VPN client, not a hand-edited file."],"escalate":["Output of resolvectl status","Which link answered the query","Whether resolv.conf is the expected symlink"]},{"id":"linux-ssh-key-ignored","tier":"guide","technology":"Linux","category":"Access","title":"SSH ignores the key you specified","summary":"Even with -i the wrong key is offered, or too many keys are tried.","aliases":["too many authentication failures","wrong key offered","identitiesonly","ssh tries wrong key","key ignored"],"source":"https://man.openbsd.org/ssh_config","inputs":[{"key":"host","label":"Host","example":"bastion.example.com"}],"steps":[{"title":"See which keys are offered and in what order","cmd":"ssh -v {host} 2>&1 | findstr /C:\"Offering\"","risk":"safe","look":"Every key the client tries. Servers usually disconnect after six attempts, so a key later in the list is never reached.","signals":[{"match":"Too many authentication failures","means":"The server cut the connection before reaching your key.","goto":"cause:too-many-keys"},{"match":"Offering public key.*id_rsa","means":"A default key is offered before the one you specified.","goto":"cause:agent-first"}]},{"title":"Check the resolved configuration","cmd":"ssh -G {host} | findstr /C:\"identityfile\" /C:\"identitiesonly\"","risk":"safe","look":"Without IdentitiesOnly yes, the agent's keys are offered in addition to -i, and often before it."},{"title":"Check what the agent holds","cmd":"ssh-add -l","risk":"safe","look":"Every loaded key is offered. A crowded agent is the usual cause of too-many-failures."},{"title":"Force only the specified key","cmd":"ssh -o IdentitiesOnly=yes -i ~/.ssh/mykey {host}","risk":"safe","look":"Offers exactly one key. If this works, the fix belongs in your ssh config for that host."}],"causes":[{"id":"too-many-keys","cause":"The agent offers more keys than the server allows attempts.","fix":"Set IdentitiesOnly yes per host in your config.","confirm":""},{"id":"agent-first","cause":"Agent keys take priority over -i.","fix":"IdentitiesOnly yes makes -i authoritative.","confirm":""},{"id":"wrong-key-config","cause":"The host config points at a different key.","fix":"Check ssh -G output; a wildcard Host block may be matching.","confirm":""},{"id":"key-not-authorised","cause":"The right key is offered and refused.","fix":"A server-side problem. Follow the SSH denied runbook.","confirm":""}],"verify":["The connection succeeds with the intended key.","It works without flags after fixing the config."],"escalate":["Which keys are offered","The resolved identityfile","Agent contents"]},{"id":"linux-systemd-unit-not-found","tier":"guide","technology":"Linux","category":"systemd","title":"Unit not found after creating it","summary":"systemctl says the unit does not exist even though the file is there.","aliases":["unit not found","no such unit","unit file missing","daemon-reload","masked unit","failed to start not found"],"source":"https://man7.org/linux/man-pages/man1/systemctl.1.html","inputs":[{"key":"unit","label":"Unit","example":"checkout-api.service"}],"steps":[{"title":"Ask systemd where it thinks the unit is","cmd":"systemctl cat {unit}","risk":"safe","look":"The resolved file path. An error means systemd has not seen it, whatever exists on disk.","signals":[{"match":"No files found","means":"systemd has no record of it. Usually a missing reload or wrong directory.","goto":"cause:not-reloaded"},{"match":"masked","means":"The unit is masked, which makes it unstartable by design.","goto":"cause:masked"}]},{"title":"Check the file location and name","cmd":"dir /etc/systemd/system/","risk":"safe","look":"The filename must end in .service exactly, and the directory matters. A stray .txt extension is invisible to systemd."},{"title":"Reload the unit files","cmd":"sudo systemctl daemon-reload","risk":"state","look":"No output means success. systemctl cat should now find the unit.","note":"Re-reads every unit file on the system. Running services are not restarted and nothing is interrupted. Skipping this after any edit is the single most common systemd mistake."},{"title":"Check for syntax errors","cmd":"systemd-analyze verify /etc/systemd/system/{unit}","risk":"safe","look":"A malformed unit may be partially ignored, which presents as a confusing not-found."}],"causes":[{"id":"not-reloaded","cause":"daemon-reload was not run after creating the file.","fix":"Run it. systemd caches unit definitions.","confirm":""},{"id":"wrong-extension","cause":"The filename does not end in .service.","fix":"Rename it. Hidden extensions on Windows-edited files cause this.","confirm":""},{"id":"wrong-directory","cause":"The file is in the wrong location.","fix":"/etc/systemd/system for local units.","confirm":""},{"id":"masked","cause":"The unit is masked.","fix":"systemctl unmask. Masking links it to /dev/null deliberately.","confirm":""},{"id":"bad-permissions","cause":"The file is not readable by root.","fix":"chmod 644.","confirm":""}],"verify":["systemctl cat finds the unit.","It starts and enables.","It survives a reboot."],"escalate":["Output of systemctl cat","The file path and exact name","Whether daemon-reload was run"]},{"id":"linux-firewall-blocking","tier":"guide","technology":"Linux","category":"Networking","title":"Connections refused by the local firewall","summary":"A service is listening but external connections do not arrive.","aliases":["firewall blocking","ufw","iptables","firewalld","port blocked","connection refused firewall","nftables"],"source":"https://man7.org/linux/man-pages/man8/iptables.8.html","inputs":[{"key":"port","label":"Port","example":"8080"}],"steps":[{"title":"Confirm the service is listening","cmd":"ss -tlnp 'sport = :{port}'","risk":"safe","look":"It must listen on 0.0.0.0 or the external address. Bound to 127.0.0.1 it is unreachable regardless of firewall.","signals":[{"match":"127\\.0\\.0\\.1:","means":"Listening on loopback only. The firewall is not the problem.","goto":"cause:bound-loopback"},{"match":"0\\.0\\.0\\.0:","means":"Listening on all interfaces. Now check the firewall.","goto":"step:2"}]},{"title":"Check which firewall is active","cmd":"sudo ufw status 2>/dev/null; sudo firewall-cmd --state 2>/dev/null; sudo nft list ruleset 2>/dev/null | head -20","risk":"safe","look":"Only one is usually active. Rules added to an inactive one have no effect, which wastes a lot of time."},{"title":"Check whether the port is allowed","cmd":"sudo iptables -L INPUT -n --line-numbers | findstr {port}","risk":"safe","look":"Rule order matters. A DROP before your ACCEPT means the ACCEPT is never reached."},{"title":"Test from another machine","cmd":"ss -tn state established","risk":"safe","look":"Whether connections arrive at all. Nothing arriving means it is blocked before reaching the host, so check the cloud security group too."}],"causes":[{"id":"bound-loopback","cause":"The service listens on loopback only.","fix":"Bind 0.0.0.0. No firewall change will help otherwise.","confirm":""},{"id":"not-allowed","cause":"No rule permits the port.","fix":"Add one to whichever firewall is actually active.","confirm":""},{"id":"rule-order","cause":"A DROP precedes the ACCEPT.","fix":"Insert the ACCEPT earlier. Rules are evaluated in order.","confirm":""},{"id":"wrong-firewall","cause":"Rules added to an inactive firewall.","fix":"Check which is running first.","confirm":""},{"id":"cloud-sg","cause":"The cloud security group blocks it before the host.","fix":"Open it there too. Both layers must permit.","confirm":""}],"verify":["Connections succeed from outside.","The rule persists across reboot.","Both host and cloud layers allow it."],"escalate":["What the service binds to","Which firewall is active","The relevant rules in order"]},{"id":"linux-inode-exhaustion","tier":"guide","technology":"Linux","category":"Storage","title":"No space left but the disk has free space","summary":"Writes fail with no space even though df shows capacity available.","aliases":["no space inodes","inode exhaustion","df -i full","cannot create file space available","too many files"],"source":"https://man7.org/linux/man-pages/man1/df.1.html","inputs":[{"key":"path","label":"Path","example":"/var"}],"steps":[{"title":"Compare space against inodes","cmd":"df -h {path} && df -i {path}","risk":"safe","look":"IUse% at 100 with space free is inode exhaustion. The error message is identical to a full disk but the fix is completely different.","signals":[{"match":"100%","means":"One of the two is exhausted. Check which column.","goto":"cause:inodes-full"}]},{"title":"Find directories with the most entries","cmd":"find {path} -xdev -type d -exec sh -c 'echo $(ls -A \"$1\" | wc -l) \"$1\"' _ {} \\; 2>/dev/null | sort -rn | head -10","risk":"safe","look":"Directories with hundreds of thousands of small files. Session, cache and mail spool directories are the usual culprits."},{"title":"Check for a runaway producer","cmd":"ls -lt {path} | head -20","risk":"safe","look":"Recently created files. If they are still appearing, stop the producer before cleaning up."},{"title":"Remove the accumulated files","cmd":"find {path}/cache -type f -mtime +7 -delete","risk":"destructive","look":"df -i shows IUse% dropping. Then fix whatever created the
