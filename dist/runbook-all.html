ted history is untouched, but unsaved resolution work is lost. Use --skip instead if you want to abandon only this commit in a multi-commit pick."}],"causes":[{"id":"context-differs","cause":"The surrounding code differs from the source branch.","fix":"Resolve to the intended final state. Read the original commit to understand the intent.","confirm":""},{"id":"missing-file","cause":"The file does not exist on this branch.","fix":"The change may need adapting rather than picking. Consider whether it applies at all.","confirm":""},{"id":"already-applied","cause":"The change is already here.","fix":"Skip it. git cherry-pick --skip moves on in a multi-commit pick.","confirm":""},{"id":"needs-dependency","cause":"The commit depends on an earlier one not present.","fix":"Pick the dependency first, or pick the range.","confirm":""},{"id":"should-merge","cause":"You are picking many commits.","fix":"A merge or rebase is usually better than a long sequence of cherry-picks.","confirm":""}],"verify":["The cherry-pick completes.","The change works on this branch, not just compiles.","Tests pass."],"escalate":["Which files conflicted","The original commit's diff","Whether the change is already present"]},{"id":"git-wrong-branch-work","tier":"guide","technology":"Git","category":"Branches","title":"I did my work on the wrong branch","summary":"Changes are on main or another branch and need moving, committed or not.","aliases":["wrong branch","work on wrong branch","move changes branch","committed to wrong branch","should have branched"],"source":"https://git-scm.com/docs/git-switch","inputs":[{"key":"branch","label":"Branch it should be on","example":"feature/checkout-retry"}],"steps":[{"title":"Check whether the work is committed","cmd":"git status -sb && git log --oneline -3","risk":"safe","look":"Uncommitted changes move trivially. Committed ones need the branch pointer moved instead.","signals":[{"match":"^ M|^M |^\\?\\?","means":"Uncommitted. Switching branches carries them across.","goto":"cause:uncommitted"},{"match":"ahead \\d+","means":"Committed but not pushed. Move the commits.","goto":"cause:committed-local"}]},{"title":"For uncommitted work, just switch","cmd":"git switch -c {branch}","risk":"safe","look":"Uncommitted changes follow you to the new branch. Nothing is lost and no history changes."},{"title":"For committed work, create the branch here first","cmd":"git branch {branch}","risk":"safe","look":"The branch now points at your commits. They are safe regardless of what you do to the original branch next."},{"title":"Reset the original branch back","cmd":"git reset --hard origin/main","risk":"destructive","look":"The current branch matches the remote. Your work is on {branch}.","note":"Discards every commit and every uncommitted change on the current branch beyond origin/main. This is only safe because the previous step created {branch} at the current commit, so the work survives there. Run git log {branch} and confirm your commits are listed before running this."}],"causes":[{"id":"uncommitted","cause":"The work is not committed.","fix":"git switch -c carries it across. Simplest case.","confirm":""},{"id":"committed-local","cause":"Committed but not pushed.","fix":"Branch here, then reset the original. Nothing is shared yet so nothing breaks.","confirm":""},{"id":"already-pushed","cause":"The commits are on the remote.","fix":"Do not reset and force-push a shared branch. Use git revert on the original and apply the work properly on a branch.","confirm":""},{"id":"partial","cause":"Only some changes belong on the branch.","fix":"Use git stash push with specific paths, or commit selectively with git add -p.","confirm":""}],"verify":["The work is on the intended branch.","The original branch matches its remote.","Nothing shared was rewritten."],"escalate":["git status -sb","git log on both branches","Whether the commits were pushed"]},{"id":"git-reverting-a-merge","tier":"guide","technology":"Git","category":"History & Undo","title":"I need to undo a merge","summary":"A merge introduced a problem and must be reversed. Merges revert differently from ordinary commits.","aliases":["revert merge","undo merge","mainline","commit is a merge but no -m option","rollback merge","bad merge"],"source":"https://git-scm.com/docs/git-revert","inputs":[{"key":"sha","label":"Merge commit","example":"a1b2c3d"}],"steps":[{"title":"Confirm it is a merge and find its parents","cmd":"git show --no-patch --format='%h parents: %p' {sha}","risk":"safe","look":"Two parent hashes means a merge. Reverting one requires saying which side to keep, and that is what -m specifies.","signals":[{"match":"parents: \\w+ \\w+","means":"A merge commit with two parents. Reverting needs -m.","goto":"cause:needs-mainline"}]},{"title":"Check whether it has been pushed","cmd":"git branch -r --contains {sha}","risk":"safe","look":"Any remote branch listed means others may have it. That rules out rewriting history and points at revert instead."},{"title":"Revert keeping the first parent","cmd":"git revert -m 1 {sha}","risk":"state","look":"A new revert commit. The merged changes are gone from the working tree.","note":"Creates a new commit undoing the merged changes. History is not rewritten, which makes this safe for shared branches. Be aware that re-merging the same branch later will not reintroduce those changes, because Git considers them already merged — you must revert the revert first."},{"title":"Confirm the result","cmd":"git log --oneline -5 && git status","risk":"safe","look":"The revert commit on top and a clean tree. Run the tests; a reverted merge can leave a half-consistent state if other work depended on it."}],"causes":[{"id":"needs-mainline","cause":"Reverting a merge needs -m.","fix":"-m 1 keeps the branch you merged into, which is what you want almost always.","confirm":""},{"id":"not-pushed","cause":"The merge is local only.","fix":"git reset --hard to the commit before it is cleaner than a revert. No history is shared yet.","confirm":""},{"id":"remerge-problem","cause":"You reverted and now cannot re-merge.","fix":"Revert the revert. Git sees the branch as already merged otherwise.","confirm":""},{"id":"wrong-parent","cause":"Reverted with the wrong -m value.","fix":"Revert that revert and redo with the correct parent.","confirm":""},{"id":"dependent-work","cause":"Later commits depend on the merged code.","fix":"Reverting will break them. Fix forward instead.","confirm":""}],"verify":["The problem is gone.","Tests pass.","The path to re-merging later is understood."],"escalate":["The merge commit's parents","Whether it is on any remote","Test results after the revert"]},{"id":"git-bisect-find-bad-commit","tier":"guide","technology":"Git","category":"Debugging","title":"Something broke and I do not know which commit did it","summary":"A bug appeared somewhere in a range of commits. Bisect finds it in a handful of steps.","aliases":["which commit broke","bisect","find bad commit","regression","worked before","when did this break"],"source":"https://git-scm.com/docs/git-bisect","inputs":[{"key":"good","label":"A commit known good","example":"v1.3.0"},{"key":"bad","label":"A commit known bad","example":"HEAD"}],"steps":[{"title":"Confirm the endpoints really are good and bad","cmd":"git log --oneline {good}..{bad} | measure-object -line","risk":"safe","look":"How many commits are in the range. Bisect needs about log2 of that many tests, so even hundreds of commits take under ten steps."},{"title":"Start the bisect","cmd":"git bisect start {bad} {good}","risk":"state","look":"Git reports roughly how many steps remain and checks out a middle commit.","note":"Checks out a commit partway through the range, leaving you in detached HEAD. Any uncommitted work is in the way and should be committed or stashed first. git bisect reset returns you to where you started."},{"title":"Test and mark each checkout","cmd":"git bisect good","risk":"safe","look":"Use good or bad after testing rebase. That determines whether you abort or undo a finished one.","signals":[{"match":"rebase in progress","means":"Still mid-rebase. Abort returns you cleanly.","goto":"cause:in-progress"},{"match":"^\\s*$","means":"No rebase in progress. A finished rebase is undone through the reflog.","goto":"cause:already-finished"}]},{"title":"Abort an in-progress rebase","cmd":"git rebase --abort","risk":"safe","look":"Returns to exactly where you started. Nothing committed is lost, only the conflict resolution you had done."},{"title":"For a finished rebase, find where you were","cmd":"git reflog -20","risk":"safe","look":"The entry just before the rebase started, usually marked rebase (start). That SHA is your pre-rebase state."},{"title":"Reset back to the pre-rebase commit","cmd":"git reset --hard <sha-before-rebase>","risk":"destructive","look":"git log matches what you had before the rebase.","note":"Discards the rebased commits and any uncommitted changes, returning the branch to its pre-rebase state. The rebased commits remain in the reflog for about ninety days, so this is recoverable, but anything uncommitted right now is not. Verify the SHA with git show before running it."}],"causes":[{"id":"in-progress","cause":"A rebase is in progress.","fix":"git rebase --abort. Clean and complete.","confirm":""},{"id":"already-finished","cause":"The rebase completed and the result is wrong.","fix":"Find the pre-rebase SHA in the reflog and reset to it.","confirm":""},{"id":"too-many-conflicts","cause":"Every commit conflicts.","fix":"You are probably rebasing onto the wrong base. Check the target branch.","confirm":""},{"id":"shared-branch","cause":"The branch was rebased after being pushed.","fix":"Everyone who pulled now has divergent history. Coordinate before force-pushing.","confirm":""},{"id":"should-merge","cause":"Rebasing a long-lived branch.","fix":"Merge instead. Rebase suits short private branches.","confirm":""}],"verify":["The branch is in the state you intended.","git status is clean.","No shared history was rewritten without agreement."],"escalate":["Whether a rebase is in progress","Reflog around the rebase","What the branch looked like before"]},{"id":"git-large-clone-slow","tier":"guide","technology":"Git","category":"Performance","title":"Cloning the repository takes forever","summary":"A fresh clone takes many minutes, which slows onboarding and every CI run.","aliases":["clone slow","large repo clone","shallow clone","partial clone","clone takes forever","ci clone slow"],"source":"https://git-scm.com/docs/git-clone","inputs":[{"key":"repo","label":"Repository","example":"https://github.com/org/infra.git"}],"steps":[{"title":"Check what makes it large","cmd":"git clone --filter=blob:none --no-checkout {repo} probe && cd probe && git count-objects -vH","risk":"safe","look":"Clones metadata only, so it is fast. size-pack tells you whether history or the working tree dominates."},{"title":"Check history depth","cmd":"git rev-list --count HEAD","risk":"safe","look":"Commit count. Tens of thousands with large blobs is what makes clones slow, not the current file count."},{"title":"Use a shallow clone for CI","cmd":"git clone --depth 1 {repo}","risk":"safe","look":"Only the latest commit. Dramatically faster, and sufficient for almost every build. Note that it cannot do history-dependent operations."},{"title":"Use a partial clone for development","cmd":"git clone --filter=blob:none {repo}","risk":"safe","look":"Full history without file contents; blobs are fetched on demand. Better than shallow when you still need to browse history."}],"causes":[{"id":"deep-history","cause":"Many commits with large objects.","fix":"Use --depth 1 in CI and --filter=blob:none locally.","confirm":""},{"id":"large-binaries","cause":"Binaries are in history.","fix":"They cost every clone permanently. Move future ones to LFS.","confirm":""},{"id":"no-ci-optimisation","cause":"CI does a full clone every run.","fix":"Most CI systems support shallow fetch. Enable it.","confirm":""},{"id":"many-refs","cause":"Thousands of branches and tags.","fix":"Prune merged branches. Every ref is negotiated on clone.","confirm":""},{"id":"network","cause":"The network is the bottleneck.","fix":"Use a mirror closer to the runners.","confirm":""}],"verify":["Clone time is acceptable.","CI uses shallow fetch.","New large binaries go to LFS."],"escalate":["Output of count-objects","Commit count","Whether CI clones shallow"]},{"id":"git-hooks-not-running","tier":"guide","technology":"Git","category":"Working Tree","title":"Git hooks do not run","summary":"A pre-commit hook is configured but commits go through unchecked.","aliases":["hooks not running","pre-commit not working","husky not working","hook ignored","core.hookspath","git hook skipped"],"source":"https://git-scm.com/docs/githooks","inputs":[],"steps":[{"title":"Check where Git looks for hooks","cmd":"git config core.hooksPath && dir .git\\hooks","risk":"safe","look":"If core.hooksPath is set, .git/hooks is ignored entirely. Tools like husky set this and it surprises people."},{"title":"Check the hook is executable","cmd":"git ls-files -s .githooks/pre-commit 2>nul || dir .git\\hooks\\pre-commit","risk":"safe","look":"A hook without the execute bit is silently skipped with no error at all."},{"title":"Check the shebang","cmd":"type .git\\hooks\\pre-commit | findstr /B \"#!\"","risk":"safe","look":"A missing or CRLF-terminated shebang makes the hook unrunnable. Nothing is reported."},{"title":"Check whether commits bypass hooks","cmd":"git config core.hooksPath","risk":"safe","look":"Also confirm nobody is using --no-verify. Hooks are a convenience, not a control; CI is where enforcement belongs."}],"causes":[{"id":"hookspath-set","cause":"core.hooksPath points elsewhere.","fix":"Check what it points at. A tool may have set it and then been uninstalled.","confirm":""},{"id":"not-executable","cause":"The hook lacks the execute bit.","fix":"chmod +x, and commit the mode -remote no longer lists it. Then push the corrected tag.","note":"Removes the tag from the remote. Anyone who already fetched it keeps their copy pointing at the old commit, and release artifacts built from that tag remain published. If the tag was used for a release, prefer a new version number over moving this one."}],"causes":[{"id":"not-pushed","cause":"The tag is local only.","fix":"Delete and recreate. Nobody else is affected.","confirm":""},{"id":"already-pushed","cause":"The tag is on the remote.","fix":"Prefer publishing a new version. Moving a released tag breaks reproducibility for anyone who already fetched it.","confirm":""},{"id":"lightweight","cause":"A lightweight tag was used for a release.","fix":"Use annotated tags for releases. They carry an author, date and message.","confirm":""},{"id":"ci-triggered","cause":"CI already built from the tag.","fix":"Artifacts exist for the wrong commit. Yank them and publish a new version.","confirm":""}],"verify":["The tag points at the intended commit.","Or a corrected version was published instead.","CI artifacts match the tag."],"escalate":["Where the tag currently points","Whether it is on the remote","Whether CI built from it"]},{"id":"git-untracked-blocking-checkout","tier":"guide","technology":"Git","category":"Working Tree","title":"Checkout refuses because of untracked files","summary":"Switching branches fails because incoming files would overwrite local untracked ones.","aliases":["untracked working tree files would be overwritten","cannot checkout","would be overwritten by checkout","switch branch blocked"],"source":"https://git-scm.com/docs/git-checkout","inputs":[{"key":"branch","label":"Branch","example":"main"}],"steps":[{"title":"See which files block the switch","cmd":"git switch {branch}","risk":"safe","look":"Git lists every blocking path. These are files you have locally that the target branch also wants to create.","signals":[{"match":"would be overwritten by checkout","means":"Untracked local files collide with incoming ones.","goto":"cause:untracked-collision"}]},{"title":"Check whether they matter","cmd":"git status --short | findstr /B \"??\"","risk":"safe","look":"Untracked files. Build output and local config are usually safe to remove; anything you wrote is not."},{"title":"Check what the target branch has at those paths","cmd":"git show {branch}:<path>","risk":"safe","look":"The incoming version. Comparing tells you whether yours is worth keeping at all."},{"title":"Remove untracked files that are not needed","cmd":"git clean -nd","risk":"destructive","look":"The list of what would be removed. Only then decide whether to run it for real.","note":"Run exactly as shown with -n first: that only lists what would be deleted. Removing the -n makes it delete permanently, and files never added to Git are not recoverable by any means. Read the list line by line before you change the flag."}],"causes":[{"id":"untracked-collision","cause":"Local untracked files collide with incoming ones.","fix":"Move or remove yours. Git refuses rather than silently overwriting.","confirm":""},{"id":"build-output","cause":"Build artifacts are untracked.","fix":"Add them to .gitignore so they stop causing this.","confirm":""},{"id":"should-keep","cause":"The files are real work.","fix":"Move them aside, or commit them on a branch first.","confirm":""},{"id":"ignored-but-present","cause":"The file is ignored but exists.","fix":"Ignored files still block checkout when the target branch tracks that path.","confirm":""}],"verify":["The branch switch succeeds.","Nothing you needed was deleted.",".gitignore covers the generated files."],"escalate":["The blocking paths","Whether they are generated or authored","What the target branch has there"]},{"id":"git-lfs-not-working","tier":"guide","technology":"Git","category":"Large Files","title":"LFS files are pointer text instead of content","summary":"Files open as a few lines of metadata rather than the real content.","aliases":["lfs pointer","git lfs not working","file is pointer","lfs not installed","binary file text","smudge filter"],"source":"https://git-lfs.com/","inputs":[{"key":"file","label":"File","example":"assets/logo.png"}],"steps":[{"title":"Check whether the file is a pointer","cmd":"git cat-file -p HEAD:{file} | head -3","risk":"safe","look":"Three lines starting with version https://git-lfs means LFS content was never fetched.","signals":[{"match":"version https://git-lfs","means":"An LFS pointer. The real content was not downloaded.","goto":"cause:lfs-not-installed"}]},{"title":"Check LFS is installed and hooked up","cmd":"git lfs env","risk":"safe","look":"The filter configuration. Missing entries mean the smudge filter never runs on checkout."},{"title":"Check which patterns are tracked","cmd":"git lfs track","risk":"safe","look":"The patterns from .gitattributes. A file committed before the pattern existed is stored normally, not in LFS."},{"title":"Fetch the real content","cmd":"git lfs pull","risk":"safe","look":"Downloads content for pointers already checked out. Files become their real size."}],"causes":[{"id":"lfs-not-installed","cause":"Git LFS is not installed on this machine.","fix":"Install it and run git lfs install once per user.","confirm":""},{"id":"not-fetched","cause":"Content was not fetched on clone.","fix":"git lfs pull. CI often skips LFS by default.","confirm":""},{"id":"pattern-added-late","cause":"The file predates the LFS pattern.","fix":"It is stored as a normal blob. Migrating requires a history rewrite.","confirm":""},{"id":"quota","cause":"The LFS storage or bandwidth quota is exhausted.","fix":"Check the provider. Fetches fail silently in some clients.","confirm":""},{"id":"ci-no-lfs","cause":"CI does not fetch LFS objects.","fix":"Enable LFS in the checkout step.","confirm":""}],"verify":["Files are their real size and open correctly.","CI also gets real content."],"escalate":["First lines of the file","Output of git lfs env","Whether the pattern predates the file"]},{"id":"git-shallow-clone-limits","tier":"guide","technology":"Git","category":"Performance","title":"Operations fail in a shallow clone","summary":"Commands error because history is truncated, usually in CI.","aliases":["shallow clone error","fatal refusing to merge unrelated","unshallow","depth 1 problem","ci git error","no merge base"],"source":"https://git-scm.com/docs/git-fetch","inputs":[],"steps":[{"title":"Check whether the clone is shallow","cmd":"git rev-parse --is-shallow-repository","risk":"safe","look":"true means history is truncated. Many operations need ancestry that is simply not present.","signals":[{"match":"^true","means":"Shallow. Anything needing a merge base will fail.","goto":"cause:shallow"}]},{"title":"See how much history exists","cmd":"git log --oneline | measure-object -line","risk":"safe","look":"One commit means depth 1. Diffing against a base branch needs both branches' history."},{"title":"Fetch the full history","cmd":"git fetch --unshallow","risk":"safe","look":"Converts to a full clone. Slower but makes every operation work."},{"title":"Or fetch just what is needed","cmd":"git fetch --deepen=50 origin main","risk":"safe","look":"Adds fifty more commits rather than everything. Usually enough for a merge base without paying full clone cost."}],"causes":[{"id":"shallow","cause":"The clone has truncated history.","fix":"--unshallow, or deepen enough to find a merge base.","confirm":""},{"id":"missing-branch","cause":"Only one branch was fetched.","fix":"Fetch the base branch too. CI often fetches only the triggering ref.","confirm":""},{"id":"no-tags","cause":"Tags were not fetched.","fix":"git fetch --tags. Version derivation from tags fails without them.","confirm":""},{"id":"blame-limited","cause":"blame and log show truncated results.","fix":"Expected in a shallow clone. Deepen if you need real history.","confirm":""}],"verify":["The operation succeeds.","CI fetches enough history for what it does.","Clone time is still reasonable."],"escalate":["Whether the repository is shallow","How many commits exist","What the failing command needs"]},{"id":"git-ssh-agent-forwarding","tier":"guide","technology":"Git","category":"Remotes","title":"Git works locally but fails over SSH on a server","summary":"Cloning on a remote host fails even though your key works from your laptop.","aliases":["agent forwarding","ssh key remote","git clone fails server","permission denied server","forward key","no agent"],"source":"https://man.openbsd.org/ssh_config","inputs":[{"key":"host","label":"Host","example":"build01"}],"steps":[{"title":"Check whether an agent is reachable on the remote","cmd":"ssh {host} \"echo $SSH_AUTH_SOCK; ssh-add -l\"","risk":"safe","look":"An empty socket means no agent is forwarded, so the remote host has no key to offer.","signals":[{"match":"Could not open a connection|^\\s*$","means":"No agent is forwarded. The remote has no credentials.","goto":"cause:no-forwarding"},{"match":"The agent has no identities","means":"An agent is forwarded but holds no keys.","goto":"cause:no-keys"}]},{"title":"Check your local agent has the key","cmd":"ssh-add -l","risk":"safe","look":"The key must be loaded locally before forwarding can do anything."},{"title":"Check forwarding is enabled for this host","cmd":"ssh -G {host} | findstr forwardagent","risk":"safe","look":"It is off by default. It must be enabled per host in your client config."},{"title":"Test the git host from the remote","cmd":"ssh {host} \"ssh -T git@github.com\"","risk":"safe","look":"The definitive test. A successful greeting means forwarding works end to end."}],"causes":[{"id":"no-forwarding","cause":"Agent forwarding is not enabled.","fix":"Set ForwardAgent yes for that host. Only for hosts you trust; forwarding lets them use your key.","confirm":""},{"id":"no-keys","cause":"The local agent has no identities.","fix":"ssh-add your key.","confirm":""},{"id":"agent-not-running","cause":"No agent is running locally.","fix":"Start it. On Windows, enable the OpenSSH Authentication Agent service.","confirm":""},{"id":"should-use-deploy-key","cause":"Forwarding to a shared build host.","fix":"Use a deploy key on the host instead. Forwarding exposes your personal key to anyone with root there.","confirm":""}],"verify":["Git operations work on the remote host.","The credential choice is deliberate."],"escalate":["Whether an agent is reachable remotely","Local agent contents","ForwardAgent setting"]},{"id":"git-empty-commit-history","tier":"guide","technology":"Git","category":"Branches","title":"Branches share no common history","summary":"Merging fails because the two branches have unrelated histories.","aliases":["unrelated histories","refusing to merge","no common ancestor","allow-unrelated-histories","two roots"],"source":"https://git-scm.com/docs/git-merge","inputs":[{"key":"branch","label":"Branch","example":"main"}],"steps":[{"title":"Check for multiple root commits","cmd":"git rev-list --max-parents=0 HEAD","risk":"safe","look":"More than one SHA means the repository has several independent roots, which is how this happens.","signals":[{"match":"\\w{7,}\\s+\\w{7,}","means":"Multiple roots. The branches were never related.","goto":"cause:separate-roots"}]},{"title":"Check whether a merge base exists","cmd":"git merge-base HEAD {branch}","risk":"safe","look":"No output means no common ancestor. Git refuses rather than guessing how to combine them."},{"title":"Look at both histories","cmd":"git log --oneline --graph --all -20","risk":"safe","look":"Two disconnected lines confirm it visually. Usually one side was created with git init rather than cloned."},{"title":"Merge them deliberately","cmd":"git merge {branch} --allow-unrelated-histories","risk":"state","look":"A merge commit with two unrelated parents. Review the result carefully.","note":"Joins two independent histories into one. Every file present in both sides will conflict, because Git has no common ancestor to compare against. Expect to resolve a lot, and be certain this is genuinely what you want rather than a sign you cloned the wrong repository."}],"causes":[{"id":"separate-roots","cause":"The branches have independent roots.","fix":"Usually a mistake. Confirm you are in the right repository before merging.","confirm":""},{"id":"re-inited","cause":"Someone ran git init over an existing project.","fix":"Check whether the original history exists on the remote.","confirm":""},{"id":"force-pushed-root","cause":"History was rewritten entirely.","fix":"Recover the old root from the reflog or another clone.","confirm":""},{"id":"intentional","cause":"Genuinely combining two projects.","fix":"--allow-unrelated-histories is correct. Expect widespread conflicts.","confirm":""}],"verify":["The branches share history.","Nothing was lost in the merge.","The root cause was understood."],"escalate":["Number of root commits","Whether a merge base exists","The graph of both histories"]},{"id":"k8s-crashloopbackoff","tier":"guide","technology":"Kubernetes","category":"Pods & Containers","title":"Pod is in CrashLoopBackOff","summary":"The container starts, exits, and Kubernetes keeps restarting it with growing delay.","aliases":["crashloop","crashloopbackoff","pod keeps restarting","restarts increasing","back-off restarting failed container","pod wont stay up"],"source":"https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/","inputs":[{"key":"pod","label":"Pod name","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"},{"key":"container","label":"Container","example":"checkout-api"}],"steps":[{"title":"Confirm it is actually looping","cmd":"kubectl get pod {pod} -n {namespace} -o wide","risk":"safe","look":"RESTARTS climbing over successive checks. A high but static count is an old incident, not a live one.","signals":[{"match":"Completed","means":"This is a Job or a one-shot container that finished. restartPolicy is wrong, not the app.","goto":"cause:wrong-restart-policy"}]},{"title":"Read the previous container's logs","cmd":"kubectl logs {pod} -n {namespace} -c {container} --previous --tail=200","risk":"safe","look":"The FIRST fatal line, not the last. Startup errors scroll off the top and the tail is usually just the shutdown noise.","signals":[{"match":"(?i)connection refused|no route to host|timeout.*dial","means":"It died waiting on a dependency that was not reachable.","goto":"cause:dependency-unreachable"},{"match":"(?i)(not set|missing|undefined).*(env|variable|config)|panic.*nil","means":"Required configuration was absent at startup.","goto":"cause:missing-config"},{"match":"(?i)permission denied|operation not permitted","means":"The process cannot read a path or bind a port as its runAsUser.","goto":"cause:permissions"}]},{"title":"Read the termination state","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.status.containerStatuses[*].lastState.terminated}'","risk":"safe","look":"exitCode and reason. This is the single most decisive field in the whole runbook.","signals":[{"match":"OOMKilled|\"exitCode\":137","means":"The kernel killed it for memory. No amount of restarting will fix this.","goto":"cause:oom"},{"match":"\"exitCode\":126","means":"The entrypoint was found but is not executable. Check the file mode in the image.","goto":"cause:entrypoint-not-executable"},{"match":"\"exitCode\":127","means":"The entrypoint was not found at all. Wrong path, or missing shell in a distroless base.","goto":"cause:entrypoint-missing"},{"match":"\"exitCode\":1\\b","means":"The application chose to exit. The reason is in the logs, not here.","goto":"step:2"}]},{"title":"Check whether a probe is doing the killing","cmd":"kubectl describe pod {pod} -n {namespace}","risk":"safe","look":"Events for 'Liveness probe failed'. If present, the app may be healthy but slow to start, and the probe is executing it.","signals":[{"match":"Liveness probe failed","means":"The liveness probe is killing a container that may only need more startup time.","goto":"cause:liveness-too-aggressive"}]}],"causes":[{"id":"missing-config","cause":"A required env var, Secret key or ConfigMap key is absent, so the process exits during startup.","fix":"Fix the owning Deployment/Secret/ConfigMap in source control and reconcile. Do not patch the live Pod.","confirm":"kubectl get deploy -n {namespace} -o yaml | grep -A5 'envFrom\\|valueFrom'"},{"id":"oom","cause":"The container's memory limit is below its real working set.","fix":"Raise limits.memory in the owning Deployment, or fix the leak. Restarting will reproduce it every time.","confirm":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].resources}'"},{"id":"dependency-unreachable","cause":"A database, cache or upstream service was not reachable at startup.","fix":"Confirm the dependency's Service has endpoints, then decide whether the app should retry instead of exiting.","confirm":"kubectl get endpointslices -n {namespace}"},{"id":"liveness-too-aggressive","cause":"initialDelaySeconds is shorter than the app's real startup time, so liveness kills it mid-boot.","fix":"Move the slow-start allowance to a startupProbe rather than inflating the liveness delay.","confirm":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].livenessProbe}'"},{"id":"entrypoint-missing","cause":"Exit 127. The command in the image manifest does not exist at that path.","fix":"Check the Dockerfile ENTRYPOINT/CMD against the built image. A distroless base has no /bin/sh.","confirm":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].command}'"},{"id":"entrypoint-not-executable","cause":"Exit 126. The file exists but lacks the execute bit, or its interpreter line is wrong.","fix":"Add chmod +x in the Dockerfile, or fix the shebang. Rebuild the image.","confirm":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].image}'"},{"id":"permissions","cause":"runAsUser cannot read a mounted path or bind a privileged port.","fix":"Correct fsGroup on the volume, or move the app to a port above 1024.","confirm":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.securityContext}'"},{"id":"wrong-restart-policy","cause":"A one-shot workload is running under restartPolicy Always.","fix":"Run it as a Job with restartPolicy OnFailure or Never.","confirm":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.restartPolicy}'"}],"verify":["RESTARTS holds steady across at least three checks spanning the app's normal startup window.","The container reports Ready, and readiness has not flapped in recent events.","The original failing request or job path completes successfully."],"escalate":["Output of --previous logs, first 50 lines","The lastState.terminated block, verbatim","Image tag and digest, plus resources and probe definitions"]},{"id":"k8s-pod-pending","tier":"guide","technology":"Kubernetes","category":"Scheduling","title":"Pod stays Pending and is never scheduled","summary":"The Pod object exists but no node has accepted it.","aliases":["pod pending","not scheduled","failedscheduling","no nodes available","pod stuck pending","0/3 nodes are available"],"source":"https://kubernetes.io/docs/concepts/scheduling-eviction/","inputs":[{"key":"pod","label":"Pod name","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the scheduler's own reason","cmd":"kubectl get event -n {namespace} --field-selector involvedObject.name={pod},reason=FailedScheduling -o jsonpath='{.items[-1:].message}'","risk":"safe","look":"The scheduler states exactly why each node was rejected, in the form '0/N nodes are available: ...'. Read that string before anything else.","signals":[{"match":"(?i)insufficient (cpu|memory|ephemeral-storage)","means":"No node has enough free allocatable resource for the requests.","goto":"cause:insufficient-resources"},{"match":"(?i)didn't match.*(node selector|affinity)","means":"The nodeSelector or affinity rule matches no node's labels.","goto":"cause:selector-mismatch"},{"match":"(?i)had (untolerated )?taint","means":"Every candidate node carries a taint this Pod does not tolerate.","goto":"cause:taint"},{"match":"(?i)pod has unbound immediate PersistentVolumeClaims","means":"This is a storage problem wearing a scheduling costume.","goto":"cause:unbound-pvc"},{"match":"(?i)node\\(s\\) didn't find available persistent volumes|volume node affinity conflict","means":"The PV is pinned to a zone the scheduler cannot place the Pod in.","goto":"cause:zone-conflict"}]},{"title":"Compare the request against real allocatable capacity","cmd":"kubectl describe nodes | grep -A6 'Allocated resources'","risk":"safe","look":"Requests, not usage. A node at 12% CPU usage can still be 100% requested and therefore unschedulable."},{"title":"Read what this Pod is actually asking for","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].resources.requests}{\"\\n\"}{.spec.nodeSelector}{\"\\n\"}{.spec.tolerations}'","risk":"safe","look":"Compare these three against the previous step. The mismatch is usually obvious once both are on screen."}],"causes":[{"id":"insufficient-resources","cause":"The sum of requests exceeds allocatable on every node.","fix":"Lower the request to the workload's real profile, or add capacity. Raising the limit does not help; the scheduler reads requests.","confirm":"kubectl top nodes"},{"id":"selector-mismatch","cause":"nodeSelector or nodeAffinity references labels no node carries, often after a node pool was replaced.","fix":"Correct the selector, or label the intended nodes. Check for typos in the label key first.","confirm":"kubectl get nodes --show-labels"},{"id":"taint","cause":"Nodes are tainted (NoSchedule) and the Pod has no matching toleration.","fix":"Add the toleration if the Pod belongs on those nodes, otherwise target a different pool.","confirm":"kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{\"\\t\"}{.spec.taints}{\"\\n\"}{end}'"},{"id":"unbound-pvc","cause":"A referenced PVC has not bound, so the Pod cannot be placed.","fix":"Follow the PVC Pending runbook. Nothing about the Pod spec will fix this.","confirm":"kubectl get pvc -n {namespace}"},{"id":"zone-conflict","cause":"An existing PV lives in one zone and the Pod cannot be scheduled there.","fix":"Use a topology-aware StorageClass with volumeBindingMode WaitForFirstConsumer.","confirm":"kubectl get pv -o jsonpath='{range .items[*]}{.metadata.name}{\"\\t\"}{.spec.nodeAffinity}{\"\\n\"}{end}'"}],"verify":["The Pod reports a nodeName and moves past Pending.","No new FailedScheduling events appear for this Pod.","The change was made in the owning manifest, not by editing the live Pod."],"escalate":["The full FailedScheduling message","Allocated resources block from describe nodes","The Pod's requests, nodeSelector and tolerations"]},{"id":"k8s-service-no-endpoints","tier":"guide","technology":"Kubernetes","category":"Services & Networking","title":"Service exists but returns connection refused","summary":"DNS resolves the Service, but nothing answers. Usually the Service has no endpoints.","aliases":["no endpoints","connection refused service","service not working","empty endpointslice","selector not matching","503 from service"],"source":"https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/","inputs":[{"key":"service","label":"Service name","example":"checkout-api"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Check whether the Service has any endpoints at all","cmd":"kubectl get endpointslices -n {namespace} -l kubernetes.io/service-name={service}","risk":"safe","look":"ENDPOINTS column. If it is empty or <none>, the Service is pointing at nothing and the problem is the selector or pod readiness, not the network.","signals":[{"match":"(?i)<none>|No resources found","means":"No pods are backing this Service.","goto":"step:2"}]},{"title":"Compare the Service selector against real pod labels","cmd":"kubectl get svc {service} -n {namespace} -o jsonpath='{.spec.selector}{\"\\n\"}' && kubectl get pods -n {namespace} --show-labels","risk":"safe","look":"An exact match on every key. One extra or renamed label is enough to produce an empty Service, and this is the most common cause by a wide margin.","signals":[{"match":"(?i)app=","means":"Compare character by character. 'app' and 'app.kubernetes.io/name' are different keys.","goto":"cause:selector-mismatch"}]},{"title":"Check whether the backing pods are Ready","cmd":"kubectl get pods -n {namespace} -o wide","risk":"safe","look":"A pod that is Running but 0/1 Ready is excluded from endpoints. Readiness, not liveness, controls Service membership.","signals":[{"match":"0/1\\s+Running","means":"The pod is up but failing readiness, so it is deliberately kept out of the Service.","goto":"cause:not-ready"}]},{"title":"Confirm the target port matches the container port","cmd":"kubectl get svc {service} -n {namespace} -o jsonpath='{.spec.ports}'","risk":"safe","look":"targetPort must match the container's real listening port, or a named port the container declares. port is what clients dial; targetPort is where it lands."}],"causes":[{"id":"selector-mismatch","cause":"The Service selector does not match the pod labels.","fix":"Align them in the manifests. Changing the Deployment's pod labels forces a rollout, so prefer correcting the Service.","confirm":"kubectl get endpointslices -n {namespace} -l kubernetes.io/service-name={service}"},{"id":"not-ready","cause":"Pods are running but failing their readiness probe, so kube-proxy excludes them.","fix":"Fix the readiness endpoint or its threshold. The Service will populate on its own once pods report Ready.","confirm":"kubectl get pods -n {namespace} -o wide"},{"id":"wrong-target-port","cause":"targetPort points at a port nothing is listening on.","fix":"Set targetPort to the container's real port, or use a named port so the two cannot drift.","confirm":"kubectl get svc {service} -n {namespace} -o jsonpath='{.spec.ports}'"}],"verify":["EndpointSlice lists the expected pod IPs.","A request from inside the cluster to the Service name succeeds.","The count of endpoints matches the number of Ready replicas."],"escalate":["Service spec, selector and ports","Pod labels and readiness state","EndpointSlice contents"]},{"id":"k8s-imagepullbackoff","tier":"guide","technology":"Kubernetes","category":"Pods & Containers","title":"ImagePullBackOff or ErrImagePull","summary":"The kubelet cannot fetch the image. The event message says which of four reasons.","aliases":["imagepullbackoff","errimagepull","cannot pull image","image not found","unauthorized pull","pull secret"],"source":"https://kubernetes.io/docs/concepts/containers/images/","inputs":[{"key":"pod","label":"Pod name","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the pull failure message","cmd":"kubectl describe pod {pod} -n {namespace} | grep -A5 Events","risk":"safe","look":"The Failed event's message. It names the exact reason, and each reason has a different owner.","signals":[{"match":"(?i)not found|manifest unknown","means":"The tag does not exist in the registry.","goto":"cause:bad-tag"},{"match":"(?i)unauthorized|authentication required","means":"The node has no valid credentials for this registry.","goto":"cause:no-secret"},{"match":"(?i)x509|certificate","means":"TLS trust failure between the node and the registry.","goto":"cause:tls"},{"match":"(?i)timeout|i/o timeout|no such host","means":"The node could not reach the registry at all.","goto":"cause:unreachable"}]},{"title":"Check the image reference on the pod","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].image}'","risk":"safe","look":"Typos in the registry host or tag are the single most common cause. Read it character by character."},{"title":"Check whether a pull secret is attached","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.imagePullSecrets}'","risk":"safe","look":"Empty output on a private registry means the pod has no credentials. The secret must live in the same namespace as the pod."}],"causes":[{"id":"bad-tag","cause":"The tag does not exist in the repository.","fix":"Fix the tag in the manifest. Prefer pinning by digest for anything production.","confirm":""},{"id":"no-secret","cause":"No imagePullSecret, or it exists in a different namespace.","fix":"Create the secret in this namespace and reference it on the pod or its ServiceAccount.","confirm":""},{"id":"tls","cause":"The node does not trust the registry's certificate.","fix":"Install the CA on the nodes. Do not mark the registry insecure.","confirm":""},{"id":"unreachable","cause":"The node has no network path to the registry.","fix":"Check egress rules, the NAT gateway and any proxy configuration on the nodes.","confirm":""}],"verify":["The pod moves past ImagePullBackOff and the container starts.","No new Failed pull events appear."],"escalate":["The full Failed event message","The exact image reference","Whether an imagePullSecret is attached and in which namespace"]},{"id":"k8s-oomkilled","tier":"guide","technology":"Kubernetes","category":"Pods & Containers","title":"Container was OOMKilled","summary":"The kernel killed the container for exceeding its memory limit. Restarting reproduces it.","aliases":["oomkilled","exit 137","out of memory","memory limit","container killed memory","oom"],"source":"https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/","inputs":[{"key":"pod","label":"Pod name","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Confirm it was memory and not an external kill","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.status.containerStatuses[*].lastState.terminated.reason}'","risk":"safe","look":"OOMKilled specifically. Exit 137 alone only means SIGKILL, which something else could have sent.","signals":[{"match":"OOMKilled","means":"The kernel's OOM killer took it. This is a limit problem, not a crash.","goto":"cause:limit-too-low"}]},{"title":"Read the configured limit","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].resources}'","risk":"safe","look":"Compare limits.memory against what the process actually needs. If requests and limits differ widely, scheduling and eviction behave in ways you may not expect."},{"title":"Look at actual usage while it runs","cmd":"kubectl top pod {pod} -n {namespace} --containers","risk":"safe","look":"Usage climbing steadily towards the limit points at a leak. Usage spiking at a particular operation points at a batch size or a large request."},{"title":"Check whether the whole node is under pressure","cmd":"kubectl describe node $(kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.nodeName}') | grep -A5 Conditions","risk":"safe","look":"MemoryPressure true means the node is squeezed and eviction is in play, which is a different problem from a single container's limit."}],"causes":[{"id":"limit-too-low","cause":"The limit is below the real working set.","fix":"Raise limits.memory in the owning Deployment. Measure first with kubectl top rather than guessing.","confirm":""},{"id":"leak","cause":"Memory grows without bound until the limit is reached.","fix":"Raising the limit only delays it. Profile the application; the limit is doing its job.","confirm":""},{"id":"jvm-unaware","cause":"A JVM or Node process sized its heap against the node rather than the cgroup.","fix":"Set an explicit max heap, or use a runtime version that is container-aware.","confirm":""},{"id":"node-pressure","cause":"The node is out of memory and evicting pods.","fix":"Check requests across the node. Under-requesting causes overcommit and cascading evictions.","confirm":""}],"verify":["RESTARTS holds steady through a full workload cycle.","kubectl top shows headroom between usage and the limit."],"escalate":["lastState.terminated block","resources.requests and resources.limits","kubectl top output over a few minutes"]},{"id":"k8s-rollout-stuck","tier":"guide","technology":"Kubernetes","category":"Workloads","title":"Deployment rollout never finishes","summary":"kubectl rollout status hangs. New pods are not becoming ready, or the old ones will not go.","aliases":["rollout stuck","deployment not progressing","waiting for rollout","progressdeadlineexceeded","stuck deploying","rollout hangs"],"source":"https://kubernetes.io/docs/concepts/workloads/controllers/deployment/","inputs":[{"key":"deploy","label":"Deployment","example":"checkout-api"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the rollout condition","cmd":"kubectl get deploy {deploy} -n {namespace} -o jsonpath='{.status.conditions}'","risk":"safe","look":"The Progressing condition's reason. ProgressDeadlineExceeded means it gave up; that reason names the layer at fault.","signals":[{"match":"ProgressDeadlineExceeded","means":"The new ReplicaSet never became available in time.","goto":"step:2"},{"match":"(?i)ReplicaSetUpdated","means":"Still in progress. Give it the deadline before treating it as stuck.","goto":""}]},{"title":"Find what the new pods are doing","cmd":"kubectl get pods -n {namespace} -l app={deploy} --sort-by=.metadata.creationTimestamp","risk":"safe","look":"The newest pods. Pending means scheduling, CrashLoop means the app, 0/1 Running means readiness.","signals":[{"match":"Pending","means":"Scheduling, not deployment. Follow the Pending runbook.","goto":"cause:scheduling"},{"match":"CrashLoopBackOff","means":"The new image does not start. Follow the CrashLoop runbook.","goto":"cause:new-image-broken"},{"match":"0/1\\s+Running","means":"The container runs but fails readiness.","goto":"cause:readiness"}]},{"title":"Check whether a disruption budget is blocking removal","cmd":"kubectl get pdb -n {namespace}","risk":"safe","look":"ALLOWED DISRUPTIONS at zero means old pods cannot be evicted, so the rollout cannot proceed."},{"title":"Check the surge and unavailable settings","cmd":"kubectl get deploy {deploy} -n {namespace} -o jsonpath='{.spec.strategy}'","risk":"safe","look":"maxSurge 0 with maxUnavailable 0 is a deadlock: nothing new can start and nothing old can stop."}],"causes":[{"id":"new-image-broken","cause":"The new image fails to start.","fix":"Roll back, then fix the image. kubectl rollout undo restores the previous ReplicaSet.","confirm":""},{"id":"readiness","cause":"New pods run but never pass readiness.","fix":"Check the probe path, port and initial delay against the new image's real startup.","confirm":""},{"id":"scheduling","cause":"New pods cannot be placed.","fix":"Follow the Pending runbook. Often the surge replica has nowhere to go.","confirm":""},{"id":"pdb-block","cause":"A PodDisruptionBudget forbids removing the old pods.","fix":"Relax minAvailable, or scale up so the budget can be satisfied during the roll.","confirm":""},{"id":"strategy-deadlock","cause":"maxSurge and maxUnavailable are both zero.","fix":"Set at least one of them above zero.","confirm":""}],"verify":["kubectl rollout status returns successfully.","All replicas are on the new ReplicaSet and Ready."],"escalate":["Deployment status conditions","State of the newest pods","Strategy settings and any PDB"]},{"id":"k8s-node-notready","tier":"guide","technology":"Kubernetes","category":"Nodes","title":"Node is NotReady","summary":"The node stopped reporting healthy. Pods on it will be evicted after the toleration window.","aliases":["node notready","node not ready","kubelet down","node unreachable","node lost","kubelet stopped posting"],"source":"https://kubernetes.io/docs/concepts/architecture/nodes/","inputs":[{"key":"node","label":"Node name","example":"ip-10-0-3-14.ec2.internal"}],"steps":[{"title":"Read the node's conditions","cmd":"kubectl describe node {node} | grep -A10 Conditions","risk":"safe","look":"Which condition is false or unknown. Ready Unknown means the kubelet stopped reporting entirely, which is very different from a pressure condition.","signals":[{"match":"(?i)Ready\\s+Unknown","means":"The kubelet stopped posting status. The node may be gone or partitioned.","goto":"cause:kubelet-silent"},{"match":"(?i)DiskPressure\\s+True","means":"The node is out of disk.","goto":"cause:disk"},{"match":"(?i)MemoryPressure\\s+True","means":"The node is out of memory.","goto":"cause:memory"},{"match":"(?i)PIDPressure\\s+True","means":"Process ID exhaustion, usually a fork loop.","goto":"cause:pids"},{"match":"(?i)NetworkUnavailable\\s+True","means":"The CNI has not configured the node's network.","goto":"cause:cni"}]},{"title":"Check how long it has been unhealthy","cmd":"kubectl get node {node} -o wide","risk":"safe","look":"The age against the last transition. Pods are evicted after the not-ready toleration, five minutes by default."},{"title":"See what is still on it","cmd":"kubectl get pods --all-namespaces --field-selector spec.nodeName={node}","risk":"safe","look":"Anything not yet evicted. Stateful workloads here need attention before the node is replaced."},{"title":"Cordon it so nothing new lands","cmd":"kubectl cordon {node}","risk":"state","look":"The node shows SchedulingDisabled. Do this before investigating so the problem does not spread.","note":"Marks the node unschedulable. Running pods are not touched, but nothing new will be placed. Reverse with kubectl uncordon."}],"causes":[{"id":"kubelet-silent","cause":"The kubelet is not posting status.","fix":"Check the host: is it up, is the kubelet service running, can it reach the API server.","confirm":""},{"id":"disk","cause":"The node's disk is full, often image or log growth.","fix":"Clear space, then set image garbage collection and log rotation so it does not recur.","confirm":""},{"id":"memory","cause":"The node is out of memory.","fix":"Look for pods without limits. Overcommit on requests is the usual root cause.","confirm":""},{"id":"pids","cause":"Process ID exhaustion.","fix":"Find the fork loop. Set a pid limit on the offending workload.","confirm":""},{"id":"cni","cause":"The CNI plugin has not initialised on the node.","fix":"Check the CNI DaemonSet's pod on that node.","confirm":""}],"verify":["The node reports Ready.","Workloads have rescheduled and are serving.","The condition that flipped has a remediation, not just a restart."],"escalate":["Full conditions block","Whether the host is reachable outside Kubernetes","Pods still bound to the node"]},{"id":"k8s-pvc-pending","tier":"guide","technology":"Kubernetes","category":"Storage","title":"PersistentVolumeClaim stays Pending","summary":"The claim never binds, so every pod using it stays Pending too.","aliases":["pvc pending","volume not bound","waiting for first consumer","no persistent volumes available","storage class","pvc stuck"],"source":"https://kubernetes.io/docs/concepts/storage/persistent-volumes/","inputs":[{"key":"pvc","label":"PVC name","example":"postgres-data"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the binding events","cmd":"kubectl describe pvc {pvc} -n {namespace} | grep -A10 Events","risk":"safe","look":"The provisioner's own message. WaitForFirstConsumer is not an error at all; it is the expected state until a pod is scheduled.","signals":[{"match":"(?i)waiting for first consumer","means":"Normal. The volume binds when a pod that uses it gets scheduled.","goto":"cause:wait-first-consumer"},{"match":"(?i)storageclass.*not found","means":"The named StorageClass does not exist in this cluster.","goto":"cause:no-storageclass"},{"match":"(?i)no persistent volumes available","means":"Static provisioning with no matching PV.","goto":"cause:no-matching-pv"},{"match":"(?i)failed to provision|quota","means":"The provisioner tried and the backend refused.","goto":"cause:backend-refused"}]},{"title":"Check the requested class and access mode","cmd":"kubectl get pvc {pvc} -n {namespace} -o jsonpath='{.spec.storageClassName}{\" \"}{.spec.accessModes}{\" \"}{.spec.resources.requests.storage}'","risk":"safe","look":"ReadWriteMany is unsupported by most block storage drivers and is a common silent mismatch."},{"title":"List the classes that actually exist","cmd":"kubectl get storageclass","risk":"safe","look":"Whether the requested name exists, and which class is marked default. An empty storageClassName uses the default; a missing default leaves the claim Pending forever."}],"causes":[{"id":"wait-first-consumer","cause":"The class uses WaitForFirstConsumer.","fix":"Nothing is wrong. Schedule a pod that mounts it and it will bind.","confirm":""},{"id":"no-storageclass","cause":"The named class does not exist.","fix":"Correct the name, or install the class. Cluster migrations often leave stale names in manifests.","confirm":""},{"id":"no-matching-pv","cause":"Static provisioning with no PV matching size, class and access mode.","fix":"Create a matching PV, or move to dynamic provisioning.","confirm":""},{"id":"access-mode","cause":"The driver does not support the requested access mode.","fix":"Use ReadWriteOnce for block storage, or a filesystem driver for ReadWriteMany.","confirm":""},{"id":"backend-refused","cause":"The storage backend rejected the request, often on quota.","fix":"Read the provisioner's message and check the cloud-side quota.","confirm":""}],"verify":["The PVC reports Bound with a volume name.","The pod that needed it is scheduled and running."],"escalate":["PVC events","Requested class, size and access mode","Output of kubectl get storageclass"]},{"id":"k8s-dns-failure","tier":"guide","technology":"Kubernetes","category":"DNS","title":"DNS resolution fails inside pods","summary":"Names do not resolve from within the cluster. Work out whether it is CoreDNS, the pod's resolver, or upstream.","aliases":["dns not working","name resolution failed","coredns","cannot resolve","nxdomain","server misbehaving","temporary failure in name resolution"],"source":"https://kubernetes.io/docs/tasks/administer-cluster/dns-debugging-resolution/","inputs":[{"key":"pod","label":"Pod name","example":"checkout-api-7d9f6b8c5-x4k2m"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Test resolution of a cluster name from the pod","cmd":"kubectl exec {pod} -n {namespace} -- getent hosts kubernetes.default.svc.cluster.local","risk":"safe","look":"An IP means cluster DNS works and the problem is narrower than you thought. Nothing means the resolver path is broken.","signals":[{"match":"\\d+\\.\\d+\\.\\d+\\.\\d+","means":"Cluster DNS works. Test an external name next.","goto":"step:4"},{"match":"^\\s*$","means":"Cluster DNS is not answering for this pod.","goto":"step:2"}]},{"title":"Check that CoreDNS is running","cmd":"kubectl get pods -n kube-system -l k8s-app=kube-dns -o wide","risk":"safe","look":"All replicas Ready. CrashLooping CoreDNS is usually a bad Corefile edit or a resolver loop.","signals":[{"match":"CrashLoopBackOff","means":"CoreDNS itself is failing. Check its logs for a loop plugin detection.","goto":"cause:coredns-down"},{"match":"0/1","means":"CoreDNS is not ready, so nothing in the cluster resolves.","goto":"cause:coredns-down"}]},{"title":"Read the pod's resolver configuration","cmd":"kubectl exec {pod} -n {namespace} -- cat /etc/resolv.conf","risk":"safe","look":"The nameserver should be the cluster DNS Service IP. A node-level resolver here means dnsPolicy is wrong for a cluster workload.","signals":[{"match":"(?i)ndots:5","means":"Normal, but it means short names try several search domains first, which looks like slow DNS under load.","goto":"cause:ndots"},{"match":"nameserver 169\\.254|nameserver 8\\.8","means":"The pod is using a node or public resolver, not cluster DNS.","goto":"cause:wrong-dnspolicy"}]},{"title":"Test an external name","cmd":"kubectl exec {pod} -n {namespace} -- getent hosts github.com","risk":"safe","look":"Cluster names working but external failing points at CoreDNS's upstream forwarder or egress, not at Kubernetes DNS itself."}],"causes":[{"id":"coredns-down","cause":"CoreDNS is unhealthy.","fix":"Read its logs. A loop plugin error means the upstream resolver points back at CoreDNS.","confirm":""},{"id":"wrong-dnspolicy","cause":"The pod uses host DNS instead of cluster DNS.","fix":"Set dnsPolicy ClusterFirst. hostNetwork pods need ClusterFirstWithHostNet explicitly.","confirm":""},{"id":"upstream","cause":"CoreDNS cannot reach its upstream resolver.","fix":"Check the forward directive in the Corefile and egress from the CoreDNS pods.","confirm":""},{"id":"ndots","cause":"Short names expand through five search domains before the real lookup.","fix":"Use fully qualified names with a trailing dot for hot paths, or tune ndots per pod.","confirm":""},{"id":"netpol","cause":"A NetworkPolicy blocks egress to port 53.","fix":"Allow UDP and TCP 53 to kube-system in the policy.","confirm":""}],"verify":["Both cluster and external names resolve from inside the pod.","CoreDNS replicas are Ready with no restarts."],"escalate":["resolv.conf from inside the pod","CoreDNS pod state and logs","Which names fail: cluster, external, or both"]},{"id":"k8s-ingress-503","tier":"guide","technology":"Kubernetes","category":"Ingress","title":"Ingress returns 502, 503 or 404","summary":"The ingress answers but the backend does not. Each status points at a different layer.","aliases":["ingress 503","502 bad gateway","ingress 404","service unavailable","no healthy upstream","default backend"],"source":"https://kubernetes.io/docs/concepts/services-networking/ingress/","inputs":[{"key":"ingress","label":"Ingress name","example":"checkout"},{"key":"namespace","label":"Namespace","example":"production"},{"key":"service","label":"Backend service","example":"checkout-api"}],"steps":[{"title":"Identify which status you get and from whom","cmd":"curl -sSI https://$(kubectl get ingress {ingress} -n {namespace} -o jsonpath='{.spec.rules[0].host}')/","risk":"safe","look":"The Server header tells you whether the ingress controller answered or something upstream did. 404 usually means no rule matched; 503 usually means no healthy backend.","signals":[{"match":"503","means":"The controller matched a rule but has no healthy endpoint behind it.","goto":"cause:no-endpoints"},{"match":"404","means":"No ingress rule matched this host and path.","goto":"cause:no-rule-match"},{"match":"502","means":"The controller reached a backend and got an invalid response.","goto":"cause:backend-error"}]},{"title":"Check the ingress has an address and correct rules","cmd":"kubectl get ingress {ingress} -n {namespace} -o wide","risk":"safe","look":"An empty ADDRESS means no controller has claimed it, usually a missing or wrong ingressClassName."},{"title":"Check the backend service has endpoints","cmd":"kubectl get endpointslices -n {namespace} -l kubernetes.io/service-name={service}","risk":"safe","look":"Empty endpoints produce 503 every time. This is the most common cause by a wide margin.","signals":[{"match":"(?i)<none>|No resources found","means":"No pods behind the service. Follow the no-endpoints runbook.","goto":"cause:no-endpoints"}]},{"title":"Read the controller's own logs","cmd":"kubectl logs -n ingress-nginx -l app.kubernetes.io/component=controller --tail=50","risk":"safe","look":"The controller logs the upstream it chose and why it failed. This is more precise than anything you can infer from the client side."}],"causes":[{"id":"no-endpoints","cause":"The backend service has no ready endpoints.","fix":"Fix pod readiness or the service selector. The ingress is working correctly by refusing to send traffic nowhere.","confirm":""},{"id":"no-rule-match","cause":"Host or path in the request does not match any rule.","fix":"Check pathType. Prefix and Exact behave differently, and this catches people out constantly.","confirm":""},{"id":"wrong-class","cause":"No controller claimed the ingress.","fix":"Set ingressClassName to a class that exists in the cluster.","confirm":""},{"id":"backend-error","cause":"The backend returned something the controller could not use.","fix":"Check the app's own logs. Often TLS expected on a plain-HTTP backend port.","confirm":""},{"id":"wrong-port","cause":"The ingress points at a service port that does not exist.","fix":"Match the port name or number to the service definition.","confirm":""}],"verify":["The URL returns the expected status from the application.","The controller logs show the correct upstream being selected."],"escalate":["The exact status and response headers","Ingress rules and class","Backend endpoints","Controller log lines for the request"]},{"id":"k8s-pod-evicted","tier":"guide","technology":"Kubernetes","category":"Nodes","title":"Pods are being Evicted","summary":"The kubelet is reclaiming resources on a node under pressure. The eviction message names which resource.","aliases":["pod evicted","evicted","node under pressure","ephemeral storage","the node was low on resource","diskpressure eviction"],"source":"https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/","inputs":[{"key":"namespace","label":"Namespace","example":"production"},{"key":"pod","label":"Evicted pod name","example":"checkout-api-7d9f6b8c5-x4k2m"}],"steps":[{"title":"List the evicted pods and read the reason","cmd":"kubectl get pods -n {namespace} --field-selector status.phase=Failed -o custom-columns=NAME:.metadata.name,REASON:.status.reason,MSG:.status.message","risk":"safe","look":"The message names the resource that ran out. That single word decides everything that follows.","signals":[{"match":"(?i)ephemeral-storage","means":"The pod wrote too much to its writable layer or an emptyDir.","goto":"cause:ephemeral"},{"match":"(?i)memory","means":"The node ran out of memory and reclaimed the largest offender over its request.","goto":"cause:node-memory"},{"match":"(?i)inodes","means":"The node exhausted inodes, usually many small files.","goto":"cause:inodes"}]},{"title":"Find which node is under pressure","cmd":"kubectl get nodes -o custom-columns=NAME:.metadata.name,CONDITIONS:.status.conditions[?(@.status==\\\"True\\\")].type","risk":"safe","look":"Which nodes report DiskPressure or MemoryPressure. If it is one node, it is a host problem; if it is all of them, it is a capacity problem."},{"title":"Check whether the evicted workload declared requests","cmd":"kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].resources.requests}' 2>/dev/null || echo 'pod already removed'","risk":"safe","look":"Pods without requests are evicted first. Declaring a request is what buys a workload protection."}],"causes":[{"id":"ephemeral","cause":"The container wrote more to local disk than its ephemeral-storage allowance.","fix":"Set an ephemeral-storage request and limit, and move logs to stdout rather than files.","confirm":""},{"id":"node-memory","cause":"The node ran out of memory.","fix":"Set memory requests on the workloads sharing that node. Eviction targets pods exceeding their request first.","confirm":""},{"id":"inodes","cause":"Inode exhaustion from many small files.","fix":"Find the directory generating them. Log rotation usually solves it.","confirm":""},{"id":"no-requests","cause":"Best-effort pods are evicted first.","fix":"Declare requests so the workload gets a guaranteed or burstable class.","confirm":""}],"verify":["No new evictions during a normal workload window.","The node's pressure conditions are false.","The affected workloads declare requests."],"escalate":["Eviction message verbatim","Node conditions","Whether the workload declares requests and limits"]},{"id":"k8s-rbac-forbidden","tier":"guide","technology":"Kubernetes","category":"Access & RBAC","title":"Forbidden: User cannot perform this action","summary":"The API server authenticated you but refused the operation. The message names exactly what is missing.","aliases":["forbidden","cannot list resource","rbac denied","user cannot get","access denied kubectl","no permission namespace"],"source":"https://kubernetes.io/docs/reference/access-authn-authz/rbac/","inputs":[{"key":"namespace","label":"Namespace","example":"production"},{"key":"verb","label":"Verb","example":"list"},{"key":"resource","label":"Resource","example":"pods"}],"steps":[{"title":"Read the forbidden message in full","cmd":"kubectl get {resource} -n {namespace}","risk":"safe","look":"The message names the identity, the verb, the resource and the namespace. All four matter and the fix depends on which one is wrong.","signals":[{"match":"(?i)system:serviceaccount","means":"A ServiceAccount, not you. Something is running with in-cluster credentials.","goto":"cause:serviceaccount"},{"match":"(?i)at the cluster scope","means":"The resource is cluster-scoped, so a namespaced Role cannot grant it.","goto":"cause:needs-clusterrole"},{"match":"(?i)in the namespace","means":"Namespaced. A RoleBinding in that namespace will do it.","goto":"cause:needs-rolebinding"}]},{"title":"Ask the API server directly whether you can do it","cmd":"kubectl auth can-i {verb} {resource} -n {namespace}","risk":"safe","look":"A definitive yes or no from the authorizer itself, with no guessing about which binding applies."},{"title":"List everything your identity can do here","cmd":"kubectl auth can-i --list -n {namespace}","risk":"safe","look":"The full effective permission set. Comparing this against what you expected usually makes the gap obvious."},{"title":"Find which bindings mention your identity","cmd":"kubectl get rolebindings,clusterrolebindings -A -o wide | findstr <your-identity>","risk":"safe","look":"Which roles are actually attached. An empty result means nothing grants you anything in this namespace."}],"causes":[{"id":"needs-rolebinding","cause":"No Role or RoleBinding grants this verb in this namespace.","fix":"Create a RoleBinding to a Role carrying that verb. Grant the narrowest set that works.","confirm":""},{"id":"needs-clusterrole","cause":"The resource is cluster-scoped.","fix":"A ClusterRoleBinding is required. A namespaced RoleBinding cannot grant cluster-scoped access however it is written.","confirm":""},{"id":"serviceaccount","cause":"The request is from a ServiceAccount, not your user.","fix":"Bind the role to that ServiceAccount. Pods use their SA, never your kubeconfig.","confirm":""},{"id":"wrong-context","cause":"You are authenticated as a different identity than you assumed.","fix":"Check kubectl config current-context. Multi-cluster setups make this a routine mistake.","confirm":""},{"id":"aggregation","cause":"A ClusterRole relies on aggregation labels that do not match.","fix":"Check the aggregationRule selectors against the labels on the contributing roles.","confirm":""}],"verify":["kubectl auth can-i returns yes.","The operation succeeds.","The grant is as narrow as the task requires."],"escalate":["The verbatim forbidden message","Output of kubectl auth can-i --list","Which identity is in use"]},{"id":"k8s-hpa-not-scaling","tier":"guide","technology":"Kubernetes","category":"Autoscaling","title":"HorizontalPodAutoscaler is not scaling","summary":"Load is high but replica count does not move. Usually metrics, not the policy.","aliases":["hpa not scaling","autoscaler not working","unknown metrics","failedgetresourcemetric","hpa targets unknown","replicas not increasing"],"source":"https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/","inputs":[{"key":"hpa","label":"HPA name","example":"checkout-api"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"Read the HPA's current targets","cmd":"kubectl get hpa {hpa} -n {namespace}","risk":"safe","look":"The TARGETS column. <unknown> means no metrics are arriving and the HPA is inert; a real percentage means metrics work and the policy is the question.","signals":[{"match":"<unknown>","means":"No metrics. The HPA cannot make any decision at all.","goto":"cause:no-metrics"},{"match":"(?i)\\d+%/\\d+%","means":"Metrics are flowing. Read the conditions for why it is holding.","goto":"step:2"}]},{"title":"Read the scaling conditions","cmd":"kubectl describe hpa {hpa} -n {namespace} | findstr /C:\"Conditions\" /C:\"Events\" -A8","risk":"safe","look":"ScalingLimited with a reason names the exact constraint, such as having hit maxReplicas or being inside the stabilisation window.","signals":[{"match":"(?i)TooManyReplicas|at max","means":"Already at maxReplicas. The ceiling is the constraint.","goto":"cause:at-max"},{"match":"(?i)FailedGetResourceMetric","means":"metrics-server is not returning usage for these pods.","goto":"cause:no-metrics"},{"match":"(?i)desired.*within.*range","means":"It is deliberately holding, usually the stabilisation window.","goto":"cause:stabilisation"}]},{"title":"Check metrics-server is healthy","cmd":"kubectl top pods -n {namespace}","risk":"safe","look":"If this errors, the HPA has the same problem. metrics-server is the dependency for all resource-based autoscaling."},{"title":"Check the pods declare requests","cmd":"kubectl get deploy -n {namespace} -o jsonpath='{.items[*].spec.template.spec.containers[*].resources.requests}'","risk":"safe","look":"CPU utilisation is a percentage of the request. With no request declared there is no denominator, so the HPA can never compute a target."}],"causes":[{"id":"no-metrics","cause":"metrics-server is absent or not serving.","fix":"Install or repair it. Check its pod logs for TLS errors against the kubelet, which is the usual failure.","confirm":""},{"id":"no-requests","cause":"Containers declare no CPU request.","fix":"Set one. Utilisation is meaningless without it and the HPA will show unknown forever.","confirm":""},{"id":"at-max","cause":"Already at maxReplicas.","fix":"Raise maxReplicas if capacity allows. Confirm nodes can actually take more pods first.","confirm":""},{"id":"stabilisation","cause":"The scale-down stabilisation window is holding it.","fix":"Expected behaviour preventing flapping. Tune behaviour.scaleDown if genuinely too slow.","confirm":""},{"id":"wrong-target","cause":"scaleTargetRef points at something that does not exist.","fix":"Check the name and kind match the real workload exactly.","confirm":""}],"verify":["TARGETS shows real percentages.","Replicas move under load and settle after.","Pods have requests declared."],"escalate":["kubectl get hpa output","HPA conditions and events","Whether kubectl top works","Container resource requests"]},{"id":"k8s-configmap-not-applied","tier":"guide","technology":"Kubernetes","category":"Configuration","title":"ConfigMap or Secret change is not picked up","summary":"You updated the config but the application still uses the old values.","aliases":["configmap not updating","secret not applied","config change no effect","still old config","env not updated","restart needed configmap"],"source":"https://kubernetes.io/docs/concepts/configuration/configmap/","inputs":[{"key":"configmap","label":"ConfigMap name","example":"app-config"},{"key":"namespace","label":"Namespace","example":"production"},{"key":"deploy","label":"Deployment","example":"checkout-api"}],"steps":[{"title":"Confirm the ConfigMap itself actually changed","cmd":"kubectl get configmap {configmap} -n {namespace} -o yaml","risk":"safe","look":"The values as stored. If they are old here, the apply never landed and nothing downstream matters."},{"title":"Check how the pod consumes it","cmd":"kubectl get deploy {deploy} -n {namespace} -o jsonpath='{.spec.template.spec.containers[*].envFrom}{\" | \"}{.spec.template.spec.volumes}'","risk":"safe","look":"envFrom and env never update in a running container, ever. Volume mounts do update, but on the kubelet's sync period rather than instantly.","signals":[{"match":"(?i)configMapRef|configMapKeyRef","means":"Consumed as environment variables. These are fixed at container start and will never refresh.","goto":"cause:env-immutable"},{"match":"(?i)configMap.*name","means":"Mounted as a volume. It refreshes, but not immediately.","goto":"cause:volume-delay"}]},{"title":"Check when the pod started relative to the change","cmd":"kubectl get pod -n {namespace} -l app={deploy} -o jsonpath='{.items[*].status.startTime}'","risk":"safe","look":"A pod older than the ConfigMap edit is still holding whatever existed at its start."},{"title":"Restart the workload to pick up the new values","cmd":"kubectl rollout restart deployment/{deploy} -n {namespace}","risk":"state","look":"New pods with fresh timestamps. Watch rollout status rather than assuming it worked.","note":"Replaces every pod in the deployment with a rolling update. Brief capacity reduction during the roll, and if the new config is wrong the new pods will fail. Confirm the ConfigMap contents are correct before restarting rather than after."}],"causes":[{"id":"env-immutable","cause":"Consumed as environment variables, which are set once at container start.","fix":"Restart the workload. To make this automatic, hash the config into a pod annotation so any change triggers a roll.","confirm":""},{"id":"volume-delay","cause":"Mounted as a volume, which refreshes on the kubelet sync period.","fix":"Wait about a minute, or restart. subPath mounts never refresh at all, which surprises people.","confirm":""},{"id":"subpath","cause":"Mounted with subPath.","fix":"subPath mounts are a point-in-time copy and do not update. Mount the directory instead.","confirm":""},{"id":"not-applied","cause":"The change never reached the cluster.","fix":"Check you applied to the right namespace and context.","confirm":""},{"id":"app-caches","cause":"The application read the config once at startup.","fix":"Restarting is the only option unless the app watches the file itself.","confirm":""}],"verify":["The running pod shows the new values.","The application behaves according to the new config.","The mechanism for future updates is understood."],"escalate":["The ConfigMap as stored","How the deployment consumes it","Pod start time versus the change time"]},{"id":"k8s-statefulset-stuck","tier":"guide","technology":"Kubernetes","category":"Workloads","title":"StatefulSet will not progress past a pod","summary":"Ordered rollout blocks on one replica and nothing after it starts.","aliases":["statefulset stuck","sts not progressing","ordinal stuck","statefulset rollout","pod-0 pending","stateful pod not starting"],"source":"https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/","inputs":[{"key":"sts","label":"StatefulSet","example":"postgres"},{"key":"namespace","label":"Namespace","example":"production"}],"steps":[{"title":"See which ordinal is blocking","cmd":"kubectl get pods -n {namespace} -l app={sts} --sort-by=.metadata.name","risk":"safe","look":"StatefulSets proceed strictly in order. The lowest-numbered unhealthy pod is the only one that matters; everything above it is simply waiting.","signals":[{"match":"Pending","means":"The blocking pod cannot be scheduled, very often because its PVC has not bound.","goto":"cause:pvc"},{"match":"CrashLoopBackOff","means":"The blocking pod starts and dies.","goto":"cause:app-failure"}]},{"title":"Check its volume claim","cmd":"kubectl get pvc -n {namespace} -l app={sts}","risk":"safe","look":"Each ordinal gets its own PVC. A single unbound claim halts the whole set, and this is the most common cause."},{"title":"Read the update strategy","cmd":"kubectl get sts {sts} -n {namespace} -o jsonpath='{.spec.updateStrategy}'","risk":"safe","look":"OnDelete means the controller will never replace pods by itself and you must delete them manually. A partition value means updates deliberately stop at that ordinal."},{"title":"Check whether pod management is the constraint","cmd":"kubectl get sts {sts} -n {namespace} -o jsonpath='{.spec.podManagementPolicy}'","risk":"safe","look":"OrderedReady is the default and enforces the strict sequence. Parallel lets pods start independently, which suits some workloads and not others."}],"causes":[{"id":"pvc","cause":"The blocking pod's PVC has not bound.","fix":"Follow the PVC Pending runbook. The StatefulSet is behaving correctly by waiting.","confirm":""},{"id":"app-failure","cause":"The application in that ordinal fails to start.","fix":"Treat it as a CrashLoop. Often ordinal zero is a cluster seed and its failure is different from the others.","confirm":""},{"id":"ondelete","cause":"updateStrategy is OnDelete.","fix":"Delete the pods yourself in order. The controller will not do it.","confirm":""},{"id":"partition","cause":"A partition is set on the rolling update.","fix":"Lower the partition value to allow more ordinals to update.","confirm":""},{"id":"quorum","cause":"A clustered application cannot reach quorum.","fix":"Check the app's own cluster state. Kubernetes sees healthy processes that refuse to serve.","confirm":""}],"verify":["All ordinals are Running and Ready in sequence.","Each has a bound PVC.","The application reports a healthy cluster."],"escalate":["Pod list in ordinal order","PVC state per ordinal","Update strategy and pod management policy"]},{"id":"k8s-networkpolicy-blocking","tier":"guide","technology":"Kubernetes","category":"Network & NetworkPolicy","title":"Traffic blocked between pods after a NetworkPolicy","summary":"Connections that used to work now time out. Policies are deny-by-default once any policy selects a pod.","aliases":["networkpolicy blocking","pod cannot reach pod","traffic blocked","netpol","connection timeout after policy","deny all"],"source":"https://kubernetes.io/docs/concepts/services-networking/network-policies/","inputs":[{"key":"namespace","label":"Namespace","example":"production"},{"key":"pod","label":"Pod name","example":"checkout-api-7d9f6b8c5-x4k2m"}],"steps":[{"title":"List policies affecting this namespace","cmd":"kube
