<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Runbook</title>
<style>
:root{
  --paper:#EEF1F4; --surface:#fff; --ink:#141C24; --muted:#5A6976;
  --rule:#D5DCE3; --rule-soft:#E4E9ED;
  --safe:#0F7B54; --state:#A15C00; --destructive:#BC2C24;
  --focus:#1F5FA8;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --mono:"Cascadia Mono",ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.5;font-feature-settings:"tnum" 1}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:940px;margin:0 auto;padding:0 20px}

/* ---- context strip ---- */
.ctx{background:var(--ink);color:#DCE3EA;position:sticky;top:0;z-index:20}
.ctx .wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding-top:9px;padding-bottom:9px}
.ctx .brand{font-weight:650;letter-spacing:-.01em;color:#fff;margin-right:auto;font-size:15px}
.ctx .by{font-weight:400;color:#8095A8;font-size:12.5px;margin-left:7px}
@media(max-width:640px){.ctx .by{display:none}}
.ctx label{display:flex;align-items:baseline;gap:6px;font-size:12.5px;color:#9FB0BF}
.ctx input{background:transparent;border:0;border-bottom:1px solid #3C4A57;color:#fff;
  font-family:var(--mono);font-size:13px;padding:1px 2px;width:15ch;min-width:0}
.ctx input:focus{border-bottom-color:#7FA8D4;outline:none}
.ctx input::placeholder{color:#5A6976}

/* ---- search ---- */
.search{padding:44px 0 26px}
h1{font-size:28px;line-height:1.2;letter-spacing:-.02em;margin:0 0 6px;font-weight:640}
.lede{color:var(--muted);margin:0 0 22px;max-width:62ch}
#q{width:100%;padding:14px 16px;border:1px solid var(--rule);border-radius:6px;
  background:var(--surface);font-size:17px}
#q:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px rgba(31,95,168,.12)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
.chips.sub{margin-top:8px}
.tab{background:var(--surface);border:1px solid var(--rule);border-radius:20px;padding:6px 14px;
  font-size:13.5px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tab:hover{border-color:var(--ink)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab .n{font-size:11.5px;opacity:.6;font-variant-numeric:tabular-nums}
.chips.sub .tab{padding:4px 11px;font-size:12.5px;border-radius:4px;color:var(--muted)}
.chips.sub .tab.on{color:#fff}
.hint{margin-top:13px;font-size:12.5px;color:var(--muted)}
kbd{font-family:var(--mono);font-size:11.5px;border:1px solid var(--rule);border-bottom-width:2px;
  border-radius:3px;padding:1px 5px;background:var(--surface)}

/* ---- results ---- */
.results{list-style:none;margin:0;padding:0 0 56px}
.results li{border-top:1px solid var(--rule-soft)}
.results li:last-child{border-bottom:1px solid var(--rule-soft)}
.hit{display:block;width:100%;text-align:left;background:none;border:0;padding:15px 14px;cursor:pointer}
.hit:hover,.hit.cur{background:var(--surface)}
.hit h3{margin:0;font-size:16.5px;font-weight:600;letter-spacing:-.005em}
.hit p{margin:3px 0 0;color:var(--muted);font-size:14px}
.meta{margin-top:7px;font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.empty{padding:40px 14px;color:var(--muted);border-top:1px solid var(--rule-soft)}

/* ---- trust badge ---- */
.trust{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600}
.trust::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-verified{color:var(--safe)} .t-documented{color:var(--state)} .t-reference{color:var(--muted)}

/* ---- runbook ---- */
.rb{padding:26px 0 90px;display:none}
.back{background:none;border:0;padding:0;color:var(--muted);font-size:13.5px;cursor:pointer;margin-bottom:18px}
.back:hover{color:var(--ink)}
.rb h2{font-size:25px;line-height:1.2;letter-spacing:-.02em;margin:0 0 6px;font-weight:640}
.rb .sum{color:var(--muted);margin:0 0 14px;max-width:64ch}
.prov{font-size:12.5px;color:var(--muted);border-left:2px solid var(--rule);padding:2px 0 2px 11px;margin-bottom:26px}
.prov code{font-family:var(--mono);font-size:12px}
.prov a{color:var(--focus)}

/* ---- the rail ---- */
ol.steps{list-style:none;margin:0;padding:0}
.step{position:relative;padding:0 0 26px 40px}
.step::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:1px;background:var(--rule)}
.step:last-child::before{display:none}
.step.danger::before{background:var(--destructive);opacity:.35}
.mark{position:absolute;left:0;top:2px;width:23px;height:23px;border:1px solid var(--rule);
  background:var(--surface);border-radius:3px;cursor:pointer;padding:0;
  font-family:var(--mono);font-size:12px;color:var(--muted);line-height:21px;text-align:center}
.mark:hover{border-color:var(--ink)}
.step.done .mark{background:var(--ink);border-color:var(--ink);color:#fff}
.step.done .stitle{color:var(--muted)}
.step.danger .mark{border-color:var(--destructive);color:var(--destructive)}

.shead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:9px}
.stitle{font-weight:600;font-size:16px;letter-spacing:-.005em}
.chip{font-size:11px;font-weight:650;padding:2px 7px;border-radius:3px;white-space:nowrap}
.c-safe{color:var(--safe);background:rgba(15,123,84,.09)}
.c-state{color:var(--state);background:rgba(161,92,0,.10)}
.c-destructive{color:#fff;background:var(--destructive)}

.cmd{position:relative;background:var(--ink);border-radius:5px;margin:0 0 10px}
.cmd pre{margin:0;padding:13px 84px 13px 14px;overflow-x:auto;font-family:var(--mono);
  font-size:13.5px;line-height:1.55;color:#E8EEF3;white-space:pre-wrap;word-break:break-word}
.cmd .fill{color:#8FD0A8;font-weight:600}
.cmd .unfilled{color:#E0A86A;border-bottom:1px dashed #8A6A48}
.copy{position:absolute;top:8px;right:8px;background:#2A3640;border:0;color:#C6D3DD;
  font-size:12px;padding:5px 10px;border-radius:4px;cursor:pointer}
.copy:hover{background:#3A4854;color:#fff}
.veil{padding:13px 14px;color:#E0A86A;font-family:var(--mono);font-size:13px;cursor:pointer;
  display:flex;align-items:center;gap:9px}
.veil:hover{color:#fff}

.look{font-size:14.5px;color:var(--muted);margin:0 0 8px;max-width:66ch}
.look b{color:var(--ink);font-weight:600}
.note{font-size:14px;border-left:2px solid var(--destructive);padding:6px 0 6px 11px;
  margin:0 0 10px;max-width:64ch;color:var(--ink)}
.note-state{border-left-color:var(--state)}

/* ---- output matcher ---- */
.match{margin-top:10px}
.match summary{font-size:13.5px;color:var(--focus);cursor:pointer;list-style:none}
.match summary::-webkit-details-marker{display:none}
.match summary::before{content:"+ ";font-family:var(--mono)}
.match[open] summary::before{content:"- "}
.match textarea{width:100%;margin-top:9px;min-height:78px;padding:10px 12px;border:1px solid var(--rule);
  border-radius:5px;font-family:var(--mono);font-size:12.5px;background:var(--surface);resize:vertical}
.verdict{margin-top:9px;padding:11px 13px;border-radius:5px;font-size:14.5px;background:var(--surface);
  border:1px solid var(--rule)}
.verdict.hit{border-color:var(--safe);border-left:3px solid var(--safe)}
.verdict.miss{color:var(--muted)}
.verdict b{display:block;margin-bottom:3px}
.jump{background:none;border:0;color:var(--focus);padding:0;margin-top:6px;cursor:pointer;font-size:13.5px}

/* ---- causes ---- */
.sec{margin-top:34px;padding-top:20px;border-top:1px solid var(--rule)}
.sec h3{font-size:13px;font-weight:650;margin:0 0 14px;color:var(--muted);letter-spacing:.01em}
.cause{padding:13px 15px;background:var(--surface);border:1px solid var(--rule-soft);border-radius:5px;margin-bottom:9px}
.cause.lit{border-color:var(--safe);border-left:3px solid var(--safe)}
.cause .rank{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-right:7px}
.cause .what{font-weight:600;font-size:15px}
.cause .fix{color:var(--muted);font-size:14.5px;margin-top:4px;max-width:66ch}
.cause .fix b{color:var(--ink);font-weight:600}
ul.plain{margin:0;padding-left:19px;color:var(--muted);font-size:14.5px;max-width:66ch}
ul.plain li{margin-bottom:5px}

/* ---- action bar ---- */
.bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--rule);
  padding:11px 0;display:none;z-index:15}
.bar .wrap{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.bar .prog{font-size:13px;color:var(--muted);margin-right:auto;font-variant-numeric:tabular-nums}
.act{background:var(--surface);border:1px solid var(--rule);border-radius:5px;padding:7px 13px;
  font-size:13.5px;cursor:pointer}
.act:hover{border-color:var(--ink)}
.act.key{background:var(--ink);color:#fff;border-color:var(--ink)}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:9px 17px;border-radius:5px;font-size:13.5px;z-index:30;display:none}

footer{color:var(--muted);font-size:12.5px;padding:0 0 30px;max-width:70ch;white-space:pre-line}

@media(max-width:640px){
  .wrap{padding:0 15px}
  .search{padding:26px 0 18px} h1{font-size:23px} .rb h2{font-size:21px}
  .ctx .wrap{gap:11px} .ctx input{width:11ch}
  .step{padding-left:33px} .mark{width:21px;height:21px;line-height:19px}
  .step::before{left:10px}
  .cmd pre{padding-right:14px;padding-top:38px}
  .copy{top:6px;right:auto;left:8px}
}
</style>
</head>
<body>

<div class="ctx"><div class="wrap">
  <span class="brand">DevOps Runbook <span class="by">by Dinesh Ilangovan</span></span>
  <span id="ctxfields"></span>
</div></div>

<main class="wrap">

<section class="search" id="searchview">
  <h1>What is broken?</h1>
  <p class="lede">Type the symptom, the error string, or what you were doing when it failed.</p>
  <input id="q" placeholder="CrashLoopBackOff, pod pending, committed to main, force push..." autocomplete="off" autofocus>
  <div class="chips" id="techchips"></div>
  <div class="chips sub" id="catchips"></div>
  <p class="hint"><kbd>/</kbd> search &nbsp; <kbd>↑</kbd><kbd>↓</kbd> move &nbsp; <kbd>Enter</kbd> open &nbsp; <kbd>Esc</kbd> back</p>
</section>

<ul class="results" id="results"></ul>

<section class="rb" id="rbview"></section>

<footer id="foot"></footer>
</main>

<div class="bar" id="bar"><div class="wrap">
  <span class="prog" id="prog"></span>
  <button class="act" id="a-safe">Copy read-only steps</button>
  <button class="act" id="a-esc">Copy handoff notes</button>
  <button class="act key" id="a-log">Copy incident log</button>
</div></div>
<div class="toast" id="toast"></div>

<script id="data" type="application/json">[{"id":"docker-exits-immediately","tier":"guide","technology":"Docker","category":"Container Lifecycle","title":"Container exits straight after docker run","summary":"The container starts and dies within a second. The exit code tells you which of five very different problems you have.","aliases":["container exits immediately","exits right away","wont stay running","container stops","exited (1)","exited (126)","exited (127)","exited (137)","docker run does nothing"],"source":"https://docs.docker.com/engine/reference/run/#exit-status","inputs":[{"key":"container","label":"Container","example":"checkout-api"},{"key":"image","label":"Image","example":"registry.local/checkout-api:1.4.2"}],"steps":[{"title":"Read the exit code","cmd":"docker ps -a --filter name={container} --format '{{.Names}}\\t{{.Status}}'","risk":"safe","look":"The number in Exited (N). This single number splits the problem five ways, and every branch below has a different fix. Do not skip to the logs before you have it.","signals":[{"match":"Exited \\(125\\)","means":"Docker itself refused to start the container. The error is in your run flags, not the image.","goto":"cause:bad-run-flags"},{"match":"Exited \\(126\\)","means":"The entrypoint was found but could not be executed. Missing execute bit, or a CRLF line ending in a shell script.","goto":"cause:not-executable"},{"match":"Exited \\(127\\)","means":"The entrypoint was not found at all. Wrong path, or no shell in a distroless or scratch base.","goto":"cause:not-found"},{"match":"Exited \\(137\\)","means":"SIGKILL. Either the memory limit was hit or something sent a kill.","goto":"cause:oom"},{"match":"Exited \\(0\\)","means":"It ran and finished normally. There was no long-running process to keep it alive.","goto":"cause:no-foreground-process"},{"match":"Exited \\(1\\)","means":"The application itself chose to exit. The reason is in the logs.","goto":"step:2"}]},{"title":"Read the logs it managed to write","cmd":"docker logs {container} --tail=100","risk":"safe","look":"The first error, not the last. If this is empty, the process died before it could log anything, which points back at the entrypoint rather than the app.","signals":[{"match":"(?i)permission denied","means":"The process cannot read a path or bind a port as its user.","goto":"cause:not-executable"},{"match":"(?i)no such file or directory","means":"A path in the entrypoint or a required file is absent from the image.","goto":"cause:not-found"},{"match":"^\\s*$","means":"Empty. The container died before logging, so the fault is in the entrypoint or the run flags.","goto":"step:3"}]},{"title":"Check what the image says it should run","cmd":"docker image inspect {image} --format 'entrypoint={{json .Config.Entrypoint}} cmd={{json .Config.Cmd}} user={{.Config.User}}'","risk":"safe","look":"Compare this against what actually exists in the image. A null Cmd with a shell-form Entrypoint is a common source of exit 127."},{"title":"Open a shell in the image to see what is really there","cmd":"docker run --rm -it --entrypoint sh {image}","risk":"state","note":"Creates a new container. It is removed on exit because of --rm, but it does consume a container slot and will pull the image if absent. If this fails with 'exec sh not found', the base image has no shell at all, which is itself the answer.","look":"Whether the entrypoint file exists, whether it is executable, and whether the interpreter on its first line is present."}],"causes":[{"id":"no-foreground-process","cause":"Exit 0. The image's command finished. A container lives exactly as long as PID 1.","fix":"Run the real server process in the foreground, not backgrounded or daemonised. A CMD that ends is a container that ends.","confirm":"docker image inspect {image} --format '{{json .Config.Cmd}}'"},{"id":"not-found","cause":"Exit 127. The entrypoint path does not exist inside the image.","fix":"Check the path in the Dockerfile against the built layers. On distroless or scratch there is no /bin/sh, so shell-form CMD will always fail.","confirm":"docker run --rm --entrypoint ls {image} -la /"},{"id":"not-executable","cause":"Exit 126. The file exists but cannot be run. Usually a missing execute bit, or a script saved with Windows CRLF line endings.","fix":"Add RUN chmod +x in the Dockerfile. If you edited the script on Windows, convert it to LF — CRLF makes the shebang unresolvable.","confirm":"docker run --rm --entrypoint ls {image} -l /entrypoint.sh"},{"id":"oom","cause":"Exit 137. SIGKILL, almost always the memory limit.","fix":"Raise --memory, or fix the allocation. Check OOMKilled in inspect to confirm it was memory rather than an external kill.","confirm":"docker inspect {container} --format '{{.State.OOMKilled}}'"},{"id":"bad-run-flags","cause":"Exit 125. The Docker daemon rejected the run request before the image was involved.","fix":"Re-read the docker run line. A bad mount path, an unknown flag, or a port already bound will all produce this.","confirm":"docker inspect {container} --format '{{.State.Error}}'"}],"verify":["docker ps shows the container in Up state, not Restarting.","The status stays Up across at least a minute.","docker logs shows the application's normal startup output."],"escalate":["The exact Exited (N) status","First 50 lines of docker logs, or a note that it was empty","Entrypoint, Cmd and User from image inspect, plus the full docker run line"]},{"id":"docker-pull-denied","tier":"guide","technology":"Docker","category":"Registry & Auth","title":"docker pull fails with denied or unauthorized","summary":"The registry refused you. Whether that is authentication, authorisation, or a typo in the tag depends on the exact wording.","aliases":["pull access denied","unauthorized","denied requested access","authentication required","cannot pull image","imagepullbackoff local","no basic auth credentials"],"source":"https://docs.docker.com/reference/cli/docker/login/","inputs":[{"key":"image","label":"Image reference","example":"registry.local/checkout-api:1.4.2"},{"key":"registry","label":"Registry host","example":"registry.local"}],"steps":[{"title":"Read the exact refusal","cmd":"docker pull {image}","risk":"safe","look":"The precise wording. 'denied' and 'unauthorized' and 'manifest unknown' are three different problems that look identical at a glance.","signals":[{"match":"(?i)manifest unknown|manifest for .* not found","means":"You are authenticated fine. That tag does not exist in that repository.","goto":"cause:bad-tag"},{"match":"(?i)no basic auth credentials|authentication required","means":"You are not logged in to this registry at all.","goto":"cause:not-logged-in"},{"match":"(?i)denied: requested access to the resource is denied","means":"You are logged in, but this account cannot read this repository.","goto":"cause:no-permission"},{"match":"(?i)x509|certificate signed by unknown authority","means":"TLS trust failure, not an auth failure. The registry's CA is not trusted by your Docker daemon.","goto":"cause:tls"},{"match":"(?i)i/o timeout|no such host","means":"You never reached the registry. This is DNS or egress, not credentials.","goto":"cause:unreachable"}]},{"title":"Check which registries you are actually logged in to","cmd":"docker info --format '{{.RegistryConfig.IndexConfigs}}' && type %USERPROFILE%\\.docker\\config.json","risk":"safe","look":"Whether {registry} appears in the auths block. A credential helper means the token lives in Windows Credential Manager rather than the file, so an empty auths block is not proof you are logged out."},{"title":"Confirm the tag exists before blaming credentials","cmd":"docker manifest inspect {image}","risk":"safe","look":"A manifest means the tag is real and readable. An error here with a valid login means the tag is wrong or was garbage-collected."}],"causes":[{"id":"not-logged-in","cause":"No credentials cached for this registry.","fix":"docker login {registry}. If a credential helper is configured, log in through that rather than storing a token in plain config.json.","confirm":"docker login {registry}"},{"id":"no-permission","cause":"Authenticated, but the account lacks pull rights on that repository.","fix":"Ask the registry owner for read access on that path. A token scoped to another project produces exactly this message.","confirm":"docker manifest inspect {image}"},{"id":"bad-tag","cause":"The tag does not exist. Very often a typo, or a tag that was cleaned up by a retention policy.","fix":"List the available tags and pick a real one. Prefer pinning by digest for anything that matters.","confirm":"docker manifest inspect {image}"},{"id":"tls","cause":"The registry's certificate is not trusted by the Docker daemon.","fix":"Install the CA into the daemon's trust store. Do not add the host to insecure-registries to make this go away.","confirm":"docker info --format '{{.RegistryConfig.InsecureRegistryCIDRs}}'"},{"id":"unreachable","cause":"The registry host did not resolve or did not answer.","fix":"Check DNS and any corporate proxy. Docker reads proxy settings from its own config, not from your shell environment.","confirm":"nslookup {registry}"}],"verify":["docker pull completes and reports a digest.","docker images lists the image locally.","A fresh shell can repeat the pull without logging in again."],"escalate":["The verbatim error line from docker pull","Which registry and repository path, with the tag","Whether docker manifest inspect succeeds or fails"]},{"id":"docker-no-space-left","tier":"guide","technology":"Docker","category":"Storage & Disk","title":"no space left on device","summary":"Builds or containers fail on disk. Find out what is consuming it before you reclaim anything, because the fast fix deletes real data.","aliases":["no space left","disk full","cannot write","build fails disk","out of disk","docker full","reclaim space"],"source":"https://docs.docker.com/reference/cli/docker/system/prune/","inputs":[],"steps":[{"title":"Find out what is actually using the space","cmd":"docker system df -v","risk":"safe","look":"The RECLAIMABLE column per category. Build cache is usually the largest and the safest to drop. Volumes are usually the smallest and the most dangerous.","signals":[{"match":"(?i)Build Cache","means":"Read the build cache line specifically. On a CI-style machine it is often most of the total and costs nothing but rebuild time.","goto":"cause:build-cache"},{"match":"(?i)Local Volumes","means":"Volumes hold real data. Nothing in this runbook should delete them without you knowing what is inside.","goto":"cause:volumes"}]},{"title":"Check whether the host disk is full rather than Docker","cmd":"docker run --rm -v /:/host alpine df -h /host","risk":"state","note":"Starts a throwaway container and mounts the host root read-write into it. It only runs df, but anything with this mount could write to the host filesystem. On Docker Desktop for Windows this inspects the Linux VM's disk, not your C: drive.","look":"Whether the filesystem holding /var/lib/docker is full, or whether something else on the host filled the disk and Docker is just the victim."},{"title":"Reclaim the build cache only","cmd":"docker builder prune --filter until=168h","risk":"destructive","note":"Permanently deletes build cache older than seven days. Nothing running is affected and no image or volume is touched, but your next build of an affected image will be slow because it has to rebuild those layers. This cannot be undone.","look":"The reclaimed total at the end. Re-run docker system df to confirm the space actually came back."},{"title":"Remove stopped containers and dangling images","cmd":"docker container prune && docker image prune","risk":"destructive","note":"Deletes every stopped container and every untagged image. A stopped container that someone intended to restart or inspect is gone, along with its writable layer and anything written outside a volume. Run docker ps -a first and read the list. Never use docker system prune -a --volumes here — that also removes named volumes and is how people lose databases.","look":"The list of deleted IDs. If you see something you recognise, stop and check what it was before continuing."}],"causes":[{"id":"build-cache","cause":"BuildKit cache has accumulated across many builds.","fix":"Prune with a time filter rather than wholesale, and set a cache ceiling in the daemon config so it bounds itself.","confirm":"docker system df"},{"id":"stopped-containers","cause":"Exited containers are retained along with their writable layers.","fix":"Prune them, and add --rm to throwaway docker run commands so they clean up on exit.","confirm":"docker ps -a --filter status=exited"},{"id":"dangling-images","cause":"Rebuilt tags leave the previous image untagged but still on disk.","fix":"docker image prune. Schedule it rather than doing it in a panic mid-incident.","confirm":"docker images -f dangling=true"},{"id":"volumes","cause":"Anonymous volumes from removed containers persist and are never cleaned automatically.","fix":"Inspect each one before deleting anything. Use named volumes so ownership is obvious from the name.","confirm":"docker volume ls -f dangling=true"},{"id":"log-growth","cause":"Container JSON log files grew unbounded because no rotation was configured.","fix":"Set max-size and max-file in the daemon's log-opts. This is the fix that stops it recurring.","confirm":"docker inspect --format '{{.HostConfig.LogConfig}}' $(docker ps -q)"}],"verify":["docker system df shows meaningful free space.","The build or container that was failing now succeeds.","Log rotation is configured, so the same disk does not fill again next week."],"escalate":["Full docker system df -v output","Which category held the space","Whether anything was pruned, and exactly which command was run"]},{"id":"docker-container-no-network","tier":"guide","technology":"Docker","category":"Networking & DNS","title":"Container cannot reach another container or the internet","summary":"Connection refused or name not resolving from inside a container. Work outward: name, then network membership, then egress.","aliases":["container cannot connect","dns not resolving container","connection refused between containers","cannot reach service","compose networking","name or service not known"],"source":"https://docs.docker.com/engine/network/","inputs":[{"key":"container","label":"Container","example":"checkout-api"},{"key":"target","label":"What it is trying to reach","example":"postgres"}],"steps":[{"title":"Check whether the name resolves from inside the container","cmd":"docker exec {container} getent hosts {target}","risk":"safe","look":"An IP means DNS is fine and the problem is the port or the listener. No output means Docker's embedded DNS does not know that name.","signals":[{"match":"^\\s*$","means":"The name did not resolve. Either the containers are not on the same user-defined network, or the name is wrong.","goto":"cause:not-same-network"},{"match":"\\d+\\.\\d+\\.\\d+\\.\\d+","means":"DNS is working. Move to the port and the listener.","goto":"step:3"}]},{"title":"Compare which networks each container is attached to","cmd":"docker inspect {container} --format '{{json .NetworkSettings.Networks}}' && docker inspect {target} --format '{{json .NetworkSettings.Networks}}'","risk":"safe","look":"The same user-defined network name in both. The default bridge gives no DNS between containers at all, which is the single most common cause of this symptom.","signals":[{"match":"\"bridge\"","means":"On the default bridge, container name resolution does not work. You need a user-defined network.","goto":"cause:default-bridge"}]},{"title":"Check that the target is listening where you think","cmd":"docker exec {target} sh -c \"netstat -tlnp 2>/dev/null || ss -tlnp\"","risk":"safe","look":"Whether it is bound to 0.0.0.0 or to 127.0.0.1. A process bound to localhost inside a container is unreachable from every other container, no matter how correct the network is.","signals":[{"match":"127\\.0\\.0\\.1:","means":"It is only listening on loopback inside its own namespace. Nothing outside that container can reach it.","goto":"cause:bound-localhost"}]},{"title":"Test egress to the outside world","cmd":"docker exec {container} sh -c \"getent hosts registry-1.docker.io || echo DNS_FAIL\"","risk":"safe","look":"DNS_FAIL means the container has no working resolver, which usually points at a host DNS or corporate proxy setting that Docker did not inherit."}],"causes":[{"id":"not-same-network","cause":"The containers are not attached to a common user-defined network.","fix":"Put both on the same named network. In Compose this is automatic within a project, so this usually means they are in two different projects.","confirm":"docker network inspect $(docker inspect {container} --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}')"},{"id":"default-bridge","cause":"Both are on the default bridge network, which has no embedded DNS for container names.","fix":"Create a user-defined network and attach both. Only user-defined networks give name-based service discovery.","confirm":"docker network ls"},{"id":"bound-localhost","cause":"The target process listens on 127.0.0.1 inside its own network namespace.","fix":"Bind it to 0.0.0.0 in the application's own configuration. No Docker flag can work around this.","confirm":"docker exec {target} sh -c \"ss -tlnp\""},{"id":"wrong-port","cause":"The client is dialling the published host port rather than the container port.","fix":"Between containers, use the container's internal port. Published ports are for traffic arriving from the host.","confirm":"docker port {target}"},{"id":"host-dns","cause":"Corporate DNS or proxy settings were not inherited by the daemon.","fix":"Set dns in the daemon config, or pass --dns. Docker does not read your shell's proxy variables.","confirm":"docker exec {container} cat /etc/resolv.conf"}],"verify":["getent hosts resolves the target name from inside the container.","A connection to the target's internal port succeeds.","The same works after both containers are restarted."],"escalate":["Networks block from inspect for both containers","Listening sockets inside the target","Contents of /etc/resolv.conf inside the client"]},{"id":"docker-port-allocated","tier":"guide","technology":"Docker","category":"Networking & DNS","title":"port is already allocated","summary":"docker run fails because something already holds the host port.","aliases":["port already allocated","address already in use","bind failed","port in use","cannot start port"],"source":"https://docs.docker.com/engine/network/","inputs":[{"key":"port","label":"Host port","example":"8080"}],"steps":[{"title":"Find which container holds it","cmd":"docker ps --filter publish={port} --format '{{.Names}}\\t{{.Ports}}'","risk":"safe","look":"A container name means Docker itself is holding it, and you can stop that container. Nothing means a host process has it.","signals":[{"match":"\\w","means":"A container already publishes this port.","goto":"cause:other-container"},{"match":"^\\s*$","means":"No container has it, so a host process does.","goto":"step:2"}]},{"title":"Find the host process holding it","cmd":"netstat -ano | findstr :{port}","risk":"safe","look":"The PID in the last column. Look it up in Task Manager before killing anything."},{"title":"Check for a stopped container still reserving it","cmd":"docker ps -a --filter publish={port}","risk":"safe","look":"On some versions a container in a bad state keeps the mapping. Removing it releases the port."}],"causes":[{"id":"other-container","cause":"Another container publishes the same host port.","fix":"Stop it, or publish this one on a different host port. The container port does not need to change.","confirm":""},{"id":"host-process","cause":"A non-Docker process on the host owns the port.","fix":"Stop that process, or pick another host port.","confirm":""},{"id":"stale-mapping","cause":"A dead container is still holding the reservation.","fix":"docker rm the container. If it persists, restart the Docker daemon.","confirm":""}],"verify":["docker run starts and publishes the port.","The service answers on the host port."],"escalate":["Output of docker ps --filter publish","The netstat line including PID","The full docker run command"]},{"id":"docker-volume-permission","tier":"guide","technology":"Docker","category":"Storage & Disk","title":"Permission denied on a mounted volume","summary":"The container cannot read or write a bind-mounted path. It is almost always a UID mismatch.","aliases":["permission denied volume","cannot write to mount","bind mount permission","read only file system","eacces container"],"source":"https://docs.docker.com/engine/storage/bind-mounts/","inputs":[{"key":"container","label":"Container","example":"checkout-api"},{"key":"path","label":"Mount path in container","example":"/data"}],"steps":[{"title":"Find which user the container runs as","cmd":"docker inspect {container} --format 'user={{.Config.User}} readonly={{.HostConfig.ReadonlyRootfs}}'","risk":"safe","look":"An empty user means root, which rarely hits permission errors. A numeric UID that does not own the host directory is the usual cause.","signals":[{"match":"readonly=true","means":"The root filesystem is read-only by design. Writes outside a volume will always fail.","goto":"cause:readonly-rootfs"}]},{"title":"Check the ownership the container sees","cmd":"docker exec {container} ls -ldn {path}","risk":"safe","look":"The numeric owner UID, not the name. Names differ between host and container; only the number matters."},{"title":"Check the mount type","cmd":"docker inspect {container} --format '{{json .Mounts}}'","risk":"safe","look":"A bind mount inherits host permissions exactly. A named volume is initialised from the image and usually avoids this entirely.","signals":[{"match":"\"Type\":\"bind\"","means":"Bind mount, so host ownership applies directly.","goto":"cause:uid-mismatch"},{"match":"\"Mode\":\"ro\"|\"RW\":false","means":"Mounted read-only. The flag, not the permissions.","goto":"cause:mounted-ro"}]}],"causes":[{"id":"uid-mismatch","cause":"The container's UID does not own the host directory.","fix":"Either chown the host directory to that UID, or run the container as the UID that owns it with --user.","confirm":""},{"id":"mounted-ro","cause":"The mount was declared read-only.","fix":"Drop the :ro suffix if writes are genuinely needed.","confirm":""},{"id":"readonly-rootfs","cause":"The container's root filesystem is read-only.","fix":"Mount a writable volume at the path that needs writes. Keep the rootfs read-only; it is a good default.","confirm":""},{"id":"selinux","cause":"SELinux is blocking the bind mount on the host.","fix":"Add the :z or :Z suffix to the mount. Not applicable on Docker Desktop for Windows.","confirm":""}],"verify":["The container reads and writes the path successfully.","The fix is in the compose file or run command, not a manual chmod that will be lost."],"escalate":["Container user and mount definition","ls -ldn output from inside the container","Host-side ownership of the directory"]},{"id":"docker-build-cache-miss","tier":"guide","technology":"Docker","category":"Build & Cache","title":"Docker build reruns every step instead of using cache","summary":"Builds that should take seconds take minutes. One early layer is invalidating everything after it.","aliases":["cache not working","build slow","rebuilds everything","cache miss","no cache used","docker build slow"],"source":"https://docs.docker.com/build/cache/","inputs":[{"key":"dockerfile","label":"Dockerfile","example":"Dockerfile"}],"steps":[{"title":"Build with plain progress and find the first miss","cmd":"docker build --progress=plain -f {dockerfile} . 2>&1 | findstr /C:\"CACHED\" /C:\"RUN\"","risk":"safe","look":"The first step that is not CACHED. Everything after it is invalidated by definition, so only that first miss matters.","signals":[{"match":"(?i)COPY \\. ","means":"Copying the whole context early invalidates the cache on any file change.","goto":"cause:copy-everything"}]},{"title":"Check how large the context being sent is","cmd":"docker build --progress=plain . 2>&1 | findstr /C:\"transferring context\"","risk":"safe","look":"A large context means .dockerignore is missing entries. node_modules and .git are the usual culprits."},{"title":"Check whether .dockerignore exists at all","cmd":"type .dockerignore","risk":"safe","look":"Its absence is the single most common reason builds are slow. Without it, every local file change busts the cache."}],"causes":[{"id":"copy-everything","cause":"COPY . happens before dependency installation.","fix":"Copy only the manifest files, install dependencies, then copy the rest. Dependencies then cache independently of source changes.","confirm":""},{"id":"no-dockerignore","cause":"No .dockerignore, so the whole directory is context.","fix":"Add one covering .git, node_modules, build output and local env files.","confirm":""},{"id":"timestamp-layer","cause":"An early RUN embeds a date or fetches something that changes each run.","fix":"Move it later, or pin what it fetches.","confirm":""},{"id":"no-cache-in-ci","cause":"CI starts with an empty cache every run.","fix":"Use a registry cache with --cache-from and --cache-to.","confirm":""}],"verify":["A rebuild with no source changes is almost entirely CACHED.","Context transfer is small."],"escalate":["The plain-progress output showing the first cache miss","Context size","The Dockerfile's first ten lines"]},{"id":"docker-compose-unhealthy","tier":"guide","technology":"Docker","category":"Compose","title":"Compose service never becomes healthy","summary":"docker compose up hangs on a dependency, or a service restarts forever waiting on another.","aliases":["compose unhealthy","dependency failed to start","waiting for healthy","compose hangs","service is unhealthy","depends_on"],"source":"https://docs.docker.com/reference/compose-file/services/","inputs":[{"key":"service","label":"Service name","example":"postgres"}],"steps":[{"title":"See which service is failing its health check","cmd":"docker compose ps","risk":"safe","look":"The STATUS column. 'starting' for a long time means the health check has not passed yet; 'unhealthy' means it has failed its retries.","signals":[{"match":"(?i)unhealthy","means":"The health check ran and failed repeatedly.","goto":"step:2"},{"match":"(?i)starting","means":"Still inside start_period. It may just need a longer allowance.","goto":"cause:start-period"}]},{"title":"Read the health check's actual output","cmd":"docker inspect $(docker compose ps -q {service}) --format '{{json .State.Health}}'","risk":"safe","look":"The Log array holds the last few probe results with their exit codes and output. This is the actual reason, not a guess."},{"title":"Read the service's own logs","cmd":"docker compose logs {service} --tail=80","risk":"safe","look":"Whether the process is genuinely failing or simply slower to start than the health check allows."}],"causes":[{"id":"healthcheck-wrong","cause":"The health check command is wrong for the image.","fix":"Test it manually with docker exec first. curl is often absent from slim images.","confirm":""},{"id":"start-period","cause":"The service needs longer to start than start_period allows.","fix":"Raise start_period. It exists precisely so slow starts are not counted as failures.","confirm":""},{"id":"dependency-order","cause":"depends_on without condition only waits for start, not for health.","fix":"Use condition: service_healthy so the dependent service actually waits.","confirm":""},{"id":"app-failing","cause":"The application is genuinely failing to start.","fix":"Fix the app. The health check is reporting correctly.","confirm":""}],"verify":["docker compose ps shows every service healthy.","A fresh docker compose up reaches healthy without manual intervention."],"escalate":["docker compose ps output","The State.Health log array","Service logs from startup"]},{"id":"docker-exec-format-error","tier":"guide","technology":"Docker","category":"Images","title":"exec format error when the container starts","summary":"The image was built for a different CPU architecture than the machine running it.","aliases":["exec format error","wrong architecture","arm64 amd64","no matching manifest","cannot execute binary","platform mismatch"],"source":"https://docs.docker.com/build/building/multi-platform/","inputs":[{"key":"container","label":"Container","example":"checkout-api"},{"key":"image","label":"Image","example":"registry.local/checkout-api:1.4.2"}],"steps":[{"title":"Compare the image architecture against the host","cmd":"docker image inspect {image} --format 'image={{.Architecture}}/{{.Os}}' && docker version --format 'host={{.Server.Arch}}/{{.Server.Os}}'","risk":"safe","look":"The two strings must match. arm64 against amd64 is the classic case, usually an image built on an Apple Silicon laptop and run on a cloud VM.","signals":[{"match":"image=arm64.*host=amd64|image=amd64.*host=arm64","means":"Architecture mismatch. The binary cannot execute on this CPU.","goto":"cause:arch-mismatch"},{"match":"image=\\w+/linux.*host=\\w+/windows","means":"OS mismatch. A Linux image cannot run in Windows container mode.","goto":"cause:os-mismatch"}]},{"title":"Check which platforms the registry actually offers","cmd":"docker manifest inspect {image}","risk":"safe","look":"A manifest list with several platform entries means a matching one exists and Docker picked wrong. A single entry means only one was ever published."},{"title":"Check whether a shebang is the real problem","cmd":"docker run --rm --entrypoint head {image} -1 /entrypoint.sh","risk":"safe","look":"exec format error also occurs when a script has no shebang line, or has a Windows CRLF line ending that corrupts it. This is a different cause with the same message."},{"title":"Pull explicitly for this platform","cmd":"docker pull --platform linux/amd64 {image}","risk":"state","look":"The pull succeeds and inspect now reports the expected architecture.","note":"Downloads another copy of the image and replaces the local tag reference. Disk usage grows and any container built from the previous local tag still uses the old one until recreated. If no matching platform was published this simply fails."}],"causes":[{"id":"arch-mismatch","cause":"The image was built for a different CPU architecture.","fix":"Build multi-platform with buildx, or build on the target architecture. Apple Silicon defaults to arm64 and this catches teams constantly.","confirm":""},{"id":"os-mismatch","cause":"A Linux image on a Windows container host.","fix":"Switch Docker Desktop to Linux containers.","confirm":""},{"id":"no-shebang","cause":"The entrypoint script has no shebang or has CRLF endings.","fix":"Add #!/bin/sh and save with LF endings. Set .gitattributes so Git does not convert it.","confirm":""},{"id":"single-platform","cause":"Only one platform was published.","fix":"Rebuild and push a manifest list covering both.","confirm":""}],"verify":["The container starts and stays running.","Image architecture matches the host.","CI publishes every platform the fleet actually runs."],"escalate":["Image and host architecture strings","Output of docker manifest inspect","The entrypoint's first line if a script"]},{"id":"docker-daemon-not-running","tier":"guide","technology":"Docker","category":"Daemon","title":"Cannot connect to the Docker daemon","summary":"Every docker command fails before reaching a container. The client cannot talk to the engine.","aliases":["cannot connect to the docker daemon","docker daemon not running","is the docker daemon running","pipe dockerdesktoplinuxengine","docker not responding","dial unix docker.sock"],"source":"https://docs.docker.com/engine/daemon/","inputs":[],"steps":[{"title":"Check whether the client can reach the engine at all","cmd":"docker version","risk":"safe","look":"The Client block always prints. If the Server block is missing, the client is fine and the engine is not reachable.","signals":[{"match":"(?i)error during connect|cannot connect","means":"The engine is not reachable from this client.","goto":"step:2"},{"match":"(?i)permission denied.*docker.sock","means":"The engine is running but your user cannot use the socket.","goto":"cause:socket-permission"}]},{"title":"Check whether Docker Desktop is actually running","cmd":"tasklist | findstr /I \"Docker Desktop\"","risk":"safe","look":"On Windows the engine lives inside Docker Desktop. No process means nothing to connect to, regardless of the client."},{"title":"Check what endpoint the client is trying","cmd":"docker context ls","risk":"safe","look":"The active context's endpoint. A leftover context pointing at a remote host or an old WSL distro produces exactly this error while Desktop runs happily.","signals":[{"match":"(?i)ssh://|tcp://","means":"Pointing at a remote engine that may be unreachable.","goto":"cause:wrong-context"}]},{"title":"Switch back to the default context","cmd":"docker context use default","risk":"state","look":"docker version now prints a Server block.","note":"Changes which engine every subsequent docker command talks to, for this user. Containers on the previously selected engine keep running but become invisible from this shell until you switch back."}],"causes":[{"id":"desktop-stopped","cause":"Docker Desktop is not running.","fix":"Start it and wait for the engine to report ready. It takes longer than the tray icon suggests.","confirm":""},{"id":"wrong-context","cause":"The active context points at an unreachable engine.","fix":"Switch to default. Contexts persist and are easy to forget.","confirm":""},{"id":"socket-permission","cause":"Your user is not permitted to use the socket.","fix":"On Linux add the user to the docker group and start a new session.","confirm":""},{"id":"wsl-stopped","cause":"The WSL backend distro is not running.","fix":"Restart WSL, then Docker Desktop.","confirm":""},{"id":"engine-crashed","cause":"The engine started and died.","fix":"Read the Docker Desktop diagnostic logs. Disk exhaustion on the VM is a common cause.","confirm":""}],"verify":["docker version prints a Server block.","docker ps returns without error.","The active context is the one you intend."],"escalate":["Output of docker version","Whether Docker Desktop is running","Output of docker context ls"]},{"id":"docker-healthcheck-failing","tier":"guide","technology":"Docker","category":"Container Lifecycle","title":"Container is running but marked unhealthy","summary":"The process is alive but the health check keeps failing, so dependent services never start.","aliases":["container unhealthy","healthcheck failing","health status unhealthy","healthcheck curl not found","unhealthy status","container health"],"source":"https://docs.docker.com/reference/dockerfile/#healthcheck","inputs":[{"key":"container","label":"Container","example":"checkout-api"}],"steps":[{"title":"Read the health check's recorded output","cmd":"docker inspect {container} --format '{{json .State.Health}}'","risk":"safe","look":"The Log array holds the last few probe attempts with exit codes and output. This is the actual reason rather than an inference.","signals":[{"match":"(?i)not found|no such file","means":"The health check command does not exist inside the image.","goto":"cause:command-missing"},{"match":"(?i)connection refused","means":"The app is not listening on the probed port yet or at all.","goto":"cause:not-listening"},{"match":"\"ExitCode\":1","means":"The command ran and reported failure.","goto":"cause:genuine-failure"}]},{"title":"Read the configured check","cmd":"docker inspect {container} --format '{{json .Config.Healthcheck}}'","risk":"safe","look":"The test, interval, timeout, retries and start period. A start period shorter than the real startup time guarantees early failures."},{"title":"Run the check yourself inside the container","cmd":"docker exec {container} sh -c \"<the-test-command>\"","risk":"safe","look":"The real exit code and output. Running it by hand removes all ambiguity about what the daemon is seeing."},{"title":"Check whether the tool the check uses even exists","cmd":"docker exec {container} sh -c \"which curl wget nc 2>/dev/null; echo done\"","risk":"safe","look":"Slim and distroless images frequently lack curl. A health check calling a missing binary fails forever and looks like an application problem."}],"causes":[{"id":"command-missing","cause":"The health check calls a binary the image does not contain.","fix":"Install it, or use something the image has. Many runtimes can check their own health without an external tool.","confirm":""},{"id":"not-listening","cause":"The app is not listening on the probed port.","fix":"Confirm the port and that it binds 0.0.0.0 rather than localhost.","confirm":""},{"id":"start-period-short","cause":"The container needs longer to start than start_period allows.","fix":"Raise start_period. Failures during it are not counted, which is exactly what it is for.","confirm":""},{"id":"genuine-failure","cause":"The application really is unhealthy.","fix":"Read its logs. The check is doing its job.","confirm":""},{"id":"wrong-port","cause":"The check probes a different port than the app uses.","fix":"Use the container's internal port, not the published host port.","confirm":""}],"verify":["docker ps shows healthy.","It stays healthy through a normal workload.","Dependent services start as expected."],"escalate":["The State.Health log array","The configured health check","Result of running the test manually"]},{"id":"docker-compose-env-not-substituted","tier":"guide","technology":"Docker","category":"Compose","title":"Variables in the compose file are empty","summary":"A ${VAR} in docker-compose.yml resolves to nothing and the container starts misconfigured.","aliases":["variable not set","compose env empty","env_file not working","variable substitution","warn the variable is not set","compose variables"],"source":"https://docs.docker.com/reference/compose-file/interpolation/","inputs":[{"key":"service","label":"Service","example":"api"},{"key":"var","label":"Variable","example":"DATABASE_URL"}],"steps":[{"title":"Render the fully resolved configuration","cmd":"docker compose config","risk":"safe","look":"Compose prints what it will actually use after all substitution. Anything empty here will be empty in the container, and warnings appear at the top.","signals":[{"match":"(?i)variable is not set","means":"Compose could not resolve a variable and substituted an empty string.","goto":"cause:no-dotenv"},{"match":"(?i)\\$\\{","means":"A literal placeholder survived, meaning it was escaped or malformed.","goto":"cause:escaped"}]},{"title":"Check the .env file location","cmd":"dir .env","risk":"safe","look":"Compose reads .env from the directory it is invoked in, not from where the compose file lives. Running from a parent directory silently loses it."},{"title":"Understand which mechanism you are using","cmd":"findstr /C:\"env_file\" /C:\"environment\" docker-compose.yml","risk":"safe","look":"env_file passes variables into the container. The .env file substitutes into the compose file itself. They are completely different and are constantly confused.","signals":[{"match":"(?i)env_file","means":"env_file populates the container's environment. It does not substitute into the YAML.","goto":"cause:wrong-mechanism"}]},{"title":"Check what the container actually received","cmd":"docker compose exec {service} printenv {var}","risk":"safe","look":"The final answer. Empty here with a correct compose config means the variable was never mapped into the service."}],"causes":[{"id":"no-dotenv","cause":"No .env file in the working directory.","fix":"Create it there, or pass --env-file explicitly. Compose does not search upward.","confirm":""},{"id":"wrong-mechanism","cause":"Using env_file where .env substitution was intended.","fix":"For values inside the YAML use .env. For values inside the container use environment or env_file.","confirm":""},{"id":"not-mapped","cause":"The variable is available to compose but not passed to the service.","fix":"Add it under environment on the service. Compose does not forward your shell environment automatically.","confirm":""},{"id":"escaped","cause":"The placeholder was escaped with $$.","fix":"$$ produces a literal dollar sign. Use a single $ for substitution.","confirm":""},{"id":"quoting","cause":"Quotes in the .env file are being taken literally.","fix":"Do not quote values in .env unless the quotes are part of the value.","confirm":""}],"verify":["docker compose config shows real values with no warnings.","printenv inside the container returns the value.","It works from a clean checkout."],"escalate":["Output of docker compose config","Whether .env exists in the invocation directory","Result of printenv inside the container"]},{"id":"docker-network-subnet-overlap","tier":"guide","technology":"Docker","category":"Networking & DNS","title":"Docker network conflicts with the corporate network","summary":"Creating a network fails, or containers break VPN or internal-host access after starting.","aliases":["pool overlaps","network conflict","cannot create network","vpn broken docker","address pool","subnet overlap docker"],"source":"https://docs.docker.com/engine/network/","inputs":[{"key":"network","label":"Network name","example":"app-net"}],"steps":[{"title":"Read the conflict error","cmd":"docker network create {network}","risk":"safe","look":"Docker names the overlapping pool. It allocates from 172.17.0.0/16 upward by default, which collides with many corporate ranges.","signals":[{"match":"(?i)Pool overlaps with other one|address already in use","means":"The requested range collides with an existing network.","goto":"cause:pool-exhausted"}]},{"title":"List the subnets already allocated","cmd":"docker network ls --format \"{{.Name}}\" | ForEach-Object { docker network inspect $_ --format '{{.Name}}' ; docker network inspect $_ | findstr Subnet }","risk":"safe","look":"Every Docker network's range. Stale networks from deleted compose projects often hold ranges nothing uses."},{"title":"Compare against the host's own routes","cmd":"route print -4 | findstr 172.","risk":"safe","look":"Whether a corporate or VPN route covers the same range. If so, containers will capture traffic meant for internal hosts and the symptom looks like a VPN failure."},{"title":"Remove unused networks to free ranges","cmd":"docker network prune","risk":"destructive","look":"The reclaimed list. Recreate your network afterwards and confirm the range.","note":"Deletes every network not currently used by a container. Any stopped container that expected a custom network will fail to start until it is recreated, and fixed IP assignments on those networks are lost. Run docker network ls first and recognise what is listed."}],"causes":[{"id":"pool-exhausted","cause":"The default address pools are used up or collide.","fix":"Set default-address-pools in the daemon configuration to a range your corporate network does not use.","confirm":""},{"id":"vpn-conflict","cause":"A Docker network overlaps a VPN route.","fix":"Pin the network to an explicit subnet outside the corporate range. Do this in the compose file so it is reproducible.","confirm":""},{"id":"stale-networks","cause":"Old networks hold ranges nothing needs.","fix":"Prune them. Compose leaves networks behind when projects are renamed.","confirm":""},{"id":"fixed-subnet-clash","cause":"Two compose projects declare the same explicit subnet.","fix":"Give each project its own range.","confirm":""}],"verify":["The network is created with a non-conflicting range.","Containers reach both the internet and internal hosts.","The VPN still works with containers running."],"escalate":["The overlap error verbatim","All allocated Docker subnets","The host's routing table for the conflicting range"]},{"id":"docker-copy-not-found","tier":"guide","technology":"Docker","category":"Build & Cache","title":"COPY fails with file not found during build","summary":"The file exists on disk but the build cannot see it. Context, ignore rules or stage boundaries.","aliases":["copy failed","file not found build","no such file or directory copy","lstat no such file","dockerfile copy error","build context"],"source":"https://docs.docker.com/reference/dockerfile/#copy","inputs":[{"key":"file","label":"File being copied","example":"dist/app.jar"}],"steps":[{"title":"Read which path the build could not find","cmd":"docker build . 2>&1 | findstr /C:\"not found\" /C:\"lstat\"","risk":"safe","look":"The path in the error is relative to the build context root, never to the Dockerfile's own location. That distinction causes most of these.","signals":[{"match":"(?i)lstat.*no such file","means":"The path does not exist relative to the context root.","goto":"cause:relative-to-context"},{"match":"(?i)from=.*not found","means":"Copying from a build stage that does not produce that path.","goto":"cause:stage-missing"}]},{"title":"Check the context root being sent","cmd":"docker build --progress=plain . 2>&1 | findstr /C:\"transferring context\"","risk":"safe","look":"The final argument to docker build sets the context. Building with a context of . while the file sits above it means the file is simply not available."},{"title":"Check whether .dockerignore excludes it","cmd":"type .dockerignore","risk":"safe","look":"An ignored file is invisible to COPY even though it exists. A broad pattern such as dist/ or *.jar is the usual cause and produces a confusing error."},{"title":"Check the path exists relative to the context","cmd":"dir {file}","risk":"safe","look":"Run this from the same directory you pass as the build context. If it fails here, the Dockerfile was never going to find it."}],"causes":[{"id":"relative-to-context","cause":"The path is relative to the Dockerfile rather than the context.","fix":"Paths in COPY are always relative to the context root. Adjust the path or the context.","confirm":""},{"id":"dockerignore","cause":".dockerignore excludes the file.","fix":"Add a negation pattern, or narrow the exclusion.","confirm":""},{"id":"not-built-yet","cause":"The artifact has not been produced.","fix":"Build it before docker build, or move the build into an earlier stage.","confirm":""},{"id":"stage-missing","cause":"COPY --from references a path the stage does not create.","fix":"Check the earlier stage's working directory and output path.","confirm":""},{"id":"outside-context","cause":"The file is above the context directory.","fix":"COPY cannot reach outside the context, ever. Move the file in or widen the context.","confirm":""}],"verify":["The build completes.","The file is present in the image at the expected path.","It builds the same way in CI from a clean checkout."],"escalate":["The COPY error verbatim","The build context path used","Contents of .dockerignore"]},{"id":"docker-logs-empty","tier":"guide","technology":"Docker","category":"Container Lifecycle","title":"docker logs shows nothing","summary":"The container is running but produces no log output, so you are debugging blind.","aliases":["no logs","docker logs empty","logs not showing","output buffered","cannot see logs","logs missing container"],"source":"https://docs.docker.com/engine/logging/","inputs":[{"key":"container","label":"Container","example":"checkout-api"}],"steps":[{"title":"Confirm the container is producing anything at all","cmd":"docker logs {container} --tail=50 --timestamps","risk":"safe","look":"Timestamps reveal whether output is old or absent. Output that stops at startup usually means buffering rather than silence.","signals":[{"match":"^\\s*$","means":"Nothing captured at all.","goto":"step:2"}]},{"title":"Check which logging driver is in use","cmd":"docker inspect {container} --format '{{.HostConfig.LogConfig.Type}}'","risk":"safe","look":"docker logs only works with json-file or journald. With any other driver it returns nothing by design, and that is not a fault.","signals":[{"match":"(?i)none","means":"Logging is disabled for this container.","goto":"cause:driver-none"},{"match":"(?i)syslog|fluentd|awslogs|gelf","means":"Logs go elsewhere. docker logs cannot read them.","goto":"cause:remote-driver"}]},{"title":"Check whether the app writes to a file instead of stdout","cmd":"docker exec {container} sh -c \"ls -la /var/log 2>/dev/null; ls -la /app/logs 2>/dev/null\"","risk":"safe","look":"Applications configured for a traditional server write to files. Only stdout and stderr reach docker logs."},{"title":"Check for output buffering","cmd":"docker exec {container} sh -c \"echo $PYTHONUNBUFFERED $NODE_ENV\"","risk":"safe","look":"Python buffers stdout when it is not a terminal, so output can sit unseen for a long time. PYTHONUNBUFFERED=1 fixes it and is why so many images set it."}],"causes":[{"id":"driver-none","cause":"The logging driver is none.","fix":"Change it to json-file. Someone probably set this to save disk.","confirm":""},{"id":"remote-driver","cause":"Logs are shipped to a remote system.","fix":"Read them there. docker logs is not broken.","confirm":""},{"id":"writes-to-file","cause":"The application logs to a file.","fix":"Reconfigure it to stdout, or symlink the file to /dev/stdout.","confirm":""},{"id":"buffered","cause":"Output is buffered because stdout is not a terminal.","fix":"Set PYTHONUNBUFFERED=1, or the equivalent for the runtime.","confirm":""},{"id":"rotated-away","cause":"Log rotation removed the output.","fix":"Raise max-size and max-file in the log options.","confirm":""}],"verify":["docker logs shows current application output.","New output appears without delay.","The driver suits how you actually read logs."],"escalate":["The logging driver in use","Whether the app writes to files","Any buffering environment variables"]},{"id":"docker-image-too-large","tier":"guide","technology":"Docker","category":"Images","title":"Image is far larger than expected","summary":"Slow pulls, slow deploys and wasted registry storage. Usually one layer.","aliases":["image too large","image size","slow pull","large docker image","reduce image size","bloated image"],"source":"https://docs.docker.com/build/building/best-practices/","inputs":[{"key":"image","label":"Image","example":"registry.local/checkout-api:1.4.2"}],"steps":[{"title":"See the size of every layer","cmd":"docker history {image} --no-trunc --format \"table {{.Size}}\\t{{.CreatedBy}}\"","risk":"safe","look":"The largest layer and the instruction that made it. One layer usually accounts for most of the size.","signals":[{"match":"(?i)apt-get install|yum install","means":"A package install layer. Cleaning in a later layer does not shrink it.","goto":"cause:package-cache"},{"match":"(?i)COPY \\. ","means":"The whole context was copied in.","goto":"cause:copied-everything"}]},{"title":"Compare against the base image","cmd":"docker image inspect {image} --format '{{.Size}}' && docker image ls","risk":"safe","look":"How much is base and how much is yours. A large base means switching to slim or alpine gains more than any other change."},{"title":"Check whether build tooling is in the final image","cmd":"docker run --rm {image} sh -c \"which gcc make git npm 2>/dev/null; echo ---\"","risk":"safe","look":"Compilers and package managers in a runtime image mean multi-stage is missing. They are also an attack surface."},{"title":"Check for a .dockerignore","cmd":"type .dockerignore","risk":"safe","look":"Without one, .git and node_modules are copied in. This routinely adds hundreds of megabytes nobody intended."}],"causes":[{"id":"package-cache","cause":"Package manager caches are baked into a layer.","fix":"Clean in the same RUN instruction. A later cleanup layer cannot remove data from an earlier one.","confirm":""},{"id":"copied-everything","cause":"COPY . brought in everything.","fix":"Add .dockerignore and copy only what the image needs.","confirm":""},{"id":"no-multistage","cause":"Build tooling ships in the runtime image.","fix":"Use multi-stage and copy only the artifact into a slim final stage.","confirm":""},{"id":"fat-base","cause":"The base image is large.","fix":"Move to a slim or distroless base. Test carefully; distroless has no shell.","confirm":""},{"id":"secrets-baked","cause":"Credentials were copied in during build.","fix":"They are recoverable from the layers. Rotate them and use build secrets instead.","confirm":""}],"verify":["The image is meaningfully smaller.","No build tooling in the runtime image.","Pull time improved in a real deployment."],"escalate":["Output of docker history sorted by size","Base image size","Whether .dockerignore exists"]},{"id":"docker-restart-loop","tier":"guide","technology":"Docker","category":"Container Lifecycle","title":"Container restarts endlessly","summary":"A restart policy keeps bringing back a container that immediately dies.","aliases":["restart loop","container restarting","always restarting","restart policy","keeps restarting docker","restarting (1)"],"source":"https://docs.docker.com/engine/containers/start-containers-automatically/","inputs":[{"key":"container","label":"Container","example":"checkout-api"}],"steps":[{"title":"Confirm the restart count is climbing","cmd":"docker inspect {container} --format 'restarts={{.RestartCount}} policy={{.HostConfig.RestartPolicy.Name}} status={{.State.Status}}'","risk":"safe","look":"A rising count with policy always means Docker is masking a failure that would otherwise be obvious.","signals":[{"match":"policy=always|policy=unless-stopped","means":"Docker will restart it forever regardless of why it dies.","goto":"cause:masked-failure"},{"match":"policy=on-failure","means":"Restarting only on non-zero exit, which is more informative.","goto":""}]},{"title":"Read the logs from before the last restart","cmd":"docker logs {container} --tail=100","risk":"safe","look":"Docker keeps logs across restarts in the same container, so the failure from previous attempts is still here."},{"title":"Read the last exit code","cmd":"docker inspect {container} --format 'exit={{.State.ExitCode}} oom={{.State.OOMKilled}} err={{.State.Error}}'","risk":"safe","look":"The same exit-code logic as a container that will not start. OOMKilled true means memory, not the application."},{"title":"Stop the loop so you can inspect it calmly","cmd":"docker update --restart=no {container} && docker stop {container}","risk":"state","look":"The container stays stopped. You can now inspect it without it disappearing under you.","note":"Changes the restart policy on the running container and then stops it. The service stays down until you start it again, so do not do this on something serving traffic without arranging cover. The policy change persists until you set it back."}],"causes":[{"id":"masked-failure","cause":"The restart policy hides a real failure.","fix":"Read the logs. Restarting is not a fix and the exit code tells you the category.","confirm":""},{"id":"dependency-not-ready","cause":"It starts before something it needs.","fix":"Add a retry with backoff in the application. depends_on does not wait for readiness by default.","confirm":""},{"id":"oom","cause":"The memory limit is too low.","fix":"Raise it or fix the leak. The container will loop forever otherwise.","confirm":""},{"id":"config-error","cause":"Configuration is wrong, so it fails at startup every time.","fix":"Fix the config. Every restart fails identically.","confirm":""},{"id":"port-conflict","cause":"It cannot bind its port.","fix":"Follow the port-already-allocated runbook.","confirm":""}],"verify":["The restart count stops climbing.","The container stays Up for a sustained period.","The underlying failure was fixed, not restarted past."],"escalate":["Restart count and policy","Logs from previous attempts","The last exit code and OOM flag"]},{"id":"docker-slow-build","tier":"guide","technology":"Docker","category":"Build & Cache","title":"Builds are extremely slow","summary":"Beyond cache misses, a few specific things make builds crawl.","aliases":["slow build","build takes forever","docker build slow","transferring context slow","build performance","buildkit slow"],"source":"https://docs.docker.com/build/cache/","inputs":[],"steps":[{"title":"Find where the time goes","cmd":"docker build --progress=plain . 2>&1 | findstr /C:\"DONE\" /C:\"transferring\"","risk":"safe","look":"Each step's duration. One dominating step tells you where to look, and it is often not the one you assumed.","signals":[{"match":"(?i)transferring context.*\\d{2,}\\.\\d+s","means":"Sending the context is slow, meaning it is too big.","goto":"cause:big-context"},{"match":"(?i)(apt-get|npm install|pip install).*\\d{2,}\\.\\d+s","means":"Dependency installation dominates. It should be cached.","goto":"cause:deps-not-cached"}]},{"title":"Measure the context size","cmd":"docker build . 2>&1 | findstr /C:\"transferring context\"","risk":"safe","look":"Anything above a few megabytes suggests .dockerignore is missing entries. The context is sent before the build starts."},{"title":"Check whether BuildKit is enabled","cmd":"docker buildx version","risk":"safe","look":"BuildKit parallelises independent stages and skips unused ones. The legacy builder does neither."},{"title":"Check for platform emulation","cmd":"docker buildx ls","risk":"safe","look":"Building linux/amd64 on an arm64 machine through QEMU is roughly ten times slower. This is a common hidden cause."}],"causes":[{"id":"big-context","cause":"The build context is large.","fix":"Add .dockerignore covering .git, node_modules and build output.","confirm":""},{"id":"deps-not-cached","cause":"Dependencies reinstall every build.","fix":"Copy the lockfile, install, then copy source. Ordering is everything.","confirm":""},{"id":"no-buildkit","cause":"Using the legacy builder.","fix":"Enable BuildKit. It is the default in current Docker but can be disabled.","confirm":""},{"id":"emulation","cause":"Cross-platform build through QEMU.","fix":"Build natively on the target architecture, or use a remote builder.","confirm":""},{"id":"no-ci-cache","cause":"CI starts cold every time.","fix":"Use --cache-from and --cache-to against a registry.","confirm":""},{"id":"single-stage","cause":"One huge stage does everything.","fix":"Split into stages so independent work runs in parallel.","confirm":""}],"verify":["Build time is meaningfully lower.","A no-change rebuild is almost entirely cached.","Context transfer is fast."],"escalate":["Per-step timings from plain progress","Context size","Whether BuildKit and native architecture are in use"]},{"id":"docker-cannot-remove","tier":"guide","technology":"Docker","category":"Container Lifecycle","title":"Cannot remove a container or image","summary":"Removal is refused because something still references it.","aliases":["cannot remove","conflict unable to remove","image is being used","container is running","image has dependent child images","cannot delete image"],"source":"https://docs.docker.com/reference/cli/docker/image/rm/","inputs":[{"key":"container","label":"Container","example":"checkout-api"},{"key":"image","label":"Image","example":"registry.local/checkout-api:1.4.2"}],"steps":[{"title":"Read what is blocking removal","cmd":"docker rm {container}","risk":"safe","look":"The conflict message names the blocker. Running container, dependent child image and in-use image are three different situations.","signals":[{"match":"(?i)container is running","means":"It is still running. Stop it first.","goto":"cause:still-running"},{"match":"(?i)image is being used by (running|stopped) container","means":"A container references the image.","goto":"cause:used-by-container"},{"match":"(?i)dependent child images","means":"Another image was built on top of this one.","goto":"cause:child-images"}]},{"title":"Find which containers reference the image","cmd":"docker ps -a --filter ancestor={image}","risk":"safe","look":"Every container built from it, including stopped ones. Stopped containers hold images just as firmly as running ones."},{"title":"Find images built on top of it","cmd":"docker image ls --filter since={image}","risk":"safe","look":"Child images. The parent cannot be removed while any child exists."},{"title":"Stop and remove the container properly","cmd":"docker stop {container} && docker rm {container}","risk":"state","look":"The container is gone from docker ps -a. Volumes it used remain unless you also remove them.","note":"Sends SIGTERM then SIGKILL after the timeout, then deletes the container and its writable layer. Anything written inside the container but not to a volume is permanently lost. Check what is mounted before running this."}],"causes":[{"id":"still-running","cause":"The container is running.","fix":"Stop it first, or use -f if you are certain. -f sends SIGKILL with no clean shutdown.","confirm":""},{"id":"used-by-container","cause":"A container references the image.","fix":"Remove the containers first. Stopped ones count.","confirm":""},{"id":"child-images","cause":"Another image was built from it.","fix":"Remove the children first, or use -f to untag only.","confirm":""},{"id":"volume-in-use","cause":"A volume is still referenced.","fix":"Remove the containers using it. Volumes outlive containers deliberately.","confirm":""},{"id":"dangling-only","cause":"You want to clean untagged images.","fix":"docker image prune targets exactly those.","confirm":""}],"verify":["The container or image is removed.","Nothing that was still needed was deleted.","Disk usage reflects the removal."],"escalate":["The conflict message verbatim","Containers referencing the image","Whether child images exist"]},{"id":"docker-dns-inside-container","tier":"guide","technology":"Docker","category":"Networking & DNS","title":"DNS does not work inside containers","summary":"The container has network access but cannot resolve names.","aliases":["dns not working docker","cannot resolve inside container","temporary failure in name resolution","docker dns","resolv.conf container","name resolution container"],"source":"https://docs.docker.com/engine/network/#dns-services","inputs":[{"key":"container","label":"Container","example":"checkout-api"}],"steps":[{"title":"Test resolution from inside","cmd":"docker exec {container} sh -c \"getent hosts github.com || echo FAIL\"","risk":"safe","look":"Whether external resolution works at all. FAIL with working connectivity to an IP address isolates it to DNS.","signals":[{"match":"(?i)FAIL","means":"No external resolution.","goto":"step:2"}]},{"title":"Read the container's resolver configuration","cmd":"docker exec {container} cat /etc/resolv.conf","risk":"safe","look":"On a user-defined network you should see 127.0.0.11, Docker's embedded resolver. Anything else means it is using host or explicit DNS.","signals":[{"match":"127\\.0\\.0\\.11","means":"Docker's embedded DNS, which forwards to the host's resolvers.","goto":"cause:host-resolver"},{"match":"nameserver 8\\.8\\.8\\.8","means":"Public DNS, which corporate networks often block.","goto":"cause:public-dns-blocked"}]},{"title":"Check the host can resolve","cmd":"nslookup github.com","risk":"safe","look":"Docker's embedded resolver forwards to the host's configured servers. If the host cannot resolve, no container will."},{"title":"Check for a VPN changing the host's resolvers","cmd":"ipconfig /all | findstr /C:\"DNS Servers\"","risk":"safe","look":"Connecting a VPN after Docker started leaves containers pointing at the pre-VPN resolvers, which is a very common cause."}],"causes":[{"id":"host-resolver","cause":"The host's resolvers are unreachable from the container.","fix":"Restart the container so it picks up current settings, or set dns explicitly.","confirm":""},{"id":"public-dns-blocked","cause":"Public DNS is blocked by the corporate network.","fix":"Configure the daemon with the internal resolvers.","confirm":""},{"id":"vpn-changed","cause":"The VPN changed the host's DNS after the container started.","fix":"Restart the container. resolv.conf is written at creation.","confirm":""},{"id":"wrong-network","cause":"On the default bridge, container names do not resolve.","fix":"Use a user-defined network for name-based discovery.","confirm":""},{"id":"search-domain","cause":"A search domain is appended unexpectedly.","fix":"Check the search line. It can turn an external lookup into an internal one.","confirm":""}],"verify":["Names resolve from inside the container.","Both internal and external names work.","It survives a container restart."],"escalate":["Contents of resolv.conf inside the container","Whether the host resolves","Whether a VPN is connected"]},{"id":"git-committed-to-main","tier":"guide","technology":"Git","category":"History & Undo","title":"I committed to main by mistake","summary":"The commit is on the wrong branch. What you do next depends entirely on whether it has been pushed.","aliases":["committed to main","wrong branch","committed accidentally","undo commit","committed by mistake","move commit to branch","oops committed"],"source":"https://git-scm.com/docs/git-reset","inputs":[{"key":"branch","label":"Branch you meant to use","example":"feature/checkout-retry"},{"key":"remote","label":"Remote","example":"origin"}],"steps":[{"title":"Find out whether the commit has left your machine","cmd":"git status -sb && git log --oneline -3","risk":"safe","look":"The first line. 'ahead 1' means it is still local and you have easy options. If it is not ahead, it is already on the remote and rewriting is now other people's problem too.","signals":[{"match":"ahead \\d+","means":"Still local. You can move it cleanly.","goto":"cause:local-only"},{"match":"\\[origin/main\\]\\s*$","means":"Already pushed. Do not rewrite shared history.","goto":"cause:already-pushed"}]},{"title":"Move the commit onto the branch it belonged on","cmd":"git branch {branch} && git reset --hard HEAD~1 && git switch {branch}","risk":"destructive","note":"reset --hard discards every uncommitted change in your working tree. Run git stash first if you have any. This is only safe because git branch {branch} was created on the line before, so the commit itself survives on that branch.","look":"After this, main is back where it was and your commit sits on {branch}.","signals":[{"match":"(?i)error: .*already exists","means":"That branch already exists. Pick another name or switch to it and cherry-pick instead.","goto":"cause:branch-exists"}]},{"title":"Confirm nothing was lost","cmd":"git log --oneline -3 {branch} && git log --oneline -3 main","risk":"safe","look":"Your commit on {branch}, and main matching the remote. If anything looks wrong, git reflog still has every prior position for about 90 days."}],"causes":[{"id":"local-only","cause":"The commit exists only in your clone.","fix":"Create the branch at the current commit, then reset main back one. Nobody else is affected.","confirm":"git status -sb"},{"id":"already-pushed","cause":"The commit is on the remote and others may have pulled it.","fix":"Do not reset and force-push. Use git revert to add a new commit that undoes it, then apply the original work on a proper branch.","confirm":"git log --oneline {remote}/main -3"},{"id":"branch-exists","cause":"A branch with that name is already present.","fix":"Switch to it and cherry-pick the commit across, then reset main.","confirm":"git branch --list {branch}"}],"verify":["git log on main matches the remote's main.","Your commit appears in git log on {branch}.","git status reports a clean working tree, or exactly the changes you stashed."],"escalate":["Output of git status -sb","git log --oneline -5 for both branches","Whether the commit was pushed, and whether anyone has pulled since"]},{"id":"git-force-push-safely","tier":"guide","technology":"Git","category":"Remotes","title":"I need to force-push a rebased branch"
