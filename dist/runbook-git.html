g","cause":"The commit is in the reflog.","fix":"git branch <name> <sha>. Reflog entries last about ninety days by default.","confirm":""},{"id":"not-in-reflog","cause":"Not in this clone's reflog.","fix":"Check the remote, or another teammate's clone. Reflogs are strictly local and are not shared.","confirm":""},{"id":"was-pushed","cause":"The branch existed on the remote.","fix":"git fetch origin <branch>:<branch> restores it directly. Far simpler than reflog archaeology.","confirm":""},{"id":"gc-collected","cause":"Garbage collection removed the objects.","fix":"If fsck finds nothing and no remote has it, the work is gone. This is rare within the reflog window.","confirm":""}],"verify":["The branch exists with the expected commits.","git log matches what you remember.","It is pushed so it cannot be lost locally again."],"escalate":["Reflog entries mentioning the branch","Output of git fsck --lost-found","Whether the branch was ever pushed"]},{"id":"git-submodule-empty","tier":"guide","technology":"Git","category":"Submodules","title":"Submodule directory is empty after clone","summary":"The folder exists but contains nothing. Submodules are not fetched by default.","aliases":["submodule empty","submodule not cloned","empty directory clone","submodule init","missing submodule","submodule not updating"],"source":"https://git-scm.com/docs/git-submodule","inputs":[{"key":"submodule","label":"Submodule path","example":"vendor/shared-lib"}],"steps":[{"title":"Check the submodule's recorded state","cmd":"git submodule status","risk":"safe","look":"A leading minus means not initialised. A plus means it is at a different commit than the parent records. A space means it is correct.","signals":[{"match":"^-","means":"Not initialised. Nothing has been fetched.","goto":"cause:not-initialised"},{"match":"^\\+","means":"Checked out at a different commit than the parent expects.","goto":"cause:wrong-commit"}]},{"title":"Initialise and fetch everything","cmd":"git submodule update --init --recursive","risk":"safe","look":"Populates every submodule at the commit the parent records. Recursive matters when submodules contain their own."},{"title":"Check the submodule URL is reachable","cmd":"git config --file .gitmodules --get-regexp url","risk":"safe","look":"An SSH URL fails in CI that only has HTTPS credentials. This is a very common cause of submodules working locally and not in a pipeline."},{"title":"Check the parent records a commit that still exists","cmd":"git ls-tree HEAD {submodule}","risk":"safe","look":"The recorded SHA. If that commit was force-pushed away in the submodule repository, the checkout can never succeed."}],"causes":[{"id":"not-initialised","cause":"Submodules were not fetched on clone.","fix":"git submodule update --init --recursive, or clone with --recurse-submodules.","confirm":""},{"id":"wrong-commit","cause":"The submodule is at a different commit.","fix":"update restores the recorded one. If you intended the new commit, commit that pointer in the parent.","confirm":""},{"id":"url-unreachable","cause":"The submodule URL cannot be reached.","fix":"Use a URL scheme the environment can authenticate to. Add an insteadOf rule for CI.","confirm":""},{"id":"commit-gone","cause":"The recorded commit no longer exists upstream.","fix":"Someone force-pushed the submodule repository. Update the parent to a commit that exists.","confirm":""},{"id":"ci-not-fetching","cause":"CI does not fetch submodules.","fix":"Enable submodules in the checkout step. Most CI systems skip them by default.","confirm":""}],"verify":["The submodule directory has content.","git submodule status shows no prefix.","A fresh clone works in CI, not only locally."],"escalate":["Output of git submodule status","The submodule URLs from .gitmodules","Whether it works in CI as well as locally"]},{"id":"git-credential-loop","tier":"guide","technology":"Git","category":"Remotes","title":"Git keeps asking for credentials","summary":"Every push or pull prompts, or an old credential is reused and rejected.","aliases":["asking for password","credential prompt","authentication failed git","support for password authentication was removed","credential manager","keeps asking username"],"source":"https://git-scm.com/docs/gitcredentials","inputs":[{"key":"remote","label":"Remote","example":"origin"}],"steps":[{"title":"Check the remote URL scheme","cmd":"git remote -v","risk":"safe","look":"HTTPS uses a token through a credential helper. SSH uses a key. Which one you have determines everything that follows.","signals":[{"match":"https://","means":"HTTPS. A personal access token is needed; passwords no longer work.","goto":"cause:needs-token"},{"match":"git@|ssh://","means":"SSH. The key is the credential.","goto":"cause:ssh-key"}]},{"title":"Check which credential helper is configured","cmd":"git config --show-origin credential.helper","risk":"safe","look":"On Windows this should be manager. No helper means Git cannot store anything and will prompt every time."},{"title":"Check what is cached for the host","cmd":"cmdkey /list | findstr git","risk":"safe","look":"Stored Windows credentials. A stale entry with an expired token is reused silently and produces repeated failures."},{"title":"Remove the stale credential","cmd":"cmdkey /delete:git:https://github.com","risk":"state","look":"The next push prompts once, then stores the new credential and stops asking.","note":"Deletes the stored credential for that host from Windows Credential Manager. The next Git operation will prompt for a fresh one, so have the new token ready. Other tools using the same stored credential will also start prompting."}],"causes":[{"id":"needs-token","cause":"HTTPS with a password.","fix":"Password authentication was removed. Use a personal access token as the password.","confirm":""},{"id":"stale-credential","cause":"An expired token is cached.","fix":"Delete it from Credential Manager. Git will not overwrite it on its own.","confirm":""},{"id":"no-helper","cause":"No credential helper.","fix":"git config --global credential.helper manager.","confirm":""},{"id":"ssh-key","cause":"SSH key is not loaded or not authorised.","fix":"Follow the SSH runbook. Test with ssh -T git@github.com.","confirm":""},{"id":"wrong-account","cause":"Cached credentials belong to another account.","fix":"Common with work and personal accounts. Clear the entry and use the right one.","confirm":""},{"id":"token-scope","cause":"The token lacks repo scope.","fix":"Regenerate with the right scopes. Read-only tokens fail on push with a confusing message.","confirm":""}],"verify":["Push and pull work without prompting.","The stored credential is for the right account.","The token has an expiry you know about."],"escalate":["Remote URL scheme","Configured credential helper","Stored credentials for the host"]},{"id":"git-lost-stash","tier":"guide","technology":"Git","category":"History & Undo","title":"I lost a stash","summary":"A stash was dropped, popped into a conflict, or cleared. The content usually still exists.","aliases":["lost stash","stash gone","stash drop","stash clear","recover stash","stash disappeared"],"source":"https://git-scm.com/docs/git-stash","inputs":[],"steps":[{"title":"Check what stashes remain","cmd":"git stash list","risk":"safe","look":"Empty means they were dropped or cleared. Stash entries are commits, and dropping one only removes the reference.","signals":[{"match":"stash@\\{","means":"Stashes exist. Check whether the one you want is among them.","goto":""},{"match":"^\\s*$","means":"No stashes listed. Look for dangling commits.","goto":"step:2"}]},{"title":"Find dangling stash commits","cmd":"git fsck --unreachable 2>&1 | findstr commit","risk":"safe","look":"Unreachable commits still in the object store. A stash creates a merge commit, which is a strong identifying signal."},{"title":"Inspect a candidate before acting","cmd":"git show --stat <sha>","risk":"safe","look":"Confirm it is your work. A stash commit shows the working tree state at the time it was created."},{"title":"Restore it as a branch","cmd":"git branch recovered-stash <sha>","risk":"safe","look":"Creates a branch at that commit so it can never be garbage collected. Nothing else is modified."}],"causes":[{"id":"dropped","cause":"The stash was dropped.","fix":"Find the commit in fsck output and branch from it. git stash drop prints the SHA; scroll back in the terminal.","confirm":""},{"id":"popped-conflict","cause":"A pop conflicted and the entry was kept.","fix":"Check git stash list. Pop keeps the entry when it conflicts, precisely so nothing is lost.","confirm":""},{"id":"cleared","cause":"git stash clear was run.","fix":"The commits become unreachable but remain until garbage collection. fsck finds them.","confirm":""},{"id":"wrong-repo","cause":"The stash is in a different clone.","fix":"Stashes are local and are never pushed. Check other clones.","confirm":""},{"id":"gc-collected","cause":"Garbage collection removed them.","fix":"If fsck finds nothing, they are gone. This is why stashes are for hours, not weeks.","confirm":""}],"verify":["The work is on a branch.","git log shows the expected content.","It is committed properly rather than stashed again."],"escalate":["Output of git stash list","Unreachable commits from fsck","What git show reveals for each candidate"]},{"id":"git-slow-repo","tier":"guide","technology":"Git","category":"Performance","title":"Git operations are very slow","summary":"status, checkout and commit take many seconds in a repository that should be fast.","aliases":["git slow","status slow","checkout slow","large repository","git performance","slow commit"],"source":"https://git-scm.com/docs/git-gc","inputs":[],"steps":[{"title":"Measure where the time goes","cmd":"git count-objects -vH","risk":"safe","look":"size-pack and the loose object count. Many loose objects or a very large pack both slow everything down.","signals":[{"match":"count: [1-9]\\d{4,}","means":"Tens of thousands of loose objects. Repacking will help substantially.","goto":"cause:loose-objects"},{"match":"size-pack: \\d+\\.\\d+ GiB","means":"A multi-gigabyte pack. Large binaries are likely in history.","goto":"cause:large-history"}]},{"title":"Find the largest objects in history","cmd":"git rev-list --objects --all | git cat-file --batch-check=\"%(objectsize) %(rest)\" | sort -rn | head -10","risk":"safe","look":"Sizes in bytes with paths. Binaries committed years ago still cost every clone, forever."},{"title":"Check the working tree size","cmd":"git status --porcelain | measure-object -line && dir /s /b | measure-object -line","risk":"safe","look":"A very large working tree makes status slow regardless of history. Untracked build output is a common cause."},{"title":"Repack the repository","cmd":"git gc --aggressive --prune=now","risk":"destructive","look":"count-objects shows far fewer loose objects and a smaller total.","note":"Repacks objects and permanently deletes anything unreachable, including reflog entries beyond the expiry and dropped stashes. If you are also trying to recover lost work, do that first — this removes exactly the objects fsck would have found. It can take a long time on a large repository."}],"causes":[{"id":"loose-objects","cause":"Many loose objects.","fix":"git gc packs them. Routine maintenance usually handles it automatically.","confirm":""},{"id":"large-history","cause":"Large binaries in history.","fix":"They cost every clone forever. Removing them requires a coordinated history rewrite.","confirm":""},{"id":"untracked-files","cause":"Many untracked files slow status.","fix":"Add build output to .gitignore. Git scans everything otherwise.","confirm":""},{"id":"no-fsmonitor","cause":"Status scans the whole tree every time.","fix":"Enable core.fsmonitor on a large repository.","confirm":""},{"id":"antivirus","cause":"Antivirus scans every file Git touches.","fix":"Exclude the repository directory. On Windows this is frequently the dominant cost.","confirm":""},{"id":"should-use-lfs","cause":"Large assets are tracked directly.","fix":"Move them to Git LFS going forward.","confirm":""}],"verify":["Common operations feel fast.","Loose object count is low.","Large binaries are in LFS or excluded."],"escalate":["Output of git count-objects -vH","The largest objects in history","Whether antivirus scans the repository"]},{"id":"git-cherry-pick-conflict","tier":"guide","technology":"Git","category":"Merging","title":"Cherry-pick stops with a conflict","summary":"A commit does not apply cleanly to this branch because its context differs.","aliases":["cherry-pick conflict","could not apply","cherry pick failed","after resolving conflicts","backport conflict","cherry-pick error"],"source":"https://git-scm.com/docs/git-cherry-pick","inputs":[{"key":"sha","label":"Commit to pick","example":"a1b2c3d"}],"steps":[{"title":"See which files conflicted","cmd":"git status --short","risk":"safe","look":"UU entries are conflicts. Cherry-pick applies a diff, so it fails whenever surrounding context differs from the original branch.","signals":[{"match":"^UU ","means":"Content conflict. Resolve as with a merge.","goto":"cause:context-differs"},{"match":"^(DU|UD) ","means":"The file does not exist here in the same form.","goto":"cause:missing-file"}]},{"title":"Look at what the original commit changed","cmd":"git show {sha}","risk":"safe","look":"The intended change. Resolving well means reproducing that intent here, not just making the markers go away."},{"title":"Check whether the change is already present","cmd":"git log --oneline --grep=\"$(git log -1 --format=%s {sha})\"","risk":"safe","look":"A commit with the same subject already on this branch means it was backported and the pick is unnecessary."},{"title":"Abort and return to a clean state","cmd":"git cherry-pick --abort","risk":"destructive","look":"A clean working tree at the pre-pick commit.","note":"Discards the in-progress cherry-pick along with any conflict resolution you have done. Committed history is untouched, but unsaved resolution work is lost. Use --skip instead if you want to abandon only this commit in a multi-commit pick."}],"causes":[{"id":"context-differs","cause":"The surrounding code differs from the source branch.","fix":"Resolve to the intended final state. Read the original commit to understand the intent.","confirm":""},{"id":"missing-file","cause":"The file does not exist on this branch.","fix":"The change may need adapting rather than picking. Consider whether it applies at all.","confirm":""},{"id":"already-applied","cause":"The change is already here.","fix":"Skip it. git cherry-pick --skip moves on in a multi-commit pick.","confirm":""},{"id":"needs-dependency","cause":"The commit depends on an earlier one not present.","fix":"Pick the dependency first, or pick the range.","confirm":""},{"id":"should-merge","cause":"You are picking many commits.","fix":"A merge or rebase is usually better than a long sequence of cherry-picks.","confirm":""}],"verify":["The cherry-pick completes.","The change works on this branch, not just compiles.","Tests pass."],"escalate":["Which files conflicted","The original commit's diff","Whether the change is already present"]},{"id":"git-wrong-branch-work","tier":"guide","technology":"Git","category":"Branches","title":"I did my work on the wrong branch","summary":"Changes are on main or another branch and need moving, committed or not.","aliases":["wrong branch","work on wrong branch","move changes branch","committed to wrong branch","should have branched"],"source":"https://git-scm.com/docs/git-switch","inputs":[{"key":"branch","label":"Branch it should be on","example":"feature/checkout-retry"}],"steps":[{"title":"Check whether the work is committed","cmd":"git status -sb && git log --oneline -3","risk":"safe","look":"Uncommitted changes move trivially. Committed ones need the branch pointer moved instead.","signals":[{"match":"^ M|^M |^\\?\\?","means":"Uncommitted. Switching branches carries them across.","goto":"cause:uncommitted"},{"match":"ahead \\d+","means":"Committed but not pushed. Move the commits.","goto":"cause:committed-local"}]},{"title":"For uncommitted work, just switch","cmd":"git switch -c {branch}","risk":"safe","look":"Uncommitted changes follow you to the new branch. Nothing is lost and no history changes."},{"title":"For committed work, create the branch here first","cmd":"git branch {branch}","risk":"safe","look":"The branch now points at your commits. They are safe regardless of what you do to the original branch next."},{"title":"Reset the original branch back","cmd":"git reset --hard origin/main","risk":"destructive","look":"The current branch matches the remote. Your work is on {branch}.","note":"Discards every commit and every uncommitted change on the current branch beyond origin/main. This is only safe because the previous step created {branch} at the current commit, so the work survives there. Run git log {branch} and confirm your commits are listed before running this."}],"causes":[{"id":"uncommitted","cause":"The work is not committed.","fix":"git switch -c carries it across. Simplest case.","confirm":""},{"id":"committed-local","cause":"Committed but not pushed.","fix":"Branch here, then reset the original. Nothing is shared yet so nothing breaks.","confirm":""},{"id":"already-pushed","cause":"The commits are on the remote.","fix":"Do not reset and force-push a shared branch. Use git revert on the original and apply the work properly on a branch.","confirm":""},{"id":"partial","cause":"Only some changes belong on the branch.","fix":"Use git stash push with specific paths, or commit selectively with git add -p.","confirm":""}],"verify":["The work is on the intended branch.","The original branch matches its remote.","Nothing shared was rewritten."],"escalate":["git status -sb","git log on both branches","Whether the commits were pushed"]},{"id":"git-reverting-a-merge","tier":"guide","technology":"Git","category":"History & Undo","title":"I need to undo a merge","summary":"A merge introduced a problem and must be reversed. Merges revert differently from ordinary commits.","aliases":["revert merge","undo merge","mainline","commit is a merge but no -m option","rollback merge","bad merge"],"source":"https://git-scm.com/docs/git-revert","inputs":[{"key":"sha","label":"Merge commit","example":"a1b2c3d"}],"steps":[{"title":"Confirm it is a merge and find its parents","cmd":"git show --no-patch --format='%h parents: %p' {sha}","risk":"safe","look":"Two parent hashes means a merge. Reverting one requires saying which side to keep, and that is what -m specifies.","signals":[{"match":"parents: \\w+ \\w+","means":"A merge commit with two parents. Reverting needs -m.","goto":"cause:needs-mainline"}]},{"title":"Check whether it has been pushed","cmd":"git branch -r --contains {sha}","risk":"safe","look":"Any remote branch listed means others may have it. That rules out rewriting history and points at revert instead."},{"title":"Revert keeping the first parent","cmd":"git revert -m 1 {sha}","risk":"state","look":"A new revert commit. The merged changes are gone from the working tree.","note":"Creates a new commit undoing the merged changes. History is not rewritten, which makes this safe for shared branches. Be aware that re-merging the same branch later will not reintroduce those changes, because Git considers them already merged — you must revert the revert first."},{"title":"Confirm the result","cmd":"git log --oneline -5 && git status","risk":"safe","look":"The revert commit on top and a clean tree. Run the tests; a reverted merge can leave a half-consistent state if other work depended on it."}],"causes":[{"id":"needs-mainline","cause":"Reverting a merge needs -m.","fix":"-m 1 keeps the branch you merged into, which is what you want almost always.","confirm":""},{"id":"not-pushed","cause":"The merge is local only.","fix":"git reset --hard to the commit before it is cleaner than a revert. No history is shared yet.","confirm":""},{"id":"remerge-problem","cause":"You reverted and now cannot re-merge.","fix":"Revert the revert. Git sees the branch as already merged otherwise.","confirm":""},{"id":"wrong-parent","cause":"Reverted with the wrong -m value.","fix":"Revert that revert and redo with the correct parent.","confirm":""},{"id":"dependent-work","cause":"Later commits depend on the merged code.","fix":"Reverting will break them. Fix forward instead.","confirm":""}],"verify":["The problem is gone.","Tests pass.","The path to re-merging later is understood."],"escalate":["The merge commit's parents","Whether it is on any remote","Test results after the revert"]},{"id":"git-bisect-find-bad-commit","tier":"guide","technology":"Git","category":"Debugging","title":"Something broke and I do not know which commit did it","summary":"A bug appeared somewhere in a range of commits. Bisect finds it in a handful of steps.","aliases":["which commit broke","bisect","find bad commit","regression","worked before","when did this break"],"source":"https://git-scm.com/docs/git-bisect","inputs":[{"key":"good","label":"A commit known good","example":"v1.3.0"},{"key":"bad","label":"A commit known bad","example":"HEAD"}],"steps":[{"title":"Confirm the endpoints really are good and bad","cmd":"git log --oneline {good}..{bad} | measure-object -line","risk":"safe","look":"How many commits are in the range. Bisect needs about log2 of that many tests, so even hundreds of commits take under ten steps."},{"title":"Start the bisect","cmd":"git bisect start {bad} {good}","risk":"state","look":"Git reports roughly how many steps remain and checks out a middle commit.","note":"Checks out a commit partway through the range, leaving you in detached HEAD. Any uncommitted work is in the way and should be committed or stashed first. git bisect reset returns you to where you started."},{"title":"Test and mark each checkout","cmd":"git bisect good","risk":"safe","look":"Use good or bad after testing each one. Git halves the range each time and tells you how many steps are left."},{"title":"Return to where you started","cmd":"git bisect reset","risk":"state","look":"You are back on your original branch with a clean tree.","note":"Leaves bisect mode and restores your original branch. Do this when finished, or the repository stays in detached HEAD and subsequent commits will not belong to any branch."}],"causes":[{"id":"found-it","cause":"Bisect names the first bad commit.","fix":"Read that commit. It is usually obvious once you know which one it is.","confirm":""},{"id":"flaky-test","cause":"The test is not deterministic.","fix":"Bisect needs a reliable signal. Make the check deterministic first or the result is meaningless.","confirm":""},{"id":"skip-needed","cause":"Some commits cannot be built or tested.","fix":"git bisect skip. Git works around them.","confirm":""},{"id":"automate-it","cause":"Testing by hand is slow.","fix":"git bisect run <script>. An exit code of zero means good, non-zero means bad.","confirm":""},{"id":"wrong-endpoints","cause":"The good commit is not actually good.","fix":"The result will be wrong. Verify both endpoints before starting.","confirm":""}],"verify":["The first bad commit is identified.","The repository is out of bisect mode.","The cause is understood, not just located."],"escalate":["The bisect result","How the good and bad endpoints were verified","The test used at each step"]},{"id":"git-rebase-gone-wrong","tier":"guide","technology":"Git","category":"Merging","title":"A rebase went wrong and I want out","summary":"Mid-rebase, conflicts everywhere, or the result looks nothing like what was intended.","aliases":["rebase gone wrong","abort rebase","rebase mess","interactive rebase","rebase conflicts everywhere","undo rebase"],"source":"https://git-scm.com/docs/git-rebase","inputs":[],"steps":[{"title":"Check whether a rebase is in progress","cmd":"git status | findstr /C:\"rebase\"","risk":"safe","look":"Whether you are mid-rebase. That determines whether you abort or undo a finished one.","signals":[{"match":"rebase in progress","means":"Still mid-rebase. Abort returns you cleanly.","goto":"cause:in-progress"},{"match":"^\\s*$","means":"No rebase in progress. A finished rebase is undone through the reflog.","goto":"cause:already-finished"}]},{"title":"Abort an in-progress rebase","cmd":"git rebase --abort","risk":"safe","look":"Returns to exactly where you started. Nothing committed is lost, only the conflict resolution you had done."},{"title":"For a finished rebase, find where you were","cmd":"git reflog -20","risk":"safe","look":"The entry just before the rebase started, usually marked rebase (start). That SHA is your pre-rebase state."},{"title":"Reset back to the pre-rebase commit","cmd":"git reset --hard <sha-before-rebase>","risk":"destructive","look":"git log matches what you had before the rebase.","note":"Discards the rebased commits and any uncommitted changes, returning the branch to its pre-rebase state. The rebased commits remain in the reflog for about ninety days, so this is recoverable, but anything uncommitted right now is not. Verify the SHA with git show before running it."}],"causes":[{"id":"in-progress","cause":"A rebase is in progress.","fix":"git rebase --abort. Clean and complete.","confirm":""},{"id":"already-finished","cause":"The rebase completed and the result is wrong.","fix":"Find the pre-rebase SHA in the reflog and reset to it.","confirm":""},{"id":"too-many-conflicts","cause":"Every commit conflicts.","fix":"You are probably rebasing onto the wrong base. Check the target branch.","confirm":""},{"id":"shared-branch","cause":"The branch was rebased after being pushed.","fix":"Everyone who pulled now has divergent history. Coordinate before force-pushing.","confirm":""},{"id":"should-merge","cause":"Rebasing a long-lived branch.","fix":"Merge instead. Rebase suits short private branches.","confirm":""}],"verify":["The branch is in the state you intended.","git status is clean.","No shared history was rewritten without agreement."],"escalate":["Whether a rebase is in progress","Reflog around the rebase","What the branch looked like before"]},{"id":"git-large-clone-slow","tier":"guide","technology":"Git","category":"Performance","title":"Cloning the repository takes forever","summary":"A fresh clone takes many minutes, which slows onboarding and every CI run.","aliases":["clone slow","large repo clone","shallow clone","partial clone","clone takes forever","ci clone slow"],"source":"https://git-scm.com/docs/git-clone","inputs":[{"key":"repo","label":"Repository","example":"https://github.com/org/infra.git"}],"steps":[{"title":"Check what makes it large","cmd":"git clone --filter=blob:none --no-checkout {repo} probe && cd probe && git count-objects -vH","risk":"safe","look":"Clones metadata only, so it is fast. size-pack tells you whether history or the working tree dominates."},{"title":"Check history depth","cmd":"git rev-list --count HEAD","risk":"safe","look":"Commit count. Tens of thousands with large blobs is what makes clones slow, not the current file count."},{"title":"Use a shallow clone for CI","cmd":"git clone --depth 1 {repo}","risk":"safe","look":"Only the latest commit. Dramatically faster, and sufficient for almost every build. Note that it cannot do history-dependent operations."},{"title":"Use a partial clone for development","cmd":"git clone --filter=blob:none {repo}","risk":"safe","look":"Full history without file contents; blobs are fetched on demand. Better than shallow when you still need to browse history."}],"causes":[{"id":"deep-history","cause":"Many commits with large objects.","fix":"Use --depth 1 in CI and --filter=blob:none locally.","confirm":""},{"id":"large-binaries","cause":"Binaries are in history.","fix":"They cost every clone permanently. Move future ones to LFS.","confirm":""},{"id":"no-ci-optimisation","cause":"CI does a full clone every run.","fix":"Most CI systems support shallow fetch. Enable it.","confirm":""},{"id":"many-refs","cause":"Thousands of branches and tags.","fix":"Prune merged branches. Every ref is negotiated on clone.","confirm":""},{"id":"network","cause":"The network is the bottleneck.","fix":"Use a mirror closer to the runners.","confirm":""}],"verify":["Clone time is acceptable.","CI uses shallow fetch.","New large binaries go to LFS."],"escalate":["Output of count-objects","Commit count","Whether CI clones shallow"]},{"id":"git-hooks-not-running","tier":"guide","technology":"Git","category":"Working Tree","title":"Git hooks do not run","summary":"A pre-commit hook is configured but commits go through unchecked.","aliases":["hooks not running","pre-commit not working","husky not working","hook ignored","core.hookspath","git hook skipped"],"source":"https://git-scm.com/docs/githooks","inputs":[],"steps":[{"title":"Check where Git looks for hooks","cmd":"git config core.hooksPath && dir .git\\hooks","risk":"safe","look":"If core.hooksPath is set, .git/hooks is ignored entirely. Tools like husky set this and it surprises people."},{"title":"Check the hook is executable","cmd":"git ls-files -s .githooks/pre-commit 2>nul || dir .git\\hooks\\pre-commit","risk":"safe","look":"A hook without the execute bit is silently skipped with no error at all."},{"title":"Check the shebang","cmd":"type .git\\hooks\\pre-commit | findstr /B \"#!\"","risk":"safe","look":"A missing or CRLF-terminated shebang makes the hook unrunnable. Nothing is reported."},{"title":"Check whether commits bypass hooks","cmd":"git config core.hooksPath","risk":"safe","look":"Also confirm nobody is using --no-verify. Hooks are a convenience, not a control; CI is where enforcement belongs."}],"causes":[{"id":"hookspath-set","cause":"core.hooksPath points elsewhere.","fix":"Check what it points at. A tool may have set it and then been uninstalled.","confirm":""},{"id":"not-executable","cause":"The hook lacks the execute bit.","fix":"chmod +x, and commit the mode so it survives a fresh clone.","confirm":""},{"id":"crlf-shebang","cause":"The shebang has a Windows line ending.","fix":"Convert to LF. Add the hooks directory to .gitattributes.","confirm":""},{"id":"not-installed","cause":"Hooks are in the repository but never installed.","fix":".git/hooks is not versioned. Use core.hooksPath pointing at a tracked directory.","confirm":""},{"id":"no-verify","cause":"Commits use --no-verify.","fix":"Hooks can always be bypassed. Enforce in CI if it matters.","confirm":""}],"verify":["The hook runs on commit.","It runs after a fresh clone.","The real check also exists in CI."],"escalate":["Value of core.hooksPath","Hook file permissions","The shebang line"]},{"id":"git-tag-wrong-commit","tier":"guide","technology":"Git","category":"History & Undo","title":"A tag points at the wrong commit","summary":"A release tag was created on the wrong commit and may already have been pushed.","aliases":["wrong tag","move tag","retag","tag wrong commit","delete tag remote","release tag mistake"],"source":"https://git-scm.com/docs/git-tag","inputs":[{"key":"tag","label":"Tag","example":"v1.4.2"}],"steps":[{"title":"See where the tag points","cmd":"git show --no-patch --format='%H %s' {tag}","risk":"safe","look":"The commit and its subject. Confirm it is genuinely wrong before touching anything."},{"title":"Check whether it is on the remote","cmd":"git ls-remote --tags origin | findstr {tag}","risk":"safe","look":"Present on the remote means others may have fetched it, and moving it will not update their copies.","signals":[{"match":"refs/tags","means":"The tag exists on the remote. Moving it is a rewrite others will not see.","goto":"cause:already-pushed"}]},{"title":"Delete the local tag","cmd":"git tag -d {tag}","risk":"safe","look":"Removes it locally only. The remote is untouched and nothing is lost, since the commit itself remains."},{"title":"Delete the remote tag","cmd":"git push origin :refs/tags/{tag}","risk":"destructive","look":"git ls-remote no longer lists it. Then push the corrected tag.","note":"Removes the tag from the remote. Anyone who already fetched it keeps their copy pointing at the old commit, and release artifacts built from that tag remain published. If the tag was used for a release, prefer a new version number over moving this one."}],"causes":[{"id":"not-pushed","cause":"The tag is local only.","fix":"Delete and recreate. Nobody else is affected.","confirm":""},{"id":"already-pushed","cause":"The tag is on the remote.","fix":"Prefer publishing a new version. Moving a released tag breaks reproducibility for anyone who already fetched it.","confirm":""},{"id":"lightweight","cause":"A lightweight tag was used for a release.","fix":"Use annotated tags for releases. They carry an author, date and message.","confirm":""},{"id":"ci-triggered","cause":"CI already built from the tag.","fix":"Artifacts exist for the wrong commit. Yank them and publish a new version.","confirm":""}],"verify":["The tag points at the intended commit.","Or a corrected version was published instead.","CI artifacts match the tag."],"escalate":["Where the tag currently points","Whether it is on the remote","Whether CI built from it"]},{"id":"git-untracked-blocking-checkout","tier":"guide","technology":"Git","category":"Working Tree","title":"Checkout refuses because of untracked files","summary":"Switching branches fails because incoming files would overwrite local untracked ones.","aliases":["untracked working tree files would be overwritten","cannot checkout","would be overwritten by checkout","switch branch blocked"],"source":"https://git-scm.com/docs/git-checkout","inputs":[{"key":"branch","label":"Branch","example":"main"}],"steps":[{"title":"See which files block the switch","cmd":"git switch {branch}","risk":"safe","look":"Git lists every blocking path. These are files you have locally that the target branch also wants to create.","signals":[{"match":"would be overwritten by checkout","means":"Untracked local files collide with incoming ones.","goto":"cause:untracked-collision"}]},{"title":"Check whether they matter","cmd":"git status --short | findstr /B \"??\"","risk":"safe","look":"Untracked files. Build output and local config are usually safe to remove; anything you wrote is not."},{"title":"Check what the target branch has at those paths","cmd":"git show {branch}:<path>","risk":"safe","look":"The incoming version. Comparing tells you whether yours is worth keeping at all."},{"title":"Remove untracked files that are not needed","cmd":"git clean -nd","risk":"destructive","look":"The list of what would be removed. Only then decide whether to run it for real.","note":"Run exactly as shown with -n first: that only lists what would be deleted. Removing the -n makes it delete permanently, and files never added to Git are not recoverable by any means. Read the list line by line before you change the flag."}],"causes":[{"id":"untracked-collision","cause":"Local untracked files collide with incoming ones.","fix":"Move or remove yours. Git refuses rather than silently overwriting.","confirm":""},{"id":"build-output","cause":"Build artifacts are untracked.","fix":"Add them to .gitignore so they stop causing this.","confirm":""},{"id":"should-keep","cause":"The files are real work.","fix":"Move them aside, or commit them on a branch first.","confirm":""},{"id":"ignored-but-present","cause":"The file is ignored but exists.","fix":"Ignored files still block checkout when the target branch tracks that path.","confirm":""}],"verify":["The branch switch succeeds.","Nothing you needed was deleted.",".gitignore covers the generated files."],"escalate":["The blocking paths","Whether they are generated or authored","What the target branch has there"]}]</script>
<script>
"use strict";
const BANK=JSON.parse(document.getElementById("data").textContent);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plain=p=>String(p||"").replace(/^\(\?[imsx]+\)/,"").replace(/\\[sdwSDW]\+?/g," ")
  .replace(/[\^$]/g,"").replace(/\\/g,"").replace(/\.\*|\.\+|\?/g,"")
  .replace(/\(([^)]*)\)/g,"$1").replace(/\[[^\]]*\]/g,"").replace(/\{\d+,?\d*\}/g,"")
  .replace(/\|/g,"  /  ").replace(/\s{2,}/g,"  ").trim();

const CTX={}; let CUR=null;
const RISK={safe:["READ ONLY","c-safe"],state:["CHANGES STATE","c-state"],destructive:["DESTRUCTIVE","c-destructive"]};

const flat=s=>String(s??"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
function score(r,q){if(!q.trim())return 1;const Q=flat(q),T=flat(r.title),A=(r.aliases||[]).map(flat);
  let s=0; if(T.includes(Q))s+=100; if(A.some(a=>a.includes(Q)||Q.includes(a)))s+=80;
  const hay=[T,flat(r.summary),A.join(" "),flat(r.category)].join(" ");
  for(const t of Q.split(" ").filter(x=>x.length>1)){
    if(T.includes(t))s+=18; else if(A.some(a=>a.includes(t)))s+=14; else if(hay.includes(t))s+=4;}
  return s;}

function tree(){
  const q=$("#q").value;
  const hits=BANK.map(r=>({r,s:score(r,q)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  if(!hits.length){$("#nav").innerHTML='<div class="nohit">Nothing matched. Try the exact error text, or a plainer phrase.</div>';return;}
  const byT={};
  hits.forEach(({r})=>{if(!byT[r.technology])byT[r.technology]={};
    const c=r.category||"General"; if(!byT[r.technology][c])byT[r.technology][c]=[];
    byT[r.technology][c].push(r);});
  const searching=q.trim().length>0;
  $("#nav").innerHTML=Object.keys(byT).sort().map(t=>{
    const n=Object.values(byT[t]).reduce((a,b)=>a+b.length,0);
    const open=searching||(CUR&&CUR.technology===t);
    return '<div class="tgroup'+(open?" open":"")+'" data-t="'+esc(t)+'">'+
      '<button class="thead"><span class="car">'+(open?"\u25BE":"\u25B8")+'</span>'+esc(t)+
      '<span class="ct">'+n+'</span></button><div class="tbody">'+
      Object.keys(byT[t]).sort().map(c=>'<div class="chead">'+esc(c).toUpperCase()+'</div>'+
        byT[t][c].map(r=>'<button class="item'+(CUR&&CUR.id===r.id?" sel":"")+'" data-id="'+esc(r.id)+'">'+
          esc(r.title)+'</button>').join("")).join("")+'</div></div>';}).join("");
  document.querySelectorAll(".thead").forEach(b=>b.onclick=()=>{
    const g=b.closest(".tgroup"); g.classList.toggle("open");
    g.querySelector(".car").textContent=g.classList.contains("open")?"\u25BE":"\u25B8";});
  document.querySelectorAll(".item").forEach(b=>b.onclick=()=>{
    open(b.dataset.id);document.body.classList.remove("nav");});
}

function fill(cmd,html){return cmd.replace(/\{([a-z0-9_]+)\}/g,(m,k)=>{const v=CTX[k];
  return !html?(v||m):(v?'<span class="fill">'+esc(v)+'</span>':'<span class="un">'+esc(m)+'</span>');});}
function repaint(){document.querySelectorAll("[data-cmd]").forEach(e=>e.innerHTML=fill(e.dataset.cmd,true));}
function fields(){
  $("#fields").innerHTML=((CUR&&CUR.inputs)||[]).map(i=>
    '<label>'+esc(i.label)+'<input data-k="'+esc(i.key)+'" placeholder="'+esc(i.example||"")+
    '" value="'+esc(CTX[i.key]||"")+'"></label>').join("");
  document.querySelectorAll("#fields input").forEach(x=>x.oninput=()=>{
    CTX[x.dataset.k]=x.value.trim();repaint();});
}

function open(id){
  CUR=BANK.find(r=>r.id===id); if(!CUR)return;
  (CUR.inputs||[]).forEach(i=>{if(!(i.key in CTX))CTX[i.key]="";});
  fields();
  $("#crumb").innerHTML=esc(CUR.technology)+' &nbsp;\u203A&nbsp; '+esc(CUR.category||"")+
    ' &nbsp;\u203A&nbsp; <b>'+esc(CUR.title)+'</b>';

  const steps=(CUR.steps||[]).map((s,i)=>{
    const R=RISK[s.risk]||RISK.safe, dz=s.risk==="destructive";
    const body=dz?'<div class="veil" data-rv="'+i+'">\u25B8 Command hidden. Read the warning, then tap to reveal.</div>'
      :'<pre data-cmd="'+esc(s.cmd)+'"></pre><button class="cp" data-cp="'+i+'">Copy</button>';
    const br=(s.signals||[]).length?'<div class="br"><div class="brh">WHAT YOU MIGHT SEE</div>'+
      s.signals.map(g=>{const t=g.goto||"";let nx="";
        if(t.indexOf("cause:")===0){const k=(CUR.causes||[]).findIndex(x=>x.id===t.slice(6));
          if(k>=0)nx='<span class="goto">\u2192 cause '+(k+1)+'</span>';}
        else if(t.indexOf("step:")===0)nx='<span class="goto">\u2192 step '+t.slice(5)+'</span>';
        return '<div class="brow"><div class="bif"><b>IF YOU SEE</b><code>'+esc(plain(g.match))+
          '</code></div><div class="bthen">'+esc(g.means)+' '+nx+'</div></div>';}).join("")+'</div>':"";
    return '<li class="step'+(dz?" d":"")+'" data-step="'+i+'"><div class="num">'+(i+1)+'</div>'+
      '<div class="sh"><span class="st">'+esc(s.title)+'</span><span class="chip '+R[1]+'">'+R[0]+'</span></div>'+
      (s.note?'<p class="note'+(s.risk==="state"?" s":"")+'">'+esc(s.note)+'</p>':"")+
      '<div class="cmd">'+body+'</div><p class="look">'+esc(s.look)+'</p>'+br+'</li>';}).join("");

  const cz=(CUR.causes||[]).map((c,i)=>'<div class="cz"><div class="rk">'+(i+1)+'</div><div>'+
    '<div class="w">'+esc(c.cause)+'</div><div class="fx"><b>Fix.</b> '+esc(c.fix)+'</div></div></div>').join("");

  $("#pane").innerHTML='<div class="rb"><h2>'+esc(CUR.title)+'</h2>'+
    '<p class="sum">'+esc(CUR.summary)+'</p>'+
    '<div class="tags">'+(CUR.aliases||[]).slice(0,7).map(a=>'<span class="tag">'+esc(a)+'</span>').join("")+'</div>'+
    '<p class="src">Commands vary by version and environment \u2014 read each one before you run it.'+
    (CUR.source?' <a href="'+esc(CUR.source)+'" target="_blank" rel="noopener">Official documentation \u2197</a>':"")+'</p>'+
    '<ol class="steps">'+steps+'</ol>'+
    (cz?'<div class="sec"><h3>LIKELY CAUSES \u2014 MOST COMMON FIRST</h3>'+cz+'</div>':"")+
    ((CUR.verify||[]).length?'<div class="sec"><h3>YOU ARE DONE WHEN</h3><ul class="pl">'+
      CUR.verify.map(v=>'<li>'+esc(fill(v,false))+'</li>').join("")+'</ul></div>':"")+
    ((CUR.escalate||[]).length?'<div class="sec"><h3>IF YOU HAND THIS OVER, INCLUDE</h3><ul class="pl">'+
      CUR.escalate.map(v=>'<li>'+esc(fill(v,false))+'</li>').join("")+'</ul></div>':"")+'</div>';
  window.scrollTo(0,0); repaint(); wire(); tree();
}

function wire(){
  document.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>{
    const t=fill(CUR.steps[+b.dataset.cp].cmd,false);
    navigator.clipboard.writeText(t).then(()=>{const e=$("#toast");e.textContent="Command copied";
      e.style.display="block";setTimeout(()=>e.style.display="none",1500);},()=>prompt("Copy:",t));});
  document.querySelectorAll("[data-rv]").forEach(v=>v.onclick=()=>{
    const i=+v.dataset.rv,s=CUR.steps[i];
    v.outerHTML='<pre data-cmd="'+esc(s.cmd)+'"></pre><button class="cp" data-cp="'+i+'">Copy</button>';
    repaint();wire();});
}

function home(){
  CUR=null; $("#fields").innerHTML=""; $("#crumb").innerHTML="";
  const T=[...new Set(BANK.map(r=>r.technology))].sort();
  const st=BANK.reduce((a,r)=>a+r.steps.length,0);
  const br=BANK.reduce((a,r)=>a+r.steps.reduce((b,s)=>b+(s.signals||[]).length,0),0);
  const cz=BANK.reduce((a,r)=>a+r.causes.length,0);
  $("#pane").innerHTML='<div class="hero"><h2>What is broken?</h2>'+
    '<p>Search the symptom, the error string, or what you were doing when it failed. Every runbook gives '+
    'the checks in order, what each output means, and where to go next.</p>'+
    '<div class="stats">'+
    '<div class="stat"><b>'+BANK.length+'</b><span>runbooks</span></div>'+
    '<div class="stat"><b>'+st+'</b><span>diagnostic steps</span></div>'+
    '<div class="stat"><b>'+br+'</b><span>decision branches</span></div>'+
    '<div class="stat"><b>'+cz+'</b><span>ranked causes</span></div>'+
    '<div class="stat"><b>'+T.length+'</b><span>technologies</span></div></div>'+
    '<div class="cards">'+T.map(t=>{const n=BANK.filter(r=>r.technology===t).length;
      const c=[...new Set(BANK.filter(r=>r.technology===t).map(r=>r.category))].length;
      return '<button class="card" data-tech="'+esc(t)+'"><h3>'+esc(t)+'</h3><p>'+n+
        ' runbooks across '+c+' categories</p></button>';}).join("")+'</div>'+
    '<p class="src" style="margin-top:30px">Runs entirely in this one file. Nothing is sent anywhere, '+
    'nothing is executed for you, and nothing is saved when you close the tab.</p></div>';
  document.querySelectorAll(".card").forEach(b=>b.onclick=()=>{
    const g=[...document.querySelectorAll(".tgroup")].find(x=>x.dataset.t===b.dataset.tech);
    if(g){g.classList.add("open");g.querySelector(".car").textContent="\u25BE";
      g.scrollIntoView({block:"nearest"});}
    document.body.classList.add("nav");});
  tree();
}

$("#q").oninput=tree;
$("#burger").onclick=()=>document.body.classList.toggle("nav");
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&document.activeElement!==$("#q")){e.preventDefault();$("#q").focus();$("#q").select();}
  if(e.key==="Escape"){if(CUR)home();else{$("#q").value="";tree();}}});
home();
</script>
</body>
</html>
