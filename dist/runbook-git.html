<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Runbook</title>
<style>
:root{
  --paper:#EEF1F4; --surface:#fff; --ink:#141C24; --muted:#5A6976;
  --rule:#D5DCE3; --rule-soft:#E4E9ED;
  --safe:#0F7B54; --state:#A15C00; --destructive:#BC2C24;
  --focus:#1F5FA8;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --mono:"Cascadia Mono",ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.5;font-feature-settings:"tnum" 1}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:940px;margin:0 auto;padding:0 20px}

/* ---- context strip ---- */
.ctx{background:var(--ink);color:#DCE3EA;position:sticky;top:0;z-index:20}
.ctx .wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding-top:9px;padding-bottom:9px}
.ctx .brand{font-weight:650;letter-spacing:-.01em;color:#fff;margin-right:auto;font-size:15px}
.ctx .by{font-weight:400;color:#8095A8;font-size:12.5px;margin-left:7px}
@media(max-width:640px){.ctx .by{display:none}}
.ctx label{display:flex;align-items:baseline;gap:6px;font-size:12.5px;color:#9FB0BF}
.ctx input{background:transparent;border:0;border-bottom:1px solid #3C4A57;color:#fff;
  font-family:var(--mono);font-size:13px;padding:1px 2px;width:15ch;min-width:0}
.ctx input:focus{border-bottom-color:#7FA8D4;outline:none}
.ctx input::placeholder{color:#5A6976}

/* ---- search ---- */
.search{padding:44px 0 26px}
h1{font-size:28px;line-height:1.2;letter-spacing:-.02em;margin:0 0 6px;font-weight:640}
.lede{color:var(--muted);margin:0 0 22px;max-width:62ch}
#q{width:100%;padding:14px 16px;border:1px solid var(--rule);border-radius:6px;
  background:var(--surface);font-size:17px}
#q:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px rgba(31,95,168,.12)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
.chips.sub{margin-top:8px}
.tab{background:var(--surface);border:1px solid var(--rule);border-radius:20px;padding:6px 14px;
  font-size:13.5px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tab:hover{border-color:var(--ink)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab .n{font-size:11.5px;opacity:.6;font-variant-numeric:tabular-nums}
.chips.sub .tab{padding:4px 11px;font-size:12.5px;border-radius:4px;color:var(--muted)}
.chips.sub .tab.on{color:#fff}
.hint{margin-top:13px;font-size:12.5px;color:var(--muted)}
kbd{font-family:var(--mono);font-size:11.5px;border:1px solid var(--rule);border-bottom-width:2px;
  border-radius:3px;padding:1px 5px;background:var(--surface)}

/* ---- results ---- */
.results{list-style:none;margin:0;padding:0 0 56px}
.results li{border-top:1px solid var(--rule-soft)}
.results li:last-child{border-bottom:1px solid var(--rule-soft)}
.hit{display:block;width:100%;text-align:left;background:none;border:0;padding:15px 14px;cursor:pointer}
.hit:hover,.hit.cur{background:var(--surface)}
.hit h3{margin:0;font-size:16.5px;font-weight:600;letter-spacing:-.005em}
.hit p{margin:3px 0 0;color:var(--muted);font-size:14px}
.meta{margin-top:7px;font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.empty{padding:40px 14px;color:var(--muted);border-top:1px solid var(--rule-soft)}

/* ---- trust badge ---- */
.trust{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600}
.trust::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-verified{color:var(--safe)} .t-documented{color:var(--state)} .t-reference{color:var(--muted)}

/* ---- runbook ---- */
.rb{padding:26px 0 90px;display:none}
.back{background:none;border:0;padding:0;color:var(--muted);font-size:13.5px;cursor:pointer;margin-bottom:18px}
.back:hover{color:var(--ink)}
.rb h2{font-size:25px;line-height:1.2;letter-spacing:-.02em;margin:0 0 6px;font-weight:640}
.rb .sum{color:var(--muted);margin:0 0 14px;max-width:64ch}
.prov{font-size:12.5px;color:var(--muted);border-left:2px solid var(--rule);padding:2px 0 2px 11px;margin-bottom:26px}
.prov code{font-family:var(--mono);font-size:12px}
.prov a{color:var(--focus)}

/* ---- the rail ---- */
ol.steps{list-style:none;margin:0;padding:0}
.step{position:relative;padding:0 0 26px 40px}
.step::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:1px;background:var(--rule)}
.step:last-child::before{display:none}
.step.danger::before{background:var(--destructive);opacity:.35}
.mark{position:absolute;left:0;top:2px;width:23px;height:23px;border:1px solid var(--rule);
  background:var(--surface);border-radius:3px;cursor:pointer;padding:0;
  font-family:var(--mono);font-size:12px;color:var(--muted);line-height:21px;text-align:center}
.mark:hover{border-color:var(--ink)}
.step.done .mark{background:var(--ink);border-color:var(--ink);color:#fff}
.step.done .stitle{color:var(--muted)}
.step.danger .mark{border-color:var(--destructive);color:var(--destructive)}

.shead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:9px}
.stitle{font-weight:600;font-size:16px;letter-spacing:-.005em}
.chip{font-size:11px;font-weight:650;padding:2px 7px;border-radius:3px;white-space:nowrap}
.c-safe{color:var(--safe);background:rgba(15,123,84,.09)}
.c-state{color:var(--state);background:rgba(161,92,0,.10)}
.c-destructive{color:#fff;background:var(--destructive)}

.cmd{position:relative;background:var(--ink);border-radius:5px;margin:0 0 10px}
.cmd pre{margin:0;padding:13px 84px 13px 14px;overflow-x:auto;font-family:var(--mono);
  font-size:13.5px;line-height:1.55;color:#E8EEF3;white-space:pre-wrap;word-break:break-word}
.cmd .fill{color:#8FD0A8;font-weight:600}
.cmd .unfilled{color:#E0A86A;border-bottom:1px dashed #8A6A48}
.copy{position:absolute;top:8px;right:8px;background:#2A3640;border:0;color:#C6D3DD;
  font-size:12px;padding:5px 10px;border-radius:4px;cursor:pointer}
.copy:hover{background:#3A4854;color:#fff}
.veil{padding:13px 14px;color:#E0A86A;font-family:var(--mono);font-size:13px;cursor:pointer;
  display:flex;align-items:center;gap:9px}
.veil:hover{color:#fff}

.look{font-size:14.5px;color:var(--muted);margin:0 0 8px;max-width:66ch}
.look b{color:var(--ink);font-weight:600}
.note{font-size:14px;border-left:2px solid var(--destructive);padding:6px 0 6px 11px;
  margin:0 0 10px;max-width:64ch;color:var(--ink)}
.note-state{border-left-color:var(--state)}

/* ---- output matcher ---- */
.match{margin-top:10px}
.match summary{font-size:13.5px;color:var(--focus);cursor:pointer;list-style:none}
.match summary::-webkit-details-marker{display:none}
.match summary::before{content:"+ ";font-family:var(--mono)}
.match[open] summary::before{content:"- "}
.match textarea{width:100%;margin-top:9px;min-height:78px;padding:10px 12px;border:1px solid var(--rule);
  border-radius:5px;font-family:var(--mono);font-size:12.5px;background:var(--surface);resize:vertical}
.verdict{margin-top:9px;padding:11px 13px;border-radius:5px;font-size:14.5px;background:var(--surface);
  border:1px solid var(--rule)}
.verdict.hit{border-color:var(--safe);border-left:3px solid var(--safe)}
.verdict.miss{color:var(--muted)}
.verdict b{display:block;margin-bottom:3px}
.jump{background:none;border:0;color:var(--focus);padding:0;margin-top:6px;cursor:pointer;font-size:13.5px}

/* ---- causes ---- */
.sec{margin-top:34px;padding-top:20px;border-top:1px solid var(--rule)}
.sec h3{font-size:13px;font-weight:650;margin:0 0 14px;color:var(--muted);letter-spacing:.01em}
.cause{padding:13px 15px;background:var(--surface);border:1px solid var(--rule-soft);border-radius:5px;margin-bottom:9px}
.cause.lit{border-color:var(--safe);border-left:3px solid var(--safe)}
.cause .rank{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-right:7px}
.cause .what{font-weight:600;font-size:15px}
.cause .fix{color:var(--muted);font-size:14.5px;margin-top:4px;max-width:66ch}
.cause .fix b{color:var(--ink);font-weight:600}
ul.plain{margin:0;padding-left:19px;color:var(--muted);font-size:14.5px;max-width:66ch}
ul.plain li{margin-bottom:5px}

/* ---- action bar ---- */
.bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--rule);
  padding:11px 0;display:none;z-index:15}
.bar .wrap{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.bar .prog{font-size:13px;color:var(--muted);margin-right:auto;font-variant-numeric:tabular-nums}
.act{background:var(--surface);border:1px solid var(--rule);border-radius:5px;padding:7px 13px;
  font-size:13.5px;cursor:pointer}
.act:hover{border-color:var(--ink)}
.act.key{background:var(--ink);color:#fff;border-color:var(--ink)}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:9px 17px;border-radius:5px;font-size:13.5px;z-index:30;display:none}

footer{color:var(--muted);font-size:12.5px;padding:0 0 30px;max-width:70ch;white-space:pre-line}

@media(max-width:640px){
  .wrap{padding:0 15px}
  .search{padding:26px 0 18px} h1{font-size:23px} .rb h2{font-size:21px}
  .ctx .wrap{gap:11px} .ctx input{width:11ch}
  .step{padding-left:33px} .mark{width:21px;height:21px;line-height:19px}
  .step::before{left:10px}
  .cmd pre{padding-right:14px;padding-top:38px}
  .copy{top:6px;right:auto;left:8px}
}
</style>
</head>
<body>

<div class="ctx"><div class="wrap">
  <span class="brand">DevOps Runbook <span class="by">by Dinesh Ilangovan</span></span>
  <span id="ctxfields"></span>
</div></div>

<main class="wrap">

<section class="search" id="searchview">
  <h1>What is broken?</h1>
  <p class="lede">Type the symptom, the error string, or what you were doing when it failed.</p>
  <input id="q" placeholder="CrashLoopBackOff, pod pending, committed to main, force push..." autocomplete="off" autofocus>
  <div class="chips" id="techchips"></div>
  <div class="chips sub" id="catchips"></div>
  <p class="hint"><kbd>/</kbd> search &nbsp; <kbd>↑</kbd><kbd>↓</kbd> move &nbsp; <kbd>Enter</kbd> open &nbsp; <kbd>Esc</kbd> back</p>
</section>

<ul class="results" id="results"></ul>

<section class="rb" id="rbview"></section>

<footer id="foot"></footer>
</main>

<div class="bar" id="bar"><div class="wrap">
  <span class="prog" id="prog"></span>
  <button class="act" id="a-safe">Copy read-only steps</button>
  <button class="act" id="a-esc">Copy handoff notes</button>
  <button class="act key" id="a-log">Copy incident log</button>
</div></div>
<div class="toast" id="toast"></div>

<script id="data" type="application/json">[{"id":"git-committed-to-main","tier":"guide","technology":"Git","category":"History & Undo","title":"I committed to main by mistake","summary":"The commit is on the wrong branch. What you do next depends entirely on whether it has been pushed.","aliases":["committed to main","wrong branch","committed accidentally","undo commit","committed by mistake","move commit to branch","oops committed"],"source":"https://git-scm.com/docs/git-reset","inputs":[{"key":"branch","label":"Branch you meant to use","example":"feature/checkout-retry"},{"key":"remote","label":"Remote","example":"origin"}],"steps":[{"title":"Find out whether the commit has left your machine","cmd":"git status -sb && git log --oneline -3","risk":"safe","look":"The first line. 'ahead 1' means it is still local and you have easy options. If it is not ahead, it is already on the remote and rewriting is now other people's problem too.","signals":[{"match":"ahead \\d+","means":"Still local. You can move it cleanly.","goto":"cause:local-only"},{"match":"\\[origin/main\\]\\s*$","means":"Already pushed. Do not rewrite shared history.","goto":"cause:already-pushed"}]},{"title":"Move the commit onto the branch it belonged on","cmd":"git branch {branch} && git reset --hard HEAD~1 && git switch {branch}","risk":"destructive","note":"reset --hard discards every uncommitted change in your working tree. Run git stash first if you have any. This is only safe because git branch {branch} was created on the line before, so the commit itself survives on that branch.","look":"After this, main is back where it was and your commit sits on {branch}.","signals":[{"match":"(?i)error: .*already exists","means":"That branch already exists. Pick another name or switch to it and cherry-pick instead.","goto":"cause:branch-exists"}]},{"title":"Confirm nothing was lost","cmd":"git log --oneline -3 {branch} && git log --oneline -3 main","risk":"safe","look":"Your commit on {branch}, and main matching the remote. If anything looks wrong, git reflog still has every prior position for about 90 days."}],"causes":[{"id":"local-only","cause":"The commit exists only in your clone.","fix":"Create the branch at the current commit, then reset main back one. Nobody else is affected.","confirm":"git status -sb"},{"id":"already-pushed","cause":"The commit is on the remote and others may have pulled it.","fix":"Do not reset and force-push. Use git revert to add a new commit that undoes it, then apply the original work on a proper branch.","confirm":"git log --oneline {remote}/main -3"},{"id":"branch-exists","cause":"A branch with that name is already present.","fix":"Switch to it and cherry-pick the commit across, then reset main.","confirm":"git branch --list {branch}"}],"verify":["git log on main matches the remote's main.","Your commit appears in git log on {branch}.","git status reports a clean working tree, or exactly the changes you stashed."],"escalate":["Output of git status -sb","git log --oneline -5 for both branches","Whether the commit was pushed, and whether anyone has pulled since"]},{"id":"git-force-push-safely","tier":"guide","technology":"Git","category":"Remotes","title":"I need to force-push a rebased branch","summary":"Rewriting a shared branch can silently destroy a colleague's commits. There is a safe form of this command.","aliases":["force push","push -f","rebase then push","force-with-lease","non-fast-forward","rejected push"],"source":"https://git-scm.com/docs/git-push","inputs":[{"key":"branch","label":"Branch","example":"feature/checkout-retry"},{"key":"remote","label":"Remote","example":"origin"}],"steps":[{"title":"Check whether anyone else has pushed to this branch","cmd":"git fetch {remote} && git log --oneline {remote}/{branch} -5","risk":"safe","look":"Commits you do not recognise. If someone else's work is on this branch, a force-push will delete it and they will not get a warning.","signals":[{"match":"(?i)commit","means":"Read the author of each. Anything not yours means stop and talk to them first.","goto":"cause:shared-branch"}]},{"title":"Force-push, but only if the remote is where you last saw it","cmd":"git push --force-with-lease={branch} {remote} {branch}","risk":"destructive","note":"This rewrites remote history. --force-with-lease aborts if someone pushed since your last fetch, which plain --force does not. Never use plain --force on a shared branch. If this is a protected branch, it should be rejected by policy, not by your judgement.","look":"A forced update line. If it is rejected with 'stale info', someone pushed after your fetch and the lease did its job.","signals":[{"match":"(?i)stale info|rejected","means":"The lease saved you. Someone pushed after your last fetch. Fetch again and re-examine before retrying.","goto":"cause:raced"},{"match":"(?i)protected branch|pre-receive hook declined","means":"Branch protection blocked it. That is working as intended; open a PR instead.","goto":"cause:protected"}]}],"causes":[{"id":"shared-branch","cause":"Other people have commits on this branch.","fix":"Do not force-push. Merge their work in, or coordinate a window with them first.","confirm":"git log --format='%an %s' {remote}/{branch} -10"},{"id":"raced","cause":"Someone pushed between your fetch and your push.","fix":"Fetch, inspect what arrived, rebase onto it, then retry with --force-with-lease.","confirm":"git fetch {remote} && git log --oneline {remote}/{branch} -5"},{"id":"protected","cause":"Branch protection rules forbid force-push.","fix":"Open a pull request. If the rewrite is genuinely required, it needs a repo admin, not a workaround.","confirm":"git ls-remote {remote} {branch}"}],"verify":["{remote}/{branch} points at your intended commit.","No commits by other authors disappeared from the log.","CI on the branch is green after the rewrite."],"escalate":["git log --oneline of local and remote branch","The exact push output including any rejection reason","Whether the branch is protected and who owns it"]},{"id":"git-merge-conflict","tier":"guide","technology":"Git","category":"Merging","title":"Merge or rebase stopped with conflicts","summary":"Git cannot combine two changes automatically and is waiting for you to decide.","aliases":["merge conflict","conflict","both modified","fix conflicts and run commit","rebase conflict","unmerged paths"],"source":"https://git-scm.com/docs/git-merge","inputs":[{"key":"branch","label":"Branch being merged","example":"main"}],"steps":[{"title":"See exactly which files are unmerged","cmd":"git status --short","risk":"safe","look":"Lines starting UU are both-modified. AA is both-added, DU and UD are delete-versus-modify, which need a decision rather than an edit.","signals":[{"match":"^UU ","means":"Both sides changed the same file. Edit it and resolve.","goto":"cause:both-modified"},{"match":"^(DU|UD) ","means":"One side deleted what the other changed. Neither version is automatically right.","goto":"cause:delete-modify"}]},{"title":"Understand which operation you are inside","cmd":"git status | head -3","risk":"safe","look":"Rebase and merge resolve identically but finish differently. Finishing the wrong way is where people lose work."},{"title":"See both sides of a conflicting file","cmd":"git diff --diff-filter=U","risk":"safe","look":"The conflict markers with both versions. The section above ======= is your current branch, below it is what you are bringing in."},{"title":"Abort and return to where you started","cmd":"git merge --abort","risk":"destructive","look":"A clean working tree back at the pre-merge commit. This is always safe for committed history, and is the right move when a merge has gone badly.","note":"Discards the entire in-progress merge and any conflict resolution you have done so far. Committed work is untouched, but unsaved resolution effort is lost. Inside a rebase, the equivalent is git rebase --abort."}],"causes":[{"id":"both-modified","cause":"Both branches changed the same lines.","fix":"Edit the file to the intended final state, remove the markers, git add it, then continue.","confirm":""},{"id":"delete-modify","cause":"One branch deleted a file the other modified.","fix":"Decide deliberately: git rm to accept the deletion, or git add to keep the modified version.","confirm":""},{"id":"wrong-finish","cause":"Finished a rebase with git commit instead of git rebase --continue.","fix":"Inside a rebase always use git rebase --continue. Inside a merge, git commit is correct.","confirm":""}],"verify":["git status reports a clean tree with no unmerged paths.","The build and tests pass on the merged result.","Neither side's intent was silently dropped."],"escalate":["git status --short output","Whether it is a merge or a rebase","Which files conflicted and how each was resolved"]},{"id":"git-detached-head","tier":"guide","technology":"Git","category":"Branches","title":"You are in detached HEAD state","summary":"Commits made here belong to no branch and become unreachable when you switch away.","aliases":["detached head","not on any branch","head detached at","lost my commits","commits disappeared after checkout"],"source":"https://git-scm.com/docs/git-checkout","inputs":[{"key":"branch","label":"Branch to keep the work on","example":"feature/fix-checkout"}],"steps":[{"title":"Confirm the state and whether you have made commits","cmd":"git status -sb && git log --oneline -5","risk":"safe","look":"'HEAD detached at' confirms it. If the log shows commits you made here, they exist but nothing points at them yet.","signals":[{"match":"(?i)HEAD detached","means":"Detached. Any commits here need a branch before you move.","goto":"cause:detached"}]},{"title":"Create a branch at your current position","cmd":"git switch -c {branch}","risk":"safe","look":"Your commits are now on a real branch and safe. Do this before anything else, and before switching away."},{"title":"If you already switched away and lost them, find them in reflog","cmd":"git reflog -20","risk":"safe","look":"Every position HEAD has held, with its SHA. Detached commits remain here for about ninety days, so almost nothing is truly lost."},{"title":"Recover a specific lost commit","cmd":"git branch recovered <sha-from-reflog>","risk":"state","look":"A branch named recovered holding the work. Verify with git log before relying on it.","note":"Creates a new branch pointing at that commit. Nothing existing is modified and no history is rewritten, but pick the SHA carefully or you will branch from the wrong point."}],"causes":[{"id":"detached","cause":"HEAD points at a commit rather than a branch.","fix":"Create a branch here with git switch -c. Do it before switching away.","confirm":""},{"id":"already-switched","cause":"You left detached HEAD and the commits seem gone.","fix":"They are in the reflog. Find the SHA and branch from it.","confirm":""},{"id":"intentional","cause":"You checked out a tag or old commit deliberately.","fix":"Fine as long as you make no commits. If you do, branch first.","confirm":""}],"verify":["git status shows you on a named branch.","git log on that branch contains your commits.","The branch is pushed, or you know it is local only."],"escalate":["git status -sb output","git reflog around the time the work was done","Which commits are missing"]},{"id":"git-large-file-rejected","tier":"guide","technology":"Git","category":"Remotes","title":"Push rejected for file size","summary":"The remote refuses a file over its limit. Deleting it in a new commit does not help; it is still in history.","aliases":["file too large","push rejected size","large file","gh001","exceeds file size limit","git lfs"],"source":"https://docs.github.com/en/repositories/working-with-files/managing-large-files","inputs":[{"key":"file","label":"The oversized file","example":"data/dump.sql"}],"steps":[{"title":"Read the rejection and identify the file and commit","cmd":"git push 2>&1 | more","risk":"safe","look":"The remote names the file and the commit that introduced it. That commit is what must change, not your latest one.","signals":[{"match":"(?i)exceeds|too large|GH001","means":"Size limit. The file is embedded in history and must be removed from it.","goto":"cause:in-history"}]},{"title":"Find the largest objects actually in history","cmd":"git rev-list --objects --all | git cat-file --batch-check=\"%(objecttype) %(objectname) %(objectsize) %(rest)\" | findstr blob","risk":"safe","look":"Sizes are in bytes. This shows what is really in the repository, which is often not what you expected."},{"title":"If it is only in your last commit, remove it there","cmd":"git rm --cached {file} && git commit --amend --no-edit","risk":"destructive","look":"git show --stat no longer lists the file. The file remains on disk because only the index entry was removed.","note":"Rewrites your most recent commit. Safe if that commit has not been pushed. If it has been pushed and others have pulled it, do not amend — the file needs removing from shared history through a coordinated rewrite instead."}],"causes":[{"id":"in-history","cause":"The file is in an earlier commit, so deleting it now changes nothing.","fix":"It must be removed from history. For a single unpushed commit, amend. For anything shared, coordinate a rewrite with the repository owner.","confirm":""},{"id":"should-be-lfs","cause":"The file is a legitimate large asset.","fix":"Track it with Git LFS and add the pattern to .gitattributes before committing it again.","confirm":""},{"id":"should-not-be-committed","cause":"A build artifact or database dump got committed.","fix":"Add it to .gitignore. Artifacts belong in a registry, not in Git.","confirm":""}],"verify":["The push is accepted.","The repository size is reasonable for a fresh clone.",".gitignore or .gitattributes prevents a recurrence."],"escalate":["The verbatim rejection message","Which commit introduced the file","Whether that commit has been pushed and pulled by others"]},{"id":"git-wrong-author","tier":"guide","technology":"Git","category":"History & Undo","title":"Commits show the wrong author or email","summary":"Work commits attributed to a personal address, or the reverse. Usually a missing per-repository config.","aliases":["wrong author","wrong email commit","commits not showing github","unverified commit","wrong git config","author email"],"source":"https://git-scm.com/docs/git-config","inputs":[{"key":"email","label":"Correct email","example":"dinesh@example.com"},{"key":"name","label":"Correct name","example":"Dinesh Ilangovan"}],"steps":[{"title":"See what identity the recent commits carry","cmd":"git log --format='%h %an <%ae>' -5","risk":"safe","look":"The email is what matters for attribution on the hosting side. The display name is cosmetic."},{"title":"See which config is being used and from where","cmd":"git config --show-origin user.email && git config --show-origin user.name","risk":"safe","look":"The file path in the output tells you whether this is global or repository-local. A missing local value means the global one applies."},{"title":"Set the correct identity for this repository only","cmd":"git config user.email \"{email}\" && git config user.name \"{name}\"","risk":"state","look":"git config --show-origin now points at the repository's own config file.","note":"Writes to .git/config for this repository only. Existing commits are unaffected — this changes future commits, nothing more. Setting it locally is the right move when you mix work and personal repositories on one machine."},{"title":"Fix the identity on the most recent commit","cmd":"git commit --amend --reset-author --no-edit","risk":"destructive","look":"git log shows the corrected author on the top commit.","note":"Rewrites the last commit, changing its SHA. Safe while unpushed. If it has been pushed, this creates a divergence that requires a force-push, which rewrites shared history."}],"causes":[{"id":"no-local-config","cause":"No repository-local identity, so a global one applied.","fix":"Set user.email locally in each work repository. Consider clearing the global value so it can never apply silently.","confirm":""},{"id":"already-pushed","cause":"The wrong-author commits are already on the remote.","fix":"Leave them. Rewriting shared history to fix a display name is not a worthwhile trade.","confirm":""},{"id":"unverified","cause":"The email is right but commits show as unverified.","fix":"That is signing, not authorship. Set up commit signing separately.","confirm":""}],"verify":["New commits carry the correct author.","git config --show-origin points at the local config.","No shared history was rewritten to achieve it."],"escalate":["git log with author format","Output of git config --show-origin for user.email","Whether the affected commits are pushed"]},{"id":"git-non-fast-forward","tier":"guide","technology":"Git","category":"Remotes","title":"Push rejected as non-fast-forward","summary":"The remote has commits you do not have locally. Fetch and integrate before pushing.","aliases":["non-fast-forward","push rejected","updates were rejected","fetch first","remote contains work","rejected behind"],"source":"https://git-scm.com/docs/git-push","inputs":[{"key":"branch","label":"Branch","example":"main"},{"key":"remote","label":"Remote","example":"origin"}],"steps":[{"title":"See how far the branches have diverged","cmd":"git fetch {remote} && git status -sb","risk":"safe","look":"The ahead and behind counts. Behind only means a simple pull; both ahead and behind means real divergence that needs a decision.","signals":[{"match":"behind \\d+\\] *$","means":"Only behind. A pull will fast-forward cleanly.","goto":"cause:simply-behind"},{"match":"ahead \\d+, behind \\d+","means":"Diverged. You must choose merge or rebase.","goto":"cause:diverged"}]},{"title":"See exactly which commits are on each side","cmd":"git log --oneline --left-right {remote}/{branch}...HEAD","risk":"safe","look":"Arrows point to which side each commit is on. Read the remote-side commits before deciding; someone else wrote them."},{"title":"Bring the remote work in beneath yours","cmd":"git pull --rebase {remote} {branch}","risk":"state","look":"git status shows ahead only. Conflicts may pause the rebase; resolve then continue.","note":"Replays your local commits on top of the remote ones, which rewrites their SHAs. Safe for commits you have not pushed. If any of your local commits are already public elsewhere, use a merge instead so their identity does not change."},{"title":"Push once it is a fast-forward","cmd":"git push {remote} {branch}","risk":"safe","look":"The push is accepted. If it is rejected again, someone pushed while you were rebasing; fetch and repeat."}],"causes":[{"id":"simply-behind","cause":"You are only behind.","fix":"git pull. Nothing of yours is at risk.","confirm":""},{"id":"diverged","cause":"Both sides have commits.","fix":"Rebase for a linear history, merge to preserve exact commit identity. Team convention decides.","confirm":""},{"id":"force-temptation","cause":"Tempted to force-push past it.","fix":"Do not. Those remote commits are someone's work and force-push deletes them silently.","confirm":""},{"id":"wrong-branch","cause":"Pushing to a branch you did not intend.","fix":"Check git status -sb. The upstream may not be what you assume.","confirm":""}],"verify":["The push is accepted.","git log shows both sets of commits.","Nothing from the remote disappeared."],"escalate":["Output of git status -sb","The left-right log","Whether you rebased or merged"]},{"id":"git-cannot-pull-local-changes","tier":"guide","technology":"Git","category":"Working Tree","title":"Pull refuses because of local changes","summary":"Git will not overwrite uncommitted work. It is protecting you, not blocking you.","aliases":["your local changes would be overwritten","cannot pull","commit your changes or stash","please commit","pull blocked","unstaged changes pull"],"source":"https://git-scm.com/docs/git-stash","inputs":[],"steps":[{"title":"See exactly what is uncommitted","cmd":"git status --short && git diff --stat","risk":"safe","look":"Which files are modified. Git names the conflicting ones in the error, and those are the only ones that matter.","signals":[{"match":"^\\?\\?","means":"Untracked files. These only block if the incoming change adds the same path.","goto":"cause:untracked-collision"},{"match":"^ M|^M ","means":"Modified tracked files that the pull would overwrite.","goto":"cause:modified-tracked"}]},{"title":"Check whether the changes are worth keeping","cmd":"git diff","risk":"safe","look":"The actual content. Often this is debug output or a local config tweak you do not want anyway."},{"title":"Set the work aside and pull","cmd":"git stash push -m \"before pull\" && git pull","risk":"state","look":"The pull succeeds. Your changes are listed in git stash list.","note":"Moves your uncommitted changes onto the stash and restores a clean tree. The work is recoverable with git stash pop, but untracked files are not stashed by default and can still block the pull. Add -u if you need them included."},{"title":"Bring your work back on top","cmd":"git stash pop","risk":"state","look":"Your changes reappear. Resolve any conflicts as with a normal merge.","note":"Reapplies the stashed changes and removes the entry from the stash. If it conflicts with what you just pulled, the entry is kept rather than dropped, so nothing is lost. Use git stash apply instead if you want to keep the entry regardless."}],"causes":[{"id":"modified-tracked","cause":"Tracked files differ from the incoming version.","fix":"Stash, pull, pop. Or commit them on a branch if they are real work.","confirm":""},{"id":"untracked-collision","cause":"An untracked file has the same path as an incoming one.","fix":"Move or delete yours. Git will not silently overwrite it.","confirm":""},{"id":"not-worth-keeping","cause":"The changes are local noise.","fix":"git checkout -- <file> discards them. Confirm with git diff first; this cannot be undone.","confirm":""},{"id":"should-be-committed","cause":"The changes are real work.","fix":"Commit them on a branch, then pull. The stash is for short-lived interruptions, not storage.","confirm":""}],"verify":["The pull completes.","Your changes are back and intact.","The stash list is empty or intentionally populated."],"escalate":["Output of git status --short","The diff of the blocking files","Whether the work was stashed or discarded"]},{"id":"git-crlf-issues","tier":"guide","technology":"Git","category":"Working Tree","title":"Every file shows as modified with no real change","summary":"git diff reports whole-file changes you did not make. Line ending conversion.","aliases":["whole file changed","crlf","line endings","warning lf will be replaced","everything modified","diff shows every line"],"source":"https://git-scm.com/docs/gitattributes","inputs":[{"key":"file","label":"A file showing as changed","example":"scripts/deploy.sh"}],"steps":[{"title":"Confirm the change is only line endings","cmd":"git diff --stat && git diff --ignore-all-space --stat","risk":"safe","look":"If the second command shows nothing, the difference is purely whitespace and line endings. That is definitive.","signals":[{"match":"(?i)0 files changed|^\\s*$","means":"Only line endings differ. No real content changed.","goto":"cause:autocrlf"}]},{"title":"Check the current conversion setting","cmd":"git config --show-origin core.autocrlf","risk":"safe","look":"On Windows true converts to CRLF on checkout and back to LF on commit. A value of false or an inconsistent one across the team produces exactly this."},{"title":"Check what Git thinks each file should be","cmd":"git check-attr text eol -- {file}","risk":"safe","look":"What .gitattributes declares. Unspecified means Git guesses per machine, which is why it differs between teammates."},{"title":"Normalise the repository","cmd":"git add --renormalize .","risk":"state","look":"git status shows the normalised files staged. Commit them as a single dedicated change.","note":"Rewrites the index using the current .gitattributes rules, producing one large commit touching many files. Coordinate it with the team: anyone with in-flight branches will hit conflicts across every touched file. Commit it alone, with nothing else in the change."}],"causes":[{"id":"autocrlf","cause":"core.autocrlf differs between machines.","fix":"Stop relying on it. Commit a .gitattributes file so behaviour is defined by the repository, not by each laptop.","confirm":""},{"id":"no-gitattributes","cause":"No .gitattributes, so Git guesses.","fix":"Add one. At minimum * text=auto, with eol=lf pinned for shell scripts.","confirm":""},{"id":"script-broken","cause":"A shell script has CRLF and fails at runtime.","fix":"Pin *.sh text eol=lf. CRLF in a shebang produces exec format errors in containers.","confirm":""},{"id":"editor-converts","cause":"The editor saves with different endings.","fix":"Configure it to respect .gitattributes. VS Code does by default.","confirm":""}],"verify":["git status is clean after a fresh checkout.","Shell scripts run in containers.",".gitattributes is committed so it applies to everyone."],"escalate":["git diff with and without --ignore-all-space","The core.autocrlf value and its origin","Whether .gitattributes exists"]},{"id":"git-gitignore-not-working","tier":"guide","technology":"Git","category":"Working Tree","title":"gitignore is ignored for a file","summary":"You added a pattern but Git keeps tracking the file.","aliases":["gitignore not working","file still tracked","ignore not applied","still showing in status","gitignore ignored","cannot ignore file"],"source":"https://git-scm.com/docs/gitignore","inputs":[{"key":"file","label":"File","example":"config/local.env"}],"steps":[{"title":"Ask Git which rule applies","cmd":"git check-ignore -v {file}","risk":"safe","look":"The file and line of the matching rule. No output means no rule matches, which is a pattern problem rather than a caching one.","signals":[{"match":":\\d+:","means":"A rule does match. If the file is still tracked, the cache is the reason.","goto":"cause:already-tracked"},{"match":"^\\s*$","means":"No rule matches this path.","goto":"cause:pattern-wrong"}]},{"title":"Check whether the file is already tracked","cmd":"git ls-files --error-unmatch {file}","risk":"safe","look":"gitignore only affects untracked files. Once a file is tracked, no pattern will ever make Git stop following it."},{"title":"Check for a negation rule later in the file","cmd":"type .gitignore","risk":"safe","look":"Rules are applied in order and a later negation wins. Also note that a directory excluded by an earlier rule cannot have its contents re-included."},{"title":"Stop tracking it without deleting it","cmd":"git rm --cached {file}","risk":"state","look":"git status shows the deletion staged and the file no longer tracked. Commit, and it will then be ignored.","note":"Removes the file from Git's index while leaving it on disk. On the next pull, anyone else's checkout will have this file deleted from their working tree, so tell the team. If it holds secrets, removing it now does not remove it from history."}],"causes":[{"id":"already-tracked","cause":"The file is already tracked.","fix":"git rm --cached, then commit. gitignore has no effect on tracked files.","confirm":""},{"id":"pattern-wrong","cause":"No rule matches the path.","fix":"Check for a leading slash, which anchors to the repository root. Patterns are relative to the .gitignore file's own location.","confirm":""},{"id":"negation","cause":"A later rule re-includes it.","fix":"Rules apply in order. Reorder them.","confirm":""},{"id":"parent-excluded","cause":"A parent directory is excluded.","fix":"Git does not descend into excluded directories, so a negation inside one never applies. Unexclude the directory first.","confirm":""},{"id":"secrets-in-history","cause":"The file contains secrets and was committed.","fix":"Ignoring it g","cause":"The commit is in the reflog.","fix":"git branch <name> <sha>. Reflog entries last about ninety days by default.","confirm":""},{"id":"not-in-reflog","cause":"Not in this clone's reflog.","fix":"Check the remote, or another teammate's clone. Reflogs are strictly local and are not shared.","confirm":""},{"id":"was-pushed","cause":"The branch existed on the remote.","fix":"git fetch origin <branch>:<branch> restores it directly. Far simpler than reflog archaeology.","confirm":""},{"id":"gc-collected","cause":"Garbage collection removed the objects.","fix":"If fsck finds nothing and no remote has it, the work is gone. This is rare within the reflog window.","confirm":""}],"verify":["The branch exists with the expected commits.","git log matches what you remember.","It is pushed so it cannot be lost locally again."],"escalate":["Reflog entries mentioning the branch","Output of git fsck --lost-found","Whether the branch was ever pushed"]},{"id":"git-submodule-empty","tier":"guide","technology":"Git","category":"Submodules","title":"Submodule directory is empty after clone","summary":"The folder exists but contains nothing. Submodules are not fetched by default.","aliases":["submodule empty","submodule not cloned","empty directory clone","submodule init","missing submodule","submodule not updating"],"source":"https://git-scm.com/docs/git-submodule","inputs":[{"key":"submodule","label":"Submodule path","example":"vendor/shared-lib"}],"steps":[{"title":"Check the submodule's recorded state","cmd":"git submodule status","risk":"safe","look":"A leading minus means not initialised. A plus means it is at a different commit than the parent records. A space means it is correct.","signals":[{"match":"^-","means":"Not initialised. Nothing has been fetched.","goto":"cause:not-initialised"},{"match":"^\\+","means":"Checked out at a different commit than the parent expects.","goto":"cause:wrong-commit"}]},{"title":"Initialise and fetch everything","cmd":"git submodule update --init --recursive","risk":"safe","look":"Populates every submodule at the commit the parent records. Recursive matters when submodules contain their own."},{"title":"Check the submodule URL is reachable","cmd":"git config --file .gitmodules --get-regexp url","risk":"safe","look":"An SSH URL fails in CI that only has HTTPS credentials. This is a very common cause of submodules working locally and not in a pipeline."},{"title":"Check the parent records a commit that still exists","cmd":"git ls-tree HEAD {submodule}","risk":"safe","look":"The recorded SHA. If that commit was force-pushed away in the submodule repository, the checkout can never succeed."}],"causes":[{"id":"not-initialised","cause":"Submodules were not fetched on clone.","fix":"git submodule update --init --recursive, or clone with --recurse-submodules.","confirm":""},{"id":"wrong-commit","cause":"The submodule is at a different commit.","fix":"update restores the recorded one. If you intended the new commit, commit that pointer in the parent.","confirm":""},{"id":"url-unreachable","cause":"The submodule URL cannot be reached.","fix":"Use a URL scheme the environment can authenticate to. Add an insteadOf rule for CI.","confirm":""},{"id":"commit-gone","cause":"The recorded commit no longer exists upstream.","fix":"Someone force-pushed the submodule repository. Update the parent to a commit that exists.","confirm":""},{"id":"ci-not-fetching","cause":"CI does not fetch submodules.","fix":"Enable submodules in the checkout step. Most CI systems skip them by default.","confirm":""}],"verify":["The submodule directory has content.","git submodule status shows no prefix.","A fresh clone works in CI, not only locally."],"escalate":["Output of git submodule status","The submodule URLs from .gitmodules","Whether it works in CI as well as locally"]},{"id":"git-credential-loop","tier":"guide","technology":"Git","category":"Remotes","title":"Git keeps asking for credentials","summary":"Every push or pull prompts, or an old credential is reused and rejected.","aliases":["asking for password","credential prompt","authentication failed git","support for password authentication was removed","credential manager","keeps asking username"],"source":"https://git-scm.com/docs/gitcredentials","inputs":[{"key":"remote","label":"Remote","example":"origin"}],"steps":[{"title":"Check the remote URL scheme","cmd":"git remote -v","risk":"safe","look":"HTTPS uses a token through a credential helper. SSH uses a key. Which one you have determines everything that follows.","signals":[{"match":"https://","means":"HTTPS. A personal access token is needed; passwords no longer work.","goto":"cause:needs-token"},{"match":"git@|ssh://","means":"SSH. The key is the credential.","goto":"cause:ssh-key"}]},{"title":"Check which credential helper is configured","cmd":"git config --show-origin credential.helper","risk":"safe","look":"On Windows this should be manager. No helper means Git cannot store anything and will prompt every time."},{"title":"Check what is cached for the host","cmd":"cmdkey /list | findstr git","risk":"safe","look":"Stored Windows credentials. A stale entry with an expired token is reused silently and produces repeated failures."},{"title":"Remove the stale credential","cmd":"cmdkey /delete:git:https://github.com","risk":"state","look":"The next push prompts once, then stores the new credential and stops asking.","note":"Deletes the stored credential for that host from Windows Credential Manager. The next Git operation will prompt for a fresh one, so have the new token ready. Other tools using the same stored credential will also start prompting."}],"causes":[{"id":"needs-token","cause":"HTTPS with a password.","fix":"Password authentication was removed. Use a personal access token as the password.","confirm":""},{"id":"stale-credential","cause":"An expired token is cached.","fix":"Delete it from Credential Manager. Git will not overwrite it on its own.","confirm":""},{"id":"no-helper","cause":"No credential helper.","fix":"git config --global credential.helper manager.","confirm":""},{"id":"ssh-key","cause":"SSH key is not loaded or not authorised.","fix":"Follow the SSH runbook. Test with ssh -T git@github.com.","confirm":""},{"id":"wrong-account","cause":"Cached credentials belong to another account.","fix":"Common with work and personal accounts. Clear the entry and use the right one.","confirm":""},{"id":"token-scope","cause":"The token lacks repo scope.","fix":"Regenerate with the right scopes. Read-only tokens fail on push with a confusing message.","confirm":""}],"verify":["Push and pull work without prompting.","The stored credential is for the right account.","The token has an expiry you know about."],"escalate":["Remote URL scheme","Configured credential helper","Stored credentials for the host"]},{"id":"git-lost-stash","tier":"guide","technology":"Git","category":"History & Undo","title":"I lost a stash","summary":"A stash was dropped, popped into a conflict, or cleared. The content usually still exists.","aliases":["lost stash","stash gone","stash drop","stash clear","recover stash","stash disappeared"],"source":"https://git-scm.com/docs/git-stash","inputs":[],"steps":[{"title":"Check what stashes remain","cmd":"git stash list","risk":"safe","look":"Empty means they were dropped or cleared. Stash entries are commits, and dropping one only removes the reference.","signals":[{"match":"stash@\\{","means":"Stashes exist. Check whether the one you want is among them.","goto":""},{"match":"^\\s*$","means":"No stashes listed. Look for dangling commits.","goto":"step:2"}]},{"title":"Find dangling stash commits","cmd":"git fsck --unreachable 2>&1 | findstr commit","risk":"safe","look":"Unreachable commits still in the object store. A stash creates a merge commit, which is a strong identifying signal."},{"title":"Inspect a candidate before acting","cmd":"git show --stat <sha>","risk":"safe","look":"Confirm it is your work. A stash commit shows the working tree state at the time it was created."},{"title":"Restore it as a branch","cmd":"git branch recovered-stash <sha>","risk":"safe","look":"Creates a branch at that commit so it can never be garbage collected. Nothing else is modified."}],"causes":[{"id":"dropped","cause":"The stash was dropped.","fix":"Find the commit in fsck output and branch from it. git stash drop prints the SHA; scroll back in the terminal.","confirm":""},{"id":"popped-conflict","cause":"A pop conflicted and the entry was kept.","fix":"Check git stash list. Pop keeps the entry when it conflicts, precisely so nothing is lost.","confirm":""},{"id":"cleared","cause":"git stash clear was run.","fix":"The commits become unreachable but remain until garbage collection. fsck finds them.","confirm":""},{"id":"wrong-repo","cause":"The stash is in a different clone.","fix":"Stashes are local and are never pushed. Check other clones.","confirm":""},{"id":"gc-collected","cause":"Garbage collection removed them.","fix":"If fsck finds nothing, they are gone. This is why stashes are for hours, not weeks.","confirm":""}],"verify":["The work is on a branch.","git log shows the expected content.","It is committed properly rather than stashed again."],"escalate":["Output of git stash list","Unreachable commits from fsck","What git show reveals for each candidate"]},{"id":"git-slow-repo","tier":"guide","technology":"Git","category":"Performance","title":"Git operations are very slow","summary":"status, checkout and commit take many seconds in a repository that should be fast.","aliases":["git slow","status slow","checkout slow","large repository","git performance","slow commit"],"source":"https://git-scm.com/docs/git-gc","inputs":[],"steps":[{"title":"Measure where the time goes","cmd":"git count-objects -vH","risk":"safe","look":"size-pack and the loose object count. Many loose objects or a very large pack both slow everything down.","signals":[{"match":"count: [1-9]\\d{4,}","means":"Tens of thousands of loose objects. Repacking will help substantially.","goto":"cause:loose-objects"},{"match":"size-pack: \\d+\\.\\d+ GiB","means":"A multi-gigabyte pack. Large binaries are likely in history.","goto":"cause:large-history"}]},{"title":"Find the largest objects in history","cmd":"git rev-list --objects --all | git cat-file --batch-check=\"%(objectsize) %(rest)\" | sort -rn | head -10","risk":"safe","look":"Sizes in bytes with paths. Binaries committed years ago still cost every clone, forever."},{"title":"Check the working tree size","cmd":"git status --porcelain | measure-object -line && dir /s /b | measure-object -line","risk":"safe","look":"A very large working tree makes status slow regardless of history. Untracked build output is a common cause."},{"title":"Repack the repository","cmd":"git gc --aggressive --prune=now","risk":"destructive","look":"count-objects shows far fewer loose objects and a smaller total.","note":"Repacks objects and permanently deletes anything unreachable, including reflog entries beyond the expiry and dropped stashes. If you are also trying to recover lost work, do that first — this removes exactly the objects fsck would have found. It can take a long time on a large repository."}],"causes":[{"id":"loose-objects","cause":"Many loose objects.","fix":"git gc packs them. Routine maintenance usually handles it automatically.","confirm":""},{"id":"large-history","cause":"Large binaries in history.","fix":"They cost every clone forever. Removing them requires a coordinated history rewrite.","confirm":""},{"id":"untracked-files","cause":"Many untracked files slow status.","fix":"Add build output to .gitignore. Git scans everything otherwise.","confirm":""},{"id":"no-fsmonitor","cause":"Status scans the whole tree every time.","fix":"Enable core.fsmonitor on a large repository.","confirm":""},{"id":"antivirus","cause":"Antivirus scans every file Git touches.","fix":"Exclude the repository directory. On Windows this is frequently the dominant cost.","confirm":""},{"id":"should-use-lfs","cause":"Large assets are tracked directly.","fix":"Move them to Git LFS going forward.","confirm":""}],"verify":["Common operations feel fast.","Loose object count is low.","Large binaries are in LFS or excluded."],"escalate":["Output of git count-objects -vH","The largest objects in history","Whether antivirus scans the repository"]},{"id":"git-cherry-pick-conflict","tier":"guide","technology":"Git","category":"Merging","title":"Cherry-pick stops with a conflict","summary":"A commit does not apply cleanly to this branch because its context differs.","aliases":["cherry-pick conflict","could not apply","cherry pick failed","after resolving conflicts","backport conflict","cherry-pick error"],"source":"https://git-scm.com/docs/git-cherry-pick","inputs":[{"key":"sha","label":"Commit to pick","example":"a1b2c3d"}],"steps":[{"title":"See which files conflicted","cmd":"git status --short","risk":"safe","look":"UU entries are conflicts. Cherry-pick applies a diff, so it fails whenever surrounding context differs from the original branch.","signals":[{"match":"^UU ","means":"Content conflict. Resolve as with a merge.","goto":"cause:context-differs"},{"match":"^(DU|UD) ","means":"The file does not exist here in the same form.","goto":"cause:missing-file"}]},{"title":"Look at what the original commit changed","cmd":"git show {sha}","risk":"safe","look":"The intended change. Resolving well means reproducing that intent here, not just making the markers go away."},{"title":"Check whether the change is already present","cmd":"git log --oneline --grep=\"$(git log -1 --format=%s {sha})\"","risk":"safe","look":"A commit with the same subject already on this branch means it was backported and the pick is unnecessary."},{"title":"Abort and return to a clean state","cmd":"git cherry-pick --abort","risk":"destructive","look":"A clean working tree at the pre-pick commit.","note":"Discards the in-progress cherry-pick along with any conflict resolution you have done. Committed history is untouched, but unsaved resolution work is lost. Use --skip instead if you want to abandon only this commit in a multi-commit pick."}],"causes":[{"id":"context-differs","cause":"The surrounding code differs from the source branch.","fix":"Resolve to the intended final state. Read the original commit to understand the intent.","confirm":""},{"id":"missing-file","cause":"The file does not exist on this branch.","fix":"The change may need adapting rather than picking. Consider whether it applies at all.","confirm":""},{"id":"already-applied","cause":"The change is already here.","fix":"Skip it. git cherry-pick --skip moves on in a multi-commit pick.","confirm":""},{"id":"needs-dependency","cause":"The commit depends on an earlier one not present.","fix":"Pick the dependency first, or pick the range.","confirm":""},{"id":"should-merge","cause":"You are picking many commits.","fix":"A merge or rebase is usually better than a long sequence of cherry-picks.","confirm":""}],"verify":["The cherry-pick completes.","The change works on this branch, not just compiles.","Tests pass."],"escalate":["Which files conflicted","The original commit's diff","Whether the change is already present"]}]</script>
<script>
"use strict";
const BANK = JSON.parse(document.getElementById("data").textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- session state (in memory only; nothing is persisted) ---------- */
const CTX = {};                 // placeholder key -> value
let CUR = null;                 // open runbook
let LOG = [];                   // [{t, step, cmd, note}]
let CURSOR = -1;                // keyboard cursor in results

/* ---------- search ---------- */
const flat = s => String(s ?? "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
function score(r, q) {
  if (!q.trim()) return 1;
  const qq = flat(q), qt = qq.split(" ").filter(t => t.length > 1);
  const title = flat(r.title), al = (r.aliases || []).map(flat);
  let s = 0;
  if (title.includes(qq)) s += 100;
  if (al.some(a => a.includes(qq) || qq.includes(a))) s += 80;
  const hay = [title, flat(r.summary), al.join(" "), flat(r.category)].join(" ");
  for (const t of qt) {
    if (title.includes(t)) s += 18;
    else if (al.some(a => a.includes(t))) s += 14;
    else if (hay.includes(t)) s += 4;
  }
  return s;
}

let TECH = "All", CAT = "All";

function renderChips() {
  const techs = [...new Set(BANK.map(r => r.technology))].sort();
  $("#techchips").innerHTML = ["All", ...techs].map(t => {
    const n = t === "All" ? BANK.length : BANK.filter(r => r.technology === t).length;
    return `<button class="tab${t === TECH ? " on" : ""}" data-t="${esc(t)}">${esc(t)}<span class="n">${n}</span></button>`;
  }).join("");
  document.querySelectorAll("#techchips .tab").forEach(b => b.onclick = () => {
    TECH = b.dataset.t; CAT = "All"; renderChips(); renderResults();
  });

  const pool = TECH === "All" ? BANK : BANK.filter(r => r.technology === TECH);
  const cats = [...new Set(pool.map(r => r.category).filter(Boolean))].sort();
  $("#catchips").innerHTML = cats.length > 1
    ? ["All", ...cats].map(c =>
        `<button class="tab${c === CAT ? " on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")
    : "";
  document.querySelectorAll("#catchips .tab").forEach(b => b.onclick = () => {
    CAT = b.dataset.c; renderChips(); renderResults();
  });
}

function renderResults() {
  const q = $("#q").value;
  let pool = BANK;
  if (TECH !== "All") pool = pool.filter(r => r.technology === TECH);
  if (CAT !== "All") pool = pool.filter(r => r.category === CAT);
  const arr = pool.map(r => ({ r, s: score(r, q) })).filter(x => x.s > 0)
                  .sort((a, b) => b.s - a.s).slice(0, 60);
  CURSOR = arr.length ? 0 : -1;
  $("#results").innerHTML = arr.length ? arr.map((x, i) => {
    const r = x.r;
    return `<li><button class="hit${i === 0 ? " cur" : ""}" data-id="${esc(r.id)}">
      <h3>${esc(r.title)}</h3><p>${esc(r.summary)}</p>
      <span class="meta">
        <span>${esc(r.technology)}</span>
        <span>${esc(r.category || "")}</span>
        <span>${(r.steps || []).length} steps</span>
        <span>${(r.causes || []).length} causes</span>
      </span></button></li>`;
  }).join("") : `<li class="empty">Nothing matched. Try the exact error string from your terminal,
    or a plainer phrase like "pod won't start".</li>`;
  document.querySelectorAll(".hit").forEach(b => b.onclick = () => open(b.dataset.id));
}

/* ---------- placeholder substitution ---------- */
function fill(cmd, asHtml) {
  return cmd.replace(/\{([a-z0-9_]+)\}/g, (m, k) => {
    const v = CTX[k];
    if (!asHtml) return v || m;
    return v ? `<span class="fill">${esc(v)}</span>`
             : `<span class="unfilled">${esc(m)}</span>`;
  });
}

function ctxBar() {
  const keys = (CUR && CUR.inputs) || [];
  $("#ctxfields").innerHTML = keys.map(i =>
    `<label>${esc(i.label)}<input data-k="${esc(i.key)}" placeholder="${esc(i.example || "")}"
      value="${esc(CTX[i.key] || "")}" size="${Math.max(8, (i.example || "").length)}"></label>`).join("");
  document.querySelectorAll("#ctxfields input").forEach(inp => {
    inp.oninput = () => { CTX[inp.dataset.k] = inp.value.trim(); repaintCmds(); };
  });
}

function repaintCmds() {
  document.querySelectorAll("[data-cmd]").forEach(el => {
    el.innerHTML = fill(el.dataset.cmd, true);
  });
}

/* ---------- runbook view ---------- */
function open(id) {
  CUR = BANK.find(r => r.id === id);
  if (!CUR) return;
  LOG = [];
  (CUR.inputs || []).forEach(i => { if (!(i.key in CTX)) CTX[i.key] = ""; });
  ctxBar();

  const RISK = { safe: ["Read only", "c-safe"], state: ["Changes state", "c-state"],
                 destructive: ["Destructive", "c-destructive"] };

  const steps = (CUR.steps || []).map((s, i) => {
    const [label, cls] = RISK[s.risk] || RISK.safe;
    const danger = s.risk === "destructive";
    const body = danger
      ? `<div class="veil" data-reveal="${i}">Command hidden. Read the warning, then tap to reveal.</div>`
      : `<pre data-cmd="${esc(s.cmd)}"></pre><button class="copy" data-copy="${i}">Copy</button>`;
    const note = s.note ? `<p class="note${s.risk === "state" ? " note-state" : ""}">${esc(s.note)}</p>` : "";
    const sig = (s.signals || []).length
      ? `<details class="match"><summary>Paste your actual output to read it</summary>
           <textarea data-sig="${i}" placeholder="Paste the output you got, then release the key."></textarea>
           <div class="verdict miss" data-verdict="${i}">Nothing matched yet. Paste output above.</div>
         </details>` : "";
    return `<li class="step${danger ? " danger" : ""}" data-step="${i}">
      <button class="mark" data-done="${i}" aria-label="Mark step ${i + 1} done">${i + 1}</button>
      <div class="shead"><span class="stitle">${esc(s.title)}</span>
        <span class="chip ${cls}">${label}</span></div>
      ${note}
      <div class="cmd">${body}</div>
      <p class="look">${esc(s.look)}</p>
      ${sig}</li>`;
  }).join("");

  const causes = (CUR.causes || []).map((c, i) =>
    `<div class="cause" data-cause="${esc(c.id)}">
       <div><span class="rank">${i + 1}</span><span class="what">${esc(c.cause)}</span></div>
       <div class="fix"><b>Fix.</b> ${esc(c.fix)}</div></div>`).join("");

  const prov = `Commands vary by version and environment — read each one before you run it.`
    + (CUR.source ? ` <a href="${esc(CUR.source)}" target="_blank" rel="noopener">Official documentation</a>` : "");

  $("#rbview").innerHTML = `
    <button class="back" id="back">&larr; All runbooks</button>
    <h2>${esc(CUR.title)}</h2>
    <p class="sum">${esc(CUR.summary)}</p>
    <p class="prov">${prov}</p>
    <ol class="steps">${steps}</ol>
    ${causes ? `<div class="sec"><h3>Likely causes, most common first</h3>${causes}</div>` : ""}
    ${(CUR.verify || []).length ? `<div class="sec"><h3>You are done when</h3>
       <ul class="plain">${CUR.verify.map(v => `<li>${esc(fill(v, false))}</li>`).join("")}</ul></div>` : ""}`;

  $("#searchview").style.display = "none";
  $("#results").style.display = "none";
  $("#rbview").style.display = "block";
  $("#bar").style.display = "block";
  $("#foot").textContent = "";
  window.scrollTo(0, 0);
  repaintCmds(); wire(); progress();
}

function wire() {
  $("#back").onclick = home;

  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => {
    const s = CUR.steps[+b.dataset.copy];
    copy(fill(s.cmd, false), "Command copied");
  });

  document.querySelectorAll("[data-reveal]").forEach(v => v.onclick = () => {
    const i = +v.dataset.reveal, s = CUR.steps[i];
    v.outerHTML = `<pre data-cmd="${esc(s.cmd)}"></pre><button class="copy" data-copy="${i}">Copy</button>`;
    repaintCmds(); wire();
  });

  document.querySelectorAll("[data-done]").forEach(b => b.onclick = () => {
    const i = +b.dataset.done, li = b.closest(".step"), s = CUR.steps[i];
    li.classList.toggle("done");
    if (li.classList.contains("done")) {
      LOG.push({ t: new Date().toISOString().slice(11, 19), step: s.title, cmd: fill(s.cmd, false) });
    } else {
      LOG = LOG.filter(e => e.step !== s.title);
    }
    progress();
  });

  document.querySelectorAll("[data-sig]").forEach(ta => ta.oninput = () => {
    const i = +ta.dataset.sig, s = CUR.steps[i], text = ta.value;
    const out = $(`[data-verdict="${i}"]`);
    document.querySelectorAll(".cause").forEach(c => c.classList.remove("lit"));
    if (!text.trim()) {
      out.className = "verdict miss";
      out.textContent = "Nothing matched yet. Paste output above.";
      return;
    }
    const m = (s.signals || []).find(g => {
      const pat = String(g.match || "").replace(/^\(\?[imsx]+\)/, "");
      if (!pat) return false;
      try { return new RegExp(pat, "i").test(text); }
      catch (e) { console.warn("signal regex failed:", g.match, e.message); return false; }
    });
    if (!m) {
      out.className = "verdict miss";
      out.textContent = "No known signature in that output. It may still be fine — read the note above, "
        + "or add this output as a new signal so the next person gets a hit.";
      return;
    }
    out.className = "verdict hit";
    const target = m.goto || "";
    out.innerHTML = `<b>That output means:</b>${esc(m.means)}`;
    if (target.startsWith("cause:")) {
      const c = (CUR.causes || []).find(x => x.id === target.slice(6));
      const el = $(`[data-cause="${CSS.escape(target.slice(6))}"]`);
      if (el) el.classList.add("lit");
      if (c) out.innerHTML += `<button class="jump">Go to the fix: ${esc(c.cause)}</button>`;
      out.querySelector(".jump") && (out.querySelector(".jump").onclick =
        () => el && el.scrollIntoView({ behavior: "smooth", block: "center" }));
    } else if (target.startsWith("step:")) {
      const n = +target.slice(5);
      out.innerHTML += `<button class="jump">Go to step ${n}</button>`;
      out.querySelector(".jump").onclick = () =>
        document.querySelector(`[data-step="${n - 1}"]`).scrollIntoView({ behavior: "smooth", block: "center" });
    }
    LOG.push({ t: new Date().toISOString().slice(11, 19), step: s.title,
               cmd: fill(s.cmd, false), note: m.means });
  });
}

function progress() {
  const total = (CUR.steps || []).length;
  const done = document.querySelectorAll(".step.done").length;
  $("#prog").textContent = `${done} of ${total} checks done`;
}

/* ---------- exports ---------- */
function copy(t, msg) {
  navigator.clipboard.writeText(t).then(() => {
    const el = $("#toast"); el.textContent = msg; el.style.display = "block";
    setTimeout(() => el.style.display = "none", 1600);
  }, () => prompt("Copy manually:", t));
}

$("#a-safe").onclick = () => {
  const c = (CUR.steps || []).filter(s => s.risk === "safe").map(s => `# ${s.title}\n${fill(s.cmd, false)}`);
  copy(c.join("\n\n"), `${c.length} read-only commands copied`);
};

$("#a-esc").onclick = () => {
  const L = [`## ${CUR.title}`, "", "**What I checked**"];
  LOG.forEach(e => { L.push(`- ${e.step} — \`${e.cmd}\``); if (e.note) L.push(`  - saw: ${e.note}`); });
  if (!LOG.length) L.push("- (nothing recorded yet)");
  L.push("", "**Still needed**");
  (CUR.escalate || []).forEach(x => L.push(`- ${fill(x, false)}`));
  copy(L.join("\n"), "Handoff notes copied");
};

$("#a-log").onclick = () => {
  const L = [`# Incident: ${CUR.title}`, `Runbook: ${CUR.id} (verified ${CUR.verified_on || "n/a"})`, ""];
  Object.entries(CTX).filter(([, v]) => v).forEach(([k, v]) => L.push(`- ${k}: \`${v}\``));
  L.push("", "| time | check | command | observed |", "|---|---|---|---|");
  LOG.forEach(e => L.push(`| ${e.t} | ${e.step} | \`${e.cmd}\` | ${e.note || ""} |`));
  if (!LOG.length) L.push("| | no checks recorded | | |");
  copy(L.join("\n"), "Incident log copied as markdown");
};

/* ---------- navigation ---------- */
function home() {
  CUR = null; LOG = [];
  $("#searchview").style.display = "block";
  $("#results").style.display = "block";
  $("#rbview").style.display = "none";
  $("#bar").style.display = "none";
  $("#ctxfields").innerHTML = "";
  $("#foot").textContent = FOOT;
  $("#q").focus(); $("#q").select();
}

$("#q").oninput = renderResults;

document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); $("#q").select(); return; }
  if (e.key === "Escape" && CUR) { home(); return; }
  if (CUR || !["ArrowDown", "ArrowUp", "Enter"].includes(e.key)) return;
  const hits = [...document.querySelectorAll(".hit")];
  if (!hits.length) return;
  if (e.key === "Enter") { e.preventDefault(); hits[Math.max(0, CURSOR)].click(); return; }
  e.preventDefault();
  hits[CURSOR]?.classList.remove("cur");
  CURSOR = (CURSOR + (e.key === "ArrowDown" ? 1 : -1) + hits.length) % hits.length;
  hits[CURSOR].classList.add("cur");
  hits[CURSOR].scrollIntoView({ block: "nearest" });
});

const techs = [...new Set(BANK.map(r => r.technology))].sort();
const FOOT = `${BANK.length} runbooks across ${techs.length} technologies: ${techs.join(", ")}. `
  + `Runs entirely in this file — nothing is sent anywhere, nothing is executed for you, `
  + `and nothing is saved when you close the tab. Every command is yours to run.\n\n`
  + `Designed and built by Dinesh Ilangovan.`;
$("#foot").textContent = FOOT;
renderChips();
renderResults();
</script>
</body>
</html>
