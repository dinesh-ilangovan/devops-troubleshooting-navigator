<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Miratech DevOps Runbook</title>
<style>
:root{
  --paper:#F4F6F8; --surface:#fff; --ink:#111A22; --muted:#5C6B7A;
  --rule:#DCE2E8; --soft:#EAEEF2; --nav:#111A22; --navink:#C9D5E0;
  --safe:#0E7A52; --state:#9C5A00; --danger:#BA2B24; --focus:#1F5FA8;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --mono:"Cascadia Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
  --side:292px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.5}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.shell{display:flex;min-height:100vh}

aside{width:var(--side);flex:0 0 var(--side);background:var(--nav);color:var(--navink);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{padding:18px 20px 14px;border-bottom:1px solid #22303C}
.brand .org{font-size:10.5px;letter-spacing:.14em;color:#7E93A6;font-weight:600}
.brand h1{margin:3px 0 0;font-size:17px;font-weight:650;color:#fff;letter-spacing:-.01em}
.brand .by{font-size:11.5px;color:#7E93A6;margin-top:3px}
.sbox{padding:13px 16px;border-bottom:1px solid #22303C}
.sbox input{width:100%;background:#1B2833;border:1px solid #2C3B49;border-radius:6px;
  color:#fff;padding:8px 11px;font-size:14px}
.sbox input:focus{border-color:#4A7CB0;outline:none}
.sbox input::placeholder{color:#6B7F91}
nav{flex:1;overflow-y:auto;padding:8px 0 26px}
nav::-webkit-scrollbar{width:8px}
nav::-webkit-scrollbar-thumb{background:#2C3B49;border-radius:4px}
.tgroup{margin:2px 0}
.thead{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;
  padding:9px 18px;cursor:pointer;text-align:left;color:#E3EAF1;font-size:13.5px;font-weight:600}
.thead:hover{background:#1A2732}
.thead .car{font-family:var(--mono);font-size:10px;color:#6B7F91;width:9px}
.thead .ct{margin-left:auto;font-size:11px;color:#6B7F91;font-variant-numeric:tabular-nums}
.tbody{display:none}
.tgroup.open .tbody{display:block}
.tgroup.open .thead{color:#fff}
.chead{padding:8px 18px 4px 35px;font-size:10.5px;letter-spacing:.08em;color:#66798B;font-weight:600}
.item{display:block;width:100%;background:none;border:0;text-align:left;cursor:pointer;
  padding:6px 18px 6px 35px;color:#A8BBCB;font-size:13.5px;line-height:1.35;border-left:2px solid transparent}
.item:hover{background:#1A2732;color:#fff}
.item.sel{background:#1E2D3A;color:#fff;border-left-color:#5B93CE}
.nohit{padding:18px;color:#6B7F91;font-size:13px}

main{flex:1;min-width:0;display:flex;flex-direction:column}
.ctx{background:var(--surface);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:9}
.ctx .in{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:10px 34px;max-width:1080px}
.crumb{font-size:12.5px;color:var(--muted);margin-right:auto}
.crumb b{color:var(--ink);font-weight:600}
.ctx label{display:flex;align-items:baseline;gap:6px;font-size:12px;color:var(--muted)}
.ctx input{border:0;border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:12.5px;
  padding:2px 3px;width:16ch;background:transparent}
.ctx input:focus{border-bottom-color:var(--focus);outline:none}
.pane{flex:1;padding:30px 34px 80px;max-width:1080px}

.hero h2{margin:0 0 6px;font-size:27px;letter-spacing:-.02em;font-weight:650}
.hero p{margin:0 0 26px;color:var(--muted);max-width:64ch}
.stats{display:flex;gap:34px;flex-wrap:wrap;padding:20px 0;border-top:1px solid var(--rule);
  border-bottom:1px solid var(--rule);margin-bottom:28px}
.stat b{display:block;font-size:26px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:16px;
  text-align:left;cursor:pointer}
.card:hover{border-color:var(--ink)}
.card h3{margin:0;font-size:15.5px;font-weight:640}
.card p{margin:4px 0 0;font-size:13px;color:var(--muted)}

.rb h2{margin:0 0 6px;font-size:25px;letter-spacing:-.02em;font-weight:650;line-height:1.22}
.rb .sum{margin:0 0 12px;color:var(--muted);max-width:66ch;font-size:16px}
.src{font-size:12.5px;color:var(--muted);margin:0 0 28px}
.src a{color:var(--focus)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 22px}
.tag{font-size:11.5px;background:var(--soft);color:var(--muted);padding:3px 9px;border-radius:20px}

ol.steps{list-style:none;margin:0;padding:0}
.step{position:relative;padding:0 0 28px 42px}
.step::before{content:"";position:absolute;left:12px;top:26px;bottom:0;width:1px;background:var(--rule)}
.step:last-child::before{display:none}
.step.d::before{background:var(--danger);opacity:.3}
.num{position:absolute;left:0;top:0;width:25px;height:25px;border:1px solid var(--rule);
  background:var(--surface);border-radius:50%;font-family:var(--mono);font-size:12px;
  color:var(--muted);line-height:23px;text-align:center}
.step.d .num{border-color:var(--danger);color:var(--danger)}
.sh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:9px}
.st{font-weight:640;font-size:16.5px;letter-spacing:-.005em}
.chip{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:3px;letter-spacing:.03em}
.c-safe{color:var(--safe);background:rgba(14,122,82,.09)}
.c-state{color:var(--state);background:rgba(156,90,0,.10)}
.c-destructive{color:#fff;background:var(--danger)}
.cmd{position:relative;background:var(--ink);border-radius:7px;margin:0 0 11px}
.cmd pre{margin:0;padding:14px 88px 14px 15px;overflow-x:auto;font-family:var(--mono);
  font-size:13.5px;line-height:1.6;color:#E9EFF4;white-space:pre-wrap;word-break:break-word}
.fill{color:#8AD3AC;font-weight:600}
.un{color:#E4AC6E;border-bottom:1px dashed #8A6A48}
.cp{position:absolute;top:9px;right:9px;background:#2A3742;border:0;color:#C6D3DD;
  font-size:12px;padding:5px 11px;border-radius:5px;cursor:pointer}
.cp:hover{background:#3A4854;color:#fff}
.veil{padding:14px 15px;color:#E4AC6E;font-family:var(--mono);font-size:13px;cursor:pointer}
.veil:hover{color:#fff}
.look{font-size:15px;color:var(--muted);margin:0 0 9px;max-width:68ch}
.note{font-size:14.5px;border-left:3px solid var(--danger);padding:8px 0 8px 13px;
  margin:0 0 11px;max-width:66ch;background:linear-gradient(90deg,rgba(186,43,36,.045),transparent)}
.note.s{border-left-color:var(--state);background:linear-gradient(90deg,rgba(156,90,0,.05),transparent)}

.br{margin:13px 0 0;background:var(--surface);border:1px solid var(--rule);border-radius:7px;overflow:hidden}
.brh{font-size:10.5px;font-weight:700;letter-spacing:.07em;color:var(--muted);
  padding:9px 15px;background:var(--soft);border-bottom:1px solid var(--rule)}
.brow{padding:11px 15px;border-bottom:1px solid var(--soft);font-size:14.5px}
.brow:last-child{border-bottom:0}
.bif code{font-family:var(--mono);font-size:12.5px;background:var(--soft);padding:2px 7px;border-radius:4px}
.bif b{font-weight:650;color:var(--muted);font-size:12px;letter-spacing:.03em;margin-right:5px}
.bthen{color:var(--muted);margin-top:4px;max-width:68ch}
.goto{color:var(--focus);font-weight:600;white-space:nowrap}

.sec{margin-top:38px;padding-top:22px;border-top:1px solid var(--rule)}
.sec h3{font-size:11.5px;font-weight:700;letter-spacing:.07em;margin:0 0 15px;color:var(--muted)}
.cz{background:var(--surface);border:1px solid var(--rule);border-radius:7px;padding:14px 16px;
  margin-bottom:9px;display:flex;gap:13px}
.rk{font-family:var(--mono);font-size:12px;color:#fff;background:var(--muted);border-radius:50%;
  width:21px;height:21px;line-height:21px;text-align:center;flex:0 0 21px;margin-top:2px}
.cz .w{font-weight:640;font-size:15.5px}
.cz .fx{color:var(--muted);font-size:14.5px;margin-top:4px;max-width:68ch}
.cz .fx b{color:var(--ink);font-weight:640}
ul.pl{margin:0;padding-left:20px;color:var(--muted);font-size:15px;max-width:68ch}
ul.pl li{margin-bottom:6px}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);
  color:#fff;padding:10px 20px;border-radius:6px;font-size:13.5px;z-index:40;display:none}
.burger{display:none}

@media(max-width:900px){
  aside{position:fixed;left:0;top:0;z-index:30;transform:translateX(-100%);transition:transform .18s}
  body.nav aside{transform:none}
  .burger{display:inline-flex;background:none;border:1px solid var(--rule);border-radius:6px;
    padding:5px 11px;cursor:pointer;font-size:15px;margin-right:12px}
  .ctx .in,.pane{padding-left:16px;padding-right:16px}
  .step{padding-left:33px}.num{width:22px;height:22px;line-height:20px}
  .step::before{left:11px}
  .cmd pre{padding:40px 15px 14px}.cp{top:8px;right:auto;left:9px}
  .rb h2{font-size:21px}.hero h2{font-size:22px}
}
</style>
</head>
<body>
<div class="shell">

<aside>
  <div class="brand">
    <div class="org">MIRATECH &middot; INTERNAL</div>
    <h1>DevOps Runbook</h1>
    <div class="by">Designed &amp; built by Dinesh Ilangovan</div>
  </div>
  <div class="sbox"><input id="q" placeholder="Search symptom or error…" autocomplete="off"></div>
  <nav id="nav"></nav>
</aside>

<main>
  <div class="ctx"><div class="in">
    <button class="burger" id="burger">&#9776;</button>
    <span class="crumb" id="crumb"></span>
    <span id="fields"></span>
  </div></div>
  <div class="pane" id="pane"></div>
</main>

</div>
<div class="toast" id="toast"></div>

<script id="data" type="application/json">[{"id":"git-committed-to-main","tier":"guide","technology":"Git","category":"History & Undo","title":"I committed to main by mistake","summary":"The commit is on the wrong branch. What you do next depends entirely on whether it has been pushed.","aliases":["committed to main","wrong branch","committed accidentally","undo commit","committed by mistake","move commit to branch","oops committed"],"source":"https://git-scm.com/docs/git-reset","inputs":[{"key":"branch","label":"Branch you meant to use","example":"feature/checkout-retry"},{"key":"remote","label":"Remote","example":"origin"}],"steps":[{"title":"Find out whether the commit has left your machine","cmd":"git status -sb && git log --oneline -3","risk":"safe","look":"The first line. 'ahead 1' means it is still local and you have easy options. If it is not ahead, it is already on the remote and rewriting is now other people's problem too.","signals":[{"match":"ahead \\d+","means":"Still local. You can move it cleanly.","goto":"cause:local-only"},{"match":"\\[origin/main\\]\\s*$","means":"Already pushed. Do not rewrite shared history.","goto":"cause:already-pushed"}]},{"title":"Move the commit onto the branch it belonged on","cmd":"git branch {branch} && git reset --hard HEAD~1 && git switch {branch}","risk":"destructive","note":"reset --hard discards every uncommitted change in your working tree. Run git stash first if you have any. This is only safe because git branch {branch} was created on the line before, so the commit itself survives on that branch.","look":"After this, main is back where it was and your commit sits on {branch}.","signals":[{"match":"(?i)error: .*already exists","means":"That branch already exists. Pick another name or switch to it and cherry-pick instead.","goto":"cause:branch-exists"}]},{"title":"Confirm nothing was lost","cmd":"git log --oneline -3 {branch} && git log --oneline -3 main","risk":"safe","look":"Your commit on {branch}, and main matching the remote. If anything looks wrong, git reflog still has every prior position for about 90 days."}],"causes":[{"id":"local-only","cause":"The commit exists only in your clone.","fix":"Create the branch at the current commit, then reset main back one. Nobody else is affected.","confirm":"git status -sb"},{"id":"already-pushed","cause":"The commit is on the remote and others may have pulled it.","fix":"Do not reset and force-push. Use git revert to add a new commit that undoes it, then apply the original work on a proper branch.","confirm":"git log --oneline {remote}/main -3"},{"id":"branch-exists","cause":"A branch with that name is already present.","fix":"Switch to it and cherry-pick the commit across, then reset main.","confirm":"git branch --list {branch}"}],"verify":["git log on main matches the remote's main.","Your commit appears in git log on {branch}.","git status reports a clean working tree, or exactly the changes you stashed."],"escalate":["Output of git status -sb","git log --oneline -5 for both branches","Whether the commit was pushed, and whether anyone has pulled since"]},{"id":"git-force-push-safely","tier":"guide","technology":"Git","category":"Remotes","title":"I need to force-push a rebased branch","summary":"Rewriting a shared branch can silently destroy a colleague's commits. There is a safe form of this command.","aliases":["force push","push -f","rebase then push","force-with-lease","non-fast-forward","rejected push"],"source":"https://git-scm.com/docs/git-push","inputs":[{"key":"branch","label":"Branch","example":"feature/checkout-retry"},{"key":"remote","label":"Remote","example":"origin"}],"steps":[{"title":"Check whether anyone else has pushed to this branch","cmd":"git fetch {remote} && git log --oneline {remote}/{branch} -5","risk":"safe","look":"Commits you do not recognise. If someone else's work is on this branch, a force-push will delete it and they will not get a warning.","signals":[{"match":"(?i)commit","means":"Read the author of each. Anything not yours means stop and talk to them first.","goto":"cause:shared-branch"}]},{"title":"Force-push, but only if the remote is where you last saw it","cmd":"git push --force-with-lease={branch} {remote} {branch}","risk":"destructive","note":"This rewrites remote history. --force-with-lease aborts if someone pushed since your last fetch, which plain --force does not. Never use plain --force on a shared branch. If this is a protected branch, it should be rejected by policy, not by your judgement.","look":"A forced update line. If it is rejected with 'stale info', someone pushed after your fetch and the lease did its job.","signals":[{"match":"(?i)stale info|rejected","means":"The lease saved you. Someone pushed after your last fetch. Fetch again and re-examine before retrying.","goto":"cause:raced"},{"match":"(?i)protected branch|pre-receive hook declined","means":"Branch protection blocked it. That is working as intended; open a PR instead.","goto":"cause:protected"}]}],"causes":[{"id":"shared-branch","cause":"Other people have commits on this branch.","fix":"Do not force-push. Merge their work in, or coordinate a window with them first.","confirm":"git log --format='%an %s' {remote}/{branch} -10"},{"id":"raced","cause":"Someone pushed between your fetch and your push.","fix":"Fetch, inspect what arrived, rebase onto it, then retry with --force-with-lease.","confirm":"git fetch {remote} && git log --oneline {remote}/{branch} -5"},{"id":"protected","cause":"Branch protection rules forbid force-push.","fix":"Open a pull request. If the rewrite is genuinely required, it needs a repo admin, not a workaround.","confirm":"git ls-remote {remote} {branch}"}],"verify":["{remote}/{branch} points at your intended commit.","No commits by other authors disappeared from the log.","CI on the branch is green after the rewrite."],"escalate":["git log --oneline of local and remote branch","The exact push output including any rejection reason","Whether the branch is protected and who owns it"]},{"id":"git-merge-conflict","tier":"guide","technology":"Git","category":"Merging","title":"Merge or rebase stopped with conflicts","summary":"Git cannot combine two changes automatically and is waiting for you to decide.","aliases":["merge conflict","conflict","both modified","fix conflicts and run commit","rebase conflict","unmerged paths"],"source":"https://git-scm.com/docs/git-merge","inputs":[{"key":"branch","label":"Branch being merged","example":"main"}],"steps":[{"title":"See exactly which files are unmerged","cmd":"git status --short","risk":"safe","look":"Lines starting UU are both-modified. AA is both-added, DU and UD are delete-versus-modify, which need a decision rather than an edit.","signals":[{"match":"^UU ","means":"Both sides changed the same file. Edit it and resolve.","goto":"cause:both-modified"},{"match":"^(DU|UD) ","means":"One side deleted what the other changed. Neither version is automatically right.","goto":"cause:delete-modify"}]},{"title":"Understand which operation you are inside","cmd":"git status | head -3","risk":"safe","look":"Rebase and merge resolve identically but finish differently. Finishing the wrong way is where people lose work."},{"title":"See both sides of a conflicting file","cmd":"git diff --diff-filter=U","risk":"safe","look":"The conflict markers with both versions. The section above ======= is your current branch, below it is what you are bringing in."},{"title":"Abort and return to where you started","cmd":"git merge --abort","risk":"destructive","look":"A clean working tree back at the pre-merge commit. This is always safe for committed history, and is the right move when a merge has gone badly.","note":"Discards the entire in-progress merge and any conflict resolution you have done so far. Committed work is untouched, but unsaved resolution effort is lost. Inside a rebase, the equivalent is git rebase --abort."}],"causes":[{"id":"both-modified","cause":"Both branches changed the same lines.","fix":"Edit the file to the intended final state, remove the markers, git add it, then continue.","confirm":""},{"id":"delete-modify","cause":"One branch deleted a file the other modified.","fix":"Decide deliberately: git rm to accept the deletion, or git add to keep the modified version.","confirm":""},{"id":"wrong-finish","cause":"Finished a rebase with git commit instead of git rebase --continue.","fix":"Inside a rebase always use git rebase --continue. Inside a merge, git commit is correct.","confirm":""}],"verify":["git status reports a clean tree with no unmerged paths.","The build and tests pass on the merged result.","Neither side's intent was silently dropped."],"escalate":["git status --short output","Whether it is a merge or a rebase","Which files conflicted and how each was resolved"]},{"id":"git-detached-head","tier":"guide","technology":"Git","category":"Branches","title":"You are in detached HEAD state","summary":"Commits made here belong to no branch and become unreachable when you switch away.","aliases":["detached head","not on any branch","head detached at","lost my commits","commits disappeared after checkout"],"source":"https://git-scm.com/docs/git-checkout","inputs":[{"key":"branch","label":"Branch to keep the work on","example":"feature/fix-checkout"}],"steps":[{"title":"Confirm the state and whether you have made commits","cmd":"git status -sb && git log --oneline -5","risk":"safe","look":"'HEAD detached at' confirms it. If the log shows commits you made here, they exist but nothing points at them yet.","signals":[{"match":"(?i)HEAD detached","means":"Detached. Any commits here need a branch before you move.","goto":"cause:detached"}]},{"title":"Create a branch at your current position","cmd":"git switch -c {branch}","risk":"safe","look":"Your commits are now on a real branch and safe. Do this before anything else, and before switching away."},{"title":"If you already switched away and lost them, find them in reflog","cmd":"git reflog -20","risk":"safe","look":"Every position HEAD has held, with its SHA. Detached commits remain here for about ninety days, so almost nothing is truly lost."},{"title":"Recover a specific lost commit","cmd":"git branch recovered <sha-from-reflog>","risk":"state","look":"A branch named recovered holding the work. Verify with git log before relying on it.","note":"Creates a new branch pointing at that commit. Nothing existing is modified and no history is rewritten, but pick the SHA carefully or you will branch from the wrong point."}],"causes":[{"id":"detached","cause":"HEAD points at a commit rather than a branch.","fix":"Create a branch here with git switch -c. Do it before switching away.","confirm":""},{"id":"already-switched","cause":"You left detached HEAD and the commits seem gone.","fix":"They are in the reflog. Find the SHA and branch from it.","confirm":""},{"id":"intentional","cause":"You checked out a tag or old commit deliberately.","fix":"Fine as long as you make no commits. If you do, branch first.","confirm":""}],"verify":["git status shows you on a named branch.","git log on that branch contains your commits.","The branch is pushed, or you know it is local only."],"escalate":["git status -sb output","git reflog around the time the work was done","Which commits are missing"]},{"id":"git-large-file-rejected","tier":"guide","technology":"Git","category":"Remotes","title":"Push rejected for file size","summary":"The remote refuses a file over its limit. Deleting it in a new commit does not help; it is still in history.","aliases":["file too large","push rejected size","large file","gh001","exceeds file size limit","git lfs"],"source":"https://docs.github.com/en/repositories/working-with-files/managing-large-files","inputs":[{"key":"file","label":"The oversized file","example":"data/dump.sql"}],"steps":[{"title":"Read the rejection and identify the file and commit","cmd":"git push 2>&1 | more","risk":"safe","look":"The remote names the file and the commit that introduced it. That commit is what must change, not your latest one.","signals":[{"match":"(?i)exceeds|too large|GH001","means":"Size limit. The file is embedded in history and must be removed from it.","goto":"cause:in-history"}]},{"title":"Find the largest objects actually in history","cmd":"git rev-list --objects --all | git cat-file --batch-check=\"%(objecttype) %(objectname) %(objectsize) %(rest)\" | findstr blob","risk":"safe","look":"Sizes are in bytes. This shows what is really in the repository, which is often not what you expected."},{"title":"If it is only in your last commit, remove it there","cmd":"git rm --cached {file} && git commit --amend --no-edit","risk":"destructive","look":"git show --stat no longer lists the file. The file remains on disk because only the index entry was removed.","note":"Rewrites your most recent commit. Safe if that commit has not been pushed. If it has been pushed and others have pulled it, do not amend — the file needs removing from shared history through a coordinated rewrite instead."}],"causes":[{"id":"in-history","cause":"The file is in an earlier commit, so deleting it now changes nothing.","fix":"It must be removed from history. For a single unpushed commit, amend. For anything shared, coordinate a rewrite with the repository owner.","confirm":""},{"id":"should-be-lfs","cause":"The file is a legitimate large asset.","fix":"Track it with Git LFS and add the pattern to .gitattributes before committing it again.","confirm":""},{"id":"should-not-be-committed","cause":"A build artifact or database dump got committed.","fix":"Add it to .gitignore. Artifacts belong in a registry, not in Git.","confirm":""}],"verify":["The push is accepted.","The repository size is reasonable for a fresh clone.",".gitignore or .gitattributes prevents a recurrence."],"escalate":["The verbatim rejection message","Which commit introduced the file","Whether that commit has been pushed and pulled by others"]},{"id":"git-wrong-author","tier":"guide","technology":"Git","category":"History & Undo","title":"Commits show the wrong author or email","summary":"Work commits attributed to a personal address, or the reverse. Usually a missing per-repository config.","aliases":["wrong author","wrong email commit","commits not showing github","unverified commit","wrong git config","author email"],"source":"https://git-scm.com/docs/git-config","inputs":[{"key":"email","label":"Correct email","example":"dinesh@example.com"},{"key":"name","label":"Correct name","example":"Dinesh Ilangovan"}],"steps":[{"title":"See what identity the recent commits carry","cmd":"git log --format='%h %an <%ae>' -5","risk":"safe","look":"The email is what matters for attribution on the hosting side. The display name is cosmetic."},{"title":"See which config is being used and from where","cmd":"git config --show-origin user.email && git config --show-origin user.name","risk":"safe","look":"The file path in the output tells you whether this is global or repository-local. A missing local value means the global one applies."},{"title":"Set the correct identity for this repository only","cmd":"git config user.email \"{email}\" && git config user.name \"{name}\"","risk":"state","look":"git config --show-origin now points at the repository's own config file.","note":"Writes to .git/config for this repository only. Existing commits are unaffected — this changes future commits, nothing more. Setting it locally is the right move when you mix work and personal repositories on one machine."},{"title":"Fix the identity on the most recent commit","cmd":"git commit --amend --reset-author --no-edit","risk":"destructive","look":"git log shows the corrected author on the top commit.","note":"Rewrites the last commit, changing its SHA. Safe while unpushed. If it has been pushed, this creates a divergence that requires a force-push, which rewrites shared history."}],"causes":[{"id":"no-local-config","cause":"No repository-local identity, so a global one applied.","fix":"Set user.email locally in each work repository. Consider clearing the global value so it can never apply silently.","confirm":""},{"id":"already-pushed","cause":"The wrong-author commits are already on the remote.","fix":"Leave them. Rewriting shared history to fix a display name is not a worthwhile trade.","confirm":""},{"id":"unverified","cause":"The email is right but commits show as unverified.","fix":"That is signing, not authorship. Set up commit signing separately.","confirm":""}],"verify":["New commits carry the correct author.","git config --show-origin points at the local config.","No shared history was rewritten to achieve it."],"escalate":["git log with author format","Output of git config --show-origin for user.email","Whether the affected commits are pushed"]},{"id":"git-non-fast-forward","tier":"guide","technology":"Git","category":"Remotes","title":"Push rejected as non-fast-forward","summary":"The remote has commits you do not have locally. Fetch and integrate before pushing.","aliases":["non-fast-forward","push rejected","updates were rejected","fetch first","remote contains work","rejected behind"],"source":"https://git-scm.com/docs/git-push","inputs":[{"key":"branch","label":"Branch","example":"main"},{"key":"remote","label":"Remote","example":"origin"}],"steps":[{"title":"See how far the branches have diverged","cmd":"git fetch {remote} && git status -sb","risk":"safe","look":"The ahead and behind counts. Behind only means a simple pull; both ahead and behind means real divergence that needs a decision.","signals":[{"match":"behind \\d+\\] *$","means":"Only behind. A pull will fast-forward cleanly.","goto":"cause:simply-behind"},{"match":"ahead \\d+, behind \\d+","means":"Diverged. You must choose merge or rebase.","goto":"cause:diverged"}]},{"title":"See exactly which commits are on each side","cmd":"git log --oneline --left-right {remote}/{branch}...HEAD","risk":"safe","look":"Arrows point to which side each commit is on. Read the remote-side commits before deciding; someone else wrote them."},{"title":"Bring the remote work in beneath yours","cmd":"git pull --rebase {remote} {branch}","risk":"state","look":"git status shows ahead only. Conflicts may pause the rebase; resolve then continue.","note":"Replays your local commits on top of the remote ones, which rewrites their SHAs. Safe for commits you have not pushed. If any of your local commits are already public elsewhere, use a merge instead so their identity does not change."},{"title":"Push once it is a fast-forward","cmd":"git push {remote} {branch}","risk":"safe","look":"The push is accepted. If it is rejected again, someone pushed while you were rebasing; fetch and repeat."}],"causes":[{"id":"simply-behind","cause":"You are only behind.","fix":"git pull. Nothing of yours is at risk.","confirm":""},{"id":"diverged","cause":"Both sides have commits.","fix":"Rebase for a linear history, merge to preserve exact commit identity. Team convention decides.","confirm":""},{"id":"force-temptation","cause":"Tempted to force-push past it.","fix":"Do not. Those remote commits are someone's work and force-push deletes them silently.","confirm":""},{"id":"wrong-branch","cause":"Pushing to a branch you did not intend.","fix":"Check git status -sb. The upstream may not be what you assume.","confirm":""}],"verify":["The push is accepted.","git log shows both sets of commits.","Nothing from the remote disappeared."],"escalate":["Output of git status -sb","The left-right log","Whether you rebased or merged"]},{"id":"git-cannot-pull-local-changes","tier":"guide","technology":"Git","category":"Working Tree","title":"Pull refuses because of local changes","summary":"Git will not overwrite uncommitted work. It is protecting you, not blocking you.","aliases":["your local changes would be overwritten","cannot pull","commit your changes or stash","please commit","pull blocked","unstaged changes pull"],"source":"https://git-scm.com/docs/git-stash","inputs":[],"steps":[{"title":"See exactly what is uncommitted","cmd":"git status --short && git diff --stat","risk":"safe","look":"Which files are modified. Git names the conflicting ones in the error, and those are the only ones that matter.","signals":[{"match":"^\\?\\?","means":"Untracked files. These only block if the incoming change adds the same path.","goto":"cause:untracked-collision"},{"match":"^ M|^M ","means":"Modified tracked files that the pull would overwrite.","goto":"cause:modified-tracked"}]},{"title":"Check whether the changes are worth keeping","cmd":"git diff","risk":"safe","look":"The actual content. Often this is debug output or a local config tweak you do not want anyway."},{"title":"Set the work aside and pull","cmd":"git stash push -m \"before pull\" && git pull","risk":"state","look":"The pull succeeds. Your changes are listed in git stash list.","note":"Moves your uncommitted changes onto the stash and restores a clean tree. The work is recoverable with git stash pop, but untracked files are not stashed by default and can still block the pull. Add -u if you need them included."},{"title":"Bring your work back on top","cmd":"git stash pop","risk":"state","look":"Your changes reappear. Resolve any conflicts as with a normal merge.","note":"Reapplies the stashed changes and removes the entry from the stash. If it conflicts with what you just pulled, the entry is kept rather than dropped, so nothing is lost. Use git stash apply instead if you want to keep the entry regardless."}],"causes":[{"id":"modified-tracked","cause":"Tracked files differ from the incoming version.","fix":"Stash, pull, pop. Or commit them on a branch if they are real work.","confirm":""},{"id":"untracked-collision","cause":"An untracked file has the same path as an incoming one.","fix":"Move or delete yours. Git will not silently overwrite it.","confirm":""},{"id":"not-worth-keeping","cause":"The changes are local noise.","fix":"git checkout -- <file> discards them. Confirm with git diff first; this cannot be undone.","confirm":""},{"id":"should-be-committed","cause":"The changes are real work.","fix":"Commit them on a branch, then pull. The stash is for short-lived interruptions, not storage.","confirm":""}],"verify":["The pull completes.","Your changes are back and intact.","The stash list is empty or intentionally populated."],"escalate":["Output of git status --short","The diff of the blocking files","Whether the work was stashed or discarded"]},{"id":"git-crlf-issues","tier":"guide","technology":"Git","category":"Working Tree","title":"Every file shows as modified with no real change","summary":"git diff reports whole-file changes you did not make. Line ending conversion.","aliases":["whole file changed","crlf","line endings","warning lf will be replaced","everything modified","diff shows every line"],"source":"https://git-scm.com/docs/gitattributes","inputs":[{"key":"file","label":"A file showing as changed","example":"scripts/deploy.sh"}],"steps":[{"title":"Confirm the change is only line endings","cmd":"git diff --stat && git diff --ignore-all-space --stat","risk":"safe","look":"If the second command shows nothing, the difference is purely whitespace and line endings. That is definitive.","signals":[{"match":"(?i)0 files changed|^\\s*$","means":"Only line endings differ. No real content changed.","goto":"cause:autocrlf"}]},{"title":"Check the current conversion setting","cmd":"git config --show-origin core.autocrlf","risk":"safe","look":"On Windows true converts to CRLF on checkout and back to LF on commit. A value of false or an inconsistent one across the team produces exactly this."},{"title":"Check what Git thinks each file should be","cmd":"git check-attr text eol -- {file}","risk":"safe","look":"What .gitattributes declares. Unspecified means Git guesses per machine, which is why it differs between teammates."},{"title":"Normalise the repository","cmd":"git add --renormalize .","risk":"state","look":"git status shows the normalised files staged. Commit them as a single dedicated change.","note":"Rewrites the index using the current .gitattributes rules, producing one large commit touching many files. Coordinate it with the team: anyone with in-flight branches will hit conflicts across every touched file. Commit it alone, with nothing else in the change."}],"causes":[{"id":"autocrlf","cause":"core.autocrlf differs between machines.","fix":"Stop relying on it. Commit a .gitattributes file so behaviour is defined by the repository, not by each laptop.","confirm":""},{"id":"no-gitattributes","cause":"No .gitattributes, so Git guesses.","fix":"Add one. At minimum * text=auto, with eol=lf pinned for shell scripts.","confirm":""},{"id":"script-broken","cause":"A shell script has CRLF and fails at runtime.","fix":"Pin *.sh text eol=lf. CRLF in a shebang produces exec format errors in containers.","confirm":""},{"id":"editor-converts","cause":"The editor saves with different endings.","fix":"Configure it to respect .gitattributes. VS Code does by default.","confirm":""}],"verify":["git status is clean after a fresh checkout.","Shell scripts run in containers.",".gitattributes is committed so it applies to everyone."],"escalate":["git diff with and without --ignore-all-space","The core.autocrlf value and its origin","Whether .gitattributes exists"]},{"id":"git-gitignore-not-working","tier":"guide","technology":"Git","category":"Working Tree","title":"gitignore is ignored for a file","summary":"You added a pattern but Git keeps tracking the file.","aliases":["gitignore not working","file still tracked","ignore not applied","still showing in status","gitignore ignored","cannot ignore file"],"source":"https://git-scm.com/docs/gitignore","inputs":[{"key":"file","label":"File","example":"config/local.env"}],"steps":[{"title":"Ask Git which rule applies","cmd":"git check-ignore -v {file}","risk":"safe","look":"The file and line of the matching rule. No output means no rule matches, which is a pattern problem rather than a caching one.","signals":[{"match":":\\d+:","means":"A rule does match. If the file is still tracked, the cache is the reason.","goto":"cause:already-tracked"},{"match":"^\\s*$","means":"No rule matches this path.","goto":"cause:pattern-wrong"}]},{"title":"Check whether the file is already tracked","cmd":"git ls-files --error-unmatch {file}","risk":"safe","look":"gitignore only affects untracked files. Once a file is tracked, no pattern will ever make Git stop following it."},{"title":"Check for a negation rule later in the file","cmd":"type .gitignore","risk":"safe","look":"Rules are applied in order and a later negation wins. Also note that a directory excluded by an earlier rule cannot have its contents re-included."},{"title":"Stop tracking it without deleting it","cmd":"git rm --cached {file}","risk":"state","look":"git status shows the deletion staged and the file no longer tracked. Commit, and it will then be ignored.","note":"Removes the file from Git's index while leaving it on disk. On the next pull, anyone else's checkout will have this file deleted from their working tree, so tell the team. If it holds secrets, removing it now does not remove it from history."}],"causes":[{"id":"already-tracked","cause":"The file is already tracked.","fix":"git rm --cached, then commit. gitignore has no effect on tracked files.","confirm":""},{"id":"pattern-wrong","cause":"No rule matches the path.","fix":"Check for a leading slash, which anchors to the repository root. Patterns are relative to the .gitignore file's own location.","confirm":""},{"id":"negation","cause":"A later rule re-includes it.","fix":"Rules apply in order. Reorder them.","confirm":""},{"id":"parent-excluded","cause":"A parent directory is excluded.","fix":"Git does not descend into excluded directories, so a negation inside one never applies. Unexclude the directory first.","confirm":""},{"id":"secrets-in-history","cause":"The file contains secrets and was committed.","fix":"Ignoring it
